// Auto-follow entry point: scroll so that world-y `targetY` sits at a
// comfortable position in the viewport (used both for "keep up with the
// pen while writing" and for "resume following after the 2s pause").
// Never touches camera.scale/camera.x — no zooming, ever.
//
// PAGE-THEN-FOLLOW MODEL: the camera does nothing at all while the pen is
// still somewhere on the first page (world-y <= PAGE_H) — the page just
// fills up in place, exactly like watching someone write on a static
// sheet of paper, with no scrolling motion to distract from that. Once
// the writing crosses onto the second page, auto-follow switches on and
// keeps `targetY` vertically CENTERED in the viewport from then on
// (rather than pinned near the bottom, which is what happens today) —
// that's what makes it read as "the camera follows the pen" rather than
// "the page grows to reveal more room below the pen".
function panCameraToCursor(targetY, onDone){
  if(isUserScrolling){ if(onDone) onDone(); return; }

  if(targetY <= PAGE_H){
    // Still on the first page: never move the camera. Let the page fill
    // up statically at camera.y 0 — no auto-follow yet.
    if(onDone) onDone();
    return;
  }

  // Past the first page: keep the pen vertically centered in the
  // viewport as it writes, rather than anchored near the bottom.
  const targetCameraY = Math.max(0, targetY - (viewH/2)/camera.scale);
  animateScrollTo(targetCameraY, 900, onDone);
}

let lastAutoFollowTargetY = TOP_MARGIN;

function resizeCanvas(){
  const rect = boardWrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  viewW = rect.width; viewH = rect.height;

  // Re-measure the actual on-screen top bar / bottom dock before doing
  // any camera math below — their heights change across the phone /
  // tablet / desktop breakpoints (and even within a breakpoint, e.g.
  // the bottom dock growing an extra row on a narrow phone), so this
  // has to happen on every resize/rotation, not just once at load.
  measureLayoutInsets();

  // Scale is fixed once here (fit-to-width, capped) and is never touched
  // again by panning, pinching, or auto-follow — per the "never
  // auto-zoom, preserve canvas scale" requirement. Horizontal anchor
  // (camera.x) is recalculated too, since it depends on viewW.
  if (viewW > 0) {
      camera.scale = Math.min(1.5, viewW / 1050);
      camera.x = idealCameraX(camera.scale);
  }

  applyCanvasHeight();
  clampScrollLimits(); // also redraws
  repositionQuizOverlay();
  repositionPointerOverlay();
}
window.addEventListener('resize', resizeCanvas);

// Sizes the canvas element (and its backing pixel buffer) to exactly the
// viewport — it never grows with content anymore, since the camera
// (camera.y) is what moves through the content now, not a native
// scrollbar over a tall element. Called on load and resize.
let lastAppliedCanvasWpx = 0, lastAppliedCanvasHpx = 0;
function applyCanvasHeight(){
  const dpr = window.devicePixelRatio || 1;
  const wPx = Math.round(viewW * dpr), hPx = Math.round(viewH * dpr);
  if (wPx === lastAppliedCanvasWpx && hPx === lastAppliedCanvasHpx) return;
  lastAppliedCanvasWpx = wPx; lastAppliedCanvasHpx = hPx;
  canvas.width = wPx;
  canvas.height = hPx;
  canvas.style.width = viewW + 'px';
  canvas.style.height = viewH + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}

// Mobile Safari (and other mobile browsers) can take noticeably longer than
// 350ms to finish reflowing the visual viewport after a rotation — the
// address bar/chrome animates in/out, and getBoundingClientRect() can keep
// reporting the pre-rotation size for a little while. A couple of fixed
// retries isn't always enough, so on top of those we also (a) listen to
// visualViewport's own resize event, which fires as the real viewport
// settles rather than on a guessed timer, and (b) poll briefly until the
// reported size actually stops changing before giving up.
function resizeCanvasWhenStable(maxWaitMs){
  const deadline = performance.now() + maxWaitMs;
  let lastW = -1, lastH = -1, stableFrames = 0;
  function tick(){
    const rect = canvas.getBoundingClientRect();
    if (Math.abs(rect.width-lastW) < 0.5 && Math.abs(rect.height-lastH) < 0.5) {
      stableFrames++;
    } else {
      stableFrames = 0;
      lastW = rect.width; lastH = rect.height;
    }
    resizeCanvas();
    if (stableFrames >= 3 || performance.now() > deadline) return;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

window.addEventListener('orientationchange', () => {
  resizeCanvasWhenStable(1000);
});
if (screen.orientation && screen.orientation.addEventListener) {
  screen.orientation.addEventListener('change', () => {
    resizeCanvasWhenStable(1000);
  });
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => resizeCanvasWhenStable(1000));
}

// The top bar and bottom dock aren't only resized by the viewport —
// the bottom dock in particular changes height on its own whenever a
// caption wraps onto more lines, an attach-chip appears above the Ask
// input, or the phone tier's control row wraps. None of that fires a
// window 'resize' event, so without this the canvas's idea of "how
// much space the controls occupy" would silently go stale mid-lesson
// even though the CSS layout itself is perfectly correct. A
// ResizeObserver on the two chrome containers catches every one of
// those content-driven size changes, not just viewport changes.
if ('ResizeObserver' in window) {
  let dockResizeQueued = false;
  const dockResizeObserver = new ResizeObserver(() => {
    if (dockResizeQueued) return;
    dockResizeQueued = true;
    requestAnimationFrame(() => { dockResizeQueued = false; resizeCanvas(); });
  });
  const topbarEl = document.querySelector('.topbar');
  const bottomDockEl = document.getElementById('bottom-dock');
  if (topbarEl) dockResizeObserver.observe(topbarEl);
  if (bottomDockEl) dockResizeObserver.observe(bottomDockEl);
}

// worldToScreen/screenToWorld convert between world coordinates and the
// canvas's own pixel space, which — since the canvas is exactly
// viewport-sized and camera.y now genuinely pans through the world — IS
// the visible viewport. Horizontal centering still uses the fixed
// camera.x anchor from resizeCanvas(), same as before; vertical
// position now subtracts camera.y, the real pan offset.
// PDF export needs to render successive vertical "pages" of world
// content into a fixed-size offscreen canvas independently of whatever
// the live camera is doing, so it still uses this separate explicit
// offset rather than touching camera.y. It's 0 during normal on-screen
// rendering and only non-zero while exportBoardAsPDF() is mid-render.
let exportYOffset = 0;
function worldToScreen(wx, wy){
  return [(wx - camera.x) * camera.scale + viewW/2, (wy - camera.y - exportYOffset) * camera.scale];
}
function screenToWorld(sx, sy){
  return [(sx - viewW/2) / camera.scale + camera.x, sy / camera.scale + camera.y];
}

// Convert a world-y into the current VIEWPORT-relative y — used by
// auto-follow/pan-targeting code, which cares about "where is this on
// screen right now". Since the canvas is the viewport now, this is
// exactly the y worldToScreen would produce (with exportYOffset excluded,
// as export never runs concurrently with live viewing).
function worldYToViewportY(wy){
  return (wy - camera.y) * camera.scale;
}

const INK = '#1E2B3A';
const OCHRE = '#D96B27';
const SAGE = '#2A8A5D';
const BRICK = '#C0392B';
const TEAL = '#008080';
const VIOLET = '#6C3483';
const SKY = '#2980B9';
const CORAL = '#E67E22';
const HALO = '#8FA6FF';
const HILITE = '#FCE896';
const COLORS = { chalk:INK, ink:INK, ochre:OCHRE, sage:SAGE, brick:BRICK, teal:TEAL, violet:VIOLET, sky:SKY, coral:CORAL, halo:HALO, highlight:HILITE };

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

let drawnCommands = [];

// Empty-board welcome (watermark + greeting). Shown only while nothing is on the
// board and nothing is queued or being drawn; hidden the moment the tutor starts writing.
// Wrapped in try/catch because this can run before later `let` declarations have executed.
function syncBoardWelcome(){
  try{
    const el = document.getElementById('board-welcome');
    if(!el) return;
    let u = null;
    try{ u = currentUser; } catch(e){}
    const name = u ? (u.given_name || (u.name ? String(u.name).split(' ')[0] : '') || (u.email ? String(u.email).split('@')[0] : '')) : '';
    const msg = name ? 'What are we getting into today, ' + name + '?' : 'What are we getting into today?';
    const t = document.getElementById('bw-text');
    if(t && t.textContent !== msg) t.textContent = msg;
    const empty = drawnCommands.length === 0 && drawQueue.length === 0 && !drawing;
    el.classList.toggle('hidden', !empty);
  } catch(e){}
}

// ---- Board frame -------------------------------------------------------
// On screen the AI writes inside a visible framed board, and the canvas around
// it is transparent so the classroom wall behind #board-wrap shows through.
// Everything the tutor draws is clipped to the inside of the frame. The PDF
// export draws to an offscreen ctx, so it keeps the plain full-page white.
const BOARD_FRAME_BORDER = 10, BOARD_FRAME_RADIUS = 16;
function boardFrameRect(){
  if(ctx !== liveCtx || viewW <= 0 || viewH <= 0) return null;
  const pageL = worldToScreen(0, 0)[0], pageR = worldToScreen(PAGE_W, 0)[0];
  const x = Math.max(8, pageL - 14);
  const right = Math.min(viewW - 8, pageR + 14);
  const y = 12;
  const bottom = Math.max(y + 140, viewH - PAGE_BOTTOM_GUTTER_PX + 6);   // ends just above the ask/controls dock
  return { x, y, w: Math.max(80, right - x), h: bottom - y };
}
function boardRoundRectPath(c, x, y, w, h, r){
  r = Math.max(0, Math.min(r, w/2, h/2));
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function drawBoardFrame(r){
  const b = BOARD_FRAME_BORDER;
  ctx.save();
  // outer aluminium frame with a soft drop shadow onto the wall
  ctx.shadowColor = 'rgba(0,0,0,0.30)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6;
  boardRoundRectPath(ctx, r.x, r.y, r.w, r.h, BOARD_FRAME_RADIUS);
  const g = ctx.createLinearGradient(0, r.y, 0, r.y + r.h);
  g.addColorStop(0, '#DDE2E7'); g.addColorStop(0.5, '#C4CBD3'); g.addColorStop(1, '#AEB6BF');
  ctx.fillStyle = g; ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1; ctx.stroke();
  // the writing surface
  boardRoundRectPath(ctx, r.x + b, r.y + b, r.w - 2*b, r.h - 2*b, BOARD_FRAME_RADIUS - 8);
  ctx.fillStyle = '#FFFFFF'; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}
// Restrict drawing to the writing surface. Returns true if a clip was pushed
// (the caller must ctx.restore() it).
function clipToBoard(){
  const r = boardFrameRect();
  if(!r) return false;
  const b = BOARD_FRAME_BORDER;
  ctx.save();
  boardRoundRectPath(ctx, r.x + b, r.y + b, r.w - 2*b, r.h - 2*b, BOARD_FRAME_RADIUS - 8);
  ctx.clip();
  return true;
}

function drawBG(){
  const r = boardFrameRect();
  if(!r){
    // Export / offscreen: plain white page.
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, viewW, viewH);
    return;
  }
  ctx.clearRect(0, 0, viewW, viewH);
  drawBoardFrame(r);
}

function clearBoard(record=true){
  if(record) drawnCommands = [];
  drawBG();
  syncBoardWelcome();
}

function redrawAll(){
  drawBG();
  const clipped = clipToBoard();
  drawnCommands.forEach(cmd => renderCommand(cmd));
  if(clipped) ctx.restore();
  repositionQuizOverlay();
  repositionPointerOverlay();
  syncBoardWelcome();
}

function redrawAllExcept(skipCmd){
  drawBG();
  const clipped = clipToBoard();
  drawnCommands.forEach(cmd => { if(cmd !== skipCmd) renderCommand(cmd); });
  if(clipped) ctx.restore();
}

function sw(n){ return n * camera.scale; }

function wrapTextToLines(text, maxWidthPx, customCtx){
  const words = (text||'').split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = '';
  const context = customCtx || ctx;
  words.forEach(w => {
    const test = cur ? cur + ' ' + w : w;
    if(cur && context.measureText(test).width > maxWidthPx){
      lines.push(cur);
      cur = w;
    } else {
      cur = test;
    }
  });
  if(cur) lines.push(cur);
  return lines.length ? lines : [''];
}

// A single underline stroke drawn beneath a finished line of heading text,
// with a touch of hand-drawn imperfection (a slight downward bow, like a
// pen underline) rather than a perfectly straight ruled line — so it reads
// as "the tutor underlined this" rather than a UI decoration.
function drawHeadingUnderline(sx, baselineY, widthPx, sizeWorld, color){
  if(widthPx <= 0) return;
  const y = baselineY + sw(sizeWorld*0.16);
  const bow = sw(sizeWorld*0.03);
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = sw(Math.max(1.5, sizeWorld*0.045));
  ctx.beginPath();
  ctx.moveTo(sx, y);
  ctx.quadraticCurveTo(sx + widthPx/2, y + bow, sx + widthPx, y);
  ctx.stroke();
  ctx.restore();
}

function commandScreenBBox(cmd){
  const PAD = 10;
  function pad(x0,y0,x1,y1){
    return [Math.min(x0,x1)-PAD, Math.min(y0,y1)-PAD, Math.max(x0,x1)+PAD, Math.max(y0,y1)+PAD];
  }
  switch(cmd.type){
    case 'text': {
      const fam = "'Kalam', 'Caveat', cursive";
      const weight = cmd.weight || 700;
      const size = (cmd.size||26)*HAND_SIZE_MULT;
      ctx.font = `${weight} ${sw(size)}px ${fam}`;
      const [sx,sy] = worldToScreen(cmd.x, cmd.y);
      if(cmd.maxWidth){
        const lines = wrapTextToLines(cmd.text||'', sw(cmd.maxWidth));
        const lineHeight = sw(lineHeightFor(size));
        const width = Math.max(0, ...lines.map(l=>ctx.measureText(l).width));
        return pad(sx, sy - sw(size)*1.05, sx + width, sy + lineHeight*(lines.length-1) + sw(size)*0.25);
      }
      const width = ctx.measureText(cmd.text||'').width;
      return pad(sx, sy - sw(size)*1.05, sx + width, sy + sw(size)*0.25);
    }
    case 'line': case 'arrow': {
      const [x1,y1] = worldToScreen(cmd.x1,cmd.y1); const [x2,y2] = worldToScreen(cmd.x2,cmd.y2);
      return pad(x1,y1,x2,y2);
    }
    case 'rect': case 'highlight': case 'highlight-marker': {
      const [x,y] = worldToScreen(cmd.x,cmd.y);
      return pad(x, y, x+sw(cmd.w), y+sw(cmd.h||(cmd.type==='rect'?0:40)));
    }
    case 'circle': {
      const [x,y] = worldToScreen(cmd.x,cmd.y);
      return pad(x-sw(cmd.rx), y-sw(cmd.ry), x+sw(cmd.rx), y+sw(cmd.ry));
    }
    case 'curve': {
      const pts = (cmd.points||[]).map(p=>worldToScreen(p[0],p[1]));
      if(!pts.length) return [0,0,0,0];
      const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
      return pad(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys));
    }
    case 'axes': case 'plot': {
      const [ox,oy] = worldToScreen(cmd.x,cmd.y);
      const w = sw(cmd.w), h = sw(cmd.h);
      return pad(ox, oy-h-sw(30), ox+w, oy+sw(20));
    }
    case 'halo': {
      const [x,y] = worldToScreen(cmd.x,cmd.y); const r = sw(cmd.r||60);
      return pad(x-r,y-r,x+r,y+r);
    }
    case 'path': {
      const pts = flattenScreenSegsToPoints(worldPathToScreenSegments(cmd.segments||[]));
      if(!pts.length) return [0,0,0,0];
      const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
      return pad(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys));
    }
    case 'polygon': case 'polyline': {
      const pts = (cmd.points||[]).map(p=>worldToScreen(p[0],p[1]));
      if(!pts.length) return [0,0,0,0];
      const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
      return pad(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys));
    }
    default: return [0,0,0,0];
  }
}

/* ---------- PATH primitive: lets the model compose arbitrary organic
   shapes (cell membranes, leaf outlines, animal silhouettes, etc.) out
   of move/line/quadratic/cubic segments in world space, same way an
   SVG <path> works. Segments: ["M",x,y] ["L",x,y] ["Q",cx,cy,x,y]
   ["C",c1x,c1y,c2x,c2y,x,y] ["Z"]. ---------- */
function worldPathToScreenSegments(segments){
  return (segments||[]).map(seg=>{
    if(!seg || !seg.length) return null;
    if(seg[0]==='Z' || seg[0]==='z') return ['Z'];
    const out = [seg[0]];
    for(let i=1;i<seg.length;i+=2){
      const [sx,sy] = worldToScreen(seg[i], seg[i+1]);
      out.push(sx, sy);
    }
    return out;
  }).filter(Boolean);
}

function drawPathSegments(pctx, screenSegs){
  pctx.beginPath();
  screenSegs.forEach(seg=>{
    const t = seg[0];
    if(t==='M') pctx.moveTo(seg[1],seg[2]);
    else if(t==='L') pctx.lineTo(seg[1],seg[2]);
    else if(t==='Q') pctx.quadraticCurveTo(seg[1],seg[2],seg[3],seg[4]);
    else if(t==='C') pctx.bezierCurveTo(seg[1],seg[2],seg[3],seg[4],seg[5],seg[6]);
    else if(t==='Z') pctx.closePath();
  });
}

function flattenScreenSegsToPoints(screenSegs){
  const pts = [];
  let cur = [0,0];
  screenSegs.forEach(seg=>{
    const t = seg[0];
    if(t==='M'){ cur=[seg[1],seg[2]]; pts.push(cur); }
    else if(t==='L'){ cur=[seg[1],seg[2]]; pts.push(cur); }
    else if(t==='Q'){
      const [x0,y0]=cur, cx=seg[1], cy=seg[2], x1=seg[3], y1=seg[4];
      for(let i=1;i<=10;i++){ const tt=i/10, mt=1-tt;
        pts.push([mt*mt*x0+2*mt*tt*cx+tt*tt*x1, mt*mt*y0+2*mt*tt*cy+tt*tt*y1]); }
      cur=[x1,y1];
    } else if(t==='C'){
      const [x0,y0]=cur, c1x=seg[1],c1y=seg[2],c2x=seg[3],c2y=seg[4],x1=seg[5],y1=seg[6];
      for(let i=1;i<=12;i++){ const tt=i/12, mt=1-tt;
        pts.push([mt*mt*mt*x0+3*mt*mt*tt*c1x+3*mt*tt*tt*c2x+tt*tt*tt*x1, mt*mt*mt*y0+3*mt*mt*tt*c1y+3*mt*tt*tt*c2y+tt*tt*tt*y1]); }
      cur=[x1,y1];
    }
    // 'Z' contributes no new point — it just closes back to the start
  });
  return pts;
}

function strokePolylinePartial(pts, t){
  if(!pts.length) return [0,0];
  if(pts.length===1) return pts[0];
  const segLens=[]; let total=0;
  for(let i=0;i<pts.length-1;i++){ const d=Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]); segLens.push(d); total+=d; }
  const target = total*t;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  let acc=0, penX=pts[0][0], penY=pts[0][1];
  for(let i=0;i<segLens.length;i++){
    const segLen = segLens[i];
    if(acc+segLen <= target){ ctx.lineTo(pts[i+1][0], pts[i+1][1]); acc+=segLen; penX=pts[i+1][0]; penY=pts[i+1][1]; }
    else{
      const frac = segLen>0 ? (target-acc)/segLen : 0;
      penX = pts[i][0]+(pts[i+1][0]-pts[i][0])*frac;
      penY = pts[i][1]+(pts[i+1][1]-pts[i][1])*frac;
      ctx.lineTo(penX,penY);
      break;
    }
  }
  ctx.stroke();
  return [penX,penY];
}

function renderCommand(cmd){
  const color = COLORS[cmd.color] || INK;
  ctx.strokeStyle = color; ctx.fillStyle = color;

  switch(cmd.type){
    case 'text': {
      const fam = "'Kalam', 'Caveat', cursive";
      const weight = cmd.weight || 700;
      let size = (cmd.size||26)*HAND_SIZE_MULT;
      ctx.font = `${weight} ${sw(size)}px ${fam}`;
      ctx.textBaseline = 'alphabetic';
      const [sx,sy] = worldToScreen(cmd.x, cmd.y);
      // SAFETY NET AGAINST TEXT SPILLING OUT OF A CELL/BOX: a diagramLabel
      // (a single line meant to sit inside a specific, already-measured
      // spot — a table cell, a part-label next to a shape) is never
      // word-wrapped, because wrapping it to multiple lines would break
      // the vertical centering the AI computed for that one line. Instead,
      // if it's still too wide for the box it was given (cmd.maxWidth —
      // the model is instructed to set this to the cell's inner width),
      // shrink the font just enough to fit, down to a hard floor so it
      // never becomes illegibly small. This is a backstop for whenever
      // the model's own column-width arithmetic comes out a little off —
      // the text still visually stays inside its cell instead of
      // overrunning the grid line next to it.
      if(cmd.diagramLabel && cmd.maxWidth){
        const minSize = Math.max(11, size*0.55);
        let measured = ctx.measureText(cmd.text||'').width;
        while(measured > sw(cmd.maxWidth) && size > minSize){
          size -= 1;
          ctx.font = `${weight} ${sw(size)}px ${fam}`;
          measured = ctx.measureText(cmd.text||'').width;
        }
      }
      if(cmd.maxWidth && !cmd.diagramLabel){
        const lines = wrapTextToLines(cmd.text||'', sw(cmd.maxWidth));
        const lineHeight = sw(lineHeightFor(size));
        lines.forEach((line,i) => {
          const ly = sy + i*lineHeight;
          ctx.fillText(line, sx, ly);
          if(cmd.heading) drawHeadingUnderline(sx, ly, ctx.measureText(line).width, size, color);
        });
      } else {
        ctx.fillText(cmd.text, sx, sy);
        if(cmd.heading) drawHeadingUnderline(sx, sy, ctx.measureText(cmd.text||'').width, size, color);
      }
      break;
    }
    case 'line': {
      ctx.lineWidth = sw(cmd.width || 2.5);
      if(cmd.dash) ctx.setLineDash([sw(7), sw(6)]);
      const [x1,y1] = worldToScreen(cmd.x1, cmd.y1); const [x2,y2] = worldToScreen(cmd.x2, cmd.y2);
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      if(cmd.dash) ctx.setLineDash([]);
      break;
    }
    case 'arrow': {
      ctx.lineWidth = sw(cmd.width || 2.5);
      if(cmd.dash) ctx.setLineDash([sw(7), sw(6)]);
      const [x1,y1] = worldToScreen(cmd.x1, cmd.y1); const [x2,y2] = worldToScreen(cmd.x2, cmd.y2);
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      if(cmd.dash) ctx.setLineDash([]);
      const angle = Math.atan2(y2-y1, x2-x1); const headLen = sw(cmd.headSize || 12);
      ctx.beginPath(); ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - headLen*Math.cos(angle - Math.PI/7), y2 - headLen*Math.sin(angle - Math.PI/7));
      ctx.lineTo(x2 - headLen*Math.cos(angle + Math.PI/7), y2 - headLen*Math.sin(angle + Math.PI/7));
      ctx.closePath(); ctx.fill();
      break;
    }
    case 'rect': {
      ctx.lineWidth = sw(cmd.width || 2.5);
      if(cmd.dash) ctx.setLineDash([sw(7), sw(6)]);
      const [x,y] = worldToScreen(cmd.x, cmd.y); const w = sw(cmd.w), h = sw(cmd.h);
      if(cmd.fill){ ctx.globalAlpha = 0.10; ctx.fillRect(x,y,w,h); ctx.globalAlpha = 1; }
      ctx.strokeRect(x,y,w,h);
      if(cmd.dash) ctx.setLineDash([]);
      break;
    }
    case 'circle': {
      ctx.lineWidth = sw(cmd.width || 2.5);
      if(cmd.dash) ctx.setLineDash([sw(7), sw(6)]);
      const [x,y] = worldToScreen(cmd.x, cmd.y);
      ctx.beginPath(); ctx.ellipse(x, y, sw(cmd.rx), sw(cmd.ry), 0, 0, Math.PI*2);
      if(cmd.fill){ ctx.globalAlpha = 0.10; ctx.fill(); ctx.globalAlpha = 1; }
      ctx.stroke();
      if(cmd.dash) ctx.setLineDash([]);
      break;
    }
    case 'curve': {
      ctx.lineWidth = sw(cmd.width || 2.5);
      if(cmd.dash) ctx.setLineDash([sw(7), sw(6)]);
      const pts = cmd.points.map(p => worldToScreen(p[0], p[1]));
      if(cmd.fill && pts.length>2){
        ctx.save();
        ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
        for(let i=1;i<pts.length-1;i++){
          const midX=(pts[i][0]+pts[i+1][0])/2, midY=(pts[i][1]+pts[i+1][1])/2;
          ctx.quadraticCurveTo(pts[i][0],pts[i][1],midX,midY);
        }
        const last = pts[pts.length-1]; ctx.lineTo(last[0],last[1]); ctx.closePath();
        ctx.globalAlpha = cmd.fillOpacity!=null ? cmd.fillOpacity : 0.12;
        ctx.fillStyle = COLORS[cmd.fillColor] || color;
        ctx.fill();
        ctx.restore();
      }
      strokeSmoothCurve(pts);
      if(cmd.dash) ctx.setLineDash([]);
      break;
    }
    case 'path': {
      ctx.lineWidth = sw(cmd.width || 2.5);
      if(cmd.dash) ctx.setLineDash([sw(7), sw(6)]);
      const screenSegs = worldPathToScreenSegments(cmd.segments||[]);
      drawPathSegments(ctx, screenSegs);
      if(cmd.fill){
        ctx.save();
        ctx.globalAlpha = cmd.fillOpacity!=null ? cmd.fillOpacity : 0.12;
        ctx.fillStyle = COLORS[cmd.fillColor] || color;
        ctx.fill();
        ctx.restore();
      }
      ctx.stroke();
      if(cmd.dash) ctx.setLineDash([]);
      break;
    }
    case 'polygon': case 'polyline': {
      ctx.lineWidth = sw(cmd.width || 2.5);
      if(cmd.dash) ctx.setLineDash([sw(7), sw(6)]);
      const pts = (cmd.points||[]).map(p => worldToScreen(p[0], p[1]));
      if(pts.length < 2) break;
      ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
      for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
      if(cmd.type === 'polygon'){
        ctx.closePath();
        if(cmd.fill){
          ctx.save();
          ctx.globalAlpha = cmd.fillOpacity!=null ? cmd.fillOpacity : 0.10;
          ctx.fillStyle = COLORS[cmd.fillColor] || color;
          ctx.fill();
          ctx.restore();
        }
      }
      ctx.stroke();
      if(cmd.dash) ctx.setLineDash([]);
      break;
    }
    case 'axes': {
      const [ox,oy] = worldToScreen(cmd.x, cmd.y); const w = sw(cmd.w), h = sw(cmd.h);
      drawAxesGrid(ox, oy, w, h, cmd);
      ctx.lineWidth = sw(2);
      ctx.strokeStyle = color; ctx.fillStyle = color;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox, oy - h); ctx.moveTo(ox, oy); ctx.lineTo(ox + w, oy); ctx.stroke();
      drawArrowhead(ox, oy - h, -Math.PI/2, color);
      drawArrowhead(ox + w, oy, 0, color);
      drawAxesTicksAndLabels(ox, oy, w, h, cmd, color);
      break;
    }
    case 'plot': {
      const [ox,oy] = worldToScreen(cmd.x, cmd.y); const w = sw(cmd.w), h = sw(cmd.h);
      drawAxesGrid(ox, oy, w, h, cmd);
      ctx.lineWidth = sw(2.5);
      ctx.strokeStyle = color; ctx.fillStyle = color;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox, oy - h); ctx.moveTo(ox, oy); ctx.lineTo(ox + w, oy); ctx.stroke();
      drawArrowhead(ox, oy - h, -Math.PI/2, color);
      drawArrowhead(ox + w, oy, 0, color);
      drawAxesTicksAndLabels(ox, oy, w, h, cmd, color);
      const [scaleX, scaleY] = plotScalers(ox, oy, w, h, cmd);
      // Defense-in-depth clip: the AI occasionally supplies curve points
      // whose data values fall outside the plot's own declared
      // xRange/yRange (a generation slip, not something this renderer
      // can prevent upstream) — without a clip, those points still get
      // linearly mapped by plotScalers and drawn exactly where the math
      // says, which is outside the box: the line visibly shoots past
      // the axes/arrowheads, as if the frame were the wrong size for
      // its own data. Clipping to the exact axes rectangle here means a
      // stray out-of-range point gets trimmed at the boundary instead
      // of blowing out of the figure, no matter what the source data says.
      ctx.save();
      ctx.beginPath();
      ctx.rect(ox, oy - h, w, h);
      ctx.clip();
      (cmd.curves || []).forEach(curve => {
        const pts = (curve.points || []).map(p => [scaleX(p[0]), scaleY(p[1])]);
        if(pts.length < 2) return;
        const curveColor = COLORS[curve.color] || color;
        ctx.save();
        if(curve.dash){
          // A guide-line curve (see GRAPH PRECISION STANDARD prompt rule):
          // the AI expresses dashed equilibrium drop-lines as an ordinary
          // curve inside the plot, in data coordinates, rather than a
          // separate "line" shape with hand-placed pixel coordinates —
          // that's what keeps them perfectly aligned to the plot with no
          // conversion math to get wrong. Render it as a plain dashed
          // stroke with no shadow/glow and no point-marker dots (added
          // below only for non-dashed curves) — a guide-line is a visual
          // aid, not a named data series, and dots at both ends of a drop
          // line would look like an extra pair of unexplained data points.
          ctx.setLineDash([sw(6), sw(5)]);
          ctx.strokeStyle = curveColor;
          ctx.lineWidth = sw(curve.width || 1.5);
          strokeSmoothCurve(pts);
          ctx.setLineDash([]);
        } else {
          ctx.shadowColor = hexToRgba(curveColor, 0.35);
          ctx.shadowBlur = sw(4);
          ctx.shadowOffsetY = sw(1.5);
          ctx.strokeStyle = curveColor;
          ctx.lineWidth = sw(curve.width || 3.25);
          strokeSmoothCurve(pts);
        }
        ctx.restore();
        if(!curve.dash){
          ctx.fillStyle = curveColor;
          // Point markers and the end-of-curve label are drawn OUTSIDE the
          // clip region below (see after ctx.restore()) — a marker sitting
          // exactly on the plot boundary looks fine clipped, but the label
          // text for a curve ending at the right edge (e.g. "Supply")
          // must stay fully readable rather than being sliced by the clip.
          pts.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], sw(2.75), 0, Math.PI*2); ctx.fill(); });
        }
      });
      ctx.restore();
      (cmd.curves || []).forEach(curve => {
        if(!curve.label || curve.dash) return; // dashed guide-lines never get an end label, even if one was set by mistake
        const pts = (curve.points || []).map(p => [scaleX(p[0]), scaleY(p[1])]);
        if(pts.length < 2) return;
        const curveColor = COLORS[curve.color] || color;
        ctx.fillStyle = curveColor;
        ctx.font = `700 ${sw(18)}px 'Caveat', cursive`;
        ctx.textAlign = 'left';
        // Clamp the label's anchor point to just inside the box too —
        // otherwise a curve whose last data point is outside xRange/yRange
        // (the same slip the clip above guards against) would still park
        // its label off in empty space alongside the now-invisible
        // clipped tail, exactly like the "Equilibrium" annotation
        // floating disconnected from the graph in the reported bug.
        const rawX = pts[pts.length-1][0], rawY = pts[pts.length-1][1];
        const lx = Math.min(Math.max(rawX, ox), ox+w);
        const ly = Math.min(Math.max(rawY, oy-h), oy);
        ctx.fillText(curve.label, lx+sw(8), ly+sw(4));
      });
      break;
    }
    case 'highlight': {
      ctx.globalAlpha = 0.18; ctx.fillStyle = color;
      const [x,y] = worldToScreen(cmd.x, cmd.y);
      ctx.fillRect(x, y, sw(cmd.w), sw(cmd.h || 26));
      ctx.globalAlpha = 1;
      break;
    }
    case 'halo': {
      const [x,y] = worldToScreen(cmd.x, cmd.y);
      const r = sw(cmd.r || 60);
      const glow = COLORS[cmd.color] || HALO;
      const grad = ctx.createRadialGradient(x,y,0,x,y,r);
      grad.addColorStop(0, hexToRgba(glow, 0.40));
      grad.addColorStop(1, hexToRgba(glow, 0));
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
      break;
    }
  }
}

function drawArrowhead(x, y, angle, color, size){
  const headLen = sw(size || 9);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(x, y);
  ctx.lineTo(x - headLen*Math.cos(angle - Math.PI/7), y - headLen*Math.sin(angle - Math.PI/7));
  ctx.lineTo(x - headLen*Math.cos(angle + Math.PI/7), y - headLen*Math.sin(angle + Math.PI/7));
  ctx.closePath(); ctx.fill();
}

function drawAxesGrid(ox, oy, w, h, cmd){
  if(cmd.grid === false) return;
  const n = cmd.gridLines || 5;
  ctx.save();
  ctx.strokeStyle = 'rgba(38,36,31,0.14)';
  ctx.lineWidth = 1;
  ctx.setLineDash([sw(3), sw(4)]);
  for(let i=1;i<=n;i++){
    const gx = ox + (w*i/n);
    ctx.beginPath(); ctx.moveTo(gx, oy); ctx.lineTo(gx, oy-h); ctx.stroke();
    const gy = oy - (h*i/n);
    ctx.beginPath(); ctx.moveTo(ox, gy); ctx.lineTo(ox+w, gy); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();
}

function drawAxesTicksAndLabels(ox, oy, w, h, cmd, color){
  ctx.save();
  ctx.font = `${sw(14)}px 'Caveat', cursive`;
  ctx.fillStyle = color;
  if(Array.isArray(cmd.xTicks)){
    const n = cmd.xTicks.length;
    cmd.xTicks.forEach((label, i) => {
      const tx = ox + w*(i+1)/(n+1);
      ctx.strokeStyle = color; ctx.lineWidth = sw(1.5);
      ctx.beginPath(); ctx.moveTo(tx, oy-sw(4)); ctx.lineTo(tx, oy+sw(4)); ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillText(String(label), tx, oy+sw(18));
    });
  }
  if(Array.isArray(cmd.yTicks)){
    const n = cmd.yTicks.length;
    cmd.yTicks.forEach((label, i) => {
      const ty = oy - h*(i+1)/(n+1);
      ctx.strokeStyle = color; ctx.lineWidth = sw(1.5);
      ctx.beginPath(); ctx.moveTo(ox-sw(4), ty); ctx.lineTo(ox+sw(4), ty); ctx.stroke();
      ctx.textAlign = 'right';
      ctx.fillText(String(label), ox-sw(8), ty+sw(4));
    });
  }
  ctx.textAlign = 'left';
  ctx.font = `${sw(16)}px 'Caveat', cursive`;
  if(cmd.xlabel){ ctx.textAlign = 'right'; ctx.fillText(cmd.xlabel, ox+w, oy+sw(30)); }
  if(cmd.ylabel){ ctx.save(); ctx.translate(ox-sw(28), oy-h); ctx.textAlign = 'left'; ctx.fillText(cmd.ylabel,0,0); ctx.restore(); }
  if(cmd.title){ ctx.textAlign = 'center'; ctx.font = `700 ${sw(20)}px 'Caveat', cursive`; ctx.fillText(cmd.title, ox+w/2, oy-h-sw(16)); }
  ctx.restore();
}

function strokeSmoothCurve(pts){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(let i=1;i<pts.length-1;i++){
    const midX = (pts[i][0]+pts[i+1][0])/2, midY = (pts[i][1]+pts[i+1][1])/2;
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], midX, midY);
  }
  const last = pts[pts.length-1];
  ctx.lineTo(last[0], last[1]);
  ctx.stroke();
}

function strokeSmoothCurvePartial(pts, t){
  const totalSegs = pts.length-1;
  const segFloat = t*totalSegs;
  const segIdx = Math.min(totalSegs-1, Math.floor(segFloat));
  const segT = segFloat-segIdx;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(let i=1;i<=segIdx;i++){
    const nextI = Math.min(i+1, pts.length-1);
    const midX = (pts[i][0]+pts[nextI][0])/2, midY = (pts[i][1]+pts[nextI][1])/2;
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], midX, midY);
  }
  let penX = pts[segIdx][0], penY = pts[segIdx][1];
  if(pts[segIdx+1]){
    penX = pts[segIdx][0]+(pts[segIdx+1][0]-pts[segIdx][0])*segT;
    penY = pts[segIdx][1]+(pts[segIdx+1][1]-pts[segIdx][1])*segT;
    ctx.lineTo(penX, penY);
  }
  ctx.stroke();
  return [penX, penY];
}

function plotScalers(ox, oy, w, h, cmd){
  const [xMin,xMax] = cmd.xRange || [0, 10];
  const [yMin,yMax] = cmd.yRange || [0, 10];
  const xSpan = (xMax-xMin) || 1, ySpan = (yMax-yMin) || 1;
  const scaleX = v => ox + ((v-xMin)/xSpan)*w;
  const scaleY = v => oy - ((v-yMin)/ySpan)*h;
  return [scaleX, scaleY];
}

/* ---------- MANUAL SCROLL (mouse-drag / touch / trackpad) ----------
   All custom pan-by-dragging and pinch-to-zoom gesture handling has been
   removed. #board-wrap is now a genuine native-scrolling container
   (overflow-y:auto; see CSS), so finger-drag, mouse-wheel, trackpad
   two-finger swipe, and scrollbar-drag all scroll it exactly like any
   other scrollable page, for free, via the browser's own scroll physics
   — no JS needed to reproduce that. The single 'scroll' listener
   registered above (noteManualScrollActivity, in the auto-follow section)
   is what detects this manual input and pauses/resumes auto-follow.
   Pinch-zoom is intentionally NOT implemented: per spec, zoom never
   changes automatically and canvas scale is preserved; there is no
   camera scale left to pinch. */

// Hover-to-replay has been removed: hovering over written content no
// longer triggers any redraw or animation.
// Manual panning (wheel, touch-drag, mouse-drag) is handled by the
// pointerdown/pointermove/wheel listeners on #board-wrap above, which
// move camera.y directly. Zoom-by-wheel/pinch is still not implemented —
// scale is fixed per "never automatically zoom, preserve canvas scale"
// (see resizeCanvas()).
// Reset-view and Clear-board buttons were removed from the toolbar
// (they were being covered by the account menu) — clearBoard() itself
// is still used internally (e.g. resetTutorBoardState on New session).

/* =========================================================
   EXPORT PDF
   ========================================================= */
function worldContentBounds(){
  const savedCam = { ...camera }, savedW = viewW, savedH = viewH, savedOffset = exportYOffset;
  camera.scale = 1; camera.x = viewW/2; camera.y = 0; exportYOffset = 0;
  let minX=0, minY=0, maxX=PAGE_W, maxY=1;
  drawnCommands.forEach(cmd=>{
    const [x0,y0,x1,y1] = commandScreenBBox(cmd);
    minX=Math.min(minX,x0); minY=Math.min(minY,y0);
    maxX=Math.max(maxX,x1); maxY=Math.max(maxY,y1);
  });
  Object.assign(camera, savedCam); viewW = savedW; viewH = savedH; exportYOffset = savedOffset;
  return { minX, minY, maxX, maxY };
}

async function exportBoardAsPDF(){
  if(!window.jspdf){ setStatus('pdf export unavailable — see console'); console.error('jsPDF did not load.'); return; }
  if(drawnCommands.length===0){ setStatus('nothing drawn yet'); return; }
  if(drawing || drawQueue.length){ setStatus('wait for current drawing to finish'); return; }

  setStatus('exporting pdf…');
  const savedCam = { ...camera }, savedW = viewW, savedH = viewH, savedCtx = ctx, savedOffset = exportYOffset;

  try{
    const { minX, minY, maxY } = worldContentBounds();
    const pageWorldW = PAGE_W;
    const pageWorldH = PAGE_H;
    const numPages = Math.max(1, Math.ceil((maxY - minY) / pageWorldH));
    const PX_PER_WORLD_UNIT = 1.6;
    const pxW = Math.round(pageWorldW * PX_PER_WORLD_UNIT);
    const pxH = Math.round(pageWorldH * PX_PER_WORLD_UNIT);

    const off = document.createElement('canvas');
    off.width = pxW; off.height = pxH;
    const offCtx = off.getContext('2d');
    offCtx.lineCap = 'round'; offCtx.lineJoin = 'round';

    const { jsPDF } = window.jspdf;
    let doc = null;

    for(let i=0; i<numPages; i++){
      ctx = offCtx;
      viewW = pxW; viewH = pxH;
      camera.scale = PX_PER_WORLD_UNIT;
      camera.x = minX + pageWorldW/2;
      camera.y = 0;
      exportYOffset = (minY + i*pageWorldH);

      drawBG();
      drawnCommands.forEach(cmd => renderCommand(cmd));

      const dataUrl = off.toDataURL('image/png');
      if(i===0){
        doc = new jsPDF({ unit:'pt', format:[pageWorldW, pageWorldH], orientation: pageWorldW>=pageWorldH?'landscape':'portrait' });
      } else {
        doc.addPage([pageWorldW, pageWorldH], pageWorldW>=pageWorldH?'landscape':'portrait');
      }
      doc.addImage(dataUrl, 'PNG', 0, 0, pageWorldW, pageWorldH);
    }

    const name = (currentSessionTitle || (pdfFileName ? pdfFileName.replace(/\.pdf$/i,'') : 'chalkline-lesson')).replace(/[^\w\-]+/g,'_');
    doc.save(`${name}.pdf`);
    setStatus(`saved ${numPages}-page pdf`);
  } catch(err){
    console.error('PDF export failed:', err);
    setStatus('pdf export failed — see console');
  } finally {
    ctx = savedCtx;
    Object.assign(camera, savedCam);
    viewW = savedW; viewH = savedH; exportYOffset = savedOffset;
    redrawAll();
  }
}
document.getElementById('btn-export-pdf').addEventListener('click', exportBoardAsPDF);

/* =========================================================
   LIVE PEN & DRAWING ANIMATION
   ========================================================= */
let drawQueue = [], drawing = false;
// Scales every command's animation duration so the total time spent
// drawing a turn's board content lines up with how long the speech for
// that same turn takes to say — set once per turn in runTeachingTurn().
let drawPaceScale = 1;

function drawPen(x, y, angle){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle + Math.PI/4);
  ctx.fillStyle = '#2A2A2A';
  const s = 14;
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(s*0.35,s*0.35); ctx.lineTo(s*1.7,s*1.7-s*0.5); ctx.lineTo(s*1.35,s*2.0-s*0.5);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#B8722E';
  ctx.beginPath(); ctx.arc(s*0.45,s*0.45,3.2,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ---------- DIAGRAM CLUSTERING ----------
   Shape commands (line/arrow/rect/circle/curve/path) plus any
   "text" command flagged diagramLabel:true are drawn by the model in
   its own small local coordinate box (see SYSTEM_PROMPT rules 4-6).
   Rather than trusting those raw coordinates as final page position
   (which is how diagrams used to end up overlapping stacked text),
   every consecutive run of such commands is treated as ONE cluster:
   we measure its combined local bounding box, then translate every
   command in it by a single (dx,dy) so the cluster sits at the
   current cursor position — exactly like a "plot" reserves its own
   vertical slot. This guarantees no diagram can overlap the
   paragraph text stacked above or below it. */
const DIAGRAM_SHAPE_TYPES = new Set(['line','arrow','rect','circle','curve','path','polygon','polyline']);

function isDiagramShapeCmd(c){
    return DIAGRAM_SHAPE_TYPES.has(c.type) || (c.type === 'text' && c.diagramLabel);
}

// Local (pre-translation) bounding box of a single diagram command, in
// the model's own raw coordinate units — no camera/world transform.
function diagramLocalBBox(c){
    switch(c.type){
        case 'line': case 'arrow':
            return [Math.min(c.x1,c.x2), Math.min(c.y1,c.y2), Math.max(c.x1,c.x2), Math.max(c.y1,c.y2)];
        case 'rect': {
            const h = c.h || 0;
            return [Math.min(c.x,c.x+c.w), Math.min(c.y,c.y+h), Math.max(c.x,c.x+c.w), Math.max(c.y,c.y+h)];
        }
        case 'highlight': {
            const h = c.h || 26;
            return [Math.min(c.x,c.x+c.w), Math.min(c.y,c.y+h), Math.max(c.x,c.x+c.w), Math.max(c.y,c.y+h)];
        }
        case 'circle':
            return [c.x-c.rx, c.y-c.ry, c.x+c.rx, c.y+c.ry];
        case 'curve': {
            const pts = c.points || [];
            if(!pts.length) return null;
            const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
            return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
        }
        case 'path': {
            const xs = [], ys = [];
            (c.segments || []).forEach(seg=>{
                if(!seg || !seg.length || seg[0]==='Z' || seg[0]==='z') return;
                for(let i=1;i<seg.length;i+=2){ xs.push(seg[i]); ys.push(seg[i+1]); }
            });
            if(!xs.length) return null;
            return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
        }
        case 'polygon': case 'polyline': {
            const pts = c.points || [];
            if(!pts.length) return null;
            const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
            return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
        }
        case 'halo': {
            const r = c.r || 60;
            return [c.x-r, c.y-r, c.x+r, c.y+r];
        }
        case 'text': { // diagramLabel — rough estimate is fine, it's a small word
            const size = c.size || 20;
            const approxW = (c.text||'').length * size * 0.55;
            return [c.x, c.y - size, c.x + approxW, c.y + size*0.3];
        }
        default: return null;
    }
}

// Shift a diagram command's raw coordinates by (dx,dy). Widths/radii are
// untouched — only positions move.
function translateDiagramCmd(c, dx, dy){
    switch(c.type){
        case 'line': case 'arrow':
            c.x1+=dx; c.y1+=dy; c.x2+=dx; c.y2+=dy; break;
        case 'rect': case 'highlight': case 'circle': case 'halo': case 'text':
            c.x+=dx; c.y+=dy; break;
        case 'curve':
            c.points = (c.points||[]).map(p=>[p[0]+dx, p[1]+dy]); break;
        case 'polygon': case 'polyline':
            c.points = (c.points||[]).map(p=>[p[0]+dx, p[1]+dy]); break;
        case 'path':
            c.segments = (c.segments||[]).map(seg=>{
                if(!seg || !seg.length || seg[0]==='Z' || seg[0]==='z') return seg;
                const out = [seg[0]];
                for(let i=1;i<seg.length;i+=2){ out.push(seg[i]+dx, seg[i+1]+dy); }
                return out;
            });
            break;
    }
    return c;
}

const DIAGRAM_MARGIN_TOP = RULE_LINE_SPACING;
const DIAGRAM_MARGIN_BOTTOM = RULE_LINE_SPACING*2;
const DIAGRAM_LEFT = 160;
// Extra slack added to a diagram cluster's measured bounding box before
// reserving space for it — line widths, arrowheads, and the rough
// diagramLabel text-width estimate all extend a little past the raw
// coordinates used to measure the box, so this keeps a real gap between
// a diagram and the text immediately above/below it.
const DIAGRAM_BBOX_PAD = 18;

function enqueueCommandsAtCursor(commands){
    // The AI is actively writing a new batch of content — this is the
    // one and only place auto-follow re-engages after a manual pan.
    // There's no timer: the camera stays wherever the user left it,
    // for as long as they like, until the tutor actually writes again.
    isUserScrolling = false;

    let placedAll = [];
    const testCanvas = document.createElement('canvas');
    const tCtx = testCanvas.getContext('2d');

    // Commands are trusted to arrive in reading order (the model is
    // instructed to emit each diagram as one unbroken run) — no longer
    // re-sorted by raw y, since a diagram's local coordinates aren't a
    // page position and sorting by them would scramble reading order.
    let pendingDiagram = [];

    // A shape type substantial enough to actually be labeled/pointed at.
    // "arrow"/"line" are deliberately excluded — an arrow only means
    // something when it's pointing at one of these, so a cluster made up
    // solely of arrows/lines/diagramLabels (no real shape) is exactly the
    // "floating arrow pointing at nothing" failure — most often produced
    // by the Groq fallback reaching for a pointer-callout on plain text
    // instead of an actual diagram. Drop those clusters rather than draw
    // disconnected arrows with no shape underneath them.
    const SUBSTANTIVE_SHAPE_TYPES = new Set(['rect','circle','curve','path','polygon','polyline','plot','axes']);
    function hasSubstantiveShape(cluster){
        return cluster.some(c => SUBSTANTIVE_SHAPE_TYPES.has(c.type));
    }

    function flushDiagram(){
        if(!pendingDiagram.length) return;
        if(!hasSubstantiveShape(pendingDiagram)){
            console.warn('Dropped an orphaned arrow/label cluster with no real shape to attach to:', pendingDiagram);
            pendingDiagram = [];
            return;
        }
        let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
        pendingDiagram.forEach(c=>{
            const bb = diagramLocalBBox(c);
            if(!bb) return;
            minX = Math.min(minX, bb[0]); minY = Math.min(minY, bb[1]);
            maxX = Math.max(maxX, bb[2]); maxY = Math.max(maxY, bb[3]);
        });
        if(minX === Infinity){ pendingDiagram = []; return; } // nothing measurable
        minY -= DIAGRAM_BBOX_PAD; maxY += DIAGRAM_BBOX_PAD;

        globalCursorY += DIAGRAM_MARGIN_TOP;
        const dx = DIAGRAM_LEFT - minX;
        const dy = globalCursorY - minY;
        pendingDiagram.forEach(c=>{ translateDiagramCmd(c, dx, dy); placedAll.push(c); });
        // Reserve exactly the cluster's own height plus a bottom margin —
        // same pattern as the "plot" case below — so whatever text comes
        // next starts safely below the lowest shape in the diagram.
        globalCursorY += (maxY - minY) + DIAGRAM_MARGIN_BOTTOM;
        pendingDiagram = [];
    }

    commands.forEach(cmd => {
        let c = { ...cmd };

        if (c.type === 'halo' || c.type === 'highlight') {
            // Preserve the old "glow/underline the word I just wrote"
            // behavior when it directly follows plain paragraph text and
            // isn't part of an in-progress diagram cluster.
            if (!pendingDiagram.length && placedAll.length) {
                const prev = placedAll[placedAll.length-1];
                if (prev.type === 'text' && !prev.diagramLabel) {
                    c.x = prev.x + 40; c.y = prev.y - 10;
                    placedAll.unshift(c);
                    return;
                }
            }
            pendingDiagram.push(c);
            return;
        }

        if (isDiagramShapeCmd(c)) {
            pendingDiagram.push(c);
            return;
        }

        // Any non-diagram command ends whatever cluster was building and
        // reserves its space before this command claims the cursor.
        flushDiagram();

        if (c.type === 'text') {
            c.x = 80; // Sit close to the left margin line
            c.maxWidth = 930; // Use nearly the full line width before wrapping
            const size = (c.size || 26) * HAND_SIZE_MULT;
            const fam = "'Kalam', 'Caveat', cursive";
            tCtx.font = `${c.weight || 700} ${size}px ${fam}`;
            
            const words = (c.text || '').split(/\s+/).filter(Boolean);
            let lines = 1; let cur = '';
            words.forEach(w => {
                const test = cur ? cur + ' ' + w : w;
                if(tCtx.measureText(test).width > c.maxWidth){ lines++; cur = w; }
                else { cur = test; }
            });
            
            const lh = lineHeightFor(size);
            // A heading skips one blank ruled line before it starts, so it
            // reads as a new section rather than butting straight up
            // against whatever came before — but only if something is
            // already on the board above it (no pointless gap at the very
            // top of a fresh page).
            if(c.heading && globalCursorY > TOP_MARGIN) globalCursorY += RULE_LINE_SPACING;
            // Baseline sits exactly ON the rule line at the bottom of this
            // first allotted line-space (not floating near the top of it),
            // so the handwriting visually rests on the ruled paper the way
            // real handwriting does — ascenders reach up into the block,
            // descenders dip slightly below the line, just like ink on
            // actual notebook paper.
            c.y = globalCursorY + lh;
            placedAll.push(c);
            // Advance by exactly the block's own height — no extra blank
            // gap tacked on — so consecutive notes stack tight against each
            // other like continuous handwriting, while every line (of this
            // block and the next) still lands on a whole rule-line boundary
            // because `lh` is always a whole multiple of RULE_LINE_SPACING.
            globalCursorY += lines * lh;

        } else if (c.type === 'plot' || c.type === 'axes') {
            c.x = 160;
            c.w = 640;
            c.h = 400; // a whole multiple of RULE_LINE_SPACING, like every
                       // other vertical measurement here — see note below
            
            globalCursorY += RULE_LINE_SPACING; // Title margin
            c.y = globalCursorY + c.h; // Origin is bottom-left
            placedAll.push(c);
            // X-axis label margin. MUST be a whole multiple of
            // RULE_LINE_SPACING like every other vertical measurement in
            // this function — otherwise globalCursorY drifts off the rule
            // grid after the first graph, and every line of handwriting
            // placed after it stops resting on the ruled lines (it'll
            // visually "float" between them instead of sitting on one).
            globalCursorY = c.y + RULE_LINE_SPACING*2;
        }
    });

    flushDiagram();

    // Leave enough room below the pen for the bottom dock (avatar/
    // caption/controls) to not cover the line that was just written —
    // converted from the dock's real measured pixel height into world
    // units at the current zoom, rather than a fixed guess, so it stays
    // correct across every device tier and even across a phone rotating
    // between its 1-row and 2-row bottom-bar layouts.
    const bottomClearanceWorld = Math.max(220, PAGE_BOTTOM_GUTTER_PX / camera.scale);
    let panTargetY = globalCursorY - bottomClearanceWorld;
    if (panTargetY < TOP_MARGIN) panTargetY = TOP_MARGIN;
    lastAutoFollowTargetY = panTargetY;

    redrawAll();

    panCameraToCursor(panTargetY, () => enqueueCommands(placedAll));
}

function enqueueCommands(commands){
  drawQueue.push(...commands);
  syncBoardWelcome();   // the tutor is about to write — fade the welcome out
  if(!drawing) processQueue();
}

function commandWorldAnchor(cmd){
  if(cmd.type === 'plot' || cmd.type === 'axes') {
      // The BOTTOM of the box, not the vertical center: a plot/axes can
      // be tall enough to span most of the viewport, and centering the
      // one-time pre-draw scroll check on its middle means the top of a
      // freshly-scrolled-to plot (its title, its highest curve points)
      // can still start out cut off above the visible area, with nothing
      // to correct it until the NEXT command fires its own anchor check —
      // which for a plot is often a diagram-cluster label sitting well
      // below the whole plot, producing the big sudden jump this anchor
      // choice is meant to prevent. Anchoring at the bottom instead means
      // a single pre-draw scroll already reveals the whole box.
      return [cmd.x + (cmd.w||0)/2, cmd.y];
  }
  if('x' in cmd && 'y' in cmd) return [cmd.x, cmd.y];
  if('x1' in cmd && 'y1' in cmd) return [(cmd.x1+cmd.x2)/2, (cmd.y1+cmd.y2)/2];
  if(Array.isArray(cmd.points) && cmd.points.length) return cmd.points[Math.floor(cmd.points.length/2)];
  return null;
}

// Runs the same "is the thing we're drawing still comfortably on screen"
// check used before a command starts, but from WITHIN a long-running
// command's own animation loop — a multi-curve "plot"/"axes" or a
// many-segment "path"/"polygon" can take several seconds to draw as one
// single queued command (see baseDurationFor), so without this, the one
// pre-draw check in processQueue() is the ONLY scroll correction that
// command ever gets: if its bottom anchor was on-screen at the start but
// the plot is tall enough that its top is still off-screen, or if the
// user's viewport changed size mid-draw, nothing corrects it until the
// NEXT queued command fires — which for a diagram is often a label placed
// well past the whole cluster, producing one big disorienting jump right
// after the diagram finishes instead of the smooth, continuous following
// that plain text gets letter by letter. Throttled the same way as the
// per-command check (lastMidDrawPanAt), so this and that check share one
// cooldown rather than compounding into extra corrective scrolls.
function maybeCorrectScrollMidAnimation(anchor){
  if(!anchor || isUserScrolling) return;
  const sy = worldYToViewportY(anchor[1]);
  const marginTop = PAGE_TOP_GUTTER_PX + 20;
  const marginBottom = PAGE_BOTTOM_GUTTER_PX;
  const now = performance.now();
  if((sy < marginTop || sy > viewH-marginBottom) && (now - lastMidDrawPanAt > 320)){
    lastMidDrawPanAt = now;
    lastAutoFollowTargetY = anchor[1];
    panCameraToCursor(anchor[1], null);
  }
}

let lastMidDrawPanAt = 0;
function processQueue(){
  if(drawQueue.length===0){
    drawing=false; redrawAll();
    // The turn-end autosave in runTeachingTurn() fires the instant new
    // commands are queued — before the pen has actually finished writing
    // them (drawing is paced to match narration length, see drawPaceScale).
    // That save can lock in a `drawnCommands` snapshot that's several
    // topics behind an already-advanced `globalCursorY`, and nothing
    // used to correct it once the queue caught up — so a refresh could
    // reload the board scrolled/labeled as "caught up" while actually
    // missing everything drawn after that early save. Saving again here,
    // once the queue is truly empty, re-syncs the persisted state to
    // what's actually on the board.
    autoSaveSession();
    return;
  }
  drawing=true;
  const cmd = drawQueue.shift();
  const anchor = commandWorldAnchor(cmd);
  maybeCorrectScrollMidAnimation(anchor);
  animateCommand(cmd, ()=>{ drawnCommands.push(cmd); processQueue(); });
}

function animateCommand(cmd, onDone){
  const duration = estimateDuration(cmd);
  const start = performance.now();
  const anchor = commandWorldAnchor(cmd);
  function frame(now){
    const t = Math.min(1,(now-start)/duration);
    redrawAll();
    const clipped = clipToBoard();
    renderPartialCommand(cmd, t);
    if(clipped) ctx.restore();
    // For anything that takes a while to draw (a multi-curve plot, a
    // many-segment path), keep checking scroll position throughout the
    // animation, not just once before it started — see
    // maybeCorrectScrollMidAnimation for why the one-time pre-draw check
    // alone isn't enough for a command this size.
    maybeCorrectScrollMidAnimation(anchor);
    if(t<1) requestAnimationFrame(frame); else onDone();
  }
  requestAnimationFrame(frame);
}

function baseDurationFor(cmd){
  switch(cmd.type){
    case 'text': return Math.min(2200, Math.max(500,(cmd.text||'').length*50));
    case 'line': case 'arrow': return 380;
    case 'curve': return 700;
    case 'rect': return 550;
    case 'circle': return 550;
    case 'axes': return 550;
    case 'plot': return 600 + ((cmd.curves||[]).length)*550;
    case 'highlight': return 250;
    case 'halo': return 450;
    case 'path': return Math.min(2600, Math.max(600, (cmd.segments||[]).length*220));
    case 'polygon': case 'polyline': return Math.min(2200, Math.max(450, (cmd.points||[]).length*180));
    default: return 300;
  }
}

function estimateDuration(cmd){
  return baseDurationFor(cmd) * drawPaceScale;
}

// Rough estimate of how long speechSynthesis will take to say `text`,
// matching the rate/voice settings used in speak() below.
function estimateSpeechDurationMs(text){
  const words = (text||'').trim().split(/\s+/).filter(Boolean).length;
  if(!words) return 0;
  const wordsPerMinute = 150 * 0.96; // matches utter.rate in speak()
  const sentencePauses = ((text||'').match(/[.!?]/g) || []).length * 180;
  return (words / wordsPerMinute) * 60000 + sentencePauses;
}

function renderPartialCommand(cmd, t){
  const color = COLORS[cmd.color] || INK;
  ctx.strokeStyle = color; ctx.fillStyle = color;
  switch(cmd.type){
    case 'text': {
      const full = cmd.text || '';
      const fam = "'Kalam', 'Caveat', cursive";
      const weight = cmd.weight || 700;
      let size = (cmd.size||26)*HAND_SIZE_MULT;
      ctx.font = `${weight} ${sw(size)}px ${fam}`;
      const [sx,sy] = worldToScreen(cmd.x, cmd.y);
      // Same shrink-to-fit backstop as the static renderer (renderCommand)
      // — applied here too so a diagramLabel never visibly overruns its
      // cell/box even mid-animation, not just once fully drawn.
      if(cmd.diagramLabel && cmd.maxWidth){
        const minSize = Math.max(11, size*0.55);
        let measured = ctx.measureText(full).width;
        while(measured > sw(cmd.maxWidth) && size > minSize){
          size -= 1;
          ctx.font = `${weight} ${sw(size)}px ${fam}`;
          measured = ctx.measureText(full).width;
        }
      }
      if(cmd.maxWidth && !cmd.diagramLabel){
        const lines = wrapTextToLines(full, sw(cmd.maxWidth));
        const lineHeight = sw(lineHeightFor(size));
        let charsLeft = Math.max(1, Math.round(full.length*t));
        let lastX = sx, lastY = sy;
        for(let i=0;i<lines.length;i++){
          const line = lines[i];
          const take = Math.max(0, Math.min(line.length, charsLeft));
          const partial = line.slice(0, take);
          const ly = sy + i*lineHeight;
          ctx.fillText(partial, sx, ly);
          // Only underline a heading line once it's fully written — the
          // underline stroke happens after the words, like a real tutor
          // finishing a heading and then drawing a line under it.
          if(cmd.heading && take >= line.length) drawHeadingUnderline(sx, ly, ctx.measureText(line).width, size, color);
          lastX = sx + ctx.measureText(partial).width;
          lastY = ly;
          charsLeft -= take + 1;
          if(charsLeft <= 0) break;
        }
        drawPen(lastX, lastY, -Math.PI/2);
      } else {
        const nChars = Math.max(1, Math.round(full.length*t));
        const partial = full.slice(0,nChars);
        ctx.fillText(partial, sx, sy);
        const w = ctx.measureText(partial).width;
        if(cmd.heading && nChars >= full.length) drawHeadingUnderline(sx, sy, w, size, color);
        drawPen(sx+w, sy, -Math.PI/2);
      }
      break;
    }
    case 'line': case 'arrow': {
      ctx.lineWidth = sw(cmd.width||2.5);
      const [x1,y1]=worldToScreen(cmd.x1,cmd.y1); const [x2,y2]=worldToScreen(cmd.x2,cmd.y2);
      const cx=x1+(x2-x1)*t, cy=y1+(y2-y1)*t;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(cx,cy); ctx.stroke();
      if(cmd.type==='arrow' && t>=0.98){
        const angle=Math.atan2(y2-y1,x2-x1); const headLen=sw(cmd.headSize||12);
        ctx.beginPath(); ctx.moveTo(x2,y2);
        ctx.lineTo(x2-headLen*Math.cos(angle-Math.PI/7), y2-headLen*Math.sin(angle-Math.PI/7));
        ctx.lineTo(x2-headLen*Math.cos(angle+Math.PI/7), y2-headLen*Math.sin(angle+Math.PI/7));
        ctx.closePath(); ctx.fill();
      }
      drawPen(cx,cy,Math.atan2(y2-y1,x2-x1));
      break;
    }
    case 'curve': {
      ctx.lineWidth = sw(cmd.width||2.5);
      const pts = cmd.points.map(p=>worldToScreen(p[0],p[1]));
      if(cmd.fill && t>=0.999 && pts.length>2){
        ctx.save();
        ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
        for(let i=1;i<pts.length-1;i++){
          const midX=(pts[i][0]+pts[i+1][0])/2, midY=(pts[i][1]+pts[i+1][1])/2;
          ctx.quadraticCurveTo(pts[i][0],pts[i][1],midX,midY);
        }
        const last = pts[pts.length-1]; ctx.lineTo(last[0],last[1]); ctx.closePath();
        ctx.globalAlpha = cmd.fillOpacity!=null ? cmd.fillOpacity : 0.12;
        ctx.fillStyle = COLORS[cmd.fillColor] || color;
        ctx.fill();
        ctx.restore();
      }
      const [penX,penY] = strokeSmoothCurvePartial(pts, t);
      drawPen(penX,penY,0);
      break;
    }
    case 'path': {
      ctx.lineWidth = sw(cmd.width||2.5);
      const screenSegs = worldPathToScreenSegments(cmd.segments||[]);
      const pts = flattenScreenSegsToPoints(screenSegs);
      if(cmd.fill && t>=0.999){
        drawPathSegments(ctx, screenSegs);
        ctx.save();
        ctx.globalAlpha = cmd.fillOpacity!=null ? cmd.fillOpacity : 0.12;
        ctx.fillStyle = COLORS[cmd.fillColor] || color;
        ctx.fill();
        ctx.restore();
      }
      const [penX,penY] = strokePolylinePartial(pts, t);
      drawPen(penX,penY,0);
      break;
    }
    case 'polygon': case 'polyline': {
      ctx.lineWidth = sw(cmd.width||2.5);
      if(cmd.dash) ctx.setLineDash([sw(7), sw(6)]);
      const rawPts = (cmd.points||[]).map(p=>worldToScreen(p[0],p[1]));
      // For a polygon, trace the closing edge back to the start as part
      // of the same progressive stroke, so it finishes as a closed shape.
      const pts = (cmd.type === 'polygon' && rawPts.length>1) ? [...rawPts, rawPts[0]] : rawPts;
      if(cmd.type === 'polygon' && cmd.fill && t>=0.999 && rawPts.length>2){
        ctx.save();
        ctx.beginPath(); ctx.moveTo(rawPts[0][0], rawPts[0][1]);
        for(let i=1;i<rawPts.length;i++) ctx.lineTo(rawPts[i][0], rawPts[i][1]);
        ctx.closePath();
        ctx.globalAlpha = cmd.fillOpacity!=null ? cmd.fillOpacity : 0.10;
        ctx.fillStyle = COLORS[cmd.fillColor] || color;
        ctx.fill();
        ctx.restore();
      }
      const [penX,penY] = strokePolylinePartial(pts, t);
      drawPen(penX,penY,0);
      if(cmd.dash) ctx.setLineDash([]);
      break;
    }
    case 'rect': {
      ctx.lineWidth = sw(cmd.width||2.5);
      const [x,y]=worldToScreen(cmd.x,cmd.y); const w=sw(cmd.w), h=sw(cmd.h);
      const perim=2*(w+h), drawn=perim*t;
      ctx.beginPath(); let remaining=drawn, px=x, py=y; ctx.moveTo(px,py);
      const segs=[[w,0],[0,h],[-w,0],[0,-h]];
      for(const [dx,dy] of segs){
        const len=Math.hypot(dx,dy), use=Math.min(len,remaining), frac=use/len;
        px+=dx*frac; py+=dy*frac; ctx.lineTo(px,py); remaining-=use;
        if(remaining<=0) break;
      }
      ctx.stroke(); drawPen(px,py,0);
      break;
    }
    case 'circle': {
      ctx.lineWidth = sw(cmd.width||2.5);
      const [x,y]=worldToScreen(cmd.x,cmd.y); const rx=sw(cmd.rx), ry=sw(cmd.ry);
      ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,-Math.PI/2,-Math.PI/2+t*Math.PI*2); ctx.stroke();
      const ang=-Math.PI/2+t*Math.PI*2;
      drawPen(x+rx*Math.cos(ang), y+ry*Math.sin(ang), ang+Math.PI/2);
      break;
    }
    case 'axes': {
      const [ox,oy]=worldToScreen(cmd.x,cmd.y); const w=sw(cmd.w), h=sw(cmd.h);
      if(t>=0.99) drawAxesGrid(ox, oy, w, h, cmd);
      ctx.lineWidth = sw(2);
      const total=w+h, drawn=total*t;
      ctx.beginPath(); ctx.moveTo(ox,oy);
      const yLen=Math.min(h,drawn); ctx.lineTo(ox,oy-yLen);
      let penX=ox, penY=oy-yLen;
      if(drawn>h){ ctx.moveTo(ox,oy); const xLen=Math.min(w,drawn-h); ctx.lineTo(ox+xLen,oy); penX=ox+xLen; penY=oy; }
      ctx.stroke();
      if(t>=0.99){
        drawArrowhead(ox, oy-h, -Math.PI/2, color);
        drawArrowhead(ox+w, oy, 0, color);
        drawAxesTicksAndLabels(ox, oy, w, h, cmd, color);
      }
      drawPen(penX,penY,0);
      break;
    }
    case 'plot': {
      const [ox,oy]=worldToScreen(cmd.x,cmd.y); const w=sw(cmd.w), h=sw(cmd.h);
      const curves = cmd.curves || [];
      const axesFrac = curves.length ? 0.3 : 1;
      const axesT = Math.min(1, t/axesFrac);
      if(axesT>=0.99) drawAxesGrid(ox, oy, w, h, cmd);
      ctx.lineWidth = sw(2); ctx.strokeStyle = color; ctx.fillStyle = color;
      const axTotal=w+h, axDrawn=axTotal*axesT;
      ctx.beginPath(); ctx.moveTo(ox,oy);
      const yLen=Math.min(h,axDrawn); ctx.lineTo(ox,oy-yLen);
      let penX=ox, penY=oy-yLen;
      if(axDrawn>h){ ctx.moveTo(ox,oy); const xLen=Math.min(w,axDrawn-h); ctx.lineTo(ox+xLen,oy); penX=ox+xLen; penY=oy; }
      ctx.stroke();
      if(axesT>=0.99){
        drawArrowhead(ox, oy-h, -Math.PI/2, color);
        drawArrowhead(ox+w, oy, 0, color);
        drawAxesTicksAndLabels(ox, oy, w, h, cmd, color);
      }
      if(curves.length){
        const [scaleX, scaleY] = plotScalers(ox, oy, w, h, cmd);
        const perCurve = (1-axesFrac)/curves.length;
        curves.forEach((curve, i) => {
          const curveT = Math.max(0, Math.min(1, (t-axesFrac-i*perCurve)/perCurve));
          if(curveT<=0) return;
          const pts = (curve.points||[]).map(p=>[scaleX(p[0]), scaleY(p[1])]);
          if(pts.length<2) return;
          ctx.strokeStyle = COLORS[curve.color] || color;
          ctx.lineWidth = sw(curve.width||2.75);
          const [cx,cy] = strokeSmoothCurvePartial(pts, curveT);
          if(curveT>=1){
            if(curve.label){
              ctx.fillStyle = COLORS[curve.color] || color;
              ctx.font = `${sw(16)}px 'Caveat', cursive`;
              ctx.textAlign = 'left';
              ctx.fillText(curve.label, cx+sw(8), cy+sw(4));
            }
          } else { penX=cx; penY=cy; }
        });
      }
      drawPen(penX,penY,0);
      break;
    }
    case 'highlight': {
      ctx.globalAlpha = 0.18*t;
      const [x,y]=worldToScreen(cmd.x,cmd.y);
      ctx.fillRect(x,y,sw(cmd.w)*t, sw(cmd.h||26));
      ctx.globalAlpha=1;
      break;
    }
    case 'halo': {
      const [x,y] = worldToScreen(cmd.x, cmd.y);
      const r = sw(cmd.r || 60);
      const glow = COLORS[cmd.color] || HALO;
      const grad = ctx.createRadialGradient(x,y,0,x,y,r);
      grad.addColorStop(0, hexToRgba(glow, 0.40*t));
      grad.addColorStop(1, hexToRgba(glow, 0));
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
      break;
    }
  }
}

/* =========================================================
   VOICE
   ========================================================= */
const avatar = document.getElementById('avatar');
const captionText = document.getElementById('caption-text');
let currentUtteranceText = '';
let currentSpeechToken = 0;

let bestVoice = null;
let voicesReady = false;

function scoreVoice(v){
  let score = 0;
  const name = v.name || '';
  if(/Natural/i.test(name)) score += 100;
  if(/Neural/i.test(name)) score += 95;
  if(/Premium/i.test(name)) score += 90;
  if(/Enhanced/i.test(name)) score += 85;
  if(/Google/i.test(name)) score += 70;
  if(/Microsoft.*Online/i.test(name)) score += 65;
  if(/Siri/i.test(name)) score += 60;
  if(v.localService) score += 8;
  if(/^en-US$/i.test(v.lang)) score += 6;
  else if(/^en-GB$/i.test(v.lang)) score += 5;
  else if(/^en/i.test(v.lang)) score += 3;
  if(/Samantha|Aria|Jenny|Libby|Sonia|Serena/i.test(name)) score += 4;
  return score;
}

function pickBestVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || voices.length === 0) return null;
  const english = voices.filter(v => /^en/i.test(v.lang));
  const pool = english.length ? english : voices;
  pool.sort((a,b) => scoreVoice(b) - scoreVoice(a));
  return pool[0] || null;
}

function refreshVoiceList(){
  bestVoice = pickBestVoice();
  voicesReady = !!bestVoice;
}

if('speechSynthesis' in window){
  refreshVoiceList();
  window.speechSynthesis.onvoiceschanged = refreshVoiceList;
  let pollTries = 0;
  const pollInterval = setInterval(()=>{
    pollTries++;
    if(voicesReady || pollTries > 20){ clearInterval(pollInterval); return; }
    refreshVoiceList();
  }, 250);
}

function getSelectedVoice(){
  return bestVoice;
}

function splitIntoSpeechChunks(text){
  const sentences = text.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [text];
  const chunks = [];
  for(let s of sentences){
    s = s.trim();
    if(!s) continue;
    if(s.length > 160){
      const parts = s.split(/(?<=[,;:])\s+/);
      let buf = '';
      for(const p of parts){
        if((buf + ' ' + p).trim().length > 160 && buf){ chunks.push(buf.trim()); buf = p; }
        else buf = (buf ? buf + ' ' : '') + p;
      }
      if(buf.trim()) chunks.push(buf.trim());
    } else {
      chunks.push(s);
    }
  }
  return chunks;
}

function renderCaption(fullText, chunkStartIndex, chunkText){
  const said = fullText.slice(0, chunkStartIndex);
  const windowStart = Math.max(0, said.length - 70);
  const fadedPart = fullText.slice(windowStart, chunkStartIndex);
  const freshPart = chunkText;
  captionText.innerHTML = `<span class="fading">${escapeHtml(fadedPart)}</span><span>${escapeHtml(freshPart)}</span>`;
}

// Edge TTS (Microsoft's neural voices), proxied through the same worker
// as the text models, is the MAIN voice — used ONLY for speaking the
// tutor's explanations aloud, never for generating lesson text/content
// itself. Every chunk is fetched with retries (and fetched one chunk
// ahead of playback, and cached for Replay), so a single hiccup doesn't
// change the voice. The browser's built-in speechSynthesis is only a
// last resort for a chunk Edge TTS genuinely can't deliver, so the
// tutor never goes silent.

// iOS Safari only allows audio to play if it was started directly inside
// a user gesture (a tap), not from code running after an async fetch —
// which is exactly how tutor speech starts (auto-triggered after the AI
// responds). The fix: create ONE <audio> element up front and "unlock"
// it during the very first tap anywhere in the tutor UI by playing/
// pausing it immediately. Once unlocked, changing its .src and calling
// .play() later (even from async code) is allowed for that same element.
const ttsAudioEl = new Audio();
ttsAudioEl.playsInline = true;
let audioUnlocked = false;
// A ~0.1s silent WAV, base64-encoded. Playing an element with NO src at
// all fails instantly (NotSupportedError) and does NOT count as a real
// unlock — Safari only lifts its autoplay restriction for the rest of
// the page's life once a media element has genuinely started playing
// audio during a real user gesture. This tiny silent clip satisfies
// that requirement without anyone actually hearing anything.
const SILENT_WAV = "data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==";
// Deliberately a SEPARATE <audio> element from ttsAudioEl. Reusing
// ttsAudioEl here would mean every tap on the page — including one that
// lands while real tutor speech is mid-playback — overwrites its .src
// with silence and calls .play(), stomping the audio that was already
// loaded/playing. This unlock element exists purely to satisfy Safari's
// "a real user gesture must start playback at least once" rule; once
// that's done for the page, ttsAudioEl itself is free to be driven by
// async code without ever being touched by the click/touchstart listeners.
const unlockAudioEl = new Audio();
unlockAudioEl.playsInline = true;

// ---------- On-screen voice diagnostics ----------
// No devtools needed: tap the voice-status chip any time to see exactly
// what the voice pipeline has done so far (unlock attempts, AudioContext
// state, network responses, playback errors). Capped ring buffer.
const voiceDebugLog = [];
function logVoice(msg){
  // Skip logging a repeat of the exact same message back-to-back — the
  // AudioContext-state check fires on every tap (including taps on the
  // debug chip itself), and without this a burst of identical
  // "state on tap: running" lines floods the capped buffer and pushes
  // out the one thing worth seeing (whether browser TTS ever started).
  if(voiceDebugLog.length && voiceDebugLog[voiceDebugLog.length-1].endsWith(msg)) return;
  const t = new Date().toISOString().slice(11,19);
  voiceDebugLog.push(`[${t}] ${msg}`);
  if(voiceDebugLog.length > 80) voiceDebugLog.shift();
}
logVoice('page script started');

function unlockTtsAudio(){
  // Create/resume the analyser's AudioContext HERE, inside the real
  // tap/touch handler. ensureVoiceAnalyser() reroutes ttsAudioEl's
  // output through this context permanently (createMediaElementSource),
  // so if the context is only created/resumed later — inside
  // setTutorSpeakingUI(), which fires after an `await fetch(...)` for
  // Edge TTS audio — the browser no longer treats that as a real user
  // gesture. resume() then silently fails, the context stays
  // "suspended" forever, and ttsAudioEl goes permanently silent even
  // though .play() reports success. Doing it synchronously in this
  // handler keeps it inside genuine user activation.
  ensureVoiceAnalyser();
  if(voiceAudioCtx){
    if(voiceAudioCtx.state === 'suspended'){
      voiceAudioCtx.resume()
        .then(()=> logVoice('AudioContext.resume() OK, state=' + voiceAudioCtx.state))
        .catch(err => logVoice('AudioContext.resume() FAILED: ' + (err && err.message || err)));
    } else {
      logVoice('AudioContext state on tap: ' + voiceAudioCtx.state);
    }
  } else {
    logVoice('AudioContext not created (ensureVoiceAnalyser returned nothing)');
  }
  if(audioUnlocked) return;
  unlockAudioEl.src = SILENT_WAV;
  const p = unlockAudioEl.play();
  if(p && p.then){
    p.then(()=>{ audioUnlocked = true; unlockAudioEl.pause(); logVoice('unlock audio play() OK — audioUnlocked=true'); })
     .catch(err => logVoice('unlock audio play() REJECTED: ' + (err && err.message || err)));
  } else {
    logVoice('unlock audio play() returned no promise (older browser)');
  }
  // Prime speechSynthesis the same way: some browsers (notably iOS
  // Safari) only allow the FIRST speak() call to actually produce sound
  // if it happens directly inside a real tap — a speak() called later
  // from async code (e.g. after a failed Edge TTS fetch, like the browser
  // fallback does) is silently dropped: no onstart, no onerror, nothing.
  // Speaking one empty/near-silent utterance here, inside the real
  // gesture, unlocks it for that later async call.
  if('speechSynthesis' in window){
    try{
      const primer = new SpeechSynthesisUtterance(' ');
      primer.volume = 0;
      primer.onstart = () => logVoice('speechSynthesis primer started');
      primer.onerror = (ev) => logVoice('speechSynthesis primer error: ' + (ev && ev.error));
      window.speechSynthesis.speak(primer);
      logVoice('speechSynthesis primer speak() called');
    }catch(e){
      logVoice('speechSynthesis primer threw: ' + (e && e.message || e));
    }
  }
}
document.addEventListener('touchstart', unlockTtsAudio, { passive:true });
document.addEventListener('click', unlockTtsAudio);

function setVoiceStatus(mode, detail){
  const chip = document.getElementById('voice-status-chip');
  if(!chip) return;
  // Only surface the chip when something is wrong; normal "Browser voice" / "Edge voice" labels stay hidden.
  chip.style.display = (mode === 'error') ? 'inline-block' : 'none';
  chip.style.cursor = 'pointer';
