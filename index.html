<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Chalkline — AI Study Tools</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap');
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#BFDCF7; font-family:-apple-system,Segoe UI,sans-serif; }
  /* Scoped to .shell-page specifically (not a bare "iframe" tag selector):
     a bare tag selector here would also catch any other <iframe> that
     ends up on the page — e.g. the one Google's Sign-In script injects
     into #shell-signin-btn — and fade it to invisible/unclickable since
     it never receives the .active class our router manages below. */
  .shell-page{ position:fixed; inset:0; width:100%; height:100%; border:none; background:#BFDCF7; }
  .shell-page{
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity 0.22s ease;
  }
  .shell-page.active{ opacity:1; visibility:visible; pointer-events:auto; z-index:2; }
  /* The outgoing page stays visible (z-index below the incoming one)
     just long enough to crossfade out, instead of vanishing instantly. */
  .shell-page.leaving{ opacity:0; visibility:visible; pointer-events:none; z-index:1; }

  /* Real Google Sign-In must live in the top-level page — a srcdoc
     iframe reports location.origin as "null", and Google's Identity
     script refuses to authenticate from a null origin. */
  #shell-auth{
    position:fixed; top:16px; right:20px; z-index:9999;
    display:flex; align-items:center; gap:8px;
    font-family:-apple-system,Segoe UI,sans-serif;
  }
  #shell-account-chip{
    display:none; position:relative;
  }
  #shell-account-btn{
    display:flex; align-items:center; gap:8px;
    background:#fff; border:1px solid #D3E6F5; border-radius:999px;
    padding:6px 16px 6px 6px; font-size:14.5px; color:#1E2B3A;
    box-shadow:0 1px 4px rgba(0,0,0,0.08);
    cursor:pointer; font-family:inherit;
  }
  #shell-account-btn:hover{ background:#F7FBFF; }
  #shell-account-btn img{ width:30px; height:30px; border-radius:50%; }
  #shell-account-btn .shell-chevron{ font-size:10.5px; color:#7C93A8; }
  #shell-account-menu{
    display:none; position:absolute; top:calc(100% + 8px); right:0;
    background:#fff; border:1px solid #D3E6F5; border-radius:12px;
    box-shadow:0 4px 16px rgba(0,0,0,0.12);
    min-width:180px; padding:10px 0; font-size:13px;
  }
  #shell-account-menu.open{ display:block; }
  #shell-account-menu .shell-menu-name{
    padding:6px 14px 10px; font-weight:600; color:#1E2B3A;
    border-bottom:1px solid #EEF3F8; margin-bottom:6px; word-break:break-word;
  }
  #shell-account-menu button{
    display:block; width:100%; text-align:left; border:none; background:none;
    color:#C0392B; cursor:pointer; font-size:13px; padding:8px 14px;
    font-family:inherit;
  }
  #shell-account-menu button:hover{ background:#FBEDE9; }

  /* "Start for free" sign-in-or-skip prompt. Lives in the top-level shell
     (not the landing iframe) so the real Google button — which can only
     render in a document with a real origin — can sit inside it. */
  #start-modal-overlay{
    position:fixed; inset:0; z-index:10000;
    display:none; align-items:center; justify-content:center;
    background:rgba(20,32,44,0.45);
    padding:20px;
    font-family:-apple-system,Segoe UI,sans-serif;
  }
  #start-modal-overlay.open{ display:flex; }
  #start-modal-card{
    background:#fff; border-radius:20px; padding:34px 28px 28px;
    max-width:360px; width:100%; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
    position:relative;
  }
  #start-modal-close{
    position:absolute; top:14px; right:14px;
    border:none; background:none; font-size:15px; color:#7C93A8; cursor:pointer;
    padding:4px;
  }
  #start-modal-card h2{ margin:0 0 10px; font-size:20px; color:#1E2B3A; }
  #start-modal-card p{ margin:0 0 22px; font-size:14px; color:#5c6f80; line-height:1.5; }
  #start-modal-google-btn{ display:flex; justify-content:center; margin-bottom:14px; min-height:44px; }
  #start-modal-skip{
    display:block; width:100%; padding:12px; border-radius:999px;
    border:1px solid #D3E6F5; background:#fff; color:#1E2B3A; font-size:14px; cursor:pointer;
    font-family:inherit;
  }
  #start-modal-skip:hover{ border-color:#2E7DBE; }
  #start-modal-note{ margin:14px 0 0 !important; font-size:12px !important; color:#9aa9b8 !important; }

  /* Soft "Welcome to Chalkline" moment after skipping sign-in — its own
     deep-blue gradient scene, not a translucent veil over the landing
     page behind it. */
  #welcome-toast{
    position:fixed; inset:0; z-index:10001;
    display:none; align-items:center; justify-content:center;
    pointer-events:none;
    background:linear-gradient(135deg, #0A1930 0%, #123A66 55%, #1C4E86 100%);
    opacity:0;
    transition:opacity .5s ease;
  }
  #welcome-toast.show{ display:flex; opacity:1; }
  #welcome-toast.fade-out{ opacity:0; }
  #welcome-toast-text{
    font-family:'Caveat', -apple-system, cursive; font-weight:700;
    font-size:52px; color:#fff;
    display:inline-flex;
  }
  /* Each letter fades/lifts in on its own delay (set inline in JS) so the
     whole line looks hand-drawn one character at a time, not typed. */
  #welcome-toast-text .wt-letter{
    opacity:0; display:inline-block; white-space:pre;
    transform:translateY(10px);
    transition:opacity .4s ease, transform .4s ease;
  }
  #welcome-toast-text .wt-letter.in{ opacity:1; transform:translateY(0); }
</style>
</head>
<body>

<div id="shell-auth">
  <div id="shell-signin-btn"></div>
  <div id="shell-account-chip">
    <button type="button" id="shell-account-btn" title="Account">
      <img id="shell-account-avatar" alt="" title="">
      <span id="shell-account-name-short"></span>
      <span class="shell-chevron">▼</span>
    </button>
    <div id="shell-account-menu">
      <div class="shell-menu-name" id="shell-menu-name"></div>
      <button type="button" id="shell-sign-out">Sign out</button>
    </div>
  </div>
</div>

<iframe id="frame-landing" class="shell-page"></iframe>
<iframe id="frame-home" class="shell-page"></iframe>
<iframe id="frame-tutor" class="shell-page"></iframe>
<iframe id="frame-summary" class="shell-page"></iframe>
<iframe id="frame-tutor-history" class="shell-page"></iframe>
<iframe id="frame-summary-history" class="shell-page"></iframe>

<div id="start-modal-overlay">
  <div id="start-modal-card">
    <button type="button" id="start-modal-close" aria-label="Close">✕</button>
    <h2>Save your progress?</h2>
    <p>Sign in with Google so your lessons and saved sessions are tied to your account — or jump straight in without one.</p>
    <div id="start-modal-google-btn"></div>
    <button type="button" id="start-modal-skip">Continue without signing in</button>
    <p id="start-modal-note">Your content won't be saved if you skip signing in.</p>
  </div>
</div>

<div id="welcome-toast"><span id="welcome-toast-text"></span></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// Google Sign-In lives here, at the top level, because this is the only
// document with a real, non-null origin (https://tarlio02.github.io).
// The individual "pages" below are rendered into iframes via .srcdoc,
// and srcdoc documents report origin=null — Google's script rejects
// those requests outright (Error 400: invalid_request, origin=null).
const SHELL_GOOGLE_CLIENT_ID = "676487295279-j4qka36obo55unl3vds7ja2v24uoq6dm.apps.googleusercontent.com";

// "Stay signed in": we cache the decoded profile from the ID token in
// localStorage (this top-level page has a real origin, so localStorage
// works fine here). On every fresh page load we restore it immediately,
// before Google's script has even finished loading, so a returning
// visitor doesn't have to sign in again just because they closed the
// tab or came back the next day. This only restores the *display*
// identity (name/email/picture/sub) that was already being decoded
// client-side with no backend verification — same trust level as
// before, just remembered across visits instead of forgotten on reload.
// Once a real backend exists, swap this for a proper refresh-token /
// session-cookie flow and verify server-side instead.
const SHELL_AUTH_STORAGE_KEY = 'chalkline_shell_user';
let shellUser = null;

function decodeShellIdToken(jwt){
  const payload = jwt.split('.')[1];
  const json = decodeURIComponent(atob(payload.replace(/-/g,'+').replace(/_/g,'/')).split('').map(c=>
    '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
  ).join(''));
  return JSON.parse(json);
}

function broadcastAuthState(){
  const msg = { chalklineAuth: true, signedIn: !!shellUser, user: shellUser };
  Object.values(frames).forEach(f => { try{ f.contentWindow.postMessage(msg, '*'); }catch(e){} });
}

function showSignedInChip(user){
  document.getElementById('shell-signin-btn').style.display = 'none';
  // The account name/avatar now lives in each page's own sidebar
  // (mirrors shellUser via chalklineAuth broadcasts below), so the
  // top-right chip is intentionally never shown anymore — just keep
  // it hidden and stash the name for the (now-unused) dropdown.
  const fullName = user.name || user.email || 'Signed in';
  document.getElementById('shell-menu-name').textContent = fullName;
}

function toggleShellAccountMenu(forceOpen){
  const menu = document.getElementById('shell-account-menu');
  const shouldOpen = forceOpen !== undefined ? forceOpen : !menu.classList.contains('open');
  menu.classList.toggle('open', shouldOpen);
}

document.getElementById('shell-account-btn').addEventListener('click', (e)=>{
  e.stopPropagation();
  toggleShellAccountMenu();
});
// Clicking anywhere outside the menu closes it.
document.addEventListener('click', (e)=>{
  const chip = document.getElementById('shell-account-chip');
  if(!chip.contains(e.target)) toggleShellAccountMenu(false);
});

function restoreShellSession(){
  try{
    const raw = localStorage.getItem(SHELL_AUTH_STORAGE_KEY);
    if(!raw) return;
    shellUser = JSON.parse(raw);
    showSignedInChip(shellUser);
    // Frames haven't loaded yet at this point in the page lifecycle —
    // ensureLoaded() posts the current shellUser to each frame the
    // first time it's opened, so there's nothing to broadcast to yet.
  } catch(e){ console.error('Could not restore saved sign-in:', e); localStorage.removeItem(SHELL_AUTH_STORAGE_KEY); }
}
restoreShellSession();

function handleShellCredential(response){
  shellUser = decodeShellIdToken(response.credential);
  try{ localStorage.setItem(SHELL_AUTH_STORAGE_KEY, JSON.stringify(shellUser)); }
  catch(e){ console.error('Could not persist sign-in:', e); }
  showSignedInChip(shellUser);
  broadcastAuthState();
  // If this credential came from the "Start for free" modal, finish that
  // flow now: close the modal and take the person into the app.
  const modal = document.getElementById('start-modal-overlay');
  if(modal.classList.contains('open')){
    closeStartModal();
    navTo('home');
  }
  // TODO: once a backend exists, send response.credential there to verify
  // the token and load/merge this person's saved sessions.
}

// Fallback shown if Google's own rendered button fails or vanishes (see
// watchdog below) — a plain link that still triggers the real Google
// prompt, so there's always SOMETHING clickable even when the official
// button can't survive in this browser's cookie environment. Used for
// both the persistent top-right button and the one inside the start modal.
function showShellSigninFallbackLink(elId){
  const el = document.getElementById(elId);
  if(!el || el.dataset.fallback === '1') return; // already showing it, don't stack duplicates
  el.dataset.fallback = '1';
  const linkId = elId + '-fallback-link';
  el.innerHTML = '<a href="#" id="'+linkId+'" style="font-size:14px;color:#1a56db;text-decoration:underline;">Sign in with Google</a>';
  document.getElementById(linkId).addEventListener('click', (e)=>{
    e.preventDefault();
    if(typeof google !== 'undefined' && google.accounts) google.accounts.id.prompt();
  });
}

// Google's rendered button is itself a cross-origin iframe. When it fails
// silently (Safari ITP, cookie-partitioning browsers, some managed
// browsers), sometimes the iframe element is removed outright, but other
// times the iframe stays in the DOM while its internal content collapses
// to near-zero size — a plain childList observer misses that second case.
// Polling the actual rendered size catches both.
function watchShellSigninButton(elId){
  const el = document.getElementById(elId);
  if(!el) return;
  let checks = 0;
  const maxChecks = 10; // ~7 seconds of polling covers the delayed-failure case seen in testing
  const poll = setInterval(()=>{
    checks++;
    if(shellUser){ clearInterval(poll); return; } // signed in — button is hidden on purpose
    if(el.dataset.fallback === '1'){ clearInterval(poll); return; } // already on the fallback
    const rect = el.getBoundingClientRect();
    const collapsed = rect.width < 20 || rect.height < 10;
    if(collapsed){
      showShellSigninFallbackLink(elId);
      clearInterval(poll);
      return;
    }
    if(checks >= maxChecks) clearInterval(poll);
  }, 700);
}

// "Start for free" sign-in-or-skip modal, opened by the landing page (it
// can't hold the real Google button itself — see the origin note above).
function openStartModal(){
  document.getElementById('start-modal-overlay').classList.add('open');
  // Render the modal's Google button lazily, only once it's actually
  // visible — rendering into a display:none container at page load is
  // what was causing it to come out blank/broken, since Google's script
  // can't measure a hidden element's size.
  const modalBtnEl = document.getElementById('start-modal-google-btn');
  if(!modalBtnEl.dataset.rendered && typeof google !== 'undefined' && google.accounts){
    modalBtnEl.dataset.rendered = '1';
    google.accounts.id.renderButton(modalBtnEl, { theme:'outline', size:'large', shape:'pill', width:260 });
    watchShellSigninButton('start-modal-google-btn');
  }
}
function closeStartModal(){
  document.getElementById('start-modal-overlay').classList.remove('open');
}
document.getElementById('start-modal-close').addEventListener('click', closeStartModal);
document.getElementById('start-modal-overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'start-modal-overlay') closeStartModal(); // click on the scrim, not the card
});
document.getElementById('start-modal-skip').addEventListener('click', ()=>{
  closeStartModal();
  showWelcomeToast(()=> navTo('home'));
});

// A brief, soft "Welcome to Chalkline" moment before dropping into the
// app without signing in — its own full-screen deep-blue scene, with the
// message drawn in one letter at a time, then a hold, then a fade out —
// then runs the callback (navigating home) once it's fully gone.
function showWelcomeToast(onDone){
  const el = document.getElementById('welcome-toast');
  const textEl = document.getElementById('welcome-toast-text');
  const message = 'Welcome to Chalkline';
  textEl.innerHTML = '';
  const letterEls = [];
  for(const ch of message){
    const span = document.createElement('span');
    span.className = 'wt-letter';
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    textEl.appendChild(span);
    letterEls.push(span);
  }
  el.classList.remove('fade-out');
  el.classList.add('show');
  const letterDelayMs = 55; // gap between each letter drawing in
  letterEls.forEach((span, i)=>{
    setTimeout(()=> span.classList.add('in'), i * letterDelayMs);
  });
  const revealDurationMs = letterEls.length * letterDelayMs + 400; // + last letter's own transition
  const holdAfterRevealMs = 750;
  setTimeout(()=>{
    el.classList.add('fade-out');
    setTimeout(()=>{
      el.classList.remove('show');
      el.classList.remove('fade-out');
      if(onDone) onDone();
    }, 550); // matches the CSS fade-out transition duration
  }, revealDurationMs + holdAfterRevealMs);
}

function initShellGoogleSignIn(){
  if(typeof google === 'undefined' || !google.accounts){ setTimeout(initShellGoogleSignIn, 300); return; }
  // auto_select lets Google silently re-confirm a returning visitor who
  // still has an active Google session, refreshing the identity in the
  // background even if our own localStorage cache was ever cleared.
  // itp_support helps Safari's Intelligent Tracking Prevention (and
  // similar cookie-partitioning browsers) keep the button working
  // instead of it rendering once and then quietly disappearing.
  google.accounts.id.initialize({ client_id: SHELL_GOOGLE_CLIENT_ID, callback: handleShellCredential, auto_select: true, itp_support: true });
  google.accounts.id.renderButton(document.getElementById('shell-signin-btn'), { theme:'outline', size:'medium', shape:'pill' });
  watchShellSigninButton('shell-signin-btn');
  // The modal's button is NOT rendered here — see openStartModal() — since
  // this container is still display:none at this point in the page load.
  if(!shellUser) google.accounts.id.prompt(); // only worth a silent attempt if we have no cached session already
}
initShellGoogleSignIn();

document.getElementById('shell-sign-out').addEventListener('click', signOutShell);

function signOutShell(){
  shellUser = null;
  localStorage.removeItem(SHELL_AUTH_STORAGE_KEY);
  if(typeof google !== 'undefined' && google.accounts) google.accounts.id.disableAutoSelect();
  toggleShellAccountMenu(false);
  document.getElementById('shell-account-chip').style.display = 'none';
  const signinEl = document.getElementById('shell-signin-btn');
  signinEl.style.display = 'block';
  // Give the real Google button another chance on sign-out rather than
  // staying stuck on the fallback link from a previous session.
  signinEl.dataset.fallback = '';
  signinEl.innerHTML = '';
  const modalBtnEl = document.getElementById('start-modal-google-btn');
  modalBtnEl.dataset.fallback = '';
  modalBtnEl.dataset.rendered = '';
  modalBtnEl.innerHTML = '';
  if(typeof google !== 'undefined' && google.accounts){
    google.accounts.id.renderButton(signinEl, { theme:'outline', size:'medium', shape:'pill' });
    watchShellSigninButton('shell-signin-btn');
    // Modal button re-renders lazily next time openStartModal() runs,
    // same reasoning as above — don't render it while still hidden.
  }
  broadcastAuthState();
}

// Pages inside the iframes can't run Google's script themselves (see
// note above), so they ask the shell to act on their behalf.
window.addEventListener('message', (e)=>{
  const d = e.data;
  if(!d) return;
  if(d.showStartModal){ openStartModal(); }
  if(d.requestLogin && typeof google !== 'undefined' && google.accounts){
    google.accounts.id.prompt();
  }
  if(d.requestSignOut){
    signOutShell();
  }
});

</script>


<script type="text/plain" id="src-landing"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Chalkline — AI Study Tools</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=Kalam:wght@400;700&family=Caveat:wght@600;700&display=swap');

:root{
  --board-bg:#0E1B33;
  --navy:#0E1B33;
  --navy-2:#16294A;
  --ink:#0E1B33;
  --paper:#F4F8FE;
  --ochre:#2E7DBE;
  --violet:#6C5CE7;
  --gold:#F0B94D;
  --highlight:#A6D0F2;
  --sage:#3E8FA6;
  --brick:#3D6B93;
  --panel-border:rgba(30,50,90,0.10);
  --muted:#5C7089;
  --halo-blue:#6EA8FE;
  --halo-blue-soft:#8F7CF0;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Source Serif 4', Georgia, serif;
  color:var(--ink);
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(108,92,231,0.16), transparent 60%),
    radial-gradient(ellipse 900px 600px at 100% 0%, rgba(46,125,190,0.20), transparent 60%),
    linear-gradient(180deg, #EEF4FD 0%, #DCEBFB 55%, #E7EEFB 100%);
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
}

.ambient-halo{
  position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
}
.ambient-halo::before,.ambient-halo::after{
  content:''; position:absolute; width:60vmax;height:60vmax;
  border-radius:50%; filter:blur(110px); opacity:0.30; mix-blend-mode:multiply;
}
.ambient-halo::before{
  top:-22%; left:-18%;
  background:radial-gradient(circle, var(--halo-blue) 0%, rgba(110,168,254,0) 70%);
  animation:drift1 24s ease-in-out infinite;
}
.ambient-halo::after{
  bottom:-25%; right:-15%;
  background:radial-gradient(circle, var(--halo-blue-soft) 0%, rgba(143,124,240,0) 70%);
  animation:drift2 28s ease-in-out infinite;
}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(10%,8%) scale(1.15);}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-8%,-6%) scale(1.12);}}

@keyframes fadeUp{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:translateY(0); } }
.fade-up{ opacity:0; animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) forwards; }

.wrap{ position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:0 28px; }

nav{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 24px; margin-top:18px;
  background:rgba(255,255,255,0.55);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid rgba(255,255,255,0.6);
  border-radius:999px;
  box-shadow:0 8px 30px rgba(16,40,80,0.10);
}
.brand{
  font-family:'Caveat', cursive; font-weight:700; font-size:29px;
  color:var(--navy); text-decoration:none; display:flex; align-items:center; gap:8px;
}
.brand .dot{
  width:10px;height:10px;border-radius:50%;
  background:linear-gradient(135deg, var(--ochre), var(--violet));
  display:inline-block; box-shadow:0 0 0 4px rgba(108,92,231,0.14);
}
.nav-links{ display:flex; gap:26px; font-family:'JetBrains Mono', monospace; font-size:13px; }
.nav-links a{ color:var(--muted); text-decoration:none; transition:color .15s ease; }
.nav-links a:hover{ color:var(--navy); }
@media (max-width:680px){ .nav-links{ display:none; } }

.go-app-btn{
  font-family:-apple-system,Segoe UI,sans-serif; font-weight:600; font-size:13.5px;
  color:#fff; text-decoration:none;
  border:none; border-radius:999px;
  padding:11px 22px;
  background:linear-gradient(120deg, var(--navy), var(--violet) 60%, var(--ochre));
  box-shadow:0 6px 18px rgba(70,60,160,0.28);
  transition:transform .18s ease, box-shadow .18s ease;
}
.go-app-btn:hover{ transform:translateY(-1px); box-shadow:0 10px 24px rgba(70,60,160,0.34); }

.nav-right{ display:flex; align-items:center; gap:14px; }
#google-signin-btn-landing{ line-height:0; }
.account-chip{
  display:flex; align-items:center; gap:8px;
  font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--navy);
  background:#fff; border:1px solid var(--panel-border); border-radius:999px;
  padding:5px 14px 5px 5px;
}
.account-chip img{ width:24px; height:24px; border-radius:50%; }

.eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.02em;

<script>
// Google Sign-In itself runs one level up, in the top-level shell page —
// a srcdoc iframe (which is what this page is) reports its origin as
// "null", and Google's script refuses to authenticate from a null
// origin. This page just listens for the shell to tell it the current
// sign-in state and reflects it in the UI.
let landingSignedIn = false;
function updateLandingCta(){
  const cta = document.getElementById('landing-cta-btn');
  cta.textContent = landingSignedIn ? 'Go to App →' : 'Sign in';
}
window.addEventListener('message', (e)=>{
  const d = e.data;
  if(!d || !d.chalklineAuth) return;
  const out = document.getElementById('account-signed-in-landing');
  landingSignedIn = !!(d.signedIn && d.user);
  if(landingSignedIn){
    out.style.display = 'block';
    document.getElementById('account-avatar-landing').src = d.user.picture || '';
    document.getElementById('account-name-landing').textContent = d.user.name || d.user.email || 'Signed in';
  } else {
    out.style.display = 'none';
  }
  updateLandingCta();
});
// Signed in already: the button's job is to get you into the app.
// Signed out: its job is to get you signed in first — hand off to the
// shell's real sign-in-or-skip modal (same one "Start for free" uses)
// rather than dropping straight into the app as a guest.
document.getElementById('landing-cta-btn').addEventListener('click', (e)=>{
  e.preventDefault();
  if(landingSignedIn) parent.postMessage({ nav:'home' }, '*');
  else parent.postMessage({ showStartModal:true }, '*');
});
<\/script>

/* Toggle button: always visible, docked to the sidebar's edge like a

  .main-area{ margin-left:0 !important; padding-top:66px; }

.dash-card{
  --card-a:var(--ochre); --card-b:var(--violet);
  display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-end; text-align:left;
  gap:6px; text-decoration:none; color:inherit; cursor:pointer;
  min-height:168px; border-radius:22px;
  background:linear-gradient(160deg, #14213E 0%, var(--navy) 100%);
  border:none;
  padding:22px 24px 20px; position:relative; overflow:hidden;
  transform-style:preserve-3d; transform:translateY(0) translateZ(0) rotateX(0deg);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.12) inset,
    0 -18px 30px -18px rgba(0,0,0,0.55) inset,
    0 14px 0 -6px rgba(4,9,20,0.55),
    0 22px 34px -14px rgba(8,15,32,0.65);
  transition:transform .22s cubic-bezier(.2,.8,.3,1.1), box-shadow .22s ease;
}
/* glowing gradient rim, only revealed as a thin ring around the card */
.dash-card::before{
  content:''; position:absolute; inset:0; border-radius:22px; padding:1.5px;
  background:linear-gradient(135deg, var(--card-a), var(--card-b) 60%, transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  opacity:0.55; transition:opacity .2s ease;
}
/* soft color bloom in the corner, like light catching foil */
.dash-card::after{
  content:''; position:absolute; top:-40%; right:-20%; width:70%; height:140%;
  background:radial-gradient(circle, var(--card-b) 0%, transparent 70%);
  opacity:0.22; filter:blur(6px); pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
}
.dash-card.summary{ --card-a:var(--sage); --card-b:var(--emerald); }
.dash-card:hover{

    0 10px 0 -6px rgba(4,9,20,0.5),
    0 30px 46px -16px rgba(8,15,32,0.7);
}
.dash-card:hover::before{ opacity:0.9; }
.dash-card:hover::after{ opacity:0.36; transform:scale(1.1); }
.dash-card:active{
  transform:translateY(-1px) translateZ(4px) rotateX(1deg);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.1) inset,
    0 -14px 24px -16px rgba(0,0,0,0.5) inset,

  const shell = document.getElementById('app-shell');
  const sbScrim = document.getElementById('sidebar-scrim');
  function closeSidebar(){ shell.classList.add('sidebar-closed'); }
  function openSidebar(){ shell.classList.remove('sidebar-closed'); }
  document.getElementById('sidebar-toggle').addEventListener('click', ()=>
    shell.classList.contains('sidebar-closed') ? openSidebar() : closeSidebar()
  );
  sbScrim.addEventListener('click', closeSidebar);
  // Open by default on tablet/desktop, where it docks and pushes the
  // content over. On narrow phone widths it would swallow the whole
  // screen, so it starts closed there instead — the toggle still works
  // exactly the same either way.
  if (window.innerWidth <= 900) closeSidebar();

  // Account row reflects real sign-in state (mirrors the shell's
  // chalklineAuth broadcast) instead of always saying "tap to sign in" —
  // this is now the only place the signed-in name/avatar shows, since
  // the top-right chip in the shell was removed.
  let homeShellUser = null;
  function renderHomeSidebarAccount(){
    const avatarEl = document.getElementById('home-sidebar-avatar');
    const nameEl = document.getElementById('home-sidebar-name');
    const subEl = document.getElementById('home-sidebar-sub');
    if(homeShellUser){
      const fullName = homeShellUser.name || homeShellUser.email || 'Signed in';
      if(homeShellUser.picture){
        avatarEl.outerHTML = `<img class="avatar" id="home-sidebar-avatar" src="${homeShellUser.picture}" alt="" style="object-fit:cover;">`;
      } else {
        avatarEl.textContent = (homeShellUser.given_name || fullName)[0].toUpperCase();
      }
      nameEl.textContent = fullName;
      subEl.textContent = 'tap to sign out';
    } else {
      avatarEl.outerHTML = `<span class="avatar" id="home-sidebar-avatar">👤</span>`;
      nameEl.textContent = 'Account';
      subEl.textContent = 'tap to sign in';
    }
  }
  function handleHomeSidebarAccountClick(){
    parent.postMessage(homeShellUser ? { requestSignOut:true } : { navLoginClick:true }, '*');
  }
  window.handleHomeSidebarAccountClick = handleHomeSidebarAccountClick;
  window.addEventListener('message', (e)=>{
    const d = e.data;
    if(!d || !d.chalklineAuth) return;
    homeShellUser = d.signedIn ? d.user : null;
    renderHomeSidebarAccount();
  });
<\/script>

</script>

<script type="text/plain" id="src-tutor"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Chalkline — AI Whiteboard Tutor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"><\/script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --board-bg:#A9CFF0;
  --board-line:#E0D9C8;
  --margin-line:#E08080;
  --ink:#1E2B3A;
  --ochre:#2E7DBE;
  --highlight:#A6D0F2;
  --sage:#3E8FA6;
  --brick:#3D6B93;
  --panel:#DCEEFB;
  --panel-border:#D3E6F5;
  --muted:#7C93A8;
  --halo-blue:#0099FF;
  --halo-blue-soft:#00E5FF;

  /* ============================================================
     RESPONSIVE ARCHITECTURE
     One set of variables drives every device-specific layout
     decision below. Device-tier media queries (phone / tablet /
     desktop) only ever override these — no page rule should ever
     hard-code a raw pixel offset for "where the controls are".
     --safe-* mirror the real device safe areas (notches, home
     indicator, rounded corners); --control-size etc. are the
     per-tier touch-target and spacing scale. ============================================================ */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);

  /* Desktop/default tier */
  --content-padding: 20px;
  --control-size: 40px;
  --control-size-sm: 30px;
  --control-gap: 8px;
  --top-control-height: 88px;
  --bottom-control-height: 150px;
  --ask-zone-width: min(680px, 62vw);
  --caption-max-width: 760px;
  --side-panel-w: 360px;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  font-family:'Source Serif 4', Georgia, serif;
  color:var(--ink);
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:linear-gradient(160deg, #A9CFF0 0%, #DCEEFB 65%);
}

#board-wrap{
  position:fixed;
  inset:0;
  z-index: 2;
  /* Must receive pointer events itself (wheel/touch/drag) or none of
     that input ever reaches it to trigger native scrolling — pointer
     events are NOT inherited by children needing scroll the way visual
     properties are. This was left over from the old design, where
     #board-wrap was just an inert positioning shell and #board (the
     canvas) handled its own custom pan/zoom via mouse events instead
     of the wrapper scrolling natively. */
  pointer-events: auto;
  /* This is now a genuine native-scrolling container — the canvas
     inside it is made much taller than the viewport as content grows
     (see applyCanvasHeight in the tutor script), and the browser scrolls
     it natively (finger-drag, wheel, trackpad, scrollbar) exactly like
     any tall page. There is no custom JS pan/zoom left; this replaces
     it entirely. */
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain; /* stop scroll chaining/rubber-banding past our own top/bottom limits into the page behind it */
}
#board{
  width:100%;
  display:block;
  cursor:default;
  pointer-events: auto;
  /* Custom drag-to-pan and pinch-to-zoom gesture handling has been
     removed, so the browser is now allowed to handle scroll gestures on
     this element itself (pan-y), instead of us calling
     preventDefault() on every touch move to do it ourselves. */
  touch-action: pan-y;
}
#board.hoverable{cursor:pointer;}

/* Pointer used for "point to the exact word/symbol currently being
   explained" (see runTeachingTurn's use of pointToWord/pointToRegion).
   A small solid dot with a soft halo, styled distinctly from the ink
   colors used for handwriting so it always reads as "UI", not content.
   It lives in viewport-fixed coordinates (like the quiz overlay) and is
   repositioned via worldToViewport-style math whenever it moves or the
   user scrolls — never via canvas drawing, so it's cheap to animate
   smoothly every frame without a full canvas redraw. */
#board-pointer{
  position:fixed;
  z-index: 5;
  width:16px; height:16px;
  margin-left:-8px; margin-top:-8px;
  border-radius:50%;
  background: var(--halo-blue, #0099FF);
  box-shadow: 0 0 0 4px rgba(0,153,255,0.25), 0 0 14px 4px rgba(0,153,255,0.35);
  pointer-events:none;
  opacity:0;
  transition: opacity 160ms ease;
  will-change: transform, opacity;
}
#board-pointer.visible{ opacity:1; }

/* The highlight box drawn behind whichever word/region the pointer is
   currently on. Removed (opacity 0) the instant the tutor moves on to
   the next word, per spec ("remove the highlight before moving to the
   next word"). */
#board-pointer-highlight{
  position:fixed;
  z-index: 4;
  border-radius:4px;
  background: rgba(255, 224, 102, 0.55);
  pointer-events:none;
  opacity:0;
  transition: opacity 120ms ease, left 90ms ease, top 90ms ease, width 90ms ease, height 90ms ease;
  will-change: transform, opacity, left, top, width, height;
}
#board-pointer-highlight.visible{ opacity:1; }

.ambient-halo{
  position:fixed;
  inset:0;
  z-index:1;
  overflow:hidden;
  pointer-events:none;
}
.ambient-halo::before,
.ambient-halo::after{
  content:'';
  position:absolute;
  width:65vmax;height:65vmax;
  border-radius:50%;
  filter:blur(80px);
  opacity:0.35;
  mix-blend-mode:screen;
}
.ambient-halo::before{
  top:-20%; left:-15%;
  background:radial-gradient(circle, var(--halo-blue) 0%, rgba(0,153,255,0) 70%);
  animation:haloDrift1 22s ease-in-out infinite;
}
.ambient-halo::after{
  bottom:-25%; right:-15%;
  background:radial-gradient(circle, var(--halo-blue-soft) 0%, rgba(0,229,255,0) 70%);
  animation:haloDrift2 26s ease-in-out infinite;
}
@keyframes haloDrift1{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(12%,10%) scale(1.18); }
}
@keyframes haloDrift2{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(-10%,-8%) scale(1.15); }
}

.topbar{
  position:fixed;
  top:0;left:0;right:0;
  display:flex;
  flex-wrap:wrap;
  row-gap:8px;
  justify-content:space-between;
  align-items:flex-start;
  padding:calc(var(--safe-top) + 14px) calc(var(--safe-right) + var(--content-padding)) 10px calc(var(--safe-left) + var(--content-padding));
  pointer-events:none;
  z-index:20;
}
.topbar > *{pointer-events:auto;}
.topbar-left-stack{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:var(--control-gap);
}
.icon-btn{
  width:var(--control-size);height:var(--control-size);
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(6px);
  box-shadow:0 1px 4px rgba(0,0,0,0.08), 0 0 0 4px rgba(15,55,145,0.35);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:16px;
  color:var(--ink);
  flex-shrink:0;
}
.icon-btn:hover{background:#fff;}
.top-right-cluster{
  display:flex;flex-direction:column;gap:10px;align-items:flex-end;
  /* The real Google "Sign in" button (and, once signed in, the account
     chip) is NOT part of this page — it lives in the top-level shell
     page one level up, fixed at the very top of the whole screen, and
     it always renders above every iframe's content no matter what
     z-index anything in here has. It can be quite wide/tall while
     signed out, so this cluster needs real fixed clearance below it —
     not just alignment with the icon row — or Exit Lesson silently
     sits underneath it and becomes unclickable/invisible exactly like
     that. control-size covers the icon row's own height; +34px is the
     extra headroom for the shell's overlay on top of that. */
  margin-top:0;
}
.login-pill{
  position:absolute;
  left:50%;
  top:calc(var(--safe-top) + 14px);
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:7px;
  padding:9px 16px;
  border-radius:999px;
  border:none;
  cursor:pointer;
  background:rgba(255,255,255,0.9);
  backdrop-filter:blur(6px);
  box-shadow:0 1px 4px rgba(0,0,0,0.08), 0 0 0 4px rgba(15,55,145,0.35);
  font-family:'JetBrains Mono', monospace;
  font-size:12px;
  color:var(--ink);
  white-space:nowrap;
  transition:background .15s ease;
  max-width:min(70vw, 320px);
  overflow:hidden;
  text-overflow:ellipsis;
}
.login-pill:hover{background:#fff;}
@media (max-width:620px){
  .login-pill span.pill-full{display:none;}
  .login-pill span.pill-short{display:inline;}
}
.login-pill span.pill-short{display:none;}
.topbar-btn-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}
.status-chip{
  font-family:'JetBrains Mono', monospace;
  font-size:10.5px;
  color:var(--muted);
  background:rgba(255,255,255,0.7);
  padding:6px 10px;
  border-radius:20px;
  align-self:center;
  margin-right:4px;
  white-space:nowrap;
}
.exit-lesson-btn{
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  font-weight:700;
  color:#fff;
  background:#e53e3e;
  border:none;
  border-radius:999px;
  padding:8px 14px;
  cursor:pointer;
  white-space:nowrap;
  box-shadow:0 2px 8px rgba(229,62,62,0.35);
  transition:background .15s ease, transform .15s ease;
}
.exit-lesson-btn:hover{ background:#c53030; }
.exit-lesson-btn:active{ transform:scale(0.96); }
@media (max-width:600px){
  .exit-lesson-btn{ font-size:9.5px; padding:6px 10px; }
}

.btn-label{
  font-family:'JetBrains Mono', monospace;
  font-size:9px;
  color:var(--muted);
  letter-spacing:0.2px;
  white-space:nowrap;
  background:rgba(255,255,255,0.85);
  padding:1px 6px;
  border-radius:8px;
}

/* ------------------------------------------------------------
   BOTTOM DOCK
   Everything anchored to the bottom of the screen (the speaking
   avatar, the live caption, and the control bar) now lives inside
   one flow container instead of three independently-positioned
   fixed elements guessing at each other's height. Stacking them
   in normal document flow is what actually guarantees they can
   never overlap one another, on any device, without needing to
   hard-code any element's height. JS reads this container's
   rendered height (see getLayoutInsets()) to keep the on-canvas
   handwriting from ever being drawn underneath it. ------------------------------------------------------------ */
.bottom-dock{
  position:fixed;
  left:0;right:0;bottom:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  pointer-events:none;
  padding-left:var(--safe-left);
  padding-right:var(--safe-right);
  padding-bottom:var(--safe-bottom);
}
.bottom-dock > *{pointer-events:auto;}

.speaker-row{ display:none; }

.top-center-cluster{
  position:fixed;
  /* Sits just under the login pill (which lives at safe-top+14px) —
     high up near the very top of the screen on every device/breakpoint,
     instead of hanging down at top-control-height where it used to
     cover the first lines the tutor writes on the board. */
  top:calc(var(--safe-top) + 46px);
  left:50%;
  transform:translateX(-50%);
  z-index:19;
  display:flex;
  align-items:center;
  gap:8px;
  pointer-events:none;
}

.caption-zone{ display:none; }
.caption-text{
  max-width:var(--caption-max-width);
  width:100%;
  text-align:center;
  font-size:16px;
  line-height:1.5;
  color:#3a372e;
}
.caption-text .fading{color:#b9b295;}

.avatar-cluster{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
  padding-bottom:8px;
}
.avatar{
  width:52px;height:52px;
  border-radius:50%;
  background:#fff;
  border:2px solid var(--panel-border);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
  position:relative;
  flex-shrink:0;
}
.avatar-topbar{
  width:var(--control-size);height:var(--control-size);
  font-size:18px;
  box-shadow:0 1px 4px rgba(0,0,0,0.08), 0 0 0 4px rgba(15,55,145,0.35);
  flex-shrink:0;
}
.avatar.speaking{border-color:var(--ochre);}
.avatar.speaking::after{
  content:'';
  position:absolute; inset:-6px;
  border-radius:50%;
  border:2px solid var(--ochre);
  opacity:0.5;
  animation:ripple 1.6s ease-out infinite;
}
@keyframes ripple{0%{transform:scale(0.85);opacity:0.6;}100%{transform:scale(1.25);opacity:0;}}

.tutor-live{
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.2px;
  color:#1f9d55;
  background:rgba(255,255,255,0.85);
  padding:5px 10px;
  border-radius:14px;
  display:flex;align-items:center;gap:6px;
  white-space:nowrap;
  flex-shrink:0;
  animation:tutor-live-pulse 1.8s ease-in-out infinite;
}
.tutor-live::before{
  content:'';
  width:7px;height:7px;border-radius:50%;
  background:#1f9d55;
  animation:tutor-dot-pulse 1.8s ease-in-out infinite;
}
@keyframes tutor-live-pulse{0%,100%{opacity:1;}50%{opacity:0.6;}}
@keyframes tutor-dot-pulse{
  0%{box-shadow:0 0 0 0 rgba(31,157,85,0.55);}
  70%{box-shadow:0 0 0 8px rgba(31,157,85,0);}
  100%{box-shadow:0 0 0 0 rgba(31,157,85,0);}
}

.cluster-btn-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  flex-shrink:0;
}
.cluster-btn{
  width:var(--control-size-sm);height:var(--control-size-sm);border-radius:50%;
  border:1px solid var(--panel-border);
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:12px;color:var(--ink);
  box-shadow:0 1px 4px rgba(0,0,0,0.06), 0 0 0 3px rgba(15,55,145,0.35);
}
.cluster-btn:hover{background:#faf8f2;}

.bottom-bar{
  position:static;
  z-index:20;
  display:flex;
  flex-wrap:nowrap;
  align-items:center;
  justify-content:center;
  gap:var(--control-gap);
  padding:12px var(--content-padding) 12px;
}
/* Replay/Talk/Transcript keep their fixed round size on every device;
   only the ask bar between them grows/shrinks to take up the slack —
   this is what keeps Replay – Ask – Talk – Transcript on one strict,
   never-wrapping row from the smallest phone up to a wide desktop. */
.bottom-bar > .cluster-btn-wrap{ flex:0 0 auto; }

.mic-btn{
  width:var(--control-size-sm);height:var(--control-size-sm);border-radius:50%;
  border:none;
  background:var(--brick);
  color:#fff;
  font-size:13px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  box-shadow:0 3px 10px rgba(168,75,57,0.35), 0 0 0 3px rgba(15,55,145,0.35);
}
.mic-btn.live{ background:#e53e3e; box-shadow:0 3px 10px rgba(229,62,62,0.45), 0 0 0 4px rgba(15,55,145,0.35); animation:mic-pulse 1.3s ease-in-out infinite; }
.mic-btn.unsupported{background:#c9c4b5;box-shadow:none;cursor:not-allowed;}
@keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,62,62,.55), 0 0 0 4px rgba(15,55,145,0.35);}50%{box-shadow:0 0 0 10px rgba(229,62,62,0), 0 0 0 4px rgba(15,55,145,0.35);}}

.ask-zone{
  position:relative;
  display:flex;
  gap:5px;
  align-items:center;
  background:#fff;
  border:1.5px solid var(--ink);
  border-radius:12px;
  padding:2px 2px 2px 12px;
  box-shadow:0 3px 14px rgba(0,0,0,0.08);
  flex:1 1 auto;
  max-width:var(--ask-zone-width);
  min-width:0;
  height:var(--control-size-sm);
  /* No vertical offset here anymore — the ask bar now sits on the exact
     same baseline as Replay/Talk/Transcript beside it (the bottom-bar's
     own align-items:center is what keeps everything level). */
}
.ask-icon-btn{
  width:18px;height:18px;border-radius:50%;
  border:none; background:transparent; color:var(--muted);
  cursor:pointer; font-size:11px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.ask-icon-btn:hover{ background:rgba(0,0,0,0.05); color:var(--ink); }
.attach-chip{
  position:absolute; left:14px; bottom:calc(100% + 8px);
  display:flex; align-items:center; gap:6px;
  background:#fff; border:1px solid var(--panel-border); border-radius:14px;
  padding:5px 8px 5px 10px;
  font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink);
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
  max-width:260px;
}
.attach-chip-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:170px; }
.attach-chip-remove{ border:none; background:transparent; cursor:pointer; font-size:14px; color:var(--muted); line-height:1; padding:0 2px; }
.attach-chip-remove:hover{ color:var(--brick); }
.ask-zone input{
  flex:1;
  min-width:0;
  border:none;outline:none;
  font-family:'Source Serif 4', serif;
  font-size:14px;
  padding:6px 0;
  background:transparent;
}
.ask-zone button{
  width:22px;height:22px;border-radius:50%;
  border:none;background:var(--ink);color:#fff;
  cursor:pointer;font-size:10px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  box-shadow:0 0 0 3px rgba(15,55,145,0.35);
}
.ask-zone button:hover{background:var(--ochre);}

.overlay{
  position:fixed;inset:0;
  background:rgba(20,18,12,0.25);
  z-index:29;
  opacity:0;pointer-events:none;
  transition:opacity .2s ease;
}
.overlay.open{opacity:1;pointer-events:auto;}

.subject-modal{
  position:fixed; inset:0; z-index:50;
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none;
  transition:opacity .2s ease;
}
.subject-modal.open{ opacity:1; pointer-events:auto; }
.subject-modal .sm-scrim{
  position:absolute; inset:0; background:rgba(20,18,12,0.45); backdrop-filter:blur(2px);
}
.subject-modal .sm-card{
  position:relative; z-index:1;
  width:min(420px, calc(100vw - 48px));
  background:#fff; border-radius:18px;
  box-shadow:0 24px 60px rgba(0,0,0,0.25);
  padding:34px 30px 28px;
  font-family:'Source Serif 4', Georgia, serif;
  color:var(--ink);
  transform:translateY(8px) scale(0.98);
  transition:transform .22s cubic-bezier(.2,.8,.2,1);
}
.subject-modal.open .sm-card{ transform:translateY(0) scale(1); }
.subject-modal .sm-eyebrow{
  font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.4px;
  color:var(--ochre); margin:0 0 10px;
}
.subject-modal h2{ font-size:22px; margin:0 0 8px; font-weight:600; }
.subject-modal p{ font-size:14px; color:var(--muted); line-height:1.5; margin:0 0 20px; }
.subject-modal input{
  width:100%; font-family:'Source Serif 4', serif; font-size:16px;
  border:1.5px solid var(--panel-border); border-radius:10px;
  padding:12px 14px; color:var(--ink); outline:none;
  transition:border-color .15s ease;
}
.subject-modal input:focus{ border-color:var(--ochre); }
.subject-modal .sm-existing{ margin-top:16px; }
.subject-modal .sm-existing-label{
  font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--muted);
  margin:0 0 8px; letter-spacing:0.2px;
}
.subject-modal .sm-chip-row{ display:flex; flex-wrap:wrap; gap:7px; max-height:110px; overflow-y:auto; }
.subject-modal .sm-chip{
  font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink);
  background:var(--highlight); border:1px solid var(--panel-border); border-radius:999px;
  padding:6px 13px; cursor:pointer; transition:border-color .15s ease, background .15s ease;
}
.subject-modal .sm-chip:hover{ border-color:var(--ochre); background:#fff; }
.subject-modal .sm-chip.selected{ background:var(--ink); color:#fff; border-color:var(--ink); }
.subject-modal .sm-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
.subject-modal .sm-skip{
  font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted);
  background:none; border:none; cursor:pointer; padding:10px 4px;
}
.subject-modal .sm-skip:hover{ color:var(--ink); }
.subject-modal .sm-go{
  font-family:'Source Serif 4', serif; font-size:15px; font-weight:600;
  background:var(--ink); color:#fff; border:none; border-radius:9px;
  padding:11px 22px; cursor:pointer;
}
.subject-modal .sm-go:hover{ background:#0f1c2c; }

.side-panel{
  position:fixed;
  top:0;left:0;bottom:0;
  width:360px;
  background:var(--panel);
  border-right:1px solid var(--panel-border);
  z-index:30;
  transform:translateX(-100%);
  transition:transform .25s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;
  box-shadow:8px 0 30px rgba(0,0,0,0.08);
  padding-left:var(--safe-left);
  padding-bottom:var(--safe-bottom);
}
.side-panel.open{transform:translateX(0);}

/* Transcript-only panel: mirror of .side-panel, docked to the right
   instead of the left, so Menu (sidebar) and Transcript (conversation
   log + ask box) never fight over the same slide-out panel. */
.conv-panel{
  left:auto; right:0;
  border-right:none; border-left:1px solid var(--panel-border);
  box-shadow:-8px 0 30px rgba(0,0,0,0.08);
  transform:translateX(100%);
  padding-left:0; padding-right:var(--safe-right, 0);
}
.conv-panel.open{transform:translateX(0);}

.panel-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:calc(18px + var(--safe-top)) 20px 18px;border-bottom:1px solid var(--panel-border);
  flex-shrink:0;
}
.panel-head h1{
  font-size:19px;margin:0;font-weight:600;
}
.panel-head h1 em{color:var(--ochre);font-style:italic;}
.panel-close{
  background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);
}

.panel-body{flex:1;overflow-y:auto;}
.p-section{padding:16px 20px;border-bottom:1px solid var(--panel-border);}
.p-section h2{
  font-family:'JetBrains Mono', monospace;
  font-size:10.5px;letter-spacing:0.4px;color:var(--muted);
  margin:0 0 10px 0;
  display:flex;justify-content:space-between;align-items:center;
}
.link-btn{
  font-family:'JetBrains Mono', monospace;font-size:10px;
  color:var(--ochre);background:none;border:none;cursor:pointer;
}
.link-btn:hover{text-decoration:underline;}
.session-toggle{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;padding:8px 10px;margin-bottom:8px;
  border:1px solid var(--panel-border);border-radius:8px;
  background:var(--highlight);cursor:pointer;
  font-family:'Source Serif 4', Georgia, serif;font-size:13px;font-weight:600;
  color:var(--ink);text-align:left;
}
.session-toggle:hover{border-color:var(--ochre);}
.session-toggle .st-chevron{
  font-size:10px;color:var(--muted);transition:transform 0.15s ease;
  flex-shrink:0;margin-left:8px;
}
.session-toggle.open .st-chevron{transform:rotate(90deg);}
.account-row{display:flex;align-items:center;gap:8px;}

.upload-zone{
  border:1.5px dashed #d8d2bd;border-radius:6px;padding:14px;
  text-align:center;cursor:pointer;font-size:13px;color:#7a7361;
  transition:border-color .15s ease;
}
.upload-zone:hover{border-color:var(--ochre);}
.upload-zone.has-file{border-style:solid;border-color:var(--sage);color:var(--ink);text-align:left;}
.file-name{font-weight:600;font-size:12.5px;}
.file-meta{font-family:'JetBrains Mono', monospace;font-size:10px;color:var(--muted);margin-top:3px;}
#pdf-input{display:none;}

.topic-input{
  width:100%;padding:10px 11px;border:1px solid var(--panel-border);border-radius:6px;
  font-family:'Source Serif 4', serif;font-size:13px;resize:none;height:56px;
}
.topic-input:focus{outline:none;border-color:var(--ochre);}
select.topic-input{font-family:'Source Serif 4', serif;background:#fff;cursor:pointer;}
.p-row{display:flex;gap:8px;margin-top:9px;}
.p-btn{
  flex:1;font-family:'Source Serif 4', serif;font-size:13px;
  border:1px solid var(--ink);background:transparent;color:var(--ink);
  padding:8px 10px;border-radius:5px;cursor:pointer;
}
.p-btn.primary{background:var(--ink);color:#fff;}
.p-btn:hover{background:var(--ochre);border-color:var(--ochre);color:#fff;}

.session-list{max-height:130px;overflow-y:auto;display:none;flex-direction:column;gap:6px;}
.session-list.open{display:flex;}
.session-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 9px;border:1px solid var(--panel-border);border-radius:5px;
  font-size:12px;cursor:pointer;
}
.session-item:hover{border-color:var(--ochre);}
.session-item .s-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
.session-item .s-date{font-family:'JetBrains Mono', monospace;font-size:9.5px;color:var(--muted);flex-shrink:0;margin-left:8px;}
.session-item .s-delete{border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 4px;margin-left:6px;flex-shrink:0;border-radius:4px;}
.session-item .s-delete:hover{color:#b3452f;background:#FBEDE9;}

.transcript{padding:14px 20px;display:flex;flex-direction:column;gap:12px;}
.msg{font-size:13px;line-height:1.5;}
.msg .who{font-family:'JetBrains Mono', monospace;font-size:9.5px;letter-spacing:0.3px;display:block;margin-bottom:3px;}
.msg.tutor .who{color:var(--ochre);}
.msg.user .who{color:var(--sage);}
.msg.user{color:#514d41;padding-left:9px;border-left:2px solid var(--sage);}
.empty-note{font-size:12px;color:var(--muted);font-style:italic;}

.quiz-card{background:#fdfcf7;border:1px solid var(--panel-border);border-radius:6px;padding:14px;margin-top:2px;}
.quiz-q{font-size:13px;font-weight:600;margin-bottom:9px;line-height:1.4;}
.quiz-opt{
  display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:6px;
  border:1px solid var(--panel-border);border-radius:5px;background:#fff;
  font-family:'Source Serif 4', serif;font-size:12.5px;cursor:pointer;
}
.quiz-opt:hover{border-color:var(--ochre);}
.quiz-opt.correct{background:#eaf1ec;border-color:var(--sage);}
.quiz-opt.incorrect{background:#f6e9e5;border-color:var(--brick);}
.quiz-opt:disabled{cursor:default;}
.quiz-explain{font-size:12px;margin-top:9px;padding-top:9px;border-top:1px solid var(--panel-border);color:#514d41;display:none;}
.quiz-explain.show{display:block;}

/* The on-canvas quiz card. Lives in its own fixed, full-viewport,
   pointer-events:none layer (#board-quiz-overlay) directly on top of
   the board canvas, so it can never intercept pan/zoom gestures on the
   canvas underneath it except over the card itself. The card's own
   position is set in JS (left/top, in screen px) to track wherever
   globalCursorY currently is in world space, re-anchored on every
   redrawAll() so it stays glued to the same spot on the page through
   pan/zoom exactly like a real drawn element would. */
#board-quiz-overlay{
  position:fixed; inset:0; z-index:15; pointer-events:none;
}
.board-quiz-card{
  position:absolute; pointer-events:auto;
  width:min(92vw, 460px);
  background:#fdfcf7; border:1.5px solid var(--panel-border); border-radius:10px;
  padding:18px 20px; box-shadow:0 8px 28px rgba(30,43,58,0.18);
  animation: quizPop .28s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes quizPop{ from{ opacity:0; transform:translateY(10px) scale(.97); } to{ opacity:1; transform:translateY(0) scale(1); } }
.board-quiz-card .quiz-q{font-size:16px;margin-bottom:12px;}
.board-quiz-card .quiz-opt{font-size:14.5px;padding:10px 12px;}
.board-quiz-card .quiz-explain{font-size:13px;}

::-webkit-scrollbar{width:7px;}
::-webkit-scrollbar-thumb{background:#e4ddc8;border-radius:4px;}

/* ============================================================
   DEVICE TIERS
   Everything above this point is the DESKTOP/LAPTOP layout —
   it's the sensible default for a mouse-driven, generously-sized
   viewport (1366x768 and up). The two tiers below only ever
   override variables and the handful of rules that genuinely
   need a different arrangement on a smaller or touch-first
   screen; they never fight the base rules with duplicate
   selectors. Detection intentionally avoids user-agent sniffing
   (iPadOS Safari reports itself as a desktop browser) and instead
   combines viewport size, orientation and pointer/hover capability
   — all of which recompute live on resize/rotation with no JS
   and no page reload required.
   ============================================================ */

/* ---------- TABLET / iPAD ----------
   Real touch tablets in the iPad size class. Requiring
   pointer:coarse keeps a resized desktop browser window at the
   same width from being treated as a tablet (it'll just get a
   slightly narrower desktop layout instead, which is correct for
   a mouse). */
@media (pointer:coarse) and (min-width:601px) and (max-width:1400px) and (orientation:portrait),
       (pointer:coarse) and (min-height:501px) and (max-width:1400px) and (orientation:landscape){
  :root{
    --content-padding:28px;
    --control-size:46px;
    --control-size-sm:44px;
    --control-gap:14px;
    --top-control-height:96px;
    --bottom-control-height:150px;
    --ask-zone-width:min(720px, 66vw);
    --caption-max-width:620px;
    --side-panel-w:min(400px, 86vw);
  }
  .board-quiz-card{ width:min(80vw, 440px); }
  .side-panel{ width:min(400px, 86vw); }

  /* Touch devices in this tier (iPads of every size, big Android
     tablets) previously kept the desktop default of stacking the
     Home/Export PDF/Menu icons in a tall vertical column in the
     top-left corner. That column's height fed straight into
     measureLayoutInsets()'s top gutter (see the canvas camera code),
     so the AI's handwriting had to start well below it — often
     looking like it "starts in the middle" of the board on a tablet.
     A compact horizontal row keeps the top bar short, same fix the
     phone tier already applies below. */
  .topbar-left-stack{ flex-direction:row; align-items:flex-start; gap:10px; }
}

/* iPad portrait specifically: keep the whiteboard visually centered
   with breathing room on both sides rather than bleeding edge to
   edge like a phone. */
@media (pointer:coarse) and (min-width:601px) and (max-width:1400px) and (orientation:portrait){
  .bottom-bar{ padding-left:calc(var(--content-padding) + 6vw); padding-right:calc(var(--content-padding) + 6vw); }
  .speaker-row{ padding-left:calc(var(--content-padding) + 6vw); padding-right:calc(var(--content-padding) + 6vw); }
}

/* iPad landscape: more horizontal room for the Ask bar, controls
   pulled toward the edges instead of stretching everything wide. */
@media (pointer:coarse) and (min-height:501px) and (max-width:1400px) and (orientation:landscape){
  :root{ --ask-zone-width:min(780px, 62vw); }
}

/* ---------- PHONE ----------
   Narrow phones in portrait, and the same phones rotated to
   landscape (identified by short viewport height rather than
   width, since a landscape phone can be as "wide" as a portrait
   tablet). This tier is deliberately width/height driven — not
   gated on pointer type — so a narrow desktop browser window also
   collapses into the compact, single-column control layout, per
   the "recalculates on resize" requirement. */
@media (max-width:600px) and (orientation:portrait),
       (max-height:500px) and (orientation:landscape){
  :root{
    --content-padding:14px;
    --control-size:44px;
    --control-size-sm:44px;
    --control-gap:8px;
    --top-control-height:60px;
    --bottom-control-height:170px;
    --ask-zone-width:520px;
    --caption-max-width:100%;
  }

  /* Reclaim vertical space: the three top-left icons go from a
     tall vertical stack to a compact horizontal row so they don't
     eat a quarter of a short phone screen. */
  .topbar-left-stack{ flex-direction:row; align-items:flex-start; gap:6px; }
  .topbar-btn-wrap .btn-label{ font-size:8px; }
  .top-right-cluster{ margin-top:34px; }
  .status-chip{ font-size:9.5px; padding:5px 8px; }

  /* Bottom controls stay on ONE strict row — Replay, Ask, Talk,
     Transcript — on every device including small phones, matching
     the fixed layout used everywhere else. The ask bar itself is the
     only flexible piece (flex:1 1 auto on .ask-zone, set in the base
     rule) and shrinks to fit the remaining space between the four
     fixed-size round controls. */
  .bottom-bar{ justify-content:space-between; gap:6px; }

  .speaker-row{ padding:0 10px; }
  .caption-zone{ padding:8px 12px 6px; }
  .caption-text{ font-size:14px; }
  .avatar{ width:40px; height:40px; font-size:18px; }
  .tutor-live{ font-size:9.5px; padding:4px 8px; }

  .login-pill{ padding:7px 12px; font-size:11px; }
  .side-panel{ width:100vw; width:100dvw; }
  .subject-modal .sm-card{ padding:26px 20px 22px; }
}

/* Landscape phones specifically: the screen is short, so trim the
   vertical padding further and keep the caption a single line's
   worth of room instead of the taller portrait allowance. */
@media (max-height:500px) and (orientation:landscape){
  .topbar{ padding-top:calc(var(--safe-top) + 8px); padding-bottom:4px; }
  .bottom-bar{ padding-top:6px; padding-bottom:6px; }
  .caption-zone{ padding:6px 12px 4px; min-height:0; }
  .avatar{ width:34px; height:34px; font-size:16px; }
}

/* ---------- LANDSCAPE: dock the transcript panel instead of
   overlaying it ----------
   On a short phone in landscape (max-height:500px, handled above)
   the panel already goes full-width by design, so there's no room
   to "dock" it beside anything — that case is left alone. On every
   other landscape screen (tablet/desktop, where the panel is a
   fixed 360-400px column rather than the full viewport), opening
   the transcript used to slide a panel on top of the whiteboard,
   covering whatever was just written. Docking it instead — shrinking
   the board rather than covering it — leaves the handwriting fully
   visible and gives the transcript text real, uncramped width. */
@media (orientation:landscape) and (min-height:501px){
  #board-wrap{
    left:0; width:100%;
    transition:left .3s cubic-bezier(.22,.9,.32,1.1), width .3s cubic-bezier(.22,.9,.32,1.1);
  }
  body.panel-open #board-wrap{ left:var(--side-panel-w); width:calc(100% - var(--side-panel-w)); }
  /* Docked (not floating over the board), so no dimming scrim over
     the canvas and no drop-shadow pretending to float above it. */
  body.panel-open .side-panel{ box-shadow:none; }
  body.panel-open .overlay{ display:none; }
  /* The quiz card docks to the right edge of the now-visible transcript
     column instead of chasing the pen's on-canvas position — see
     repositionQuizOverlay(). */
  body.panel-open .board-quiz-card{ left:calc(var(--side-panel-w) + 18px) !important; }
}
</style>
</head>
