// ---------- "Tutor is speaking" UI (avatar ring + ask-zone halo) ----------
// Single choke point for the speaking on/off state so the avatar and the
// follow-up ask box can never drift out of sync with each other or with
// what's actually playing. When real Edge TTS audio is behind ttsAudioEl we
// also drive --voice-amp from its actual amplitude (Web Audio API) each
// frame, so the ask-zone's glow genuinely swells and settles with her
// voice rather than just running on a fixed rhythm.
const askZone = document.getElementById('ask-zone');
let voiceAnalyser = null, voiceDataArray = null, voiceAudioCtx = null, voiceRafId = null;

function ensureVoiceAnalyser(){
  if(voiceAnalyser || !askZone) return voiceAnalyser;
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    voiceAudioCtx = new Ctx();
    const src = voiceAudioCtx.createMediaElementSource(ttsAudioEl);
    voiceAnalyser = voiceAudioCtx.createAnalyser();
    voiceAnalyser.fftSize = 256;
    voiceAnalyser.smoothingTimeConstant = 0.55;
    // Analyser must stay in the graph between the element and the
    // speakers, or routing audio through Web Audio at all would go
    // silent instead of just being "tapped" for its levels.
    src.connect(voiceAnalyser);
    voiceAnalyser.connect(voiceAudioCtx.destination);
    voiceDataArray = new Uint8Array(voiceAnalyser.frequencyBinCount);
    logVoice('AudioContext created, initial state=' + voiceAudioCtx.state);
  }catch(e){
    // Web Audio unavailable/blocked (or ttsAudioEl already routed
    // elsewhere) — the CSS keyframe pulse still runs fine without it.
    voiceAnalyser = null;
    logVoice('ensureVoiceAnalyser() threw: ' + (e && e.message || e));
  }
  return voiceAnalyser;
}

function voiceLevelLoop(){
  if(!askZone || !askZone.classList.contains('tutor-speaking')){ voiceRafId = null; return; }
  if(voiceAnalyser && !ttsAudioEl.paused){
    voiceAnalyser.getByteFrequencyData(voiceDataArray);
    let sum = 0;
    for(let i=0;i<voiceDataArray.length;i++) sum += voiceDataArray[i];
    const level = (sum / voiceDataArray.length) / 255; // 0..1
    const prev = parseFloat(askZone.style.getPropertyValue('--voice-amp')) || 0;
    // Ease toward the new reading instead of snapping — reads as a
    // natural swell/settle rather than a jittery frame-to-frame flicker.
    askZone.style.setProperty('--voice-amp', (prev + (level - prev) * 0.35).toFixed(3));
  }
  voiceRafId = requestAnimationFrame(voiceLevelLoop);
}

function setTutorSpeakingUI(active){
  avatar.classList.toggle('speaking', active);
  if(!askZone) return;
  askZone.classList.toggle('tutor-speaking', active);
  if(active){
    ensureVoiceAnalyser();
    if(voiceAudioCtx && voiceAudioCtx.state === 'suspended') voiceAudioCtx.resume().catch(()=>{});
    if(!voiceRafId) voiceRafId = requestAnimationFrame(voiceLevelLoop);
  } else if(voiceRafId){
    cancelAnimationFrame(voiceRafId);
    voiceRafId = null;
    askZone.style.setProperty('--voice-amp', '0');
  }
}

// Fetches one chunk of speech audio from the Edge TTS proxy route and
// returns an object URL for it. Throws on failure; the caller decides
// whether to retry or fall back.
const EDGE_TTS_TIMEOUT_MS = 20000;
async function fetchEdgeTTSOnce(text){
  const ctrl = new AbortController();
  const timer = setTimeout(()=> ctrl.abort(), EDGE_TTS_TIMEOUT_MS);
  try{
    let response;
    try{
      response = await fetch(`${PROXY_URL}/edge-tts`, {
        method:"POST",
        headers:Object.assign({"Content-Type":"application/json"}, chalklineAuthHeaders()),
        body: JSON.stringify({ text }),
        signal: ctrl.signal
      });
    } catch(networkErr){
      logVoice('Edge TTS fetch NETWORK ERROR (' + PROXY_URL + '/edge-tts): ' + (networkErr && networkErr.message || networkErr));
      throw networkErr;
    }
    if(!response.ok){
      let msg = `HTTP ${response.status}`;
      try{ const errJson = await response.json(); msg = (errJson.error && errJson.error.message) || msg; } catch(e){ /* body wasn't JSON */ }
      logVoice('Edge TTS fetch returned ' + msg);
      const err = new Error(msg);
      err.status = response.status;
      throw err;
    }
    const blob = await response.blob();
    if(!blob || !blob.size){
      logVoice('Edge TTS response OK but blob was empty/missing');
      throw new Error('Empty audio response');
    }
    logVoice('Edge TTS fetch OK, blob size=' + blob.size + ' type=' + blob.type);
    return URL.createObjectURL(blob);
  } finally {
    clearTimeout(timer);
  }
}

// Edge TTS is the main voice, so a hiccup (dropped connection, timeout, 429
// rate limit, 5xx from the worker) gets up to 3 tries with a short backoff
// before anyone hears the browser voice. Other 4xx errors won't fix
// themselves, so those fail straight away.
async function fetchEdgeTTS(text){
  const MAX_ATTEMPTS = 3;
  let lastErr;
  for(let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++){
    try{ return await fetchEdgeTTSOnce(text); }
    catch(err){
      lastErr = err;
      const retryable = !err.status || err.status === 429 || err.status >= 500;
      if(!retryable || attempt === MAX_ATTEMPTS) break;
      await new Promise(r => setTimeout(r, 400 * attempt));
    }
  }
  throw lastErr;
}

// chunk text -> Promise<object URL>. Lets speak() start fetching the next
// chunk while the current one plays (no silent gap between sentences) and
// makes Replay instant, with no new API calls. Failed fetches are dropped
// so a later attempt starts fresh.
const ttsCache = new Map();
const TTS_CACHE_MAX = 60;
function getEdgeAudioUrl(text){
  let p = ttsCache.get(text);
  if(!p){
    p = fetchEdgeTTS(text);
    ttsCache.set(text, p);
    p.catch(()=>{ if(ttsCache.get(text) === p) ttsCache.delete(text); });
    while(ttsCache.size > TTS_CACHE_MAX){
      const oldestKey = ttsCache.keys().next().value;
      const oldest = ttsCache.get(oldestKey);
      ttsCache.delete(oldestKey);
      oldest.then(u => URL.revokeObjectURL(u)).catch(()=>{});
    }
  }
  return p;
}

// Plays one already-fetched Edge TTS clip through ttsAudioEl. Resolves true
// on a clean finish, false on any playback failure — never rejects.
function playEdgeChunk(url){
  return new Promise((resolve) => {
    ttsAudioEl.onended = () => { logVoice('ttsAudioEl ended normally'); resolve(true); };
    ttsAudioEl.onerror = () => {
      const err = ttsAudioEl.error;
      logVoice('ttsAudioEl error event, code=' + (err && err.code) + ' ctxState=' + (voiceAudioCtx ? voiceAudioCtx.state : 'no-ctx'));
      resolve(false);
    };
    ttsAudioEl.src = url;
    setTutorSpeakingUI(true);
    const p = ttsAudioEl.play();
    if(p && p.then){
      p.then(()=> logVoice('ttsAudioEl.play() resolved, audioUnlocked=' + audioUnlocked + ' ctxState=' + (voiceAudioCtx ? voiceAudioCtx.state : 'no-ctx')))
       .catch(err => { logVoice('ttsAudioEl.play() REJECTED: ' + (err && err.message || err)); resolve(false); });
    }
  });
}

function speak(text){
  window.speechSynthesis && window.speechSynthesis.cancel();
  ttsAudioEl.pause();
  ttsAudioEl.onended = null;
  ttsAudioEl.onerror = null;
  const myToken = ++currentSpeechToken;
  currentUtteranceText = text;
  const chunks = splitIntoSpeechChunks(text);
  let searchPos = 0;
  const chunkOffsets = chunks.map(c => {
    const idx = text.indexOf(c, searchPos);
    searchPos = idx >= 0 ? idx + c.length : searchPos;
    return idx >= 0 ? idx : searchPos;
  });

  const voice = getSelectedVoice();
  // Edge TTS is tried for every chunk. If it fails a chunk even after
  // retries, only THAT chunk uses the browser voice and Edge TTS is tried
  // again on the next one. Only if it fails several chunks in a row (the
  // proxy is clearly down) do we stop trying for the rest of this turn,
  // so the tutor doesn't stall on retries before every sentence.
  const EDGE_GIVE_UP_STREAK = 0; // 0 = Edge TTS disabled: the tutor speaks with the browser voice only
  let edgeFailStreak = 0;

  function prefetch(i){
    if(i < chunks.length && edgeFailStreak < EDGE_GIVE_UP_STREAK){
      getEdgeAudioUrl(chunks[i]).catch(()=>{});
    }
  }
  prefetch(0);
  prefetch(1);

  function speakChunkBrowser(i){
    if(!('speechSynthesis' in window)){
      setTutorSpeakingUI(false);
      setVoiceStatus('error', 'No speech synthesis available on this device/browser');
      return;
    }
    const utter = new SpeechSynthesisUtterance(chunks[i]);
    utter.rate = 0.96;
    utter.pitch = 1.0;
    utter.volume = 1.0; // Enforces maximum browser volume output
    if(voice) utter.voice = voice;
    utter.onstart = () => { utter.hasStarted = true; logVoice('browser utterance started, voice=' + (voice ? voice.name : 'default')); setTutorSpeakingUI(true); };
    utter.onend = () => {
      if(myToken !== currentSpeechToken) return;
      const pause = /\?\s*$/.test(chunks[i]) ? 260 : 140;
      setTimeout(()=> speakChunk(i+1), pause);
    };
    utter.onerror = (ev) => { logVoice('browser utterance error: ' + (ev && ev.error)); if(myToken === currentSpeechToken) speakChunk(i+1); };
    logVoice('speechSynthesis.speak() called, synth.speaking=' + window.speechSynthesis.speaking + ' synth.paused=' + window.speechSynthesis.paused);
    window.speechSynthesis.speak(utter);
    // If onstart never fires within a couple seconds, the call was
    // silently dropped (no event at all) rather than erroring — that's
    // the iOS "speak() outside a real gesture does nothing" failure
    // mode. Detect and log it, then move on instead of hanging forever.
    setTimeout(()=>{
      if(myToken === currentSpeechToken && !utter.hasStarted){
        logVoice('speechSynthesis.speak() never started (silently dropped) — synth.speaking=' + window.speechSynthesis.speaking);
      }
    }, 2500);
  }

  async function speakChunk(i){
    if(myToken !== currentSpeechToken) return;
    if(i >= chunks.length){ setTutorSpeakingUI(false); return; }
    renderCaption(text, chunkOffsets[i], chunks[i]);

    if(edgeFailStreak < EDGE_GIVE_UP_STREAK){
      let ok = false;
      try{
        const url = await getEdgeAudioUrl(chunks[i]);
        if(myToken !== currentSpeechToken) return;
        prefetch(i+1); // fetch the next sentence while this one plays
        ok = await playEdgeChunk(url);
      } catch(err){ ok = false; }
      if(myToken !== currentSpeechToken) return;
      if(ok){
        edgeFailStreak = 0;
        setVoiceStatus('edge');
        const pause = /\?\s*$/.test(chunks[i]) ? 260 : 140;
        setTimeout(()=> speakChunk(i+1), pause);
        return;
      }
      edgeFailStreak++;
      console.warn('Edge TTS failed for this sentence after retries; using browser voice for it.');
    }
    setVoiceStatus('browser');
    speakChunkBrowser(i);
  }
  speakChunk(0);
}
document.getElementById('btn-replay').addEventListener('click', ()=>{ if(currentUtteranceText) speak(currentUtteranceText); });

function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

let recognition=null, listening=false, pttTranscript='';
const micBtn = document.getElementById('btn-mic');
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRec){
  recognition = new SpeechRec();
  // Push-to-talk: continuous so a brief pause mid-sentence doesn't
  // auto-stop the mic — recognition only ends when the button is
  // actually released (stopPTT -> recognition.stop()).
  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.lang = 'en-US';
  recognition.onresult = (e)=>{
    for(let i=e.resultIndex; i<e.results.length; i++){
      if(e.results[i].isFinal) pttTranscript += (pttTranscript ? ' ' : '') + e.results[i][0].transcript;
    }
  };
  recognition.onend = ()=>{
    listening=false; micBtn.classList.remove('live');
    const said = pttTranscript.trim();
    pttTranscript = '';
    if(said) handleAsk(said);
  };
  recognition.onerror = ()=>{ listening=false; micBtn.classList.remove('live'); pttTranscript=''; };
} else {
  micBtn.classList.add('unsupported');

}
function startPTT(e){
  if(e) e.preventDefault();

  pttTranscript = '';

}
function stopPTT(){
  if(!recognition || !listening) return;

}

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  console.error('pdf.js failed to load from CDN — PDF import will be disabled for this session.');

async function handlePdfFile(file){
  if(!pdfjsAvailable){ alert('PDF import couldn\'t load its engine (a network or blocker issue). Try reloading the page.'); return; }
  if(file.type !== 'application/pdf'){ alert('Please choose a PDF file.'); return; }
  setStatus('reading pdf…');
  pdfFileName = file.name;
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
  let fullText = '';
  const maxPages = Math.min(pdf.numPages, 40);
  for(let i=1;i<=maxPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    fullText += `\n\n[Page ${i}]\n` + content.items.map(it=>it.str).join(' ');
  }
  pdfText = fullText;
  uploadZone.classList.add('has-file');
  uploadZone.innerHTML = `<div class="file-name">📄 ${escapeHtml(pdfFileName)}</div><div class="file-meta">${pdf.numPages} pages · text extracted</div>`;
  setStatus('pdf ready');
}
