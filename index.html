<script>
(function(){
  const shell = document.getElementById('app-shell');
  const sbScrim = document.getElementById('sidebar-scrim');
  function closeSidebar(){ shell.classList.add('sidebar-closed'); document.body.classList.add('sb-closed'); }
  function openSidebar(){ shell.classList.remove('sidebar-closed'); document.body.classList.remove('sb-closed'); }
  document.getElementById('sidebar-toggle').addEventListener('click', ()=>
    shell.classList.contains('sidebar-closed') ? openSidebar() : closeSidebar()
  );
  sbScrim.addEventListener('click', closeSidebar);
  if (window.innerWidth <= 700) closeSidebar();
})();

/* ---------------------------------------------------------------
   window.storage shim: the real window.storage API only exists
   inside the Claude.ai artifact preview sandbox — on a real
   deployed site (like this one, on GitHub Pages) it doesn't exist
   at all, so every call used to throw and autosave failed silently.
   This shim gives the same get/set/list/delete interface, backed
   by localStorage, so saving actually works once deployed. Swap
   this out for real fetch() calls to your own backend later if you
   want saves to sync across devices instead of staying per-browser.
   ------------------------------------------------------------- */
if(!window.storage || !window.storage.__isRealBackend){
  const STORAGE_NS = 'chalkline:';
  window.storage = {
    __isRealBackend: false,
    async get(key){
      const raw = localStorage.getItem(STORAGE_NS + key);
      return raw === null ? null : { key, value: raw, shared: false };
    },
    async set(key, value){
      try{ localStorage.setItem(STORAGE_NS + key, value); return { key, value, shared: false }; }
      catch(e){ console.error('localStorage set failed:', e); return null; }
    },
    async delete(key){
      const existed = localStorage.getItem(STORAGE_NS + key) !== null;
      localStorage.removeItem(STORAGE_NS + key);
      return { key, deleted: existed, shared: false };
    },
    async list(prefix){
      const keys = [];
      const full = STORAGE_NS + (prefix || '');
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(full)) keys.push(k.slice(STORAGE_NS.length));
      }
      return { keys, prefix, shared: false };
    }
  };
}

/* ---------------- Course scoping ----------------
   Opened from a course card on the Dashboard, the shell sends
   presetSubject and this page shows only that course's items, with a
   back link to the course. Opened without one (sidebar link), it shows
   everything, exactly as before. */
let historySubjectTH = null;
function applyScopeTH(){
  const scoped = !!historySubjectTH;
  document.getElementById('th-title').textContent = scoped ? "Live tutor" : "Previous tutorials";
  document.getElementById('th-sub').textContent = scoped
    ? "Your previous lessons for " + historySubjectTH + ". Pick one to continue, or start a new lesson."
    : "Your saved whiteboard lessons, grouped by subject or course.";
  document.getElementById('th-back').style.display = scoped ? 'inline-flex' : 'none';
  document.getElementById('th-back-name').textContent = scoped ? historySubjectTH : '';
}
function startNewTH(){
  parent.postMessage(historySubjectTH
    ? { nav:'tutor', presetSubject: historySubjectTH }
    : { nav:'tutor' }, '*');
}
function goBackToCourseTH(){
  parent.postMessage(historySubjectTH
    ? { nav:'home', openCourse: historySubjectTH }
    : { nav:'home' }, '*');
}
window.addEventListener('message', (e)=>{
  const d = e.data;
  if(!d) return;
  if(d.presetSubject){ historySubjectTH = d.presetSubject; }
  else if(d.chalklineClearSubject){ historySubjectTH = null; }
  else return;
  applyScopeTH();
  refreshTutorHistory();
});

let thUser = null;

function escapeHtmlTH(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

function sessionKeyPrefixTH(){
  return 'session:' + thUser.sub + ':';
}

window.addEventListener('message', (e)=>{
  const d = e.data;
  if(!d || !d.chalklineAuth) return;
  thUser = d.signedIn ? d.user : null;
  refreshTutorHistory();
});

let sessionListReqTH = 0;

// Each subject folder gets a distinct color + icon, derived
// deterministically from its name (a simple string hash), so the same
// subject always looks the same across visits instead of colors
// shuffling around on every reload.
const FOLDER_PALETTE = [
  { accent:'#2E7DBE', tint:'#EAF4FD', icon:'📘' },
  { accent:'#3E8FA6', tint:'#E9F6F7', icon:'📗' },
  { accent:'#C0392B', tint:'#FBEDE9', icon:'📕' },
  { accent:'#D96B27', tint:'#FDF1E7', icon:'📙' },
  { accent:'#6C3483', tint:'#F3EBF7', icon:'📔' },
  { accent:'#2A8A5D', tint:'#EAF7F0', icon:'📓' },
  { accent:'#B7950B', tint:'#FBF6E3', icon:'📒' },
  { accent:'#5D6D7E', tint:'#EEF1F3', icon:'🗂️' }
];
function folderStyleFor(subj){
  if(subj === 'Unsorted') return { accent:'#7C93A8', tint:'#F3F5F7', icon:'🗒️' };
  let hash = 0;
  for(let i=0;i<subj.length;i++){ hash = (hash*31 + subj.charCodeAt(i)) | 0; }
  return FOLDER_PALETTE[Math.abs(hash) % FOLDER_PALETTE.length];
}

async function refreshTutorHistory(){
  const myReq = ++sessionListReqTH;
  const content = document.getElementById('th-content');
  if(!thUser){
    // Nothing is ever saved while signed out (persistSession refuses to
    // write without an account), so there's nothing real to list here —
    // and we must not query a shared 'local' bucket that could surface
    // a previous guest's leftover sessions.
    content.innerHTML = '<div class="signin-note">Sign in to save tutorials to your account and see them here.</div>';
    return;
  }
  try{
    const result = await window.storage.list(sessionKeyPrefixTH(), false);
    if(myReq !== sessionListReqTH) return; // a newer auth state has since started its own refresh
    const keys = (result && result.keys) ? result.keys : [];
    if(keys.length===0){
      content.innerHTML = '<div class="empty-state">No saved tutorials yet — start a lesson and it will show up here.</div>';
      return;
    }
    const items = [];
    for(const key of keys){
      try{ const rec = await window.storage.get(key, false); if(rec) items.push(JSON.parse(rec.value)); } catch(e){}
    }
    if(myReq !== sessionListReqTH) return;
    items.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));

    const visibleItems = historySubjectTH
      ? items.filter(i => (i.subject || 'Unsorted') === historySubjectTH)
      : items;
    if(visibleItems.length === 0){
      content.innerHTML = '<div class="empty-state">No lessons for ' + escapeHtmlTH(historySubjectTH) + ' yet — start a new lesson and it will show up here.</div>';
      return;
    }

    const groups = {};
    visibleItems.forEach(item=>{
      const subj = item.subject || 'Unsorted';
      if(!groups[subj]) groups[subj] = [];
      groups[subj].push(item);
    });
    const subjects = Object.keys(groups).sort((a,b)=>{
      if(a==='Unsorted') return 1;
      if(b==='Unsorted') return -1;
      return (groups[b][0].savedAt||0) - (groups[a][0].savedAt||0);
    });

    content.innerHTML = '';
    subjects.forEach((subj, idx)=>{
      const style = folderStyleFor(subj);
      const folder = document.createElement('div');
      folder.className = 'folder';
      folder.style.borderTopColor = style.accent;
      folder.style.borderTopWidth = '3px';
      const head = document.createElement('div');
      head.className = 'folder-head';
      head.innerHTML = `
        <div class="folder-icon" style="background:${style.tint};color:${style.accent};">${style.icon}</div>
        <div class="folder-title">${escapeHtmlTH(subj)}</div>
        <div class="folder-count" style="color:${style.accent};background:${style.tint};">${groups[subj].length} lesson${groups[subj].length===1?'':'s'}</div>
        <div class="folder-chevron" style="color:${style.accent};"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6 3.5 11 8l-5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      `;
      head.addEventListener('click', ()=> folder.classList.toggle('open'));
      const body = document.createElement('div');
      body.className = 'folder-body';
      groups[subj].forEach(item=>{
        const row = document.createElement('div');
        row.className = 'tutorial-row';
        const date = new Date(item.savedAt);
        row.innerHTML = `
          <span class="t-name">${escapeHtmlTH(item.title||'Untitled')}</span>
          <span class="t-topic">${escapeHtmlTH(item.currentTopicLabel||'')}</span>
          <span class="t-date">${date.toLocaleDateString()}</span>
          <button type="button" class="t-delete" title="Delete">✕</button>
        `;
        row.addEventListener('click', ()=> parent.postMessage({nav:'tutor', loadSessionId:item.id}, '*'));
        row.querySelector('.t-delete').addEventListener('click', async (ev)=>{
          ev.stopPropagation();
          if(!confirm('Delete this saved tutorial? This can\'t be undone.')) return;
          try{
            await window.storage.delete(sessionKeyPrefixTH() + item.id, false);
            refreshTutorHistory();
          } catch(e){ console.error('Delete tutorial failed:', e); }
        });
        body.appendChild(row);
      });
      if(!historySubjectTH) folder.appendChild(head);
      folder.appendChild(body);
      if(historySubjectTH){ folder.classList.add('open'); body.style.maxHeight = 'none'; folder.style.borderTop = '1px solid var(--panel-border)'; }
      content.appendChild(folder);

      // set an actual pixel max-height so the CSS transition can open it
      requestAnimationFrame(()=>{
        if(folder.classList.contains('open')) body.style.maxHeight = body.scrollHeight + 'px';
      });
    });

    // re-measure open folders on any toggle
    content.querySelectorAll('.folder-head').forEach(head=>{
      head.addEventListener('click', ()=>{
        const folder = head.parentElement;
        const body = folder.querySelector('.folder-body');
        body.style.maxHeight = folder.classList.contains('open') ? body.scrollHeight + 'px' : '';
      });
    });
  } catch(err){
    console.error('Loading tutorials failed:', err);
    content.innerHTML = '<div class="empty-hint">Could not load saved tutorials.</div>';
  }
}

refreshTutorHistory();
<\/script>

</body>
</html>
</script>

/* ---- Menu tab ------------------------------------------------------
   Icon only, hinged onto the sidebar's right edge. It lives inside the
   sidebar, so it moves, swings and slides with it (and stays visible at
   the screen edge when the sidebar is closed). */
.app-shell .sidebar .sidebar-toggle{
  position:absolute !important; left:auto !important; right:-28px !important;
  top:calc(20px + var(--safe-top)) !important;

<script>
(function(){
  const shell = document.getElementById('app-shell');
  const sbScrim = document.getElementById('sidebar-scrim');
  function closeSidebar(){ shell.classList.add('sidebar-closed'); document.body.classList.add('sb-closed'); }
  function openSidebar(){ shell.classList.remove('sidebar-closed'); document.body.classList.remove('sb-closed'); }
  document.getElementById('sidebar-toggle').addEventListener('click', ()=>
    shell.classList.contains('sidebar-closed') ? openSidebar() : closeSidebar()
  );
  sbScrim.addEventListener('click', closeSidebar);
  if (window.innerWidth <= 700) closeSidebar();
})();

/* ---------------------------------------------------------------
   window.storage shim: the real window.storage API only exists
   inside the Claude.ai artifact preview sandbox — on a real
   deployed site (like this one, on GitHub Pages) it doesn't exist
   at all, so every call used to throw and autosave failed silently.
   This shim gives the same get/set/list/delete interface, backed
   by localStorage, so saving actually works once deployed. Swap
   this out for real fetch() calls to your own backend later if you
   want saves to sync across devices instead of staying per-browser.
   ------------------------------------------------------------- */
if(!window.storage || !window.storage.__isRealBackend){
  const STORAGE_NS = 'chalkline:';
  window.storage = {
    __isRealBackend: false,
    async get(key){
      const raw = localStorage.getItem(STORAGE_NS + key);
      return raw === null ? null : { key, value: raw, shared: false };
    },
    async set(key, value){
      try{ localStorage.setItem(STORAGE_NS + key, value); return { key, value, shared: false }; }
      catch(e){ console.error('localStorage set failed:', e); return null; }
    },
    async delete(key){
      const existed = localStorage.getItem(STORAGE_NS + key) !== null;
      localStorage.removeItem(STORAGE_NS + key);
      return { key, deleted: existed, shared: false };
    },
    async list(prefix){
      const keys = [];
      const full = STORAGE_NS + (prefix || '');
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(full)) keys.push(k.slice(STORAGE_NS.length));
      }
      return { keys, prefix, shared: false };
    }
  };
}

/* ---------------- Course scoping ----------------
   Opened from a course card on the Dashboard, the shell sends
   presetSubject and this page shows only that course's items, with a
   back link to the course. Opened without one (sidebar link), it shows
   everything, exactly as before. */
let historySubjectSH = null;
function applyScopeSH(){
  const scoped = !!historySubjectSH;
  document.getElementById('sh-title').textContent = scoped ? "Summaries" : "Previous summaries";
  document.getElementById('sh-sub').textContent = scoped
    ? "Your previous summaries for " + historySubjectSH + ". Pick one to reopen it, or summarize a new PDF."
    : "Every PDF summary you've saved to your account.";
  document.getElementById('sh-back').style.display = scoped ? 'inline-flex' : 'none';
  document.getElementById('sh-back-name').textContent = scoped ? historySubjectSH : '';
}
function startNewSH(){
  parent.postMessage(historySubjectSH
    ? { nav:'summary', presetSubject: historySubjectSH }
    : { nav:'summary' }, '*');
}
function goBackToCourseSH(){
  parent.postMessage(historySubjectSH
    ? { nav:'home', openCourse: historySubjectSH }
    : { nav:'home' }, '*');
}
window.addEventListener('message', (e)=>{
  const d = e.data;
  if(!d) return;
  if(d.presetSubject){ historySubjectSH = d.presetSubject; }
  else if(d.chalklineClearSubject){ historySubjectSH = null; }
  else return;
  applyScopeSH();
  refreshSummaryHistory();
});

let shUser = null;

function escapeHtmlSH(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

function summaryKeyPrefixSH(){
  return 'summary:' + shUser.sub + ':';
}

window.addEventListener('message', (e)=>{
  const d = e.data;
  if(!d || !d.chalklineAuth) return;
  shUser = d.signedIn ? d.user : null;
  refreshSummaryHistory();
});

let summaryHistoryReqSH = 0;
async function refreshSummaryHistory(){
  const myReq = ++summaryHistoryReqSH;
  const content = document.getElementById('sh-content');
  if(!shUser){
    // Nothing is ever saved while signed out, so there's nothing real
    // to list — and we must not query a shared 'local' bucket that
    // could surface a previous guest's leftover summaries.
    content.innerHTML = '<div class="signin-note">Sign in to save summaries to your account and see them here.</div>';
    return;
  }
  try{
    const result = await window.storage.list(summaryKeyPrefixSH(), false);
    if(myReq !== summaryHistoryReqSH) return; // superseded by a newer auth state
    const keys = (result && result.keys) ? result.keys : [];
    if(keys.length===0){
      content.innerHTML = '<div class="empty-state">No saved summaries yet — summarize a PDF and it will show up here.</div>';
      return;
    }
    const items = [];
    for(const key of keys){
      try{ const rec = await window.storage.get(key, false); if(rec) items.push(JSON.parse(rec.value)); } catch(e){}
    }
    if(myReq !== summaryHistoryReqSH) return;
    items.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));

    const visibleItems = historySubjectSH
      ? items.filter(i => (i.subject || 'Unsorted') === historySubjectSH)
      : items;
    if(visibleItems.length === 0){
      content.innerHTML = '<div class="empty-state">No summaries for ' + escapeHtmlSH(historySubjectSH) + ' yet — summarize a PDF and it will show up here.</div>';
      return;
    }

    const list = document.createElement('div');
    list.className = 'list';
    visibleItems.forEach(item=>{
      const row = document.createElement('div');
      row.className = 'summary-row';
      const date = new Date(item.savedAt);
      row.innerHTML = `
        <div class="r-icon">📄</div>
        <span class="r-name">${escapeHtmlSH(item.title||'Untitled')}</span>
        <span class="r-file">${escapeHtmlSH(item.pdfFileName||'')}</span>
        <span class="r-date">${date.toLocaleDateString()}</span>
        <button type="button" class="r-delete" title="Delete">✕</button>
      `;
      row.addEventListener('click', ()=> parent.postMessage({nav:'summary', loadSummaryId:item.id}, '*'));
      row.querySelector('.r-delete').addEventListener('click', async (ev)=>{
        ev.stopPropagation();
        if(!confirm('Delete this saved summary? This can\'t be undone.')) return;
        try{
          await window.storage.delete(summaryKeyPrefixSH() + item.id, false);
          refreshSummaryHistory();
        } catch(e){ console.error('Delete summary failed:', e); }
      });
      list.appendChild(row);
    });
    content.innerHTML = '';
    content.appendChild(list);
  } catch(err){
    console.error('Loading summaries failed:', err);
    content.innerHTML = '<div class="empty-hint">Could not load saved summaries.</div>';
  }
}

refreshSummaryHistory();
<\/script>

</script>

<script>
(function(){
  const shell = document.getElementById('app-shell');
  const sbScrim = document.getElementById('sidebar-scrim');
  function closeSidebar(){ shell.classList.add('sidebar-closed'); document.body.classList.add('sb-closed'); }
  function openSidebar(){ shell.classList.remove('sidebar-closed'); document.body.classList.remove('sb-closed'); }
  document.getElementById('sidebar-toggle').addEventListener('click', ()=>
    shell.classList.contains('sidebar-closed') ? openSidebar() : closeSidebar()
  );
  sbScrim.addEventListener('click', closeSidebar);
  if (window.innerWidth <= 700) closeSidebar();
})();

/* ---------------------------------------------------------------
   window.storage shim: the real window.storage API only exists
   inside the Claude.ai artifact preview sandbox — on a real
   deployed site (like this one, on GitHub Pages) it doesn't exist
   at all, so every call used to throw and autosave failed silently.
   This shim gives the same get/set/list/delete interface, backed
   by localStorage, so saving actually works once deployed. Swap
   this out for real fetch() calls to your own backend later if you
   want saves to sync across devices instead of staying per-browser.
   ------------------------------------------------------------- */
if(!window.storage || !window.storage.__isRealBackend){
  const STORAGE_NS = 'chalkline:';
  window.storage = {
    __isRealBackend: false,
    async get(key){
      const raw = localStorage.getItem(STORAGE_NS + key);
      return raw === null ? null : { key, value: raw, shared: false };
    },
    async set(key, value){
      try{ localStorage.setItem(STORAGE_NS + key, value); return { key, value, shared: false }; }
      catch(e){ console.error('localStorage set failed:', e); return null; }
    },
    async delete(key){
      const existed = localStorage.getItem(STORAGE_NS + key) !== null;
      localStorage.removeItem(STORAGE_NS + key);
      return { key, deleted: existed, shared: false };
    },
    async list(prefix){
      const keys = [];
      const full = STORAGE_NS + (prefix || '');
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(full)) keys.push(k.slice(STORAGE_NS.length));
      }
      return { keys, prefix, shared: false };
    }
  };
}

/* ---------------- Course scoping ----------------
   Opened from a course card on the Dashboard, the shell sends
   presetSubject and this page shows only that course's items, with a
   back link to the course. Opened without one (sidebar link), it shows
   everything, exactly as before. */
let historySubjectQH = null;
function applyScopeQH(){
  const scoped = !!historySubjectQH;
  document.getElementById('qh-title').textContent = scoped ? "Quizzes" : "Quizzes";
  document.getElementById('qh-sub').textContent = scoped
    ? "Your previous quizzes for " + historySubjectQH + ". Pick one to review it, or start a new quiz."
    : "Every quiz you have taken, across all your courses.";
  document.getElementById('qh-back').style.display = scoped ? 'inline-flex' : 'none';
  document.getElementById('qh-back-name').textContent = scoped ? historySubjectQH : '';
}
function startNewQH(){
  parent.postMessage(historySubjectQH
    ? { nav:'quiz', presetSubject: historySubjectQH }
    : { nav:'quiz' }, '*');
}
function goBackToCourseQH(){
  parent.postMessage(historySubjectQH
    ? { nav:'home', openCourse: historySubjectQH }
    : { nav:'home' }, '*');
}
window.addEventListener('message', (e)=>{
  const d = e.data;
  if(!d) return;
  if(d.presetSubject){ historySubjectQH = d.presetSubject; }
  else if(d.chalklineClearSubject){ historySubjectQH = null; }
  else return;
  applyScopeQH();
  refreshQuizHistory();
});

let qhUser = null;

function escapeHtmlQH(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

function quizKeyPrefixQH(){
  return 'quiz:' + qhUser.sub + ':';
}

window.addEventListener('message', (e)=>{
  const d = e.data;
  if(!d || !d.chalklineAuth) return;
  qhUser = d.signedIn ? d.user : null;
  refreshQuizHistory();
});

let quizHistoryReqQH = 0;
async function refreshQuizHistory(){
  const myReq = ++quizHistoryReqQH;
  const content = document.getElementById('qh-content');
  if(!qhUser){
    // Nothing is ever saved while signed out, so there's nothing real
    // to list — and we must not query a shared 'local' bucket that
    // could surface a previous guest's leftover summaries.
    content.innerHTML = '<div class="signin-note">Sign in to save quizzes to your account and see them here.</div>';
    return;
  }
  try{
    const result = await window.storage.list(quizKeyPrefixQH(), false);
    if(myReq !== quizHistoryReqQH) return; // superseded by a newer auth state
    const keys = (result && result.keys) ? result.keys : [];
    if(keys.length===0){
      content.innerHTML = '<div class="empty-state">No quizzes yet — start a new quiz and it will show up here.</div>';
      return;
    }
    const items = [];
    for(const key of keys){
      try{ const rec = await window.storage.get(key, false); if(rec) items.push(JSON.parse(rec.value)); } catch(e){}
    }
    if(myReq !== quizHistoryReqQH) return;
    items.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));

    const visibleItems = historySubjectQH
      ? items.filter(i => (i.subject || 'Unsorted') === historySubjectQH)
      : items;
    if(visibleItems.length === 0){
      content.innerHTML = '<div class="empty-state">No quizzes for ' + escapeHtmlQH(historySubjectQH) + ' yet — start a new quiz and it will show up here.</div>';
      return;
    }

    const list = document.createElement('div');
    list.className = 'list';
    visibleItems.forEach(item=>{
      const row = document.createElement('div');
      row.className = 'quiz-row';
      const date = new Date(item.savedAt);
      row.innerHTML = `
        <div class="r-icon">🧠</div>
        <span class="r-name">${escapeHtmlQH(item.title||'Untitled quiz')}</span>
        <span class="r-file">${escapeHtmlQH(item.total ? ((item.score||0) + '/' + item.total) : '')}</span>
        <span class="r-date">${date.toLocaleDateString()}</span>
        <button type="button" class="r-delete" title="Delete">✕</button>
      `;
      row.addEventListener('click', ()=> parent.postMessage({nav:'quiz', loadQuizId:item.id}, '*'));
      row.querySelector('.r-delete').addEventListener('click', async (ev)=>{
        ev.stopPropagation();
        if(!confirm('Delete this saved quiz? This can\'t be undone.')) return;
        try{
          await window.storage.delete(quizKeyPrefixQH() + item.id, false);
          refreshQuizHistory();
        } catch(e){ console.error('Delete quiz failed:', e); }
      });
      list.appendChild(row);
    });
    content.innerHTML = '';
    content.appendChild(list);
  } catch(err){
    console.error('Loading quizzes failed:', err);
    content.innerHTML = '<div class="empty-hint">Could not load saved quizzes.</div>';
  }
}

refreshQuizHistory();
<\/script>

</script>

.note-textbox:focus{ border-color:var(--accent-soft); background:rgba(255,255,255,0.72); }
.note-textbox:empty:before{ content:attr(data-placeholder); color:#C9C2AA; }

.ne-add-page-row{ width:min(92vw,780px); display:flex; justify-content:center; }
.ne-add-page-btn{
  border:1px dashed var(--border); background:transparent; color:var(--muted);
  padding:10px 18px; border-radius:10px; cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:12px;
}
.ne-add-page-btn:hover{ background:rgba(0,0,0,0.03); color:var(--ink); }

.ne-empty-state{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:var(--muted); gap:10px;
}
.ne-empty-state .es-ic{ font-size:38px; opacity:.55; }
.ne-empty-state p{ font-size:13.5px; margin:0; }
.ne-empty-state button{
  margin-top:6px; padding:9px 18px; border-radius:999px; border:none; cursor:pointer;
  background:var(--accent); color:#fff; font-weight:600; font-size:13px; font-family:'JetBrains Mono',monospace;
}

@media (max-width:760px){
  .notes-list-pane{ width:100%; position:fixed; inset:0; z-index:5; }
  .notes-editor-pane{ width:100%; }
  .notes-shell.editing .notes-list-pane{ display:none; }
  .notes-shell:not(.editing) .notes-editor-pane{ display:none; }
  .ne-toolbar{ padding:8px calc(12px + var(--safe-right)) 8px calc(12px + var(--safe-left)); gap:10px; }
  .ne-topbar{ padding:calc(10px + var(--safe-top)) calc(12px + var(--safe-right)) 10px calc(12px + var(--safe-left)); }
  /* Touch targets: bump tappable controls toward the 44px guideline on
     phones without changing their visual size/appearance on desktop,
     where a mouse pointer doesn't need the extra hit area. */
  .nl-back{ width:40px; height:40px; }
  .ne-tool-btn{ min-height:36px; }
  .ne-delete-btn{ padding:8px 6px; }
}
</style>
</head>
<body>

<div class="notes-shell" id="notes-shell">
  <div class="notes-list-pane">
    <div class="nl-topbar">

      <span class="nl-title" id="nl-title">🗒️ Notes</span>
    </div>
    <div class="nl-search">
      <input type="text" id="notes-search" placeholder="Search notes">
    </div>

    <div class="nl-items" id="notes-items"></div>
  </div>

  <div class="notes-editor-pane" id="notes-editor-pane">
    <div class="ne-empty-state" id="notes-empty-state">

    </div>

    <div id="notes-editor" style="display:none; flex-direction:column; height:100%;">
      <div class="ne-topbar">
        <div class="ne-topbar-left">

        </div>

          <button type="button" class="ne-color-swatch active" data-color="#2A2410" style="background:#2A2410;"></button>
          <button type="button" class="ne-color-swatch" data-color="#2E6DBE" style="background:#2E6DBE;"></button>
          <button type="button" class="ne-color-swatch" data-color="#C0392B" style="background:#C0392B;"></button>
          <button type="button" class="ne-color-swatch" data-color="#2E8B57" style="background:#2E8B57;"></button>
        </div>
        <div class="ne-tool-group">
          <span class="ne-tool-label">Size</span>
          <input type="range" class="ne-size-slider" id="pen-size" min="1" max="12" value="3">
        </div>
        <div class="ne-tool-sep"></div>
        <div class="ne-tool-group">
          <button type="button" class="ne-tool-btn" id="tool-undo" title="Undo">↺ Undo</button>
        </div>

        <div class="ne-tool-group">
          <span class="ne-tool-label">Style</span>

            <option value="default">App default</option>

            <option value="ruled">Lined</option>
            <option value="grid">Grid</option>
            <option value="dotted">Dotted</option>
            <option value="blank">Blank</option>

        </div>

          <input type="file" id="pdf-file-input" accept="application/pdf" style="display:none;">
        </div>

      <div class="ne-body" id="ne-body">
        <div id="ne-pages-container" style="display:contents;"></div>

          <button type="button" class="ne-add-page-btn" id="add-page-btn">+ Add blank page</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------------------------------------------------------------
   window.storage shim: identical to the one used on the other
   Chalkline pages (tutor/summary) — real backend inside the
   Claude.ai artifact preview, localStorage-backed fallback once
   deployed on GitHub Pages.
   ------------------------------------------------------------- */
if(!window.storage || !window.storage.__isRealBackend){
  const STORAGE_NS = 'chalkline:';
  window.storage = {
    __isRealBackend: false,
    async get(key){
      const raw = localStorage.getItem(STORAGE_NS + key);
      return raw === null ? null : { key, value: raw, shared: false };
    },
    async set(key, value){
      try{ localStorage.setItem(STORAGE_NS + key, value); return { key, value, shared: false }; }
      catch(e){ console.error('localStorage set failed:', e); return null; }
    },
    async delete(key){
      const existed = localStorage.getItem(STORAGE_NS + key) !== null;
      localStorage.removeItem(STORAGE_NS + key);
      return { key, deleted: existed, shared: false };
    },
    async list(prefix){
      const keys = [];
      const full = STORAGE_NS + (prefix || '');
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(full)) keys.push(k.slice(STORAGE_NS.length));
      }
      return { keys, prefix, shared: false };
    }
  };
}

// ---------- auth (mirrors the pattern used on tutor/summary pages):
// notes are namespaced per signed-in user (by Google "sub"), falling
// back to a shared "guest" bucket when not signed in, so one device's
// localStorage doesn't mix notes across different signed-in accounts.
let notesShellUser = null;
// When arrived at from a course's detail page, notes are scoped to that
// course: the list only shows notes tagged with it, new notes are
// tagged with it automatically, and the header shows the course name
// instead of the generic "Notes" title.
let currentNotesSubject = null;
function notesKeyPrefix(){
  const sub = notesShellUser ? notesShellUser.sub : 'guest';
  return 'notes:' + sub + ':';
}
function settingsKey(){
  const sub = notesShellUser ? notesShellUser.sub : 'guest';
  return 'notes-settings:' + sub;
}
window.addEventListener('message', (e)=>{
  const d = e.data;
  if(d && d.presetSubject){
    currentNotesSubject = d.presetSubject;
    document.getElementById('nl-title').textContent = d.presetSubject;
  }
  if(!d || !d.chalklineAuth) return;
  notesShellUser = d.signedIn ? d.user : null;
  refreshNotesList();
});

// ---------- state ----------
let notesCache = [];       // [{id, title, updatedAt, ruledOverride, pages:[...]}]
let currentNoteId = null;
let saveTimer = null;
let globalSettings = { ruledType:'ruled', ruledSpacing:28 };
let currentTool = 'pen';   // 'pen' | 'eraser'
let penColor = '#2A2410';
let penSize = 3;

const PAGE_W = 780, PAGE_H = 1010;   // note-unit coordinate space (matches CSS aspect ratio)
const RENDER_SCALE = 2;              // canvas backing-store multiplier for crisp pencil strokes

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function formatTimestamp(ms){
  const d = new Date(ms);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' · ' +
         d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}

async function loadGlobalSettings(){
  try{
    const rec = await window.storage.get(settingsKey(), false);
    if(rec) globalSettings = Object.assign(globalSettings, JSON.parse(rec.value));
  } catch(e){ /* use defaults */ }
}
async function saveGlobalSettings(){
  try{ await window.storage.set(settingsKey(), JSON.stringify(globalSettings), false); }
  catch(e){ console.error('Saving global style settings failed:', e); }
}

function blankPage(){
  return { id: uid(), pdfImage: null, strokes: [], textBoxes: [] };
}

// Older notes only had a plain-text `content` field with no drawing
// canvas at all. Migrate them the first time they're opened so nothing
// the user already wrote is lost: their text becomes a text box on a
// single new page.
function migrateNoteIfNeeded(note){
  if(!note.subject) note.subject = 'Unsorted';
  if(note.pages) return note;
  note.pages = [blankPage()];
  note.ruledOverride = null;
  if(note.content && note.content.trim()){
    note.pages[0].textBoxes.push({ id: uid(), x:36, y:36, w:PAGE_W-72, text: note.content, fontSize:16 });
  }
  delete note.content;
  return note;
}

async function loadAllNotes(){
  try{
    const result = await window.storage.list(notesKeyPrefix(), false);
    const items = [];
    for(const key of (result.keys || [])){
      try{
        const rec = await window.storage.get(key, false);
        if(rec) items.push(migrateNoteIfNeeded(JSON.parse(rec.value)));
      } catch(e){ /* skip corrupt entry */ }
    }
    items.sort((a,b)=> b.updatedAt - a.updatedAt);
    return items;
  } catch(err){
    console.error('Loading notes failed:', err);
    return [];
  }
}

async function refreshNotesList(){
  notesCache = await loadAllNotes();
  renderNotesList();
  if(currentNoteId && !notesCache.find(n=>n.id===currentNoteId)){
    currentNoteId = null;
    showEmptyState();
  }
}

function textPreview(note){
  const tb = (note.pages && note.pages[0] && note.pages[0].textBoxes) || [];
  return tb.map(t=>t.text).join(' ');
}

function renderNotesList(){
  const container = document.getElementById('notes-items');
  const query = (document.getElementById('notes-search').value || '').toLowerCase().trim();
  const scoped = currentNotesSubject
    ? notesCache.filter(n => n.subject === currentNotesSubject)
    : notesCache;
  const filtered = query
    ? scoped.filter(n => (n.title||'').toLowerCase().includes(query) || textPreview(n).toLowerCase().includes(query))
    : scoped;

  if(filtered.length === 0){
    container.innerHTML = `<div class="nl-empty-hint">${query ? 'No notes match your search.' : 'No notes yet — create your first one.'}</div>`;
    return;
  }

  container.innerHTML = '';
  filtered.forEach(note=>{
    const row = document.createElement('div');
    row.className = 'nl-item' + (note.id === currentNoteId ? ' active' : '');
    const titleText = note.title && note.title.trim() ? note.title : 'Untitled Note';
    row.innerHTML = `
      <div class="ni-title">${escapeHtml(titleText)}</div>
      <div class="ni-meta">${formatTimestamp(note.updatedAt)}</div>
      <button type="button" class="ni-delete" title="Delete">✕</button>
    `;
    row.addEventListener('click', ()=> openNote(note.id));
    row.querySelector('.ni-delete').addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      if(!confirm('Delete this note? This can\'t be undone.')) return;
      await deleteNote(note.id);
    });
    container.appendChild(row);
  });
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function showEmptyState(){
  document.getElementById('notes-empty-state').style.display = 'flex';
  document.getElementById('notes-editor').style.display = 'none';
  document.getElementById('notes-shell').classList.remove('editing');
  renderNotesList();
}

function showEditor(){
  document.getElementById('notes-empty-state').style.display = 'none';
  document.getElementById('notes-editor').style.display = 'flex';
  document.getElementById('notes-shell').classList.add('editing');
}

async function openNote(id){
  const note = notesCache.find(n=>n.id===id);
  if(!note) return;
  currentNoteId = id;
  showEditor();
  document.getElementById('notes-title-input').value = note.title || '';
  document.getElementById('notes-status').textContent = 'Saved';
  syncStyleControlsFromNote(note);
  renderAllPages(note);
  renderNotesList();
}

function createNote(){
  const note = { id: uid(), title:'', updatedAt: Date.now(), ruledOverride:null, pages:[blankPage()], subject: currentNotesSubject || 'Unsorted' };
  notesCache.unshift(note);
  currentNoteId = note.id;
  showEditor();
  document.getElementById('notes-title-input').value = '';
  document.getElementById('notes-status').textContent = 'Saved';
  syncStyleControlsFromNote(note);
  renderAllPages(note);
  renderNotesList();
  persistCurrentNote();
  setTimeout(()=> document.getElementById('notes-title-input').focus(), 50);
}

function currentNote(){ return notesCache.find(n=>n.id===currentNoteId); }

async function persistCurrentNote(){
  const note = currentNote();
  if(!note) return;
  note.title = document.getElementById('notes-title-input').value;
  note.updatedAt = Date.now();
  try{
    await window.storage.set(notesKeyPrefix() + note.id, JSON.stringify(note), false);
    document.getElementById('notes-status').textContent = 'Saved';
    renderNotesList();
  } catch(e){
    console.error('Saving note failed:', e);
    document.getElementById('notes-status').textContent = 'Save failed';
  }
}

function scheduleSave(){
  document.getElementById('notes-status').textContent = 'Saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistCurrentNote, 500);
}

async function deleteNote(id){
  try{
    await window.storage.delete(notesKeyPrefix() + id, false);
    notesCache = notesCache.filter(n=>n.id!==id);
    if(currentNoteId === id){
      currentNoteId = null;
      showEmptyState();
    } else {
      renderNotesList();
    }
  } catch(e){ console.error('Delete note failed:', e); }
}

document.getElementById('notes-new-btn').addEventListener('click', createNote);
document.getElementById('notes-title-input').addEventListener('input', scheduleSave);
document.getElementById('notes-search').addEventListener('input', renderNotesList);
document.getElementById('notes-delete-btn').addEventListener('click', ()=>{
  if(!currentNoteId) return;
  if(!confirm('Delete this note? This can\'t be undone.')) return;
  deleteNote(currentNoteId);
});

/* =================================================================
   PAGE BACKGROUND (ruled / grid / dotted / blank, or an imported
   PDF page rendered as an image).
   ================================================================= */
function effectiveStyle(note){
  return note.ruledOverride || { type: globalSettings.ruledType, spacing: globalSettings.ruledSpacing };
}

function drawBackground(canvas, page, note){
  const ctx = canvas.getContext('2d');
  canvas.width = PAGE_W * RENDER_SCALE;
  canvas.height = PAGE_H * RENDER_SCALE;
  ctx.setTransform(RENDER_SCALE,0,0,RENDER_SCALE,0,0);
  ctx.clearRect(0,0,PAGE_W,PAGE_H);
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0,0,PAGE_W,PAGE_H);

  if(page.pdfImage){
    const img = new Image();
    img.onload = ()=>{ ctx.drawImage(img,0,0,PAGE_W,PAGE_H); };
    img.src = page.pdfImage;
    return;
  }

  const style = effectiveStyle(note);
  const spacing = Math.max(10, Number(style.spacing) || 28);
  ctx.strokeStyle = 'rgba(46,80,120,0.18)';
  ctx.fillStyle = 'rgba(46,80,120,0.28)';
  ctx.lineWidth = 1;

  if(style.type === 'ruled'){
    for(let y = spacing; y < PAGE_H; y += spacing){
      ctx.beginPath(); ctx.moveTo(0,y+0.5); ctx.lineTo(PAGE_W,y+0.5); ctx.stroke();
    }
  } else if(style.type === 'grid'){
    for(let y = spacing; y < PAGE_H; y += spacing){
      ctx.beginPath(); ctx.moveTo(0,y+0.5); ctx.lineTo(PAGE_W,y+0.5); ctx.stroke();
    }
    for(let x = spacing; x < PAGE_W; x += spacing){
      ctx.beginPath(); ctx.moveTo(x+0.5,0); ctx.lineTo(x+0.5,PAGE_H); ctx.stroke();
    }
  } else if(style.type === 'dotted'){
    for(let y = spacing; y < PAGE_H; y += spacing){
      for(let x = spacing; x < PAGE_W; x += spacing){
        ctx.beginPath(); ctx.arc(x,y,1.2,0,Math.PI*2); ctx.fill();
      }
    }
  }
  // 'blank' -> nothing further to draw
}

function redrawInk(canvas, page){
  const ctx = canvas.getContext('2d');
  canvas.width = PAGE_W * RENDER_SCALE;
  canvas.height = PAGE_H * RENDER_SCALE;
  ctx.setTransform(RENDER_SCALE,0,0,RENDER_SCALE,0,0);
  ctx.clearRect(0,0,PAGE_W,PAGE_H);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  page.strokes.forEach(s=>{
    if(s.points.length < 2){
      if(s.points.length === 1){
        ctx.beginPath();
        ctx.fillStyle = s.color;
        ctx.arc(s.points[0].x, s.points[0].y, s.size/2, 0, Math.PI*2);
        ctx.fill();
      }
      return;
    }
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.size;
    ctx.beginPath();
    ctx.moveTo(s.points[0].x, s.points[0].y);
    for(let i=1;i<s.points.length;i++) ctx.lineTo(s.points[i].x, s.points[i].y);
    ctx.stroke();
  });
}

/* =================================================================
   TEXT BOXES
   ================================================================= */
function renderTextBoxes(layerEl, page){
  layerEl.innerHTML = '';
  page.textBoxes.forEach(tb=>{
    const el = document.createElement('div');
    el.className = 'note-textbox';
    el.contentEditable = 'true';
    el.dataset.placeholder = 'Type…';
    el.style.left = tb.x + 'px';
    el.style.top = tb.y + 'px';
    el.style.width = (tb.w || 200) + 'px';
    el.style.fontSize = (tb.fontSize || 16) + 'px';
    el.textContent = tb.text || '';
    el.addEventListener('input', ()=>{
      tb.text = el.textContent;
      scheduleSave();
    });
    el.addEventListener('pointerdown', (e)=> e.stopPropagation());
    el.addEventListener('blur', ()=>{
      if(!el.textContent.trim()){
        page.textBoxes = page.textBoxes.filter(t=>t.id!==tb.id);
        layerEl.removeChild(el);
      }
    });
    layerEl.appendChild(el);
  });
}

function addTextBoxAt(page, layerEl, xNote, yNote){
  const tb = { id: uid(), x: xNote, y: yNote, w: 220, text: '', fontSize: 16 };
  page.textBoxes.push(tb);
  renderTextBoxes(layerEl, page);
  const el = layerEl.lastChild;
  if(el){ el.focus(); }
  scheduleSave();
}

/* =================================================================
   PAGE RENDERING / EVENT WIRING
   ================================================================= */
function renderAllPages(note){
  const container = document.getElementById('ne-pages-container');
  container.innerHTML = '';
  note.pages.forEach((page, idx)=> container.appendChild(buildPageEl(note, page, idx)));
}

function buildPageEl(note, page, idx){
  const wrap = document.createElement('div');
  wrap.className = 'note-page';

  const bg = document.createElement('canvas'); bg.className = 'np-bg';
  const ink = document.createElement('canvas'); ink.className = 'np-ink';
  const textLayer = document.createElement('div'); textLayer.className = 'np-text-layer';
  const tools = document.createElement('div'); tools.className = 'np-page-tools';
  tools.innerHTML = '<button type="button" title="Delete page">✕</button>';
  tools.querySelector('button').addEventListener('click', ()=>{
    if(note.pages.length <= 1){ alert('A note needs at least one page.'); return; }
    if(!confirm('Delete this page?')) return;
    note.pages.splice(idx,1);
    renderAllPages(note);
    scheduleSave();
  });

  wrap.appendChild(bg); wrap.appendChild(ink); wrap.appendChild(textLayer); wrap.appendChild(tools);

  drawBackground(bg, page, note);
  redrawInk(ink, page);
  renderTextBoxes(textLayer, page);
  wirePageInput(wrap, ink, textLayer, page);

  return wrap;
}

function notePointFromEvent(ink, e){
  const rect = ink.getBoundingClientRect();
  const scaleX = PAGE_W / rect.width;
  const scaleY = PAGE_H / rect.height;
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}

const ERASE_RADIUS = 14;

function eraseNear(page, x, y){
  let changed = false;
  page.strokes = page.strokes.filter(s=>{
    const hit = s.points.some(p => Math.hypot(p.x-x, p.y-y) < ERASE_RADIUS + s.size/2);
    if(hit) changed = true;
    return !hit;
  });
  return changed;
}

// Detects a small back-and-forth "scribbling" motion (as opposed to a
// normal, mostly-one-direction pen stroke or a swipe-to-scroll), so a
// scribble over existing ink erases it even when the Eraser tool isn't
// explicitly toggled on.
function isScribbleMotion(pts){
  if(pts.length < 6) return false;
  const recent = pts.slice(-10);
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  recent.forEach(p=>{ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y); });
  const bboxDiag = Math.hypot(maxX-minX, maxY-minY);
  if(bboxDiag > 46) return false; // too spread out to be a small scrub
  let reversals = 0;
  for(let i=2;i<recent.length;i++){
    const v1x = recent[i-1].x-recent[i-2].x, v1y = recent[i-1].y-recent[i-2].y;
    const v2x = recent[i].x-recent[i-1].x, v2y = recent[i].y-recent[i-1].y;
    const dot = v1x*v2x + v1y*v2y;
    if(dot < 0) reversals++;
  }
  return reversals >= 3;
}

let activePenPointerId = null; // used for palm rejection while pencil is drawing

function wirePageInput(pageWrap, ink, textLayer, page){
  let drawing = false;
  let stroke = null;
  let scribbleErasing = false;
  let touchScrollStartY = 0;
  let touchScrollStartTop = 0;
  let touchStartPoint = null;
  let touchMoved = false;
  const scrollParent = document.getElementById('ne-body');

  function isStylusLike(e){
    // Apple Pencil reports as 'pen'. Mouse is treated the same way so the
    // app is still usable/testable on a laptop trackpad — only a bare
    // finger ('touch') is limited to navigation + placing text.
    return e.pointerType === 'pen' || e.pointerType === 'mouse';
  }

  ink.addEventListener('pointerdown', (e)=>{
    if(isStylusLike(e)){
      // Palm rejection: while the pencil is actively drawing, any
      // concurrent touch point is the palm resting on the glass, not
      // an intentional finger gesture — ignored entirely below.
      activePenPointerId = e.pointerId;
      ink.setPointerCapture(e.pointerId);
      drawing = true;
      scribbleErasing = (currentTool === 'eraser');
      const p = notePointFromEvent(ink, e);
      stroke = { color: penColor, size: penSize, points: [p] };
      if(scribbleErasing){ eraseNear(page, p.x, p.y); redrawInk(ink, page); }
      e.preventDefault();
      return;
    }

    // touch (finger)
    if(activePenPointerId !== null){ e.preventDefault(); return; } // palm during pencil use
    ink.setPointerCapture(e.pointerId);
    touchStartPoint = notePointFromEvent(ink, e);
    touchMoved = false;
    touchScrollStartY = e.clientY;
    touchScrollStartTop = scrollParent.scrollTop;
    drawing = true;
    scribbleErasing = false;
    stroke = { color: penColor, size: penSize, points: [touchStartPoint] };
    e.preventDefault();
  });

  ink.addEventListener('pointermove', (e)=>{
    if(!drawing || e.pointerId !== (stroke && e.pointerId)) { /* fallthrough handled below */ }
    if(!drawing) return;

    if(isStylusLike(e)){
      const p = notePointFromEvent(ink, e);
      if(currentTool === 'eraser' || scribbleErasing){
        eraseNear(page, p.x, p.y);
        redrawInk(ink, page);
      } else {
        stroke.points.push(p);
        if(isScribbleMotion(stroke.points)){
          // Mid-stroke scribble detected: treat the rest of this
          // gesture as erasing rather than inking, and discard the
          // ink drawn so far for this stroke.
          scribbleErasing = true;
          stroke = null;
          eraseNear(page, p.x, p.y);
        }
        redrawInk(ink, page);
        if(stroke){
          // live preview of the in-progress stroke
          const ctx = ink.getContext('2d');
          ctx.setTransform(RENDER_SCALE,0,0,RENDER_SCALE,0,0);
          ctx.strokeStyle = stroke.color; ctx.lineWidth = stroke.size;
          ctx.lineCap='round'; ctx.lineJoin='round';
          ctx.beginPath();
          ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
          for(let i=1;i<stroke.points.length;i++) ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
          ctx.stroke();
        }
      }
      e.preventDefault();
      return;
    }

    // touch (finger): scroll the page, or scribble-erase if the motion
    // looks like a small scrub rather than a swipe.
    if(activePenPointerId !== null){ e.preventDefault(); return; }
    const p = notePointFromEvent(ink, e);
    stroke.points.push(p);
    touchMoved = touchMoved || Math.hypot(p.x-touchStartPoint.x, p.y-touchStartPoint.y) > 6;
    if(isScribbleMotion(stroke.points)){
      eraseNear(page, p.x, p.y);
      redrawInk(ink, page);
    } else if(touchMoved){
      const dy = e.clientY - touchScrollStartY;
      scrollParent.scrollTop = touchScrollStartTop - dy;
    }
    e.preventDefault();
  });

  function finishStroke(e){
    if(!drawing) return;
    drawing = false;
    if(isStylusLike(e)){
      activePenPointerId = null;
      if(stroke && !scribbleErasing && currentTool !== 'eraser' && stroke.points.length){
        page.strokes.push(stroke);
      }
      redrawInk(ink, page);
      scheduleSave();
    } else {
      // touch lifted: if it never moved and wasn't a scribble, treat it
      // as a tap that places a text box (only fingers place text boxes).
      if(!touchMoved && touchStartPoint){
        addTextBoxAt(page, textLayer, touchStartPoint.x, touchStartPoint.y);
      }
    }
    stroke = null;
    touchStartPoint = null;
  }
  ink.addEventListener('pointerup', finishStroke);
  ink.addEventListener('pointercancel', finishStroke);
}

/* =================================================================
   TOOLBAR WIRING
   ================================================================= */
function setTool(tool){
  currentTool = tool;
  document.getElementById('tool-pen').classList.toggle('active', tool==='pen');
  document.getElementById('tool-eraser').classList.toggle('active', tool==='eraser');
}
document.getElementById('tool-pen').addEventListener('click', ()=> setTool('pen'));
document.getElementById('tool-eraser').addEventListener('click', ()=> setTool('eraser'));

document.querySelectorAll('.ne-color-swatch').forEach(sw=>{
  sw.addEventListener('click', ()=>{
    penColor = sw.dataset.color;
    document.querySelectorAll('.ne-color-swatch').forEach(s=>s.classList.remove('active'));
    sw.classList.add('active');
    setTool('pen');
  });
});
document.getElementById('pen-size').addEventListener('input', (e)=>{ penSize = Number(e.target.value); });

document.getElementById('tool-undo').addEventListener('click', ()=>{
  const note = currentNote();
  if(!note) return;
  // Undo the most recent stroke across all pages (simple global undo).
  let latestPageIdx = -1, latestStrokeIdx = -1, latestTime = -1;
  note.pages.forEach((p, pi)=>{ if(p.strokes.length){ latestPageIdx = pi; latestStrokeIdx = p.strokes.length-1; } });
  if(latestPageIdx === -1) return;
  note.pages[latestPageIdx].strokes.pop();
  renderAllPages(note);
  scheduleSave();
});

document.getElementById('add-page-btn').addEventListener('click', ()=>{
  const note = currentNote();
  if(!note) return;
  note.pages.push(blankPage());
  renderAllPages(note);
  scheduleSave();
});

function syncStyleControlsFromNote(note){
  const isOverride = !!note.ruledOverride;
  document.getElementById('style-scope').value = isOverride ? 'override' : 'default';
  const active = note.ruledOverride || { type: globalSettings.ruledType, spacing: globalSettings.ruledSpacing };
  document.getElementById('style-type').value = active.type;
  document.getElementById('style-spacing').value = active.spacing;
}

function applyStyleChange(){
  const note = currentNote();
  if(!note) return;
  const scope = document.getElementById('style-scope').value;
  const type = document.getElementById('style-type').value;
  const spacing = Math.max(10, Number(document.getElementById('style-spacing').value) || 28);
  if(scope === 'default'){
    globalSettings.ruledType = type;
    globalSettings.ruledSpacing = spacing;
    note.ruledOverride = null;
    saveGlobalSettings();
  } else {
    note.ruledOverride = { type, spacing };
  }
  renderAllPages(note);
  scheduleSave();
}
document.getElementById('style-scope').addEventListener('change', ()=>{
  const note = currentNote();
  if(note){
    // switching the scope selector alone (before touching type/spacing)
    // shouldn't blow away an existing override or default silently —
    // re-sync the shown values for the newly selected scope first.
    if(document.getElementById('style-scope').value === 'override' && !note.ruledOverride){
      note.ruledOverride = { type: globalSettings.ruledType, spacing: globalSettings.ruledSpacing };
    } else if(document.getElementById('style-scope').value === 'default'){
      note.ruledOverride = null;
    }
    syncStyleControlsFromNote(note);
    renderAllPages(note);
    scheduleSave();
  }
});
document.getElementById('style-type').addEventListener('change', applyStyleChange);
document.getElementById('style-spacing').addEventListener('change', applyStyleChange);

/* =================================================================
   PDF IMPORT — rendered pages become part of the note canvas itself
   (ink/text can be added directly on top of them), not a separate
   attachment viewer.
   ================================================================= */
if(window['pdfjsLib']){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

document.getElementById('tool-import-pdf').addEventListener('click', ()=>{
  if(!currentNote()) return;
  document.getElementById('pdf-file-input').click();
});

document.getElementById('pdf-file-input').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  e.target.value = '';
  const note = currentNote();
  if(!file || !note) return;
  if(!window['pdfjsLib']){ alert('PDF support failed to load — check your connection and try again.'); return; }

  document.getElementById('notes-status').textContent = 'Importing PDF…';
  try{
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    const newPages = [];
    for(let i=1;i<=pdf.numPages;i++){
      const pdfPage = await pdf.getPage(i);
      const viewport = pdfPage.getViewport({ scale: 1 });
      const scale = Math.min(PAGE_W / viewport.width, PAGE_H / viewport.height) * RENDER_SCALE;
      const scaledViewport = pdfPage.getViewport({ scale });
      const canvas = document.createElement('canvas');
      canvas.width = PAGE_W * RENDER_SCALE;
      canvas.height = PAGE_H * RENDER_SCALE;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      const offsetX = (canvas.width - scaledViewport.width)/2;
      const offsetY = (canvas.height - scaledViewport.height)/2;
      ctx.translate(offsetX, offsetY);
      await pdfPage.render({ canvasContext: ctx, viewport: scaledViewport }).promise;
      const page = blankPage();
      page.pdfImage = canvas.toDataURL('image/png');
      newPages.push(page);
    }
    // If the note is currently just a single empty page, replace it;
    // otherwise append the imported pages after existing content.
    const onlyPage = note.pages.length === 1 && note.pages[0].strokes.length===0 &&
                      note.pages[0].textBoxes.length===0 && !note.pages[0].pdfImage;
    note.pages = onlyPage ? newPages : note.pages.concat(newPages);
    renderAllPages(note);
    document.getElementById('notes-status').textContent = 'Saving…';
    await persistCurrentNote();
  } catch(err){
    console.error('PDF import failed:', err);
    alert('Could not import that PDF.');
    document.getElementById('notes-status').textContent = 'Saved';
  }
});

loadGlobalSettings().then(refreshNotesList);
<\/script>

<script>
(function(){
  const shell = document.getElementById('app-shell');
  const sbScrim = document.getElementById('sidebar-scrim');
  function closeSidebar(){ shell.classList.add('sidebar-closed'); document.body.classList.add('sb-closed'); }
  function openSidebar(){ shell.classList.remove('sidebar-closed'); document.body.classList.remove('sb-closed'); }
  document.getElementById('sidebar-toggle').addEventListener('click', ()=>
    shell.classList.contains('sidebar-closed') ? openSidebar() : closeSidebar()
  );
  sbScrim.addEventListener('click', closeSidebar);
  if (window.innerWidth <= 700) closeSidebar();
})();

  let quizSubject = null;
  window.addEventListener('message', (e)=>{
    const d = e.data;
    if(d && d.presetSubject){
      quizSubject = d.presetSubject;
      document.getElementById('quiz-course-line').textContent =
        'Quizzes for "' + d.presetSubject + '" will show up here once they\'re ready.';
      document.getElementById('quiz-back-btn').textContent = '✨ Back to quizzes';
    }
  });
  function goBackFromQuiz(){
    parent.postMessage(quizSubject
      ? { nav:'quiz-history', presetSubject: quizSubject }
      : { nav:'home' }, '*');
  }
  document.getElementById('quiz-back-btn').addEventListener('click', goBackFromQuiz);

<script>

function unwrap(id){
  return document.getElementById(id).textContent.replace(/<\\\/script/gi, '</script');
}
const frames = {
  home: document.getElementById('frame-home'),
  tutor: document.getElementById('frame-tutor'),
  summary: document.getElementById('frame-summary'),
  quiz: document.getElementById('frame-quiz'),
  'tutor-history': document.getElementById('frame-tutor-history'),
  'summary-history': document.getElementById('frame-summary-history'),
  'quiz-history': document.getElementById('frame-quiz-history'),
  notes: document.getElementById('frame-notes')
};
const loaded = { home:false, tutor:false, summary:false, quiz:false, 'tutor-history':false, 'summary-history':false, 'quiz-history':false, notes:false };
let current = 'home';

function ensureLoaded(page){
  if(loaded[page]) return;
  frames[page].srcdoc = unwrap('src-' + page);
  loaded[page] = true;
  // A fresh frame doesn't know the sign-in state yet — broadcastAuthState
  // only fires on sign-in/out events, not on frame load — so tell this
  // one directly once it's parsed and listening.
  setTimeout(()=>{
    try{ frames[page].contentWindow.postMessage({ chalklineAuth:true, signedIn: !!shellUser, user: shellUser }, '*'); }catch(e){}
  }, 60);
}

// Pages that represent an active "session" (a live lesson or summary in
// progress) shouldn't just be re-shown stale when you navigate back to
// them — their in-iframe JS state (currentSessionId, loaded messages,
// etc.) would still be sitting there from before. If you're arriving
// WITHOUT a specific saved item to resume (no loadSessionId/loadSummaryId),
// treat it as "start a new one" and force the iframe to reload from
// scratch. Arriving WITH a loadSessionId/loadSummaryId means the user
// picked a specific saved item from history, so that one is left alone —
// its own message handler (d.loadSessionId) resets its state anyway.
const FRESH_ON_ENTRY = { tutor:true, summary:true, quiz:true, notes:true };

// The three "previous ..." list pages are course-scoped when opened from a
// course card (the shell sends presetSubject). Reaching one WITHOUT a
// payload (sidebar link, browser back) means "show everything", so tell an
// already-loaded frame to drop whichever course it was last scoped to.
const HISTORY_PAGES = { 'tutor-history':true, 'summary-history':true, 'quiz-history':true };

function navTo(page, pushHistory, navPayload, isInitialLoad){
  if(!frames[page]) page = 'home';
  // Coming back to the Dashboard (sidebar/brand click, or "home" with no
  // specific payload) should reset it to the course list, not leave the
  // frame sitting on whatever course detail view it was last showing —
  // the home frame doesn't get torn down and reloaded like tutor/summary do.
  if(page === 'home' && !navPayload && loaded.home){
    try{ frames.home.contentWindow.postMessage({ chalklineShowHome:true }, '*'); }catch(e){}
  }
  if(HISTORY_PAGES[page] && !navPayload && loaded[page]){
    try{ frames[page].contentWindow.postMessage({ chalklineClearSubject:true }, '*'); }catch(e){}
  }
  // Only force a fresh tutor/summary reload for an actual in-app
  // navigation (clicking Tutor/Summary from Home, etc). A page refresh
  // re-runs this same function for whatever page the URL hash says we
  // were on — that should resume the session already in progress, not
  // wipe it and ask for a new course name.
  if(FRESH_ON_ENTRY[page] && !navPayload && !isInitialLoad){
    frames[page].srcdoc = '';
    loaded[page] = false;
  }
  const wasLoaded = loaded[page];
  const previous = current;
  ensureLoaded(page);

  // Crossfade: the page we're leaving keeps rendering (at a lower
  // z-index) while it fades out, instead of disappearing the instant
  // the new page appears — that's what made switches feel like a hard
  // cut rather than a transition.
  if(previous && previous !== page && frames[previous]){
    const leavingFrame = frames[previous];
    leavingFrame.classList.remove('active');
    leavingFrame.classList.add('leaving');
    setTimeout(()=>{ leavingFrame.classList.remove('leaving'); }, 240);
  }
  Object.keys(frames).forEach(k => frames[k].classList.toggle('active', k === page));
  current = page;
  if(pushHistory !== false){
    history.pushState({page}, '', '#' + page);
  }
  // Forward any extra nav payload (e.g. which saved session to open)
  // into the target frame. A just-created srcdoc iframe needs a beat
  // to parse and attach its own message listener before it can hear
  // this, so give it one on first load; an already-loaded frame can
  // be told immediately.
  if(navPayload){
    const send = ()=>{ try{ frames[page].contentWindow.postMessage(navPayload, '*'); }catch(e){} };
    // Slightly after the auth broadcast (60ms) so the target frame
    // already knows sign-in state before it looks up the session key.
    wasLoaded ? send() : setTimeout(send, 110);
  }
}

// Last-active-session tracking lives HERE, in the shell, not inside the
// tutor/summary srcdoc iframes. Those iframes get torn down and re-parsed
// as a fresh, un-navigated document on every load (they have no stable
// URL — just an inline srcdoc string) so anything they write to their own
// sessionStorage/localStorage is not reliably there for the *next* load
// after a real page refresh. This top-level page, by contrast, has the
// site's real origin and survives a refresh normally, so this is the only
// place that can durably answer "what was open before the refresh?".
// localStorage (not sessionStorage) on purpose: a refresh should resume
// the same lesson, but so should closing the tab and coming back later —
// there's no reason to lose that continuity just because a tab closed.
const LAST_ACTIVE_KEY_PREFIX = 'chalkline_last_active_';
function rememberActiveShell(page, sub, id){
  if(!sub || !id) return;
  try{ localStorage.setItem(LAST_ACTIVE_KEY_PREFIX + page, JSON.stringify({ sub, id })); }
  catch(e){ /* best-effort only */ }
}
function forgetActiveShell(page){
  try{ localStorage.removeItem(LAST_ACTIVE_KEY_PREFIX + page); } catch(e){}
}
function readActiveShell(page, sub){
  try{
    const raw = localStorage.getItem(LAST_ACTIVE_KEY_PREFIX + page);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(parsed && parsed.sub === sub) return parsed.id;
  } catch(e){}
  return null;
}

window.addEventListener('message', (e)=>{
  const d = e.data;
  if(d && d.nav){
    let payload = null;
    if(d.loadSessionId) payload = { loadSessionId: d.loadSessionId };
    else if(d.loadSummaryId) payload = { loadSummaryId: d.loadSummaryId };
    else if(d.loadQuizId) payload = { loadQuizId: d.loadQuizId };
    else if(d.openCourse) payload = { openCourse: d.openCourse };
    else if(d.presetSubject) payload = { presetSubject: d.presetSubject };
    navTo(d.nav, true, payload);
    return;
  }
  // Reported by the tutor/summary iframe whenever the session it has open
  // changes (new session created, saved, or a saved one loaded) — see the
  // matching postMessage calls added alongside rememberActiveSession().
  if(d && d.chalklineActiveSession){
    const page = d.page === 'summary' ? 'summary' : 'tutor';
    if(d.cleared) forgetActiveShell(page);
    else rememberActiveShell(page, d.sub, d.id);
  }
});

window.addEventListener('popstate', (e)=>{
  const page = (e.state && e.state.page) || (location.hash ? location.hash.slice(1) : 'home');
  navTo(page, false);
});

const initial = location.hash ? location.hash.slice(1) : 'home';
history.replaceState({page: initial}, '', '#' + initial);
// On a real page refresh landing directly on tutor/summary (URL hash
// already says so), try to resume whatever session was open before the
// refresh — using the shell's own localStorage record, not anything the
// about-to-be-recreated iframe might have tried to remember itself.
let initialPayload = null;
if((initial === 'tutor' || initial === 'summary') && shellUser){
  const rememberedId = readActiveShell(initial, shellUser.sub);
  if(rememberedId) initialPayload = { loadSessionId: rememberedId };
}
navTo(initial, false, initialPayload, true);
</script>
