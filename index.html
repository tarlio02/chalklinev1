<script>
  /* ---------------------------------------------------------------
     window.storage shim: the real window.storage API only exists
     inside the Claude.ai artifact preview sandbox — on a real
     deployed site (like this one) it doesn't exist at all, so calls
     from this page (loading/saving courses) would throw silently.
     Same shim as the tutor/summary/notes pages, backed by
     localStorage, so course data actually persists once deployed.
     ------------------------------------------------------------- */
  if(!window.storage || !window.storage.__isRealBackend){
    const STORAGE_NS = 'chalkline:';
    window.storage = {
      __isRealBackend: false,
      async get(key){
        const raw = localStorage.getItem(STORAGE_NS + key);
        return raw === null ? null : { key, value: raw, shared: false };
      },
      async set(key, value){
        try{ localStorage.setItem(STORAGE_NS + key, value); return { key, value, shared: false }; }
        catch(e){ console.error('localStorage set failed:', e); return null; }
      },
      async delete(key){
        const existed = localStorage.getItem(STORAGE_NS + key) !== null;
        localStorage.removeItem(STORAGE_NS + key);
        return { key, deleted: existed, shared: false };
      },
      async list(prefix){
        const keys = [];
        const full = STORAGE_NS + (prefix || '');
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if(k && k.startsWith(full)) keys.push(k.slice(STORAGE_NS.length));
        }
        return { keys, prefix, shared: false };
      }
    };
  }

  const shell = document.getElementById('app-shell');
  const sbScrim = document.getElementById('sidebar-scrim');
  function closeSidebar(){ shell.classList.add('sidebar-closed'); document.body.classList.add('sb-closed'); }
  function openSidebar(){ shell.classList.remove('sidebar-closed'); document.body.classList.remove('sb-closed'); }
  document.getElementById('sidebar-toggle').addEventListener('click', ()=>
    shell.classList.contains('sidebar-closed') ? openSidebar() : closeSidebar()
  );
  sbScrim.addEventListener('click', closeSidebar);
  // Open by default on tablet/desktop, where it docks and pushes the
  // content over. On narrow phone widths it would swallow the whole
  // screen, so it starts closed there instead — the toggle still works
  // exactly the same either way.
  if (window.innerWidth <= 700) closeSidebar();

  // Account row reflects real sign-in state (mirrors the shell's
  // chalklineAuth broadcast) instead of always saying "tap to sign in" —
  // this is now the only place the signed-in name/avatar shows, since
  // the top-right chip in the shell was removed.
  let homeShellUser = null;
  function renderHomeSidebarAccount(){
    const avatarEl = document.getElementById('home-sidebar-avatar');
    const nameEl = document.getElementById('home-sidebar-name');
    const subEl = document.getElementById('home-sidebar-sub');
    if(homeShellUser){
      const fullName = homeShellUser.name || homeShellUser.email || 'Signed in';
      if(homeShellUser.picture){
        avatarEl.outerHTML = `<img class="avatar" id="home-sidebar-avatar" src="${homeShellUser.picture}" alt="" style="object-fit:cover;">`;
      } else {
        avatarEl.textContent = (homeShellUser.given_name || fullName)[0].toUpperCase();
      }
      nameEl.textContent = fullName;
      subEl.textContent = 'tap to sign out';
    } else {
      avatarEl.outerHTML = `<span class="avatar" id="home-sidebar-avatar">👤</span>`;
      nameEl.textContent = 'Account';
      subEl.textContent = 'tap to sign in';
    }
    renderDashWelcomeText();
  }
  // Greets the signed-in person by first name under the Dashboard title;
  // falls back to a generic line when nobody's signed in yet.
  function renderDashWelcomeText(){
    const el = document.getElementById('dash-welcome-text');
    if(!el) return;
    if(homeShellUser){
      const firstName = homeShellUser.given_name || (homeShellUser.name ? homeShellUser.name.split(' ')[0] : '') || homeShellUser.email || '';
      el.textContent = firstName ? `Welcome back, ${firstName} — let's get back to it.` : `Welcome back — let's get back to it.`;
    } else {
      el.textContent = `Let's get started.`;
    }
  }
  function handleHomeSidebarAccountClick(){
    parent.postMessage(homeShellUser ? { requestSignOut:true } : { navLoginClick:true }, '*');
  }
  window.handleHomeSidebarAccountClick = handleHomeSidebarAccountClick;

  /* ---------------- "My Courses" dashboard grid -----------------
     A "course" here is just a subject name: tutor sessions already
     tag themselves with one (see the tutor page's subject modal),
     and summaries now do too (see the subject field added to the
     summary page). This groups both by that shared subject and
     counts lessons, quizzes answered, and summaries under each. */
  function escapeHtmlHome(s){
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }
  const COURSE_PALETTES = [
    ['var(--ochre)','var(--gold-deep)'],
    ['var(--sage)','var(--emerald)'],
    ['var(--gold-deep)','var(--gold)'],
    ['var(--brick)','var(--gold-deep)']
  ];
  let currentCourseStats = {}; // name -> {lessons, quizzes, summaries}, refreshed by loadCourses()

  function coursesKeyPrefix(){
    return 'courses:' + homeShellUser.sub;
  }

  // Explicit course list, stored separately from lessons/summaries so a
  // freshly-named course (no lessons or summaries under it yet) still
  // shows up on the dashboard instead of only appearing once something
  // gets tagged with its name.
  async function loadCourseNames(){
    try{
      const rec = await window.storage.get(coursesKeyPrefix(), false);
      if(!rec) return [];
      return JSON.parse(rec.value) || [];
    } catch(e){ return []; }
  }
  async function saveCourseNames(names){
    try{ await window.storage.set(coursesKeyPrefix(), JSON.stringify(names), false); }
    catch(e){ console.error('Could not save course list:', e); }
  }

  async function loadCourses(){
    const grid = document.getElementById('course-grid');
    const emptyEl = document.getElementById('course-empty-state');
    if(!homeShellUser){
      grid.innerHTML = '';
      emptyEl.textContent = 'Sign in to see your saved courses and subjects here.';
      emptyEl.style.display = 'block';
      return;
    }
    const sub = homeShellUser.sub;
    const courses = {};
    function ensure(name){
      if(!courses[name]) courses[name] = { lessons:0, quizzes:0, summaries:0, notes:0 };
      return courses[name];
    }
    const explicitNames = await loadCourseNames();
    explicitNames.forEach(n => ensure(n));
    try{
      const sessResult = await window.storage.list('session:' + sub + ':', false);
      for(const key of (sessResult.keys || [])){
        try{
          const rec = await window.storage.get(key, false);
          if(!rec) continue;
          const item = JSON.parse(rec.value);
          const c = ensure(item.subject || 'Unsorted');
          c.lessons++;
        } catch(e){ /* skip corrupt entry */ }
      }
    } catch(e){ console.error('Loading lessons for dashboard failed:', e); }
    try{
      const sumResult = await window.storage.list('summary:' + sub + ':', false);
      for(const key of (sumResult.keys || [])){
        try{
          const rec = await window.storage.get(key, false);
          if(!rec) continue;
          const item = JSON.parse(rec.value);
          const c = ensure(item.subject || 'Unsorted');
          c.summaries++;
        } catch(e){ /* skip corrupt entry */ }
      }
    } catch(e){ console.error('Loading summaries for dashboard failed:', e); }
    try{
      const quizResult = await window.storage.list('quiz:' + sub + ':', false);
      for(const key of (quizResult.keys || [])){
        try{
          const rec = await window.storage.get(key, false);
          if(!rec) continue;
          const item = JSON.parse(rec.value);
          const c = ensure(item.subject || 'Unsorted');
          c.quizzes++;
        } catch(e){ /* skip corrupt entry */ }
      }
    } catch(e){ console.error('Loading quizzes for dashboard failed:', e); }
    try{
      const noteResult = await window.storage.list('notes:' + sub + ':', false);
      for(const key of (noteResult.keys || [])){
        try{
          const rec = await window.storage.get(key, false);
          if(!rec) continue;
          const item = JSON.parse(rec.value);
          const c = ensure(item.subject || 'Unsorted');
          c.notes++;
        } catch(e){ /* skip corrupt entry */ }
      }
    } catch(e){ console.error('Loading notes for dashboard failed:', e); }

    currentCourseStats = courses;
    const names = Object.keys(courses).sort((a,b)=>{
      if(a==='Unsorted') return 1;
      if(b==='Unsorted') return -1;
      return a.localeCompare(b);
    });

    if(names.length === 0){
      grid.innerHTML = '';
      emptyEl.textContent = 'No courses yet — add a new course to begin your journey! 🚀';
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';
    grid.innerHTML = names.map((name, idx)=>{
      const c = courses[name];
      const [a,b] = COURSE_PALETTES[idx % COURSE_PALETTES.length];
      const lessonWord = c.lessons===1 ? 'lesson' : 'lessons';
      const quizWord = c.quizzes===1 ? 'quiz' : 'quizzes';
      const summaryWord = c.summaries===1 ? 'summary' : 'summaries';
      const noteWord = c.notes===1 ? 'note' : 'notes';
      return `<div class="dash-card course fade-up" data-course-name="${escapeHtmlHome(name)}" style="animation-delay:${(idx*0.06).toFixed(2)}s;--card-a:${a};--card-b:${b};">
        <button type="button" class="course-info-btn" title="Course info" aria-label="Course info for ${escapeHtmlHome(name)}">i</button>
        <span class="icon-badge">📘</span>
        <h2>${escapeHtmlHome(name)}</h2>
        <p>${c.lessons} ${lessonWord} · ${c.quizzes} ${quizWord} · ${c.summaries} ${summaryWord} · ${c.notes||0} ${noteWord}</p>
      </div>`;
    }).join('');
    // Delegated via addEventListener rather than an inline onclick= attribute:
    // more reliable for course names containing quotes/special characters,
    // and avoids re-binding issues after innerHTML is replaced.
    grid.querySelectorAll('.dash-card.course').forEach(card=>{
      card.addEventListener('click', ()=> openCourseDetail(card.getAttribute('data-course-name')));
      const infoBtn = card.querySelector('.course-info-btn');
      if(infoBtn){
        // stopPropagation so tapping ⓘ doesn't also open the course itself
        infoBtn.addEventListener('click', (e)=>{
          e.stopPropagation();
          openCourseInfo(card.getAttribute('data-course-name'));
        });
      }
    });
  }

  /* ---------------- Course detail view ---------------- */
  const dashListView = document.getElementById('dash-list-view');
  const dashCourseView = document.getElementById('dash-course-view');
  let openCourseName = null;

  function openCourseDetail(name){
    openCourseName = name;
    document.getElementById('course-detail-title').textContent = name;
    const c = currentCourseStats[name] || { lessons:0, quizzes:0, summaries:0, notes:0 };
    const lessonWord = c.lessons===1 ? 'lesson' : 'lessons';
    const quizWord = c.quizzes===1 ? 'quiz' : 'quizzes';
    const summaryWord = c.summaries===1 ? 'summary' : 'summaries';
    const noteWord = c.notes===1 ? 'note' : 'notes';
    document.getElementById('course-detail-sub').textContent =
      `${c.lessons} ${lessonWord} · ${c.quizzes} ${quizWord} · ${c.summaries} ${summaryWord} · ${c.notes||0} ${noteWord}`;

    const actionGrid = document.getElementById('course-action-grid');
    const encName = escapeHtmlHome(name);
    actionGrid.innerHTML = `
      <div class="dash-card course-action-card fade-up" style="--card-a:var(--ochre);--card-b:var(--gold-deep);" onclick="startCourseAction('tutor-history');">
        <span class="icon-badge">🎓</span>
        <h2>Live tutor</h2>
        <p>Your previous lessons for ${encName}, or start a new one.</p>
      </div>
      <div class="dash-card course-action-card fade-up" style="animation-delay:.06s;--card-a:var(--sage);--card-b:var(--emerald);" onclick="startCourseAction('quiz-history');">
        <span class="icon-badge">🧠</span>
        <h2>Quizzes</h2>
        <p>Your previous quizzes for ${encName}, or start a new one.</p>
      </div>
      <div class="dash-card course-action-card fade-up" style="animation-delay:.12s;--card-a:var(--gold-deep);--card-b:var(--gold);" onclick="startCourseAction('summary-history');">
        <span class="icon-badge">📄</span>
        <h2>Summaries</h2>
        <p>Your previous summaries for ${encName}, or summarize a new PDF.</p>
      </div>
      <div class="dash-card course-action-card fade-up" style="animation-delay:.18s;--card-a:var(--brick);--card-b:var(--gold-deep);" onclick="startCourseAction('notes');">
        <span class="icon-badge">🗒️</span>
        <h2>Notes</h2>
        <p>Open notes saved under ${encName}.</p>
      </div>`;

    dashListView.style.display = 'none';
    dashCourseView.style.display = 'block';
  }
  window.openCourseDetail = openCourseDetail;

  function startCourseAction(page){
    parent.postMessage({ nav: page, presetSubject: openCourseName }, '*');
  }
  window.startCourseAction = startCourseAction;

  function backToCourseList(){
    dashCourseView.style.display = 'none';
    dashListView.style.display = 'block';
    openCourseName = null;
  }
  document.getElementById('course-back-btn').addEventListener('click', backToCourseList);

  // Returning to Dashboard from elsewhere in the app (sidebar / brand
  // click) should land on the course list, not leave you stuck on
  // whichever course you last had open — this frame isn't torn down
  // and reloaded on re-entry the way tutor/summary are.
  window.addEventListener('message', (e)=>{
    if(e.data && e.data.chalklineShowHome) backToCourseList();
    if(e.data && e.data.openCourse) openCourseDetail(e.data.openCourse);
  });

  /* ---------------- Course info / delete modal ----------------
     A "course" is only a subject tag, so deleting one means removing:
       1. its name from the explicit course list, and
       2. every lesson (session:), summary (summary:), quiz (quiz:) and
          note (notes:) whose subject matches it —
     otherwise the course would immediately reappear on the dashboard
     the next time loadCourses() rebuilds the grid from those items.
     "Unsorted" is the catch-all bucket for untagged items, not a real
     course, so it can be inspected but not deleted. */
  const courseInfoModal = document.getElementById('course-info-modal');
  let infoCourseName = null;

  function openCourseInfo(name){
    infoCourseName = name;
    const c = currentCourseStats[name] || { lessons:0, quizzes:0, summaries:0, notes:0 };
    const isUnsorted = (name === 'Unsorted');
    courseInfoModal.classList.remove('confirming');
    document.getElementById('ci-title').textContent = name;
    document.getElementById('ci-desc').textContent = isUnsorted
      ? 'Items that aren\u2019t tagged with a course end up here.'
      : 'Everything saved under this course.';
    document.getElementById('ci-stats').innerHTML = `
      <div class="ci-stat"><b>${c.lessons}</b><span>${c.lessons===1?'LESSON':'LESSONS'}</span></div>
      <div class="ci-stat"><b>${c.quizzes}</b><span>${c.quizzes===1?'QUIZ':'QUIZZES'}</span></div>
      <div class="ci-stat"><b>${c.summaries}</b><span>${c.summaries===1?'SUMMARY':'SUMMARIES'}</span></div>
      <div class="ci-stat"><b>${c.notes||0}</b><span>${(c.notes||0)===1?'NOTE':'NOTES'}</span></div>`;
    const noteEl = document.getElementById('ci-note');
    const delBtn = document.getElementById('btn-ci-delete');
    if(isUnsorted){
      noteEl.textContent = 'This is a catch-all group, so it can\u2019t be deleted.';
      noteEl.style.display = 'block';
      delBtn.style.display = 'none';
    } else {
      noteEl.style.display = 'none';
      delBtn.style.display = '';
    }
    courseInfoModal.classList.add('open');
  }
  function closeCourseInfo(){
    courseInfoModal.classList.remove('open');
    courseInfoModal.classList.remove('confirming');
    infoCourseName = null;
  }
  window.closeCourseInfo = closeCourseInfo;

  function showDeleteConfirm(){
    if(!infoCourseName) return;
    const c = currentCourseStats[infoCourseName] || { lessons:0, quizzes:0, summaries:0, notes:0 };
    const total = c.lessons + c.quizzes + c.summaries + (c.notes||0);
    document.getElementById('ci-confirm-title').textContent = `Delete \u201c${infoCourseName}\u201d?`;
    document.getElementById('ci-confirm-body').textContent = total > 0
      ? `This will permanently delete the course along with its ${c.lessons} ${c.lessons===1?'lesson':'lessons'}, ${c.quizzes} ${c.quizzes===1?'quiz':'quizzes'}, ${c.summaries} ${c.summaries===1?'summary':'summaries'} and ${c.notes||0} ${(c.notes||0)===1?'note':'notes'}. This can\u2019t be undone.`
      : 'This course is empty. It will be removed from your dashboard. This can\u2019t be undone.';
    courseInfoModal.classList.add('confirming');
  }

  // Deletes every stored record under `prefix` whose subject matches.
  async function deleteItemsForSubject(prefix, subject){
    let removed = 0;
    try{
      const result = await window.storage.list(prefix, false);
      for(const key of (result.keys || [])){
        try{
          const rec = await window.storage.get(key, false);
          if(!rec) continue;
          const item = JSON.parse(rec.value);
          if((item.subject || 'Unsorted') === subject){
            await window.storage.delete(key, false);
            removed++;
          }
        } catch(e){ /* skip corrupt entry */ }
      }
    } catch(e){ console.error('Deleting items under ' + prefix + ' failed:', e); }
    return removed;
  }

  async function confirmDeleteCourse(){
    const name = infoCourseName;
    if(!name || name === 'Unsorted' || !homeShellUser) return;
    const btn = document.getElementById('btn-ci-confirm-delete');
    btn.disabled = true; btn.textContent = 'Deleting\u2026';
    try{
      const sub = homeShellUser.sub;
      // 1. course name out of the explicit list
      const names = (await loadCourseNames()).filter(n => n !== name);
      await saveCourseNames(names);
      // 2. everything tagged with it
      await deleteItemsForSubject('session:' + sub + ':', name);
      await deleteItemsForSubject('summary:' + sub + ':', name);
      await deleteItemsForSubject('quiz:' + sub + ':', name);
      await deleteItemsForSubject('notes:' + sub + ':', name);
    } catch(e){
      console.error('Could not delete course:', e);
    } finally {
      btn.disabled = false; btn.textContent = 'Yes, delete it';
    }
    closeCourseInfo();
    await loadCourses();
    // Let the rest of the app (sidebar "recent" lists etc.) know things changed.
    try{ parent.postMessage({ courseDeleted: name }, '*'); } catch(e){}
  }

  document.getElementById('btn-ci-close').addEventListener('click', closeCourseInfo);
  document.getElementById('btn-ci-delete').addEventListener('click', showDeleteConfirm);
  document.getElementById('btn-ci-back').addEventListener('click', ()=> courseInfoModal.classList.remove('confirming'));
  document.getElementById('btn-ci-confirm-delete').addEventListener('click', confirmDeleteCourse);
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' && courseInfoModal.classList.contains('open')) closeCourseInfo();
  });

  /* ---------------- Add-course modal ---------------- */
  const addCourseModal = document.getElementById('add-course-modal');
  const newCourseInput = document.getElementById('new-course-input');

  function openAddCourseModal(){
    if(!homeShellUser){
      alert('Sign in to create and save courses.');
      return;
    }
    newCourseInput.value = '';
    addCourseModal.classList.add('open');
    setTimeout(()=> newCourseInput.focus(), 50);
  }
  function closeAddCourseModal(){ addCourseModal.classList.remove('open'); }
  window.closeAddCourseModal = closeAddCourseModal;

  async function confirmNewCourse(){
    const name = newCourseInput.value.trim();
    if(!name) return;
    const names = await loadCourseNames();
    if(!names.includes(name)) names.push(name);
    await saveCourseNames(names);
    closeAddCourseModal();
    await loadCourses();
    openCourseDetail(name);
  }
  document.getElementById('btn-course-create').addEventListener('click', confirmNewCourse);
  document.getElementById('btn-course-cancel').addEventListener('click', closeAddCourseModal);
  newCourseInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); confirmNewCourse(); } });

  function handleAddCourseClick(){ openAddCourseModal(); }
  window.handleAddCourseClick = handleAddCourseClick;

  window.addEventListener('message', (e)=>{
    const d = e.data;
    if(!d || !d.chalklineAuth) return;
    homeShellUser = d.signedIn ? d.user : null;
    renderHomeSidebarAccount();
    loadCourses().then(()=>{
      if(openCourseName && currentCourseStats[openCourseName]) openCourseDetail(openCourseName);
    });
  });
<\/script>

</body>
</html>
</script>

<script type="text/plain" id="src-tutor"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Chalkline — AI Whiteboard Tutor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"><\/script>
<script src="https://accounts.google.com/gsi/client" async defer><\/script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --board-bg:#FFFFFF;
  --board-line:#E0D9C8;
  --margin-line:#E08080;
  --ink:#1E2B3A;
  --ochre:#2E7DBE;
  --highlight:#A6D0F2;
  --sage:#3E8FA6;
  --brick:#3D6B93;
  --panel:#DCEEFB;
  --panel-border:#D3E6F5;
  --muted:#7C93A8;
  /* Shared-shell warm palette — used only by the side panel's brand/nav/
     recent chrome below, so the panel reads as the same app as Home,
     Summaries, Notes, etc. (all cream/gold) even though the board itself
     stays on its own blue chalkboard palette. */
  --shell-ink:#2A2410;
  --shell-gold:#F0B94D;
  --shell-gold-deep:#C98A2B;
  --halo-blue:#0099FF;
  --halo-blue-soft:#00E5FF;
  --violet:#D98C2B;
  --violet-deep:#A66A1E;
  --violet-ring:rgba(217,140,43,0.35);
  --speak-green:#2FA88A;
  --speak-green-deep:#1E7B4D;
  --speak-green-rgb:47,168,138;

  /* ============================================================
     RESPONSIVE ARCHITECTURE
     One set of variables drives every device-specific layout
     decision below. Device-tier media queries (phone / tablet /
     desktop) only ever override these — no page rule should ever
     hard-code a raw pixel offset for "where the controls are".
     --safe-* mirror the real device safe areas (notches, home
     indicator, rounded corners); --control-size etc. are the
     per-tier touch-target and spacing scale. ============================================================ */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);

  /* Desktop/default tier */
  --content-padding: 20px;
  --control-size: 40px;
  --control-size-sm: 30px;
  --control-gap: 8px;
  --top-control-height: 88px;
  --bottom-control-height: 150px;
  --ask-zone-width: min(680px, 62vw);
  --caption-max-width: 760px;
  --side-panel-w: 360px;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  font-family:'Source Serif 4', Georgia, serif;
  color:var(--ink);
  height:100vh;
  height:100dvh;
  overflow:hidden;
  background:#FFFFFF;
}

#board-wrap{
  position:fixed;
  inset:0;
  z-index: 2;
  /* Must receive pointer events itself (wheel/touch/drag) or none of
     that input ever reaches it. There is no native scrolling here at
     all anymore — the canvas is fixed at viewport size and a real
     camera (camera.y, see the tutor script) pans through the world by
     redrawing, so this wrapper is back to being an inert positioning
     shell; JS reads wheel/touch gestures directly off it instead of
     letting the browser scroll it. */
  pointer-events: auto;
  overflow: hidden;
}
#board{
  width:100%;
  display:block;
  cursor:default;
  pointer-events: auto;
  /* We handle drag-to-pan ourselves (see manual pan handling in the
     tutor script) and call preventDefault() on the touch gesture, so
     the browser must not also try to scroll/pan this element itself —
     "none" hands the whole gesture to our own handlers. */
  touch-action: none;
}

/* Wall behind the framed board. Put your classroom picture in CLASSROOM_BG_URL
   (tutor script) — until then this is a plain neutral wall. */
#board-wrap{
  background-color:#D9D2C1;
  background-image:var(--classroom-backdrop, linear-gradient(180deg,#E7E1D3 0%,#D3CAB5 100%));
  background-size:cover; background-position:center; background-repeat:no-repeat;
}

/* Empty-board welcome: faint logo watermark + greeting. Sits above the canvas but
   never takes pointer input, and fades out as soon as the tutor starts writing. */
#board-welcome{
  position:absolute; inset:0; z-index:1;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:20px; padding:24px 24px 16vh; text-align:center;
  pointer-events:none; user-select:none; -webkit-user-select:none;
  opacity:1; transition:opacity .45s ease;
}
#board-welcome.hidden{ opacity:0; visibility:hidden; transition:opacity .45s ease, visibility 0s linear .45s; }
#board-welcome .bw-logo-svg{ width:min(300px, 50vw); height:auto; display:block; opacity:.14; }
#board-welcome .bw-text{
  font-family:'Kalam','Caveat',cursive; font-weight:700;
  font-size:clamp(22px, 3.4vw, 34px); line-height:1.25;
  color:#2A2410; opacity:.6; max-width:min(640px, 90%);
}
@media (prefers-reduced-motion: reduce){ #board-welcome, #board-welcome.hidden{ transition:none; } }

/* Pointer used for "point to the exact word/symbol currently being
   explained" (see runTeachingTurn's use of pointToWord/pointToRegion).
   A small solid dot with a soft halo, styled distinctly from the ink
   colors used for handwriting so it always reads as "UI", not content.
   It lives in viewport-fixed coordinates (like the quiz overlay) and is
   repositioned via worldToViewport-style math whenever it moves or the
   user scrolls — never via canvas drawing, so it's cheap to animate
   smoothly every frame without a full canvas redraw. */
/* The "hovering highlighter" used when the tutor points back at a word,
   symbol, or region already on the board (see runPointToSequence). This
   IS the pointer — there's no separate dot/cursor glyph riding alongside
   it, the same way a real highlighter doesn't need one: the highlighted
   patch itself is what draws the eye. It glides smoothly from one word
   to the next (a slower, eased left/top/width/height transition, not an
   instant jump) so a multi-word sequence reads as a highlighter sliding
   across the line, and fades in/out cleanly at the start/end of a
   sequence. Lives in viewport-fixed coordinates (like the quiz overlay)
   and is repositioned via worldYToViewportY-style math on every
   scroll/resize — never via canvas drawing — so it can animate at a full,
   smooth frame rate independent of any redraw. */
#board-pointer-highlight{
  position:fixed;
  z-index: 5;
  border-radius:5px;
  background: rgba(255, 216, 74, 0.5);
  box-shadow: 0 0 0 1px rgba(255, 190, 40, 0.35), 0 2px 10px rgba(255, 190, 40, 0.25);
  pointer-events:none;
  opacity:0;
  transition: opacity 200ms ease, left 380ms cubic-bezier(.4,0,.2,1), top 380ms cubic-bezier(.4,0,.2,1), width 380ms cubic-bezier(.4,0,.2,1), height 380ms cubic-bezier(.4,0,.2,1);
  will-change: transform, opacity, left, top, width, height;
}
#board-pointer-highlight.visible{ opacity:1; }
#board-pointer-highlight.jumping{
  /* A jump ACROSS content that isn't the natural next word (e.g. the
     very first highlight of a new sequence, or the app scrolled to
     reveal a far-off target) skips the slide animation and repositions
     instantly instead of gliding across everything in between — a
     highlighter visibly sweeping across unrelated text/diagrams on its
     way to the real target would read as a glitch, not as pointing. */
  transition: opacity 200ms ease;
}

.ambient-halo{
  position:fixed;
  inset:0;
  z-index:1;
  overflow:hidden;
  pointer-events:none;
  display:none;   /* white board: no blue ambient glow */
}
.ambient-halo::before,
.ambient-halo::after{
  content:'';
  position:absolute;
  width:65vmax;height:65vmax;
  border-radius:50%;
  filter:blur(80px);
  opacity:0.35;
  mix-blend-mode:screen;
}
.ambient-halo::before{
  top:-20%; left:-15%;
  background:radial-gradient(circle, var(--halo-blue) 0%, rgba(0,153,255,0) 70%);
  animation:haloDrift1 22s ease-in-out infinite;
}
.ambient-halo::after{
  bottom:-25%; right:-15%;
  background:radial-gradient(circle, var(--halo-blue-soft) 0%, rgba(0,229,255,0) 70%);
  animation:haloDrift2 26s ease-in-out infinite;
}
@keyframes haloDrift1{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(12%,10%) scale(1.18); }
}
@keyframes haloDrift2{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(-10%,-8%) scale(1.15); }
}

.topbar{
  position:fixed;
  top:0;left:0;right:0;
  display:flex;
  flex-wrap:wrap;
  row-gap:8px;
  justify-content:space-between;
  align-items:flex-start;
  padding:calc(var(--safe-top) + 14px) calc(var(--safe-right) + var(--content-padding)) 10px calc(var(--safe-left) + var(--content-padding));
  pointer-events:none;
  z-index:20;
}
.topbar > *{pointer-events:auto;}
.topbar-left-stack{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:var(--control-gap);
}
.icon-btn{
  width:var(--control-size);height:var(--control-size);
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(6px);
  box-shadow:0 1px 4px rgba(0,0,0,0.08), 0 0 0 4px var(--violet-ring);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:16px;
  color:var(--ink);
  flex-shrink:0;
}
.icon-btn:hover{background:#F5F3FC;}
.top-right-cluster{
  display:flex;flex-direction:column;gap:10px;align-items:flex-end;
  /* The real Google "Sign in" button (and, once signed in, the account
     chip) is NOT part of this page — it lives in the top-level shell
     page one level up, fixed at the very top of the whole screen, and
     it always renders above every iframe's content no matter what
     z-index anything in here has. It can be quite wide/tall while
     signed out, so this cluster needs real fixed clearance below it —
     not just alignment with the icon row — or Exit Lesson silently
     sits underneath it and becomes unclickable/invisible exactly like
     that. control-size covers the icon row's own height; +34px is the
     extra headroom for the shell's overlay on top of that. */
  margin-top:0;
}
.topbar-btn-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}
.status-chip{
  font-family:'JetBrains Mono', monospace;
  font-size:10.5px;
  color:var(--muted);
  background:rgba(255,255,255,0.7);
  padding:6px 10px;
  border-radius:20px;
  align-self:center;
  margin-right:4px;
  white-space:nowrap;
}
.exit-lesson-btn{
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  font-weight:700;
  color:#fff;
  background:#e53e3e;
  border:none;
  border-radius:999px;
  padding:8px 14px;
  cursor:pointer;
  white-space:nowrap;
  box-shadow:0 2px 8px rgba(229,62,62,0.35);
  transition:background .15s ease, transform .15s ease;
}
.exit-lesson-btn:hover{ background:#c53030; }
.exit-lesson-btn:active{ transform:scale(0.96); }
@media (max-width:600px){
  .exit-lesson-btn{ font-size:9.5px; padding:6px 10px; }
}

.btn-label{
  font-family:'JetBrains Mono', monospace;
  font-size:9px;
  color:var(--muted);
  letter-spacing:0.2px;
  white-space:nowrap;
  background:rgba(255,255,255,0.85);
  padding:1px 6px;
  border-radius:8px;
}

/* ------------------------------------------------------------
   BOTTOM DOCK
   Everything anchored to the bottom of the screen (the speaking
   avatar, the live caption, and the control bar) now lives inside
   one flow container instead of three independently-positioned
   fixed elements guessing at each other's height. Stacking them
   in normal document flow is what actually guarantees they can
   never overlap one another, on any device, without needing to
   hard-code any element's height. JS reads this container's
   rendered height (see getLayoutInsets()) to keep the on-canvas
   handwriting from ever being drawn underneath it. ------------------------------------------------------------ */
.bottom-dock{
  position:fixed;
  left:0;right:0;bottom:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  pointer-events:none;
  padding-left:var(--safe-left);
  padding-right:var(--safe-right);
  padding-bottom:var(--safe-bottom);
}
.bottom-dock > *{pointer-events:auto;}

.speaker-row{ display:none; }

.top-center-cluster{
  position:fixed;
  /* Sits just under the login pill (which lives at safe-top+14px) —
     high up near the very top of the screen on every device/breakpoint,
     instead of hanging down at top-control-height where it used to
     cover the first lines the tutor writes on the board. */
  top:calc(var(--safe-top) + 46px);
  left:50%;
  transform:translateX(-50%);
  z-index:19;
  display:flex;
  align-items:center;
  gap:8px;
  pointer-events:none;
}

.caption-zone{ display:none; }
.caption-text{
  max-width:var(--caption-max-width);
  width:100%;
  text-align:center;
  font-size:16px;
  line-height:1.5;
  color:#3a372e;
}
.caption-text .fading{color:#b9b295;}

.avatar-cluster{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
  padding-bottom:8px;
}
.avatar{
  width:52px;height:52px;
  border-radius:50%;
  background:#fff;
  border:2px solid var(--panel-border);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
  position:relative;
  flex-shrink:0;
}
.avatar-topbar{
  width:var(--control-size);height:var(--control-size);
  font-size:18px;
  box-shadow:0 1px 4px rgba(0,0,0,0.08), 0 0 0 4px var(--violet-ring);
  flex-shrink:0;
}
.avatar.speaking{border-color:var(--ochre);}
.avatar.speaking::after{
  content:'';
  position:absolute; inset:-6px;
  border-radius:50%;
  border:2px solid var(--ochre);
  opacity:0.5;
  animation:ripple 1.6s ease-out infinite;
}
@keyframes ripple{0%{transform:scale(0.85);opacity:0.6;}100%{transform:scale(1.25);opacity:0;}}

.tutor-live{
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.2px;
  color:#1f9d55;
  background:rgba(255,255,255,0.85);
  padding:5px 10px;
  border-radius:14px;
  display:flex;align-items:center;gap:6px;
  white-space:nowrap;
  flex-shrink:0;
  animation:tutor-live-pulse 1.8s ease-in-out infinite;
}
.tutor-live::before{
  content:'';
  width:7px;height:7px;border-radius:50%;
  background:#1f9d55;
  animation:tutor-dot-pulse 1.8s ease-in-out infinite;
}
@keyframes tutor-live-pulse{0%,100%{opacity:1;}50%{opacity:0.6;}}
@keyframes tutor-dot-pulse{
  0%{box-shadow:0 0 0 0 rgba(31,157,85,0.55);}
  70%{box-shadow:0 0 0 8px rgba(31,157,85,0);}
  100%{box-shadow:0 0 0 0 rgba(31,157,85,0);}
}

.cluster-btn-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  flex-shrink:0;
}
.cluster-btn{
  width:var(--control-size-sm);height:var(--control-size-sm);border-radius:50%;
  border:1px solid var(--panel-border);
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:12px;color:var(--ink);
  box-shadow:0 1px 4px rgba(0,0,0,0.06), 0 0 0 3px var(--violet-ring);
}
.cluster-btn:hover{background:#F5F3FC;}

.bottom-bar{
  position:static;
  z-index:20;
  display:flex;
  flex-wrap:nowrap;
  align-items:center;
  justify-content:center;
  gap:var(--control-gap);
  padding:12px var(--content-padding) 12px;
}
/* Replay/Transcript keep their fixed round size on every device; only
   the ask bar (which now also holds Talk, docked beside Send) grows/
   shrinks to take up the slack — this is what keeps Replay – Ask –
   Transcript on one strict, never-wrapping row from the smallest phone
   up to a wide desktop. */
.bottom-bar > .cluster-btn-wrap{ flex:0 0 auto; }

.mic-btn{
  width:var(--control-size-sm);height:var(--control-size-sm);border-radius:50%;
  border:none;
  background:linear-gradient(135deg, var(--violet), var(--violet-deep));
  color:#fff;
  font-size:13px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  box-shadow:0 3px 10px rgba(108,92,231,0.35), 0 0 0 3px var(--violet-ring);
}
.mic-btn.live{ background:#e53e3e; box-shadow:0 3px 10px rgba(229,62,62,0.45), 0 0 0 4px var(--violet-ring); animation:mic-pulse 1.3s ease-in-out infinite; }
.mic-btn.unsupported{background:#c9c4b5;box-shadow:none;cursor:not-allowed;}
@keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,62,62,.55), 0 0 0 4px var(--violet-ring);}50%{box-shadow:0 0 0 10px rgba(229,62,62,0), 0 0 0 4px var(--violet-ring);}}
/* Talk now lives inside the ask box itself (tap-and-hold to talk, right next
   to Send) instead of its own separate round button beside it. */
.ask-zone .mic-btn{
  width:26px;height:26px;
  box-shadow:none;
  margin:0 1px;
}
.ask-zone .mic-btn.live{ box-shadow:0 0 0 3px rgba(229,62,62,0.25); }

.ask-zone{
  position:relative;
  display:flex;
  gap:5px;
  align-items:center;
  background:#fff;
  border:1.5px solid var(--ink);
  border-radius:12px;
  padding:2px 2px 2px 12px;
  box-shadow:0 3px 14px rgba(0,0,0,0.08);
  flex:1 1 auto;
  max-width:var(--ask-zone-width);
  min-width:0;
  height:var(--control-size-sm);
  /* No vertical offset here anymore — the ask bar now sits on the exact
     same baseline as Replay/Talk/Transcript beside it (the bottom-bar's
     own align-items:center is what keeps everything level). */
}
.ask-icon-btn{
  width:18px;height:18px;border-radius:50%;
  border:none; background:transparent; color:var(--muted);
  cursor:pointer; font-size:11px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.ask-icon-btn:hover{ background:rgba(0,0,0,0.05); color:var(--ink); }
.attach-chip{
  position:absolute; left:14px; bottom:calc(100% + 8px);
  display:flex; align-items:center; gap:6px;
  background:#fff; border:1px solid var(--panel-border); border-radius:14px;
  padding:5px 8px 5px 10px;
  font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink);
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
  max-width:260px;
}
.attach-chip-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:170px; }
.attach-chip-remove{ border:none; background:transparent; cursor:pointer; font-size:14px; color:var(--muted); line-height:1; padding:0 2px; }
.attach-chip-remove:hover{ color:var(--brick); }
.ask-zone input{
  flex:1;
  min-width:0;
  border:none;outline:none;
  font-family:'Source Serif 4', serif;
  font-size:14px;
  padding:6px 0;
  background:transparent;
}
.ask-zone button{
  width:22px;height:22px;border-radius:50%;
  border:none;background:var(--ink);color:#fff;
  cursor:pointer;font-size:10px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  box-shadow:0 0 0 3px var(--violet-ring);
}
.ask-zone button:hover{background:var(--violet);}
.ask-zone{ border-color:var(--violet-deep); }

/* While the tutor is speaking, the follow-up box itself turns green and
   pulses so it visibly reads as "she's talking, but you can still jump
   in here" — and settles back the instant she stops. --voice-amp is a
   0..1 number the JS voice-level loop updates every frame from the
   actual Edge TTS audio (real amplitude); when that audio path isn't
   available (browser-voice fallback, or Web Audio blocked) --voice-amp
   just stays 0 and the keyframe animation alone still gives a steady,
   honest pulse rather than nothing at all. */
.ask-zone.tutor-speaking{
  --voice-amp:0;
  border-color:var(--speak-green);
  background:
    linear-gradient(0deg, rgba(var(--speak-green-rgb),0.07), rgba(var(--speak-green-rgb),0.07)),
    #fff;
  box-shadow:
    0 3px 14px rgba(0,0,0,0.08),
    0 0 calc(10px + var(--voice-amp) * 22px) calc(1px + var(--voice-amp) * 5px) rgba(var(--speak-green-rgb), calc(0.28 + var(--voice-amp) * 0.32));
  transition:border-color .25s ease, background .25s ease;
  animation:ask-zone-breathe 1.7s ease-in-out infinite;
}
.ask-zone-halo{
  position:absolute; inset:-7px;
  border-radius:17px;
  border:2px solid transparent;
  opacity:0;
  pointer-events:none;
}
.ask-zone.tutor-speaking .ask-zone-halo{
  border-color:var(--speak-green);
  opacity:0.5;
  animation:ask-zone-ripple 1.5s ease-out infinite;
}
@keyframes ask-zone-breathe{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(calc(1.006 + var(--voice-amp) * 0.02)); }
}
@keyframes ask-zone-ripple{
  0%{ transform:scale(0.96); opacity:0.55; }
  100%{ transform:scale(1.05); opacity:0; }
}
@media (prefers-reduced-motion:reduce){
  .ask-zone.tutor-speaking{ animation:none; }
  .ask-zone.tutor-speaking .ask-zone-halo{ animation:none; opacity:0.35; }
}

/* Inside the Transcript side panel, .ask-zone sits in a vertical flex
   column (.panel-body) instead of the horizontal bottom-bar it was
   designed for — its flex:1 1 auto there means "grow to fill the row",
   but in a column that reads as "grow to fill all remaining height",
   which is what was blowing the ask box up into a giant tinted panel.
   Pin it back down to its natural pill height and full width instead. */
.panel-body .ask-zone{
  flex:0 0 auto;
  width:calc(100% - 32px);
  max-width:none;
  height:44px;
  margin:0 16px 16px;
  box-sizing:border-box;
}

.overlay{
  position:fixed;inset:0;
  background:rgba(20,18,12,0.25);
  z-index:29;
  opacity:0;pointer-events:none;
  transition:opacity .2s ease;
}
.overlay.open{opacity:1;pointer-events:auto;}

.subject-modal{
  position:fixed; inset:0; z-index:50;
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none;
  transition:opacity .2s ease;
}
.subject-modal.open{ opacity:1; pointer-events:auto; }
.subject-modal .sm-scrim{
  position:absolute; inset:0; background:rgba(20,18,12,0.45); backdrop-filter:blur(2px);
}
.subject-modal .sm-card{
  position:relative; z-index:1;
  width:min(420px, calc(100vw - 48px));
  background:#fff; border-radius:18px;
  box-shadow:0 24px 60px rgba(0,0,0,0.25);
  padding:34px 30px 28px;
  font-family:'Source Serif 4', Georgia, serif;
  color:var(--ink);
  transform:translateY(8px) scale(0.98);
  transition:transform .22s cubic-bezier(.2,.8,.2,1);
}
.subject-modal.open .sm-card{ transform:translateY(0) scale(1); }
.subject-modal .sm-eyebrow{
  font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.4px;
  color:var(--ochre); margin:0 0 10px;
}
.subject-modal h2{ font-size:22px; margin:0 0 8px; font-weight:600; }
.subject-modal p{ font-size:14px; color:var(--muted); line-height:1.5; margin:0 0 20px; }
.subject-modal input{
  width:100%; font-family:'Source Serif 4', serif; font-size:16px;
  border:1.5px solid var(--panel-border); border-radius:10px;
  padding:12px 14px; color:var(--ink); outline:none;
  transition:border-color .15s ease;
}
.subject-modal input:focus{ border-color:var(--ochre); }
.subject-modal .sm-existing{ margin-top:16px; }
.subject-modal .sm-existing-label{
  font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--muted);
  margin:0 0 8px; letter-spacing:0.2px;
}
.subject-modal .sm-chip-row{ display:flex; flex-wrap:wrap; gap:7px; max-height:110px; overflow-y:auto; }
.subject-modal .sm-chip{
  font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink);
  background:var(--highlight); border:1px solid var(--panel-border); border-radius:999px;
  padding:6px 13px; cursor:pointer; transition:border-color .15s ease, background .15s ease;
}
.subject-modal .sm-chip:hover{ border-color:var(--ochre); background:#fff; }
.subject-modal .sm-chip.selected{ background:var(--ink); color:#fff; border-color:var(--ink); }
.subject-modal .sm-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
.subject-modal .sm-skip{
  font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted);
  background:none; border:none; cursor:pointer; padding:10px 4px;
}
.subject-modal .sm-skip:hover{ color:var(--ink); }
.subject-modal .sm-go{
  font-family:'Source Serif 4', serif; font-size:15px; font-weight:600;
  background:linear-gradient(140deg, var(--ochre), var(--violet)); color:#fff; border:none; border-radius:999px;
  padding:11px 22px; cursor:pointer; box-shadow:0 6px 14px -6px rgba(120,90,20,0.35);
  transition:transform .18s ease;
}
.subject-modal .sm-go:hover{ transform:translateY(-2px); }

.side-panel{
  position:fixed;
  top:0;left:0;bottom:0;
  width:360px;
  /* Same cream/gold panel chrome as the Home/Summaries/Notes sidebar —
     only the board itself keeps the blue chalkboard palette. */
  background:linear-gradient(165deg, #FFFFFF 0%, #FFF7E0 55%, #F5E6B8 130%);
  border-right:1px solid rgba(0,0,0,0.06);
  z-index:30;
  transform:translateX(-100%);
  transition:transform .25s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;
  box-shadow:
    3px 0 1px rgba(255,255,255,0.6) inset,
    10px 0 24px -8px rgba(120,90,20,0.14),
    26px 0 46px -20px rgba(120,90,20,0.10);
  padding-left:var(--safe-left);
  padding-bottom:var(--safe-bottom);
  color:var(--shell-ink);
}
.side-panel.open{transform:translateX(0);}

/* Transcript-only panel: mirror of .side-panel, docked to the right
   instead of the left, so Menu (sidebar) and Transcript (conversation
   log + ask box) never fight over the same slide-out panel. */
.conv-panel{
  left:auto; right:0;
  border-right:none; border-left:1px solid rgba(0,0,0,0.06);
  box-shadow:-8px 0 1px rgba(255,255,255,0.6) inset, -10px 0 24px -8px rgba(120,90,20,0.14), -26px 0 46px -20px rgba(120,90,20,0.10);
  transform:translateX(100%);
  padding-left:0; padding-right:var(--safe-right, 0);
}
.conv-panel.open{transform:translateX(0);}

.panel-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:calc(18px + var(--safe-top)) 20px 18px;border-bottom:1px solid rgba(0,0,0,0.08);
  flex-shrink:0;
}
.panel-head h1{
  font-size:19px;margin:0;font-weight:600;color:var(--shell-ink);
}
.panel-head h1 em{color:var(--ochre);font-style:italic;}
.panel-close{
  background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);
}

/* Brand mark + nav + recent-work list — copied to match the Home /
   Summaries / Notes sidebar exactly (same classes, same look), so the
   panel reads as part of the same app instead of a differently
   themed drawer. */
.sidebar-brand{
  font-family:'Caveat', cursive; font-weight:700; font-size:26px;
  color:var(--shell-ink); text-decoration:none; display:flex; align-items:center; gap:8px;
}
.sidebar-brand .dot{
  width:9px;height:9px;border-radius:50%;
  background:linear-gradient(135deg, var(--shell-gold), var(--ochre));
  display:inline-block; box-shadow:0 0 0 4px rgba(240,185,77,0.30);
}
.sidebar-nav{ display:flex; flex-direction:column; gap:2px; }
.sidebar-nav a{
  display:flex; align-items:center; gap:11px;
  color:rgba(42,36,16,0.78); text-decoration:none; padding:10px 12px; border-radius:10px;
  font-family:'JetBrains Mono', monospace; font-size:12.5px;
  transition:background .15s ease, color .15s ease;
}
.sidebar-nav a .ic{ font-size:15px; width:18px; text-align:center; flex-shrink:0; }
.sidebar-nav a:hover{ background:rgba(0,0,0,0.05); color:var(--shell-ink); }
.sidebar-nav a.active{ background:rgba(240,185,77,0.24); color:var(--shell-gold-deep); font-weight:600; }
.sidebar-divider{ height:1px; background:rgba(0,0,0,0.08); margin:14px 6px; flex-shrink:0; }
.sidebar-recent a{
  display:flex; align-items:center; gap:9px; text-decoration:none; color:rgba(42,36,16,0.78);
  padding:8px 10px; border-radius:9px; font-size:12.5px;
  transition:background .15s ease;
}
.sidebar-recent a:hover{ background:rgba(0,0,0,0.05); color:var(--shell-ink); }
.sidebar-recent a .ic{ font-size:13px; flex-shrink:0; }
.sidebar-recent a .rw-title{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sidebar-footer a{
  display:flex; align-items:center; gap:11px; text-decoration:none; color:rgba(42,36,16,0.55);
  font-family:'JetBrains Mono', monospace; font-size:12.5px; padding:9px 12px; border-radius:10px;
  transition:background .15s ease, color .15s ease;
}
.sidebar-footer a:hover{ background:rgba(0,0,0,0.05); color:var(--shell-ink); }
.course-banner{
  font-family:'Source Serif 4', serif; font-size:15.5px; font-weight:600;
  color:var(--shell-ink); line-height:1.3;
}
.course-banner .cb-label{
  display:block; font-family:'JetBrains Mono', monospace; font-weight:600;
  font-size:10px; letter-spacing:0.4px; color:var(--muted); margin-bottom:4px;
}

.panel-body{flex:1;overflow-y:auto;}
/* =====================================================================
   SIDEBAR — matches the rest of the app
   Open by default, docks and PUSHES the whole tutor view over (board, top
   bar, ask bar, quiz card), and slides back when closed. One variable,
   --sb-offset, drives every shifted element so they always move together.
   ===================================================================== */
:root{ --sb-offset:0px; }
body.panel-open{ --sb-offset:var(--side-panel-w); }

/* Same motion curve as the Home sidebar */
.side-panel:not(.conv-panel){
  transform:translateX(-100%);
  transition:transform .38s cubic-bezier(.22,.9,.32,1.1), box-shadow .38s ease;
  z-index:45;
}
.side-panel:not(.conv-panel).open{ transform:translateX(0); }
/* Transcript panel keeps its own right-docked behaviour, just with the same easing. */
.conv-panel{ transform:translateX(100%); transition:transform .38s cubic-bezier(.22,.9,.32,1.1); }
.conv-panel.open{ transform:translateX(0); }
.side-panel:not(.conv-panel)::after{
  content:''; position:absolute; top:0; right:-5px; bottom:0; width:5px;
  background:linear-gradient(90deg, rgba(120,90,20,0.16), rgba(120,90,20,0));
  pointer-events:none; transition:opacity .38s ease;
}
.side-panel:not(.conv-panel):not(.open)::after{ opacity:0; }

/* The pill: docked to the sidebar edge and slides with it. */
.sidebar-toggle{
  position:fixed; z-index:50;
  top:calc(var(--safe-top) + 18px);
  left:calc(var(--sb-offset) - 56px);   /* 56px inside the panel edge — same as every other page */
  height:34px; padding:0 16px 0 14px; border-radius:999px; border:none; cursor:pointer;
  background:rgba(255,255,255,0.95);
  box-shadow:0 3px 10px rgba(120,90,20,0.18), 0 0 0 1px rgba(120,90,20,0.08);
  font-size:12px; font-family:'JetBrains Mono', monospace; font-weight:600;
  display:flex; align-items:center; gap:7px; justify-content:center;
  color:var(--ink); white-space:nowrap;
  transition:left .38s cubic-bezier(.22,.9,.32,1.1), transform .15s ease, box-shadow .15s ease;
}
.sidebar-toggle:hover{ box-shadow:0 5px 16px rgba(120,90,20,0.24), 0 0 0 1px rgba(120,90,20,0.1); }
.sidebar-toggle:active{ transform:scale(0.94); }
.sidebar-toggle .arrow{ font-size:13px; }
/* Closed: pill returns to the top-left corner */
body:not(.panel-open) .sidebar-toggle{ left:calc(var(--safe-left) + 16px); }

/* Everything that was pinned to the viewport now respects the sidebar. */
#board-wrap{
  left:var(--sb-offset); width:calc(100% - var(--sb-offset));
  transition:left .38s cubic-bezier(.22,.9,.32,1.1), width .38s cubic-bezier(.22,.9,.32,1.1);
}
.topbar{
  left:var(--sb-offset);
  transition:left .38s cubic-bezier(.22,.9,.32,1.1);
}
.bottom-dock{
  left:var(--sb-offset);
  transition:left .38s cubic-bezier(.22,.9,.32,1.1);
}
.top-center-cluster{
  left:calc(var(--sb-offset) + (100% - var(--sb-offset)) / 2);
  transition:left .38s cubic-bezier(.22,.9,.32,1.1);
}
#board-quiz-overlay{
  left:var(--sb-offset);
  transition:left .38s cubic-bezier(.22,.9,.32,1.1);
}

/* Closed panels are parked off-screen but their big soft shadows still bled a beige
   smudge onto the screen edge. On a white board that shows, so drop the shadow
   until the panel is actually open. */
.side-panel:not(.open){ box-shadow:none !important; }
.side-panel:not(.conv-panel)::after{ display:none; }
.side-panel:not(.conv-panel).open::after{ display:block; }

/* Docked, not floating: never dim the board and never drop a shadow onto it. */
body.panel-open .overlay{ display:none; }
body.panel-open .side-panel:not(.conv-panel){ box-shadow:
    3px 0 1px rgba(255,255,255,0.6) inset,
    10px 0 24px -8px rgba(120,90,20,0.14),
    26px 0 46px -20px rgba(120,90,20,0.10); }

/* Narrow screens (phones): the sidebar floats OVER the content instead of
   pushing it (no room to spare), exactly like the Home page. */
@media (max-width:700px){
  body.panel-open{ --sb-offset:0px; }
  .side-panel{ width:min(320px, 86vw); }
  .sidebar-toggle{ left:calc(var(--safe-left) + 16px); top:calc(var(--safe-top) + 16px); }
  body:not(.panel-open) .sidebar-toggle{ left:calc(var(--safe-left) + 16px); }
  body.panel-open .overlay{ display:block; }
}

/* Tutor sidebar: only the account name (top) + PDF/source drop are shown.
   The rest stays in the DOM (hidden) because the tutor script looks the
   elements up by ID at load time. */
.tutor-panel-hidden{ display:none !important; }
.tutor-account-top{
  padding:14px 20px 12px;
  border-bottom:1px solid var(--panel-border);
}
.tutor-account-top .account-row{
  padding:9px 10px; border-radius:12px;
  background:rgba(0,0,0,0.045); border:1px solid rgba(0,0,0,0.08);
}
.tutor-account-top #account-name{
  font-size:13px; font-weight:600; color:var(--shell-ink);
  min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

.p-section{padding:16px 20px;border-bottom:1px solid var(--panel-border);}
.p-section h2{
  font-family:'JetBrains Mono', monospace;
  font-size:10.5px;letter-spacing:0.4px;color:var(--muted);
  margin:0 0 10px 0;
  display:flex;justify-content:space-between;align-items:center;
}
.link-btn{
  font-family:'JetBrains Mono', monospace;font-size:10px;
  color:var(--ochre);background:none;border:none;cursor:pointer;
}
.link-btn:hover{text-decoration:underline;}
.session-toggle{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;padding:8px 10px;margin-bottom:8px;
  border:1px solid var(--panel-border);border-radius:8px;
  background:var(--highlight);cursor:pointer;
  font-family:'Source Serif 4', Georgia, serif;font-size:13px;font-weight:600;
  color:var(--ink);text-align:left;
}
.session-toggle:hover{border-color:var(--ochre);}
.session-toggle .st-chevron{
  font-size:10px;color:var(--muted);transition:transform 0.15s ease;
  flex-shrink:0;margin-left:8px;
}
.session-toggle.open .st-chevron{transform:rotate(90deg);}
.account-row{display:flex;align-items:center;gap:8px;}

.upload-zone{
  border:1.5px dashed #d8d2bd;border-radius:6px;padding:14px;
  text-align:center;cursor:pointer;font-size:13px;color:#7a7361;
  transition:border-color .15s ease;
}
.upload-zone:hover{border-color:var(--ochre);}
.upload-zone.has-file{border-style:solid;border-color:var(--sage);color:var(--ink);text-align:left;}
.file-name{font-weight:600;font-size:12.5px;}
.file-meta{font-family:'JetBrains Mono', monospace;font-size:10px;color:var(--muted);margin-top:3px;}
#pdf-input{display:none;}

.topic-input{
  width:100%;padding:10px 11px;border:1px solid var(--panel-border);border-radius:6px;
  font-family:'Source Serif 4', serif;font-size:13px;resize:none;height:56px;
}
.topic-input:focus{outline:none;border-color:var(--ochre);}
select.topic-input{font-family:'Source Serif 4', serif;background:#fff;cursor:pointer;}
.p-row{display:flex;gap:8px;margin-top:9px;}
.p-btn{
  flex:1;font-family:'Source Serif 4', serif;font-size:13px;
  border:1px solid var(--ink);background:transparent;color:var(--ink);
  padding:8px 10px;border-radius:5px;cursor:pointer;
}
.p-btn.primary{background:var(--ink);color:#fff;}
.p-btn:hover{background:var(--ochre);border-color:var(--ochre);color:#fff;}

.session-list{max-height:130px;overflow-y:auto;display:none;flex-direction:column;gap:6px;}
.session-list.open{display:flex;}
.session-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 9px;border:1px solid var(--panel-border);border-radius:5px;
  font-size:12px;cursor:pointer;
}
.session-item:hover{border-color:var(--ochre);}
.session-item .s-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
.session-item .s-date{font-family:'JetBrains Mono', monospace;font-size:9.5px;color:var(--muted);flex-shrink:0;margin-left:8px;}
.session-item .s-delete{border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 4px;margin-left:6px;flex-shrink:0;border-radius:4px;}
.session-item .s-delete:hover{color:#b3452f;background:#FBEDE9;}

.transcript{padding:14px 20px;display:flex;flex-direction:column;gap:12px;}
.msg{font-size:13px;line-height:1.5;}
.msg .who{font-family:'JetBrains Mono', monospace;font-size:9.5px;letter-spacing:0.3px;display:block;margin-bottom:3px;}
.msg.tutor .who{color:var(--ochre);}
.msg.user .who{color:var(--sage);}
.msg.user{color:#514d41;padding-left:9px;border-left:2px solid var(--sage);}
.empty-note{font-size:12px;color:var(--muted);font-style:italic;}

.quiz-card{background:#fdfcf7;border:1px solid var(--panel-border);border-radius:6px;padding:14px;margin-top:2px;}
.quiz-q{font-size:13px;font-weight:600;margin-bottom:9px;line-height:1.4;}
.quiz-opt{
  display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:6px;
  border:1px solid var(--panel-border);border-radius:5px;background:#fff;
  font-family:'Source Serif 4', serif;font-size:12.5px;cursor:pointer;
}
.quiz-opt:hover{border-color:var(--ochre);}
.quiz-opt.correct{background:#eaf1ec;border-color:var(--sage);}
.quiz-opt.incorrect{background:#f6e9e5;border-color:var(--brick);}
.quiz-opt:disabled{cursor:default;}
.quiz-explain{font-size:12px;margin-top:9px;padding-top:9px;border-top:1px solid var(--panel-border);color:#514d41;display:none;}
.quiz-explain.show{display:block;}

/* The on-canvas quiz card. Lives in its own fixed, full-viewport,
   pointer-events:none layer (#board-quiz-overlay) directly on top of
   the board canvas, so it can never intercept pan/zoom gestures on the
   canvas underneath it except over the card itself. The card's own
   position is set in JS (left/top, in screen px) to track wherever
   globalCursorY currently is in world space, re-anchored on every
   redrawAll() so it stays glued to the same spot on the page through
   pan/zoom exactly like a real drawn element would. */
#board-quiz-overlay{
  position:fixed; inset:0; z-index:15; pointer-events:none;
}
.board-quiz-card{
  position:absolute; pointer-events:auto;
  width:min(92vw, 460px);
  background:#fdfcf7; border:1.5px solid var(--panel-border); border-radius:10px;
  padding:18px 20px; box-shadow:0 8px 28px rgba(30,43,58,0.18);
  animation: quizPop .28s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes quizPop{ from{ opacity:0; transform:translateY(10px) scale(.97); } to{ opacity:1; transform:translateY(0) scale(1); } }
.board-quiz-card .quiz-q{font-size:16px;margin-bottom:12px;}
.board-quiz-card .quiz-opt{font-size:14.5px;padding:10px 12px;}
.board-quiz-card .quiz-explain{font-size:13px;}

::-webkit-scrollbar{width:7px;}
::-webkit-scrollbar-thumb{background:#e4ddc8;border-radius:4px;}

/* ============================================================
   DEVICE TIERS
   Everything above this point is the DESKTOP/LAPTOP layout —
   it's the sensible default for a mouse-driven, generously-sized
   viewport (1366x768 and up). The two tiers below only ever
   override variables and the handful of rules that genuinely
   need a different arrangement on a smaller or touch-first
   screen; they never fight the base rules with duplicate
   selectors. Detection intentionally avoids user-agent sniffing
   (iPadOS Safari reports itself as a desktop browser) and instead
   combines viewport size, orientation and pointer/hover capability
   — all of which recompute live on resize/rotation with no JS
   and no page reload required.
   ============================================================ */

/* ---------- TABLET / iPAD ----------
   Real touch tablets in the iPad size class. Requiring
   pointer:coarse keeps a resized desktop browser window at the
   same width from being treated as a tablet (it'll just get a
   slightly narrower desktop layout instead, which is correct for
   a mouse). */
@media (pointer:coarse) and (min-width:601px) and (max-width:1400px) and (orientation:portrait),
       (pointer:coarse) and (min-height:501px) and (max-width:1400px) and (orientation:landscape){
  :root{
    --content-padding:28px;
    --control-size:46px;
    --control-size-sm:44px;
    --control-gap:14px;
    --top-control-height:96px;
    --bottom-control-height:150px;
    --ask-zone-width:min(720px, 66vw);
    --caption-max-width:620px;
    --side-panel-w:min(400px, 86vw);
  }
  .board-quiz-card{ width:min(80vw, 440px); }
  .side-panel{ width:min(400px, 86vw); }

  /* Touch devices in this tier (iPads of every size, big Android
     tablets) previously kept the desktop default of stacking the
     Home/Export PDF/Menu icons in a tall vertical column in the
     top-left corner. That column's height fed straight into
     measureLayoutInsets()'s top gutter (see the canvas camera code),
     so the AI's handwriting had to start well below it — often
     looking like it "starts in the middle" of the board on a tablet.
     A compact horizontal row keeps the top bar short, same fix the
     phone tier already applies below. */
  .topbar-left-stack{ flex-direction:row; align-items:flex-start; gap:10px; }
}

/* iPad portrait specifically: keep the whiteboard visually centered
   with breathing room on both sides rather than bleeding edge to
   edge like a phone. */
@media (pointer:coarse) and (min-width:601px) and (max-width:1400px) and (orientation:portrait){
  .bottom-bar{ padding-left:calc(var(--content-padding) + 6vw); padding-right:calc(var(--content-padding) + 6vw); }
  .speaker-row{ padding-left:calc(var(--content-padding) + 6vw); padding-right:calc(var(--content-padding) + 6vw); }
}

/* iPad landscape: more horizontal room for the Ask bar, controls
   pulled toward the edges instead of stretching everything wide. */
@media (pointer:coarse) and (min-height:501px) and (max-width:1400px) and (orientation:landscape){
  :root{ --ask-zone-width:min(780px, 62vw); }
}

/* ---------- PHONE ----------
   Narrow phones in portrait, and the same phones rotated to
   landscape (identified by short viewport height rather than
   width, since a landscape phone can be as "wide" as a portrait
   tablet). This tier is deliberately width/height driven — not
   gated on pointer type — so a narrow desktop browser window also
   collapses into the compact, single-column control layout, per
   the "recalculates on resize" requirement. */
@media (max-width:600px) and (orientation:portrait),
       (max-height:500px) and (orientation:landscape){
  :root{
    --content-padding:14px;
    --control-size:44px;
    --control-size-sm:44px;
    --control-gap:8px;
    --top-control-height:60px;
    --bottom-control-height:170px;
    --ask-zone-width:520px;
    --caption-max-width:100%;
  }

  /* Reclaim vertical space: the three top-left icons go from a
     tall vertical stack to a compact horizontal row so they don't
     eat a quarter of a short phone screen. */
  .topbar-left-stack{ flex-direction:row; align-items:flex-start; gap:6px; }
  .topbar-btn-wrap .btn-label{ font-size:8px; }
  .top-right-cluster{ margin-top:34px; }
  .status-chip{ font-size:9.5px; padding:5px 8px; }

  /* Bottom controls stay on ONE strict row — Replay, Ask, Talk,
     Transcript — on every device including small phones, matching
     the fixed layout used everywhere else. The ask bar itself is the
     only flexible piece (flex:1 1 auto on .ask-zone, set in the base
     rule) and shrinks to fit the remaining space between the four
     fixed-size round controls. */
  .bottom-bar{ justify-content:space-between; gap:6px; }

  .speaker-row{ padding:0 10px; }
  .caption-zone{ padding:8px 12px 6px; }
  .caption-text{ font-size:14px; }
  .avatar{ width:40px; height:40px; font-size:18px; }
  .tutor-live{ font-size:9.5px; padding:4px 8px; }

  .side-panel{ width:100vw; width:100dvw; }
  .subject-modal .sm-card{ padding:26px 20px 22px; }
}

/* Landscape phones specifically: the screen is short, so trim the
   vertical padding further and keep the caption a single line's
   worth of room instead of the taller portrait allowance. */
@media (max-height:500px) and (orientation:landscape){
  .topbar{ padding-top:calc(var(--safe-top) + 8px); padding-bottom:4px; }
  .bottom-bar{ padding-top:6px; padding-bottom:6px; }
  .caption-zone{ padding:6px 12px 4px; min-height:0; }
  .avatar{ width:34px; height:34px; font-size:16px; }
}

/* ---------- LANDSCAPE: dock the transcript panel instead of
   overlaying it ----------
   On a short phone in landscape (max-height:500px, handled above)
   the panel already goes full-width by design, so there's no room
   to "dock" it beside anything — that case is left alone. On every
   other landscape screen (tablet/desktop, where the panel is a
   fixed 360-400px column rather than the full viewport), opening
   the transcript used to slide a panel on top of the whiteboard,
   covering whatever was just written. Docking it instead — shrinking
   the board rather than covering it — leaves the handwriting fully
   visible and gives the transcript text real, uncramped width. */

/* ---- Menu tab: icon only, attached to the panel's edge and slides with it ---- */
.sidebar-toggle{
  left:var(--side-panel-w) !important;
  top:calc(var(--safe-top) + 18px);
  z-index:60;
  width:28px; height:46px; padding:0; gap:0;
  border-radius:0 14px 14px 0;
  background:linear-gradient(100deg, #F3E2B0 0%, #FFFFFF 75%);
  box-shadow:0 1px 0 #fff inset, 3px 0 0 rgba(160,120,40,0.22), 8px 6px 14px -6px rgba(90,65,10,0.40);
  transition:left .38s cubic-bezier(.22,.9,.32,1.1), transform .16s cubic-bezier(.2,.8,.3,1.1), box-shadow .16s ease;
}
.sidebar-toggle .toggle-label{ display:none; }
.sidebar-toggle .arrow{ font-size:15px; }
.sidebar-toggle:hover{ transform:translateX(3px); }
.sidebar-toggle:active{ transform:translateX(1px) scale(0.96); }
body:not(.panel-open) .sidebar-toggle{ left:0 !important; }
@media (max-width:700px){
  .sidebar-toggle{ left:min(320px, 86vw) !important; top:calc(var(--safe-top) + 18px); }
  body:not(.panel-open) .sidebar-toggle{ left:0 !important; }
}
</style>

<script>
/* ---------------------------------------------------------------
   window.storage shim: the real window.storage API only exists
   inside the Claude.ai artifact preview sandbox — on a real
   deployed site (like this one, on GitHub Pages) it doesn't exist
   at all, so every call used to throw and autosave failed silently.
   This shim gives the same get/set/list/delete interface, backed
   by localStorage, so saving actually works once deployed. Swap
   this out for real fetch() calls to your own backend later if you
   want saves to sync across devices instead of staying per-browser.
   ------------------------------------------------------------- */
if(!window.storage || !window.storage.__isRealBackend){
  const STORAGE_NS = 'chalkline:';
  window.storage = {
    __isRealBackend: false,
    async get(key){
      const raw = localStorage.getItem(STORAGE_NS + key);
      return raw === null ? null : { key, value: raw, shared: false };
    },
    async set(key, value){
      try{ localStorage.setItem(STORAGE_NS + key, value); return { key, value, shared: false }; }
      catch(e){ console.error('localStorage set failed:', e); return null; }
    },
    async delete(key){
      const existed = localStorage.getItem(STORAGE_NS + key) !== null;
      localStorage.removeItem(STORAGE_NS + key);
      return { key, deleted: existed, shared: false };
    },
    async list(prefix){
      const keys = [];
      const full = STORAGE_NS + (prefix || '');
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(full)) keys.push(k.slice(STORAGE_NS.length));
      }
      return { keys, prefix, shared: false };
    }
  };
}

// ---------------------------------------------------------------------
// TRUE CAMERA MODEL
// ---------------------------------------------------------------------
// The canvas element is a FIXED size, always exactly the viewport's
// size — it never grows tall with content the way an <img> would. What
// the user sees is controlled entirely by `camera`: x/scale for
// horizontal centering and zoom (as before), and now a real `camera.y`
// again — the world-y coordinate that sits at the very top of the
// viewport. Moving the camera means changing camera.y and redrawing the
// (still viewport-sized) canvas from scratch; there is no native
// scrolling of a tall element involved anywhere. camera.scale is still
// set once per resize/session (fit-to-width, capped) and never changes
// from panning/auto-follow/manual drag — only camera.y moves.
const camera = { x: 500, y: 0, scale: 1 };

// The board is a fixed-width "page" (PAGE_W world units) that used to
// always sit horizontally centered on screen. That's fine on a narrow
// phone (the page roughly fills the width anyway), but on a wide
// tablet/laptop the scale caps out at 1.5x while the viewport keeps
// growing, so the page ends up floating in the middle with large empty
// margins on both sides and the AI's writing starts well away from the
// actual top-left of the screen. These anchor the page's top-left
// corner to a small, fixed on-screen gutter instead, so text starts
// right near the real top-left edge of the screen on every device.
// These start as sane fallbacks and are overwritten by
// measureLayoutInsets() (called from resizeCanvas) with the *actual*
// rendered size of the on-screen chrome — the top bar and the bottom
// dock (avatar/caption/controls). Driving the gutters off a real
// measurement, rather than a guessed constant, is what lets the
// canvas content genuinely "know" how much space the controls
// occupy on every device/breakpoint instead of the two numbers
// silently going stale the moment the responsive CSS changes a
// control's size.
let PAGE_LEFT_GUTTER_PX = 24;
let PAGE_TOP_GUTTER_PX = 32;
let PAGE_RIGHT_GUTTER_PX = 24;
let PAGE_BOTTOM_GUTTER_PX = 190;
const layoutInsets = { top:0, bottom:0, left:0, right:0 };

function measureLayoutInsets(){
  const topEl = document.querySelector('.topbar');
  const bottomEl = document.getElementById('bottom-dock');
  const centerEl = document.getElementById('top-center-cluster');
  const topH = topEl ? topEl.getBoundingClientRect().height : 0;
  const centerBottom = centerEl ? centerEl.getBoundingClientRect().bottom : 0;
  const bottomH = bottomEl ? bottomEl.getBoundingClientRect().height : 0;
  const cs = getComputedStyle(document.documentElement);
  const safeLeft = parseFloat(cs.getPropertyValue('--safe-left')) || 0;
  const safeRight = parseFloat(cs.getPropertyValue('--safe-right')) || 0;
  // The avatar/"Tutor is live" badge floats fixed below the top bar now
  // (see .top-center-cluster) instead of living inside the bottom dock,
  // so the top gutter has to clear whichever of the two — top bar or
  // this cluster — actually extends further down the screen.
  layoutInsets.top = Math.max(topH, centerBottom);
  layoutInsets.bottom = bottomH;
  layoutInsets.left = safeLeft;
  layoutInsets.right = safeRight;

  // Small breathing-room buffer on top of the measured control size so
  // handwriting never sits flush against a button edge.
  PAGE_TOP_GUTTER_PX = layoutInsets.top + 16;
  PAGE_BOTTOM_GUTTER_PX = layoutInsets.bottom + 20;
  PAGE_LEFT_GUTTER_PX = layoutInsets.left + 24;
  PAGE_RIGHT_GUTTER_PX = layoutInsets.right + 24;
}

function idealCameraX(scale){ return (viewW/2 - PAGE_LEFT_GUTTER_PX) / scale; }

// Kick off loading the handwriting webfonts immediately at page load
// (rather than waiting for the first canvas draw to implicitly trigger
// it), so by the time the first AI response comes back over the network
// the fonts are already cached and text-measurement metrics are accurate
// from turn one. See the matching `await document.fonts.ready` in
// runTeachingTurn for why this matters.
['700 40px Kalam','400 40px Kalam','700 40px Caveat','400 40px Caveat'].forEach(f=>{
  document.fonts.load(f).catch(()=>{});
});

const PAGE_W = 1000;
const PAGE_H = Math.round(PAGE_W * Math.SQRT2);
const RULE_LINE_SPACING = 40;

// The multiplier that converts an author-specified "size" into the actual
// world-unit font size used for handwriting. Readable but still compact.
const HAND_SIZE_MULT = 0.92;
// Line height for a block of text at a given (already-multiplied) world
// font size, snapped to a whole number of ruled-paper lines so every line
// of handwriting sits on (or a fixed offset from) an actual rule line —
// exactly like writing on real notebook paper — while still guaranteeing
// enough vertical room that taller/bigger text never overlaps the line
// below it. The 1.25 safety factor (rather than a razor-thin 1.0) absorbs
// normal font-metric variance (ascenders/descenders, cursive flourishes)
// so text never visually touches the rule line above or below it.
function lineHeightFor(sizeWorld){
  const needed = sizeWorld * 1.25;
  const mult = Math.max(1, Math.ceil(needed / RULE_LINE_SPACING));
  return mult * RULE_LINE_SPACING;
}

const TOP_MARGIN = 80; // must be a whole multiple of RULE_LINE_SPACING so the
                        // very first line of writing starts baseline-aligned
                        // to a rule line, same as every line after it
let globalCursorY = TOP_MARGIN;
let currentTopicLabel = 'Topic';
let currentSubject = '';
let sessionQuizCount = 0; // how many quiz cards this lesson has shown — surfaced on the Dashboard's course cards

function resetRegionCursors(){
  globalCursorY = TOP_MARGIN;
  isUserScrolling = false;
  // Invalidate any in-flight scroll animation from before this reset
  // (e.g. a "follow the pen" scroll queued by the previous session's
  // last teaching turn) so it can't fight the reset below.
  panToken++;

  if (viewW > 0) {
      camera.scale = Math.min(1.5, viewW / 1050);
      camera.x = idealCameraX(camera.scale);
  }
  // A brand-new session always starts writing at the literal top-left
  // of the whiteboard, per spec — jump (not animate) the camera back to
  // world-y 0.
  setCameraYProgrammatically(0);
  redrawAll();
}

function getMaxYWorld(){
  return globalCursorY;
}

// ---------------------------------------------------------------------
// AUTO-FOLLOW VIA REAL CAMERA PANNING
// ---------------------------------------------------------------------
// The tutor auto-follows its current writing position by animating
// camera.y (and redrawing the fixed-size canvas every frame). The user
// can grab manual pan control at any time — dragging/wheeling the board
// directly moves camera.y — and once they do, auto-follow stays off
// indefinitely; there's no timer that silently snaps the camera back.
// The only thing that re-engages auto-follow is the tutor actually
// writing something new (see runTeachingTurn/enqueue paths below,
// which explicitly clear isUserScrolling when a fresh turn starts).
let panToken = 0; // cancels any in-flight camera animation
let isUserScrolling = false; // true from the user's first manual pan until the next AI-writing turn

// setCameraYProgrammatically is how every non-user-driven code path
// moves the camera (auto-follow animation, reset, session restore). It
// never itself counts as "manual" activity — only the direct drag/wheel
// handlers below call noteManualScrollActivity().
function setCameraYProgrammatically(v){
  camera.y = v;
}
function noteManualScrollActivity(){
  isUserScrolling = true;
  panToken++; // cancel any in-flight auto-follow animation immediately — never fight the user's drag
  clampScrollLimits();
}

// CAMERA LIMITS: never above the top of page 1 (camera.y can't go
// negative); never further below the latest written content than one
// viewport's worth of empty space.
function clampScrollLimits(){
  const maxY = Math.max(0, getMaxYWorld() + 400 - viewH/camera.scale);
  if(camera.y < 0) setCameraYProgrammatically(0);
  if(camera.y > maxY) setCameraYProgrammatically(maxY);
  redrawAll();
}

function animateScrollTo(targetCameraY, duration, onDone){
  const myToken = ++panToken;
  const startY = camera.y;
  const dy = targetCameraY - startY;
  const start = performance.now();
  let finished = false;
  function finish(){ if(!finished){ finished = true; if(onDone) onDone(); } }
  function ease(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
  function frame(now){
    if(myToken !== panToken || isUserScrolling){ finish(); return; }
    const raw = Math.min(1, (now-start)/duration);
    const t = ease(raw);
    setCameraYProgrammatically(startY + dy*t);
    redrawAll();
    if(raw < 1) requestAnimationFrame(frame);
    else {
      setCameraYProgrammatically(targetCameraY);
      redrawAll();
      finish();
    }
  }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------------
// MANUAL PANNING (drag / wheel / trackpad) — replaces native scrolling
// ---------------------------------------------------------------------
// #board-wrap no longer scrolls natively (see CSS: overflow:hidden), so
// these are the only source of user-driven vertical movement. Both
// paths just adjust camera.y directly and redraw; noteManualScrollActivity()
// marks the gesture as manual so auto-follow steps aside for it.
let dragPan = null; // { pointerId, lastY } while a touch/mouse drag is active

boardWrap.addEventListener('pointerdown', (e)=>{
  if(drawing && drawQueue.length){ /* still allow grabbing control mid-write */ }
  dragPan = { pointerId: e.pointerId, lastY: e.clientY };
  try{ boardWrap.setPointerCapture(e.pointerId); }catch(err){}
});
boardWrap.addEventListener('pointermove', (e)=>{
  if(!dragPan || e.pointerId !== dragPan.pointerId) return;
  const dy = e.clientY - dragPan.lastY;
  dragPan.lastY = e.clientY;
  if(dy === 0) return;
  noteManualScrollActivity();
  setCameraYProgrammatically(camera.y - dy / camera.scale);
  clampScrollLimits();
  repositionQuizOverlay();
  repositionPointerOverlay();
});
function endDragPan(e){
  if(!dragPan || (e && e.pointerId !== dragPan.pointerId)) return;
  dragPan = null;
}
boardWrap.addEventListener('pointerup', endDragPan);
boardWrap.addEventListener('pointercancel', endDragPan);
boardWrap.addEventListener('pointerleave', endDragPan);

boardWrap.addEventListener('wheel', (e)=>{
  e.preventDefault();
  noteManualScrollActivity();
  setCameraYProgrammatically(camera.y + e.deltaY / camera.scale);
  clampScrollLimits();
  repositionQuizOverlay();
  repositionPointerOverlay();
}, {passive:false});
