<script type="text/plain" id="src-home"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Chalkline — AI Study Tools</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@600;700&display=swap');

:root{
  --board-bg:#F3F9FE;
  --ink:#1E2B3A;
  --ochre:#2E7DBE;
  --highlight:#D7ECFB;
  --sage:#3E8FA6;
  --brick:#3D6B93;
  --panel-border:#D3E6F5;
  --muted:#7C93A8;
  --halo-blue:#6EA8FE;
  --halo-blue-soft:#A5C8FF;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Source Serif 4', Georgia, serif;
  color:var(--ink);
  background:var(--board-bg);
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
}

/* ambient halo, same language as the tutor board */
.ambient-halo{
  position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
}
.ambient-halo::before,.ambient-halo::after{
  content:''; position:absolute; width:60vmax;height:60vmax;
  border-radius:50%; filter:blur(100px); opacity:0.26; mix-blend-mode:multiply;
}
.ambient-halo::before{
  top:-22%; left:-18%;
  background:radial-gradient(circle, var(--halo-blue) 0%, rgba(110,168,254,0) 70%);
  animation:drift1 24s ease-in-out infinite;
}
.ambient-halo::after{
  bottom:-25%; right:-15%;
  background:radial-gradient(circle, var(--halo-blue-soft) 0%, rgba(165,200,255,0) 70%);
  animation:drift2 28s ease-in-out infinite;
}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(10%,8%) scale(1.15);}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-8%,-6%) scale(1.12);}}

.wrap{ position:relative; z-index:1; max-width:920px; margin:0 auto; padding:0 28px; }

/* ===== nav ===== */
nav{
  display:flex; align-items:center; justify-content:space-between;
  padding:26px 0 10px;
}
.brand{
  font-family:'Caveat', cursive; font-weight:700; font-size:28px;
  color:var(--ink); text-decoration:none; display:flex; align-items:center; gap:8px;
}
.brand .dot{ width:9px;height:9px;border-radius:50%; background:var(--ochre); display:inline-block; }
.nav-links{ display:flex; gap:26px; font-family:'JetBrains Mono', monospace; font-size:13px; }
.nav-links a{ color:var(--muted); text-decoration:none; }
.nav-links a:hover{ color:var(--ink); }

/* ===== hero ===== */
.hero{ padding:70px 0 56px; }
.hero h1{
  font-size:52px; line-height:1.12; font-weight:600; margin:0 0 18px;
  max-width:680px; letter-spacing:-0.01em;
}
.hero h1 .chalk{
  font-family:'Caveat', cursive; font-weight:700; color:var(--ochre);
  position:relative; white-space:nowrap;
}
.hero p{
  font-size:19px; line-height:1.6; color:#4a4738; max-width:520px; margin:0;
}

/* ===== tool cards ===== */
.tools{
  display:grid; grid-template-columns:1fr 1fr; gap:22px; margin:0 0 64px;
}
@media (max-width:680px){ .tools{ grid-template-columns:1fr; } .hero h1{ font-size:38px; } }

.tool-card{
  display:block; text-decoration:none; color:inherit;
  background:#fff; border:1px solid var(--panel-border); border-radius:14px;
  padding:30px 28px 26px; position:relative; overflow:hidden;
  transition:border-color .18s ease, transform .18s ease, box-shadow .18s ease;
}
.tool-card:hover{
  border-color:#d8d0b8; transform:translateY(-2px);
  box-shadow:0 10px 28px rgba(38,36,31,0.07);
}
.tool-card .mark{
  width:44px; height:44px; border-radius:10px; margin-bottom:20px;
  display:flex; align-items:center; justify-content:center;
  font-size:20px;
}
.tool-card.tutor .mark{ background:#D7ECFB; }
.tool-card.summary .mark{ background:#E1F0F7; }
.tool-card h2{
  font-size:23px; margin:0 0 8px; font-weight:600;
}
.tool-card p{
  font-size:15.5px; line-height:1.55; color:#5c5847; margin:0 0 18px;
}
.tool-card .go{
  font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ochre);
  display:inline-flex; align-items:center; gap:6px;
}
.tool-card.summary .go{ color:var(--sage); }
.go svg{ width:13px; height:13px; transition:transform .18s ease; }
.tool-card:hover .go svg{ transform:translateX(3px); }

/* underline squiggle under card titles, chalk-like */
.tool-card h2 span{ position:relative; }

/* ===== how it works strip ===== */
.strip{
  border-top:1px solid var(--panel-border); padding:40px 0 70px;
  display:flex; gap:40px; flex-wrap:wrap;
}
.strip-item{ flex:1; min-width:220px; }
.strip-item .num{
  font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted);
  margin-bottom:8px; display:block;
}
.strip-item h3{ font-size:16.5px; margin:0 0 6px; font-weight:600; }
.strip-item p{ font-size:14.5px; color:#6b6754; line-height:1.5; margin:0; }

footer{
  border-top:1px solid var(--panel-border); padding:22px 0 40px;
  font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--muted);
  display:flex; justify-content:space-between;
}
</style>
</head>
<body>

<div class="ambient-halo"></div>

<div class="wrap">
  <nav>
    <a class="brand" href="#" onclick="parent.postMessage({nav:'home'},'*');return false;"><span class="dot"></span>Chalkline</a>
    <div class="nav-links">

      <a href="#" onclick="parent.postMessage({nav:'summary'},'*');return false;">Summary</a>
    </div>
  </nav>

  <section class="hero">
    <h1>A study session, <span class="chalk">drawn out loud.</span></h1>
    <p>Bring a topic or a PDF. Chalkline either teaches it to you on a live whiteboard, or reads it and hands you back the version worth remembering.</p>
  </section>

  <section class="tools">
    <a class="tool-card tutor" href="#" onclick="parent.postMessage({nav:'tutor'},'*');return false;">
      <div class="mark">✏️</div>
      <h2>Live Tutor</h2>
      <p>An AI tutor that teaches on a real whiteboard — writing, diagrams, and worked examples, paced one idea at a time, with check-ins along the way.</p>
      <span class="go">Start a lesson
        <svg viewBox="0 0 16 16" fill="none"><path d="M2 8h11M9 3.5 13.5 8 9 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </a>
    <a class="tool-card summary" href="#" onclick="parent.postMessage({nav:'summary'},'*');return false;">
      <div class="mark">📄</div>
      <h2>Summary</h2>
      <p>Upload a chapter, slide deck, or set of notes as a PDF, and get a clear, structured summary of what actually matters — ready to read or save.</p>
      <span class="go">Summarize a PDF
        <svg viewBox="0 0 16 16" fill="none"><path d="M2 8h11M9 3.5 13.5 8 9 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </a>
  </section>

  <section class="strip">
    <div class="strip-item">
      <span class="num">FOR LEARNING SOMETHING NEW</span>
      <h3>Live Tutor</h3>
      <p>Type a topic or upload source material, and the tutor builds the explanation on the board as it talks — pausing to check you're following before it moves on.</p>
    </div>
    <div class="strip-item">
      <span class="num">FOR REVIEWING WHAT YOU HAVE</span>
      <h3>Summary</h3>
      <p>Drop in a PDF of notes, slides, or a chapter. Chalkline reads the whole thing and gives you a structured summary you can skim before an exam.</p>
    </div>
  </section>

  <footer>
    <span>Chalkline</span>
    <span>AI whiteboard tutor &amp; notes summarizer</span>
  </footer>
</div>

</body>
</html>
</script>
<script type="text/plain" id="src-tutor"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chalkline — Tutor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@600;700&family=Kalam:wght@400;700&display=swap');

:root{
  --board-bg:#F7FBFF;
  --ink:#1E2B3A;
  --ochre:#2E7DBE;
  --highlight:#D7ECFB;
  --sage:#3E8FA6;
  --brick:#3D6B93;
  --panel-border:#D3E6F5;
  --muted:#7C93A8;
  --halo-blue:#6EA8FE;
  --halo-blue-soft:#A5C8FF;

  --pen-ink:#20324a;
  --pen-teal:#0f8f8f;
  --pen-plum:#9a3fa8;
  --pen-rust:#c05a2c;
  --rule-line:rgba(46,125,190,0.16);
  --margin-line:rgba(192,90,44,0.35);
  --line-height:40px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Source Serif 4', Georgia, serif;
  color:var(--ink); background:var(--board-bg);
  height:100vh; position:relative; overflow:hidden;
  display:flex; flex-direction:column;
}

.ambient-halo{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.ambient-halo::before,.ambient-halo::after{
  content:''; position:absolute; width:58vmax;height:58vmax;
  border-radius:50%; filter:blur(100px); opacity:0.18; mix-blend-mode:multiply;
}
.ambient-halo::before{ top:-24%; left:-16%; background:radial-gradient(circle, var(--halo-blue) 0%, rgba(110,168,254,0) 70%); animation:d1 24s ease-in-out infinite; }
.ambient-halo::after{ bottom:-26%; right:-14%; background:radial-gradient(circle, var(--halo-blue-soft) 0%, rgba(165,200,255,0) 70%); animation:d2 28s ease-in-out infinite; }
@keyframes d1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(9%,7%) scale(1.13);}}
@keyframes d2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-7%,-6%) scale(1.1);}}

/* ===== top bar ===== */
.topbar{
  position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between;
  padding:16px 26px; flex-wrap:wrap; gap:12px;
}
.brand{ font-family:'Caveat', cursive; font-weight:700; font-size:26px; color:var(--ink); text-decoration:none; display:flex; align-items:center; gap:8px; }
.brand .dot{ width:9px;height:9px;border-radius:50%; background:var(--ochre); display:inline-block; }
.nav-links{ display:flex; gap:22px; font-family:'JetBrains Mono', monospace; font-size:12.5px; }
.nav-links a{ color:var(--muted); text-decoration:none; }
.nav-links a:hover{ color:var(--ink); }
.nav-links a.active{ color:var(--ink); border-bottom:1.5px solid var(--ochre); padding-bottom:2px; }

.toolbar{
  position:relative; z-index:2; display:flex; align-items:center; gap:10px;
  padding:0 26px 14px; flex-wrap:wrap;
}
.topic-input{
  flex:1; min-width:180px; font-family:'Source Serif 4', serif; font-size:14.5px;
  border:1px solid var(--panel-border); border-radius:9px; padding:9px 12px; background:#fff; color:var(--ink);
}
.btn{
  font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:600;
  border:1px solid var(--panel-border); border-radius:9px; padding:9px 14px;
  background:#fff; color:var(--ink); cursor:pointer; white-space:nowrap;
  transition:background .15s ease, border-color .15s ease;
}
.btn:hover{ border-color:var(--ochre); }
.btn.primary{ background:var(--ink); color:#fff; border-color:var(--ink); }
.btn.primary:hover{ background:#324457; }
.btn:disabled{ opacity:0.4; cursor:not-allowed; }
.pen-legend{
  display:flex; align-items:center; gap:10px; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted);
  padding:0 4px;
}
.pen-swatch{ display:inline-flex; align-items:center; gap:4px; }
.pen-swatch .dot{ width:8px;height:8px;border-radius:50%; display:inline-block; }

/* ===== whiteboard viewport ===== */
.board-stage{
  position:relative; z-index:1; flex:1; min-height:0;
  margin:0 20px 20px; border-radius:18px;
  padding:3px;
  background:#0b1a2e;
  box-shadow:
    0 0 0 1px rgba(110,168,254,0.5),
    0 0 22px 4px rgba(110,168,254,0.55),
    0 0 60px 14px rgba(110,168,254,0.30),
    inset 0 0 30px rgba(110,168,254,0.18);
  animation:halo-breathe 5s ease-in-out infinite;
}
@keyframes halo-breathe{
  0%,100%{ box-shadow:0 0 0 1px rgba(110,168,254,0.5), 0 0 22px 4px rgba(110,168,254,0.5), 0 0 60px 14px rgba(110,168,254,0.28), inset 0 0 30px rgba(110,168,254,0.16); }
  50%{ box-shadow:0 0 0 1px rgba(110,168,254,0.7), 0 0 30px 8px rgba(110,168,254,0.65), 0 0 76px 20px rgba(110,168,254,0.38), inset 0 0 36px rgba(110,168,254,0.22); }
}

.board-viewport{
  position:relative; height:100%; width:100%; border-radius:15px;
  overflow-y:auto; overflow-x:hidden; background:var(--board-bg);
  scrollbar-width:thin; scrollbar-color:var(--halo-blue-soft) transparent;
}
.board-viewport::-webkit-scrollbar{ width:9px; }
.board-viewport::-webkit-scrollbar-thumb{ background:var(--halo-blue-soft); border-radius:6px; }
.board-viewport::-webkit-scrollbar-track{ background:transparent; }

/* margin rule, like a real notebook page */
.board-viewport::before{
  content:''; position:absolute; top:0; bottom:0; left:64px; width:1.5px;
  background:var(--margin-line); z-index:1; pointer-events:none;
}

.board-content{
  position:relative; z-index:2;
  min-height:100%;
  padding:28px 40px 60vh 84px;
  background-image:repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent calc(var(--line-height) - 1px),
    var(--rule-line) calc(var(--line-height) - 1px),
    var(--rule-line) var(--line-height)
  );
  background-position: 0 6px;
}

.board-block{
  font-family:'Kalam', cursive; font-size:20px; line-height:var(--line-height);
  color:var(--pen-ink); margin:0; white-space:pre-wrap; word-wrap:break-word;
}
.board-block.heading{
  font-family:'Caveat', cursive; font-weight:700; font-size:34px; line-height:calc(var(--line-height) * 1.35);
  color:var(--pen-ink); margin-top:8px;
}
.board-block.equation{
  font-family:'Kalam', cursive; font-size:22px; font-weight:700;
  color:var(--pen-ink); padding-left:26px; position:relative;
}
.board-block.equation::before{
  content:'—'; position:absolute; left:0; color:var(--pen-teal); opacity:0.7;
}
.board-block.caption{
  font-family:'Kalam', cursive; font-size:15.5px; font-style:italic;
  color:var(--muted); margin-top:-4px;
}
.caret{
  display:inline-block; width:2px; background:var(--pen-ink);
  animation:blink 0.9s steps(1) infinite; margin-left:1px; vertical-align:baseline;
}
@keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }

.pen-ink{ color:var(--pen-ink); }
.pen-teal{ color:var(--pen-teal); }
.pen-plum{ color:var(--pen-plum); }
.pen-rust{ color:var(--pen-rust); }

/* jump to latest pill */
.jump-latest{
  position:absolute; bottom:18px; left:50%; transform:translate(-50%, 20px);
  z-index:5; background:var(--ink); color:#fff; border:none; border-radius:999px;
  padding:9px 18px; font-family:'JetBrains Mono', monospace; font-size:11.5px;
  cursor:pointer; box-shadow:0 6px 18px rgba(20,40,60,0.25);
  opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
}
.jump-latest.show{ opacity:1; pointer-events:auto; transform:translate(-50%, 0); }
.jump-latest:hover{ background:#324457; }

.status-line{
  position:relative; z-index:2; padding:8px 30px 14px; text-align:center;
  font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted);
}

@media (max-width:680px){
  .board-content{ padding:22px 20px 55vh 56px; }
  .board-viewport::before{ left:40px; }
  .board-block{ font-size:17px; }
  .board-block.heading{ font-size:27px; }
  .board-block.equation{ font-size:18px; }
  .topbar{ padding:12px 16px 0; }
  .toolbar{ padding:0 16px 12px; }
  .board-stage{ margin:0 10px 12px; }
  .pen-legend{ display:none; }
}
</style>
</head>
<body>

<div class="ambient-halo"></div>

<div class="topbar">
  <a class="brand" href="#" onclick="parent.postMessage({nav:'home'},'*');return false;"><span class="dot"></span>Chalkline</a>
  <div class="nav-links">
    <a href="#" class="active" onclick="return false;">Tutor</a>
    <a href="#" onclick="parent.postMessage({nav:'summary'},'*');return false;">Summary</a>
  </div>
</div>

<div class="toolbar">
  <input type="text" id="topic-input" class="topic-input" placeholder="Ask the tutor to explain something…" value="Derivatives: the slope of a curve">
  <button id="btn-start" class="btn primary">Start writing</button>
  <button id="btn-pause" class="btn" disabled>Pause</button>
  <button id="btn-restart" class="btn" disabled>Clear board</button>
  <div class="pen-legend">
    <span class="pen-swatch"><span class="dot" style="background:var(--pen-ink)"></span>notes</span>
    <span class="pen-swatch"><span class="dot" style="background:var(--pen-teal)"></span>key term</span>
    <span class="pen-swatch"><span class="dot" style="background:var(--pen-rust)"></span>warning</span>
    <span class="pen-swatch"><span class="dot" style="background:var(--pen-plum)"></span>result</span>
  </div>
</div>

<div class="board-stage">
  <div id="board-viewport" class="board-viewport">
    <div id="board-content" class="board-content"></div>
  </div>
  <button id="btn-jump" class="jump-latest">↓ jump to where the tutor is writing</button>
</div>

<div id="status-line" class="status-line">idle — press "Start writing" to begin the lesson</div>

<script>
/* =========================================================
   CONTENT SCRIPT
   This is the "lesson plan" the tutor writes onto the board.
   Each block describes one visual unit (heading / line /
   equation / caption). A line's "segments" array lets a
   single line mix pen colors, e.g. plain text plus one
   highlighted keyword or result.

   In production this array would be produced by the AI model
   (e.g. streamed from the same proxy the Summary tool uses)
   rather than hard-coded — the writer engine below consumes
   whatever segment stream it is given, so swapping a live
   model feed in means replacing LESSON with that stream.
   ========================================================= */
const LESSON = [
  { type:'heading', segments:[{t:'Derivatives', c:'ink'}] },
  { type:'line', segments:[
      {t:'A ', c:'ink'}, {t:'derivative', c:'teal'},
      {t:' measures how fast something is changing —', c:'ink'}
  ]},
  { type:'line', segments:[{t:'the slope of a curve at one exact point.', c:'ink'}]},
  { type:'line', segments:[{t:'', c:'ink'}]},
  { type:'line', segments:[{t:'Start with an ', c:'ink'}, {t:'average', c:'plum'}, {t:' rate of change:', c:'ink'}]},
  { type:'equation', segments:[{t:'slope = (f(x+h) − f(x)) / h', c:'ink'}]},
  { type:'caption', segments:[{t:'this is just rise over run, between two nearby points', c:'ink'}]},
  { type:'line', segments:[{t:'', c:'ink'}]},
  { type:'line', segments:[{t:'Now shrink ', c:'ink'}, {t:'h', c:'teal'}, {t:' toward zero. The two points', c:'ink'}]},
  { type:'line', segments:[{t:'collapse onto one — that limit is the derivative:', c:'ink'}]},
  { type:'equation', segments:[{t:"f'(x) = lim(h→0) (f(x+h) − f(x)) / h", c:'ink'}]},
  { type:'line', segments:[{t:'', c:'ink'}]},
  { type:'line', segments:[{t:'Careful: ', c:'rust'}, {t:'the limit must exist from both sides,', c:'ink'}]},
  { type:'line', segments:[{t:'or the function has no derivative there.', c:'ink'}]},
  { type:'line', segments:[{t:'', c:'ink'}]},
  { type:'heading', segments:[{t:'A quick example', c:'ink'}]},
  { type:'line', segments:[{t:'Let ', c:'ink'}, {t:'f(x) = x²', c:'teal'}, {t:'. Plug into the definition:', c:'ink'}]},
  { type:'equation', segments:[{t:'f\u2019(x) = lim(h→0) ((x+h)² − x²) / h', c:'ink'}]},
  { type:'equation', segments:[{t:'= lim(h→0) (2xh + h²) / h  =  lim(h→0) (2x + h)', c:'ink'}]},
  { type:'line', segments:[{t:'Result: ', c:'ink'}, {t:'f\u2019(x) = 2x', c:'plum'}]},
  { type:'caption', segments:[{t:'the slope of x² at any point x is simply 2x', c:'ink'}]},
];

/* =========================================================
   WRITER ENGINE
   ========================================================= */
const PEN_CLASS = { ink:'pen-ink', teal:'pen-teal', plum:'pen-plum', rust:'pen-rust' };

const viewport   = document.getElementById('board-viewport');
const content    = document.getElementById('board-content');
const btnStart   = document.getElementById('btn-start');
const btnPause   = document.getElementById('btn-pause');
const btnRestart = document.getElementById('btn-restart');
const btnJump    = document.getElementById('btn-jump');
const statusLine = document.getElementById('status-line');
const topicInput = document.getElementById('topic-input');

let writing = false;
let paused = false;
let stopRequested = false;
let autoFollow = true;
let programmaticScroll = false;
let followRaf = null;
let followTargetEl = null;

/* --- camera follow: smoothly lerp scrollTop toward a target --- */
function followElement(el){
  followTargetEl = el;
  if(!autoFollow) return;
  if(followRaf) return; // loop already running
  const step = () => {
    if(!followTargetEl || !autoFollow){ followRaf = null; return; }
    const vpRect = viewport.getBoundingClientRect();
    const elRect = followTargetEl.getBoundingClientRect();
    // keep the writing point at ~62% of the viewport height
    const desiredY = vpRect.top + vpRect.height * 0.62;
    const delta = elRect.bottom - desiredY;
    if(Math.abs(delta) > 1){
      programmaticScroll = true;
      viewport.scrollTop += delta * 0.18; // easing factor -> smooth, no jumps
      requestAnimationFrame(()=>{ programmaticScroll = false; });
      followRaf = requestAnimationFrame(step);
    } else {
      followRaf = null;
    }
  };
  followRaf = requestAnimationFrame(step);
}

function isNearBottom(){
  const distance = viewport.scrollHeight - viewport.scrollTop - viewport.clientHeight;
  return distance < 80;
}

viewport.addEventListener('scroll', ()=>{
  if(programmaticScroll) return; // ignore our own scroll adjustments
  if(isNearBottom()){
    if(!autoFollow){
      autoFollow = true;
      btnJump.classList.remove('show');
      if(followTargetEl) followElement(followTargetEl);
    }
  } else {
    if(autoFollow){
      autoFollow = false;
      btnJump.classList.add('show');
    }
  }
});

btnJump.addEventListener('click', ()=>{
  autoFollow = true;
  btnJump.classList.remove('show');
  if(followTargetEl) followElement(followTargetEl);
});

/* --- small helpers --- */
function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }

async function waitWhilePaused(){
  while(paused && !stopRequested){ await sleep(80); }
}

function makeBlockEl(type){
  const el = document.createElement('div');
  el.className = 'board-block ' + (type === 'line' ? '' : type);
  content.appendChild(el);
  return el;
}

/* type one segment's text, character by character, into a
   freshly-created colored span appended to the block */
async function typeSegment(blockEl, seg, caret){
  const span = document.createElement('span');
  span.className = PEN_CLASS[seg.c] || 'pen-ink';
  blockEl.insertBefore(span, caret);
  const text = seg.t;
  for(let i = 0; i < text.length; i++){
    if(stopRequested) return;
    await waitWhilePaused();
    span.textContent += text[i];
    followElement(blockEl);
    // slightly irregular pacing reads more like real handwriting
    const ch = text[i];
    let delay = 26 + Math.random() * 22;
    if(ch === ' ') delay *= 0.5;
    if('.,;:'.includes(ch)) delay += 90;
    await sleep(delay);
  }
}

async function writeBlock(block){
  const blockEl = makeBlockEl(block.type);
  const caret = document.createElement('span');
  caret.className = 'caret';
  blockEl.appendChild(caret);
  followElement(blockEl);
  for(const seg of block.segments){
    if(stopRequested) return;
    await typeSegment(blockEl, seg, caret);
  }
  caret.remove();
  // a small pause between lines, like a tutor thinking ahead
  await sleep(150);
}

async function runLesson(){
  writing = true;
  stopRequested = false;
  btnStart.disabled = true;
  btnPause.disabled = false;
  btnRestart.disabled = false;
  btnPause.textContent = 'Pause';
  statusLine.textContent = 'writing…';
  autoFollow = true;
  btnJump.classList.remove('show');

  for(const block of LESSON){
    if(stopRequested) break;
    await waitWhilePaused();
    await writeBlock(block);
  }

  writing = false;
  btnStart.disabled = false;
  btnPause.disabled = true;
  statusLine.textContent = stopRequested ? 'stopped' : 'done — scroll up anytime to review';
}

btnStart.addEventListener('click', ()=>{
  if(writing) return;
  content.innerHTML = '';
  topicInput.disabled = true;
  runLesson();
});

btnPause.addEventListener('click', ()=>{
  paused = !paused;
  btnPause.textContent = paused ? 'Resume' : 'Pause';
  statusLine.textContent = paused ? 'paused' : 'writing…';
});

btnRestart.addEventListener('click', ()=>{
  stopRequested = true;
  paused = false;
  writing = false;
  autoFollow = true;
  followTargetEl = null;
  content.innerHTML = '';
  viewport.scrollTop = 0;
  btnStart.disabled = false;
  btnPause.disabled = true;
  btnRestart.disabled = true;
  btnJump.classList.remove('show');
  topicInput.disabled = false;
  statusLine.textContent = 'idle — press "Start writing" to begin the lesson';
});
</script>

</body>
</html>
</script>
<script type="text/plain" id="src-summary"><!DOCTYPE html>

<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@600;700&display=swap');

/* upload zone */
#upload-zone{
  border:1.5px dashed var(--panel-border); border-radius:14px;
  padding:38px 24px; text-align:center; cursor:pointer;
  color:var(--muted); font-size:15px; background:#fff;

}

}

  font-family:'Source Serif 4', serif; font-size:15.5px; font-weight:600;

  padding:11px 22px; cursor:pointer;

.btn-primary:disabled{ background:#cfc9b4; cursor:not-allowed; }
.btn-primary:not(:disabled):hover{ background:#3a372e; }

/* output panel */
#output-wrap{ margin-top:38px; display:none; }
#output-wrap.show{ display:block; }
.output-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; flex-wrap:wrap; gap:10px; }

  font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--ochre);

}
.icon-link:hover{ text-decoration:underline; }

#summary-panel{
  background:#fff; border:1px solid var(--panel-border); border-radius:14px;

}
#summary-panel::before{
  content:''; position:absolute; top:0; left:0; right:0; height:4px;
  background:linear-gradient(90deg, var(--highlight), var(--sage) 60%, var(--halo-blue-soft));
  border-radius:14px 14px 0 0;
}
#summary-panel h3{ font-size:18px; margin:22px 0 8px; font-weight:600; }
#summary-panel h3:first-child{ margin-top:0; }

</style>
</head>
<body>

<div class="ambient-halo"></div>

<div class="wrap">
  <nav>
    <a class="brand" href="#" onclick="parent.postMessage({nav:'home'},'*');return false;"><span class="dot"></span>Chalkline</a>
    <div class="nav-links">
      <a href="#" onclick="parent.postMessage({nav:'tutor'},'*');return false;">Tutor</a>
      <a href="#" class="active" onclick="return false;">Summary</a>
    </div>
  </nav>

  <div class="page-head">
    <h1>Summarize your notes</h1>
    <p>Upload a PDF — a chapter, slide deck, or your own notes — and get back a clear, structured summary of what's actually in it.</p>
  </div>

  <div id="upload-zone">
    Drop a PDF here, or click to choose a file.
    <input type="file" id="pdf-input" accept="application/pdf">
  </div>

  <div class="controls">
    <select id="length-select" class="length-select">
      <option value="brief">Brief — key points only</option>
      <option value="standard" selected>Standard — sectioned summary</option>
      <option value="detailed">Detailed — thorough walkthrough</option>
    </select>
    <button id="btn-summarize" class="btn-primary" disabled>Summarize</button>
  </div>
  <div class="status-line" id="status-line"></div>

  <div id="output-wrap">
    <div class="output-head">
      <h2 id="output-title">Summary</h2>
      <div class="output-actions">
        <button class="icon-link" id="btn-copy">Copy</button>
        <button class="icon-link" id="btn-download">Download PDF</button>
      </div>
    </div>
    <div id="summary-panel"></div>
  </div>
</div>

<script>
/* =========================================================
   PDF IMPORT (same approach as the Tutor)
   ========================================================= */
const pdfjsAvailable = typeof pdfjsLib !== 'undefined';
if(pdfjsAvailable){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}
let pdfText = '', pdfFileName = '';
const uploadZone = document.getElementById('upload-zone');
const pdfInput = document.getElementById('pdf-input');
const btnSummarize = document.getElementById('btn-summarize');
const statusLine = document.getElementById('status-line');
function setStatus(s){ statusLine.textContent = s || ''; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

uploadZone.addEventListener('click', ()=> pdfInput.click());
uploadZone.addEventListener('dragover', (e)=> e.preventDefault());
uploadZone.addEventListener('drop', (e)=>{ e.preventDefault(); if(e.dataTransfer.files.length) handlePdfFile(e.dataTransfer.files[0]); });
pdfInput.addEventListener('change', (e)=>{ if(e.target.files.length) handlePdfFile(e.target.files[0]); });

async function handlePdfFile(file){
  if(!pdfjsAvailable){ alert("PDF import couldn't load its engine (a network or blocker issue). Try reloading the page."); return; }
  if(file.type !== 'application/pdf'){ alert('Please choose a PDF file.'); return; }
  setStatus('reading pdf…');
  pdfFileName = file.name;
  try{
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
    let fullText = '';
    const maxPages = Math.min(pdf.numPages, 60);
    for(let i=1;i<=maxPages;i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      fullText += `\n\n[Page ${i}]\n` + content.items.map(it=>it.str).join(' ');
    }
    pdfText = fullText;
    uploadZone.classList.add('has-file');
    uploadZone.innerHTML = `<div class="file-name">📄 ${escapeHtml(pdfFileName)}</div><div class="file-meta">${pdf.numPages} page${pdf.numPages===1?'':'s'} · text extracted${pdf.numPages>60 ? ' (first 60 pages)' : ''}</div>`;
    btnSummarize.disabled = false;
    setStatus('ready to summarize');
  } catch(err){
    console.error('Failed to read PDF:', err);
    setStatus('could not read this pdf — see console');
  }
}

/* =========================================================
   AI CALL — via the Chalkline proxy (Gemini). No key needed from
   the visitor; see PROXY_SETUP.md to deploy the proxy once.
   ========================================================= */
const PROXY_URL = "https://api.takundamambudzi02.workers.dev";

function lengthInstruction(mode){
  if(mode === 'brief') return "Keep it short: a handful of the most important bullet points only, no sections, under 150 words.";
  if(mode === 'detailed') return "Be thorough: cover every section of the source in real depth, with sub-points and examples where the source has them. It's fine for this to be long.";
  return "Aim for a well-organized overview: a few clear sections with headings, each with 3-6 bullet points covering the important content.";
}

async function summarizeText(text, mode){
  if(PROXY_URL.includes('YOUR-WORKER-SUBDOMAIN')){
    return { ok:false, error:"The AI proxy hasn't been set up yet — see PROXY_SETUP.md to deploy it, then set PROXY_URL in this file." };
  }

  const system = `You are a study-notes summarizer. You are given the extracted text of a PDF (a chapter, slide deck, or notes) and must produce a summary of it for a student reviewing before an exam.

Output format: plain HTML fragment only (no <html>/<body> tags, no markdown, no code fences) using only these tags: <h3> for section headings, <p> for prose, <ul>/<li> for bullet lists, <strong> for the single most important term or number in a line. Do not invent section headings like "Introduction" unless the source actually has that structure — organize around the source's real content.

${lengthInstruction(mode)}

If the extracted text looks garbled, is mostly non-text (e.g. a scanned image with no OCR), or is too sparse to summarize meaningfully, say so plainly in a single <p> instead of inventing content.`;

  const userMsg = `Extracted PDF text (file: ${pdfFileName}):\n\n${text.slice(0, 60000)}`;

  let response, data;
  try{
    response = await fetch(`${PROXY_URL}/gemini`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        system_instruction: { parts: [{ text: system }] },
        contents: [{ role:"user", parts:[{ text: userMsg }] }],
        generationConfig: { maxOutputTokens: 3000 }
      })
    });
  } catch(networkErr){
    console.error('Network-level failure calling the proxy:', networkErr);
    return { ok:false, error:"The request never reached the proxy — check the browser console and confirm PROXY_URL is correct and the proxy is deployed." };
  }

  try{ data = await response.json(); }
  catch(parseErr){
    console.error('Response was not valid JSON. Raw response:', response);
    return { ok:false, error:"The server responded, but not with valid JSON. Check the console." };
  }

  if(!response.ok){
    console.error('Gemini (via proxy) returned an error status:', response.status, data);
    const msg = (data && data.error && data.error.message) ? data.error.message : JSON.stringify(data);
    return { ok:false, error:`The model returned an error: ${msg}` };
  }

  const candidate = data.candidates && data.candidates[0];
  const part = candidate && candidate.content && candidate.content.parts && candidate.content.parts[0];
  if(!part || !part.text){
    console.error('Unexpected response shape:', data);
    return { ok:false, error:"The response came back in a shape I didn't expect. Check the console." };
  }
  return { ok:true, html: part.text.trim().replace(/^```html\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'') };
}

/* =========================================================
   WIRE UP
   ========================================================= */
const outputWrap = document.getElementById('output-wrap');
const summaryPanel = document.getElementById('summary-panel');
const outputTitle = document.getElementById('output-title');

btnSummarize.addEventListener('click', async ()=>{
  if(!pdfText){ setStatus('upload a pdf first'); return; }
  const mode = document.getElementById('length-select').value;
  btnSummarize.disabled = true;
  setStatus('reading and summarizing… this can take a moment for longer documents');
  const result = await summarizeText(pdfText, mode);
  btnSummarize.disabled = false;
  if(!result.ok){
    setStatus(result.error);
    return;
  }
  outputTitle.textContent = `Summary — ${pdfFileName.replace(/\.pdf$/i,'')}`;
  summaryPanel.innerHTML = result.html;
  outputWrap.classList.add('show');
  setStatus('done');
  outputWrap.scrollIntoView({behavior:'smooth', block:'start'});
});

document.getElementById('btn-copy').addEventListener('click', ()=>{
  const text = summaryPanel.innerText;
  navigator.clipboard.writeText(text).then(()=> setStatus('summary copied')).catch(()=> setStatus('copy failed — select and copy manually'));
});

document.getElementById('btn-download').addEventListener('click', ()=>{
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const margin = 48;
    const maxWidth = 595 - margin*2;
    let y = margin;
    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text(outputTitle.textContent, margin, y); y += 26;

    const nodes = summaryPanel.children.length ? Array.from(summaryPanel.children) : [summaryPanel];
    nodes.forEach(node=>{
      const tag = node.tagName ? node.tagName.toLowerCase() : 'p';
      if(tag === 'h3'){
        doc.setFont('helvetica','bold'); doc.setFontSize(13);
        if(y > 760){ doc.addPage(); y = margin; }
        y += 10;
        const lines = doc.splitTextToSize(node.textContent, maxWidth);
        doc.text(lines, margin, y); y += lines.length*16 + 4;
      } else if(tag === 'ul'){
        doc.setFont('helvetica','normal'); doc.setFontSize(11);
        Array.from(node.children).forEach(li=>{
          const lines = doc.splitTextToSize('•  ' + li.textContent, maxWidth);
          if(y + lines.length*14 > 780){ doc.addPage(); y = margin; }
          doc.text(lines, margin, y); y += lines.length*14 + 2;
        });
        y += 6;
      } else {
        doc.setFont('helvetica','normal'); doc.setFontSize(11);
        const lines = doc.splitTextToSize(node.textContent, maxWidth);
        if(y + lines.length*14 > 780){ doc.addPage(); y = margin; }
        doc.text(lines, margin, y); y += lines.length*14 + 8;
      }
    });

    doc.save((pdfFileName ? pdfFileName.replace(/\.pdf$/i,'') : 'summary') + ' - summary.pdf');
    setStatus('pdf downloaded');
  } catch(err){
    console.error('PDF export failed:', err);
    setStatus('pdf export failed — see console');
  }
});
<\/script>

</body>
</html>
</script>

<script>
function unwrap(id){
  return document.getElementById(id).textContent.replace(/<\\\/script/gi, '</script');
}
const frames = {
  home: document.getElementById('frame-home'),
  tutor: document.getElementById('frame-tutor'),
  summary: document.getElementById('frame-summary')
};
const loaded = { home:false, tutor:false, summary:false };
const backBtn = document.getElementById('back-btn');
let current = 'home';

function ensureLoaded(page){
  if(loaded[page]) return;
  frames[page].srcdoc = unwrap('src-' + page);
  loaded[page] = true;
}

function navTo(page, pushHistory){
  if(!frames[page]) page = 'home';
  ensureLoaded(page);
  Object.keys(frames).forEach(k => frames[k].classList.toggle('active', k === page));
  backBtn.classList.toggle('show', page !== 'home');
  current = page;
  if(pushHistory !== false){
    history.pushState({page}, '', '#' + page);
  }
}

window.addEventListener('message', (e)=>{
  const d = e.data;
  if(d && d.nav) navTo(d.nav, true);
});

window.addEventListener('popstate', (e)=>{
  const page = (e.state && e.state.page) || (location.hash ? location.hash.slice(1) : 'home');
  navTo(page, false);
});

const initial = location.hash ? location.hash.slice(1) : 'home';
history.replaceState({page: initial}, '', '#' + initial);
navTo(initial, false);
</script>
