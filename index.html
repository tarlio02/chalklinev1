// Safety net for the "always check in" pacing rule in SYSTEM_PROMPT. The
// prompt already instructs the model to end every non-quiz turn with a
// question — but that's one instruction buried deep in a long prompt, and
// over a long session the model can quietly stop following it (this is
// exactly what got reported: the AI stopped asking follow-ups). Rather
// than trust the prompt alone, enforce it deterministically here: if the
// model didn't attach a quiz AND its speech doesn't already end on a
// question, append a short, rotating check-in question ourselves so the
// pacing behavior can't silently degrade.
const FALLBACK_CHECKINS = [
  "Does that make sense so far?",
  "Any questions on this before we continue?",
  "Want me to go over that again, or should we move on?",
  "How does that land — clear, or should I slow down?",
  "Ready to keep going, or want a moment on this part first?"
];
let fallbackCheckinIdx = 0;
function ensureEngagementCheckin(speech){
  const trimmed = (speech || '').trim();
  if(!trimmed) return trimmed;
  // Already ends on a question — a real "?" is the reliable signal here
  // since the model is instructed to vary its phrasing, not use fixed text.
  if(/\?\s*$/.test(trimmed)) return trimmed;
  const q = FALLBACK_CHECKINS[fallbackCheckinIdx % FALLBACK_CHECKINS.length];
  fallbackCheckinIdx++;
  return trimmed + ' ' + q;
}

async function runTeachingTurn(userMessage, displayText, imageAttachment){
  if(displayText !== null) addTranscriptMsg('user', displayText !== undefined ? displayText : userMessage);
  // Guarantee the handwriting webfonts are fully loaded BEFORE any text is
  // measured for layout. Without this, the very first turn's line-wrap
  // calculation can run against fallback system-font metrics (if the
  // custom fonts haven't finished downloading yet), while the actual
  // canvas paint moments later uses the real, differently-sized font —
  // so the reserved vertical space is wrong and the next block overlaps
  // the one before it. Awaiting here costs nothing once fonts are cached.
  await document.fonts.ready;
  const result = await callTutor(userMessage, imageAttachment);
  // Match the board animation's total length to how long the speech for
  // this turn will take, so the pen finishes writing roughly when the
  // voice finishes talking instead of racing ahead or trailing behind.
  const boardCmds = (result.board && result.board.length) ? result.board : [];
  const totalBaseMs = boardCmds.reduce((sum,c)=> sum + baseDurationFor(c), 0);
  const speechMs = estimateSpeechDurationMs(result.speech || '');
  drawPaceScale = totalBaseMs > 0 ? Math.min(2.5, Math.max(0.6, speechMs / totalBaseMs)) : 1;
  if(boardCmds.length){ dismissQuizCard(); enqueueCommandsAtCursor(boardCmds); }
  const finalSpeech = result.quiz ? result.speech : ensureEngagementCheckin(result.speech);
  if(finalSpeech){ addTranscriptMsg('tutor', finalSpeech); speak(finalSpeech); }
  if(result.quiz) addQuizCard(result.quiz);
  autoSaveSession();
}

// Pulls the distinct subject/course names already saved (for whoever is
// currently signed in, or this browser's guest bucket) so a new lesson
// can be dropped into an existing folder instead of always starting a
// fresh one — e.g. a second "Managerial Accounting" lesson lands in the
// same Previous Tutorials folder as the first.
async function loadExistingSubjects(){
  try{
    const result = await window.storage.list(sessionKeyPrefix(), false);
    const keys = (result && result.keys) ? result.keys : [];
    const seen = new Map(); // subject -> most recent savedAt, for ordering
    for(const key of keys){
      try{
        const rec = await window.storage.get(key, false);
        if(!rec) continue;
        const item = JSON.parse(rec.value);
        const subj = (item.subject || '').trim();
        if(!subj || subj === 'Unsorted') continue;
        const savedAt = item.savedAt || 0;
        if(!seen.has(subj) || seen.get(subj) < savedAt) seen.set(subj, savedAt);
      } catch(e){}
    }
    return Array.from(seen.entries()).sort((a,b)=> b[1]-a[1]).map(([subj])=>subj);
  } catch(e){ console.error('Could not load existing subjects:', e); return []; }
}

async function populateSubjectChips(){
  const subjects = await loadExistingSubjects();
  if(subjects.length===0){ subjectExisting.style.display = 'none'; subjectChipRow.innerHTML=''; return; }

  subjects.forEach(subj=>{
    const chip = document.createElement('button');
    chip.type = 'button';

    chip.addEventListener('click', ()=>{
      subjectInput.value = subj;
      subjectChipRow.querySelectorAll('.sm-chip').forEach(c=> c.classList.remove('selected'));
      chip.classList.add('selected');
      subjectInput.focus();
    });
    subjectChipRow.appendChild(chip);
  });
}

// --- Google sign-in --------------------------------------------------
// The real Google Identity script runs one level up, in the top-level
// shell page — this tutor page is loaded via iframe .srcdoc, and a
// srcdoc document reports its origin as "null", which Google's script
// refuses to authenticate from (Error 400: invalid_request, origin=
// null). So this page doesn't call Google's API directly: it asks the
// shell to sign in/out, and reflects whatever state the shell reports.

let currentUser = null; // {sub, email, name, picture} once signed in

// Sessions are namespaced by account so switching browsers/devices
// still finds the same saved work — PROVIDED persistSession/
// refreshSessionList are pointed at a real backend keyed by this same
// prefix instead of window.storage (see note on persistSession below).
// There is deliberately no signed-out ('local') bucket: persistSession
// and refreshSessionList both refuse to touch storage at all unless
// currentUser is set, so guest work is never written anywhere durable.
function sessionKeyPrefix(){
  return 'session:' + currentUser.sub + ':';
}

// Remembers which session is currently open, per signed-in account. The
// authoritative copy now lives in the SHELL's localStorage (see the nav
// script at the bottom of the page) because this page itself is a srcdoc
// iframe re-created from scratch on every load — it has no stable URL for
// sessionStorage/localStorage to durably survive a refresh against.
// sessionStorage here is kept only as a same-load fallback.
const LAST_ACTIVE_STORAGE_KEY = 'chalkline_last_active_session';
function rememberActiveSession(){
  if(!currentUser) return;
  try{
    sessionStorage.setItem(LAST_ACTIVE_STORAGE_KEY, JSON.stringify({ sub: currentUser.sub, id: currentSessionId }));
  } catch(e){ /* best-effort only */ }
  try{ parent.postMessage({ chalklineActiveSession:true, page:'tutor', sub: currentUser.sub, id: currentSessionId }, '*'); }
  catch(e){}
}
function forgetActiveSession(){
  try{ sessionStorage.removeItem(LAST_ACTIVE_STORAGE_KEY); } catch(e){}
  try{ parent.postMessage({ chalklineActiveSession:true, page:'tutor', cleared:true }, '*'); } catch(e){}
}
function readRememberedSessionId(){
  try{
    const raw = sessionStorage.getItem(LAST_ACTIVE_STORAGE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(currentUser && parsed && parsed.sub === currentUser.sub) return parsed.id;
  } catch(e){}
  return null;
}

function resetTutorBoardState(){
  currentSessionId = 'session_' + Date.now(); currentSessionTitle = null; currentSubject = '';
  pdfText=''; pdfFileName='';

  resetUploadZoneUI();

function applyAuthState(signedIn, user){
  // Whatever session is on screen belongs to whichever account was
  // previously signed in (or to this browser as a guest). If the
  // account identity actually changes — signing out, or a different
  // account signing in — that on-screen content must not carry over,
  // or the next viewer (including a signed-out visitor) would still
  // see it even though it was never re-fetched from storage.
  const prevSub = currentUser ? currentUser.sub : null;
  const newUser = signedIn ? user : null;
  const newSub = newUser ? newUser.sub : null;
  const accountChanged = prevSub !== null && prevSub !== newSub;
  const isFirstAuthReport = !authStateKnown;
  authStateKnown = true;

  currentUser = newUser;
  document.getElementById('account-signed-out').style.display = signedIn ? 'none' : 'block';
  document.getElementById('account-signed-in').style.display = signedIn ? 'block' : 'none';
  if(signedIn){
    document.getElementById('account-avatar').src = user.picture || '';
    document.getElementById('account-name').textContent = user.name || user.email || 'Signed in';
  }
  updateLoginPillVisibility();
  if(accountChanged){
    resetTutorBoardState();
    setStatus(signedIn ? 'switched account — showing a blank board' : 'signed out — showing a blank board');
  }
  // On the very first auth report after this page loaded (e.g. right
  // after a browser refresh), try to resume whatever session this
  // account had open before — instead of always starting fresh.
  if(isFirstAuthReport && signedIn && !pendingSessionLoad){
    const rememberedId = readRememberedSessionId();
    if(rememberedId){
      pendingSessionLoad = true;
      loadSessionById(rememberedId);
    }
  }
  // TODO: once a backend exists, this is where you'd fetch/merge that
  // user's saved sessions instead of just relighting the local list.
  refreshSessionList();
}

let authStateKnown = false;
window.addEventListener('message', (e)=>{
  const d = e.data;
  if(!d || !d.chalklineAuth) return;
  applyAuthState(!!d.signedIn, d.user);
});

function transcriptToHtmlSnapshot(){ return transcriptEl.innerHTML; }

async function persistSession(){
  // Guest (signed-out) work must never survive as durable, sharable
  // storage — otherwise closing and reopening the site (or a different
  // visitor on the same browser) would still see it, even though no
  // account owns it. Only persist once someone is actually signed in;
  // signed-out use stays purely in-memory for the current page life.
  if(!currentUser) return;
  // Prefer an explicit title the person set (via Save > name it), then
  // fall back to what was actually discussed with the AI — the first
  // "teach this" topic, captured in currentTopicLabel — before falling
  // further back to the uploaded file name or a generic label. This
  // means a session saved via autosave (never explicitly named) still
  // shows up in the list as e.g. "Price elasticity of demand" instead
  // of a meaningless "Untitled session".
  const derivedTitle = currentTopicLabel && currentTopicLabel !== 'Topic'
    ? currentTopicLabel
    : (pdfFileName ? pdfFileName.replace(/\.pdf$/i,'') : 'Untitled session');
  const payload = {
    id: currentSessionId,
    title: currentSessionTitle || derivedTitle,
    subject: currentSubject || 'Unsorted',
    savedAt: Date.now(),
    pdfFileName, pdfText: pdfText ? pdfText.slice(0,15000) : '',
    conversationHistory, drawnCommands, camera,
    globalCursorY, currentTopicLabel,
    transcriptHtml: transcriptToHtmlSnapshot()
  };
  // NOTE: window.storage only exists inside a Claude.ai artifact preview.
  // On your own deployed domain this call will fail, signed in or not —
  // swap it for a fetch() to a real backend endpoint (e.g. a route on
  // your Cloudflare Worker backed by KV or D1), sending currentUser's
  // verified identity so sessions are actually saved per-account.
  await window.storage.set(sessionKeyPrefix() + currentSessionId, JSON.stringify(payload), false);
  rememberActiveSession();
  refreshSessionList();
}

// content already produced is never lost even if the person leaves

// Guarded the same way as autoSaveSession — a subject was picked but
// nothing was actually taught yet is still a blank canvas and shouldn't
// leave behind a session entry.
function flushSaveOnExit(){
  if(conversationHistory.length>0){

  }
}

let sessionListReq = 0;
async function deleteSession(id, ev){
  if(ev) ev.stopPropagation();
  if(!confirm('Delete this saved session? This can\'t be undone.')) return;
  try{
    await window.storage.delete(sessionKeyPrefix() + id, false);
    if(id === currentSessionId) resetTutorBoardState();
    refreshSessionList();
  } catch(e){ console.error('Delete session failed:', e); setStatus('delete failed — see console'); }
}
async function refreshSessionList(){
  const myReq = ++sessionListReq;
  const listEl = document.getElementById('session-list');
  const labelEl = document.getElementById('session-toggle-label');
  if(!currentUser){
    // Nothing is ever saved while signed out (see persistSession), so
    // there is nothing real to list — and we must not fall back to a
    // shared 'local' bucket that could show a previous guest's work.
    listEl.innerHTML = '<div class="empty-hint">Sign in to save sessions and see them here.</div>';
    if(labelEl) labelEl.textContent = 'Saved sessions';
    return;
  }
  try{
    const result = await window.storage.list(sessionKeyPrefix(), false);
    if(myReq !== sessionListReq) return; // superseded by a newer auth state
    const keys = (result && result.keys) ? result.keys : [];
    const items = [];
    for(const key of keys){
      try{ const rec = await window.storage.get(key, false); if(rec) items.push(JSON.parse(rec.value)); } catch(e){}
    }
    if(myReq !== sessionListReq) return;
    // Only show sessions that belong to the subject/course currently
    // being worked in — not every saved lesson across every subject.
    // With no subject picked yet (e.g. right after "new"), fall back to
    // showing the unsorted/no-subject sessions instead of everything.
    const filtered = currentSubject
      ? items.filter(item => (item.subject || 'Unsorted') === currentSubject)
      : items.filter(item => !item.subject || item.subject === 'Unsorted');
    labelEl.textContent = (currentSubject || 'Sessions') + (filtered.length ? ` (${filtered.length})` : '');
    if(filtered.length===0){
      listEl.innerHTML = `<div class="empty-note">No saved sessions yet${currentSubject ? ' in ' + escapeHtml(currentSubject) : ''}.</div>`;
      return;
    }
    filtered.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
    listEl.innerHTML = '';
    filtered.forEach(item=>{
      const div = document.createElement('div'); div.className='session-item';
      const date = new Date(item.savedAt);
      div.innerHTML = `<span class="s-name">${escapeHtml(item.title||'Untitled')}</span><span class="s-date">${date.toLocaleDateString()}</span><button type="button" class="s-delete" title="Delete">✕</button>`;
      div.addEventListener('click', ()=> loadSession(item));
      div.querySelector('.s-delete').addEventListener('click', (ev)=> deleteSession(item.id, ev));
      listEl.appendChild(div);
    });
  } catch(err){ console.error('Listing sessions failed:', err); listEl.innerHTML = '<div class="empty-note">Could not load saved sessions.</div>'; }
}

function loadSession(item){
  dismissQuizCard();
  currentSessionId = item.id; currentSessionTitle = item.title;
  currentSubject = item.subject && item.subject!=='Unsorted' ? item.subject : '';
  pdfFileName = item.pdfFileName || ''; pdfText = item.pdfText || '';
  conversationHistory = item.conversationHistory || [];
  drawnCommands = item.drawnCommands || [];
  // Only x/scale are meaningful camera fields now (see camera model
  // notes above) — an old save's camera.y, if present, is simply
  // ignored rather than restored, since there's no pan position left
  // to restore it into; scroll position is restored separately below.
  if(item.camera){ if(item.camera.x !== undefined) camera.x = item.camera.x; if(item.camera.scale !== undefined) camera.scale = item.camera.scale; }
  if(item.globalCursorY !== undefined) globalCursorY = item.globalCursorY;
  else if(item.regionCursor) globalCursorY = Math.max(item.regionCursor.notes, item.regionCursor.graph, item.regionCursor.detail);
  else globalCursorY = TOP_MARGIN;
  
  currentTopicLabel = item.currentTopicLabel || 'Topic';
  transcriptEl.innerHTML = item.transcriptHtml || '<div class="empty-note">No transcript in this session.</div>';
  if(pdfFileName){
    uploadZone.classList.add('has-file');
    uploadZone.innerHTML = `<div class="file-name">📄 ${escapeHtml(pdfFileName)}</div><div class="file-meta">restored from saved session</div>`;
  } else { resetUploadZoneUI(); }
  applyCanvasHeight();
  redrawAll();
  // Restored sessions resume scrolled to wherever the pen last was, not
  // forced back to the top — only a brand-new session (resetRegionCursors)
  // jumps to y=0.
  isProgrammaticScroll = true;
  boardWrap.scrollTop = Math.max(0, globalCursorY * camera.scale - (viewH - PAGE_BOTTOM_GUTTER_PX));
  isProgrammaticScroll = false;
  clampScrollLimits();
  setStatus('session loaded');
  closePanel();
  rememberActiveSession();
  // Subject may have changed loading this session — refresh the list so
  // it's still scoped to whatever subject/course is now active.
  refreshSessionList();
}

// Manual save is gone from the UI — sessions autosave (autoSaveSession/
// flushSaveOnExit) whenever there's actual conversation content, so
// nothing is lost without it.
document.getElementById('btn-new-session').addEventListener('click', ()=>{
  resetTutorBoardState();
  setStatus('new session');
  openSubjectModal();
});

/* =========================================================
   SIDE PANEL TOGGLES
   ========================================================= */
const sidePanel = document.getElementById('side-panel');
const overlay = document.getElementById('overlay');
function openPanel(){
  sidePanel.classList.add('open'); overlay.classList.add('open');
  document.body.classList.add('panel-open');
  // In landscape the panel docks and shrinks the board instead of
  // floating over it (see the matching CSS), so the canvas's own
  // measured width just changed — recompute the camera against it.
  resizeCanvasWhenStable(400);
}
function closePanel(){
  sidePanel.classList.remove('open'); overlay.classList.remove('open');
  document.body.classList.remove('panel-open');
  resizeCanvasWhenStable(400);
}
document.getElementById('btn-menu').addEventListener('click', ()=>{ closeConvPanel(); openPanel(); });
document.getElementById('btn-panel-close').addEventListener('click', closePanel);
overlay.addEventListener('click', ()=>{ closePanel(); closeConvPanel(); });

/* Transcript panel: docks right, shows ONLY the AI conversation log
   plus its own ask box. Asking here never draws on the board and
   never speaks the reply out loud — the response is just appended
   to the transcript, same as a text-only chat. */
const convPanel = document.getElementById('conv-panel');
function openConvPanel(){
  convPanel.classList.add('open'); overlay.classList.add('open');
}
function closeConvPanel(){
  convPanel.classList.remove('open'); overlay.classList.remove('open');
}
document.getElementById('btn-toggle-transcript').addEventListener('click', ()=>{ closePanel(); openConvPanel(); });
document.getElementById('btn-conv-close').addEventListener('click', closeConvPanel);

async function handleConvAsk(text){
  const typed = (text || '').trim();
  if(!typed) return;
  document.getElementById('conv-ask-input').value = '';
  addTranscriptMsg('user', typed);
  await document.fonts.ready;
  try{
    const result = await callTutor(typed, null);
    if(result && result.speech) addTranscriptMsg('tutor', result.speech);
  } catch(e){
    console.error('Transcript ask failed:', e);
    addTranscriptMsg('tutor', 'Sorry, something went wrong answering that.');
  }
  autoSaveSession();
}
document.getElementById('btn-conv-ask').addEventListener('click', ()=> handleConvAsk(document.getElementById('conv-ask-input').value));
document.getElementById('conv-ask-input').addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleConvAsk(e.target.value); });

/* =========================================================
   WIRE UP CONTROLS
   ========================================================= */
document.getElementById('btn-teach').addEventListener('click', ()=>{
  const val = document.getElementById('topic-input').value.trim();
  if(!val) return;
  if(conversationHistory.length === 0) currentTopicLabel = val.length > 60 ? val.slice(0,57)+'…' : val;
  runTeachingTurn(val);
  document.getElementById('topic-input').value = '';
  closePanel();
});
document.getElementById('btn-quiz').addEventListener('click', ()=>{
  const val = document.getElementById('topic-input').value.trim();
  const prompt = val ? `Please quiz me on: ${val}` : (pdfText ? `Please quiz me on the uploaded document.` : `Please quiz me on the most recent topic we discussed.`);
  runTeachingTurn(prompt);
  closePanel();
});
// Attachment picked from the ask-follow-up box's paperclip button. Cleared
// after being sent (or removed via the chip's × button).
let pendingAttachment = null; // {kind:'pdf'|'image'|'text', name, text?, mimeType?, base64?}

function renderAttachChip(){
  const chip = document.getElementById('attach-chip');
  if(!pendingAttachment){ chip.style.display = 'none'; chip.innerHTML = ''; return; }
  const icon = pendingAttachment.kind === 'image' ? '🖼' : '📄';
  chip.style.display = 'flex';
  chip.innerHTML = `<span>${icon}</span><span class="attach-chip-name">${escapeHtml(pendingAttachment.name)}</span><button type="button" class="attach-chip-remove" id="attach-chip-remove" title="Remove attachment">×</button>`;
  document.getElementById('attach-chip-remove').addEventListener('click', ()=>{ pendingAttachment = null; renderAttachChip(); });
}

async function handleAttachFile(file){
  try{
    if(file.type === 'application/pdf'){
      if(!pdfjsAvailable){ setStatus('pdf engine unavailable — try reloading'); return; }
      setStatus('reading attachment…');
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data: buf}).promise;
      let text = '';
      const maxPages = Math.min(pdf.numPages, 20);
      for(let i=1;i<=maxPages;i++){
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += `\n\n[Page ${i}]\n` + content.items.map(it=>it.str).join(' ');
      }
      pendingAttachment = { kind:'pdf', name:file.name, text: text.slice(0,20000) };
    } else if(file.type.startsWith('image/')){
      setStatus('reading attachment…');
      const dataUrl = await new Promise((res,rej)=>{
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = () => rej(new Error('read failed'));
        r.readAsDataURL(file);
      });
      pendingAttachment = { kind:'image', name:file.name, mimeType:file.type, base64: dataUrl.split(',')[1] };
    } else {
      setStatus('reading attachment…');
      const text = await file.text();
      pendingAttachment = { kind:'text', name:file.name, text: text.slice(0,20000) };
    }
    setStatus('attachment ready');
    renderAttachChip();
  } catch(err){
    console.error('Attachment read failed:', err);
    setStatus('could not read attachment — see console');
  }
}

document.getElementById('btn-attach').addEventListener('click', ()=> document.getElementById('attach-input').click());
document.getElementById('attach-input').addEventListener('change', (e)=>{
  if(e.target.files.length) handleAttachFile(e.target.files[0]);
  e.target.value = ''; // allow re-picking the same file later
});

function handleAsk(text){
  const typed = (text || '').trim();
  if(!typed && !pendingAttachment) return;

  let message = typed;
  let imageAttachment = null;
  if(pendingAttachment){
    if(pendingAttachment.kind === 'image'){
      message = (message ? message + '\n\n' : '') + `[Attached image: ${pendingAttachment.name}]`;
      imageAttachment = { mimeType: pendingAttachment.mimeType, base64: pendingAttachment.base64 };
    } else {
      message = (message ? message + '\n\n' : '') + `[Attached file: ${pendingAttachment.name}]\n${pendingAttachment.text}`;
    }
  }

  runTeachingTurn(message, typed || `Attached: ${pendingAttachment.name}`, imageAttachment);
  document.getElementById('ask-input').value = '';
  pendingAttachment = null;
  renderAttachChip();
}
document.getElementById('btn-ask').addEventListener('click', ()=> handleAsk(document.getElementById('ask-input').value));
document.getElementById('ask-input').addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleAsk(e.target.value); });

/* =========================================================
   INIT
   ========================================================= */
resizeCanvas();
// Mobile browsers (portrait especially) can still be settling viewport
// chrome/address-bar height right after load, so the very first
// getBoundingClientRect() here may be stale. A couple of fixed-delay
// retries isn't always enough — the same reason orientationchange uses
// the polling "wait until size stops changing" version instead of fixed
// timeouts — so use that same stabilizing function here too, rather than
// locking in a stale size if settling runs past a hardcoded delay.
resizeCanvasWhenStable(1000);
setStatus('idle');
refreshSessionList();
<\/script>

</body>
</html>
</script>

<script>
/* ---------------------------------------------------------------
   window.storage shim: the real window.storage API only exists
   inside the Claude.ai artifact preview sandbox — on a real
   deployed site (like this one, on GitHub Pages) it doesn't exist
   at all, so every call used to throw and autosave failed silently.
   This shim gives the same get/set/list/delete interface, backed
   by localStorage, so saving actually works once deployed. Swap
   this out for real fetch() calls to your own backend later if you
   want saves to sync across devices instead of staying per-browser.
   ------------------------------------------------------------- */
if(!window.storage || !window.storage.__isRealBackend){
  const STORAGE_NS = 'chalkline:';
  window.storage = {
    __isRealBackend: false,
    async get(key){
      const raw = localStorage.getItem(STORAGE_NS + key);
      return raw === null ? null : { key, value: raw, shared: false };
    },
    async set(key, value){
      try{ localStorage.setItem(STORAGE_NS + key, value); return { key, value, shared: false }; }
      catch(e){ console.error('localStorage set failed:', e); return null; }
    },
    async delete(key){
      const existed = localStorage.getItem(STORAGE_NS + key) !== null;
      localStorage.removeItem(STORAGE_NS + key);
      return { key, deleted: existed, shared: false };
    },
    async list(prefix){
      const keys = [];
      const full = STORAGE_NS + (prefix || '');
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(full)) keys.push(k.slice(STORAGE_NS.length));
      }
      return { keys, prefix, shared: false };
    }
  };
}

const pdfjsAvailable = typeof pdfjsLib !== 'undefined';
if(pdfjsAvailable){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}
let pdfText = '', pdfFileName = '';
const uploadZone = document.getElementById('upload-zone');
const pdfInput = document.getElementById('pdf-input');
const btnSummarize = document.getElementById('btn-summarize');
const statusLine = document.getElementById('status-line');

/* ---------------- account + saved summaries -----------------------
   Same convention as the tutor page: sessions are namespaced under
   'summary:<account sub or "local">:<id>' so the home page can list
   both kinds of history by prefix. Swap window.storage for a real
   backend call once one exists — see the tutor page's persistSession
   for the same note. */
let currentUser = null;
let currentSummarySessionId = 'summary_' + Date.now();
let currentSummaryTitle = null;

function summarySessionKeyPrefix(){
  return 'summary:' + currentUser.sub + ':';
}

function resetSummaryViewState(){
  currentSummarySessionId = 'summary_' + Date.now(); currentSummaryTitle = null;
  pdfText=''; pdfFileName='';
  uploadZone.classList.remove('has-file');
  uploadZone.innerHTML = `Drop a PDF here, or click to choose a file.<input type="file" id="pdf-input" accept="application/pdf">`;
  document.getElementById('pdf-input').addEventListener('change', (e)=>{ if(e.target.files.length) handlePdfFile(e.target.files[0]); });
  btnSummarize.disabled = true;
  outputWrap.classList.remove('show');
  summaryPanel.innerHTML = '';
}

window.addEventListener('message', (e)=>{
  const d = e.data;
  if(!d || !d.chalklineAuth) return;
  // Same reasoning as the tutor page: don't let a summary that was
  // open under one account (or as a guest) remain on screen once the
  // account identity actually changes — otherwise it stays visible to
  // whoever is looking at the page next, including after sign-out.
  const prevSub = currentUser ? currentUser.sub : null;
  const newUser = d.signedIn ? d.user : null;
  const newSub = newUser ? newUser.sub : null;
  const accountChanged = prevSub !== null && prevSub !== newSub;
  currentUser = newUser;
  if(accountChanged){
    resetSummaryViewState();
    setStatus(d.signedIn ? 'switched account — cleared previous summary' : 'signed out — cleared previous summary');
  }
  refreshSummarySessionList();
  if(pendingSummaryLoad) loadSummarySessionById(pendingSummaryLoad);
});

// If the shell tells us to open a specific saved summary (e.g. from the
// Previous Summaries page), try immediately, then retry once real auth
// state arrives (it may land slightly after this message, and the key
// prefix depends on it).
let pendingSummaryLoad = null;
window.addEventListener('message', (e)=>{
  const d = e.data;
  if(d && d.loadSummaryId){
    pendingSummaryLoad = d.loadSummaryId;
    loadSummarySessionById(d.loadSummaryId);
  }
});

async function loadSummarySessionById(id){
  try{
    const rec = await window.storage.get(summarySessionKeyPrefix() + id, false);
    if(rec){ loadSummarySession(JSON.parse(rec.value)); pendingSummaryLoad = null; }
  } catch(e){ console.error('Could not load requested summary:', e); }
}

async function persistSummarySession(html){
  // Guest (signed-out) summaries must never be written to durable,
  // sharable storage — otherwise closing and reopening the site, or a
  // different visitor on the same browser, would still see them. Only
  // persist once someone is actually signed in.
  if(!currentUser) return;
  const payload = {
    id: currentSummarySessionId,
    title: currentSummaryTitle || (pdfFileName ? pdfFileName.replace(/\.pdf$/i,'') : 'Untitled summary'),
    savedAt: Date.now(),
    pdfFileName, html
  };
  try{ await window.storage.set(summarySessionKeyPrefix() + currentSummarySessionId, JSON.stringify(payload), false); }
  catch(e){ console.error('Saving summary failed:', e); }
  refreshSummarySessionList();
}

let summarySessionListReq = 0;
async function deleteSummarySession(id, ev){
  if(ev) ev.stopPropagation();
  if(!confirm('Delete this saved summary? This can\'t be undone.')) return;
  try{
    await window.storage.delete(summarySessionKeyPrefix() + id, false);
    if(id === currentSummarySessionId) resetSummaryViewState();
    refreshSummarySessionList();
  } catch(e){ console.error('Delete summary failed:', e); setStatus('delete failed — see console'); }
}
async function refreshSummarySessionList(){
  const myReq = ++summarySessionListReq;
  const listEl = document.getElementById('summary-session-list');
  if(!currentUser){ listEl.innerHTML = '<div class="empty-hint">Sign in to save and revisit your summaries.</div>'; return; }
  try{
    const result = await window.storage.list(summarySessionKeyPrefix(), false);
    if(myReq !== summarySessionListReq) return; // superseded by a newer auth state
    const keys = (result && result.keys) ? result.keys : [];
    if(keys.length===0){ listEl.innerHTML = '<div class="empty-hint">No saved summaries yet.</div>'; return; }
    const items = [];
    for(const key of keys){
      try{ const rec = await window.storage.get(key, false); if(rec) items.push(JSON.parse(rec.value)); } catch(e){}
    }
    if(myReq !== summarySessionListReq) return;
    items.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
    listEl.innerHTML = '';
    items.forEach(item=>{
      const div = document.createElement('div'); div.className='session-item';
      const date = new Date(item.savedAt);
      div.innerHTML = `<span class="s-name">${escapeHtml(item.title||'Untitled')}</span><span class="s-date">${date.toLocaleDateString()}</span><button type="button" class="s-delete" title="Delete">✕</button>`;
      div.style.cursor = 'pointer';
      div.addEventListener('click', ()=> loadSummarySession(item));
      div.querySelector('.s-delete').addEventListener('click', (ev)=> deleteSummarySession(item.id, ev));
      listEl.appendChild(div);
    });
  } catch(err){ console.error('Listing summaries failed:', err); listEl.innerHTML = '<div class="empty-hint">Could not load saved summaries.</div>'; }
}

function loadSummarySession(item){
  currentSummarySessionId = item.id; currentSummaryTitle = item.title;
  pdfFileName = item.pdfFileName || '';
  outputTitle.textContent = `Summary — ${(pdfFileName || item.title || '').replace(/\.pdf$/i,'')}`;
  summaryPanel.innerHTML = item.html || '';
  outputWrap.classList.add('show');
  setStatus('summary loaded');
  outputWrap.scrollIntoView({behavior:'smooth', block:'start'});
}

document.getElementById('btn-new-summary-session').addEventListener('click', ()=>{
  resetSummaryViewState();
  setStatus('new summary');
});
/* -------------------------------------------------------------- */
function setStatus(s){ statusLine.textContent = s || ''; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

uploadZone.addEventListener('click', ()=> pdfInput.click());
uploadZone.addEventListener('dragover', (e)=> e.preventDefault());
uploadZone.addEventListener('drop', (e)=>{ e.preventDefault(); if(e.dataTransfer.files.length) handlePdfFile(e.dataTransfer.files[0]); });
pdfInput.addEventListener('change', (e)=>{ if(e.target.files.length) handlePdfFile(e.target.files[0]); });

async function handlePdfFile(file){
  if(!pdfjsAvailable){ alert("PDF import couldn't load its engine. Try reloading the page."); return; }
  if(file.type !== 'application/pdf'){ alert('Please choose a PDF file.'); return; }
  setStatus('reading pdf…');
  pdfFileName = file.name;
  try{
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
    let fullText = '';
    const maxPages = Math.min(pdf.numPages, 60);
    for(let i=1;i<=maxPages;i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      fullText += `\n\n[Page ${i}]\n` + content.items.map(it=>it.str).join(' ');
    }
    pdfText = fullText;
    uploadZone.classList.add('has-file');
    uploadZone.innerHTML = `<div class="file-name">📄 ${escapeHtml(pdfFileName)}</div><div class="file-meta">${pdf.numPages} page${pdf.numPages===1?'':'s'} · text extracted${pdf.numPages>60 ? ' (first 60 pages)' : ''}</div>`;
    btnSummarize.disabled = false;
    setStatus('ready to summarize');
  } catch(err){
    console.error('Failed to read PDF:', err);
    setStatus('could not read this pdf — see console');
  }
}

const PROXY_URL = "https://api.takundamambudzi02.workers.dev";

function lengthInstruction(mode){
  if(mode === 'brief') return "Keep it short: a handful of the most important bullet points only, no sections, under 150 words.";
  if(mode === 'detailed') return "Be thorough: cover every section of the source in real depth, with sub-points and examples where the source has them. It's fine for this to be long.";
  return "Aim for a well-organized overview: a few clear sections with headings, each with 3-6 bullet points covering the important content.";
}

async function summarizeText(text, mode){
  if(PROXY_URL.includes('YOUR-WORKER-SUBDOMAIN')){
    return { ok:false, error:"The AI proxy hasn't been set up yet." };
  }

  const system = `You are a study-notes summarizer. You are given the extracted text of a PDF (a chapter, slide deck, or notes) and must produce a summary of it for a student reviewing before an exam.

Output format: plain HTML fragment only using: <h3>, <p>, <ul>/<li>, <strong>.

${lengthInstruction(mode)}`;

  const userMsg = `Extracted PDF text (file: ${pdfFileName}):\n\n${text.slice(0, 60000)}`;

  let response, data;
  try{
    response = await fetch(`${PROXY_URL}/gemini`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        system_instruction: { parts: [{ text: system }] },
        contents: [{ role:"user", parts:[{ text: userMsg }] }],
        generationConfig: { maxOutputTokens: 3000 }
      })
    });
  } catch(networkErr){
    return { ok:false, error:"The request never reached the proxy." };
  }

  try{ data = await response.json(); }
  catch(parseErr){
    return { ok:false, error:"The server responded, but not with valid JSON." };
  }

  if(!response.ok){
    const msg = (data && data.error && data.error.message) ? data.error.message : JSON.stringify(data);
    return { ok:false, error:`The model returned an error: ${msg}` };
  }

  const candidate = data.candidates && data.candidates[0];
  const part = candidate && candidate.content && candidate.content.parts && candidate.content.parts[0];
  if(!part || !part.text){
    return { ok:false, error:"The response came back in an unexpected shape." };
  }
  return { ok:true, html: part.text.trim().replace(/^```html\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'') };
}

const outputWrap = document.getElementById('output-wrap');
const summaryPanel = document.getElementById('summary-panel');
const outputTitle = document.getElementById('output-title');

btnSummarize.addEventListener('click', async ()=>{
  if(!pdfText){ setStatus('upload a pdf first'); return; }
  const mode = document.getElementById('length-select').value;
  btnSummarize.disabled = true;
  setStatus('reading and summarizing…');
  const result = await summarizeText(pdfText, mode);
  btnSummarize.disabled = false;
  if(!result.ok){
    setStatus(result.error);
    return;
  }
  outputTitle.textContent = `Summary — ${pdfFileName.replace(/\.pdf$/i,'')}`;
  summaryPanel.innerHTML = result.html;
  outputWrap.classList.add('show');
  setStatus('done');
  outputWrap.scrollIntoView({behavior:'smooth', block:'start'});
  persistSummarySession(result.html);
});

document.getElementById('btn-copy').addEventListener('click', ()=>{
  const text = summaryPanel.innerText;
  navigator.clipboard.writeText(text).then(()=> setStatus('summary copied')).catch(()=> setStatus('copy failed'));
});

document.getElementById('btn-download').addEventListener('click', ()=>{
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const margin = 48;
    const maxWidth = 595 - margin*2;
    let y = margin;
    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text(outputTitle.textContent, margin, y); y += 26;

    const nodes = summaryPanel.children.length ? Array.from(summaryPanel.children) : [summaryPanel];
    nodes.forEach(node=>{
      const tag = node.tagName ? node.tagName.toLowerCase() : 'p';
      if(tag === 'h3'){
        doc.setFont('helvetica','bold'); doc.setFontSize(13);
        if(y > 760){ doc.addPage(); y = margin; }
        y += 10;
        const lines = doc.splitTextToSize(node.textContent, maxWidth);
        doc.text(lines, margin, y); y += lines.length*16 + 4;
      } else if(tag === 'ul'){
        doc.setFont('helvetica','normal'); doc.setFontSize(11);
        Array.from(node.children).forEach(li=>{
          const lines = doc.splitTextToSize('•  ' + li.textContent, maxWidth);
          if(y + lines.length*14 > 780){ doc.addPage(); y = margin; }
          doc.text(lines, margin, y); y += lines.length*14 + 2;
        });
        y += 6;
      } else {
        doc.setFont('helvetica','normal'); doc.setFontSize(11);
        const lines = doc.splitTextToSize(node.textContent, maxWidth);
        if(y + lines.length*14 > 780){ doc.addPage(); y = margin; }
        doc.text(lines, margin, y); y += lines.length*14 + 8;
      }
    });

    doc.save((pdfFileName ? pdfFileName.replace(/\.pdf$/i,'') : 'summary') + ' - summary.pdf');
    setStatus('pdf downloaded');
  } catch(err){
    console.error('PDF export failed:', err);
    setStatus('pdf export failed — see console');
  }
});
<\/script>

</body>
</html>
</script>

<script type="text/plain" id="src-tutor-history"><!DOCTYPE html>

<body>

<div class="ambient-halo"></div>

<div class="wrap">
  <nav>
    <a class="brand" href="#" onclick="parent.postMessage({nav:'home'},'*');return false;"><span class="dot"></span>Chalkline</a>
    <div class="nav-links">
      <a href="#" onclick="parent.postMessage({nav:'tutor'},'*');return false;">Tutor</a>
      <a href="#" onclick="parent.postMessage({nav:'summary'},'*');return false;">Summary</a>
    </div>
  </nav>

  <div class="page-head">
    <div>
      <h1>Previous tutorials</h1>
      <p>Your saved whiteboard lessons, grouped by subject or course.</p>
    </div>
    <button class="btn-primary" onclick="parent.postMessage({nav:'tutor'},'*');">New lesson</button>
  </div>

  <div id="th-content">
    <div class="empty-hint">Loading…</div>
  </div>
</div>

<script>
/* ---------------------------------------------------------------
   window.storage shim: the real window.storage API only exists
   inside the Claude.ai artifact preview sandbox — on a real
   deployed site (like this one, on GitHub Pages) it doesn't exist
   at all, so every call used to throw and autosave failed silently.
   This shim gives the same get/set/list/delete interface, backed
   by localStorage, so saving actually works once deployed. Swap
   this out for real fetch() calls to your own backend later if you
   want saves to sync across devices instead of staying per-browser.
   ------------------------------------------------------------- */
if(!window.storage || !window.storage.__isRealBackend){
  const STORAGE_NS = 'chalkline:';
  window.storage = {
    __isRealBackend: false,
    async get(key){
      const raw = localStorage.getItem(STORAGE_NS + key);
      return raw === null ? null : { key, value: raw, shared: false };
    },
    async set(key, value){
      try{ localStorage.setItem(STORAGE_NS + key, value); return { key, value, shared: false }; }
      catch(e){ console.error('localStorage set failed:', e); return null; }
    },
    async delete(key){
      const existed = localStorage.getItem(STORAGE_NS + key) !== null;
      localStorage.removeItem(STORAGE_NS + key);
      return { key, deleted: existed, shared: false };
    },
    async list(prefix){
      const keys = [];
      const full = STORAGE_NS + (prefix || '');
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(full)) keys.push(k.slice(STORAGE_NS.length));
      }
      return { keys, prefix, shared: false };
    }
  };
}

let thUser = null;

function escapeHtmlTH(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

function sessionKeyPrefixTH(){
  return 'session:' + thUser.sub + ':';
}

window.addEventListener('message', (e)=>{
  const d = e.data;
  if(!d || !d.chalklineAuth) return;
  thUser = d.signedIn ? d.user : null;
  refreshTutorHistory();
});

let sessionListReqTH = 0;

// Each subject folder gets a distinct color + icon, derived
// deterministically from its name (a simple string hash), so the same
// subject always looks the same across visits instead of colors
// shuffling around on every reload.
const FOLDER_PALETTE = [
  { accent:'#2E7DBE', tint:'#EAF4FD', icon:'📘' },
  { accent:'#3E8FA6', tint:'#E9F6F7', icon:'📗' },
  { accent:'#C0392B', tint:'#FBEDE9', icon:'📕' },
  { accent:'#D96B27', tint:'#FDF1E7', icon:'📙' },
  { accent:'#6C3483', tint:'#F3EBF7', icon:'📔' },
  { accent:'#2A8A5D', tint:'#EAF7F0', icon:'📓' },
  { accent:'#B7950B', tint:'#FBF6E3', icon:'📒' },
  { accent:'#5D6D7E', tint:'#EEF1F3', icon:'🗂️' }
];
function folderStyleFor(subj){
  if(subj === 'Unsorted') return { accent:'#7C93A8', tint:'#F3F5F7', icon:'🗒️' };
  let hash = 0;
  for(let i=0;i<subj.length;i++){ hash = (hash*31 + subj.charCodeAt(i)) | 0; }
  return FOLDER_PALETTE[Math.abs(hash) % FOLDER_PALETTE.length];
}

async function refreshTutorHistory(){
  const myReq = ++sessionListReqTH;
  const content = document.getElementById('th-content');
  if(!thUser){
    // Nothing is ever saved while signed out (persistSession refuses to
    // write without an account), so there's nothing real to list here —
    // and we must not query a shared 'local' bucket that could surface
    // a previous guest's leftover sessions.
    content.innerHTML = '<div class="signin-note">Sign in to save tutorials to your account and see them here.</div>';
    return;
  }
  try{
    const result = await window.storage.list(sessionKeyPrefixTH(), false);
    if(myReq !== sessionListReqTH) return; // a newer auth state has since started its own refresh
    const keys = (result && result.keys) ? result.keys : [];
    if(keys.length===0){
      content.innerHTML = '<div class="empty-state">No saved tutorials yet — start a lesson and it will show up here.</div>';
      return;
    }
    const items = [];
    for(const key of keys){
      try{ const rec = await window.storage.get(key, false); if(rec) items.push(JSON.parse(rec.value)); } catch(e){}
    }
    if(myReq !== sessionListReqTH) return;
    items.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));

    const groups = {};
    items.forEach(item=>{
      const subj = item.subject || 'Unsorted';
      if(!groups[subj]) groups[subj] = [];
      groups[subj].push(item);
    });
    const subjects = Object.keys(groups).sort((a,b)=>{
      if(a==='Unsorted') return 1;
      if(b==='Unsorted') return -1;
      return (groups[b][0].savedAt||0) - (groups[a][0].savedAt||0);
    });

    content.innerHTML = '';
    subjects.forEach((subj, idx)=>{
      const style = folderStyleFor(subj);
      const folder = document.createElement('div');
      folder.className = 'folder';
      folder.style.borderTopColor = style.accent;
      folder.style.borderTopWidth = '3px';
      const head = document.createElement('div');
      head.className = 'folder-head';
      head.innerHTML = `
        <div class="folder-icon" style="background:${style.tint};color:${style.accent};">${style.icon}</div>
        <div class="folder-title">${escapeHtmlTH(subj)}</div>
        <div class="folder-count" style="color:${style.accent};background:${style.tint};">${groups[subj].length} lesson${groups[subj].length===1?'':'s'}</div>
        <div class="folder-chevron" style="color:${style.accent};"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6 3.5 11 8l-5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      `;
      head.addEventListener('click', ()=> folder.classList.toggle('open'));
      const body = document.createElement('div');
      body.className = 'folder-body';
      groups[subj].forEach(item=>{
        const row = document.createElement('div');
        row.className = 'tutorial-row';
        const date = new Date(item.savedAt);
        row.innerHTML = `
          <span class="t-name">${escapeHtmlTH(item.title||'Untitled')}</span>
          <span class="t-topic">${escapeHtmlTH(item.currentTopicLabel||'')}</span>
          <span class="t-date">${date.toLocaleDateString()}</span>
          <button type="button" class="t-delete" title="Delete">✕</button>
        `;
        row.addEventListener('click', ()=> parent.postMessage({nav:'tutor', loadSessionId:item.id}, '*'));
        row.querySelector('.t-delete').addEventListener('click', async (ev)=>{
          ev.stopPropagation();
          if(!confirm('Delete this saved tutorial? This can\'t be undone.')) return;
          try{
            await window.storage.delete(sessionKeyPrefixTH() + item.id, false);
            refreshTutorHistory();
          } catch(e){ console.error('Delete tutorial failed:', e); }
        });
        body.appendChild(row);
      });
      folder.appendChild(head);
      folder.appendChild(body);
      content.appendChild(folder);

      // set an actual pixel max-height so the CSS transition can open it
      requestAnimationFrame(()=>{
        if(folder.classList.contains('open')) body.style.maxHeight = body.scrollHeight + 'px';
      });
    });

    // re-measure open folders on any toggle
    content.querySelectorAll('.folder-head').forEach(head=>{
      head.addEventListener('click', ()=>{
        const folder = head.parentElement;
        const body = folder.querySelector('.folder-body');
        body.style.maxHeight = folder.classList.contains('open') ? body.scrollHeight + 'px' : '';
      });
    });
  } catch(err){
    console.error('Loading tutorials failed:', err);
    content.innerHTML = '<div class="empty-hint">Could not load saved tutorials.</div>';
  }
}

refreshTutorHistory();
<\/script>

</body>
</html>
</script>

<script type="text/plain" id="src-summary-history"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Chalkline — Previous Summaries</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@600;700&display=swap');

:root{
  --board-bg:#BFDCF7;
  --ink:#1E2B3A;
  --ochre:#2E7DBE;
  --highlight:#A6D0F2;
  --sage:#3E8FA6;
  --brick:#3D6B93;
  --panel-border:#D3E6F5;
  --muted:#7C93A8;
  --halo-blue:#6EA8FE;
  --halo-blue-soft:#A5C8FF;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Source Serif 4', Georgia, serif;
  color:var(--ink); background:var(--board-bg);
  min-height:100vh; position:relative;
}
.ambient-halo{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.ambient-halo::before,.ambient-halo::after{
  content:''; position:absolute; width:58vmax;height:58vmax;
  border-radius:50%; filter:blur(100px); opacity:0.22; mix-blend-mode:multiply;
}
.ambient-halo::before{ top:-24%; left:-16%; background:radial-gradient(circle, var(--halo-blue) 0%, rgba(110,168,254,0) 70%); animation:d1 24s ease-in-out infinite; }
.ambient-halo::after{ bottom:-26%; right:-14%; background:radial-gradient(circle, var(--halo-blue-soft) 0%, rgba(165,200,255,0) 70%); animation:d2 28s ease-in-out infinite; }
@keyframes d1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(9%,7%) scale(1.13);}}
@keyframes d2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-7%,-6%) scale(1.1);}}

.wrap{ position:relative; z-index:1; max-width:820px; margin:0 auto; padding:0 28px 80px; }

nav{ display:flex; align-items:center; justify-content:space-between; padding:26px 0 10px; }
.brand{ font-family:'Caveat', cursive; font-weight:700; font-size:28px; color:var(--ink); text-decoration:none; display:flex; align-items:center; gap:8px; }
.brand .dot{ width:9px;height:9px;border-radius:50%; background:var(--sage); display:inline-block; }
.nav-links{ display:flex; gap:26px; font-family:'JetBrains Mono', monospace; font-size:13px; }
.nav-links a{ color:var(--muted); text-decoration:none; }
.nav-links a:hover{ color:var(--ink); }
.nav-links a.active{ color:var(--ink); border-bottom:1.5px solid var(--sage); padding-bottom:2px; }

.page-head{ padding:34px 0 26px; display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap; }
.page-head h1{ font-size:32px; margin:0 0 10px; font-weight:600; }
.page-head p{ font-size:16px; color:#5c5847; margin:0; max-width:480px; line-height:1.55; }
.btn-primary{
  font-family:'Source Serif 4', serif; font-size:14.5px; font-weight:600;
  background:var(--ink); color:#fff; border:none; border-radius:9px;
  padding:11px 20px; cursor:pointer; white-space:nowrap;
}
.btn-primary:hover{ background:#0f1c2c; }

.signin-note{
  background:#fff; border:1px solid var(--panel-border); border-radius:14px;
  padding:26px 28px; font-size:14.5px; color:var(--muted); margin-top:10px;
}
.empty-state{
  background:#fff; border:1px dashed var(--panel-border); border-radius:14px;
  padding:44px 28px; text-align:center; color:var(--muted); font-size:14.5px;
}
.empty-hint{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--muted); margin-top:8px; }

.list{ background:#fff; border:1px solid var(--panel-border); border-radius:14px; overflow:hidden; }
.summary-row{
  display:flex; align-items:center; gap:14px;
  padding:16px 22px; cursor:pointer;
  border-bottom:1px solid var(--panel-border);
  transition:background .15s ease;
}
.summary-row:last-child{ border-bottom:none; }
.summary-row:hover{ background:#FAFCFB; }
.summary-row .r-icon{
  width:34px; height:34px; border-radius:9px; background:#E1F0F7;
  display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;
}
.summary-row .r-name{ font-size:14.5px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.summary-row .r-file{ font-size:12.5px; color:var(--muted); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.summary-row .r-date{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted); flex-shrink:0; }
.summary-row .r-delete{ border:none; background:none; color:var(--muted); cursor:pointer; font-size:12px; padding:2px 4px; margin-left:6px; flex-shrink:0; border-radius:4px; }
.summary-row .r-delete:hover{ color:#b3452f; background:#FBEDE9; }
</style>
</head>
<body>

<div class="ambient-halo"></div>

<div class="wrap">
  <nav>
    <a class="brand" href="#" onclick="parent.postMessage({nav:'home'},'*');return false;"><span class="dot"></span>Chalkline</a>
    <div class="nav-links">
      <a href="#" onclick="parent.postMessage({nav:'tutor'},'*');return false;">Tutor</a>
      <a href="#" onclick="parent.postMessage({nav:'summary'},'*');return false;">Summary</a>
    </div>
  </nav>

  <div class="page-head">
    <div>
      <h1>Previous summaries</h1>
      <p>Every PDF summary you've saved to your account.</p>
    </div>
    <button class="btn-primary" onclick="parent.postMessage({nav:'summary'},'*');">New summary</button>
  </div>

  <div id="sh-content">
    <div class="empty-hint">Loading…</div>
  </div>
</div>

<script>
/* ---------------------------------------------------------------
   window.storage shim: the real window.storage API only exists
   inside the Claude.ai artifact preview sandbox — on a real
   deployed site (like this one, on GitHub Pages) it doesn't exist
   at all, so every call used to throw and autosave failed silently.
   This shim gives the same get/set/list/delete interface, backed
   by localStorage, so saving actually works once deployed. Swap
   this out for real fetch() calls to your own backend later if you
   want saves to sync across devices instead of staying per-browser.
   ------------------------------------------------------------- */
if(!window.storage || !window.storage.__isRealBackend){
  const STORAGE_NS = 'chalkline:';
  window.storage = {
    __isRealBackend: false,
    async get(key){
      const raw = localStorage.getItem(STORAGE_NS + key);
      return raw === null ? null : { key, value: raw, shared: false };
    },
    async set(key, value){
      try{ localStorage.setItem(STORAGE_NS + key, value); return { key, value, shared: false }; }
      catch(e){ console.error('localStorage set failed:', e); return null; }
    },
    async delete(key){
      const existed = localStorage.getItem(STORAGE_NS + key) !== null;
      localStorage.removeItem(STORAGE_NS + key);
      return { key, deleted: existed, shared: false };
    },
    async list(prefix){
      const keys = [];
      const full = STORAGE_NS + (prefix || '');
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(full)) keys.push(k.slice(STORAGE_NS.length));
      }
      return { keys, prefix, shared: false };
    }
  };
}

let shUser = null;

function escapeHtmlSH(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

function summaryKeyPrefixSH(){
  return 'summary:' + shUser.sub + ':';
}

window.addEventListener('message', (e)=>{
  const d = e.data;
  if(!d || !d.chalklineAuth) return;
  shUser = d.signedIn ? d.user : null;
  refreshSummaryHistory();
});

let summaryHistoryReqSH = 0;
async function refreshSummaryHistory(){
  const myReq = ++summaryHistoryReqSH;
  const content = document.getElementById('sh-content');
  if(!shUser){
    // Nothing is ever saved while signed out, so there's nothing real
    // to list — and we must not query a shared 'local' bucket that
    // could surface a previous guest's leftover summaries.
    content.innerHTML = '<div class="signin-note">Sign in to save summaries to your account and see them here.</div>';
    return;
  }
  try{
    const result = await window.storage.list(summaryKeyPrefixSH(), false);
    if(myReq !== summaryHistoryReqSH) return; // superseded by a newer auth state
    const keys = (result && result.keys) ? result.keys : [];
    if(keys.length===0){
      content.innerHTML = '<div class="empty-state">No saved summaries yet — summarize a PDF and it will show up here.</div>';
      return;
    }
    const items = [];
    for(const key of keys){
      try{ const rec = await window.storage.get(key, false); if(rec) items.push(JSON.parse(rec.value)); } catch(e){}
    }
    if(myReq !== summaryHistoryReqSH) return;
    items.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));

    const list = document.createElement('div');
    list.className = 'list';
    items.forEach(item=>{
      const row = document.createElement('div');
      row.className = 'summary-row';
      const date = new Date(item.savedAt);
      row.innerHTML = `
        <div class="r-icon">📄</div>
        <span class="r-name">${escapeHtmlSH(item.title||'Untitled')}</span>
        <span class="r-file">${escapeHtmlSH(item.pdfFileName||'')}</span>
        <span class="r-date">${date.toLocaleDateString()}</span>
        <button type="button" class="r-delete" title="Delete">✕</button>
      `;
      row.addEventListener('click', ()=> parent.postMessage({nav:'summary', loadSummaryId:item.id}, '*'));
      row.querySelector('.r-delete').addEventListener('click', async (ev)=>{
        ev.stopPropagation();
        if(!confirm('Delete this saved summary? This can\'t be undone.')) return;
        try{
          await window.storage.delete(summaryKeyPrefixSH() + item.id, false);
          refreshSummaryHistory();
        } catch(e){ console.error('Delete summary failed:', e); }
      });
      list.appendChild(row);
    });
    content.innerHTML = '';
    content.appendChild(list);
  } catch(err){
    console.error('Loading summaries failed:', err);
    content.innerHTML = '<div class="empty-hint">Could not load saved summaries.</div>';
  }
}

refreshSummaryHistory();
<\/script>

</body>
</html>
</script>

<script>

function unwrap(id){
  return document.getElementById(id).textContent.replace(/<\\\/script/gi, '</script');
}
const frames = {
  landing: document.getElementById('frame-landing'),
  home: document.getElementById('frame-home'),
  tutor: document.getElementById('frame-tutor'),
  summary: document.getElementById('frame-summary'),
  'tutor-history': document.getElementById('frame-tutor-history'),
  'summary-history': document.getElementById('frame-summary-history')
};
const loaded = { landing:false, home:false, tutor:false, summary:false, 'tutor-history':false, 'summary-history':false };
let current = 'landing';

function ensureLoaded(page){
  if(loaded[page]) return;
  frames[page].srcdoc = unwrap('src-' + page);
  loaded[page] = true;
  // A fresh frame doesn't know the sign-in state yet — broadcastAuthState
  // only fires on sign-in/out events, not on frame load — so tell this
  // one directly once it's parsed and listening.
  setTimeout(()=>{
    try{ frames[page].contentWindow.postMessage({ chalklineAuth:true, signedIn: !!shellUser, user: shellUser }, '*'); }catch(e){}
  }, 60);
}

// Pages that represent an active "session" (a live lesson or summary in
// progress) shouldn't just be re-shown stale when you navigate back to
// them — their in-iframe JS state (currentSessionId, loaded messages,
// etc.) would still be sitting there from before. If you're arriving
// WITHOUT a specific saved item to resume (no loadSessionId/loadSummaryId),
// treat it as "start a new one" and force the iframe to reload from
// scratch. Arriving WITH a loadSessionId/loadSummaryId means the user
// picked a specific saved item from history, so that one is left alone —
// its own message handler (d.loadSessionId) resets its state anyway.
const FRESH_ON_ENTRY = { tutor:true, summary:true };

function navTo(page, pushHistory, navPayload, isInitialLoad){
  if(!frames[page]) page = 'landing';
  // Only force a fresh tutor/summary reload for an actual in-app
  // navigation (clicking Tutor/Summary from Home, etc). A page refresh
  // re-runs this same function for whatever page the URL hash says we
  // were on — that should resume the session already in progress, not
  // wipe it and ask for a new course name.
  if(FRESH_ON_ENTRY[page] && !navPayload && !isInitialLoad){
    frames[page].srcdoc = '';
    loaded[page] = false;
  }
  const wasLoaded = loaded[page];
  const previous = current;
  ensureLoaded(page);

  // Crossfade: the page we're leaving keeps rendering (at a lower
  // z-index) while it fades out, instead of disappearing the instant
  // the new page appears — that's what made switches feel like a hard
  // cut rather than a transition.
  if(previous && previous !== page && frames[previous]){
    const leavingFrame = frames[previous];
    leavingFrame.classList.remove('active');
    leavingFrame.classList.add('leaving');
    setTimeout(()=>{ leavingFrame.classList.remove('leaving'); }, 240);
  }
  Object.keys(frames).forEach(k => frames[k].classList.toggle('active', k === page));
  current = page;
  if(pushHistory !== false){
    history.pushState({page}, '', '#' + page);
  }
  // Forward any extra nav payload (e.g. which saved session to open)
  // into the target frame. A just-created srcdoc iframe needs a beat
  // to parse and attach its own message listener before it can hear
  // this, so give it one on first load; an already-loaded frame can
  // be told immediately.
  if(navPayload){
    const send = ()=>{ try{ frames[page].contentWindow.postMessage(navPayload, '*'); }catch(e){} };
    // Slightly after the auth broadcast (60ms) so the target frame
    // already knows sign-in state before it looks up the session key.
    wasLoaded ? send() : setTimeout(send, 110);
  }
}

// Last-active-session tracking lives HERE, in the shell, not inside the
// tutor/summary srcdoc iframes. Those iframes get torn down and re-parsed
// as a fresh, un-navigated document on every load (they have no stable
// URL — just an inline srcdoc string) so anything they write to their own
// sessionStorage/localStorage is not reliably there for the *next* load
// after a real page refresh. This top-level page, by contrast, has the
// site's real origin and survives a refresh normally, so this is the only
// place that can durably answer "what was open before the refresh?".
// localStorage (not sessionStorage) on purpose: a refresh should resume
// the same lesson, but so should closing the tab and coming back later —
// there's no reason to lose that continuity just because a tab closed.
const LAST_ACTIVE_KEY_PREFIX = 'chalkline_last_active_';
function rememberActiveShell(page, sub, id){
  if(!sub || !id) return;
  try{ localStorage.setItem(LAST_ACTIVE_KEY_PREFIX + page, JSON.stringify({ sub, id })); }
  catch(e){ /* best-effort only */ }
}
function forgetActiveShell(page){
  try{ localStorage.removeItem(LAST_ACTIVE_KEY_PREFIX + page); } catch(e){}
}
function readActiveShell(page, sub){
  try{
    const raw = localStorage.getItem(LAST_ACTIVE_KEY_PREFIX + page);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(parsed && parsed.sub === sub) return parsed.id;
  } catch(e){}
  return null;
}

window.addEventListener('message', (e)=>{
  const d = e.data;
  if(d && d.nav){
    let payload = null;
    if(d.loadSessionId) payload = { loadSessionId: d.loadSessionId };
    else if(d.loadSummaryId) payload = { loadSummaryId: d.loadSummaryId };
    navTo(d.nav, true, payload);
    return;
  }
  // Reported by the tutor/summary iframe whenever the session it has open
  // changes (new session created, saved, or a saved one loaded) — see the
  // matching postMessage calls added alongside rememberActiveSession().
  if(d && d.chalklineActiveSession){
    const page = d.page === 'summary' ? 'summary' : 'tutor';
    if(d.cleared) forgetActiveShell(page);
    else rememberActiveShell(page, d.sub, d.id);
  }
});

window.addEventListener('popstate', (e)=>{
  const page = (e.state && e.state.page) || (location.hash ? location.hash.slice(1) : 'landing');
  navTo(page, false);
});

const initial = location.hash ? location.hash.slice(1) : 'landing';
history.replaceState({page: initial}, '', '#' + initial);
// On a real page refresh landing directly on tutor/summary (URL hash
// already says so), try to resume whatever session was open before the
// refresh — using the shell's own localStorage record, not anything the
// about-to-be-recreated iframe might have tried to remember itself.
let initialPayload = null;
if((initial === 'tutor' || initial === 'summary') && shellUser){
  const rememberedId = readActiveShell(initial, shellUser.sub);
  if(rememberedId) initialPayload = { loadSessionId: rememberedId };
}
navTo(initial, false, initialPayload, true);
</script>

</body>
</html>
