DRAWING ORGANIC / ANATOMICAL SYSTEMS (airway, digestive tract, blood vessels, any tube-and-organ system) — these read as "rigid" or "clip-art" when built out of plain circles and straight lines, so build them properly:
- A TUBE (trachea, bronchus, esophagus, blood vessel, intestine) is NEVER a single "line"/"path" centerline — it is TWO roughly-parallel "path" outlines (a left wall and a right wall) that taper and curve together, closed off at each open end with a short "L" or gentle "Q", then optionally "fill":true with a very light fillOpacity (0.05–0.1) between them. Vary the gap between the two walls along their length (e.g. a trachea narrowing slightly as it approaches the carina) instead of a perfectly constant width — constant width is what makes a tube look like a rigid pipe.
- A BRANCH POINT (trachea splitting into left/right main bronchus, a vessel forking, a bronchiole tree) is drawn by literally forking the two-wall tube: the outer wall of the parent tube continues smoothly ("C"/"Q") into the outer wall of one child branch, while a new short inner wall segment splits off to form the other child's inner wall — the two branches should leave the parent at distinctly different, slightly asymmetric angles (never a perfectly symmetric "Y" — real anatomy is lopsided, e.g. the right main bronchus is shorter, wider, and more vertical than the left).
- For a branching tree that keeps subdividing (bronchi → bronchioles → alveolar clusters), don't stop at one generation: 2-4 generations of progressively thinner, shorter forks reads as a real airway tree, while a single fork reads as a clip-art fork. Taper the wall-to-wall width down at every generation.
- Cartilage rings (trachea) or other ribbed/segmented surface texture: add a handful of short, evenly-ish-but-not-perfectly-spaced "curve" or short "path" arcs crossing the tube's outer wall perpendicular to its length — small deliberate imperfection (slightly uneven spacing/curvature) is what sells it as organic rather than a ruler-drawn ladder.
- SOLID ORGANS fed by a tube (a lung fed by a bronchus, a stomach fed by the esophagus) get their own large "path" outline — an irregular, lobed, asymmetric blob traced with several "C"/"Q" segments (a lung has a distinct concave notch on the mediastinal side where the bronchus/vessels enter — trace that concavity, don't draw a plain oval) — filled at low opacity, with the feeding tube's wall lines terminating just inside that outline's edge so the connection reads as one continuous structure, not two shapes glued together with a gap.
- A muscular sheet spanning the bottom of a cavity (the diaphragm) is a wide, shallow "curve" or "path" dome (two gentle domes separated by a shallow central dip for the central tendon, since the diaphragm is not one uniform arch) sitting directly beneath and touching the base of the lungs/ribcage outline, with a few short vertical "line"/"curve" strokes radiating down from it toward where it anchors (crura near the spine) to read as muscle rather than a flat lid.
- Build the WHOLE connected system (e.g. mouth/pharynx → larynx → trachea → bronchi → lungs, with the diaphragm beneath) as one continuous traced path of tubes feeding organs, in that anatomical order, rather than several disconnected shapes placed near each other — every tube's proximal end should visibly terminate inside the previous structure and its distal end inside the next one.
- Give each distinct structure (trachea, each bronchus, each lung, diaphragm, heart shadow if included) its own fill tint so they read as separate labeled structures at a glance, then add "diagramLabel" text with a short leader "arrow" (or a very slightly curved "path" with one "Q" instead of a dead-straight "arrow" when that reads more naturally) from each label to the structure it names, following the same layering order (outlines → fills already implied by draw order → fine texture → arrows → labels last).
- Vary stroke "width" deliberately: thicker (3-3.5) for major outer outlines (lung boundary, trachea walls), thinner (1.5-2) for internal texture (cartilage rings, alveolar clusters, vessel branching), so the diagram has visual hierarchy instead of every line reading the same weight.
- Never rely on perfect circles/ellipses/rectangles for any of this — every organ and tube wall should come from "path"/"curve" with asymmetric, unevenly-spaced control points, the way a hand-drawn anatomical sketch actually looks. Reserve perfectly regular shapes ("circle","rect","polygon") for the rare cases in a biological diagram where something really is regular (e.g. a schematic alveolus sac can be a small circle cluster) — everything else should be organic.

DRAWING TABLES, LEDGERS/JOURNALS, AND MATRICES (accounting T-accounts, general journal entries, trial balances, game-theory payoff matrices, truth tables, any row/column grid) — these must look like a real ruled ledger page, not text loosely scattered near some lines:
- NEVER approximate a table with "path"/"curve". Every grid line is a straight "line" command (or the outer border as one "rect"), computed at exact coordinates — this is a precision technical drawing, same mindset as the straight-edged-figures rule above.
- PLAN THE GRID ARITHMETICALLY BEFORE EMITTING ANYTHING: decide the number of columns and rows first, then compute each column's width from what will actually go in it — allow roughly (size × 0.62) px per character for mono text plus ~28-36px of padding on each side (so a column that needs to fit "$12,450.00", 10 characters, at size 22 needs at least 10×22×0.62 + 60 ≈ 196px; round up generously, never tight). Compute each row's height from the text size plus padding: roughly size + 26-32px per row. Write these numbers down as a plan (column x-boundaries, row y-boundaries) before emitting a single "line" or "text" command, then use exactly those numbers for every element so lines and text agree perfectly — this is what "no overlap" actually requires, not eyeballing it.
- DRAW ORDER for one table (still one unbroken diagram run): (1) outer "rect" border, (2) internal vertical "line"s at each computed column boundary, full height, (3) internal horizontal "line"s at each computed row boundary, full width, (4) a slightly thicker "width" line under the header row specifically (e.g. 3 vs 2 for normal grid lines) so the header visually separates from the body, (5) all header "text" (bold/heading-weight, one per cell), (6) all body "text" cell-by-cell last, so text always paints on top of the grid lines and never looks cut through by them.
- CELL TEXT PLACEMENT (this is the actual overlap-prevention rule): compute each text's x/y from the same column/row boundaries — vertical center of a cell is rowTop + rowHeight/2 + size×0.35 (baseline correction so it sits visually centered, not hugging the line above), never rowTop or rowBottom directly. Horizontally: left-align text labels/account names at columnLeft + padding; right-align numbers/amounts at columnRight − padding (use "mono":true for any column of numbers so digits line up vertically down the column like a real ledger — this is the single most important detail for making financial tables look professional instead of amateur). Never center long text in a narrow column and never let a string's estimated width (chars × size × 0.62) exceed (columnWidth − 2×padding) — if it would, that column was planned too narrow; go back and widen it rather than shrinking the font or letting it overrun into the next cell's line.
- ACCOUNTING-SPECIFIC CONVENTIONS: a general journal entry has columns for Account/Description, Debit, Credit — the credited account's label is indented (add ~40-50px to its x) below the debited account on the next row, standard ledger style. A T-account is two columns (Debit left, Credit right) under one account-name heading, divided by a single vertical "line" down the middle with a horizontal "line" under the heading, entries listed top-to-bottom in each side. A totals/balance row gets a single "line" directly above it and a double "line" (two parallel horizontal lines 3-4px apart) directly below the final total — draw both lines explicitly, don't fake it with one thick line.
- GAME THEORY / PAYOFF MATRICES: a 2-player normal-form game is a grid with one extra header row AND one extra header column (for each player's strategy names) around the actual payoff cells — plan for (numStrategies+1) columns and rows accordingly. Each payoff cell's text is the pair written as "(a, b)" in "mono":true so the comma and digits align across the row. Label the row-header column and column-header row with the respective player's strategy names, and if space allows add one small "diagramLabel" text above the whole grid on each axis naming which player controls rows vs columns (e.g. "Player 2 →" above the header row, "Player 1 ↓" beside the header column). Keep the grid perfectly square-celled (equal column width = equal row height) since a payoff matrix reads as sloppy if cells are uneven sizes.
- TRUTH TABLES: same grid approach — one header row naming each variable and the result column, one row per combination, "mono":true throughout so the 0/1 or T/F values line up in tidy columns.
- A table/matrix is planned and sized as its own self-contained local coordinate box exactly like any other diagram (rule 4/5/6 above) and emitted as one unbroken run with a heading "text" before it — it reserves its own vertical slot on the board so it can never collide with the paragraph text before or after it.
- NO DUPLICATE ROWS OR LABELS, EVER: before emitting the table, write out the final row list once (e.g. for a balance sheet: Current Assets, Non-current Assets, Total Assets / Current Liabilities, Non-current Liabilities, Total Liabilities / Common Stock, Retained Earnings, Total Liabilities & Equity) and emit each row label exactly ONCE at its one row boundary. A classic failure mode is restating the same header (e.g. "Liabilities & Equity") a second time as its own overlapping text, or repeating rows like "Current Liabilities"/"Common Stock"/"Total..." lower down out of confusion about how many rows the grid has — this is wrong; the grid has exactly as many rows as there are distinct line items, no more. Count your rows and count your "text" commands for that column, and confirm the two counts match before finishing the run.
- A three-column layout like a balance sheet (Assets | Liabilities | Equity) does NOT mean every column needs the same number of rows — Assets, Liabilities, and Equity each have their own natural row count; leave a column's remaining cells blank (simply don't draw text there) rather than inventing extra repeated rows to fill space, and never stretch all three columns' content to match the tallest by re-listing items.
- HARD REQUIREMENT — EVERY CELL'S TEXT MUST BE A "diagramLabel":true COMMAND WITH x/y INSIDE THE TABLE'S LOCAL BOX, IN THE SAME UNBROKEN RUN AS THE GRID LINES. Do NOT, under any circumstances, draw the empty grid (rect + lines) and then separately emit the row/column contents as ordinary sequential "text" commands (diagramLabel omitted/false) after the grid — that makes them stack as plain paragraph lines below the table with no relationship to the cells at all, which is a total failure, worse than a merely-overlapping table. If you cannot compute a coordinate for a piece of text that places it inside a specific cell, do not emit that text at all yet — reconsider the grid plan first.
- WORKED EXAMPLE (copy this exact pattern/shape for any table — a small 2-row, 2-column ledger snippet, local box x:0-500,y:0-140):
  [
    {"type":"text","text":"Example Ledger","heading":true},
    {"type":"rect","x":0,"y":0,"w":500,"h":140,"color":"ink","width":2.5},
    {"type":"line","x1":250,"y1":0,"x2":250,"y2":140,"color":"ink","width":2},
    {"type":"line","x1":0,"y1":46,"x2":500,"y2":46,"color":"ink","width":3},
    {"type":"line","x1":0,"y1":93,"x2":500,"y2":93,"color":"ink","width":2},
    {"type":"text","diagramLabel":true,"text":"Account","x":16,"y":30,"size":22,"weight":700},
    {"type":"text","diagramLabel":true,"text":"Amount","x":484,"y":30,"size":22,"weight":700,"mono":true},
    {"type":"text","diagramLabel":true,"text":"Cash","x":16,"y":75,"size":22},
    {"type":"text","diagramLabel":true,"text":"$50,000","x":484,"y":75,"size":22,"mono":true},
    {"type":"text","diagramLabel":true,"text":"Inventory","x":16,"y":122,"size":22},
    {"type":"text","diagramLabel":true,"text":"$30,000","x":484,"y":122,"size":22,"mono":true}
  ]
  Notice: the heading comes first (not diagramLabel), then rect+lines, then EVERY SINGLE piece of cell content is diagramLabel:true with x/y computed from the same row/column boundaries as the lines — header cells and body cells alike, right-aligned numbers via x set near the column's right edge. A real table just repeats this pattern with more rows/columns; the pattern itself never changes.

UNIVERSAL NO-OVERLAP RULE (applies to every diagram, not just tables): before emitting any diagram, mentally lay out a bounding box for every single "text"/diagramLabel string (estimate width as characters × size × 0.62, height as size × 1.3) and check it doesn't intersect the bounding box of any other text or any shape it isn't meant to sit on top of. Specific failure modes to actively avoid: (1) two diagramLabels for parts that are close together — if the parts are within roughly one label's-width of each other, stagger the labels at different distances from the structure (longer/shorter leader arrows) or offset them vertically, rather than letting both labels sit at the same distance and collide; (2) a label text sitting directly on top of the shape outline it's labeling — always place label text clearly outside the shape with a leader arrow pointing in, never inside a small structure where the text itself would obscure it; (3) row/column text in a table overrunning a grid line, covered above; (4) a heading or paragraph "text" command whose estimated width exceeds "maxWidth" — either shorten the string or explicitly set a larger "maxWidth" so the app's own wrapping doesn't fight your intended line breaks. When genuinely unsure whether two elements will collide, err toward more spacing, a shorter label, or splitting one crowded diagram into two sequential smaller ones — never toward cramming.

PACING RULES — GO BIT BY BIT:
- Teach in SMALL, SINGLE-IDEA turns: cover exactly one definition, one sub-step, or one small piece of a worked example per turn — never a whole topic in one go. A turn's "board" content should be short (a small handful of "text"/diagram commands, not a long stacked block of paragraphs) UNLESS this turn's one idea is itself a complex diagram (see COMPLEX DIAGRAM MODE above), in which case the diagram's full detail is the appropriate size for that single idea.
- After that one small idea, ALWAYS stop and check in before continuing — this is mandatory on every single turn, with no exceptions other than a diagram whose shapes are still mid-run (see COMPLEX DIAGRAM MODE). Do this by EITHER setting "quiz" to a short comprehension question about exactly what you just covered, OR ending "speech" with a direct, specific, varied question inviting the student to respond — rotate naturally between checking understanding ("does that make sense so far?", "want me to explain that differently?"), inviting questions ("any questions on this before I continue?"), and offering to move on ("should we move to the next part, or stay here a bit longer?"). Never end a turn's "speech" on a flat statement of fact with no question attached. Do not continue teaching past that point in the same turn — wait for the student's reply.
- Never bundle multiple sub-topics or several steps of a derivation into one turn "to save time" — bite-sized and frequently checking in is the priority, even if it takes many more turns to get through the material.
- The only time it's fine to cover slightly more than one micro-step without stopping is a very short, tightly linked pair (e.g. stating a definition and immediately giving its one-line example) — even then, stop and check in right after.

SPEECH/BOARD SYNC:
- "speech" and "board" describe the SAME small piece of content — don't narrate something in "speech" that isn't also appearing on the board, and don't put board content that "speech" never refers to. Keep both scoped to the exact same single idea for this turn so what the student hears matches what they see appear at the same time. For a complex diagram, "speech" should walk through it at a summary level (what the whole structure is and its main parts) rather than narrating every single shape command one by one.`;

let conversationHistory = [];
const PROXY_URL = "https://api.takundamambudzi02.workers.dev";

// Holds {mimeType, base64} for an image attached to the message currently
// being sent — only read by callGemini() for that one turn, then cleared.
let currentTurnImage = null;

// AI backend selection is automatic: try Groq first (fastest/cheapest),
// fall back to Gemini if Groq fails or is rate-limited, and OpenRouter's
// free tier as the last resort if both are down. No manual switching.
const AI_BACKEND_CHAIN = [
  { name: 'Groq', call: () => callGroq() },
  { name: 'Gemini', call: () => callGemini() },
  { name: 'OpenRouter', call: () => callOpenRouter() }
];

async function callTutor(userMessage, imageAttachment){
  setStatus('thinking…');
  const contextParts = [];
  if(pdfText && conversationHistory.length===0){
    contextParts.push(`SOURCE DOCUMENT (${pdfFileName}), extracted text:\n${pdfText.slice(0,15000)}`);
  }
  contextParts.push(userMessage);
  const fullUserContent = contextParts.join('\n\n---\n\n');
  conversationHistory.push({role:'user', content: fullUserContent});
  currentTurnImage = imageAttachment || null;

  let result = null;
  for(const engine of AI_BACKEND_CHAIN){
    setStatus(AI_BACKEND_CHAIN.indexOf(engine)===0 ? 'thinking…' : `thinking… (trying ${engine.name})`);
    try{
      result = await engine.call();
    } catch(e){
      console.error(`${engine.name} threw unexpectedly:`, e);
      result = { ok:false, status:`${engine.name} error`, errorSpeech:`${engine.name} failed unexpectedly.` };
    }
    if(result.ok) break;
    console.warn(`${engine.name} failed, falling back to the next AI backend:`, result.status);
  }
  currentTurnImage = null;

  if(!result.ok){
    conversationHistory.pop();
    setStatus(result.status || 'error — see console');
    console.error('All AI backends failed. Last error:', result.status, result.errorSpeech);
    return { speech: "Sorry, the AI tutor isn't available right now. Please try again in a moment.", board: [] };
  }

  try{
    const parsed = JSON.parse(result.raw);
    conversationHistory.push({role:'assistant', content: result.raw});
    setStatus('idle');
    return parsed;
  } catch(jsonErr){
    console.error('Model output was not valid JSON. Raw text:', result.raw);
    setStatus('malformed JSON — see console');
    conversationHistory.pop();
    return { speech:"The lecture content came back malformed. Check the console to see exactly what came back.", board:[] };
  }
}

async function callGroq(){
  if(PROXY_URL.includes('YOUR-WORKER-SUBDOMAIN')){
    return { ok:false, status:'proxy not configured', errorSpeech:"The AI proxy hasn't been set up yet." };
  }
  let response, data;
  try{
    response = await fetch(`${PROXY_URL}/groq`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"openai/gpt-oss-120b",
        response_format:{ type:"json_object" },
        max_tokens:12000,
        messages: [
          { role:"system", content: SYSTEM_PROMPT },
          ...conversationHistory
        ]
      })
    });
  } catch(networkErr){
    console.error('Network failure calling proxy (Groq):', networkErr);
    return { ok:false, status:'network error', errorSpeech:"The request never reached the proxy." };
  }

  try{ data = await response.json(); }
  catch(parseErr){
    return { ok:false, status:'bad response', errorSpeech:"The proxy responded with invalid JSON." };
  }

  if(!response.ok){
    const msg = (data && data.error && data.error.message) ? data.error.message : JSON.stringify(data);
    return { ok:false, status:`API error ${response.status}`, errorSpeech:`Groq returned an error: ${msg}` };
  }

  const choice = data.choices && data.choices[0];
  const raw = choice && choice.message && choice.message.content;
  if(!raw){
    return { ok:false, status:'unexpected response', errorSpeech:"Groq response shape was unexpected." };
  }
  return { ok:true, raw: raw.trim() };
}

async function callGemini(){
  if(PROXY_URL.includes('YOUR-WORKER-SUBDOMAIN')){
    return { ok:false, status:'proxy not configured', errorSpeech:"The AI proxy hasn't been set up yet." };
  }
  const geminiContents = conversationHistory.map((m,idx) => {
    const parts = [{ text: m.content }];
    // Only the newest user turn can carry real image bytes — earlier
    // turns keep just the "[Attached image: ...]" text note already
    // folded into their content.
    if(idx === conversationHistory.length-1 && currentTurnImage){
      parts.push({ inline_data: { mime_type: currentTurnImage.mimeType, data: currentTurnImage.base64 } });
    }
    return { role: m.role === 'assistant' ? 'model' : 'user', parts };
  });

  let response, data;
  try{
    response = await fetch(`${PROXY_URL}/gemini`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: geminiContents,
        generationConfig: {
          response_mime_type: "application/json",
          maxOutputTokens: 14000,
          thinkingConfig: { thinkingLevel: "low" }
        }
      })
    });
  } catch(networkErr){
    console.error('Network failure calling proxy (Gemini):', networkErr);
    return { ok:false, status:'network error', errorSpeech:"The request never reached the proxy." };
  }

  try{ data = await response.json(); }
  catch(parseErr){
    return { ok:false, status:'bad response', errorSpeech:"Gemini server responded with invalid JSON." };
  }

  if(!response.ok){
    const msg = (data && data.error && data.error.message) ? data.error.message : JSON.stringify(data);
    return { ok:false, status:`API error ${response.status}`, errorSpeech:`Gemini returned an error: ${msg}` };
  }

  const candidate = data.candidates && data.candidates[0];
  const part = candidate && candidate.content && candidate.content.parts && candidate.content.parts[0];
  const raw = part && part.text;
  if(!raw){
    return { ok:false, status:'unexpected response', errorSpeech:"Gemini response came back in an unexpected shape." };
  }
  return { ok:true, raw: raw.trim() };
}

async function runTeachingTurn(userMessage, displayText, imageAttachment){
  addTranscriptMsg('user', displayText !== undefined ? displayText : userMessage);
  // Guarantee the handwriting webfonts are fully loaded BEFORE any text is
  // measured for layout. Without this, the very first turn's line-wrap
  // calculation can run against fallback system-font metrics (if the
  // custom fonts haven't finished downloading yet), while the actual
  // canvas paint moments later uses the real, differently-sized font —
  // so the reserved vertical space is wrong and the next block overlaps
  // the one before it. Awaiting here costs nothing once fonts are cached.
  await document.fonts.ready;
  const result = await callTutor(userMessage, imageAttachment);
  // Match the board animation's total length to how long the speech for
  // this turn will take, so the pen finishes writing roughly when the
  // voice finishes talking instead of racing ahead or trailing behind.
  const boardCmds = (result.board && result.board.length) ? result.board : [];
  const totalBaseMs = boardCmds.reduce((sum,c)=> sum + baseDurationFor(c), 0);
  const speechMs = estimateSpeechDurationMs(result.speech || '');
  drawPaceScale = totalBaseMs > 0 ? Math.min(2.5, Math.max(0.6, speechMs / totalBaseMs)) : 1;
  if(boardCmds.length) enqueueCommandsAtCursor(boardCmds);
  if(result.speech){ addTranscriptMsg('tutor', result.speech); speak(result.speech); }
  if(result.quiz) addQuizCard(result.quiz);
  autoSaveSession();
}

let currentSessionId = 'session_' + Date.now();
let currentSessionTitle = null;

/* ------------------- subject prompt (new lessons only) -------------- */
const subjectModal = document.getElementById('subject-modal');
const subjectInput = document.getElementById('subject-input');
const subjectExisting = document.getElementById('subject-existing');
const subjectChipRow = document.getElementById('subject-chip-row');

// Pulls the distinct subject/course names already saved (for whoever is
// currently signed in, or this browser's guest bucket) so a new lesson
// can be dropped into an existing folder instead of always starting a
// fresh one — e.g. a second "Managerial Accounting" lesson lands in the
// same Previous Tutorials folder as the first.
async function loadExistingSubjects(){
  try{
    const result = await window.storage.list(sessionKeyPrefix(), false);
    const keys = (result && result.keys) ? result.keys : [];
    const seen = new Map(); // subject -> most recent savedAt, for ordering
    for(const key of keys){
      try{
        const rec = await window.storage.get(key, false);
        if(!rec) continue;
        const item = JSON.parse(rec.value);
        const subj = (item.subject || '').trim();
        if(!subj || subj === 'Unsorted') continue;
        const savedAt = item.savedAt || 0;
        if(!seen.has(subj) || seen.get(subj) < savedAt) seen.set(subj, savedAt);
      } catch(e){}
    }
    return Array.from(seen.entries()).sort((a,b)=> b[1]-a[1]).map(([subj])=>subj);
  } catch(e){ console.error('Could not load existing subjects:', e); return []; }
}

async function populateSubjectChips(){
  const subjects = await loadExistingSubjects();
  if(subjects.length===0){ subjectExisting.style.display = 'none'; subjectChipRow.innerHTML=''; return; }
  subjectExisting.style.display = 'block';
  subjectChipRow.innerHTML = '';
  subjects.forEach(subj=>{
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'sm-chip';
    chip.textContent = subj;
    chip.addEventListener('click', ()=>{
      subjectInput.value = subj;
      subjectChipRow.querySelectorAll('.sm-chip').forEach(c=> c.classList.remove('selected'));
      chip.classList.add('selected');
      subjectInput.focus();
    });
    subjectChipRow.appendChild(chip);
  });
}

function openSubjectModal(){
  subjectInput.value = '';
  subjectModal.classList.add('open');
  subjectExisting.style.display = 'none';
  subjectChipRow.innerHTML = '';
  populateSubjectChips();
  setTimeout(()=> subjectInput.focus(), 50);
}
function closeSubjectModal(){ subjectModal.classList.remove('open'); }

function confirmSubject(){
  const val = subjectInput.value.trim();
  if(val) currentSubject = val;
  closeSubjectModal();
  // No save here — an empty lesson (subject picked, nothing taught yet)
  // shouldn't create a session entry. The first real exchange with the
  // AI (autoSaveSession, called from runTeachingTurn) is what actually
  // persists it, keyed to this subject.
  refreshSessionList();
}
document.getElementById('btn-subject-go').addEventListener('click', confirmSubject);
document.getElementById('btn-subject-skip').addEventListener('click', closeSubjectModal);
subjectInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); confirmSubject(); } });
subjectInput.addEventListener('input', ()=>{
  subjectChipRow.querySelectorAll('.sm-chip').forEach(c=>{
    c.classList.toggle('selected', c.textContent === subjectInput.value);
  });
});

const leaveModal = document.getElementById('leave-modal');
const leaveNameInput = document.getElementById('leave-name-input');

function goHomeNow(){
  parent.postMessage({ nav:'home' }, '*');
}

// Clicking Home mid-lesson shouldn't silently save (or silently lose)
// whatever's on the board — ask. Nothing to ask about if the board is
// still blank (no conversation yet), so just leave in that case.
function handleHomeClick(){
  if(conversationHistory.length === 0){
    goHomeNow();
    return;
  }
  const fallback = (currentTopicLabel && currentTopicLabel !== 'Topic')
    ? currentTopicLabel
    : (currentSessionTitle || (pdfFileName ? pdfFileName.replace(/\.pdf$/i,'') : ''));
  leaveNameInput.value = currentSessionTitle || fallback || '';
  leaveModal.classList.add('open');
  setTimeout(()=> leaveNameInput.focus(), 50);
}

document.getElementById('btn-leave-continue').addEventListener('click', closeLeaveModal);
document.getElementById('btn-leave-save').addEventListener('click', async ()=>{
  const name = leaveNameInput.value.trim();
  if(name) currentSessionTitle = name;
  try{ await persistSession(); } catch(e){ console.error('Save on leave failed:', e); }
  closeLeaveModal();
  goHomeNow();
});

// Ask for a subject the first time this tab lands on a brand-new,
// never-saved lesson. If the shell tells us (via postMessage) to open
// a specific saved session instead — e.g. from the Previous Tutorials
// page — wait briefly for that message and load it rather than
// prompting for a new subject.
let pendingSessionLoad = false;
window.addEventListener('message', (e)=>{
  const d = e.data;
  if(d && d.loadSessionId){
    pendingSessionLoad = true;
    loadSessionById(d.loadSessionId);
  }
});
setTimeout(()=>{ if(!pendingSessionLoad) openSubjectModal(); }, 260);

async function loadSessionById(id){
  try{
    const rec = await window.storage.get(sessionKeyPrefix() + id, false);
    if(rec) loadSession(JSON.parse(rec.value));
  } catch(e){ console.error('Could not load requested session:', e); openSubjectModal(); }
}

// shell page — this tutor page is loaded via iframe .srcdoc, and a
// srcdoc document reports its origin as "null", which Google's script
// refuses to authenticate from (Error 400: invalid_request, origin=
// null). So this page doesn't call Google's API directly: it asks the
// shell to sign in/out, and reflects whatever state the shell reports.

let currentUser = null; // {sub, email, name, picture} once signed in

// Sessions are namespaced by account so switching browsers/devices
// still finds the same saved work — PROVIDED persistSession/
// refreshSessionList are pointed at a real backend keyed by this same
// prefix instead of window.storage (see note on persistSession below).
// There is deliberately no signed-out ('local') bucket: persistSession
// and refreshSessionList both refuse to touch storage at all unless
// currentUser is set, so guest work is never written anywhere durable.
function sessionKeyPrefix(){
  return 'session:' + currentUser.sub + ':';
}

// Remembers which session is currently open, per signed-in account, so
// a plain page refresh resumes it instead of prompting for a new course
// name. Uses sessionStorage (survives a refresh, clears when the tab or
// site is closed) rather than localStorage, so it never leaks into a
// later, unrelated visit the way a persistent guest bucket would.
const LAST_ACTIVE_STORAGE_KEY = 'chalkline_last_active_session';
function rememberActiveSession(){
  if(!currentUser) return;
  try{
    sessionStorage.setItem(LAST_ACTIVE_STORAGE_KEY, JSON.stringify({ sub: currentUser.sub, id: currentSessionId }));
  } catch(e){ /* best-effort only */ }
}
function forgetActiveSession(){
  try{ sessionStorage.removeItem(LAST_ACTIVE_STORAGE_KEY); } catch(e){}
}
function readRememberedSessionId(){
  try{
    const raw = sessionStorage.getItem(LAST_ACTIVE_STORAGE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(currentUser && parsed && parsed.sub === currentUser.sub) return parsed.id;
  } catch(e){}
  return null;
}

function resetTutorBoardState(){
  currentSessionId = 'session_' + Date.now(); currentSessionTitle = null; currentSubject = '';
  pdfText=''; pdfFileName='';
  conversationHistory=[]; drawQueue=[]; drawnCommands=[];
  camera.x=500; camera.scale=1;
  resetRegionCursors(); currentTopicLabel='Topic';
  clearBoard();
  transcriptEl.innerHTML = '<div class="empty-note">Your lecture transcript and quiz questions will appear here as we go.</div>';
  resetUploadZoneUI();
  forgetActiveSession();
  refreshSessionList();
}

function applyAuthState(signedIn, user){
  // Whatever session is on screen belongs to whichever account was
  // previously signed in (or to this browser as a guest). If the
  // account identity actually changes — signing out, or a different
  // account signing in — that on-screen content must not carry over,
  // or the next viewer (including a signed-out visitor) would still
  // see it even though it was never re-fetched from storage.
  const prevSub = currentUser ? currentUser.sub : null;
  const newUser = signedIn ? user : null;
  const newSub = newUser ? newUser.sub : null;
  const accountChanged = prevSub !== null && prevSub !== newSub;
  const isFirstAuthReport = !authStateKnown;
  authStateKnown = true;

  currentUser = newUser;
  document.getElementById('account-signed-out').style.display = signedIn ? 'none' : 'block';
  document.getElementById('account-signed-in').style.display = signedIn ? 'block' : 'none';
  if(signedIn){
    document.getElementById('account-avatar').src = user.picture || '';
    document.getElementById('account-name').textContent = user.name || user.email || 'Signed in';
  }
  updateLoginPillVisibility();
  if(accountChanged){
    resetTutorBoardState();
    setStatus(signedIn ? 'switched account — showing a blank board' : 'signed out — showing a blank board');
  }
  // On the very first auth report after this page loaded (e.g. right
  // after a browser refresh), try to resume whatever session this
  // account had open before — instead of always starting fresh.
  if(isFirstAuthReport && signedIn && !pendingSessionLoad){
    const rememberedId = readRememberedSessionId();
    if(rememberedId){
      pendingSessionLoad = true;
      loadSessionById(rememberedId);
    }
  }
  // TODO: once a backend exists, this is where you'd fetch/merge that
  // user's saved sessions instead of just relighting the local list.
  refreshSessionList();
}

let authStateKnown = false;
window.addEventListener('message', (e)=>{
  const d = e.data;
  if(!d || !d.chalklineAuth) return;
  applyAuthState(!!d.signedIn, d.user);
});

document.getElementById('google-signin-btn').innerHTML =
  '<a class="link-btn" href="#" onclick="parent.postMessage({requestLogin:true},\'*\');return false;">Sign in with Google</a>';

});

// Top-of-canvas reminder pill: only shown while signed out. Since the
// real Google button lives in the shell (top-right, above every page),
// clicking this just asks the shell to trigger its sign-in prompt.
function updateLoginPillVisibility(){
  const pill = document.getElementById('btn-login-pill');
  if(pill) pill.style.display = currentUser ? 'none' : 'flex';
}
document.getElementById('btn-login-pill').addEventListener('click', ()=>{
  parent.postMessage({ requestLogin: true }, '*');
});
updateLoginPillVisibility();

function transcriptToHtmlSnapshot(){ return transcriptEl.innerHTML; }

async function persistSession(){
  // Guest (signed-out) work must never survive as durable, sharable
  // storage — otherwise closing and reopening the site (or a different
  // visitor on the same browser) would still see it, even though no
  // account owns it. Only persist once someone is actually signed in;
  // signed-out use stays purely in-memory for the current page life.
  if(!currentUser) return;
  // Prefer an explicit title the person set (via Save > name it), then
  // fall back to what was actually discussed with the AI — the first
  // "teach this" topic, captured in currentTopicLabel — before falling
  // further back to the uploaded file name or a generic label. This
  // means a session saved via autosave (never explicitly named) still
  // shows up in the list as e.g. "Price elasticity of demand" instead
  // of a meaningless "Untitled session".
  const derivedTitle = currentTopicLabel && currentTopicLabel !== 'Topic'
    ? currentTopicLabel
    : (pdfFileName ? pdfFileName.replace(/\.pdf$/i,'') : 'Untitled session');
  const payload = {
    id: currentSessionId,
    title: currentSessionTitle || derivedTitle,
    subject: currentSubject || 'Unsorted',
    savedAt: Date.now(),
    pdfFileName, pdfText: pdfText ? pdfText.slice(0,15000) : '',
    conversationHistory, drawnCommands, camera,
    globalCursorY, currentTopicLabel,
    transcriptHtml: transcriptToHtmlSnapshot()
  };
  // NOTE: window.storage only exists inside a Claude.ai artifact preview.
  // On your own deployed domain this call will fail, signed in or not —
  // swap it for a fetch() to a real backend endpoint (e.g. a route on
  // your Cloudflare Worker backed by KV or D1), sending currentUser's
  // verified identity so sessions are actually saved per-account.
  await window.storage.set(sessionKeyPrefix() + currentSessionId, JSON.stringify(payload), false);
  rememberActiveSession();
  refreshSessionList();
}

function autoSaveSession(){ if(conversationHistory.length>0) persistSession().catch(e=>console.error('Autosave failed:',e)); }

// Belt-and-braces autosave for exits mid-turn: catches switching tabs,
// navigating to another Chalkline page, or closing the browser, so
// content already produced is never lost even if the person leaves
// before the next AI turn would have triggered autoSaveSession().
// Guarded the same way as autoSaveSession — a subject was picked but
// nothing was actually taught yet is still a blank canvas and shouldn't
// leave behind a session entry.
function flushSaveOnExit(){
  if(conversationHistory.length>0){
    persistSession().catch(e=>console.error('Exit-time save failed:', e));
  }
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'hidden') flushSaveOnExit(); });
window.addEventListener('pagehide', flushSaveOnExit);
window.addEventListener('beforeunload', flushSaveOnExit);

let sessionListReq = 0;
async function deleteSession(id, ev){
  if(ev) ev.stopPropagation();
  if(!confirm('Delete this saved session? This can\'t be undone.')) return;
  try{
    await window.storage.delete(sessionKeyPrefix() + id, false);
    if(id === currentSessionId) resetTutorBoardState();
    refreshSessionList();
  } catch(e){ console.error('Delete session failed:', e); setStatus('delete failed — see console'); }
}
async function refreshSessionList(){
  const myReq = ++sessionListReq;
  const listEl = document.getElementById('session-list');
  const labelEl = document.getElementById('session-toggle-label');
  if(!currentUser){
    // Nothing is ever saved while signed out (see persistSession), so
    // there is nothing real to list — and we must not fall back to a
    // shared 'local' bucket that could show a previous guest's work.
    listEl.innerHTML = '<div class="empty-hint">Sign in to save sessions and see them here.</div>';
    if(labelEl) labelEl.textContent = 'Saved sessions';
    return;
  }
  try{
    const result = await window.storage.list(sessionKeyPrefix(), false);
    if(myReq !== sessionListReq) return; // superseded by a newer auth state
    const keys = (result && result.keys) ? result.keys : [];
    const items = [];
    for(const key of keys){
      try{ const rec = await window.storage.get(key, false); if(rec) items.push(JSON.parse(rec.value)); } catch(e){}
    }
    if(myReq !== sessionListReq) return;
    // Only show sessions that belong to the subject/course currently
    // being worked in — not every saved lesson across every subject.
    // With no subject picked yet (e.g. right after "new"), fall back to
    // showing the unsorted/no-subject sessions instead of everything.
    const filtered = currentSubject
      ? items.filter(item => (item.subject || 'Unsorted') === currentSubject)
      : items.filter(item => !item.subject || item.subject === 'Unsorted');
    labelEl.textContent = (currentSubject || 'Sessions') + (filtered.length ? ` (${filtered.length})` : '');
    if(filtered.length===0){
      listEl.innerHTML = `<div class="empty-note">No saved sessions yet${currentSubject ? ' in ' + escapeHtml(currentSubject) : ''}.</div>`;
      return;
    }
    filtered.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
    listEl.innerHTML = '';
    filtered.forEach(item=>{
      const div = document.createElement('div'); div.className='session-item';
      const date = new Date(item.savedAt);
      div.innerHTML = `<span class="s-name">${escapeHtml(item.title||'Untitled')}</span><span class="s-date">${date.toLocaleDateString()}</span><button type="button" class="s-delete" title="Delete">✕</button>`;
      div.addEventListener('click', ()=> loadSession(item));
      div.querySelector('.s-delete').addEventListener('click', (ev)=> deleteSession(item.id, ev));
      listEl.appendChild(div);
    });
  } catch(err){ console.error('Listing sessions failed:', err); listEl.innerHTML = '<div class="empty-note">Could not load saved sessions.</div>'; }
}

const sessionToggleBtn = document.getElementById('btn-session-toggle');
sessionToggleBtn.addEventListener('click', ()=>{
  sessionToggleBtn.classList.toggle('open');
  document.getElementById('session-list').classList.toggle('open');
});

function resetUploadZoneUI(){
  uploadZone.classList.remove('has-file');
  uploadZone.innerHTML = `Drop a PDF, or click to import a chapter, slide deck or notes.<input type="file" id="pdf-input" accept="application/pdf">`;
  document.getElementById('pdf-input').addEventListener('change', (e)=>{ if(e.target.files.length) handlePdfFile(e.target.files[0]); });
}

function loadSession(item){
  currentSessionId = item.id; currentSessionTitle = item.title;
  currentSubject = item.subject && item.subject!=='Unsorted' ? item.subject : '';
  pdfFileName = item.pdfFileName || ''; pdfText = item.pdfText || '';
  conversationHistory = item.conversationHistory || [];
  drawnCommands = item.drawnCommands || [];
  if(item.camera) Object.assign(camera, item.camera);
  if(item.globalCursorY !== undefined) globalCursorY = item.globalCursorY;
  else if(item.regionCursor) globalCursorY = Math.max(item.regionCursor.notes, item.regionCursor.graph, item.regionCursor.detail);
  else globalCursorY = TOP_MARGIN;
  
  currentTopicLabel = item.currentTopicLabel || 'Topic';
  transcriptEl.innerHTML = item.transcriptHtml || '<div class="empty-note">No transcript in this session.</div>';
  if(pdfFileName){
    uploadZone.classList.add('has-file');
    uploadZone.innerHTML = `<div class="file-name">📄 ${escapeHtml(pdfFileName)}</div><div class="file-meta">restored from saved session</div>`;
  } else { resetUploadZoneUI(); }
  checkIfScrolledAway();
  redrawAll();
  setStatus('session loaded');
  closePanel();
  rememberActiveSession();
  // Subject may have changed loading this session — refresh the list so
  // it's still scoped to whatever subject/course is now active.
  refreshSessionList();
}

// Manual save is gone from the UI — sessions autosave (autoSaveSession/
// flushSaveOnExit) whenever there's actual conversation content, so
// nothing is lost without it.
document.getElementById('btn-new-session').addEventListener('click', ()=>{

});

   SIDE PANEL TOGGLES

const sidePanel = document.getElementById('side-panel');
const overlay = document.getElementById('overlay');
function openPanel(){ sidePanel.classList.add('open'); overlay.classList.add('open'); }
function closePanel(){ sidePanel.classList.remove('open'); overlay.classList.remove('open'); }

/* =========================================================
   WIRE UP CONTROLS
   ========================================================= */
document.getElementById('btn-teach').addEventListener('click', ()=>{
  const val = document.getElementById('topic-input').value.trim();
  if(!val) return;
  if(conversationHistory.length === 0) currentTopicLabel = val.length > 60 ? val.slice(0,57)+'…' : val;
  runTeachingTurn(val);
  document.getElementById('topic-input').value = '';
  closePanel();
});
document.getElementById('btn-quiz').addEventListener('click', ()=>{
  const val = document.getElementById('topic-input').value.trim();
  const prompt = val ? `Please quiz me on: ${val}` : (pdfText ? `Please quiz me on the uploaded document.` : `Please quiz me on the most recent topic we discussed.`);
  runTeachingTurn(prompt);
  closePanel();
});
// Attachment picked from the ask-follow-up box's paperclip button. Cleared
// after being sent (or removed via the chip's × button).
let pendingAttachment = null; // {kind:'pdf'|'image'|'text', name, text?, mimeType?, base64?}

function renderAttachChip(){
  const chip = document.getElementById('attach-chip');
  if(!pendingAttachment){ chip.style.display = 'none'; chip.innerHTML = ''; return; }
  const icon = pendingAttachment.kind === 'image' ? '🖼' : '📄';
  chip.style.display = 'flex';
  chip.innerHTML = `<span>${icon}</span><span class="attach-chip-name">${escapeHtml(pendingAttachment.name)}</span><button type="button" class="attach-chip-remove" id="attach-chip-remove" title="Remove attachment">×</button>`;
  document.getElementById('attach-chip-remove').addEventListener('click', ()=>{ pendingAttachment = null; renderAttachChip(); });
}

async function handleAttachFile(file){
  try{
    if(file.type === 'application/pdf'){
      if(!pdfjsAvailable){ setStatus('pdf engine unavailable — try reloading'); return; }
      setStatus('reading attachment…');
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data: buf}).promise;
      let text = '';
      const maxPages = Math.min(pdf.numPages, 20);
      for(let i=1;i<=maxPages;i++){
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += `\n\n[Page ${i}]\n` + content.items.map(it=>it.str).join(' ');
      }
      pendingAttachment = { kind:'pdf', name:file.name, text: text.slice(0,20000) };
    } else if(file.type.startsWith('image/')){
      setStatus('reading attachment…');
      const dataUrl = await new Promise((res,rej)=>{
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = () => rej(new Error('read failed'));
        r.readAsDataURL(file);
      });
      pendingAttachment = { kind:'image', name:file.name, mimeType:file.type, base64: dataUrl.split(',')[1] };
    } else {
      setStatus('reading attachment…');
      const text = await file.text();
      pendingAttachment = { kind:'text', name:file.name, text: text.slice(0,20000) };
    }
    setStatus('attachment ready');
    renderAttachChip();
  } catch(err){
    console.error('Attachment read failed:', err);
    setStatus('could not read attachment — see console');
  }
}

document.getElementById('btn-attach').addEventListener('click', ()=> document.getElementById('attach-input').click());
document.getElementById('attach-input').addEventListener('change', (e)=>{
  if(e.target.files.length) handleAttachFile(e.target.files[0]);
  e.target.value = ''; // allow re-picking the same file later
});

function handleAsk(text){
  const typed = (text || '').trim();
  if(!typed && !pendingAttachment) return;

  let message = typed;
  let imageAttachment = null;
  if(pendingAttachment){
    if(pendingAttachment.kind === 'image'){
      message = (message ? message + '\n\n' : '') + `[Attached image: ${pendingAttachment.name}]`;
      imageAttachment = { mimeType: pendingAttachment.mimeType, base64: pendingAttachment.base64 };
    } else {
      message = (message ? message + '\n\n' : '') + `[Attached file: ${pendingAttachment.name}]\n${pendingAttachment.text}`;
    }
  }

  runTeachingTurn(message, typed || `Attached: ${pendingAttachment.name}`, imageAttachment);
  document.getElementById('ask-input').value = '';
  pendingAttachment = null;
  renderAttachChip();
}
document.getElementById('btn-ask').addEventListener('click', ()=> handleAsk(document.getElementById('ask-input').value));
document.getElementById('ask-input').addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleAsk(e.target.value); });

/* =========================================================
   INIT
   ========================================================= */
resizeCanvas();
// Mobile browsers (portrait especially) can still be settling viewport
// chrome/address-bar height right after load, so the very first
// getBoundingClientRect() here may be stale. A couple of fixed-delay
// retries isn't always enough — the same reason orientationchange uses
// the polling "wait until size stops changing" version instead of fixed
// timeouts — so use that same stabilizing function here too, rather than
// locking in a stale size if settling runs past a hardcoded delay.
resizeCanvasWhenStable(1000);
setStatus('idle');
refreshSessionList();
<\/script>

.session-item .s-date{font-family:'JetBrains Mono', monospace;font-size:10px;color:var(--muted);flex-shrink:0;margin-left:8px;}
.session-item .s-delete{border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 4px;margin-left:6px;flex-shrink:0;border-radius:4px;}
.session-item .s-delete:hover{color:#b3452f;background:#FBEDE9;}
</style>
</head>
<body>

<div class="ambient-halo"></div>

<div class="wrap">
  <nav>
    <a class="brand" href="#" onclick="parent.postMessage({nav:'home'},'*');return false;"><span class="dot"></span>Chalkline</a>
    <div class="nav-links">
      <a href="#" onclick="parent.postMessage({nav:'tutor'},'*');return false;">Tutor</a>
      <a href="#" class="active" onclick="return false;">Summary</a>
    </div>
  </nav>

  <div class="page-head">
    <a href="#" class="icon-link" style="display:inline-flex;align-items:center;gap:4px;margin-bottom:14px;" onclick="parent.postMessage({nav:'home'},'*');return false;">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M10 12.5 5 8l5-4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to home
    </a>
    <h1>Summarize your notes</h1>
    <p>Upload a PDF — a chapter, slide deck, or your own notes — and get back a clear, structured summary of what's actually in it.</p>
  </div>

  <div class="p-section" style="margin-bottom:22px;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <h2 style="font-size:15px;margin:0;">Previous summaries</h2>
      <button class="icon-link" id="btn-new-summary-session">new</button>
    </div>
    <div class="session-list" id="summary-session-list" style="margin-top:10px;"><div class="empty-hint">Sign in to save and revisit your summaries.</div></div>
  </div>

  <div id="upload-zone">
    Drop a PDF here, or click to choose a file.
    <input type="file" id="pdf-input" accept="application/pdf">
  </div>

  <div class="controls">
    <select id="length-select" class="length-select">
      <option value="brief">Brief — key points only</option>
      <option value="standard" selected>Standard — sectioned summary</option>
      <option value="detailed">Detailed — thorough walkthrough</option>
    </select>
    <button id="btn-summarize" class="btn-primary" disabled>Summarize</button>
  </div>
  <div class="status-line" id="status-line"></div>

  <div id="output-wrap">
    <div class="output-head">
      <h2 id="output-title">Summary</h2>
      <div class="output-actions">
        <button class="icon-link" id="btn-copy">Copy</button>
        <button class="icon-link" id="btn-download">Download PDF</button>
      </div>
    </div>
    <div id="summary-panel"></div>
  </div>
</div>

<script>
/* ---------------------------------------------------------------
   window.storage shim: the real window.storage API only exists
   inside the Claude.ai artifact preview sandbox — on a real
   deployed site (like this one, on GitHub Pages) it doesn't exist
   at all, so every call used to throw and autosave failed silently.
   This shim gives the same get/set/list/delete interface, backed
   by localStorage, so saving actually works once deployed. Swap
   this out for real fetch() calls to your own backend later if you
   want saves to sync across devices instead of staying per-browser.
   ------------------------------------------------------------- */
if(!window.storage || !window.storage.__isRealBackend){
  const STORAGE_NS = 'chalkline:';
  window.storage = {
    __isRealBackend: false,
    async get(key){
      const raw = localStorage.getItem(STORAGE_NS + key);
      return raw === null ? null : { key, value: raw, shared: false };
    },
    async set(key, value){
      try{ localStorage.setItem(STORAGE_NS + key, value); return { key, value, shared: false }; }
      catch(e){ console.error('localStorage set failed:', e); return null; }
    },
    async delete(key){
      const existed = localStorage.getItem(STORAGE_NS + key) !== null;
      localStorage.removeItem(STORAGE_NS + key);
      return { key, deleted: existed, shared: false };
    },
    async list(prefix){
      const keys = [];
      const full = STORAGE_NS + (prefix || '');
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(full)) keys.push(k.slice(STORAGE_NS.length));
      }
      return { keys, prefix, shared: false };
    }
  };
}

const pdfjsAvailable = typeof pdfjsLib !== 'undefined';
if(pdfjsAvailable){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}
let pdfText = '', pdfFileName = '';
const uploadZone = document.getElementById('upload-zone');
const pdfInput = document.getElementById('pdf-input');
const btnSummarize = document.getElementById('btn-summarize');
const statusLine = document.getElementById('status-line');

/* ---------------- account + saved summaries -----------------------
   Same convention as the tutor page: sessions are namespaced under
   'summary:<account sub or "local">:<id>' so the home page can list
   both kinds of history by prefix. Swap window.storage for a real
   backend call once one exists — see the tutor page's persistSession
   for the same note. */
let currentUser = null;
let currentSummarySessionId = 'summary_' + Date.now();
let currentSummaryTitle = null;

function summarySessionKeyPrefix(){
  return 'summary:' + currentUser.sub + ':';
}

function resetSummaryViewState(){
  currentSummarySessionId = 'summary_' + Date.now(); currentSummaryTitle = null;
  pdfText=''; pdfFileName='';
  uploadZone.classList.remove('has-file');
  uploadZone.innerHTML = `Drop a PDF here, or click to choose a file.<input type="file" id="pdf-input" accept="application/pdf">`;
  document.getElementById('pdf-input').addEventListener('change', (e)=>{ if(e.target.files.length) handlePdfFile(e.target.files[0]); });
  btnSummarize.disabled = true;
  outputWrap.classList.remove('show');
  summaryPanel.innerHTML = '';
}

window.addEventListener('message', (e)=>{
  const d = e.data;
  if(!d || !d.chalklineAuth) return;
  // Same reasoning as the tutor page: don't let a summary that was
  // open under one account (or as a guest) remain on screen once the
  // account identity actually changes — otherwise it stays visible to
  // whoever is looking at the page next, including after sign-out.
  const prevSub = currentUser ? currentUser.sub : null;
  const newUser = d.signedIn ? d.user : null;
  const newSub = newUser ? newUser.sub : null;
  const accountChanged = prevSub !== null && prevSub !== newSub;
  currentUser = newUser;
  if(accountChanged){
    resetSummaryViewState();
    setStatus(d.signedIn ? 'switched account — cleared previous summary' : 'signed out — cleared previous summary');
  }
  refreshSummarySessionList();
  if(pendingSummaryLoad) loadSummarySessionById(pendingSummaryLoad);
});

// If the shell tells us to open a specific saved summary (e.g. from the
// Previous Summaries page), try immediately, then retry once real auth
// state arrives (it may land slightly after this message, and the key
// prefix depends on it).
let pendingSummaryLoad = null;
window.addEventListener('message', (e)=>{
  const d = e.data;
  if(d && d.loadSummaryId){
    pendingSummaryLoad = d.loadSummaryId;
    loadSummarySessionById(d.loadSummaryId);
  }
});

async function loadSummarySessionById(id){
  try{
    const rec = await window.storage.get(summarySessionKeyPrefix() + id, false);
    if(rec){ loadSummarySession(JSON.parse(rec.value)); pendingSummaryLoad = null; }
  } catch(e){ console.error('Could not load requested summary:', e); }
}

async function persistSummarySession(html){
  // Guest (signed-out) summaries must never be written to durable,
  // sharable storage — otherwise closing and reopening the site, or a
  // different visitor on the same browser, would still see them. Only
  // persist once someone is actually signed in.
  if(!currentUser) return;
  const payload = {
    id: currentSummarySessionId,
    title: currentSummaryTitle || (pdfFileName ? pdfFileName.replace(/\.pdf$/i,'') : 'Untitled summary'),
    savedAt: Date.now(),
    pdfFileName, html
  };
  try{ await window.storage.set(summarySessionKeyPrefix() + currentSummarySessionId, JSON.stringify(payload), false); }
  catch(e){ console.error('Saving summary failed:', e); }
  refreshSummarySessionList();
}

let summarySessionListReq = 0;
async function deleteSummarySession(id, ev){
  if(ev) ev.stopPropagation();
  if(!confirm('Delete this saved summary? This can\'t be undone.')) return;
  try{
    await window.storage.delete(summarySessionKeyPrefix() + id, false);
    if(id === currentSummarySessionId) resetSummaryViewState();
    refreshSummarySessionList();
  } catch(e){ console.error('Delete summary failed:', e); setStatus('delete failed — see console'); }
}
async function refreshSummarySessionList(){
  const myReq = ++summarySessionListReq;
  const listEl = document.getElementById('summary-session-list');
  if(!currentUser){ listEl.innerHTML = '<div class="empty-hint">Sign in to save and revisit your summaries.</div>'; return; }
  try{
    const result = await window.storage.list(summarySessionKeyPrefix(), false);
    if(myReq !== summarySessionListReq) return; // superseded by a newer auth state
    const keys = (result && result.keys) ? result.keys : [];
    if(keys.length===0){ listEl.innerHTML = '<div class="empty-hint">No saved summaries yet.</div>'; return; }
    const items = [];
    for(const key of keys){
      try{ const rec = await window.storage.get(key, false); if(rec) items.push(JSON.parse(rec.value)); } catch(e){}
    }
    if(myReq !== summarySessionListReq) return;
    items.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
    listEl.innerHTML = '';
    items.forEach(item=>{
      const div = document.createElement('div'); div.className='session-item';
      const date = new Date(item.savedAt);
      div.innerHTML = `<span class="s-name">${escapeHtml(item.title||'Untitled')}</span><span class="s-date">${date.toLocaleDateString()}</span><button type="button" class="s-delete" title="Delete">✕</button>`;
      div.style.cursor = 'pointer';
      div.addEventListener('click', ()=> loadSummarySession(item));
      div.querySelector('.s-delete').addEventListener('click', (ev)=> deleteSummarySession(item.id, ev));
      listEl.appendChild(div);
    });
  } catch(err){ console.error('Listing summaries failed:', err); listEl.innerHTML = '<div class="empty-hint">Could not load saved summaries.</div>'; }
}

function loadSummarySession(item){
  currentSummarySessionId = item.id; currentSummaryTitle = item.title;
  pdfFileName = item.pdfFileName || '';
  outputTitle.textContent = `Summary — ${(pdfFileName || item.title || '').replace(/\.pdf$/i,'')}`;
  summaryPanel.innerHTML = item.html || '';
  outputWrap.classList.add('show');
  setStatus('summary loaded');
  outputWrap.scrollIntoView({behavior:'smooth', block:'start'});
}

document.getElementById('btn-new-summary-session').addEventListener('click', ()=>{
  resetSummaryViewState();
  setStatus('new summary');
});
/* -------------------------------------------------------------- */
function setStatus(s){ statusLine.textContent = s || ''; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

uploadZone.addEventListener('click', ()=> pdfInput.click());
uploadZone.addEventListener('dragover', (e)=> e.preventDefault());
uploadZone.addEventListener('drop', (e)=>{ e.preventDefault(); if(e.dataTransfer.files.length) handlePdfFile(e.dataTransfer.files[0]); });
pdfInput.addEventListener('change', (e)=>{ if(e.target.files.length) handlePdfFile(e.target.files[0]); });

async function handlePdfFile(file){
  if(!pdfjsAvailable){ alert("PDF import couldn't load its engine. Try reloading the page."); return; }
  if(file.type !== 'application/pdf'){ alert('Please choose a PDF file.'); return; }
  setStatus('reading pdf…');
  pdfFileName = file.name;
  try{
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
    let fullText = '';
    const maxPages = Math.min(pdf.numPages, 60);
    for(let i=1;i<=maxPages;i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      fullText += `\n\n[Page ${i}]\n` + content.items.map(it=>it.str).join(' ');
    }
    pdfText = fullText;
    uploadZone.classList.add('has-file');
    uploadZone.innerHTML = `<div class="file-name">📄 ${escapeHtml(pdfFileName)}</div><div class="file-meta">${pdf.numPages} page${pdf.numPages===1?'':'s'} · text extracted${pdf.numPages>60 ? ' (first 60 pages)' : ''}</div>`;
    btnSummarize.disabled = false;
    setStatus('ready to summarize');
  } catch(err){
    console.error('Failed to read PDF:', err);
    setStatus('could not read this pdf — see console');
  }
}

const PROXY_URL = "https://api.takundamambudzi02.workers.dev";

function lengthInstruction(mode){
  if(mode === 'brief') return "Keep it short: a handful of the most important bullet points only, no sections, under 150 words.";
  if(mode === 'detailed') return "Be thorough: cover every section of the source in real depth, with sub-points and examples where the source has them. It's fine for this to be long.";
  return "Aim for a well-organized overview: a few clear sections with headings, each with 3-6 bullet points covering the important content.";
}

async function summarizeText(text, mode){
  if(PROXY_URL.includes('YOUR-WORKER-SUBDOMAIN')){
    return { ok:false, error:"The AI proxy hasn't been set up yet." };
  }

  const system = `You are a study-notes summarizer. You are given the extracted text of a PDF (a chapter, slide deck, or notes) and must produce a summary of it for a student reviewing before an exam.

Output format: plain HTML fragment only using: <h3>, <p>, <ul>/<li>, <strong>.

${lengthInstruction(mode)}`;

  const userMsg = `Extracted PDF text (file: ${pdfFileName}):\n\n${text.slice(0, 60000)}`;

  let response, data;
  try{
    response = await fetch(`${PROXY_URL}/gemini`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        system_instruction: { parts: [{ text: system }] },
        contents: [{ role:"user", parts:[{ text: userMsg }] }],
        generationConfig: { maxOutputTokens: 3000 }
      })
    });
  } catch(networkErr){
    return { ok:false, error:"The request never reached the proxy." };
  }

  try{ data = await response.json(); }
  catch(parseErr){
    return { ok:false, error:"The server responded, but not with valid JSON." };
  }

  if(!response.ok){
    const msg = (data && data.error && data.error.message) ? data.error.message : JSON.stringify(data);
    return { ok:false, error:`The model returned an error: ${msg}` };
  }

  const candidate = data.candidates && data.candidates[0];
  const part = candidate && candidate.content && candidate.content.parts && candidate.content.parts[0];
  if(!part || !part.text){
    return { ok:false, error:"The response came back in an unexpected shape." };
  }
  return { ok:true, html: part.text.trim().replace(/^```html\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'') };
}

const outputWrap = document.getElementById('output-wrap');
const summaryPanel = document.getElementById('summary-panel');
const outputTitle = document.getElementById('output-title');

btnSummarize.addEventListener('click', async ()=>{
  if(!pdfText){ setStatus('upload a pdf first'); return; }
  const mode = document.getElementById('length-select').value;
  btnSummarize.disabled = true;
  setStatus('reading and summarizing…');
  const result = await summarizeText(pdfText, mode);
  btnSummarize.disabled = false;
  if(!result.ok){
    setStatus(result.error);
    return;
  }
  outputTitle.textContent = `Summary — ${pdfFileName.replace(/\.pdf$/i,'')}`;
  summaryPanel.innerHTML = result.html;
  outputWrap.classList.add('show');
  setStatus('done');
  outputWrap.scrollIntoView({behavior:'smooth', block:'start'});
  persistSummarySession(result.html);
});

document.getElementById('btn-copy').addEventListener('click', ()=>{
  const text = summaryPanel.innerText;
  navigator.clipboard.writeText(text).then(()=> setStatus('summary copied')).catch(()=> setStatus('copy failed'));
});

document.getElementById('btn-download').addEventListener('click', ()=>{
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const margin = 48;
    const maxWidth = 595 - margin*2;
    let y = margin;
    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text(outputTitle.textContent, margin, y); y += 26;

    const nodes = summaryPanel.children.length ? Array.from(summaryPanel.children) : [summaryPanel];
    nodes.forEach(node=>{
      const tag = node.tagName ? node.tagName.toLowerCase() : 'p';
      if(tag === 'h3'){
        doc.setFont('helvetica','bold'); doc.setFontSize(13);
        if(y > 760){ doc.addPage(); y = margin; }
        y += 10;
        const lines = doc.splitTextToSize(node.textContent, maxWidth);
        doc.text(lines, margin, y); y += lines.length*16 + 4;
      } else if(tag === 'ul'){
        doc.setFont('helvetica','normal'); doc.setFontSize(11);
        Array.from(node.children).forEach(li=>{
          const lines = doc.splitTextToSize('•  ' + li.textContent, maxWidth);
          if(y + lines.length*14 > 780){ doc.addPage(); y = margin; }
          doc.text(lines, margin, y); y += lines.length*14 + 2;
        });
        y += 6;
      } else {
        doc.setFont('helvetica','normal'); doc.setFontSize(11);
        const lines = doc.splitTextToSize(node.textContent, maxWidth);
        if(y + lines.length*14 > 780){ doc.addPage(); y = margin; }
        doc.text(lines, margin, y); y += lines.length*14 + 8;
      }
    });

    doc.save((pdfFileName ? pdfFileName.replace(/\.pdf$/i,'') : 'summary') + ' - summary.pdf');
    setStatus('pdf downloaded');
  } catch(err){
    console.error('PDF export failed:', err);
    setStatus('pdf export failed — see console');
  }
});
<\/script>

</body>
</html>
</script>

<script type="text/plain" id="src-tutor-history"><!DOCTYPE html>

<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@600;700&display=swap');

:root{
  --board-bg:#BFDCF7;

body{

  background:#fff; border:1px dashed var(--panel-border); border-radius:14px;

}
</style>
</head>
<body>

<div class="ambient-halo"></div>

<div class="wrap">
  <nav>

  <div id="th-content">
    <div class="empty-hint">Loading…</div>

<script>
/* ---------------------------------------------------------------
   window.storage shim: the real window.storage API only exists
   inside the Claude.ai artifact preview sandbox — on a real
   deployed site (like this one, on GitHub Pages) it doesn't exist
   at all, so every call used to throw and autosave failed silently.
   This shim gives the same get/set/list/delete interface, backed
   by localStorage, so saving actually works once deployed. Swap
   this out for real fetch() calls to your own backend later if you
   want saves to sync across devices instead of staying per-browser.
   ------------------------------------------------------------- */
if(!window.storage || !window.storage.__isRealBackend){
  const STORAGE_NS = 'chalkline:';
  window.storage = {
    __isRealBackend: false,
    async get(key){
      const raw = localStorage.getItem(STORAGE_NS + key);
      return raw === null ? null : { key, value: raw, shared: false };
    },
    async set(key, value){
      try{ localStorage.setItem(STORAGE_NS + key, value); return { key, value, shared: false }; }
      catch(e){ console.error('localStorage set failed:', e); return null; }
    },
    async delete(key){
      const existed = localStorage.getItem(STORAGE_NS + key) !== null;
      localStorage.removeItem(STORAGE_NS + key);
      return { key, deleted: existed, shared: false };
    },
    async list(prefix){
      const keys = [];
      const full = STORAGE_NS + (prefix || '');
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(full)) keys.push(k.slice(STORAGE_NS.length));
      }
      return { keys, prefix, shared: false };
    }
  };
}

let thUser = null;

function escapeHtmlTH(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

function sessionKeyPrefixTH(){
  return 'session:' + thUser.sub + ':';
}

window.addEventListener('message', (e)=>{
  const d = e.data;
  if(!d || !d.chalklineAuth) return;
  thUser = d.signedIn ? d.user : null;
  refreshTutorHistory();
});

let sessionListReqTH = 0;

// Each subject folder gets a distinct color + icon, derived
// deterministically from its name (a simple string hash), so the same
// subject always looks the same across visits instead of colors
// shuffling around on every reload.
const FOLDER_PALETTE = [
  { accent:'#2E7DBE', tint:'#EAF4FD', icon:'📘' },
  { accent:'#3E8FA6', tint:'#E9F6F7', icon:'📗' },
  { accent:'#C0392B', tint:'#FBEDE9', icon:'📕' },
  { accent:'#D96B27', tint:'#FDF1E7', icon:'📙' },
  { accent:'#6C3483', tint:'#F3EBF7', icon:'📔' },
  { accent:'#2A8A5D', tint:'#EAF7F0', icon:'📓' },
  { accent:'#B7950B', tint:'#FBF6E3', icon:'📒' },
  { accent:'#5D6D7E', tint:'#EEF1F3', icon:'🗂️' }
];
function folderStyleFor(subj){
  if(subj === 'Unsorted') return { accent:'#7C93A8', tint:'#F3F5F7', icon:'🗒️' };
  let hash = 0;
  for(let i=0;i<subj.length;i++){ hash = (hash*31 + subj.charCodeAt(i)) | 0; }
  return FOLDER_PALETTE[Math.abs(hash) % FOLDER_PALETTE.length];
}

async function refreshTutorHistory(){
  const myReq = ++sessionListReqTH;
  const content = document.getElementById('th-content');
  if(!thUser){
    // Nothing is ever saved while signed out (persistSession refuses to
    // write without an account), so there's nothing real to list here —
    // and we must not query a shared 'local' bucket that could surface
    // a previous guest's leftover sessions.
    content.innerHTML = '<div class="signin-note">Sign in to save tutorials to your account and see them here.</div>';
    return;
  }
  try{
    const result = await window.storage.list(sessionKeyPrefixTH(), false);
    if(myReq !== sessionListReqTH) return; // a newer auth state has since started its own refresh
    const keys = (result && result.keys) ? result.keys : [];
    if(keys.length===0){
      content.innerHTML = '<div class="empty-state">No saved tutorials yet — start a lesson and it will show up here.</div>';
      return;
    }
    const items = [];
    for(const key of keys){
      try{ const rec = await window.storage.get(key, false); if(rec) items.push(JSON.parse(rec.value)); } catch(e){}
    }
    if(myReq !== sessionListReqTH) return;
    items.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));

    const groups = {};
    items.forEach(item=>{
      const subj = item.subject || 'Unsorted';
      if(!groups[subj]) groups[subj] = [];
      groups[subj].push(item);
    });
    const subjects = Object.keys(groups).sort((a,b)=>{
      if(a==='Unsorted') return 1;
      if(b==='Unsorted') return -1;
      return (groups[b][0].savedAt||0) - (groups[a][0].savedAt||0);
    });

    content.innerHTML = '';
    subjects.forEach((subj, idx)=>{
      const style = folderStyleFor(subj);
      const folder = document.createElement('div');
      folder.className = 'folder';
      folder.style.borderTopColor = style.accent;
      folder.style.borderTopWidth = '3px';
      const head = document.createElement('div');
      head.className = 'folder-head';
      head.innerHTML = `
        <div class="folder-icon" style="background:${style.tint};color:${style.accent};">${style.icon}</div>
        <div class="folder-title">${escapeHtmlTH(subj)}</div>
        <div class="folder-count" style="color:${style.accent};background:${style.tint};">${groups[subj].length} lesson${groups[subj].length===1?'':'s'}</div>
        <div class="folder-chevron" style="color:${style.accent};"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6 3.5 11 8l-5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      `;
      head.addEventListener('click', ()=> folder.classList.toggle('open'));
      const body = document.createElement('div');
      body.className = 'folder-body';
      groups[subj].forEach(item=>{
        const row = document.createElement('div');
        row.className = 'tutorial-row';
        const date = new Date(item.savedAt);
        row.innerHTML = `
          <span class="t-name">${escapeHtmlTH(item.title||'Untitled')}</span>
          <span class="t-topic">${escapeHtmlTH(item.currentTopicLabel||'')}</span>
          <span class="t-date">${date.toLocaleDateString()}</span>
          <button type="button" class="t-delete" title="Delete">✕</button>
        `;
        row.addEventListener('click', ()=> parent.postMessage({nav:'tutor', loadSessionId:item.id}, '*'));
        row.querySelector('.t-delete').addEventListener('click', async (ev)=>{
          ev.stopPropagation();
          if(!confirm('Delete this saved tutorial? This can\'t be undone.')) return;
          try{
            await window.storage.delete(sessionKeyPrefixTH() + item.id, false);
            refreshTutorHistory();
          } catch(e){ console.error('Delete tutorial failed:', e); }
        });
        body.appendChild(row);
      });
      folder.appendChild(head);
      folder.appendChild(body);
      content.appendChild(folder);

      // set an actual pixel max-height so the CSS transition can open it
      requestAnimationFrame(()=>{
        if(folder.classList.contains('open')) body.style.maxHeight = body.scrollHeight + 'px';
      });
    });

    // re-measure open folders on any toggle
    content.querySelectorAll('.folder-head').forEach(head=>{
      head.addEventListener('click', ()=>{
        const folder = head.parentElement;
        const body = folder.querySelector('.folder-body');
        body.style.maxHeight = folder.classList.contains('open') ? body.scrollHeight + 'px' : '';
      });
    });
  } catch(err){
    console.error('Loading tutorials failed:', err);
    content.innerHTML = '<div class="empty-hint">Could not load saved tutorials.</div>';
  }
}

refreshTutorHistory();
<\/script>

</body>
</html>
</script>
