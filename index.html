  "quiz": null OR { "question":"...", "options":["...","...","...","..."], "correctIndex":0, "explanation":"..." }
}

"speechSegments" (OPTIONAL, but strongly preferred) lets the app scroll to and highlight
the exact thing you're talking about while you say it — like a real teacher pointing at
the board. Break "speech" into its natural pieces in spoken order, and for each piece say
which board item(s) it's about:
[
  { "text":"First, let's look at the demand curve.", "boardRefs":[2] },
  { "text":"Notice that it slopes downward.", "boardRefs":[2] },
  { "text":"Remember the equation we wrote earlier for elasticity.", "boardRefs":["elasticity"] }
]
Rules for "speechSegments":
- Every "text" value MUST be an exact, verbatim substring of "speech" (same words, same order, no paraphrasing) — the app locates each segment by searching for it inside "speech".
- The segments, concatenated in order, should cover all of "speech" (a short one-off aside can be left out, but don't skip large chunks).
- "boardRefs" is a list where each entry is EITHER:
  (a) a number — the 0-based index of an item in THIS turn's "board" array (something you're drawing right now), or
  (b) a short string — a few distinctive words copied from the TEXT of an item you (or an earlier turn) already put on the board, used to point back at that EXISTING item instead of redrawing it. Pick words specific enough to uniquely identify that item (e.g. "slopes downward because" rather than just "the curve").
- When you say "remember...", "as we saw earlier...", "going back to...", or otherwise refer to something already on the board, use a string boardRef to point at the existing item — NEVER regenerate a duplicate copy of it in "board" just so you have something to reference.
- It's fine and expected for consecutive segments to share the same boardRefs while you keep talking about one item, and for boardRefs to jump back to an earlier item and then forward again — that back-and-forth is exactly what makes the lesson feel like a real lecture rather than a scroll-through.
- If you omit "speechSegments" entirely, the app falls back to simply following along with whatever is most recently drawn — so it still works, but won't be able to point back at earlier material. Prefer including it.

ALL TEXT, HEADINGS, EQUATIONS, AND EXPLANATIONS ON THE BOARD ARE RENDERED IN REALISTIC HANDWRITING.
Use color changes on key terms and equations for visual emphasis and clarity.
Colors available: "ink" (navy blue), "ochre" (amber/orange keyword emphasis), "sage" (green emphasis), "brick" (red emphasis), "teal", "violet", "sky", "coral".

CRITICAL LAYOUT RULES - THE APP WILL OVERRIDE YOUR COORDINATES:
1. DO NOT try to position text next to a graph. Everything is strictly stacked vertically in a single column by the engine.
2. ONLY use "text" commands for paragraph explanations. DO NOT use "text" commands to title or label graphs or images.
3. FOR GRAPHS, use ONLY the "plot" command. FOR ANY REAL DIAGRAM/PHOTO, use ONLY the "image" command. Put the title/caption INSIDE that command's own properties. DO NOT use separate text commands near it.

TEXT ON THE BOARD MUST USE REAL SYMBOLS, NOT SPELLED-OUT WORDS: π, θ, β, α, γ, Δ, Σ, ∫, √, ∞, ≤, ≥, ≈, ×, ÷, →, ², ³, ₁, ₂, etc. directly inside "text" strings. Use "mono":true for alignment if drawing equations.

NEVER WRITE LaTeX/TeX MARKUP ON THE BOARD. There is no math typesetting engine — the canvas draws "text" strings literally, character for character, so any LaTeX syntax appears as raw garbled text (e.g. "\(\frac{d}{dx}\)" would be painted exactly like that, backslashes and all). This means:
- NEVER use \( \), \[ \], $ $, or $$ $$ delimiters.
- NEVER use \frac{a}{b} — instead write it inline as "a/b" or "a ÷ b".
- NEVER use \cdot, \pm, \sqrt{}, \lim_{}, \sum_{}, ^{...}, _{...}, or any other backslash/brace TeX commands.
- Instead use the real Unicode symbols and characters directly: write x² not x^{2}, write x₁ not x_{1}, write √(x) not \sqrt{x}, write × or · not \cdot, write ± not \pm, write lim (h→0) not \lim_{h\to0}, write Σ not \sum.
- Example — WRONG: "f'(x)=lim_{h→0}\frac{f(x+h)-f(x)}{h}"
  Example — CORRECT: "f'(x) = lim (h→0) [f(x+h) − f(x)] / h"
- Example — WRONG: "FV = 1000(1+0.1)^{2}"
  Example — CORRECT: "FV = 1000(1 + 0.1)²"
This rule applies to every "text" command, including headings, definitions, and worked equations — plain readable notation only, exactly like natural handwriting on a real whiteboard.

Available command types:
- {"type":"text","x":..,"y":..,"text":"...","size":26,"color":"ink|ochre|sage|brick|teal|violet|sky|coral","mono":false,"weight":700,"maxWidth":800,"heading":false} — set "heading":true ONLY for a section/topic title (e.g. "2. The Friedman-Phelps Critique"). The app automatically underlines heading text and inserts a blank ruled line above it, so DO NOT manually add a blank line or a "---"/underscore divider before a heading yourself — just set "heading":true and let the app handle the spacing and underline. Use a larger "size" (e.g. 32-40) for headings too, but "heading":true is what actually triggers the underline and spacing, not the size alone.
- {"type":"halo","x":..,"y":..,"r":50,"color":"halo|ochre|sage|teal|violet|sky|coral"}
- {"type":"line","x1":..,"y1":..,"x2":..,"y2":..,"color":"ink","width":2.5}
- {"type":"arrow","x1":..,"y1":..,"x2":..,"y2":..,"color":"ochre","width":2.5}
- {"type":"rect","x":..,"y":..,"w":..,"h":..,"color":"ink","fill":false}
- {"type":"circle","x":..,"y":..,"rx":..,"ry":..,"color":"ink","fill":false}
- {"type":"curve","points":[[x,y],[x,y],...],"color":"sage","width":2.5,"fill":false,"fillColor":"sage","fillOpacity":0.12} — a smooth freehand curve through the points; set "fill":true to also tint the interior (treated as a closed loop) for a soft rounded blob like a petal or organelle.
- {"type":"path","segments":[["M",x,y],["L",x,y],["Q",cx,cy,x,y],["C",c1x,c1y,c2x,c2y,x,y],["Z"]],"color":"sage","width":2.5,"fill":false,"fillColor":"sage","fillOpacity":0.12} — a general freeform outline, like an SVG path: "M" moves the pen (start a new sub-shape), "L" a straight segment, "Q" a quadratic curve (one control point), "C" a cubic curve (two control points), "Z" closes the current outline back to its last "M". THIS is the tool for drawing actual recognizable pictures — a cell and its organelles, a leaf, an animal, an organ, a map — by tracing the outline as a sequence of segments the way you'd sketch it by hand, then optionally filling it.
- {"type":"axes","x":..,"y":..,"w":..,"h":..,"xlabel":"...","ylabel":"...","title":"...","grid":true,"xTicks":[...],"yTicks":[...]}
- {"type":"plot","x":..,"y":..,"w":..,"h":..,"xRange":[0,10],"yRange":[0,10],"xlabel":"...","ylabel":"...","title":"...","grid":true,"xTicks":["0","2","4","6","8","10"],"yTicks":["0","5","10"],"curves":[{"points":[[dataX,dataY],...],"color":"brick","width":2.75,"label":"SRPC"}]}
- {"type":"image","query":"specific, image-searchable description, e.g. 'human heart anatomy diagram' or 'map of Europe 1914'","caption":"short caption shown under the image (optional)","alt":"brief plain-text description used only if no image can be found (optional)"} — fetches a REAL photo/diagram from Wikimedia Commons and places it on the board like a pasted-in textbook figure. ALWAYS use this instead of hand-drawing with "path"/"circle"/"curve" for anything representational: anatomy, organisms, cells, maps, historical figures/events, real objects, landmarks, flags, instruments, machinery, artwork, etc. Make "query" specific and literal (what you'd type into an image search), not a vague topic name. Reserve "path"/"circle"/"curve" ONLY for abstract conceptual sketches that could never correspond to a real photographable/diagrammable thing (e.g. an invented illustrative shape for a made-up example). Math/economics/statistics graphs still ALWAYS use "plot", never "image".

NEVER WRITE A BRACKETED PLACEHOLDER FOR A DIAGRAM AS "text" — e.g. never write a "text" command whose content is something like "[Diagram showing X, Y, Z]" or "[Image of ...]" or "[Figure: ...]". That placeholder style is BANNED. Every single time you would be tempted to write that kind of bracketed description, use an actual {"type":"image","query":"..."} command instead — the app will genuinely fetch and place a real picture there. A bracket placeholder is never an acceptable substitute for a real "image" command.
  Example — WRONG: {"type":"text","text":"[Diagram showing plant cell wall, plasma membrane, nucleus, chloroplasts]"}
  Example — CORRECT: {"type":"image","query":"labeled plant cell diagram organelles","caption":"Plant cell structure"}
- {"type":"highlight","x":..,"y":..,"w":..,"h":26,"color":"ochre"}

LISTS OF LINE ITEMS (financial statements, ledgers, tables of labeled values, any "Label ... $ amount" style list):
- EVERY line item is its OWN separate "text" command on its OWN "y" row. NEVER put two or more line items inside a single "text" string — even if they'd technically fit on one visual line. One label-and-value pair per command, always.
- DO NOT set "maxWidth" on a line-item's "text" command (or set it wide enough that the line can never wrap). A wrapped line item is what causes the next item to visually run onto the same row as the one before it — this must never happen. If a label is long, shrink "size" slightly or shorten the label text; do not let it wrap.
- Build the dotted leader and amount yourself as part of the same string in a consistent style, e.g. "Cash and cash equivalents ......... $ 40,000", with roughly the same total line width across every item in that list (pad the dots so amounts visually line up down the page, the way a real balance sheet aligns its numbers in a column).
- Give every line item the same left "x" (its label always starts at the same horizontal position as the other items in that list), and space consecutive rows with a consistent "y" gap — never overlap rows or bunch several rows onto one baseline.
- A sub-total or total line ("Total Current Assets", "Total Liabilities", etc.) is also its own single "text" command, typically in "ochre" or "brick" for emphasis, on its own row, with a small blank gap above it to set it apart from the items it sums.
- This rule applies any time you're writing a structured list of named values — balance sheets, income statements, cash-flow statements, price lists, comparison tables — not just accounting examples.

REPRESENTATIONAL DIAGRAMS AND PICTURES (cells, leaves, animals, organs, maps, historical figures, real objects, anything you'd normally look up rather than invent):
- ALWAYS use an "image" command for these. Do NOT hand-draw them out of "path"/"circle"/"curve" primitives — a real photo or textbook diagram is always better than a hand sketch, so prefer fetching one every time a topic calls for this kind of visual.
- Write a specific, literal "query" (what you'd actually type into an image search) — e.g. "mitochondria structure diagram", "Amazon rainforest canopy", "Isaac Newton portrait" — not a vague single word.
- Give it a short "caption" naming what it shows, exactly like you'd caption a figure in a textbook.
- The "image" command occupies its own vertical slot on the board like a "plot" does — give it a normal "text" heading above it introducing what it is, just like you would for a graph.
- Only fall back to hand-drawn "path"/"circle"/"curve" primitives for a genuinely invented/abstract illustrative shape that has no real-world counterpart to photograph (rare) — never for anything that corresponds to a real object, organism, place, or person.

PACING RULES:
- Teach in SUBSTANTIAL, CONTINUOUS chunks: a full turn should read like several minutes of real lecture — cover a complete idea in depth (its definition, why it matters, a worked example, and its key sub-points), not one lonely sentence. Write MUCH more per turn than feels natural for a "small step" — aim for a long, dense block of "board" content (many "text" commands in a row covering multiple paragraphs, sub-points, and worked equations) so the notes keep growing continuously down the page, the way a real lecturer fills page after page without pausing every few seconds.
- Only stop and check in with a question once you've actually finished teaching a full coherent topic or sub-topic — not after a single definition or step. Do not artificially cut a turn short.
- Keep going onto the NEXT related idea in the same turn if it naturally continues the same topic, rather than stopping just because you covered "one thing" already.

"speech" AND "board" MUST STAY IN LOCKSTEP — THIS IS CRITICAL:
- "speech" is what the teacher is SAYING OUT LOUD *while writing exactly this content on the board*, not a separate, richer, more detailed narration. Never let "speech" cover ideas, examples, sub-points, or elaboration that never actually appear as "text" on the board — if you say it, you must also write a corresponding line for it, and vice versa.
- Build "speech" by walking through your "text" commands in order and speaking each one's content in natural spoken phrasing (numbers/symbols read aloud, not a verbatim character-for-character read, but the same substance, same amount of material, same order) — not a freer lecture that wanders beyond what's written.
- Do NOT pad "speech" with extra spoken-only framing, verbal asides, or additional worked detail "for context" that has no matching board content. If a full turn's worth of board content would only take a short time to say, "speech" should also be that short — length of "speech" tracks length of "board", it does not run ahead of it.
- If you want to say more, write more on the board first — add the corresponding "text"/"image"/"plot" commands for it, THEN speak it. Never the reverse.`;

let conversationHistory = [];
let aiBrain = 'auto';
const PROXY_URL = "https://api.takundamambudzi02.workers.dev";

  aiBrain = e.target.value;

async function callAuto(){
  setStatus('trying Groq…');
  let result = await callGroq();
  if(result.ok) return result;

  setStatus('Groq unavailable, trying Gemini…');
  result = await callGemini();
  if(result.ok) return result;

  setStatus('Gemini unavailable, trying OpenRouter…');
  result = await callOpenRouter();

async function callTutor(userMessage){
  setStatus('thinking…');
  const contextParts = [];
  if(pdfText && !conversationHistory.some(m => m.content.includes(`SOURCE DOCUMENT (${pdfFileName})`))){
    contextParts.push(`SOURCE DOCUMENT (${pdfFileName}), extracted text:\n${pdfText.slice(0,15000)}`);
  }
  contextParts.push(userMessage);
  const fullUserContent = contextParts.join('\n\n---\n\n');
  conversationHistory.push({role:'user', content: fullUserContent});

  let result;
  if(aiBrain === 'auto') result = await callAuto();
  else if(aiBrain === 'groq') result = await callGroq();
  else if(aiBrain === 'openrouter') result = await callOpenRouter();
  else if(aiBrain === 'cerebras') result = await callCerebras();
  else result = await callGemini();

  if(!result.ok){
    conversationHistory.pop();
    setStatus(result.status || 'error — see console');
    return { speech: result.errorSpeech, board: [] };
  }

  try{
    const parsed = JSON.parse(result.raw);
    conversationHistory.push({role:'assistant', content: result.raw});
    setStatus('idle');
    return parsed;
  } catch(jsonErr){
    console.error('Model output was not valid JSON. Raw text:', result.raw);
    setStatus('malformed JSON — see console');
    conversationHistory.pop();
    return { speech:"The lecture content came back malformed. Check the console to see exactly what came back.", board:[] };
  }
}

async function callGroq(){
  if(PROXY_URL.includes('YOUR-WORKER-SUBDOMAIN')){
    return { ok:false, status:'proxy not configured', errorSpeech:"The AI proxy hasn't been set up yet." };
  }
  let response, data;
  try{
    response = await fetch(`${PROXY_URL}/groq`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"openai/gpt-oss-120b",
        response_format:{ type:"json_object" },
        max_tokens:6000,
        messages: [
          { role:"system", content: SYSTEM_PROMPT },
          ...conversationHistory
        ]
      })
    });
  } catch(networkErr){
    console.error('Network failure calling proxy (Groq):', networkErr);
    return { ok:false, status:'network error', errorSpeech:"The request never reached the proxy." };
  }

  try{ data = await response.json(); }
  catch(parseErr){
    return { ok:false, status:'bad response', errorSpeech:"The proxy responded with invalid JSON." };
  }

  if(!response.ok){
    const msg = (data && data.error && data.error.message) ? data.error.message : JSON.stringify(data);
    return { ok:false, status:`API error ${response.status}`, errorSpeech:`Groq returned an error: ${msg}` };
  }

  const choice = data.choices && data.choices[0];
  const raw = choice && choice.message && choice.message.content;
  if(!raw){
    return { ok:false, status:'unexpected response', errorSpeech:"Groq response shape was unexpected." };
  }
  return { ok:true, raw: raw.trim() };
}

async function runTeachingTurn(userMessage, displayText){
  addTranscriptMsg('user', displayText !== undefined ? displayText : userMessage);
  await document.fonts.ready;
  const result = await callTutor(userMessage);
  if(result.board && result.board.length){
    result.board = await resolveImageCommands(upgradePlaceholderTextCommands(result.board));
    // Every board command gets a stable id the first time it exists, before
    // it's ever drawn — this is what speechSegments[].boardRefs points at,
    // and what survives scrolling/highlighting/session save+reload.
    result.board.forEach(cmd => { if(!cmd.id) cmd.id = nextBlockId(); });
    // Match the pace of the pen to the pace of the voice: estimate how long
    // this turn's speech will take, compare it to how long the handwriting
    // would naturally take, and scale the writing speed so both roughly
    // start and finish together instead of drifting apart.
    if(result.speech){
      const naturalDuration = result.board.reduce((sum, cmd) => sum + estimateDuration({...cmd}) / pacingScale, 0);
      const speechDuration = estimateSpeechDuration(result.speech);
      pacingScale = naturalDuration > 0 ? clamp(speechDuration / naturalDuration, 0.5, 3.5) : 1;
    } else {
      pacingScale = 1;
    }
    enqueueCommandsAtCursor(result.board);
  }
  // Set up this turn's speech -> board alignment BEFORE speaking, so the
  // very first chunk already knows what it's pointing at.
  currentTurnBoardCommands = result.board || [];
  currentTurnBreakpoints = buildSpeechBoardAlignment(result.speech, result.speechSegments);
  clearBoardFocus();
  if(result.speech){ addTranscriptMsg('tutor', result.speech); speak(result.speech); }
  if(result.quiz) addQuizCard(result.quiz);
  autoSaveSession();
}

function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

// Safety net: some models occasionally ignore the instruction and write a
// bracketed placeholder like "[Diagram showing X, Y, Z]" as plain text
// instead of using a real "image" command. Catch that pattern and convert
// it into an actual image fetch so the placeholder never survives to the
// board even if the model slips up.
const DIAGRAM_PLACEHOLDER_RE = /^\s*\[\s*(?:diagram|image|figure|photo|picture|illustration)\b[^\]]*\]\s*$/i;

function extractPlaceholderQuery(text){
  const inner = text.replace(/^\s*\[\s*/, '').replace(/\s*\]\s*$/, '');
  return inner.replace(/^(diagram|image|figure|photo|picture|illustration)\s*(showing|of|:)?\s*/i, '').trim() || inner;
}

function upgradePlaceholderTextCommands(commands){
  return commands.map(cmd => {
    if(cmd.type === 'text' && typeof cmd.text === 'string' && DIAGRAM_PLACEHOLDER_RE.test(cmd.text)){
      return { type: 'image', query: extractPlaceholderQuery(cmd.text), alt: cmd.text, id: cmd.id };
    }
    return cmd;
  });
}

// ---------- Fetching real diagrams/photos from Wikimedia Commons ----------
// Wikimedia's API is CORS-open (via origin=*) so this calls it directly from
// the browser — no proxy/API key needed. We prefer a real photo/diagram over
// hand-drawing anything representational (anatomy, maps, historical figures,
// real objects); math/graphs/geometric constructions still get drawn.
const IMAGE_BOARD_WIDTH = 640;
const IMAGE_MIN_HEIGHT = 260;
const IMAGE_MAX_HEIGHT = 620;

async function searchWikimediaImage(query){
  const searchUrl = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent('filetype:bitmap|drawing ' + query)}&gsrnamespace=6&gsrlimit=6&prop=imageinfo&iiprop=url|size|extmetadata&format=json&origin=*`;
  const res = await fetch(searchUrl);
  if(!res.ok) throw new Error('Wikimedia search failed: ' + res.status);
  const data = await res.json();
  const pages = data && data.query && data.query.pages;
  if(!pages) return null;
  const candidates = Object.values(pages)
    .map(p => p.imageinfo && p.imageinfo[0])
    .filter(info => info && info.url && /\.(png|jpe?g|gif|svg)$/i.test(info.url) && info.width >= 200);
  if(!candidates.length) return null;
  candidates.sort((a,b) => (b.width||0) - (a.width||0));
  const best = candidates[0];
  let credit = 'Wikimedia Commons';
  try{
    const artist = best.extmetadata && best.extmetadata.Artist && best.extmetadata.Artist.value;
    if(artist) credit = 'Wikimedia Commons — ' + artist.replace(/<[^>]+>/g, '').trim();
  }catch(e){}
  return { url: best.url, width: best.width, height: best.height, credit };
}

function preloadImage(url){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('image failed to load'));
    img.src = url;
  });
}

// Turns each {type:'image', query, caption?, alt?} command into either a
// ready-to-draw image command (with its real aspect ratio and a preloaded
// <img>) or, if nothing usable was found, a plain text fallback so the
// board still makes sense instead of silently dropping the topic.
async function resolveImageCommands(commands){
  const resolved = [];
  for(const original of commands){
    if(original.type !== 'image'){ resolved.push(original); continue; }
    const cmd = { ...original };
    try{
      const found = await searchWikimediaImage(cmd.query || cmd.caption || cmd.alt || '');
      if(!found) throw new Error('no results');
      const img = await preloadImage(found.url);
      const aspect = found.height / found.width;
      cmd.w = IMAGE_BOARD_WIDTH;
      cmd.h = clamp(Math.round(IMAGE_BOARD_WIDTH * aspect), IMAGE_MIN_HEIGHT, IMAGE_MAX_HEIGHT);
      cmd._img = img;
      cmd._attribution = found.credit;
      resolved.push(cmd);
    }catch(err){
      console.warn('Image fetch failed for query "' + cmd.query + '":', err);
      resolved.push({
        type: 'text',
        text: '[' + (cmd.alt || cmd.caption || ('Diagram: ' + (cmd.query || ''))) + ']',
        size: 22,
        color: 'ink',
        weight: 400,
        id: cmd.id
      });
    }
  }
  return resolved;
}

/* =========================================================
   SESSION PERSISTENCE
   ========================================================= */
let currentSessionId = 'session_' + Date.now();
let currentSessionTitle = null;

function transcriptToHtmlSnapshot(){ return transcriptEl.innerHTML; }

async function saveSession(promptForName){
  try{
    let title = currentSessionTitle;
    if(promptForName || !title){
      title = prompt('Name this session:', title || (pdfFileName ? pdfFileName.replace(/\.pdf$/i,'') : 'Untitled session'));
      if(title===null) return;
      currentSessionTitle = title || 'Untitled session';
    }
    await persistSession();
    setStatus('session saved');
  } catch(err){ console.error('Save failed:', err); setStatus('save failed — see console'); }
}

async function persistSession(){
  const payload = {
    id: currentSessionId,
    title: currentSessionTitle || (pdfFileName ? pdfFileName.replace(/\.pdf$/i,'') : 'Untitled session'),
    savedAt: Date.now(),
    pdfFileName, pdfText: pdfText ? pdfText.slice(0,15000) : '',
    conversationHistory, drawnCommands, camera,
    globalCursorY, currentTopicLabel,
    transcriptHtml: transcriptToHtmlSnapshot()
  };
  await window.storage.set('session:' + currentSessionId, JSON.stringify(payload), false);
  refreshSessionList();
}

function autoSaveSession(){ if(conversationHistory.length>0) persistSession().catch(e=>console.error('Autosave failed:',e)); }

async function refreshSessionList(){
  const listEl = document.getElementById('session-list');
  try{
    const result = await window.storage.list('session:', false);
    const keys = (result && result.keys) ? result.keys : [];
    if(keys.length===0){ listEl.innerHTML = '<div class="empty-note">No saved sessions yet.</div>'; return; }
    const items = [];
    for(const key of keys){
      try{ const rec = await window.storage.get(key, false); if(rec) items.push(JSON.parse(rec.value)); } catch(e){}
    }
    items.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
    listEl.innerHTML = '';
    items.forEach(item=>{
      const div = document.createElement('div'); div.className='session-item';
      const date = new Date(item.savedAt);
      div.innerHTML = `<span class="s-name">${escapeHtml(item.title||'Untitled')}</span><span class="s-date">${date.toLocaleDateString()}</span>`;
      div.addEventListener('click', ()=> loadSession(item));
      listEl.appendChild(div);
    });
  } catch(err){ console.error('Listing sessions failed:', err); listEl.innerHTML = '<div class="empty-note">Could not load saved sessions.</div>'; }
}

function resetUploadZoneUI(){
  uploadZone.classList.remove('has-file');
  uploadZone.innerHTML = `Drop a PDF, or click to import a chapter, slide deck or notes.<input type="file" id="pdf-input" accept="application/pdf">`;
  document.getElementById('pdf-input').addEventListener('change', (e)=>{ if(e.target.files.length) handlePdfFile(e.target.files[0]); });
}

function loadSession(item){
  currentSessionId = item.id; currentSessionTitle = item.title;
  pdfFileName = item.pdfFileName || ''; pdfText = item.pdfText || '';
  conversationHistory = item.conversationHistory || [];
  drawnCommands = item.drawnCommands || [];
  if(item.camera) Object.assign(camera, item.camera);
  if(item.globalCursorY !== undefined) globalCursorY = item.globalCursorY;
  else if(item.regionCursor) globalCursorY = Math.max(item.regionCursor.notes, item.regionCursor.graph, item.regionCursor.detail);
  else globalCursorY = TOP_MARGIN;
  
  currentTopicLabel = item.currentTopicLabel || 'Topic';
  transcriptEl.innerHTML = item.transcriptHtml || '<div class="empty-note">No transcript in this session.</div>';
  if(pdfFileName){
    uploadZone.classList.add('has-file');
    uploadZone.innerHTML = `<div class="file-name">📄 ${escapeHtml(pdfFileName)}</div><div class="file-meta">restored from saved session</div>`;
  } else { resetUploadZoneUI(); }
  checkIfScrolledAway();
  redrawAll();
  setStatus('session loaded');
  closePanel();
}

document.getElementById('btn-save').addEventListener('click', ()=> saveSession(true));
document.getElementById('btn-new-session').addEventListener('click', ()=>{
  currentSessionId = 'session_' + Date.now(); currentSessionTitle = null;
  pdfText=''; pdfFileName='';
  conversationHistory=[]; drawQueue=[]; drawnCommands=[];
  camera.x=500; camera.scale=1;
  resetRegionCursors(); currentTopicLabel='Topic';
  clearBoard();
  blockIdCounter = 0;
  currentTurnBoardCommands = []; currentTurnBreakpoints = null;
  transcriptEl.innerHTML = '<div class="empty-note">Your lecture transcript and quiz questions will appear here as we go.</div>';
  resetUploadZoneUI();
  setStatus('new session');
});

/* =========================================================
   SIDE PANEL TOGGLES
   ========================================================= */
const sidePanel = document.getElementById('side-panel');
const overlay = document.getElementById('overlay');
function openPanel(){ sidePanel.classList.add('open'); overlay.classList.add('open'); }
function closePanel(){ sidePanel.classList.remove('open'); overlay.classList.remove('open'); }
document.getElementById('btn-menu').addEventListener('click', openPanel);
document.getElementById('btn-panel-close').addEventListener('click', closePanel);
overlay.addEventListener('click', closePanel);
document.getElementById('btn-toggle-transcript').addEventListener('click', openPanel);

/* =========================================================
   WIRE UP CONTROLS
   ========================================================= */
document.getElementById('btn-teach').addEventListener('click', ()=>{
  const val = document.getElementById('topic-input').value.trim();
  if(!val) return;
  if(conversationHistory.length === 0) currentTopicLabel = val.length > 60 ? val.slice(0,57)+'…' : val;
  runTeachingTurn(val);
  document.getElementById('topic-input').value = '';
  closePanel();
});
document.getElementById('btn-quiz').addEventListener('click', ()=>{
  const val = document.getElementById('topic-input').value.trim();
  const prompt = val ? `Please quiz me on: ${val}` : (pdfText ? `Please quiz me on the uploaded document.` : `Please quiz me on the most recent topic we discussed.`);
  runTeachingTurn(prompt);
  closePanel();
});
function handleAsk(text){
  if(!text || !text.trim()) return;
  runTeachingTurn(text.trim());
  document.getElementById('ask-input').value = '';
}
document.getElementById('btn-ask').addEventListener('click', ()=> handleAsk(document.getElementById('ask-input').value));
document.getElementById('ask-input').addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleAsk(e.target.value); });

// Attach File Button Wiring
const btnAttach = document.getElementById('btn-attach');
const askFileInput = document.getElementById('ask-file-input');
if(btnAttach && askFileInput) {
    btnAttach.addEventListener('click', () => askFileInput.click());
    askFileInput.addEventListener('change', (e) => {
        if(e.target.files.length) {
            handlePdfFile(e.target.files[0]);
            document.getElementById('ask-input').placeholder = `Attached: ${e.target.files[0].name}. Ask about it...`;
        }
    });
}

/* =========================================================
   INIT
   ========================================================= */
document.getElementById('voice-select').addEventListener('change', ()=>{
  if(currentUtteranceText) speak(currentUtteranceText);
});

checkIfScrolledAway();
setStatus('idle');
refreshSessionList();
<\/script>

</body>

</script>

<div class="ambient-halo"></div>

<div class="wrap">

<script>
const pdfjsAvailable = typeof pdfjsLib !== 'undefined';
if(pdfjsAvailable){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}
let pdfText = '', pdfFileName = '';
const uploadZone = document.getElementById('upload-zone');
const pdfInput = document.getElementById('pdf-input');
const btnSummarize = document.getElementById('btn-summarize');
const statusLine = document.getElementById('status-line');
function setStatus(s){ statusLine.textContent = s || ''; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

uploadZone.addEventListener('click', ()=> pdfInput.click());
uploadZone.addEventListener('dragover', (e)=> e.preventDefault());
uploadZone.addEventListener('drop', (e)=>{ e.preventDefault(); if(e.dataTransfer.files.length) handlePdfFile(e.dataTransfer.files[0]); });
pdfInput.addEventListener('change', (e)=>{ if(e.target.files.length) handlePdfFile(e.target.files[0]); });

async function handlePdfFile(file){
  if(!pdfjsAvailable){ alert("PDF import couldn't load its engine. Try reloading the page."); return; }
  if(file.type !== 'application/pdf'){ alert('Please choose a PDF file.'); return; }
  setStatus('reading pdf…');
  pdfFileName = file.name;
  try{
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
    let fullText = '';
    const maxPages = Math.min(pdf.numPages, 60);
    for(let i=1;i<=maxPages;i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      fullText += `\n\n[Page ${i}]\n` + content.items.map(it=>it.str).join(' ');
    }
    pdfText = fullText;
    uploadZone.classList.add('has-file');
    uploadZone.innerHTML = `<div class="file-name">📄 ${escapeHtml(pdfFileName)}</div><div class="file-meta">${pdf.numPages} page${pdf.numPages===1?'':'s'} · text extracted${pdf.numPages>60 ? ' (first 60 pages)' : ''}</div>`;
    btnSummarize.disabled = false;
    setStatus('ready to summarize');
  } catch(err){
    console.error('Failed to read PDF:', err);
    setStatus('could not read this pdf — see console');
  }
}

const PROXY_URL = "https://api.takundamambudzi02.workers.dev";

function lengthInstruction(mode){
  if(mode === 'brief') return "Keep it short: a handful of the most important bullet points only, no sections, under 150 words.";
  if(mode === 'detailed') return "Be thorough: cover every section of the source in real depth, with sub-points and examples where the source has them. It's fine for this to be long.";
  return "Aim for a well-organized overview: a few clear sections with headings, each with 3-6 bullet points covering the important content.";
}

async function summarizeText(text, mode){
  if(PROXY_URL.includes('YOUR-WORKER-SUBDOMAIN')){
    return { ok:false, error:"The AI proxy hasn't been set up yet." };
  }

  const system = `You are a study-notes summarizer. You are given the extracted text of a PDF (a chapter, slide deck, or notes) and must produce a summary of it for a student reviewing before an exam.

Output format: plain HTML fragment only using: <h3>, <p>, <ul>/<li>, <strong>.

${lengthInstruction(mode)}`;

  const userMsg = `Extracted PDF text (file: ${pdfFileName}):\n\n${text.slice(0, 60000)}`;

  let response, data;
  try{
    response = await fetch(`${PROXY_URL}/gemini`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        system_instruction: { parts: [{ text: system }] },
        contents: [{ role:"user", parts:[{ text: userMsg }] }],
        generationConfig: { maxOutputTokens: 3000 }
      })
    });
  } catch(networkErr){
    return { ok:false, error:"The request never reached the proxy." };
  }

  try{ data = await response.json(); }
  catch(parseErr){
    return { ok:false, error:"The server responded, but not with valid JSON." };
  }

  if(!response.ok){
    const msg = (data && data.error && data.error.message) ? data.error.message : JSON.stringify(data);
    return { ok:false, error:`The model returned an error: ${msg}` };
  }

  const candidate = data.candidates && data.candidates[0];
  const part = candidate && candidate.content && candidate.content.parts && candidate.content.parts[0];
  if(!part || !part.text){
    return { ok:false, error:"The response came back in an unexpected shape." };
  }
  return { ok:true, html: part.text.trim().replace(/^```html\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'') };
}

const outputWrap = document.getElementById('output-wrap');
const summaryPanel = document.getElementById('summary-panel');
const outputTitle = document.getElementById('output-title');

btnSummarize.addEventListener('click', async ()=>{
  if(!pdfText){ setStatus('upload a pdf first'); return; }
  const mode = document.getElementById('length-select').value;
  btnSummarize.disabled = true;
  setStatus('reading and summarizing…');
  const result = await summarizeText(pdfText, mode);
  btnSummarize.disabled = false;
  if(!result.ok){
    setStatus(result.error);
    return;
  }
  outputTitle.textContent = `Summary — ${pdfFileName.replace(/\.pdf$/i,'')}`;
  summaryPanel.innerHTML = result.html;
  outputWrap.classList.remove('in');
  outputWrap.classList.add('show');
  setStatus('done');
  outputWrap.scrollIntoView({behavior:'smooth', block:'start'});
  requestAnimationFrame(()=> requestAnimationFrame(()=> outputWrap.classList.add('in')));
});

document.getElementById('btn-copy').addEventListener('click', ()=>{
  const text = summaryPanel.innerText;
  navigator.clipboard.writeText(text).then(()=> setStatus('summary copied')).catch(()=> setStatus('copy failed'));
});

document.getElementById('btn-download').addEventListener('click', ()=>{
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const margin = 48;
    const maxWidth = 595 - margin*2;
    let y = margin;
    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text(outputTitle.textContent, margin, y); y += 26;

    const nodes = summaryPanel.children.length ? Array.from(summaryPanel.children) : [summaryPanel];
    nodes.forEach(node=>{
      const tag = node.tagName ? node.tagName.toLowerCase() : 'p';
      if(tag === 'h3'){
        doc.setFont('helvetica','bold'); doc.setFontSize(13);
        if(y > 760){ doc.addPage(); y = margin; }
        y += 10;
        const lines = doc.splitTextToSize(node.textContent, maxWidth);
        doc.text(lines, margin, y); y += lines.length*16 + 4;
      } else if(tag === 'ul'){
        doc.setFont('helvetica','normal'); doc.setFontSize(11);
        Array.from(node.children).forEach(li=>{
          const lines = doc.splitTextToSize('•  ' + li.textContent, maxWidth);
          if(y + lines.length*14 > 780){ doc.addPage(); y = margin; }
          doc.text(lines, margin, y); y += lines.length*14 + 2;
        });
        y += 6;
      } else {
        doc.setFont('helvetica','normal'); doc.setFontSize(11);
        const lines = doc.splitTextToSize(node.textContent, maxWidth);
        if(y + lines.length*14 > 780){ doc.addPage(); y = margin; }
        doc.text(lines, margin, y); y += lines.length*14 + 8;
      }
    });

    doc.save((pdfFileName ? pdfFileName.replace(/\.pdf$/i,'') : 'summary') + ' - summary.pdf');
    setStatus('pdf downloaded');
  } catch(err){
    console.error('PDF export failed:', err);
    setStatus('pdf export failed — see console');
  }
});
<\/script>

</body>
</html>
</script>

<script>
function unwrap(id){
  return document.getElementById(id).textContent.replace(/<\\\/script/gi, '</script');
}
const frames = {
  home: document.getElementById('frame-home'),
  tutor: document.getElementById('frame-tutor'),
  summary: document.getElementById('frame-summary')
};
const loaded = { home:false, tutor:false, summary:false };
const backBtn = document.getElementById('back-btn');
let current = 'home';

function ensureLoaded(page){
  if(loaded[page]) return;
  frames[page].srcdoc = unwrap('src-' + page);
  loaded[page] = true;
}

function navTo(page, pushHistory){
  if(!frames[page]) page = 'home';
  ensureLoaded(page);
  Object.keys(frames).forEach(k => frames[k].classList.toggle('active', k === page));
  backBtn.classList.toggle('show', page !== 'home');
  current = page;
  if(pushHistory !== false){
    history.pushState({page}, '', '#' + page);
  }
}

window.addEventListener('message', (e)=>{
  const d = e.data;
  if(d && d.nav) navTo(d.nav, true);
});

window.addEventListener('popstate', (e)=>{
  const page = (e.state && e.state.page) || (location.hash ? location.hash.slice(1) : 'home');
  navTo(page, false);
});

const initial = location.hash ? location.hash.slice(1) : 'home';
history.replaceState({page: initial}, '', '#' + initial);
navTo(initial, false);

// Preload the other two pages in the background once the initial page
// is up, so switching tabs later is a pure crossfade with nothing to build.
window.addEventListener('load', ()=>{
  setTimeout(()=>{
    Object.keys(frames).forEach(page=>{
      if(page !== current) ensureLoaded(page);
    });
  }, 400);
});
</script>

</body>
</html>
