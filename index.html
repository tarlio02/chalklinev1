// Holds {mimeType, base64} for an image attached to the message currently
// being sent — only read by callGemini() for that one turn, then cleared.
let currentTurnImage = null;

// AI backend selection is now fully automatic, restricted to Gemini and
// Groq only (Apinex removed from the rotation). One of the two is picked
// at random as the PRIMARY engine for this page load — no manual picker,
// no persisted preference — and the other automatically becomes the
// fallback if the primary is down or rate-limited.
let selectedAiBackend = Math.random() < 0.5 ? 'gemini' : 'groq';

const ENGINES = {
  gemini: { name: 'Gemini', call: () => callGemini() },
  groq:   { name: 'Groq', call: () => callGroq() }
};

function getBackendChain(){
  const primary = ENGINES[selectedAiBackend] || ENGINES.gemini;
  const rest = Object.keys(ENGINES).filter(k => ENGINES[k] !== primary).map(k => ENGINES[k]);
  return [primary, ...rest];
}

// Records exactly what happened with each AI backend on the most recent
// turn, so it can be inspected without a dev console (tap the status
// chip top-right — see showBackendDebug() below). This is the only way
// to see backend errors on iPad/mobile Safari, which has no console UI.
let lastBackendDebug = [];

function showBackendDebug(){
  if(!lastBackendDebug.length){
    alert("No AI backend calls recorded yet this session.");
    return;
  }
  const lines = lastBackendDebug.map(r => `${r.name}: ${r.ok ? 'OK ✓' : '✗ ' + r.status}${r.detail ? '\n   → ' + r.detail : ''}`);
  alert("Last AI backend attempt(s):\n\n" + lines.join('\n\n'));
}

// Groq's free/on-demand tier caps requests at a fairly small tokens-per-minute
// budget (as low as 8000 TPM). The full system prompt plus an unbounded,
// ever-growing conversation history plus a large max_tokens request together
// blow straight through that on any session that's gone on for more than a
// couple of turns — this is what an "API error 413 / request too large"
// from Groq means. Keep only a recent window of turns for the API call
// itself (the on-screen transcript/history the user sees is untouched —
// this only affects what gets resent to the model).
function recentHistoryForApi(maxTurns){
  const MAX_TURNS = maxTurns || 10; // ~5 user+assistant exchanges by default
  if(conversationHistory.length <= MAX_TURNS) return conversationHistory;
  return conversationHistory.slice(-MAX_TURNS);
}

async function callTutor(userMessage, imageAttachment){
  setStatus('thinking…');
  lastBackendDebug = [];
  const contextParts = [];
  if(pdfText && conversationHistory.length===0){
    contextParts.push(`SOURCE DOCUMENT (${pdfFileName}), extracted text:\n${pdfText.slice(0,6000)}`);
  }
  contextParts.push(userMessage);
  const fullUserContent = contextParts.join('\n\n---\n\n');
  conversationHistory.push({role:'user', content: fullUserContent});
  currentTurnImage = imageAttachment || null;

  let result = null;
  const backendChain = getBackendChain();
  for(const engine of backendChain){
    setStatus(backendChain.indexOf(engine)===0 ? 'thinking…' : `thinking… (trying ${engine.name})`);
    try{
      result = await engine.call();
    } catch(e){
      console.error(`${engine.name} threw unexpectedly:`, e);
      result = { ok:false, status:`${engine.name} error`, errorSpeech:`${engine.name} failed unexpectedly.` };
    }
    lastBackendDebug.push({ name: engine.name, ok: result.ok, status: result.status || '', detail: result.errorSpeech || '' });
    if(result.ok) break;
    console.warn(`${engine.name} failed, falling back to the next AI backend:`, result.status);
  }
  currentTurnImage = null;

  if(!result.ok){
    conversationHistory.pop();
    setStatus(result.status || 'error — tap for details');
    console.error('All AI backends failed. Last error:', result.status, result.errorSpeech);
    return { speech: "Sorry, the AI tutor isn't available right now. Please try again in a moment.", board: [] };
  }

  try{
    const parsed = JSON.parse(result.raw);
    conversationHistory.push({role:'assistant', content: result.raw});
    setStatus('idle');
    return parsed;
  } catch(jsonErr){
    console.error('Model output was not valid JSON. Raw text:', result.raw);
    setStatus('malformed JSON — see console');
    conversationHistory.pop();
    return { speech:"The lecture content came back malformed. Check the console to see exactly what came back.", board:[] };
  }
}

// A condensed version of SYSTEM_PROMPT used ONLY for Groq. Groq's free/
// on-demand tier caps requests at as low as 8000 tokens-per-minute, and the
// full SYSTEM_PROMPT alone is close to 9,500 tokens — meaning every single
// Groq call failed with "413 request too large" regardless of how short
// history/pdf context were trimmed, since the fixed prompt cost already
// exceeded the ceiling before anything else was added. This trimmed prompt
// (~1,500 tokens) keeps every rule that affects output correctness/quality
// but cuts repeated worked examples and verbose prose. Gemini and Apinex
// keep the full SYSTEM_PROMPT since their limits are far higher.
const SYSTEM_PROMPT_GROQ = `You are an expert university lecturer operating a notebook whiteboard tutoring tool called Chalkline. Teach at genuine university level: rigorous, precise, no hand-waving.

TONE: be warm and encouraging, not a stiff textbook. When the student is right (a quiz answer or a correct response), react with genuine specific praise before moving on — "Yes, exactly right!", "You nailed that.", "Good job." Vary the phrasing, don't repeat the same line every time. When they're wrong, stay encouraging rather than deflating — acknowledge what they got right if anything, gently correct the mistake, move on. This is tone/wording in "speech" only — it never loosens rigor or correctness of the content.

Respond with ONLY a JSON object (no markdown fences, no outside prose):
{
  "speech": "spoken explanation, natural TTS language (spell out symbols e.g. 'delta' not the character)",
  "board": [ ...drawing command objects... ],
  "quiz": null OR { "question":"...", "options":["...","...","...","..."], "correctIndex": <put the correct option's index in a genuinely random position across your quizzes, 0-3 — do NOT default to 0 or always place the right answer first>, "explanation":"..." },
  "needsLookup": null OR "a short search query",
  "pointTo": null OR [ {"word":"...", "occurrence":1}, ... ]
}
Set "needsLookup" ONLY when you need a current fact/stat/date you're unsure of; keep board/speech minimal that turn. Leave null almost always.
Set "pointTo" ONLY when referring back to a word already written on the board earlier (not new content this turn) — an ordered list of exact words (copied exactly as written) to highlight in sequence while "speech" plays, e.g. re-explaining something the student asked about again. Add "occurrence":2 if you mean the 2nd time that word appears. Leave null for ordinary turns; never redraw the same content in "board" when using pointTo.

LAYOUT: For a diagram (path/curve/circle/rect/line/arrow/halo/highlight), use a small self-contained local coordinate box near (0,0) (e.g. x:0-300,y:0-300) — the app auto-places the whole block on the page. Emit ALL of one diagram's shapes as one unbroken run in "board" (heading text before, then all shapes+labels together, then resume normal text after). Any text labeling a diagram PART must have "diagramLabel":true with local coords so it moves with the diagram.

MATH: use real unicode symbols directly in text (π θ β Δ Σ ∫ √ ∞ ≤ ≥ ≈ × ÷ → ² ³). NEVER output LaTeX/TeX (\frac, \cdot, $ $, \sqrt{}, ^{}, _{}) — the canvas prints strings literally. Write x² not x^{2}, a/b not \frac{a}{b}.

COMMAND TYPES:
- {"type":"text","x":..,"y":..,"text":"...","size":26,"color":"ink|sage|sky","mono":false,"weight":700,"maxWidth":800,"heading":false,"diagramLabel":false} — plain body text color MUST be "ink" (default/majority), "sage" (short sub-heading lead-in), or "sky" (heading:true only). diagramLabel text is exempt and may use any color. heading:true only for a section title (app auto-underlines it; don't add your own divider). Body size 24-28, diagramLabel size 18-20, heading size 32-36. Any diagramLabel inside a table cell MUST also set "maxWidth" to that cell's inner width (columnWidth − 2×padding) — required safety net against text spilling past the grid line.
- {"type":"halo","x":..,"y":..,"r":50,"color":"halo|ochre|sage|teal|violet|sky|coral"}
- {"type":"line","x1":..,"y1":..,"x2":..,"y2":..,"color":"ink","width":2.5,"dash":false}
- {"type":"arrow","x1":..,"y1":..,"x2":..,"y2":..,"color":"ochre","width":2.5,"dash":false}
- {"type":"rect","x":..,"y":..,"w":..,"h":..,"color":"ink","fill":false,"dash":false}
- {"type":"circle","x":..,"y":..,"rx":..,"ry":..,"color":"ink","fill":false,"dash":false}
- {"type":"curve","points":[[x,y],...],"color":"sage","width":2.5,"fill":false,"fillColor":"sage","fillOpacity":0.12} — smooth curve through points, fill:true tints interior as a closed loop.
- {"type":"path","segments":[["M",x,y],["L",x,y],["Q",cx,cy,x,y],["C",c1x,c1y,c2x,c2y,x,y],["Z"]],"color":"sage","width":2.5,"fill":false,"fillColor":"sage","fillOpacity":0.12} — freeform outline for real pictures (cells, leaves, organs, maps): trace like a hand sketch, optionally fill.
- {"type":"polygon","points":[[x,y],...],"color":"ink","width":2.5,"fill":false,"fillColor":"ink","fillOpacity":0.10} — CLOSED straight-edge shape (auto-closes), for anything with flat sides/exact corners.
- {"type":"polyline","points":[[x,y],...],"color":"ink","width":2.5,"dash":false} — like polygon but OPEN.
- {"type":"axes","x":..,"y":..,"w":..,"h":..,"xlabel":"...","ylabel":"...","title":"...","grid":true,"xTicks":[...],"yTicks":[...]}
- {"type":"plot","x":..,"y":..,"w":..,"h":..,"xRange":[0,10],"yRange":[0,10],"xlabel":"...","ylabel":"...","title":"...","grid":true,"xTicks":[...],"yTicks":[...],"curves":[{"points":[[x,y],...],"color":"brick","width":2.75,"label":"..."}]}
- {"type":"highlight","x":..,"y":..,"w":..,"h":26,"color":"ochre"}
Any shape accepts "dash":true for reference/equilibrium/hidden lines only — not everything.

GRAPH PRECISION STANDARD — every "plot"/"axes" diagram (not just economics) must read as a precise, university-level figure: work out each curve's real shape first (linear gets exactly 2 points for a dead-straight line; a genuinely curved function gets 8-15 points sampled along the real curve, not a faceted guess). Pick xRange/yRange so curves and any marked point sit well inside the box (middle 60-80%), never clipped at an edge — and double check every point you give a curve actually falls inside the xRange/yRange you chose; a point outside that range draws outside the axes box, which must never happen.

MARKING AN INTERSECTION POINT (equilibrium, break-even, optimum, root), INCLUDING ITS DASHED GUIDE-LINES — YOU ARE THE FALLBACK MODEL, SO USE THE SIMPLE METHOD, NOT A COORDINATE CONVERSION: do not attempt the localX/localY plot-to-pixel conversion formula, and do not build dashed guide-lines as separate "line" shapes with your own hand-placed x/y — getting that arithmetic right in one shot is exactly the kind of multi-step precision task you are less reliable at, and a wrong conversion sends the mark, its guide-lines, and its label somewhere off the actual plot, disconnected from the graph. Instead, do it all in the plot's own data coordinate system, which the renderer scales automatically: (1) solve for the intersection's exact DATA coordinates (Qe, Pe) algebraically; (2) include that point as the LAST point of both curves' own "points" arrays (they already cross there); (3) for the dashed drop-lines, add two MORE CURVES to the SAME "plot" (not separate "line" shapes), given directly in data coordinates: {"points":[[Qe,yRange[0]],[Qe,Pe]],"color":"ink","width":1.5,"dash":true} and {"points":[[xRange[0],Pe],[Qe,Pe]],"color":"ink","width":1.5,"dash":true} — no "label" on these, they're guide-lines, not named curves; (4) set "xTicks"/"yTicks" to include Qe/Pe. This gives you the real textbook look with zero risk of a coordinate error and no separate circle/arrow group needed. Only add a diagramLabel/arrow at the intersection if you are confident in the plot.x/y/w/h → pixel conversion; if in any doubt, skip a separate label/arrow entirely — the curves+ticks above already mark it precisely on their own.

MARKING ANY OTHER REGION OR VALUE ON A PLOT (a surplus/shortage gap, a shaded area, a tax wedge, a distance between two curves, ANYTHING that needs to visually line up with a "plot" you already drew) — SAME RULE, EVEN STRICTER: do NOT build this as a separate group of "line"/"arrow"/"circle" shapes placed at your own guessed x/y coordinates below or beside the plot. A second, independently-coordinated shape group can only ever line up with the plot by luck — in practice it lands disconnected, floating in empty space, which is a worse result than not drawing it at all. You have exactly two safe options: (1) express it using data already in the plot itself — e.g. for a surplus/shortage gap between Supply and Demand at a given price, add that price as a THIRD 2-point curve (a flat horizontal line "points":[[xMin,P],[xMax,P]]) so it's visible directly on the existing axes, using the plot's own xRange/yRange automatically — needs no separate coordinate guess at all; OR (2) if a callout truly cannot be expressed inside the plot, describe it in words in the "speech"/"text" for this turn instead of drawing a disconnected shape group. Never emit a standalone bracket/arrow/dashed-line cluster meant to annotate a plot from outside it — if you cannot anchor it using the plot's own curves/ticks, don't draw it.

SUPPLY & DEMAND / ECONOMICS GRAPHS: apply the standard above. One "plot" command, exactly two curves of 2 points each (dead straight lines) — Supply sloping up, Demand sloping down, crossing in the middle third of the box, e.g. "curves":[{"points":[[xMin,lowP],[xMax,highP]],"color":"sage","label":"Supply"},{"points":[[xMin,highP],[xMax,lowP]],"color":"brick","label":"Demand"}]. Solve for the exact equilibrium (Qe,Pe) where they cross, and set xTicks to include Qe and yTicks to include Pe. Per the MARKING AN INTERSECTION POINT rule above, that's enough on its own to call out equilibrium precisely — do not attempt the circle/dashed-line/arrow annotation group unless you are fully confident in the plot.x/y/w/h conversion; a clean two-line plot with equilibrium visible at the crossing and echoed on the ticks is the safe, reliable version of this diagram for you specifically. Never put "Supply"/"Demand"/"Equilibrium" in separate paragraph text commands — only in curve labels.

TABLES/GRIDS/MATRICES: build as one diagram (rect for outer border + line for each row/column divider), size to fit content, size a header row/col slightly larger and bold. Size each column from its own actual widest entry (chars × size × 0.62 + generous padding), never a shared guess across columns. EVERY cell's content (headers and body) must be a "diagramLabel":true text with x/y placed exactly inside that cell AND "maxWidth" set to that column's inner width (columnWidth − 2×padding) — this is required on every single cell, no exceptions, and it's the app's safety net that shrinks the text slightly if your width estimate was a bit tight, so it never visually spills past the grid line. Emit all of this in the SAME unbroken run as the grid lines — NEVER draw an empty grid then list the contents afterward as plain sequential text, that produces a disconnected list below the table which is a total failure. NO DUPLICATE ROWS/LABELS EVER: plan the exact row list once, emit each row exactly once. A multi-column layout (e.g. Assets | Liabilities | Equity) can have different row counts per column — leave short columns' extra cells blank rather than repeating rows to fill space.
CRITICAL TABLE SIZING RULE: every cell's text MUST fit on ONE line at its given "size" — never let a cell's text wrap or run tall enough to spill into the row below. To guarantee this: (a) keep cell content SHORT — a word or a tight 2-4 word phrase, NEVER a full sentence or clause with semicolons/multiple facts crammed in (e.g. write "Aerobic respiration" not "Aerobic respiration; produces ATP; controls gene expression"); if a concept needs more than ~4 words, split it into two separate table rows instead of cramming it into one cell; (b) make each row's height at least 1.7× the text "size" (e.g. size 18 text needs row height ≥32px) so there's clear vertical breathing room even with tall glyphs; (c) before finalizing, check the widest word in a column against that column's width (~word length × size × 0.62) and widen the column if it's close — never let text run past its cell's right boundary into the next column. A table where every row is short, single-line, and generously spaced beats a denser one that overlaps.

NO-OVERLAP: before emitting a diagram, mentally check every text/label's bounding box (~chars×size×0.62 wide, size×1.3 tall) doesn't collide with another text or a shape it's not meant to sit on. Stagger close labels, keep labels outside the shape they name (leader arrow pointing in), keep row/col text inside its grid cell, keep paragraph text within "maxWidth". When unsure, add more spacing or split into two smaller diagrams — never cram.

DRAWING SCOPE — YOU ARE THE FALLBACK MODEL, GEMINI HANDLES MOST TURNS: stick to structured, geometric board content you can execute reliably — tables/grids, "axes"/"plot" graphs, payoff matrices, truth tables, simple labeled rect/circle/line diagrams, flowcharts. AVOID attempting freeform organic illustrations (a realistic cell, an animal, an organ, a leaf, anything needing "path"/"curve" hand-sketch outlines with shading) — if the turn calls for one of those, draw a simpler labeled-shape version instead (basic circles/rects with labels) rather than a detailed illustration, since that detailed style is unreliable for you specifically. Tables, plots, and axes are where you should put your effort and detail.
NEVER use "arrow"/"diagramLabel" as a pointer callout aimed at a piece of plain text, a formula, or a sentence you already wrote (e.g. an arrow labeled "b" floating near the word "b" in "ax²+bx+c=0"). Arrows and diagramLabels exist ONLY to name a part of an actual drawn shape (a rect, circle, curve, plot, or table) that is present in the SAME unbroken diagram run — never a bare arrow pointing at ordinary sentence text with nothing else drawn. If you need to explain what a coefficient or term in a formula means, just say it in a normal "text" line (e.g. "b determines the axis of symmetry") — do not draw anything for it.

PACING: teach ONE small idea per turn (one definition/sub-step/small piece of an example) — never a whole topic at once, unless the one idea IS a complex diagram (then its full detail is appropriate). After that one idea, ALWAYS stop and check in — mandatory every turn — either via "quiz", or by ending "speech" with a direct question (vary between "does that make sense?", "any questions?", "should we move on or stay here?"). Never end on a flat statement with no question. Wait for the reply before continuing.

SPEECH/BOARD SYNC: "speech" and "board" must describe the same single piece of content for this turn — nothing narrated that isn't on the board, nothing on the board speech never mentions. For a complex diagram, summarize it in speech rather than narrating every shape.`;

async function callGroq(){
  if(PROXY_URL.includes('YOUR-WORKER-SUBDOMAIN')){
    return { ok:false, status:'proxy not configured', errorSpeech:"The AI proxy hasn't been set up yet." };
  }
  let response, data;
  try{
    response = await fetch(`${PROXY_URL}/groq`, {
      method:"POST",
      headers:Object.assign({"Content-Type":"application/json"}, chalklineAuthHeaders()),
      body: JSON.stringify({
        model:"openai/gpt-oss-120b",
        response_format:{ type:"json_object" },
        max_tokens:4000,
        messages: [
          { role:"system", content: SYSTEM_PROMPT_GROQ },
          ...recentHistoryForApi(4)
        ]
      })
    });
  } catch(networkErr){
    console.error('Network failure calling proxy (Groq):', networkErr);
    return { ok:false, status:'network error', errorSpeech:"The request never reached the proxy." };
  }

  try{ data = await response.json(); }
  catch(parseErr){
    return { ok:false, status:'bad response', errorSpeech:"The proxy responded with invalid JSON." };
  }

  if(!response.ok){
    const msg = (data && data.error && data.error.message) ? data.error.message : JSON.stringify(data);
    return { ok:false, status:`API error ${response.status}`, errorSpeech:`Groq returned an error: ${msg}` };
  }

  const choice = data.choices && data.choices[0];
  const raw = choice && choice.message && choice.message.content;
  if(!raw){
    return { ok:false, status:'unexpected response', errorSpeech:"Groq response shape was unexpected." };
  }
  return { ok:true, raw: raw.trim() };
}

async function callGemini(){
  if(PROXY_URL.includes('YOUR-WORKER-SUBDOMAIN')){
    return { ok:false, status:'proxy not configured', errorSpeech:"The AI proxy hasn't been set up yet." };
  }
  const geminiContents = conversationHistory.map((m,idx) => {
    const parts = [{ text: m.content }];
    // Only the newest user turn can carry real image bytes — earlier
    // turns keep just the "[Attached image: ...]" text note already
    // folded into their content.
    if(idx === conversationHistory.length-1 && currentTurnImage){
      parts.push({ inline_data: { mime_type: currentTurnImage.mimeType, data: currentTurnImage.base64 } });
    }
    return { role: m.role === 'assistant' ? 'model' : 'user', parts };
  });

  let response, data;
  try{
    response = await fetch(`${PROXY_URL}/gemini`, {
      method:"POST",
      headers:Object.assign({"Content-Type":"application/json"}, chalklineAuthHeaders()),
      body: JSON.stringify({
        system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: geminiContents,
        generationConfig: {
          response_mime_type: "application/json",
          maxOutputTokens: 14000,
          thinkingConfig: { thinkingLevel: "low" }
        }
      })
    });
  } catch(networkErr){
    console.error('Network failure calling proxy (Gemini):', networkErr);
    return { ok:false, status:'network error', errorSpeech:"The request never reached the proxy." };
  }

  try{ data = await response.json(); }
  catch(parseErr){
    return { ok:false, status:'bad response', errorSpeech:"Gemini server responded with invalid JSON." };
  }

  if(!response.ok){
    const msg = (data && data.error && data.error.message) ? data.error.message : JSON.stringify(data);
    return { ok:false, status:`API error ${response.status}`, errorSpeech:`Gemini returned an error: ${msg}` };
  }

  const candidate = data.candidates && data.candidates[0];
  const part = candidate && candidate.content && candidate.content.parts && candidate.content.parts[0];
  const raw = part && part.text;
  if(!raw){
    return { ok:false, status:'unexpected response', errorSpeech:"Gemini response came back in an unexpected shape." };
  }
  return { ok:true, raw: raw.trim() };
}

// Safety net for the "always check in" pacing rule in SYSTEM_PROMPT. The
// prompt already instructs the model to end every non-quiz turn with a
// question — but that's one instruction buried deep in a long prompt, and
// over a long session the model can quietly stop following it (this is
// exactly what got reported: the AI stopped asking follow-ups). Rather
// than trust the prompt alone, enforce it deterministically here: if the
// model didn't attach a quiz AND its speech doesn't already end on a
// question, append a short, rotating check-in question ourselves so the
// pacing behavior can't silently degrade.
const FALLBACK_CHECKINS = [
  "Does that make sense so far?",
  "Any questions on this before we continue?",
  "Want me to go over that again, or should we move on?",
  "How does that land — clear, or should I slow down?",
  "Ready to keep going, or want a moment on this part first?"
];
let fallbackCheckinIdx = 0;
function ensureEngagementCheckin(speech){
  const trimmed = (speech || '').trim();
  if(!trimmed) return trimmed;
  // Already ends on a question — a real "?" is the reliable signal here
  // since the model is instructed to vary its phrasing, not use fixed text.
  if(/\?\s*$/.test(trimmed)) return trimmed;
  const q = FALLBACK_CHECKINS[fallbackCheckinIdx % FALLBACK_CHECKINS.length];
  fallbackCheckinIdx++;
  return trimmed + ' ' + q;
}

async function runTeachingTurn(userMessage, displayText, imageAttachment){
  if(displayText !== null) addTranscriptMsg('user', displayText !== undefined ? displayText : userMessage);
  // Guarantee the handwriting webfonts are fully loaded BEFORE any text is
  // measured for layout. Without this, the very first turn's line-wrap
  // calculation can run against fallback system-font metrics (if the
  // custom fonts haven't finished downloading yet), while the actual
  // canvas paint moments later uses the real, differently-sized font —
  // so the reserved vertical space is wrong and the next block overlaps
  // the one before it. Awaiting here costs nothing once fonts are cached.
  await document.fonts.ready;
  const result = await callTutor(userMessage, imageAttachment);
  // Match the board animation's total length to how long the speech for
  // this turn will take, so the pen finishes writing roughly when the
  // voice finishes talking instead of racing ahead or trailing behind.
  const boardCmds = (result.board && result.board.length) ? result.board : [];
  const totalBaseMs = boardCmds.reduce((sum,c)=> sum + baseDurationFor(c), 0);
  const speechMs = estimateSpeechDurationMs(result.speech || '');
  drawPaceScale = totalBaseMs > 0 ? Math.min(2.5, Math.max(0.6, speechMs / totalBaseMs)) : 1;
  if(boardCmds.length){ dismissQuizCard(); enqueueCommandsAtCursor(boardCmds); }
  const finalSpeech = result.quiz ? result.speech : ensureEngagementCheckin(result.speech);
  if(finalSpeech){ addTranscriptMsg('tutor', finalSpeech); speak(finalSpeech); }
  if(result.quiz) addQuizCard(result.quiz);
  // "pointTo" refers back to words already on the board (see prompt) —
  // run it after any new board content this turn so a freshly-written
  // word is actually findable, timed against this turn's own speech so
  // the highlight sequence tracks roughly with the narration.
  if(result.pointTo && result.pointTo.length){
    runPointToSequence(result.pointTo, speechMs);
  }
  autoSaveSession();
}

// Pulls the distinct subject/course names already saved (for whoever is
// currently signed in, or this browser's guest bucket) so a new lesson
// can be dropped into an existing folder instead of always starting a
// fresh one — e.g. a second "Managerial Accounting" lesson lands in the
// same Previous Tutorials folder as the first.
async function loadExistingSubjects(){
  try{
    const result = await window.storage.list(sessionKeyPrefix(), false);
    const keys = (result && result.keys) ? result.keys : [];
    const seen = new Map(); // subject -> most recent savedAt, for ordering
    for(const key of keys){
      try{
        const rec = await window.storage.get(key, false);
        if(!rec) continue;
        const item = JSON.parse(rec.value);
        const subj = (item.subject || '').trim();
        if(!subj || subj === 'Unsorted') continue;
        const savedAt = item.savedAt || 0;
        if(!seen.has(subj) || seen.get(subj) < savedAt) seen.set(subj, savedAt);
      } catch(e){}
    }
    return Array.from(seen.entries()).sort((a,b)=> b[1]-a[1]).map(([subj])=>subj);
  } catch(e){ console.error('Could not load existing subjects:', e); return []; }
}

async function populateSubjectChips(){
  const subjects = await loadExistingSubjects();
  if(subjects.length===0){ subjectExisting.style.display = 'none'; subjectChipRow.innerHTML=''; return; }
  subjectExisting.style.display = 'block';
  subjectChipRow.innerHTML = '';
  subjects.forEach(subj=>{
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'sm-chip';
    chip.textContent = subj;
    chip.addEventListener('click', ()=>{
      subjectInput.value = subj;
      subjectChipRow.querySelectorAll('.sm-chip').forEach(c=> c.classList.remove('selected'));
      chip.classList.add('selected');
      subjectInput.focus();
    });
    subjectChipRow.appendChild(chip);
  });
}

function openSubjectModal(){
  subjectInput.value = '';
  subjectModal.classList.add('open');
  subjectExisting.style.display = 'none';
  subjectChipRow.innerHTML = '';
  populateSubjectChips();
  setTimeout(()=> subjectInput.focus(), 50);
}
function closeSubjectModal(){ subjectModal.classList.remove('open'); }

function confirmSubject(){
  const val = subjectInput.value.trim();
  if(val) currentSubject = val;
  closeSubjectModal();
  // No save here — an empty lesson (subject picked, nothing taught yet)
  // shouldn't create a session entry. The first real exchange with the
  // AI (autoSaveSession, called from runTeachingTurn) is what actually
  // persists it, keyed to this subject.
  refreshSessionList();
}

});

let pendingNavTarget = 'home';
function goHomeNow(){

  pendingNavTarget = 'home';
}

// Clicking Home mid-lesson shouldn't silently save (or silently lose)
// whatever's on the board — ask. Nothing to ask about if the board is
// still blank (no conversation yet), so just leave in that case. If a
// topic has already been named (typed into the topic/subject modal, or
// picked up from the conversation), there's nothing left to name here —
// just confirm leaving vs continuing, without asking for a title again.
function handleHomeClick(){
  if(conversationHistory.length === 0){
    goHomeNow();
    return;
  }
  const topicKnown = currentTopicLabel && currentTopicLabel !== 'Topic';
  if(topicKnown){
    document.getElementById('leave-confirm-title').textContent = `Leave "${currentTopicLabel}"?`;
    leaveConfirmModal.classList.add('open');

  leaveNameInput.value = currentSessionTitle || fallback || '';
  leaveModal.classList.add('open');
  setTimeout(()=> leaveNameInput.focus(), 50);

// Ask for a subject the first time this tab lands on a brand-new,
// never-saved lesson. If the shell tells us (via postMessage) to open
// a specific saved session instead — e.g. from the Previous Tutorials
// page — wait briefly for that message and load it rather than
// prompting for a new subject.
let pendingSessionLoad = false;
// A course-name preset from the Home dashboard ("Start new lesson" inside
// a course) means the course is already named — but we still ask what
// specific topic to study under it, via the topic-only modal below.
let presetSubjectFromShell = null;
let pendingPresetSubject = false;
// If the shell's loadSessionId message arrives before we've heard back
// from applyAuthState (currentUser still null — sessionKeyPrefix() would
// throw), queue the id here instead of loading immediately. applyAuthState
// drains this queue itself once signed-in state is confirmed, so a slow
// or out-of-order auth broadcast can no longer cause the load to fail and
// silently fall back to openSubjectModal() (which is what made a refresh
// occasionally look like it "forgot" the session and reset the camera).
let queuedShellSessionId = null;
window.addEventListener('message', (e)=>{
  const d = e.data;
  // Entering the tutor (fresh, preset course, or resuming a saved lesson) always
  // shows the sidebar open on tablet/desktop — even if this frame was reused.
  if(d && (d.loadSessionId || d.presetSubject) && window.innerWidth > 700 && typeof openPanel === 'function'){
    try{ openPanel(); }catch(e){}
  }
  if(d && d.loadSessionId){
    pendingSessionLoad = true;
    if(currentUser) loadSessionById(d.loadSessionId);
    else queuedShellSessionId = d.loadSessionId;
  }
  if(d && d.presetSubject){
    pendingPresetSubject = true;
    presetSubjectFromShell = d.presetSubject;
    currentSubject = d.presetSubject;
  }
});
setTimeout(()=>{
  if(pendingSessionLoad) return;
  if(pendingPresetSubject) openTopicModal(presetSubjectFromShell);
  else openSubjectModal();
}, 260);

async function loadSessionById(id){
  if(!currentUser){ queuedShellSessionId = id; return; }
  try{
    const rec = await window.storage.get(sessionKeyPrefix() + id, false);
    if(rec) loadSession(JSON.parse(rec.value));
    else openSubjectModal();
  } catch(e){ console.error('Could not load requested session:', e); openSubjectModal(); }
}

// --- Google sign-in --------------------------------------------------
// The real Google Identity script runs one level up, in the top-level
// shell page — this tutor page is loaded via iframe .srcdoc, and a
// srcdoc document reports its origin as "null", which Google's script
// refuses to authenticate from (Error 400: invalid_request, origin=
// null). So this page doesn't call Google's API directly: it asks the
// shell to sign in/out, and reflects whatever state the shell reports.

let currentUser = null; // {sub, email, name, picture} once signed in

// Sessions are namespaced by account so switching browsers/devices
// still finds the same saved work — PROVIDED persistSession/
// refreshSessionList are pointed at a real backend keyed by this same
// prefix instead of window.storage (see note on persistSession below).
// There is deliberately no signed-out ('local') bucket: persistSession
// and refreshSessionList both refuse to touch storage at all unless
// currentUser is set, so guest work is never written anywhere durable.
function sessionKeyPrefix(){
  return 'session:' + currentUser.sub + ':';
}

// Remembers which session is currently open, per signed-in account. The
// authoritative copy lives in the SHELL's localStorage (see the nav script
// at the bottom of the page) because this page itself is a srcdoc iframe
// re-created from scratch on every load — it has no stable URL for its own
// storage to durably survive a refresh against. This iframe only reports
// the active session up to the shell; it never reads a remembered id back
// out of its own storage (a same-origin/null-origin iframe storage read
// here was previously getting stale data from the *previous* srcdoc
// instance and silently reopening the last lesson instead of starting a
// new one — see queuedShellSessionId above for the correct resume path).
function rememberActiveSession(){
  if(!currentUser) return;
  try{ parent.postMessage({ chalklineActiveSession:true, page:'tutor', sub: currentUser.sub, id: currentSessionId }, '*'); }
  catch(e){}
}
function forgetActiveSession(){
  try{ parent.postMessage({ chalklineActiveSession:true, page:'tutor', cleared:true }, '*'); } catch(e){}
}

function resetTutorBoardState(){
  currentSessionId = 'session_' + Date.now(); currentSessionTitle = null; currentSubject = '';
  sessionQuizCount = 0;
  pdfText=''; pdfFileName='';
  conversationHistory=[]; drawQueue=[]; drawnCommands=[];
  camera.x=500; camera.scale=1;
  resetRegionCursors(); currentTopicLabel='Topic';
  clearBoard();
  dismissQuizCard();
  transcriptEl.innerHTML = '<div class="empty-note">Your lecture transcript and quiz questions will appear here as we go.</div>';
  resetUploadZoneUI();
  forgetActiveSession();
  refreshSessionList();
}

function applyAuthState(signedIn, user){
  // Whatever session is on screen belongs to whichever account was
  // previously signed in (or to this browser as a guest). If the
  // account identity actually changes — signing out, or a different
  // account signing in — that on-screen content must not carry over,
  // or the next viewer (including a signed-out visitor) would still
  // see it even though it was never re-fetched from storage.
  const prevSub = currentUser ? currentUser.sub : null;
  const newUser = signedIn ? user : null;
  const newSub = newUser ? newUser.sub : null;
  const accountChanged = prevSub !== null && prevSub !== newSub;
  const isFirstAuthReport = !authStateKnown;
  authStateKnown = true;

  currentUser = newUser;
  syncBoardWelcome();
  document.getElementById('account-signed-out').style.display = signedIn ? 'none' : 'block';
  document.getElementById('account-signed-in').style.display = signedIn ? 'block' : 'none';
  if(signedIn){
    document.getElementById('account-avatar').src = user.picture || '';
    document.getElementById('account-name').textContent = user.name || user.email || 'Signed in';
  }
  if(accountChanged){
    resetTutorBoardState();
    setStatus(signedIn ? 'switched account — showing a blank board' : 'signed out — showing a blank board');
  }
  // On the very first auth report after this page loaded (e.g. right
  // after a browser refresh), the shell may have already told us — via
  // postMessage — which session to resume, but that message can arrive
  // before we knew who was signed in (loadSessionById queues it in
  // queuedShellSessionId in that case rather than failing). Now that
  // sign-in is confirmed, drain that queue.
  if(isFirstAuthReport && signedIn && queuedShellSessionId){
    const id = queuedShellSessionId;
    queuedShellSessionId = null;
    loadSessionById(id);
  }
  // TODO: once a backend exists, this is where you'd fetch/merge that
  // user's saved sessions instead of just relighting the local list.
  refreshSessionList();
}

let authStateKnown = false;
window.addEventListener('message', (e)=>{
  const d = e.data;
  if(!d || !d.chalklineAuth) return;
  applyAuthState(!!d.signedIn, d.user);
});

document.getElementById('google-signin-btn').innerHTML =
  '<a class="link-btn" href="#" onclick="parent.postMessage({requestLogin:true},\'*\');return false;">Sign in with Google</a>';

document.getElementById('btn-sign-out').addEventListener('click', ()=>{
  parent.postMessage({ requestSignOut: true }, '*');
});

function transcriptToHtmlSnapshot(){ return transcriptEl.innerHTML; }

async function persistSession(){
  // Guest (signed-out) work must never survive as durable, sharable
  // storage — otherwise closing and reopening the site (or a different
  // visitor on the same browser) would still see it, even though no
  // account owns it. Only persist once someone is actually signed in;
  // signed-out use stays purely in-memory for the current page life.
  if(!currentUser) return;
  // Prefer an explicit title the person set (via Save > name it), then
  // fall back to what was actually discussed with the AI — the first
  // "teach this" topic, captured in currentTopicLabel — before falling
  // further back to the uploaded file name or a generic label. This
  // means a session saved via autosave (never explicitly named) still
  // shows up in the list as e.g. "Price elasticity of demand" instead
  // of a meaningless "Untitled session".
  const derivedTitle = currentTopicLabel && currentTopicLabel !== 'Topic'
    ? currentTopicLabel
    : (pdfFileName ? pdfFileName.replace(/\.pdf$/i,'') : 'Untitled session');
  const payload = {
    id: currentSessionId,
    title: currentSessionTitle || derivedTitle,
    subject: currentSubject || 'Unsorted',
    savedAt: Date.now(),
    quizCount: sessionQuizCount,
    pdfFileName, pdfText: pdfText ? pdfText.slice(0,15000) : '',
    conversationHistory, drawnCommands, camera,
    globalCursorY, currentTopicLabel,
    transcriptHtml: transcriptToHtmlSnapshot()
  };
  // NOTE: window.storage only exists inside a Claude.ai artifact preview.
  // On your own deployed domain this call will fail, signed in or not —
  // swap it for a fetch() to a real backend endpoint (e.g. a route on
  // your Cloudflare Worker backed by KV or D1), sending currentUser's
  // verified identity so sessions are actually saved per-account.
  await window.storage.set(sessionKeyPrefix() + currentSessionId, JSON.stringify(payload), false);
  rememberActiveSession();
  refreshSessionList();
}

function autoSaveSession(){ if(conversationHistory.length>0) persistSession().catch(e=>console.error('Autosave failed:',e)); }

// Belt-and-braces autosave for exits mid-turn: catches switching tabs,
// navigating to another Chalkline page, or closing the browser, so
// content already produced is never lost even if the person leaves
// before the next AI turn would have triggered autoSaveSession().
// Guarded the same way as autoSaveSession — a subject was picked but
// nothing was actually taught yet is still a blank canvas and shouldn't
// leave behind a session entry.
function flushSaveOnExit(){
  if(conversationHistory.length>0){
    persistSession().catch(e=>console.error('Exit-time save failed:', e));
  }
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'hidden') flushSaveOnExit(); });
window.addEventListener('pagehide', flushSaveOnExit);
window.addEventListener('beforeunload', flushSaveOnExit);

let sessionListReq = 0;
async function deleteSession(id, ev){
  if(ev) ev.stopPropagation();
  if(!confirm('Delete this saved session? This can\'t be undone.')) return;
  try{
    await window.storage.delete(sessionKeyPrefix() + id, false);
    if(id === currentSessionId) resetTutorBoardState();
    refreshSessionList();
  } catch(e){ console.error('Delete session failed:', e); setStatus('delete failed — see console'); }
}
async function refreshSessionList(){
  const myReq = ++sessionListReq;
  const listEl = document.getElementById('session-list');
  const labelEl = document.getElementById('session-toggle-label');
  // Keep the "This course" banner in sync with currentSubject everywhere
  // it can change (new/loaded session, subject modal, preset from a
  // Dashboard course card, sign-in/out) — this is the one function all
  // of those already call afterward.
  const courseNameEl = document.getElementById('course-name-display');
  if(courseNameEl) courseNameEl.textContent = currentSubject || 'No course selected yet';
  if(!currentUser){
    // Nothing is ever saved while signed out (see persistSession), so
    // there is nothing real to list — and we must not fall back to a
    // shared 'local' bucket that could show a previous guest's work.
    listEl.innerHTML = '<div class="empty-hint">Sign in to save sessions and see them here.</div>';
    if(labelEl) labelEl.textContent = 'Lessons';
    return;
  }
  try{
    const result = await window.storage.list(sessionKeyPrefix(), false);
    if(myReq !== sessionListReq) return; // superseded by a newer auth state
    const keys = (result && result.keys) ? result.keys : [];
    const items = [];
    for(const key of keys){
      try{ const rec = await window.storage.get(key, false); if(rec) items.push(JSON.parse(rec.value)); } catch(e){}
    }
    if(myReq !== sessionListReq) return;
    // Only show sessions that belong to the subject/course currently
    // being worked in — not every saved lesson across every subject.
    // With no subject picked yet (e.g. right after "new"), fall back to
    // showing the unsorted/no-subject sessions instead of everything.
    const filtered = currentSubject
      ? items.filter(item => (item.subject || 'Unsorted') === currentSubject)
      : items.filter(item => !item.subject || item.subject === 'Unsorted');
    labelEl.textContent = (currentSubject || 'Lessons') + (filtered.length ? ` (${filtered.length})` : '');
    if(filtered.length===0){
      listEl.innerHTML = `<div class="empty-note">No saved sessions yet${currentSubject ? ' in ' + escapeHtml(currentSubject) : ''}.</div>`;
      return;
    }
    filtered.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
    listEl.innerHTML = '';
    filtered.forEach(item=>{
      const div = document.createElement('div'); div.className='session-item';
      const date = new Date(item.savedAt);
      div.innerHTML = `<span class="s-name">${escapeHtml(item.title||'Untitled')}</span><span class="s-date">${date.toLocaleDateString()}</span><button type="button" class="s-delete" title="Delete">✕</button>`;
      div.addEventListener('click', ()=> loadSession(item));
      div.querySelector('.s-delete').addEventListener('click', (ev)=> deleteSession(item.id, ev));
      listEl.appendChild(div);
    });
  } catch(err){ console.error('Listing sessions failed:', err); listEl.innerHTML = '<div class="empty-note">Could not load saved sessions.</div>'; }
}

const sessionToggleBtn = document.getElementById('btn-session-toggle');
sessionToggleBtn.addEventListener('click', ()=>{
  sessionToggleBtn.classList.toggle('open');
  document.getElementById('session-list').classList.toggle('open');
});

function resetUploadZoneUI(){
  uploadZone.classList.remove('has-file');
  uploadZone.innerHTML = `Drop a PDF, or click to import a chapter, slide deck or notes.<input type="file" id="pdf-input" accept="application/pdf">`;
  document.getElementById('pdf-input').addEventListener('change', (e)=>{ if(e.target.files.length) handlePdfFile(e.target.files[0]); });
}

function loadSession(item){
  dismissQuizCard();
  currentSessionId = item.id; currentSessionTitle = item.title;
  currentSubject = item.subject && item.subject!=='Unsorted' ? item.subject : '';
  sessionQuizCount = item.quizCount || 0;
  pdfFileName = item.pdfFileName || ''; pdfText = item.pdfText || '';
  conversationHistory = item.conversationHistory || [];
  drawnCommands = item.drawnCommands || [];
  // Only x/scale are meaningful camera fields now (see camera model
  // notes above) — an old save's camera.y, if present, is simply
  // ignored rather than restored, since there's no pan position left
  // to restore it into; scroll position is restored separately below.
  if(item.camera){ if(item.camera.x !== undefined) camera.x = item.camera.x; if(item.camera.scale !== undefined) camera.scale = item.camera.scale; }
  if(item.globalCursorY !== undefined) globalCursorY = item.globalCursorY;
  else if(item.regionCursor) globalCursorY = Math.max(item.regionCursor.notes, item.regionCursor.graph, item.regionCursor.detail);
  else globalCursorY = TOP_MARGIN;
  
  currentTopicLabel = item.currentTopicLabel || 'Topic';
  transcriptEl.innerHTML = item.transcriptHtml || '<div class="empty-note">No transcript in this session.</div>';
  if(pdfFileName){
    uploadZone.classList.add('has-file');
    uploadZone.innerHTML = `<div class="file-name">📄 ${escapeHtml(pdfFileName)}</div><div class="file-meta">restored from saved session</div>`;
  } else { resetUploadZoneUI(); }
  // Restored sessions resume with the camera wherever the pen last was,
  // not forced back to the top — only a brand-new session
  // (resetRegionCursors) jumps to camera.y=0. Matches the live
  // page-then-follow model: if the saved session never made it past
  // page 1, stay at the top (page 1 is always shown in full); otherwise
  // resume centered on the pen's last position, same as live auto-follow.
  lastAutoFollowTargetY = globalCursorY;
  const resumeCameraY = (globalCursorY <= PAGE_H)
    ? 0
    : Math.max(0, globalCursorY - (viewH/2)/camera.scale);
  setCameraYProgrammatically(resumeCameraY);
  clampScrollLimits(); // also redraws
  setStatus('session loaded');
  rememberActiveSession();
  // Subject may have changed loading this session — refresh the list so
  // it's still scoped to whatever subject/course is now active.
  refreshSessionList();
}

// Manual save is gone from the UI — sessions autosave (autoSaveSession/
// flushSaveOnExit) whenever there's actual conversation content, so
// nothing is lost without it.
document.getElementById('btn-new-session').addEventListener('click', ()=>{
  resetTutorBoardState();
  setStatus('new session');
  openSubjectModal();
});

/* =========================================================
   SIDE PANEL TOGGLES

const sidePanel = document.getElementById('side-panel');
const overlay = document.getElementById('overlay');
// On tablet/desktop the panel DOCKS and pushes the whole view over (the board's own

if (window.innerWidth > 700) { openPanel(); }
overlay.addEventListener('click', ()=>{ closePanel(); closeConvPanel(); });

/* Transcript panel: docks right, shows ONLY the AI conversation log
   plus its own ask box. Asking here never draws on the board and
   never speaks the reply out loud — the response is just appended
   to the transcript, same as a text-only chat. */
const convPanel = document.getElementById('conv-panel');
function openConvPanel(){

function closeConvPanel(){

async function handleConvAsk(text){
  const typed = (text || '').trim();
  if(!typed) return;
  document.getElementById('conv-ask-input').value = '';
  addTranscriptMsg('user', typed);
  await document.fonts.ready;
  try{
    const result = await callTutor(typed, null);
    if(result && result.speech) addTranscriptMsg('tutor', result.speech);
  } catch(e){
    console.error('Transcript ask failed:', e);
    addTranscriptMsg('tutor', 'Sorry, something went wrong answering that.');
  }
  autoSaveSession();
}
document.getElementById('btn-conv-ask').addEventListener('click', ()=> handleConvAsk(document.getElementById('conv-ask-input').value));
document.getElementById('conv-ask-input').addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleConvAsk(e.target.value); });

/* =========================================================
   WIRE UP CONTROLS
   ========================================================= */
document.getElementById('btn-teach').addEventListener('click', ()=>{
  const val = document.getElementById('topic-input').value.trim();
  if(!val) return;
  if(conversationHistory.length === 0) currentTopicLabel = val.length > 60 ? val.slice(0,57)+'…' : val;
  runTeachingTurn(val);
  document.getElementById('topic-input').value = '';
  closePanel();
});
document.getElementById('btn-quiz').addEventListener('click', ()=>{
  const val = document.getElementById('topic-input').value.trim();
  const prompt = val ? `Please quiz me on: ${val}` : (pdfText ? `Please quiz me on the uploaded document.` : `Please quiz me on the most recent topic we discussed.`);
  runTeachingTurn(prompt);
  closePanel();
});
// Attachment picked from the ask-follow-up box's paperclip button. Cleared
// after being sent (or removed via the chip's × button).
let pendingAttachment = null; // {kind:'pdf'|'image'|'text', name, text?, mimeType?, base64?}

function renderAttachChip(){
  const chip = document.getElementById('attach-chip');
  if(!pendingAttachment){ chip.style.display = 'none'; chip.innerHTML = ''; return; }
  const icon = pendingAttachment.kind === 'image' ? '🖼' : '📄';
  chip.style.display = 'flex';
  chip.innerHTML = `<span>${icon}</span><span class="attach-chip-name">${escapeHtml(pendingAttachment.name)}</span><button type="button" class="attach-chip-remove" id="attach-chip-remove" title="Remove attachment">×</button>`;
  document.getElementById('attach-chip-remove').addEventListener('click', ()=>{ pendingAttachment = null; renderAttachChip(); });
}

async function handleAttachFile(file){
  try{
    if(file.type === 'application/pdf'){
      if(!pdfjsAvailable){ setStatus('pdf engine unavailable — try reloading'); return; }
      setStatus('reading attachment…');
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data: buf}).promise;
      let text = '';
      const maxPages = Math.min(pdf.numPages, 20);
      for(let i=1;i<=maxPages;i++){
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += `\n\n[Page ${i}]\n` + content.items.map(it=>it.str).join(' ');
      }
      pendingAttachment = { kind:'pdf', name:file.name, text: text.slice(0,20000) };
    } else if(file.type.startsWith('image/')){
      setStatus('reading attachment…');
      const dataUrl = await new Promise((res,rej)=>{
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = () => rej(new Error('read failed'));
        r.readAsDataURL(file);
      });
      pendingAttachment = { kind:'image', name:file.name, mimeType:file.type, base64: dataUrl.split(',')[1] };
    } else {
      setStatus('reading attachment…');
      const text = await file.text();
      pendingAttachment = { kind:'text', name:file.name, text: text.slice(0,20000) };
    }
    setStatus('attachment ready');
    renderAttachChip();
  } catch(err){
    console.error('Attachment read failed:', err);
    setStatus('could not read attachment — see console');
  }
}

document.getElementById('btn-attach').addEventListener('click', ()=> document.getElementById('attach-input').click());
document.getElementById('attach-input').addEventListener('change', (e)=>{
  if(e.target.files.length) handleAttachFile(e.target.files[0]);
  e.target.value = ''; // allow re-picking the same file later
});

function handleAsk(text){
  const typed = (text || '').trim();
  if(!typed && !pendingAttachment) return;

  let message = typed;
  let imageAttachment = null;
  if(pendingAttachment){
    if(pendingAttachment.kind === 'image'){
      message = (message ? message + '\n\n' : '') + `[Attached image: ${pendingAttachment.name}]`;
      imageAttachment = { mimeType: pendingAttachment.mimeType, base64: pendingAttachment.base64 };
    } else {
      message = (message ? message + '\n\n' : '') + `[Attached file: ${pendingAttachment.name}]\n${pendingAttachment.text}`;
    }
  }

  runTeachingTurn(message, typed || `Attached: ${pendingAttachment.name}`, imageAttachment);
  document.getElementById('ask-input').value = '';
  pendingAttachment = null;
  renderAttachChip();
}
document.getElementById('btn-ask').addEventListener('click', ()=> handleAsk(document.getElementById('ask-input').value));
document.getElementById('ask-input').addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleAsk(e.target.value); });

/* =========================================================
   INIT
   ========================================================= */
resizeCanvas();
// Mobile browsers (portrait especially) can still be settling viewport
// chrome/address-bar height right after load, so the very first
// getBoundingClientRect() here may be stale. A couple of fixed-delay
// retries isn't always enough — the same reason orientationchange uses
// the polling "wait until size stops changing" version instead of fixed
// timeouts — so use that same stabilizing function here too, rather than
// locking in a stale size if settling runs past a hardcoded delay.
resizeCanvasWhenStable(1000);
setStatus('idle');
refreshSessionList();
<\/script>

<script type="text/plain" id="src-summary"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Chalkline — Summary</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"><\/script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@600;700&display=swap');

:root{
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --board-bg:#FDFBF6;
  --ink:#2A2410;
  --ochre:#2E7DBE;
  --gold:#F0B94D;
  --gold-deep:#C98A2B;
  --highlight:#F5E6B8;
  --sage:#3E8FA6;
  --brick:#3D6B93;
  --panel-border:#ECE3C8;
  --muted:#8A8267;
  --halo-blue:#F6E2A0;
  --halo-blue-soft:#FCF3D9;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Source Serif 4', Georgia, serif;
  color:var(--ink);
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(240,185,77,0.22), transparent 60%),
    radial-gradient(ellipse 900px 600px at 100% 0%, rgba(46,125,190,0.10), transparent 60%),
    linear-gradient(165deg, #FFFDF6 0%, #FFF7E0 55%, #FBEFD0 130%);
  min-height:100vh; min-height:100dvh; position:relative;
  overflow-x:hidden;
}
.ambient-halo{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.ambient-halo::before,.ambient-halo::after{
  content:''; position:absolute; width:58vmax;height:58vmax;
  border-radius:50%; filter:blur(100px); opacity:0.22; mix-blend-mode:multiply;
}
.ambient-halo::before{ top:-24%; left:-16%; background:radial-gradient(circle, var(--halo-blue) 0%, rgba(110,168,254,0) 70%); animation:d1 24s ease-in-out infinite; }
.ambient-halo::after{ bottom:-26%; right:-14%; background:radial-gradient(circle, var(--halo-blue-soft) 0%, rgba(165,200,255,0) 70%); animation:d2 28s ease-in-out infinite; }
@keyframes d1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(9%,7%) scale(1.13);}}

.sidebar-toggle{
  position:fixed; top:26px; left:174px; z-index:50;

}

.sidebar-toggle:active{ transform:scale(0.94); }
.app-shell.sidebar-closed .sidebar-toggle{ left:16px; }
@media (max-width:700px){ .sidebar-toggle{ left:calc(16px + var(--safe-left)); top:calc(16px + var(--safe-top)); } .app-shell.sidebar-closed .sidebar-toggle{ left:calc(16px + var(--safe-left)); } }
.sidebar-scrim{ display:none; position:fixed; inset:0; background:rgba(42,36,16,0.22); z-index:39; opacity:0; transition:opacity .3s ease; }
/* Scrim is mobile-only (see the max-width:700px block below). On desktop the sidebar
   docks and pushes content, so an invisible full-viewport layer here just swallowed
   the first click on everything while the sidebar was open. */
.main-area{ flex:1; min-width:0; transition:margin-left .38s cubic-bezier(.22,.9,.32,1.1); margin-left:230px; padding:8px 0 0; }
.app-shell.sidebar-closed .main-area{ margin-left:0; }
@media (max-width:700px){

  .app-shell:not(.sidebar-closed) .sidebar-scrim{ display:block; opacity:1; }
  .app-shell.sidebar-closed .sidebar-scrim{ display:none; }
}
.main-area .wrap{ margin:0 auto; }

/* Pill rides the sidebar edge: when the sidebar closes it returns to the corner.
   (The pill sits outside .app-shell, so the rule above could never match it.) */
body.sb-closed .sidebar-toggle{ left:16px; }
@media (max-width:700px){ body.sb-closed .sidebar-toggle{ left:calc(16px + var(--safe-left)); } }

/* ---- Independent scrolling ----------------------------------------
   The page itself never scrolls any more: the shell is exactly one
   screen tall and only .main-area scrolls inside it. That way the
   sidebar (and the Menu pill) stay exactly where they are no matter
   how far down the content goes. */
html,body{ height:100%; overflow:hidden; }
.app-shell{ height:100vh; height:100dvh; min-height:0; overflow:hidden; }
.main-area{
  height:100vh; height:100dvh;
  overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}

   The sidebar is a slab standing in space: turned slightly toward the
   content, with a thick lit edge, a long cast shadow, and raised

  transform:perspective(1500px) translateX(0) rotateY(3deg);

/* ---- Menu tab ------------------------------------------------------

<script>
(function(){
  const shell = document.getElementById('app-shell');
  const sbScrim = document.getElementById('sidebar-scrim');
  function closeSidebar(){ shell.classList.add('sidebar-closed'); document.body.classList.add('sb-closed'); }
  function openSidebar(){ shell.classList.remove('sidebar-closed'); document.body.classList.remove('sb-closed'); }
  document.getElementById('sidebar-toggle').addEventListener('click', ()=>
    shell.classList.contains('sidebar-closed') ? openSidebar() : closeSidebar()
  );
  sbScrim.addEventListener('click', closeSidebar);
  if (window.innerWidth <= 700) closeSidebar();
})();

/* ---------------------------------------------------------------
   window.storage shim: the real window.storage API only exists
   inside the Claude.ai artifact preview sandbox — on a real
   deployed site (like this one, on GitHub Pages) it doesn't exist
   at all, so every call used to throw and autosave failed silently.
   This shim gives the same get/set/list/delete interface, backed
   by localStorage, so saving actually works once deployed. Swap
   this out for real fetch() calls to your own backend later if you
   want saves to sync across devices instead of staying per-browser.
   ------------------------------------------------------------- */
if(!window.storage || !window.storage.__isRealBackend){
  const STORAGE_NS = 'chalkline:';
  window.storage = {
    __isRealBackend: false,
    async get(key){
      const raw = localStorage.getItem(STORAGE_NS + key);
      return raw === null ? null : { key, value: raw, shared: false };
    },
    async set(key, value){
      try{ localStorage.setItem(STORAGE_NS + key, value); return { key, value, shared: false }; }
      catch(e){ console.error('localStorage set failed:', e); return null; }
    },
    async delete(key){
      const existed = localStorage.getItem(STORAGE_NS + key) !== null;
      localStorage.removeItem(STORAGE_NS + key);
      return { key, deleted: existed, shared: false };
    },
    async list(prefix){
      const keys = [];
      const full = STORAGE_NS + (prefix || '');
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(full)) keys.push(k.slice(STORAGE_NS.length));
      }
      return { keys, prefix, shared: false };
    }
  };
}

const pdfjsAvailable = typeof pdfjsLib !== 'undefined';
if(pdfjsAvailable){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}
let pdfText = '', pdfFileName = '';
const uploadZone = document.getElementById('upload-zone');
const pdfInput = document.getElementById('pdf-input');
const btnSummarize = document.getElementById('btn-summarize');
const statusLine = document.getElementById('status-line');

/* ---------------- account + saved summaries -----------------------
   Same convention as the tutor page: sessions are namespaced under
   'summary:<account sub or "local">:<id>' so the home page can list
   both kinds of history by prefix. Swap window.storage for a real
   backend call once one exists — see the tutor page's persistSession
   for the same note. */
let currentUser = null;
let currentSummarySessionId = 'summary_' + Date.now();
let currentSummaryTitle = null;
const summarySubjectInput = document.getElementById('summary-subject-input');
function currentSummarySubject(){ return (summarySubjectInput.value || '').trim(); }

function summarySessionKeyPrefix(){
  return 'summary:' + currentUser.sub + ':';
}

function resetSummaryViewState(){
  currentSummarySessionId = 'summary_' + Date.now(); currentSummaryTitle = null;
  pdfText=''; pdfFileName=''; summarySubjectInput.value = '';
  uploadZone.classList.remove('has-file');
  uploadZone.innerHTML = `Drop a PDF here, or click to choose a file.<input type="file" id="pdf-input" accept="application/pdf">`;
  document.getElementById('pdf-input').addEventListener('change', (e)=>{ if(e.target.files.length) handlePdfFile(e.target.files[0]); });
  btnSummarize.disabled = true;
  outputWrap.classList.remove('show');
  summaryPanel.innerHTML = '';
}

window.addEventListener('message', (e)=>{
  const d = e.data;
  if(!d || !d.chalklineAuth) return;
  // Same reasoning as the tutor page: don't let a summary that was
  // open under one account (or as a guest) remain on screen once the
  // account identity actually changes — otherwise it stays visible to
  // whoever is looking at the page next, including after sign-out.
  const prevSub = currentUser ? currentUser.sub : null;
  const newUser = d.signedIn ? d.user : null;
  const newSub = newUser ? newUser.sub : null;
  const accountChanged = prevSub !== null && prevSub !== newSub;
  currentUser = newUser;
  if(accountChanged){
    resetSummaryViewState();
    setStatus(d.signedIn ? 'switched account — cleared previous summary' : 'signed out — cleared previous summary');
  }
  refreshSummarySessionList();
  if(pendingSummaryLoad) loadSummarySessionById(pendingSummaryLoad);
});

// If the shell tells us to open a specific saved summary (e.g. from the
// Previous Summaries page), try immediately, then retry once real auth
// state arrives (it may land slightly after this message, and the key
// prefix depends on it).
let pendingSummaryLoad = null;
window.addEventListener('message', (e)=>{
  const d = e.data;
  if(d && d.loadSummaryId){
    pendingSummaryLoad = d.loadSummaryId;
    loadSummarySessionById(d.loadSummaryId);
  }
  if(d && d.presetSubject){
    summarySubjectInput.value = d.presetSubject;
  }
});

async function loadSummarySessionById(id){
  try{
    const rec = await window.storage.get(summarySessionKeyPrefix() + id, false);
    if(rec){ loadSummarySession(JSON.parse(rec.value)); pendingSummaryLoad = null; }
  } catch(e){ console.error('Could not load requested summary:', e); }
}

async function persistSummarySession(html){
  // Guest (signed-out) summaries must never be written to durable,
  // sharable storage — otherwise closing and reopening the site, or a
  // different visitor on the same browser, would still see them. Only
  // persist once someone is actually signed in.
  if(!currentUser) return;
  const payload = {
    id: currentSummarySessionId,
    title: currentSummaryTitle || (pdfFileName ? pdfFileName.replace(/\.pdf$/i,'') : 'Untitled summary'),
    subject: currentSummarySubject() || 'Unsorted',
    savedAt: Date.now(),
    pdfFileName, html
  };
  try{ await window.storage.set(summarySessionKeyPrefix() + currentSummarySessionId, JSON.stringify(payload), false); }
  catch(e){ console.error('Saving summary failed:', e); }
  refreshSummarySessionList();
}

let summarySessionListReq = 0;
async function deleteSummarySession(id, ev){
  if(ev) ev.stopPropagation();
  if(!confirm('Delete this saved summary? This can\'t be undone.')) return;
  try{
    await window.storage.delete(summarySessionKeyPrefix() + id, false);
    if(id === currentSummarySessionId) resetSummaryViewState();
    refreshSummarySessionList();
  } catch(e){ console.error('Delete summary failed:', e); setStatus('delete failed — see console'); }
}
async function refreshSummarySessionList(){
  const myReq = ++summarySessionListReq;
  const listEl = document.getElementById('summary-session-list');
  if(!currentUser){ listEl.innerHTML = '<div class="empty-hint">Sign in to save and revisit your summaries.</div>'; return; }
  try{
    const result = await window.storage.list(summarySessionKeyPrefix(), false);
    if(myReq !== summarySessionListReq) return; // superseded by a newer auth state
    const keys = (result && result.keys) ? result.keys : [];
    if(keys.length===0){ listEl.innerHTML = '<div class="empty-hint">No saved summaries yet.</div>'; return; }
    const items = [];
    for(const key of keys){
      try{ const rec = await window.storage.get(key, false); if(rec) items.push(JSON.parse(rec.value)); } catch(e){}
    }
    if(myReq !== summarySessionListReq) return;
    items.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
    listEl.innerHTML = '';
    items.forEach(item=>{
      const div = document.createElement('div'); div.className='session-item';
      const date = new Date(item.savedAt);
      div.innerHTML = `<span class="s-name">${escapeHtml(item.title||'Untitled')}</span><span class="s-date">${date.toLocaleDateString()}</span><button type="button" class="s-delete" title="Delete">✕</button>`;
      div.style.cursor = 'pointer';
      div.addEventListener('click', ()=> loadSummarySession(item));
      div.querySelector('.s-delete').addEventListener('click', (ev)=> deleteSummarySession(item.id, ev));
      listEl.appendChild(div);
    });
  } catch(err){ console.error('Listing summaries failed:', err); listEl.innerHTML = '<div class="empty-hint">Could not load saved summaries.</div>'; }
}

function loadSummarySession(item){
  currentSummarySessionId = item.id; currentSummaryTitle = item.title;
  pdfFileName = item.pdfFileName || '';
  summarySubjectInput.value = (item.subject && item.subject !== 'Unsorted') ? item.subject : '';
  outputTitle.textContent = `Summary — ${(pdfFileName || item.title || '').replace(/\.pdf$/i,'')}`;
  summaryPanel.innerHTML = item.html || '';
  outputWrap.classList.add('show');
  setStatus('summary loaded');
  outputWrap.scrollIntoView({behavior:'smooth', block:'start'});
}

document.getElementById('btn-new-summary-session').addEventListener('click', ()=>{
  resetSummaryViewState();
  setStatus('new summary');
});
/* -------------------------------------------------------------- */
function setStatus(s){ statusLine.textContent = s || ''; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

uploadZone.addEventListener('click', ()=> pdfInput.click());
uploadZone.addEventListener('dragover', (e)=> e.preventDefault());
uploadZone.addEventListener('drop', (e)=>{ e.preventDefault(); if(e.dataTransfer.files.length) handlePdfFile(e.dataTransfer.files[0]); });
pdfInput.addEventListener('change', (e)=>{ if(e.target.files.length) handlePdfFile(e.target.files[0]); });

async function handlePdfFile(file){
  if(!pdfjsAvailable){ alert("PDF import couldn't load its engine. Try reloading the page."); return; }
  if(file.type !== 'application/pdf'){ alert('Please choose a PDF file.'); return; }
  setStatus('reading pdf…');
  pdfFileName = file.name;
  try{
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
    let fullText = '';
    const maxPages = Math.min(pdf.numPages, 60);
    for(let i=1;i<=maxPages;i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      fullText += `\n\n[Page ${i}]\n` + content.items.map(it=>it.str).join(' ');
    }
    pdfText = fullText;
    uploadZone.classList.add('has-file');
    uploadZone.innerHTML = `<div class="file-name">📄 ${escapeHtml(pdfFileName)}</div><div class="file-meta">${pdf.numPages} page${pdf.numPages===1?'':'s'} · text extracted${pdf.numPages>60 ? ' (first 60 pages)' : ''}</div>`;
    btnSummarize.disabled = false;
    setStatus('ready to summarize');
  } catch(err){
    console.error('Failed to read PDF:', err);
    setStatus('could not read this pdf — see console');
  }
}

const PROXY_URL = "https://api.takundamambudzi02.workers.dev";
function chalklineAuthHeaders(){
  try{ const s = JSON.parse(localStorage.getItem('chalkline_session') || 'null'); return s && s.token ? { Authorization:'Bearer ' + s.token } : {}; }
  catch(e){ return {}; }
}

function lengthInstruction(mode){
  if(mode === 'brief') return "Keep it short: a handful of the most important bullet points only, no sections, under 150 words.";
  if(mode === 'detailed') return "Be thorough: cover every section of the source in real depth, with sub-points and examples where the source has them. It's fine for this to be long.";
  return "Aim for a well-organized overview: a few clear sections with headings, each with 3-6 bullet points covering the important content.";
}

async function summarizeText(text, mode){
  if(PROXY_URL.includes('YOUR-WORKER-SUBDOMAIN')){
    return { ok:false, error:"The AI proxy hasn't been set up yet." };
  }

  const system = `You are a study-notes summarizer. You are given the extracted text of a PDF (a chapter, slide deck, or notes) and must produce a summary of it for a student reviewing before an exam.

Output format: plain HTML fragment only using: <h3>, <p>, <ul>/<li>, <strong>.

${lengthInstruction(mode)}`;

  const userMsg = `Extracted PDF text (file: ${pdfFileName}):\n\n${text.slice(0, 60000)}`;

  // Gemini is the primary backend (same "main AI brain" the tutor page
  // now uses); Groq, then Apinex, are kept as fallbacks in that order if
  // Gemini fails or isn't configured.
  const geminiResult = await summarizeViaGemini(system, userMsg);
  if(geminiResult.ok) return geminiResult;
  const groqResult = await summarizeViaGroq(system, userMsg);
  if(groqResult.ok) return groqResult;
  return summarizeViaApinex(system, userMsg);
}

async function summarizeViaGroq(system, userMsg){
  let response, data;
  try{
    response = await fetch(`${PROXY_URL}/groq`, {
      method:"POST",
      headers:Object.assign({"Content-Type":"application/json"}, chalklineAuthHeaders()),
      body: JSON.stringify({
        model:"openai/gpt-oss-120b",
        max_tokens: 3000,
        messages: [
          { role:"system", content: system },
          { role:"user", content: userMsg }
        ]
      })
    });
  } catch(networkErr){
    return { ok:false, error:"The request never reached the proxy." };
  }

  try{ data = await response.json(); }
  catch(parseErr){
    return { ok:false, error:"The server responded, but not with valid JSON." };
  }

  if(!response.ok){
    const msg = (data && data.error && data.error.message) ? data.error.message : JSON.stringify(data);
    return { ok:false, error:`The model returned an error: ${msg}` };
  }

  const choice = data.choices && data.choices[0];
  const raw = choice && choice.message && choice.message.content;
  if(!raw){
    return { ok:false, error:"The response came back in an unexpected shape." };
  }
  return { ok:true, html: raw.trim().replace(/^```html\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'') };
}

async function summarizeViaApinex(system, userMsg){
  let response, data;
  try{
    response = await fetch(`${PROXY_URL}/apinex`, {
      method:"POST",
      headers:Object.assign({"Content-Type":"application/json"}, chalklineAuthHeaders()),
      body: JSON.stringify({
        max_tokens: 3000,
        messages: [
          { role:"system", content: system },
          { role:"user", content: userMsg }
        ]
      })
    });
  } catch(networkErr){
    return { ok:false, error:"The request never reached the proxy." };
  }

  try{ data = await response.json(); }
  catch(parseErr){
    return { ok:false, error:"The server responded, but not with valid JSON." };
  }

  if(!response.ok){
    const msg = (data && data.error && data.error.message) ? data.error.message : JSON.stringify(data);
    return { ok:false, error:`The model returned an error: ${msg}` };
  }

  const choice = data.choices && data.choices[0];
  const raw = choice && choice.message && choice.message.content;
  if(!raw){
    return { ok:false, error:"The response came back in an unexpected shape." };
  }
  return { ok:true, html: raw.trim().replace(/^```html\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'') };
}

async function summarizeViaGemini(system, userMsg){
  let response, data;
  try{
    response = await fetch(`${PROXY_URL}/gemini`, {
      method:"POST",
      headers:Object.assign({"Content-Type":"application/json"}, chalklineAuthHeaders()),
      body: JSON.stringify({
        system_instruction: { parts: [{ text: system }] },
        contents: [{ role:"user", parts:[{ text: userMsg }] }],
        generationConfig: { maxOutputTokens: 3000 }
      })
    });
  } catch(networkErr){
    return { ok:false, error:"The request never reached the proxy." };
  }

  try{ data = await response.json(); }
  catch(parseErr){
    return { ok:false, error:"The server responded, but not with valid JSON." };
  }

  if(!response.ok){
    const msg = (data && data.error && data.error.message) ? data.error.message : JSON.stringify(data);
    return { ok:false, error:`The model returned an error: ${msg}` };
  }

  const candidate = data.candidates && data.candidates[0];
  const part = candidate && candidate.content && candidate.content.parts && candidate.content.parts[0];
  if(!part || !part.text){
    return { ok:false, error:"The response came back in an unexpected shape." };
  }
  return { ok:true, html: part.text.trim().replace(/^```html\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'') };
}

const outputWrap = document.getElementById('output-wrap');
const summaryPanel = document.getElementById('summary-panel');
const outputTitle = document.getElementById('output-title');

btnSummarize.addEventListener('click', async ()=>{
  if(!pdfText){ setStatus('upload a pdf first'); return; }
  const mode = document.getElementById('length-select').value;
  btnSummarize.disabled = true;
  setStatus('reading and summarizing…');
  const result = await summarizeText(pdfText, mode);
  btnSummarize.disabled = false;
  if(!result.ok){
    setStatus(result.error);
    return;
  }
  outputTitle.textContent = `Summary — ${pdfFileName.replace(/\.pdf$/i,'')}`;
  summaryPanel.innerHTML = result.html;
  outputWrap.classList.add('show');
  setStatus('done');
  outputWrap.scrollIntoView({behavior:'smooth', block:'start'});
  persistSummarySession(result.html);
});

document.getElementById('btn-copy').addEventListener('click', ()=>{
  const text = summaryPanel.innerText;
  navigator.clipboard.writeText(text).then(()=> setStatus('summary copied')).catch(()=> setStatus('copy failed'));
});

document.getElementById('btn-download').addEventListener('click', ()=>{
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const margin = 48;
    const maxWidth = 595 - margin*2;
    let y = margin;
    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text(outputTitle.textContent, margin, y); y += 26;

    const nodes = summaryPanel.children.length ? Array.from(summaryPanel.children) : [summaryPanel];
    nodes.forEach(node=>{
      const tag = node.tagName ? node.tagName.toLowerCase() : 'p';
      if(tag === 'h3'){
        doc.setFont('helvetica','bold'); doc.setFontSize(13);
        if(y > 760){ doc.addPage(); y = margin; }
        y += 10;
        const lines = doc.splitTextToSize(node.textContent, maxWidth);
        doc.text(lines, margin, y); y += lines.length*16 + 4;
      } else if(tag === 'ul'){
        doc.setFont('helvetica','normal'); doc.setFontSize(11);
        Array.from(node.children).forEach(li=>{
          const lines = doc.splitTextToSize('•  ' + li.textContent, maxWidth);
          if(y + lines.length*14 > 780){ doc.addPage(); y = margin; }
          doc.text(lines, margin, y); y += lines.length*14 + 2;
        });
        y += 6;
      } else {
        doc.setFont('helvetica','normal'); doc.setFontSize(11);
        const lines = doc.splitTextToSize(node.textContent, maxWidth);
        if(y + lines.length*14 > 780){ doc.addPage(); y = margin; }
        doc.text(lines, margin, y); y += lines.length*14 + 8;
      }
    });

    doc.save((pdfFileName ? pdfFileName.replace(/\.pdf$/i,'') : 'summary') + ' - summary.pdf');
    setStatus('pdf downloaded');
  } catch(err){
    console.error('PDF export failed:', err);
    setStatus('pdf export failed — see console');
  }
});
<\/script>
