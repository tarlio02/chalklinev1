  iframe{ position:fixed; inset:0; width:100%; height:100%; border:none; display:none; background:#F3F9FE; }

<script type="text/plain" id="src-home"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chalkline — AI Study Tools</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@600;700&display=swap');

:root{
  --board-bg:#F3F9FE;
  --ink:#1E2B3A;
  --ochre:#2E7DBE;
  --highlight:#D7ECFB;
  --sage:#3E8FA6;
  --brick:#3D6B93;
  --panel-border:#D3E6F5;
  --muted:#7C93A8;
  --halo-blue:#6EA8FE;
  --halo-blue-soft:#A5C8FF;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Source Serif 4', Georgia, serif;
  color:var(--ink);
  background:var(--board-bg);
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
}

/* ambient halo, same language as the tutor board */
.ambient-halo{
  position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
}
.ambient-halo::before,.ambient-halo::after{
  content:''; position:absolute; width:60vmax;height:60vmax;
  border-radius:50%; filter:blur(100px); opacity:0.26; mix-blend-mode:multiply;
}
.ambient-halo::before{
  top:-22%; left:-18%;
  background:radial-gradient(circle, var(--halo-blue) 0%, rgba(110,168,254,0) 70%);
  animation:drift1 24s ease-in-out infinite;
}
.ambient-halo::after{
  bottom:-25%; right:-15%;
  background:radial-gradient(circle, var(--halo-blue-soft) 0%, rgba(165,200,255,0) 70%);
  animation:drift2 28s ease-in-out infinite;
}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(10%,8%) scale(1.15);}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-8%,-6%) scale(1.12);}}

.wrap{ position:relative; z-index:1; max-width:920px; margin:0 auto; padding:0 28px; }

/* ===== nav ===== */
nav{
  display:flex; align-items:center; justify-content:space-between;
  padding:26px 0 10px;
}
.brand{
  font-family:'Caveat', cursive; font-weight:700; font-size:28px;
  color:var(--ink); text-decoration:none; display:flex; align-items:center; gap:8px;
}
.brand .dot{ width:9px;height:9px;border-radius:50%; background:var(--ochre); display:inline-block; }
.nav-links{ display:flex; gap:26px; font-family:'JetBrains Mono', monospace; font-size:13px; }
.nav-links a{ color:var(--muted); text-decoration:none; }
.nav-links a:hover{ color:var(--ink); }

/* ===== hero ===== */
.hero{ padding:70px 0 56px; }
.hero h1{
  font-size:52px; line-height:1.12; font-weight:600; margin:0 0 18px;
  max-width:680px; letter-spacing:-0.01em;
}
.hero h1 .chalk{
  font-family:'Caveat', cursive; font-weight:700; color:var(--ochre);
  position:relative; white-space:nowrap;
}
.hero p{
  font-size:19px; line-height:1.6; color:#4a4738; max-width:520px; margin:0;
}

/* ===== tool cards ===== */
.tools{
  display:grid; grid-template-columns:1fr 1fr; gap:22px; margin:0 0 64px;
}
@media (max-width:680px){ .tools{ grid-template-columns:1fr; } .hero h1{ font-size:38px; } }

.tool-card{
  display:block; text-decoration:none; color:inherit;
  background:#fff; border:1px solid var(--panel-border); border-radius:14px;
  padding:30px 28px 26px; position:relative; overflow:hidden;
  transition:border-color .18s ease, transform .18s ease, box-shadow .18s ease;
}
.tool-card:hover{
  border-color:#d8d0b8; transform:translateY(-2px);
  box-shadow:0 10px 28px rgba(38,36,31,0.07);
}
.tool-card .mark{
  width:44px; height:44px; border-radius:10px; margin-bottom:20px;
  display:flex; align-items:center; justify-content:center;
  font-size:20px;
}
.tool-card.tutor .mark{ background:#D7ECFB; }
.tool-card.summary .mark{ background:#E1F0F7; }
.tool-card h2{
  font-size:23px; margin:0 0 8px; font-weight:600;
}
.tool-card p{
  font-size:15.5px; line-height:1.55; color:#5c5847; margin:0 0 18px;
}
.tool-card .go{
  font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ochre);
  display:inline-flex; align-items:center; gap:6px;
}
.tool-card.summary .go{ color:var(--sage); }
.go svg{ width:13px; height:13px; transition:transform .18s ease; }
.tool-card:hover .go svg{ transform:translateX(3px); }

/* underline squiggle under card titles, chalk-like */
.tool-card h2 span{ position:relative; }

/* ===== how it works strip ===== */
.strip{
  border-top:1px solid var(--panel-border); padding:40px 0 70px;
  display:flex; gap:40px; flex-wrap:wrap;
}
.strip-item{ flex:1; min-width:220px; }
.strip-item .num{
  font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted);
  margin-bottom:8px; display:block;
}
.strip-item h3{ font-size:16.5px; margin:0 0 6px; font-weight:600; }
.strip-item p{ font-size:14.5px; color:#6b6754; line-height:1.5; margin:0; }

footer{
  border-top:1px solid var(--panel-border); padding:22px 0 40px;
  font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--muted);
  display:flex; justify-content:space-between;
}
</style>
</head>
<body>

<div class="ambient-halo"></div>

<div class="wrap">
  <nav>
    <a class="brand" href="#" onclick="parent.postMessage({nav:'home'},'*');return false;"><span class="dot"></span>Chalkline</a>
    <div class="nav-links">
      <a href="#" onclick="parent.postMessage({nav:'tutor'},'*');return false;">Tutor</a>
      <a href="#" onclick="parent.postMessage({nav:'summary'},'*');return false;">Summary</a>
    </div>
  </nav>

  <section class="hero">
    <h1>A study session, <span class="chalk">drawn out loud.</span></h1>
    <p>Bring a topic or a PDF. Chalkline either teaches it to you on a live whiteboard, or reads it and hands you back the version worth remembering.</p>
  </section>

  <section class="tools">
    <a class="tool-card tutor" href="#" onclick="parent.postMessage({nav:'tutor'},'*');return false;">
      <div class="mark">✏️</div>
      <h2>Live Tutor</h2>
      <p>An AI tutor that teaches on a real whiteboard — writing, diagrams, and worked examples, paced one idea at a time, with check-ins along the way.</p>
      <span class="go">Start a lesson
        <svg viewBox="0 0 16 16" fill="none"><path d="M2 8h11M9 3.5 13.5 8 9 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </a>
    <a class="tool-card summary" href="#" onclick="parent.postMessage({nav:'summary'},'*');return false;">
      <div class="mark">📄</div>
      <h2>Summary</h2>
      <p>Upload a chapter, slide deck, or set of notes as a PDF, and get a clear, structured summary of what actually matters — ready to read or save.</p>
      <span class="go">Summarize a PDF
        <svg viewBox="0 0 16 16" fill="none"><path d="M2 8h11M9 3.5 13.5 8 9 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </a>
  </section>

  <section class="strip">
    <div class="strip-item">
      <span class="num">FOR LEARNING SOMETHING NEW</span>
      <h3>Live Tutor</h3>
      <p>Type a topic or upload source material, and the tutor builds the explanation on the board as it talks — pausing to check you're following before it moves on.</p>
    </div>
    <div class="strip-item">
      <span class="num">FOR REVIEWING WHAT YOU HAVE</span>
      <h3>Summary</h3>
      <p>Drop in a PDF of notes, slides, or a chapter. Chalkline reads the whole thing and gives you a structured summary you can skim before an exam.</p>
    </div>
  </section>

  <footer>
    <span>Chalkline</span>
    <span>AI whiteboard tutor &amp; notes summarizer</span>
  </footer>
</div>

</body>
</html>
</script>
<script type="text/plain" id="src-tutor"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chalkline — AI Whiteboard Tutor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"><\/script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@600;700&family=Kalam:wght@400;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap');

:root{
  --board-bg:#F7FBFE;
  --board-bg2:#F7FBFE;
  --board-line:#DCEBF7;
  --ink:#1E2B3A;
  --ochre:#2E7DBE;
  --highlight:#D7ECFB;
  --sage:#3E8FA6;
  --brick:#3D6B93;
  --panel:#FFFFFF;
  --panel-border:#D3E6F5;
  --muted:#7C93A8;
  --halo-blue:#6EA8FE;
  --halo-blue-soft:#A5C8FF;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  font-family:'Source Serif 4', Georgia, serif;
  color:var(--ink);
  height:100vh;
  overflow:hidden;
  background:var(--board-bg);
}

/* ===================== BOARD (full-bleed) ===================== */
#board-wrap{
  position:fixed;
  inset:0;
}
#board{
  width:100%;
  height:100%;
  display:block;
  cursor:grab;
}
#board.grabbing{cursor:grabbing;}
#board.hoverable{cursor:pointer;}

/* Ambient animated blue halo, drifting slowly over the white board.
   Sits above the canvas (z-index) but below all UI chrome, and never
   intercepts clicks/hover so it doesn't interfere with board hit-testing. */
.ambient-halo{
  position:fixed;
  inset:0;
  z-index:1;
  overflow:hidden;
  pointer-events:none;
}
.ambient-halo::before,
.ambient-halo::after{
  content:'';
  position:absolute;
  width:62vmax;height:62vmax;
  border-radius:50%;
  filter:blur(90px);
  opacity:0.30;
  mix-blend-mode:multiply;
}
.ambient-halo::before{
  top:-20%; left:-15%;
  background:radial-gradient(circle, var(--halo-blue) 0%, rgba(110,168,254,0) 70%);
  animation:haloDrift1 22s ease-in-out infinite;
}
.ambient-halo::after{
  bottom:-25%; right:-15%;
  background:radial-gradient(circle, var(--halo-blue-soft) 0%, rgba(165,200,255,0) 70%);
  animation:haloDrift2 26s ease-in-out infinite;
}
@keyframes haloDrift1{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(12%,10%) scale(1.18); }
}
@keyframes haloDrift2{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(-10%,-8%) scale(1.15); }
}

/* ===================== PAINTED FRAME ===================== */
/* Frame stays purely decorative and overlaid — the board underneath
   remains full-bleed so no interactive/writing area is lost to it. */
.painted-frame{
  position:fixed;
  inset:0;
  z-index:5;
  pointer-events:none;
}
.painted-frame svg{
  width:100%;
  height:100%;
  display:block;
}

/* ===================== TOP BAR ===================== */
.topbar{
  position:fixed;
  top:0;left:0;right:0;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  padding:18px 20px;
  pointer-events:none;
  z-index:20;
}
.topbar > *{pointer-events:auto;}
.icon-btn{
  width:40px;height:40px;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(6px);
  box-shadow:0 1px 4px rgba(0,0,0,0.08);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:16px;
  color:var(--ink);
}
.icon-btn:hover{background:#fff;}
.top-right-cluster{display:flex;gap:10px;align-items:flex-start;}
.topbar-btn-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}
.status-chip{
  font-family:'JetBrains Mono', monospace;
  font-size:10.5px;
  color:var(--muted);
  background:rgba(255,255,255,0.7);
  padding:6px 10px;
  border-radius:20px;
  align-self:center;
  margin-right:4px;
}

/* ===================== ZOOM CONTROLS ===================== */
.zoom-controls{
  position:fixed;
  top:70px;right:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
  z-index:20;
}
.zoom-btn{
  width:34px;height:34px;border-radius:8px;
  border:none;background:rgba(255,255,255,0.85);backdrop-filter:blur(6px);
  box-shadow:0 1px 4px rgba(0,0,0,0.08);
  font-size:16px;cursor:pointer;color:var(--ink);
}
.zoom-btn:hover{background:#fff;}

/* Shared small label under any icon/round button — a light pill so it
   stays legible over both the white board and the blue frame regardless
   of what's scrolled underneath. */
.btn-label{
  font-family:'JetBrains Mono', monospace;
  font-size:9px;
  color:var(--muted);
  letter-spacing:0.2px;
  white-space:nowrap;
  background:rgba(255,255,255,0.85);
  padding:1px 6px;
  border-radius:8px;
}

/* ===================== BOTTOM CAPTION ===================== */
.caption-zone{
  position:fixed;
  left:0;right:0;
  bottom:0;
  background:linear-gradient(to top, rgba(255,255,255,0.98) 60%, rgba(255,255,255,0.9));
  border-top:1px solid var(--panel-border);
  backdrop-filter:blur(8px);
  padding:10px 200px 8px;
  min-height:20px;
  display:flex;
  justify-content:center;
  z-index:18;
  pointer-events:none;
  box-shadow:0 -4px 16px rgba(0,0,0,0.04);
}
.caption-text{
  max-width:760px;
  text-align:center;
  font-size:16px;
  line-height:1.5;
  color:#3a372e;
}
.caption-text .fading{color:#b9b295;}

/* ===================== BOTTOM-LEFT AVATAR CLUSTER ===================== */
.avatar-cluster{
  position:fixed;
  left:22px;bottom:70px;
  display:flex;
  align-items:center;
  gap:10px;
  z-index:20;
}
.avatar{
  width:52px;height:52px;
  border-radius:50%;
  background:#fff;
  border:2px solid var(--panel-border);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
  position:relative;
}
.avatar.speaking{border-color:var(--ochre);}
.avatar.speaking::after{
  content:'';
  position:absolute; inset:-6px;
  border-radius:50%;
  border:2px solid var(--ochre);
  opacity:0.5;
  animation:ripple 1.6s ease-out infinite;
}
@keyframes ripple{0%{transform:scale(0.85);opacity:0.6;}100%{transform:scale(1.25);opacity:0;}}
.cluster-btn-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}
.cluster-btn{
  width:38px;height:38px;border-radius:50%;
  border:1px solid var(--panel-border);
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:15px;color:var(--ink);
  box-shadow:0 1px 4px rgba(0,0,0,0.06);
}
.cluster-btn:hover{background:#faf8f2;}

/* ===================== BOTTOM-RIGHT MIC ===================== */
.mic-zone{
  position:fixed;
  right:22px;bottom:70px;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}
.mic-btn{
  width:56px;height:56px;border-radius:50%;
  border:none;
  background:var(--brick);
  color:#fff;
  font-size:20px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(168,75,57,0.35);
}
.mic-btn.live{animation:mic-pulse 1.3s ease-in-out infinite;}
.mic-btn.unsupported{background:#c9c4b5;box-shadow:none;cursor:not-allowed;}
@keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(168,75,57,.45);}50%{box-shadow:0 0 0 10px rgba(168,75,57,0);}}

/* ===================== TEXT ASK BAR (center-bottom, above caption) ===================== */
.ask-zone{
  position:fixed;
  left:50%;
  bottom:70px;
  transform:translateX(-50%);
  z-index:20;
  display:flex;
  gap:8px;
  align-items:center;
  background:#fff;
  border:1px solid var(--panel-border);
  border-radius:30px;
  padding:6px 6px 6px 18px;
  box-shadow:0 3px 14px rgba(0,0,0,0.08);
  width:min(520px, 44vw);
}
.ask-zone input{
  flex:1;
  border:none;outline:none;
  font-family:'Source Serif 4', serif;
  font-size:14px;
  padding:8px 0;
  background:transparent;
}
.ask-zone button{
  width:36px;height:36px;border-radius:50%;
  border:none;background:var(--ink);color:#fff;
  cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.ask-zone button:hover{background:var(--ochre);}

/* ===================== SIDE PANEL (slide-out from hamburger) ===================== */
.overlay{
  position:fixed;inset:0;
  background:rgba(20,18,12,0.25);
  z-index:29;
  opacity:0;pointer-events:none;
  transition:opacity .2s ease;
}
.overlay.open{opacity:1;pointer-events:auto;}

.side-panel{
  position:fixed;
  top:0;left:0;bottom:0;
  width:360px;
  background:var(--panel);
  border-right:1px solid var(--panel-border);
  z-index:30;
  transform:translateX(-100%);
  transition:transform .25s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;
  box-shadow:8px 0 30px rgba(0,0,0,0.08);
}
.side-panel.open{transform:translateX(0);}

.panel-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 20px;border-bottom:1px solid var(--panel-border);
}
.panel-head h1{
  font-size:19px;margin:0;font-weight:600;
}
.panel-head h1 em{color:var(--ochre);font-style:italic;}
.panel-close{
  background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);
}

.panel-body{flex:1;overflow-y:auto;}
.p-section{padding:16px 20px;border-bottom:1px solid var(--panel-border);}
.p-section h2{
  font-family:'JetBrains Mono', monospace;
  font-size:10.5px;letter-spacing:0.4px;color:var(--muted);
  margin:0 0 10px 0;
  display:flex;justify-content:space-between;align-items:center;
}
.link-btn{
  font-family:'JetBrains Mono', monospace;font-size:10px;
  color:var(--ochre);background:none;border:none;cursor:pointer;
}
.link-btn:hover{text-decoration:underline;}

.upload-zone{
  border:1.5px dashed #d8d2bd;border-radius:6px;padding:14px;
  text-align:center;cursor:pointer;font-size:13px;color:#7a7361;
  transition:border-color .15s ease;
}
.upload-zone:hover{border-color:var(--ochre);}
.upload-zone.has-file{border-style:solid;border-color:var(--sage);color:var(--ink);text-align:left;}
.file-name{font-weight:600;font-size:12.5px;}
.file-meta{font-family:'JetBrains Mono', monospace;font-size:10px;color:var(--muted);margin-top:3px;}
#pdf-input{display:none;}

.topic-input{
  width:100%;padding:10px 11px;border:1px solid var(--panel-border);border-radius:6px;
  font-family:'Source Serif 4', serif;font-size:13px;resize:none;height:56px;
}
.topic-input:focus{outline:none;border-color:var(--ochre);}
select.topic-input{font-family:'Source Serif 4', serif;background:#fff;cursor:pointer;}
.p-row{display:flex;gap:8px;margin-top:9px;}
.p-btn{
  flex:1;font-family:'Source Serif 4', serif;font-size:13px;
  border:1px solid var(--ink);background:transparent;color:var(--ink);
  padding:8px 10px;border-radius:5px;cursor:pointer;
}
.p-btn.primary{background:var(--ink);color:#fff;}
