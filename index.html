<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@600;700&display=swap');

:root{

  overflow-x:hidden;
  overscroll-behavior-y:none;

.ambient-halo{
  position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
}
.ambient-halo::before,.ambient-halo::after{
  content:''; position:absolute; width:60vmax;height:60vmax;
  border-radius:50%; filter:blur(100px); opacity:0.26; mix-blend-mode:multiply;
}
.ambient-halo::before{
  top:-22%; left:-18%;
  background:radial-gradient(circle, var(--halo-blue) 0%, rgba(110,168,254,0) 70%);
  animation:drift1 24s ease-in-out infinite;
}
.ambient-halo::after{
  bottom:-25%; right:-15%;
  background:radial-gradient(circle, var(--halo-blue-soft) 0%, rgba(165,200,255,0) 70%);
  animation:drift2 28s ease-in-out infinite;
}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(10%,8%) scale(1.15);}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-8%,-6%) scale(1.12);}}

.wrap{ position:relative; z-index:1; max-width:920px; margin:0 auto; padding:0 28px; }

nav{
  display:flex; align-items:center; justify-content:space-between;
  padding:26px 0 10px;
}
.brand{

}
.brand .dot{ width:9px;height:9px;border-radius:50%; background:var(--ochre); display:inline-block; }
.nav-links{ display:flex; gap:26px; font-family:'JetBrains Mono', monospace; font-size:13px; }
.nav-links a{ color:var(--muted); text-decoration:none; }
.nav-links a:hover{ color:var(--ink); }

.hero{ padding:70px 0 56px; }
.hero h1{
  font-size:52px; line-height:1.12; font-weight:600; margin:0 0 18px;
  max-width:680px; letter-spacing:-0.01em;
}
.hero h1 .chalk{
  font-family:'Caveat', cursive; font-weight:700; color:var(--ochre);
  position:relative; white-space:nowrap;
}
.hero p{
  font-size:19px; line-height:1.6; color:#4a4738; max-width:520px; margin:0;
}

.tools{
  display:grid; grid-template-columns:1fr 1fr; gap:22px; margin:0 0 64px;
}
@media (max-width:680px){ .tools{ grid-template-columns:1fr; } .hero h1{ font-size:38px; } }

.tool-card{
  display:block; text-decoration:none; color:inherit;
  background:#fff; border:1px solid var(--panel-border); border-radius:14px;
  padding:30px 28px 26px; position:relative; overflow:hidden;
  transition:border-color .18s ease, transform .18s ease, box-shadow .18s ease;
}
.tool-card:hover{
  border-color:#d8d0b8; transform:translateY(-2px);
  box-shadow:0 10px 28px rgba(38,36,31,0.07);
}
.tool-card .mark{
  width:44px; height:44px; border-radius:10px; margin-bottom:20px;
  display:flex; align-items:center; justify-content:center;
  font-size:20px;
}
.tool-card.tutor .mark{ background:#D7ECFB; }
.tool-card.summary .mark{ background:#E1F0F7; }
.tool-card h2{
  font-size:23px; margin:0 0 8px; font-weight:600;
}
.tool-card p{
  font-size:15.5px; line-height:1.55; color:#5c5847; margin:0 0 18px;
}
.tool-card .go{
  font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ochre);
  display:inline-flex; align-items:center; gap:6px;
}
.tool-card.summary .go{ color:var(--sage); }
.go svg{ width:13px; height:13px; transition:transform .18s ease; }
.tool-card:hover .go svg{ transform:translateX(3px); }

.tool-card h2 span{ position:relative; }

.strip{
  border-top:1px solid var(--panel-border); padding:40px 0 70px;
  display:flex; gap:40px; flex-wrap:wrap;
}
.strip-item{ flex:1; min-width:220px; }
.strip-item .num{
  font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted);
  margin-bottom:8px; display:block;
}
.strip-item h3{ font-size:16.5px; margin:0 0 6px; font-weight:600; }
.strip-item p{ font-size:14.5px; color:#6b6754; line-height:1.5; margin:0; }

footer{
  border-top:1px solid var(--panel-border); padding:22px 0 40px;
  font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--muted);
  display:flex; justify-content:space-between;
}

/* --- handwritten look --- */
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@600;700&display=swap');
body, p, li, a, span, div, h1, h2, h3, h4, h5, h6, button, label, input, textarea, nav, footer{
  font-family:'Patrick Hand','Caveat',cursive !important;
  letter-spacing:0.2px;
}
h1, h2, .brand, .hero h1 .chalk{ font-family:'Caveat',cursive !important; }
</style>
</head>

<div class="wrap">

  <section class="tools">

      <div class="mark">✏️</div>
      <h2>Live Tutor</h2>
      <p>An AI tutor that teaches on a real whiteboard — writing, diagrams, and worked examples, paced one idea at a time, with check-ins along the way.</p>
      <span class="go">Start a lesson
        <svg viewBox="0 0 16 16" fill="none"><path d="M2 8h11M9 3.5 13.5 8 9 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>

      <div class="mark">📄</div>
      <h2>Summary</h2>
      <p>Upload a chapter, slide deck, or set of notes as a PDF, and get a clear, structured summary of what actually matters — ready to read or save.</p>
      <span class="go">Summarize a PDF
        <svg viewBox="0 0 16 16" fill="none"><path d="M2 8h11M9 3.5 13.5 8 9 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </a>

  <section class="strip">
    <div class="strip-item">
      <span class="num">FOR LEARNING SOMETHING NEW</span>

    </div>
    <div class="strip-item">
      <span class="num">FOR REVIEWING WHAT YOU HAVE</span>

      <p>Drop in a PDF of notes, slides, or a chapter. Chalkline reads the whole thing and gives you a structured summary you can skim before an exam.</p>

  <footer>
    <span>Chalkline</span>

<script type="text/plain" id="src-tutor"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chalkline — AI Whiteboard Tutor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"><\/script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@400;700&family=Noto+Sans+Symbols+2&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --board-bg:#FFFFFF;
  --ink:#1E2B3A;
  --ochre:#2E7DBE;
  --highlight:#D7ECFB;
  --sage:#3E8FA6;
  --brick:#3D6B93;
  --teal:#0F8C82;
  --violet:#7C5CBF;
  --sky:#2AA9E0;
  --coral:#E0665A;
  --panel:#FFFFFF;
  --panel-border:#D3E6F5;
  --muted:#7C93A8;
  --halo-blue:#0099FF;
  --halo-blue-soft:#00E5FF;
  --btn-glow:0 0 0 1.5px rgba(20,90,255,0.55), 0 0 10px 2px rgba(20,90,255,0.45), 0 0 22px 4px rgba(0,140,255,0.30);
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  font-family:'Inter', -apple-system, 'Source Serif 4', Georgia, serif;
  color:var(--ink);
  height:100vh;
  overflow:hidden;
  background:var(--board-bg);
}

/* =========================================================
   NEW WHITEBOARD: vertical document-flow presentation layer
   ========================================================= */
#board-scroll{
  position:fixed;
  inset:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  background:#fff;
  z-index:2;
}
#board-content{
  max-width:760px;
  margin:0 auto;
  padding:96px 22px 260px;
  display:flex;
  flex-direction:column;
  min-height:100%;
}
#board-content.empty::before{
  content:'Ask a question, upload a PDF, or hit "Teach this" to start a lesson.';
  display:block;
  margin-top:40vh;
  text-align:center;
  color:var(--muted);
  font-size:15px;
  font-family:'Inter',sans-serif;
}

.board-block{
  opacity:0;
  transform:translateY(10px);
  transition:opacity .45s ease, transform .45s ease;
  margin:0 0 4px;
}
.board-block.in{opacity:1;transform:translateY(0);}

/* ---------- "teacher pointing at the board" highlight ----------
   Subtle by default; a little more present for diagrams/plots/equations
   since those benefit most from a clear "this is what I'm talking about". */
.board-block.tutor-focus{
  position:relative;
  border-radius:8px;
  transition:transform .3s ease, filter .3s ease, box-shadow .3s ease, background .3s ease;
  background:rgba(215,236,251,0.45);
  box-shadow:0 0 0 6px rgba(215,236,251,0.45);
}
.board-block.tutor-focus.b-text,
.board-block.tutor-focus.b-equation,
.board-block.tutor-focus.b-heading{
  filter:none;
}
.board-block.tutor-focus.b-diagram,
.board-block.tutor-focus.b-plot,
.board-block.tutor-focus.b-figure{
  transform:scale(1.015);
  box-shadow:0 0 0 8px rgba(215,236,251,0.5), 0 6px 22px rgba(30,60,100,0.10);
}
.board-block.tutor-focus::before{
  content:'';
  position:absolute;
  left:-14px; top:6px; bottom:6px;
  width:3px;
  border-radius:2px;
  background:var(--accent, #6EA8FE);
  opacity:.85;
}
/* Tiny, unobtrusive "tutor is explaining this" tick — a dot, not a banner. */
.board-block.tutor-focus::after{
  content:'';
  position:absolute;
  right:-10px; top:-10px;
  width:8px; height:8px;
  border-radius:50%;
  background:var(--accent, #6EA8FE);
  box-shadow:0 0 0 3px rgba(110,168,254,0.25);
}

/* ---------- floating pointer: a little chalk-tip arrow that moves to and
   points at whatever the tutor is currently talking about, in sync with
   speech. Fixed-position so it tracks correctly whether the board scrolled
   because the tutor moved it or because the user did. ---------- */
#tutor-pointer{
  position:fixed;
  left:0; top:0;
  width:0; height:0;
  border-top:7px solid transparent;
  border-bottom:7px solid transparent;
  border-left:11px solid var(--accent, #6EA8FE);
  filter:drop-shadow(0 1px 3px rgba(30,60,100,.35));
  opacity:0;
  pointer-events:none;
  z-index:60;
  transition: top .38s cubic-bezier(.4,0,.2,1), left .38s cubic-bezier(.4,0,.2,1), opacity .25s ease;
}
#tutor-pointer.active{ opacity:1; }
#tutor-pointer::before{
  content:'';
  position:absolute;
  left:-25px; top:-9px;
  width:12px; height:12px;
  border-radius:50%;
  background:var(--accent, #6EA8FE);
  opacity:.35;
  animation:tutor-pointer-pulse 1.15s ease-in-out infinite;
}
@keyframes tutor-pointer-pulse{
  0%,100%{ transform:scale(.8); opacity:.35; }
  50%{ transform:scale(1.4); opacity:.08; }
}
@media (prefers-reduced-motion: reduce){
  #tutor-pointer::before{ animation:none; }
}

.b-heading{
  font-family:'Kalam', cursive;
  font-weight:700;
  font-size:30px;
  line-height:1.3;
  margin:30px 0 14px;
  padding-bottom:8px;
  border-bottom:2.5px solid currentColor;
  display:inline-block;
  word-wrap:break-word;
  max-width:100%;
}
.b-heading:first-child{margin-top:0;}

.b-text{
  font-family:'Inter', -apple-system, sans-serif;
  font-size:16.5px;
  line-height:1.65;
  margin:0 0 12px;
  word-wrap:break-word;
  max-width:100%;
}
.b-text.hand{
  font-family:'Kalam', cursive;
  font-size:19px;
}

.b-equation{
  font-family:'Kalam', 'JetBrains Mono', monospace;
  font-size:19px;
  line-height:1.5;
  background:#F7FBFF;
  border:1px solid var(--panel-border);
  border-left:3px solid var(--ochre);
  border-radius:6px;
  padding:14px 18px;
  margin:6px 0 14px;
  display:block;
  word-break:break-word;
}
.eq-text{
  white-space:pre-wrap;
}

/* handwritten inline fraction: real stacked numerator/denominator instead
   of flat "a/b" text, drawn to look like it was written with a pen. */
.frac{
  display:inline-flex;
  flex-direction:column;
  align-items:center;
  vertical-align:middle;
  margin:0 3px;
  line-height:1.05;
  transform:translateY(0.05em);
}
.frac-num{
  padding:0 3px 2px;
  border-bottom:1.6px solid currentColor;
}
.frac-den{
  padding:2px 3px 0;
}

.b-diagram{
  margin:14px auto 20px;
  padding:14px;
  background:#fff;
  border:1px solid var(--panel-border);
  border-radius:10px;
  display:flex;
  justify-content:center;
  max-width:100%;
}
.b-diagram svg{ width:100%; height:auto; max-width:520px; display:block; }

.b-plot{
  margin:14px auto 20px;
  padding:12px;
  background:#fff;
  border:1px solid var(--panel-border);
  border-radius:10px;
  max-width:100%;
}
.b-plot canvas{ width:100%; height:auto; display:block; }
.b-plot .b-plot-title{
  font-family:'Inter',sans-serif; font-weight:600; font-size:13px; color:var(--muted);
  text-align:center; margin-bottom:6px; letter-spacing:.2px;
}

.b-figure{
  margin:14px auto 22px;
  max-width:100%;
  text-align:center;
}
.b-figure img{
  width:100%;
  max-width:520px;
  border-radius:8px;
  border:1px solid var(--panel-border);
  display:block;
  margin:0 auto;
}
.b-figure figcaption{
  font-family:'Inter',sans-serif;
  font-size:12.5px;
  color:var(--muted);
  margin-top:7px;
}

#scroll-to-latest{
  position:fixed;
  right:22px;
  bottom:140px;
  z-index:19;
  background:#fff;
  border:1px solid var(--panel-border);
  box-shadow:0 3px 12px rgba(0,0,0,0.1);
  border-radius:20px;
  padding:7px 14px;
  font-family:'Inter',sans-serif;
  font-size:12.5px;
  font-weight:600;
  color:var(--ochre);
  cursor:pointer;
  opacity:0;
  pointer-events:none;
  transform:translateY(6px);
  transition:opacity .18s ease, transform .18s ease;
}
#scroll-to-latest.show{opacity:1;pointer-events:auto;transform:translateY(0);}

@media (max-width:600px){
  #board-content{padding:88px 16px 240px;}
  .b-heading{font-size:24px !important;}
  .b-text{font-size:15.5px;}
  .b-text.hand{font-size:18px;}
}

.ambient-halo{
  position:fixed;
  inset:0;
  z-index:1;
  overflow:hidden;
  pointer-events:none;
}
.ambient-halo::before,
.ambient-halo::after{
  content:'';
  position:absolute;
  width:65vmax;height:65vmax;
  border-radius:50%;
  filter:blur(80px);
  opacity:0.35;
  mix-blend-mode:screen;
}
.ambient-halo::before{
  top:-20%; left:-15%;
  background:radial-gradient(circle, var(--halo-blue) 0%, rgba(0,153,255,0) 70%);
  animation:haloDrift1 22s ease-in-out infinite;
}
.ambient-halo::after{
  bottom:-25%; right:-15%;
  background:radial-gradient(circle, var(--halo-blue-soft) 0%, rgba(0,229,255,0) 70%);
  animation:haloDrift2 26s ease-in-out infinite;
}
@keyframes haloDrift1{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(12%,10%) scale(1.18); }
}
@keyframes haloDrift2{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(-10%,-8%) scale(1.15); }
}

.topbar{
  position:fixed;
  top:0;left:0;right:0;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  padding:18px 20px;
  pointer-events:none;
  z-index:20;
}
.topbar > *{pointer-events:auto;}
.icon-btn{
  width:40px;height:40px;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(6px);
  box-shadow:0 1px 4px rgba(0,0,0,0.08), var(--btn-glow);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:16px;
  color:var(--ink);
}
.icon-btn:hover{background:#fff;}
.top-right-cluster{display:flex;gap:10px;align-items:flex-start;}
.topbar-btn-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}
.status-chip{
  font-family:'JetBrains Mono', monospace;
  font-size:10.5px;
  color:var(--muted);
  background:rgba(255,255,255,0.7);
  padding:6px 10px;
  border-radius:20px;
  align-self:center;
  margin-right:4px;
}

.btn-label{
  font-family:'JetBrains Mono', monospace;
  font-size:9px;
  color:var(--muted);
  letter-spacing:0.2px;
  white-space:nowrap;
  background:rgba(255,255,255,0.85);
  padding:1px 6px;
  border-radius:8px;
}

.caption-zone{
  position:fixed;
  left:0;right:0;
  bottom:0;
  background:linear-gradient(to top, rgba(255,255,255,0.98) 60%, rgba(255,255,255,0.9));
  border-top:1px solid var(--panel-border);
  backdrop-filter:blur(8px);
  padding:10px 200px 8px;
  min-height:20px;
  display:flex;
  justify-content:center;
  z-index:18;
  pointer-events:none;
  box-shadow:0 -4px 16px rgba(0,0,0,0.04);
}
.caption-text{
  max-width:760px;
  text-align:center;
  font-size:16px;
  line-height:1.5;
  color:#3a372e;
}
.caption-text .fading{color:#b9b295;}

.avatar-cluster{
  position:fixed;
  left:22px;bottom:70px;
  display:flex;
  align-items:center;
  gap:10px;
  z-index:20;
}
.avatar{
  width:52px;height:52px;
  border-radius:50%;
  background:#fff;
  border:2px solid var(--panel-border);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
  position:relative;
}
.avatar.speaking{border-color:var(--ochre);}
.avatar.speaking::after{
  content:'';
  position:absolute; inset:-6px;
  border-radius:50%;
  border:2px solid var(--ochre);
  opacity:0.5;
  animation:ripple 1.6s ease-out infinite;
}
@keyframes ripple{0%{transform:scale(0.85);opacity:0.6;}100%{transform:scale(1.25);opacity:0;}}
.cluster-btn-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}
.cluster-btn{
  width:38px;height:38px;border-radius:50%;
  border:1px solid var(--panel-border);
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:15px;color:var(--ink);
  box-shadow:0 1px 4px rgba(0,0,0,0.06), var(--btn-glow);
}
.cluster-btn:hover{background:#faf8f2;}

.mic-zone{
  position:fixed;
  right:22px;bottom:70px;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}
.mic-btn{
  width:56px;height:56px;border-radius:50%;
  border:none;
  background:var(--brick);
  color:#fff;
  font-size:20px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(168,75,57,0.35), var(--btn-glow);
}
.mic-btn.live{animation:mic-pulse 1.3s ease-in-out infinite;}
.mic-btn.unsupported{background:#c9c4b5;box-shadow:none;cursor:not-allowed;}
@keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(168,75,57,.45), var(--btn-glow);}50%{box-shadow:0 0 0 10px rgba(168,75,57,0), var(--btn-glow);}}

.ask-zone{
  position:fixed;
  left:50%;
  bottom:70px;
  transform:translateX(-50%);
  z-index:20;
  display:flex;
  gap:8px;
  align-items:center;
  background:#fff;
  border:1px solid var(--panel-border);
  border-radius:30px;
  padding:6px 6px 6px 14px;
  box-shadow:0 3px 14px rgba(0,0,0,0.08), var(--btn-glow);
  width:min(520px, 44vw);
}
.ask-zone input[type="text"]{
  flex:1;
  border:none;outline:none;
  font-family:'Source Serif 4', serif;
  font-size:14px;
  padding:8px 0;
  background:transparent;
}
#btn-attach { 
  background: transparent; color: var(--muted); font-size: 18px; 
  border:none; cursor:pointer; width:36px; height:36px; 
  display:flex; align-items:center; justify-content:center; border-radius:50%; flex-shrink:0;
  box-shadow: var(--btn-glow);
}
#btn-attach:hover { background: #f0f4f8; color: var(--ink); }

.ask-zone button#btn-ask{
  width:36px;height:36px;border-radius:50%;
  border:none;background:var(--ink);color:#fff;
  cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  box-shadow: var(--btn-glow);
}
.ask-zone button#btn-ask:hover{background:var(--ochre);}

.overlay{
  position:fixed;inset:0;
  background:rgba(20,18,12,0.25);
  z-index:29;
  opacity:0;pointer-events:none;
  transition:opacity .2s ease;
}
.overlay.open{opacity:1;pointer-events:auto;}

.side-panel{
  position:fixed;
  top:0;left:0;bottom:0;
  width:360px;
  background:var(--panel);
  border-right:1px solid var(--panel-border);
  z-index:30;
  transform:translateX(-100%);
  transition:transform .25s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;
  box-shadow:8px 0 30px rgba(0,0,0,0.08);
}
.side-panel.open{transform:translateX(0);}

.panel-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 20px;border-bottom:1px solid var(--panel-border);
}
.panel-head h1{
  font-size:19px;margin:0;font-weight:600;
}
.panel-head h1 em{color:var(--ochre);font-style:italic;}
.panel-close{
  background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);
}

.panel-body{flex:1;overflow-y:auto;}
.p-section{padding:16px 20px;border-bottom:1px solid var(--panel-border);}
.p-section h2{
  font-family:'JetBrains Mono', monospace;
  font-size:10.5px;letter-spacing:0.4px;color:var(--muted);
  margin:0 0 10px 0;
  display:flex;justify-content:space-between;align-items:center;
}
.link-btn{
  font-family:'JetBrains Mono', monospace;font-size:10px;
  color:var(--ochre);background:none;border:none;cursor:pointer;
}
.link-btn:hover{text-decoration:underline;}

.upload-zone{
  border:1.5px dashed #d8d2bd;border-radius:6px;padding:14px;
  text-align:center;cursor:pointer;font-size:13px;color:#7a7361;
  transition:border-color .15s ease;
}
.upload-zone:hover{border-color:var(--ochre);}
.upload-zone.has-file{border-style:solid;border-color:var(--sage);color:var(--ink);text-align:left;}
.file-name{font-weight:600;font-size:12.5px;}
.file-meta{font-family:'JetBrains Mono', monospace;font-size:10px;color:var(--muted);margin-top:3px;}
#pdf-input{display:none;}

.topic-input{
  width:100%;padding:10px 11px;border:1px solid var(--panel-border);border-radius:6px;
  font-family:'Source Serif 4', serif;font-size:13px;resize:none;height:56px;
}
.topic-input:focus{outline:none;border-color:var(--ochre);}
select.topic-input{font-family:'Source Serif 4', serif;background:#fff;cursor:pointer;}
.p-row{display:flex;gap:8px;margin-top:9px;}
.p-btn{
  flex:1;font-family:'Source Serif 4', serif;font-size:13px;
  border:1px solid var(--ink);background:transparent;color:var(--ink);
  padding:8px 10px;border-radius:5px;cursor:pointer;
  box-shadow: var(--btn-glow);
}
.p-btn.primary{background:var(--ink);color:#fff;}
.p-btn:hover{background:var(--ochre);border-color:var(--ochre);color:#fff;}

.session-list{max-height:130px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;}
.session-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 9px;border:1px solid var(--panel-border);border-radius:5px;
  font-size:12px;cursor:pointer;
}
.session-item:hover{border-color:var(--ochre);}
.session-item .s-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.session-item .s-date{font-family:'JetBrains Mono', monospace;font-size:9.5px;color:var(--muted);flex-shrink:0;margin-left:8px;}

.transcript{padding:14px 20px;display:flex;flex-direction:column;gap:12px;}
.msg{font-size:13px;line-height:1.5;}
.msg .who{font-family:'JetBrains Mono', monospace;font-size:9.5px;letter-spacing:0.3px;display:block;margin-bottom:3px;}
.msg.tutor .who{color:var(--ochre);}
.msg.user .who{color:var(--sage);}
.msg.user{color:#514d41;padding-left:9px;border-left:2px solid var(--sage);}
.empty-note{font-size:12px;color:var(--muted);font-style:italic;}

.quiz-card{background:#fdfcf7;border:1px solid var(--panel-border);border-radius:6px;padding:14px;margin-top:2px;}
.quiz-q{font-size:13px;font-weight:600;margin-bottom:9px;line-height:1.4;}
.quiz-opt{
  display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:6px;
  border:1px solid var(--panel-border);border-radius:5px;background:#fff;
  font-family:'Source Serif 4', serif;font-size:12.5px;cursor:pointer;
}
.quiz-opt:hover{border-color:var(--ochre);}
.quiz-opt.correct{background:#eaf1ec;border-color:var(--sage);}
.quiz-opt.incorrect{background:#f6e9e5;border-color:var(--brick);}
.quiz-opt:disabled{cursor:default;}
.quiz-explain{font-size:12px;margin-top:9px;padding-top:9px;border-top:1px solid var(--panel-border);color:#514d41;display:none;}
.quiz-explain.show{display:block;}

::-webkit-scrollbar{width:7px;}
::-webkit-scrollbar-thumb{background:#e4ddc8;border-radius:4px;}

/* --- handwritten look --- */
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Kalam:wght@400;700&family=Caveat:wght@600;700&display=swap');
body, p, li, a, span, div, h1, h2, h3, h4, h5, h6, button, label, input, textarea, nav, footer{
  font-family:'Patrick Hand','Kalam',cursive !important;
  letter-spacing:0.2px;
}
h1, h2, .brand{ font-family:'Caveat',cursive !important; }
</style>

<body>

<div class="ambient-halo"></div>
<div id="board-scroll">
  <div id="board-content" class="empty"></div>
</div>
<div id="tutor-pointer" aria-hidden="true"></div>
<div id="scroll-to-latest">↓ Jump to latest</div>

<div class="topbar">
  <div class="topbar-btn-wrap">
    <a class="icon-btn" href="#" title="Back to Chalkline" style="text-decoration:none;display:flex;align-items:center;justify-content:center;" onclick="parent.postMessage({nav:'home'},'*');return false;">🏠</a>
    <span class="btn-label">Home</span>
  </div>
  <div class="topbar-btn-wrap">
    <button class="icon-btn" id="btn-menu" title="Menu">☰</button>
    <span class="btn-label">Menu</span>
  </div>
  <div class="top-right-cluster">
    <div class="status-chip" id="status-line">idle</div>
    <div class="topbar-btn-wrap">
      <button class="icon-btn" id="zoom-reset" title="Scroll to top">⤾</button>
      <span class="btn-label">To top</span>
    </div>
    <div class="topbar-btn-wrap">
      <button class="icon-btn" id="btn-clear" title="Clear board">🗑</button>
      <span class="btn-label">Clear</span>
    </div>
    <div class="topbar-btn-wrap">
      <button class="icon-btn" id="btn-save" title="Save session">⬇</button>
      <span class="btn-label">Save</span>
    </div>
    <div class="topbar-btn-wrap">
      <button class="icon-btn" id="btn-export-pdf" title="Export board as PDF">📄</button>
      <span class="btn-label">Export PDF</span>
    </div>
  </div>
</div>

<div class="caption-zone">
  <div class="caption-text" id="caption-text"></div>
</div>

<div class="avatar-cluster">
  <div class="cluster-btn-wrap">
    <div class="avatar" id="avatar">🧑‍🏫</div>
    <span class="btn-label">Tutor</span>
  </div>
  <div class="cluster-btn-wrap">
    <button class="cluster-btn" id="btn-toggle-transcript" title="Show transcript">💬</button>
    <span class="btn-label">Transcript</span>
  </div>
  <div class="cluster-btn-wrap">
    <button class="cluster-btn" id="btn-replay" title="Replay narration">🔊</button>
    <span class="btn-label">Replay</span>
  </div>
</div>

<div class="ask-zone">
  <button id="btn-attach" title="Attach Document">📎</button>
  <input type="file" id="ask-file-input" accept="application/pdf" style="display:none;">
  <input type="text" id="ask-input" placeholder="Ask a follow-up…">
  <button id="btn-ask" title="Send">➤</button>
</div>

<div class="mic-zone">
  <button class="mic-btn" id="btn-mic" title="Talk to your tutor">🎙</button>
  <span class="btn-label">Talk</span>
</div>

<!-- SIDE PANEL -->
<div class="overlay" id="overlay"></div>
<div class="side-panel" id="side-panel">
  <div class="panel-head">
    <h1>Chalk<em>line</em></h1>
    <button class="panel-close" id="btn-panel-close">✕</button>
  </div>
  <div class="panel-body">
    <div class="p-section">
      <h2>Saved sessions <button class="link-btn" id="btn-new-session">new</button></h2>
      <div class="session-list" id="session-list"><div class="empty-note">No saved sessions yet.</div></div>
    </div>
    <div class="p-section">
      <h2>AI brain</h2>
      <select class="topic-input" id="brain-select" style="height:auto;padding:9px 10px;">
        <option value="auto" selected>Auto (Groq → Gemini → OpenRouter)</option>
        <option value="groq">Groq (Llama)</option>
        <option value="gemini">Google Gemini</option>
        <option value="openrouter">OpenRouter (free models)</option>
        <option value="cerebras">Cerebras (Llama)</option>
      </select>
      <div class="file-meta" style="margin-top:6px;">Requests go through the Chalkline proxy — automatically selects the best available provider.</div>
    </div>
    <div class="p-section">
      <h2>Narrator voice</h2>
      <select class="topic-input" id="voice-select" style="height:auto;padding:9px 10px;"></select>
      <div class="file-meta" style="margin-top:6px;">"Natural" voices are ElevenLabs or Google Cloud (free tiers, richer sound). Browser voices are free and instant but more robotic. Falls back to browser voice automatically if a natural voice can't be reached.</div>
    </div>
    <div class="p-section">
      <h2>Source material</h2>
      <div class="upload-zone" id="upload-zone">
        Drop a PDF, or click to import a chapter, slide deck or notes.
        <input type="file" id="pdf-input" accept="application/pdf">
      </div>

    <div class="p-section">
      <h2>Ask to be taught</h2>
      <textarea class="topic-input" id="topic-input" placeholder="e.g. 'Explain price elasticity of demand'"></textarea>

    </div>
  </div>
</div>

<script>
/* =========================================================
   STUDDY-STYLE WHITEBOARD: vertical document-flow renderer
   -----------------------------------------------------------
   Replaces the old infinite-canvas / camera / auto-stacking
   system. The AI still emits the exact same command schema
   (text, halo, line, arrow, rect, circle, curve, path, axes,
   plot, image, highlight) — this module just lays those
   commands out as real DOM blocks that flow top-to-bottom in
   a normal scrollable document, instead of painting them onto
   a pannable/zoomable canvas at absolute world coordinates.
   ========================================================= */

const boardScroll = document.getElementById('board-scroll');
const boardContent = document.getElementById('board-content');
const scrollLatestBtn = document.getElementById('scroll-to-latest');
const tutorPointer = document.getElementById('tutor-pointer');

// Kept only for backward-compatibility with session save/load code
// further down the file, which still reads/writes these names.
const TOP_MARGIN = 0;
let camera = { x: 500, y: 300, scale: 1 };
let globalCursorY = TOP_MARGIN;
let currentTopicLabel = 'Topic';

let drawnCommands = [];      // full flat history of every command ever rendered (for session save)
let drawQueue = [];          // pending render "descriptors" waiting to be revealed
let drawing = false;
let pacingScale = 1;         // stretches/compresses reveal speed to match narration length
let userIsScrolledAway = false;

/* ---------- tutor "pointing at the board" system ----------
   Every board command gets a stable id the moment it's first created (see
   nextBlockId/appendBlockForCommand/flushVectorGroup below). boardElementMap
   maps that id -> its live DOM element, so the narration can look an element
   back up at any point later — after scrolling, after a session reload,
   after the board has been rebuilt from drawnCommands, doesn't matter. */
let blockIdCounter = 0;
function nextBlockId(){ return 'board-block-' + (blockIdCounter++); }
const boardElementMap = new Map();     // stable id -> DOM element
let lastAppendedBlockId = null;        // used as the "infer the most recent item" fallback

let currentTurnBoardCommands = [];     // this turn's `board` array (post image/placeholder resolution)
let currentTurnBreakpoints = null;     // [{charStart, refs}] aligned to this turn's `speech` string, or null
let currentlyFocusedIds = new Set();   // ids currently wearing .tutor-focus
let pendingFocusTimers = [];           // setTimeout handles for "wait for it to be drawn" retries
let lastAppliedBreakpointCharStart = -1;

const COLORS = {
  chalk:'#1E2B3A', ink:'#1E2B3A', ochre:'#2E7DBE', sage:'#3E8FA6', brick:'#3D6B93',
  teal:'#0F8C82', violet:'#7C5CBF', sky:'#2AA9E0', coral:'#E0665A',
  halo:'#6EA8FE', highlight:'#D7ECFB'
};
function colorFor(name){ return COLORS[name] || COLORS.ink; }

/* ---------- scroll tracking: never fight the user ---------- */
function isNearBottom(){
  const slack = 120;
  return boardScroll.scrollHeight - boardScroll.scrollTop - boardScroll.clientHeight < slack;
}
function checkIfScrolledAway(){
  userIsScrolledAway = !isNearBottom();
  scrollLatestBtn.classList.toggle('show', userIsScrolledAway && boardContent.children.length > 0);
}
boardScroll.addEventListener('scroll', () => { checkIfScrolledAway(); updateTutorPointerPosition(); }, { passive:true });
scrollLatestBtn.addEventListener('click', () => {
  userIsScrolledAway = false;
  boardScroll.scrollTo({ top: boardScroll.scrollHeight, behavior:'smooth' });
  scrollLatestBtn.classList.remove('show');
});

function scrollToBottomIfFollowing(smooth){
  if(userIsScrolledAway) return;
  boardScroll.scrollTo({ top: boardScroll.scrollHeight, behavior: smooth===false ? 'auto' : 'smooth' });
}

/* ---------- "teacher pointing at the board" focus system ----------
   Resolves the AI's speechSegments[].boardRefs into live elements, scrolls
   to them only when genuinely needed, and applies/removes the .tutor-focus
   highlight as narration moves on — including scrolling BACK UP when the
   tutor refers to something taught earlier. */

function elementComfortablyVisible(el){
  const outer = boardScroll.getBoundingClientRect();
  const rect = el.getBoundingClientRect();
  const margin = 48;
  return rect.top >= outer.top + margin && rect.bottom <= outer.bottom - margin;
}

// Only scrolls if the element isn't already comfortably in view, and never
// fights a user who has manually scrolled away (same rule the rest of the
// board follows — see userIsScrolledAway / checkIfScrolledAway above).
function focusBoardElement(element){
  if(!element) return;
  if(userIsScrolledAway) return;
  if(elementComfortablyVisible(element)) return;
  element.scrollIntoView({ behavior:'smooth', block:'center' });
}

/* ---------- the floating pointer itself ----------
   Tracks whichever element is the PRIMARY current focus (the first ref in
   the active breakpoint) and keeps its tip against that element's left
   edge, vertically centered on whatever portion of it is actually visible
   — so it stays sensible even while a smooth scroll is still animating,
   and hides itself gracefully if its target is fully off-screen. */
let tutorPointerTargetId = null;

function updateTutorPointerPosition(){
  if(!tutorPointerTargetId){ tutorPointer.classList.remove('active'); return; }
  const el = boardElementMap.get(tutorPointerTargetId);
  if(!el || !el.isConnected){ tutorPointer.classList.remove('active'); return; }
  const rect = el.getBoundingClientRect();
  const visTop = Math.max(rect.top, 0);
  const visBottom = Math.min(rect.bottom, window.innerHeight);
  if(visBottom - visTop < 4){ tutorPointer.classList.remove('active'); return; }
  const y = (visTop + visBottom) / 2;
  const x = Math.max(rect.left - 16, 6);
  tutorPointer.style.left = x + 'px';
  tutorPointer.style.top = y + 'px';
  tutorPointer.classList.add('active');
}

function setTutorPointerTarget(id){
  tutorPointerTargetId = id || null;
  // Run now and again next frame — the target's position may still be
  // settling (e.g. right after it was first drawn, before layout/reflow).
  updateTutorPointerPosition();
  requestAnimationFrame(updateTutorPointerPosition);
}

window.addEventListener('resize', updateTutorPointerPosition);

// A ref is either:
//   - a number: an index into THIS turn's `board` array (a just-drawn item)
//   - a string: a short snippet of text to search for among ALL board items
//     ever rendered (a back-reference to something taught earlier, so the
//     AI can point at the existing element instead of redrawing it)
function resolveBoardRef(ref){
  if(typeof ref === 'number'){
    const cmd = currentTurnBoardCommands[ref];
    if(!cmd || !cmd.id) return null;
    const el = boardElementMap.get(cmd.id);
    return el ? { id: cmd.id, el } : null;
  }
  if(typeof ref === 'string'){
    const needle = ref.toLowerCase().replace(/^ref:/,'').trim();
    if(!needle) return null;
    let best = null;
    // Map preserves insertion order, so the last match found is the most
    // recently-taught matching element — the natural "refer back" target.
    boardElementMap.forEach((el, id) => {
      const hay = (el.textContent || '').toLowerCase();
      if(hay && hay.includes(needle)) best = { id, el };
    });
    return best;
  }
  return null;
}

function cancelPendingFocusTimers(){
  pendingFocusTimers.forEach(t => clearTimeout(t));
  pendingFocusTimers = [];
}

// Removes highlight from anything not in `resolved`, adds it to anything
// newly referenced, and scrolls (at most once) to the primary reference.
function setActiveFocusElements(resolved, myToken){
  if(myToken !== currentSpeechToken) return;
  const newIds = new Set(resolved.map(r => r.id));
  currentlyFocusedIds.forEach(id => {
    if(!newIds.has(id)){
      const el = boardElementMap.get(id);
      if(el) el.classList.remove('tutor-focus');
    }
  });
  let scrolled = false;
  resolved.forEach(({id, el}) => {
    if(!el) return;
    el.classList.add('tutor-focus');
    if(!scrolled){ focusBoardElement(el); scrolled = true; }
  });
  currentlyFocusedIds = newIds;
  // The pointer always tracks the PRIMARY reference — the first one in this
  // breakpoint — so it settles on one clear target even when a sentence
  // names two things at once (e.g. "compare the curve with the equation").
  setTutorPointerTarget(resolved.length ? resolved[0].id : null);
}

function clearBoardFocus(){
  currentlyFocusedIds.forEach(id => {
    const el = boardElementMap.get(id);
    if(el) el.classList.remove('tutor-focus');
  });
  currentlyFocusedIds.clear();
  lastAppliedBreakpointCharStart = -1;
  cancelPendingFocusTimers();
  setTutorPointerTarget(null);
}

// Resolves a breakpoint's refs into elements, retrying briefly if a
// just-mentioned board item hasn't finished being drawn yet (the drawing
// queue and the narration are paced to track each other, but aren't
// perfectly locked together). Falls back to "the most recently drawn item"
// when there's nothing else to go on — this is also the entire code path
// used for old AI responses that never included speechSegments at all.
function applyFocusForRefs(refs, myToken, attemptsLeft){
  if(myToken !== currentSpeechToken) return;
  const resolved = [];
  let anyKnownButUndrawn = false;
  (refs || []).forEach(ref => {
    const r = resolveBoardRef(ref);
    if(r) resolved.push(r);
    else if(typeof ref === 'number' && currentTurnBoardCommands[ref]) anyKnownButUndrawn = true;
  });
  if(resolved.length === 0 && anyKnownButUndrawn && attemptsLeft > 0){
    const t = setTimeout(() => applyFocusForRefs(refs, myToken, attemptsLeft - 1), 220);
    pendingFocusTimers.push(t);
    return;
  }
  if(resolved.length === 0 && lastAppendedBlockId){
    const el = boardElementMap.get(lastAppendedBlockId);
    if(el) resolved.push({ id: lastAppendedBlockId, el });
  }
  setActiveFocusElements(resolved, myToken);
}

// Called whenever spoken narration crosses into a new breakpoint's region —
// from a chunk boundary (always available) or, when the browser supports
// it, a finer-grained utterance.onboundary word event.
function updateFocusForCharOffset(absCharOffset, myToken){
  if(myToken !== currentSpeechToken) return;
  if(!currentTurnBreakpoints){
    // No explicit speechSegments this turn — just keep pointing at whatever
    // was most recently drawn, so the tutor still "follows" its own pen.
    applyFocusForRefs(null, myToken, 0);
    return;
  }
  let active = null;
  for(const bp of currentTurnBreakpoints){
    if(bp.charStart <= absCharOffset) active = bp; else break;
  }
  if(!active || active.charStart === lastAppliedBreakpointCharStart) return;
  lastAppliedBreakpointCharStart = active.charStart;
  applyFocusForRefs(active.refs, myToken, 5);
}

// Builds the char-offset -> boardRefs alignment for one turn by locating
// each speechSegment's text within the full `speech` string. Best-effort:
// a segment that can't be located (paraphrased slightly differently than
// the model wrote it) is simply skipped rather than breaking the rest.
function buildSpeechBoardAlignment(speechText, speechSegments){
  if(!speechText || !Array.isArray(speechSegments) || speechSegments.length === 0) return null;
  const breakpoints = [];
  let searchFrom = 0;
  for(const seg of speechSegments){
    if(!seg || typeof seg.text !== 'string' || !seg.text.trim()) continue;
    const needle = seg.text.trim();
    let idx = speechText.indexOf(needle, searchFrom);
    if(idx === -1){
      const firstWords = needle.split(/\s+/).slice(0,6).join(' ');
      idx = firstWords ? speechText.indexOf(firstWords, searchFrom) : -1;
    }
    if(idx === -1) continue;
    breakpoints.push({ charStart: idx, refs: Array.isArray(seg.boardRefs) ? seg.boardRefs : [] });
    searchFrom = idx + needle.length;
  }
  breakpoints.sort((a,b) => a.charStart - b.charStart);
  return breakpoints.length ? breakpoints : null;
}

/* ---------- board lifecycle ---------- */
function clearBoard(record=true){
  if(record) drawnCommands = [];
  boardContent.innerHTML = '';
  boardContent.classList.add('empty');
  pendingVectorGroup = [];
  boardElementMap.clear();
  lastAppendedBlockId = null;
  clearBoardFocus();
}
function resetRegionCursors(){
  globalCursorY = TOP_MARGIN;
  userIsScrolledAway = false;
  boardScroll.scrollTo({ top: 0, behavior:'auto' });
  scrollLatestBtn.classList.remove('show');
}
// Rebuilds the entire board from a flat command history — used on session
// load, and aliased as `redrawAll` since older code (session restore) still
// calls that name.
function rebuildBoard(commands){
  boardContent.innerHTML = '';
  pendingVectorGroup = [];
  boardElementMap.clear();
  lastAppendedBlockId = null;
  clearBoardFocus();
  // Re-establish the id counter above the highest id already used in this
  // history, so newly-generated commands after a reload never collide with
  // stable ids that old sessions (and old back-references) still rely on.
  let maxSeen = -1;
  (commands || []).forEach(cmd => {
    const m = typeof cmd.id === 'string' && /^board-block-(\d+)$/.exec(cmd.id);
    if(m) maxSeen = Math.max(maxSeen, parseInt(m[1], 10));
  });
  if(maxSeen >= blockIdCounter) blockIdCounter = maxSeen + 1;
  (commands || []).forEach(cmd => appendBlockForCommand(cmd, /*animate*/false));
  flushVectorGroup(false);
  boardContent.classList.toggle('empty', boardContent.children.length === 0);
  requestAnimationFrame(() => boardScroll.scrollTo({ top: boardScroll.scrollHeight, behavior:'auto' }));
}
function redrawAll(){ rebuildBoard(drawnCommands); }

/* ---------- geometry helpers for grouped vector diagrams ---------- */
const VECTOR_TYPES = new Set(['line','arrow','rect','circle','curve','path','halo','highlight']);
let pendingVectorGroup = [];

function pointsOfCommand(cmd, out){
  switch(cmd.type){
    case 'line': case 'arrow':
      out.push([cmd.x1,cmd.y1],[cmd.x2,cmd.y2]); break;
    case 'rect':
      out.push([cmd.x,cmd.y],[cmd.x+(cmd.w||0),cmd.y+(cmd.h||0)]); break;
    case 'circle':
      out.push([cmd.x-(cmd.rx||0),cmd.y-(cmd.ry||0)],[cmd.x+(cmd.rx||0),cmd.y+(cmd.ry||0)]); break;
    case 'curve':
      (cmd.points||[]).forEach(p=>out.push(p)); break;
    case 'path':
      (cmd.segments||[]).forEach(seg=>{
        for(let i=1;i<seg.length;i+=2){ out.push([seg[i], seg[i+1]]); }
      }); break;
    case 'halo':
      out.push([cmd.x-(cmd.r||0),cmd.y-(cmd.r||0)],[cmd.x+(cmd.r||0),cmd.y+(cmd.r||0)]); break;
    case 'highlight':
      out.push([cmd.x,cmd.y],[cmd.x+(cmd.w||0),cmd.y+(cmd.h||0)]); break;
  }
}

function smoothPathD(points){
  if(!points || points.length < 2) return '';
  let d = `M ${points[0][0]} ${points[0][1]} `;
  if(points.length === 2){ d += `L ${points[1][0]} ${points[1][1]} `; return d; }
  for(let i=0;i<points.length-1;i++){
    const p0 = points[i===0?0:i-1], p1 = points[i], p2 = points[i+1], p3 = points[i+2===points.length+1?i+1:Math.min(i+2,points.length-1)];
    const cp1x = p1[0] + (p2[0]-p0[0])/6, cp1y = p1[1] + (p2[1]-p0[1])/6;
    const cp2x = p2[0] - (p3[0]-p1[0])/6, cp2y = p2[1] - (p3[1]-p1[1])/6;
    d += `C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2[0]} ${p2[1]} `;
  }
  return d;
}

function svgElFor(cmd, defs){
  const ns = 'http://www.w3.org/2000/svg';
  const color = colorFor(cmd.color);
  const width = cmd.width || 2.5;
  switch(cmd.type){
    case 'line': {
      const el = document.createElementNS(ns,'line');
      el.setAttribute('x1',cmd.x1); el.setAttribute('y1',cmd.y1);
      el.setAttribute('x2',cmd.x2); el.setAttribute('y2',cmd.y2);
      el.setAttribute('stroke',color); el.setAttribute('stroke-width',width);
      el.setAttribute('stroke-linecap','round');
      return el;
    }
    case 'arrow': {
      const g = document.createElementNS(ns,'g');
      const el = document.createElementNS(ns,'line');
      el.setAttribute('x1',cmd.x1); el.setAttribute('y1',cmd.y1);
      el.setAttribute('x2',cmd.x2); el.setAttribute('y2',cmd.y2);
      el.setAttribute('stroke',color); el.setAttribute('stroke-width',width);
      el.setAttribute('stroke-linecap','round');
      g.appendChild(el);
      const angle = Math.atan2(cmd.y2-cmd.y1, cmd.x2-cmd.x1);
      const headLen = Math.max(8, width*4);
      const hx1 = cmd.x2 - headLen*Math.cos(angle-Math.PI/7), hy1 = cmd.y2 - headLen*Math.sin(angle-Math.PI/7);
      const hx2 = cmd.x2 - headLen*Math.cos(angle+Math.PI/7), hy2 = cmd.y2 - headLen*Math.sin(angle+Math.PI/7);
      const head = document.createElementNS(ns,'polygon');
      head.setAttribute('points', `${cmd.x2},${cmd.y2} ${hx1},${hy1} ${hx2},${hy2}`);
      head.setAttribute('fill', color);
      g.appendChild(head);
      return g;
    }
    case 'rect': {
      const el = document.createElementNS(ns,'rect');
      el.setAttribute('x',cmd.x); el.setAttribute('y',cmd.y);
      el.setAttribute('width',cmd.w||0); el.setAttribute('height',cmd.h||0);
      el.setAttribute('rx',4);
      el.setAttribute('stroke',color); el.setAttribute('stroke-width',width);
      el.setAttribute('fill', cmd.fill ? color : 'none');
      if(cmd.fill) el.setAttribute('fill-opacity','0.12');
      return el;
    }
    case 'circle': {
      const el = document.createElementNS(ns,'ellipse');
      el.setAttribute('cx',cmd.x); el.setAttribute('cy',cmd.y);
      el.setAttribute('rx',cmd.rx||0); el.setAttribute('ry',cmd.ry||0);
      el.setAttribute('stroke',color); el.setAttribute('stroke-width',width);
      el.setAttribute('fill', cmd.fill ? color : 'none');
      if(cmd.fill) el.setAttribute('fill-opacity','0.12');
      return el;
    }
    case 'curve': {
      const el = document.createElementNS(ns,'path');
      let d = smoothPathD(cmd.points||[]);
      if(cmd.fill) d += 'Z';
      el.setAttribute('d', d);
      el.setAttribute('stroke',color); el.setAttribute('stroke-width',width);
      el.setAttribute('fill', cmd.fill ? colorFor(cmd.fillColor||cmd.color) : 'none');
      if(cmd.fill) el.setAttribute('fill-opacity', cmd.fillOpacity ?? 0.12);
      el.setAttribute('stroke-linejoin','round'); el.setAttribute('stroke-linecap','round');
      return el;
    }
    case 'path': {
      const el = document.createElementNS(ns,'path');
      let d = '';
      (cmd.segments||[]).forEach(seg=>{
        const [op, ...rest] = seg;
        d += op + ' ' + rest.join(' ') + ' ';
      });
      el.setAttribute('d', d.trim());
      el.setAttribute('stroke',color); el.setAttribute('stroke-width',width);
      el.setAttribute('fill', cmd.fill ? colorFor(cmd.fillColor||cmd.color) : 'none');
      if(cmd.fill) el.setAttribute('fill-opacity', cmd.fillOpacity ?? 0.12);
      el.setAttribute('stroke-linejoin','round'); el.setAttribute('stroke-linecap','round');
      return el;
    }
    case 'halo': {
      const el = document.createElementNS(ns,'circle');
      el.setAttribute('cx',cmd.x); el.setAttribute('cy',cmd.y); el.setAttribute('r',cmd.r||40);
      el.setAttribute('fill',colorFor(cmd.color||'halo'));
      el.setAttribute('opacity','0.22');
      return el;
    }
    case 'highlight': {
      const el = document.createElementNS(ns,'rect');
      el.setAttribute('x',cmd.x); el.setAttribute('y',cmd.y-(cmd.h||26));
      el.setAttribute('width',cmd.w||0); el.setAttribute('height',cmd.h||26);
      el.setAttribute('rx',4);
      el.setAttribute('fill',colorFor(cmd.color||'highlight'));
      el.setAttribute('opacity','0.45');
      return el;
    }
  }
  return null;
}

function flushVectorGroup(animate){
  if(pendingVectorGroup.length === 0) return;
  const group = pendingVectorGroup;
  pendingVectorGroup = [];

  const pts = [];
  group.forEach(cmd => pointsOfCommand(cmd, pts));
  if(pts.length === 0) return;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  pts.forEach(([x,y])=>{ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; });
  const pad = 24;
  minX-=pad; minY-=pad; maxX+=pad; maxY+=pad;
  const w = Math.max(40, maxX-minX), h = Math.max(40, maxY-minY);

  const wrap = document.createElement('div');
  wrap.className = 'board-block b-diagram';
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox', `${minX} ${minY} ${w} ${h}`);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  group.forEach(cmd => { const el = svgElFor(cmd); if(el) svg.appendChild(el); });
  wrap.appendChild(svg);
  boardContent.appendChild(wrap);
  revealBlock(wrap, animate);
  // A grouped diagram is one visual block made of several vector commands —
  // register the shared wrapper under every command id in the group, so a
  // reference to ANY of them (e.g. "the arrow on the demand curve") finds
  // the same element to scroll to / highlight.
  group.forEach(cmd => { if(cmd.id) boardElementMap.set(cmd.id, wrap); });
  const lastWithId = [...group].reverse().find(cmd => cmd.id);
  if(lastWithId) lastAppendedBlockId = lastWithId.id;
}

/* ---------- text wrapping is handled natively by the browser now;
   this only decides which visual "voice" a text command gets ---------- */
function looksLikeEquationOrList(cmd){
  if(cmd.mono) return true;
  const t = cmd.text || '';
  return /\.{3,}/.test(t) || /[=≈≤≥]/.test(t) && t.length < 90 && !/[.!?]$/.test(t.trim());
}

/* ---------- handwriting variance: deterministic per-line "hand" so the
   same content always looks the same, but different lines don't look
   machine-uniform — alternates between two handwriting typefaces and
   applies a tiny natural tilt, the way a real pen wobbles line to line. */
const HAND_FONTS = ["'Kalam', cursive", "'Caveat', cursive"];
function hashStr(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function applyHandwriting(el, text, maxTilt){
  const h = hashStr(text || '');
  el.style.fontFamily = HAND_FONTS[h % HAND_FONTS.length];
  const tilt = ((h % 100) / 100 - 0.5) * 2 * maxTilt;
  el.style.display = 'inline-block';
  el.style.transform = `rotate(${tilt.toFixed(2)}deg)`;
}

/* ---------- inline fraction rendering ----------
   Turns "a/b" style math fragments inside an equation string into a real
   stacked numerator/denominator (like actual handwritten math), instead of
   a flat "a/b". Still no LaTeX — this only recognises the plain notation
   the tutor already writes (dy/dx, (x+h)/2, 1/2, Δy/Δx, etc). */
const FRAC_PAREN = "\\((?:[^()]*|\\([^()]*\\))*\\)";
const FRAC_ATOM = "[A-Za-zΔΣ√πθβαγ0-9²³\\u2080-\\u2089]+";
const FRAC_RE = new RegExp(`(${FRAC_PAREN}|${FRAC_ATOM})\\/(${FRAC_PAREN}|${FRAC_ATOM})`, 'g');
function stripOuterParens(s){ return /^\(.*\)$/.test(s) ? s.slice(1,-1) : s; }

function buildEquationFragment(text){
  const frag = document.createDocumentFragment();
  let lastIndex = 0, m;
  FRAC_RE.lastIndex = 0;
  while((m = FRAC_RE.exec(text))){
    if(m.index > lastIndex) frag.appendChild(document.createTextNode(text.slice(lastIndex, m.index)));
    const fracEl = document.createElement('span');
    fracEl.className = 'frac';
    const num = document.createElement('span'); num.className = 'frac-num'; num.textContent = stripOuterParens(m[1]);
    const den = document.createElement('span'); den.className = 'frac-den'; den.textContent = stripOuterParens(m[2]);
    fracEl.appendChild(num); fracEl.appendChild(den);
    frag.appendChild(fracEl);
    lastIndex = FRAC_RE.lastIndex;
  }
  if(lastIndex < text.length) frag.appendChild(document.createTextNode(text.slice(lastIndex)));
  return frag;
}

function renderTextBlock(cmd){
  if(cmd.heading){
    const el = document.createElement('div');
    el.className = 'board-block b-heading';
    el.style.color = colorFor(cmd.color || 'ink');
    if(cmd.size) el.style.fontSize = Math.min(34, Math.max(20, cmd.size)) + 'px';
    el.textContent = cmd.text || '';
    applyHandwriting(el, cmd.text, 0.6);
    boardContent.appendChild(el);
    return el;
  }
  if(looksLikeEquationOrList(cmd)){
    const el = document.createElement('div');
    el.className = 'board-block b-equation';
    const inner = document.createElement('span');
    inner.className = 'eq-text';
    inner.style.color = colorFor(cmd.color || 'ink');
    if(cmd.size) inner.style.fontSize = Math.min(22, Math.max(15, cmd.size*0.7)) + 'px';
    inner.appendChild(buildEquationFragment(cmd.text || ''));
    applyHandwriting(inner, cmd.text, 1.0);
    el.appendChild(inner);
    boardContent.appendChild(el);
    return el;
  }
  const el = document.createElement('p');
  el.className = 'board-block b-text';
  el.style.color = colorFor(cmd.color || 'ink');
  if(cmd.weight >= 700) el.style.fontWeight = '600';
  el.textContent = cmd.text || '';
  boardContent.appendChild(el);
  return el;
}

/* ---------- static (non-animated) canvas-based plot/axes rendering ----------
   Each plot/axes command gets its OWN small canvas, sized to the block —
   this is NOT the old infinite/world canvas, just a self-contained chart. */
function plotScale(range, pxSize, margin){
  const [lo,hi] = range;
  return (v) => margin + ( (v-lo) / (hi-lo || 1) ) * (pxSize - margin*2);
}

function drawAxesOnCtx(ctx, W, H, cmd){
  const margin = 46;
  const xRange = cmd.xRange || [0,10];
  const yRange = cmd.yRange || [0,10];
  const sx = plotScale(xRange, W, margin);
  const syRaw = plotScale(yRange, H, margin);
  const sy = (v) => H - syRaw(v); // flip Y

  ctx.clearRect(0,0,W,H);
  ctx.font = '12px Inter, sans-serif';
  ctx.fillStyle = '#8CA0B3';
  ctx.strokeStyle = '#E3ECF3';
  ctx.lineWidth = 1;

  if(cmd.grid !== false){
    const xTicks = cmd.xTicks || null;
    const yTicks = cmd.yTicks || null;
    const nX = xTicks ? xTicks.length : 6;
    const nY = yTicks ? yTicks.length : 5;
    for(let i=0;i<nX;i++){
      const v = xRange[0] + (xRange[1]-xRange[0]) * (i/(nX-1));
      const x = sx(v);
      ctx.beginPath(); ctx.moveTo(x, margin*0.4); ctx.lineTo(x, H-margin*0.6); ctx.stroke();
      const label = xTicks ? xTicks[i] : v.toFixed(1);
      ctx.textAlign = 'center';
      ctx.fillText(String(label), x, H-margin*0.6+16);
    }
    for(let i=0;i<nY;i++){
      const v = yRange[0] + (yRange[1]-yRange[0]) * (i/(nY-1));
      const y = sy(v);
      ctx.beginPath(); ctx.moveTo(margin*0.6, y); ctx.lineTo(W-margin*0.4, y); ctx.stroke();
      const label = yTicks ? yTicks[i] : v.toFixed(1);
      ctx.textAlign = 'right';
      ctx.fillText(String(label), margin*0.6-8, y+4);
    }
  }

  ctx.strokeStyle = '#1E2B3A';
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(margin*0.6, H-margin*0.6); ctx.lineTo(W-margin*0.4, H-margin*0.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(margin*0.6, margin*0.4); ctx.lineTo(margin*0.6, H-margin*0.6); ctx.stroke();

  ctx.fillStyle = '#1E2B3A';
  ctx.font = '600 12.5px Inter, sans-serif';
  if(cmd.xlabel){ ctx.textAlign='center'; ctx.fillText(cmd.xlabel, W/2, H-6); }
  if(cmd.ylabel){
    ctx.save(); ctx.translate(14, H/2); ctx.rotate(-Math.PI/2); ctx.textAlign='center';
    ctx.fillText(cmd.ylabel, 0, 0); ctx.restore();
  }
  return { sx, sy, margin };
}

function renderPlotBlock(cmd){
  const wrap = document.createElement('div');
  wrap.className = 'board-block b-plot';
  if(cmd.title){
    const t = document.createElement('div');
    t.className = 'b-plot-title';
    t.textContent = cmd.title;
    wrap.appendChild(t);
  }
  const canvas = document.createElement('canvas');
  const cssW = 680, cssH = Math.round(cssW * ((cmd.h||400)/(cmd.w||800)));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = cssW*dpr; canvas.height = cssH*dpr;
  canvas.style.width = '100%';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  const { sx, sy } = drawAxesOnCtx(ctx, cssW, cssH, cmd);

  (cmd.curves||[]).forEach(curve=>{
    const pts = (curve.points||[]).map(([x,y]) => [sx(x), sy(y)]);
    if(pts.length < 2) return;
    ctx.strokeStyle = colorFor(curve.color || 'ochre');
    ctx.lineWidth = curve.width || 2.5;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    const d = smoothPathD(pts);
    const p2d = new Path2D(d);
    ctx.stroke(p2d);
  });

  // simple legend
  const labeled = (cmd.curves||[]).filter(c=>c.label);
  if(labeled.length){
    ctx.font = '12px Inter, sans-serif';
    let ly = 16;
    labeled.forEach(c=>{
      ctx.fillStyle = colorFor(c.color||'ochre');
      ctx.fillRect(cssW-140, ly-9, 12, 3);
      ctx.fillStyle = '#3a4a5a';
      ctx.textAlign = 'left';
      ctx.fillText(c.label, cssW-122, ly-3);
      ly += 18;
    });
  }

  wrap.appendChild(canvas);
  boardContent.appendChild(wrap);
  return wrap;
}

/* ---------- image (real photo/diagram fetched from Wikimedia) ---------- */
function renderImageBlock(cmd){
  const fig = document.createElement('figure');
  fig.className = 'board-block b-figure';
  const img = document.createElement('img');
  img.src = (cmd._img && cmd._img.src) || cmd.url || '';
  img.alt = cmd.alt || cmd.caption || cmd.query || '';
  const ratio = (cmd.w && cmd.h) ? (cmd.h/cmd.w) : 0.6;
  img.style.aspectRatio = `${cmd.w||640} / ${cmd.h||Math.round((cmd.w||640)*ratio)}`;
  fig.appendChild(img);
  if(cmd.caption){
    const cap = document.createElement('figcaption');
    cap.textContent = cmd.caption;
    fig.appendChild(cap);
  }
  boardContent.appendChild(fig);
  return fig;
}

/* ---------- dispatch ---------- */
function appendBlockForCommand(cmd, animate){
  if(VECTOR_TYPES.has(cmd.type)){
    pendingVectorGroup.push(cmd);
    return null;
  }
  // any non-vector command flushes a pending diagram group first, so
  // shapes never get visually interleaved with unrelated text/plots
  flushVectorGroup(animate);

  let el = null;
  if(cmd.type === 'text') el = renderTextBlock(cmd);
  else if(cmd.type === 'plot' || cmd.type === 'axes') el = renderPlotBlock(cmd);
  else if(cmd.type === 'image') el = renderImageBlock(cmd);
  if(el){
    revealBlock(el, animate);
    if(cmd.id){ boardElementMap.set(cmd.id, el); lastAppendedBlockId = cmd.id; }
  }
  boardContent.classList.remove('empty');
  return el;
}

function revealBlock(el, animate){
  if(animate === false){ el.classList.add('in'); return; }
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
}

/* ---------- pacing: how long to sit on a block before revealing the next
   one, so the writing pace roughly tracks the narration pace ---------- */
function estimateDuration(cmd){
  const base = (()=>{
    switch(cmd.type){
      case 'text': return Math.min(2200, Math.max(500,(cmd.text||'').length*45));
      case 'line': case 'arrow': return 260;
      case 'curve': return 420;
      case 'rect': return 320;
      case 'circle': return 320;
      case 'axes': return 400;
      case 'plot': return 500 + ((cmd.curves||[]).length)*350;
      case 'image': return 700;
      case 'highlight': return 180;
      case 'halo': return 260;
      case 'path': return Math.min(1800, Math.max(400, (cmd.segments||[]).length*160));
      default: return 250;
    }
  })();
  return base * pacingScale;
}

/* ---------- queue: reveal commands one at a time in reading order ---------- */
function enqueueCommands(commands){
  drawQueue.push(...commands);
  if(!drawing) processQueue();
}
function processQueue(){
  if(drawQueue.length === 0){ drawing = false; return; }
  drawing = true;
  const cmd = drawQueue.shift();
  drawnCommands.push(cmd);
  appendBlockForCommand(cmd, true);
  scrollToBottomIfFollowing();
  const wait = VECTOR_TYPES.has(cmd.type) ? 60 : estimateDuration(cmd);
  setTimeout(processQueue, Math.max(40, wait));
}

// Entry point called by runTeachingTurn() with the AI's `board` array.
// Kept the original name so the AI-call / teaching-turn code above didn't
// need to change at all.
function enqueueCommandsAtCursor(commands){
  boardContent.classList.remove('empty');
  enqueueCommands(commands);
}

/* ---------- export the lesson as a PDF (DOM-based, not canvas-based) ---------- */
async function exportBoardAsPDF(){
  if(!window.jspdf || !window.html2canvas){ setStatus('pdf export unavailable — see console'); console.error('jsPDF/html2canvas did not load.'); return; }
  if(drawnCommands.length === 0){ setStatus('nothing drawn yet'); return; }
  if(drawing || drawQueue.length){ setStatus('wait for current drawing to finish'); return; }

  setStatus('exporting pdf…');
  try{
    const { jsPDF } = window.jspdf;
    const target = boardContent;
    const canvas = await window.html2canvas(target, { scale: 2, backgroundColor:'#ffffff', useCORS:true });
    const imgData = canvas.toDataURL('image/png');
    const pageW = 612; // 8.5in @72dpi
    const imgW = pageW;
    const imgH = canvas.height * (imgW / canvas.width);
    const pageH = 792; // 11in
    const doc = new jsPDF({ unit:'pt', format:[pageW, pageH] });
    let heightLeft = imgH, position = 0, first = true;
    while(heightLeft > 0){
      if(!first) doc.addPage([pageW, pageH]);
      doc.addImage(imgData, 'PNG', 0, position, imgW, imgH);
      heightLeft -= pageH;
      position -= pageH;
      first = false;
    }
    const name = (currentSessionTitle || (typeof pdfFileName !== 'undefined' && pdfFileName ? pdfFileName.replace(/\.pdf$/i,'') : 'chalkline-lesson')).replace(/[^\w\-]+/g,'_');
    doc.save(`${name}.pdf`);
    setStatus('saved pdf');
  } catch(err){
    console.error('PDF export failed:', err);
    setStatus('pdf export failed — see console');
  }
}

// Roughly how long the browser's TTS will take to say a given piece of text,
// including the little pauses speak() inserts between chunks. Used to stretch
// or compress the block-reveal pacing so the board finishes roughly when the
// voice finishes speaking.
function estimateSpeechDuration(text){
  if(!text) return 0;
  const rate = (currentUtteranceRate || 0.96);
  const charsPerSec = 13.5 * rate;
  const chunks = splitIntoSpeechChunks(text);
  let total = 0;
  chunks.forEach(c=>{
    total += Math.max(400, (c.length / charsPerSec) * 1000);
    total += /\?\s*$/.test(c) ? 260 : 140;
  });
  return total;
}
function scoreVoice(v){
  let score = 0;
  const name = v.name || '';
  if(/Natural/i.test(name)) score += 100;
  if(/Neural/i.test(name)) score += 95;
  if(/Premium/i.test(name)) score += 90;
  if(/Enhanced/i.test(name)) score += 85;
  if(/Google/i.test(name)) score += 70;
  if(/Microsoft.*Online/i.test(name)) score += 65;
  if(/Siri/i.test(name)) score += 60;
  if(v.localService) score += 8;
  if(/^en-US$/i.test(v.lang)) score += 6;
  else if(/^en-GB$/i.test(v.lang)) score += 5;
  else if(/^en/i.test(v.lang)) score += 3;
  if(/Samantha|Aria|Jenny|Libby|Sonia|Serena/i.test(name)) score += 4;
  return score;
}

function pickBestVoice(){

  pool.sort((a,b) => scoreVoice(b) - scoreVoice(a));

}

function splitIntoSpeechChunks(text){
  const sentences = text.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [text];
  const chunks = [];
  for(let s of sentences){
    s = s.trim();
    if(!s) continue;
    if(s.length > 160){
      const parts = s.split(/(?<=[,;:])\s+/);
      let buf = '';
      for(const p of parts){
        if((buf + ' ' + p).trim().length > 160 && buf){ chunks.push(buf.trim()); buf = p; }
        else buf = (buf ? buf + ' ' : '') + p;
      }
      if(buf.trim()) chunks.push(buf.trim());
    } else {
      chunks.push(s);
    }
  }
  return chunks;
}

function renderCaption(fullText, chunkStartIndex, chunkText){
  const said = fullText.slice(0, chunkStartIndex);
  const windowStart = Math.max(0, said.length - 70);
  const fadedPart = fullText.slice(windowStart, chunkStartIndex);
  const freshPart = chunkText;
  captionText.innerHTML = `<span class="fading">${escapeHtml(fadedPart)}</span><span>${escapeHtml(freshPart)}</span>`;
}

function speak(text){
  const sel = document.getElementById('voice-select');
  if(sel && sel.value && sel.value.startsWith('el:')){
    speakElevenLabs(text, sel.value.slice(3));
  } else if(sel && sel.value && sel.value.startsWith('gc:')){
    speakGoogleTTS(text, sel.value.slice(3));
  } else {
    speakBrowser(text);
  }
}

function speakBrowser(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  stopElevenLabsAudio();
  const myToken = ++currentSpeechToken;
  currentUtteranceText = text;
  clearBoardFocus();
  const chunks = splitIntoSpeechChunks(text);
  let searchPos = 0;
  const chunkOffsets = chunks.map(c => {
    const idx = text.indexOf(c, searchPos);
    searchPos = idx >= 0 ? idx + c.length : searchPos;
    return idx >= 0 ? idx : searchPos;
  });

  const voice = getSelectedVoice();

  function speakChunk(i){
    if(myToken !== currentSpeechToken) return;
    if(i >= chunks.length){ avatar.classList.remove('speaking'); return; }
    const utter = new SpeechSynthesisUtterance(chunks[i]);
    utter.rate = 0.96;
    currentUtteranceRate = utter.rate;
    utter.pitch = 1.0;
    utter.volume = 1.0;
    if(voice) utter.voice = voice;
    renderCaption(text, chunkOffsets[i], chunks[i]);
    utter.onstart = () => {
      avatar.classList.add('speaking');
      updateFocusForCharOffset(chunkOffsets[i], myToken);
    };
    // Word-level sync where the browser supports it: refine which board
    // element is focused as narration moves through a longer chunk, instead
    // of only updating at chunk (roughly sentence) boundaries. Browsers that
    // don't fire onboundary reliably (notably Safari) simply never call
    // this, and the chunk-level update above is the fallback.
    utter.onboundary = (event) => {
      if(myToken !== currentSpeechToken) return;
      if(event.name && event.name !== 'word' && event.name !== 'sentence') return;
      updateFocusForCharOffset(chunkOffsets[i] + (event.charIndex || 0), myToken);
    };
    utter.onend = () => {
      if(myToken !== currentSpeechToken) return;
      const pause = /\?\s*$/.test(chunks[i]) ? 260 : 140;
      setTimeout(()=> speakChunk(i+1), pause);
    };
    utter.onerror = () => { if(myToken === currentSpeechToken) speakChunk(i+1); };
    window.speechSynthesis.speak(utter);
  }
  speakChunk(0);
}

// ---------- ElevenLabs "natural voice" path ----------
// Requires a /tts route on the Chalkline proxy worker that forwards to
// ElevenLabs using a server-held API key (see setup notes). If that route
// isn't set up yet, or the free-tier quota runs out, each chunk silently
// falls back to the browser voice instead of going silent.
let currentAudioEls = [];
function stopElevenLabsAudio(){
  currentAudioEls.forEach(a => { try{ a.pause(); a.src=''; }catch(e){} });
  currentAudioEls = [];
}

async function fetchElevenLabsAudio(text, voiceId){
  const response = await fetch(`${PROXY_URL}/elevenlabs-tts`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text, voice_id: voiceId })
  });
  if(!response.ok){
    let detail = 'http ' + response.status;
    try{
      const body = await response.clone().json();
      if(body && body.error && body.error.message) detail = body.error.message;
    }catch(e){ /* not JSON, keep the status-code detail */ }
    throw new Error(detail);
  }
  const blob = await response.blob();
  return URL.createObjectURL(blob);
}

function speakBrowserChunkFallback(chunkText, onDone){
  if(!('speechSynthesis' in window)){ onDone(); return; }
  const utter = new SpeechSynthesisUtterance(chunkText);
  utter.rate = 0.96;
  if(bestVoice) utter.voice = bestVoice;
  utter.onstart = () => avatar.classList.add('speaking');
  utter.onend = onDone;
  utter.onerror = onDone;
  window.speechSynthesis.speak(utter);
}

function speakElevenLabs(text, voiceId){
  window.speechSynthesis.cancel();
  stopElevenLabsAudio();
  const myToken = ++currentSpeechToken;
  currentUtteranceText = text;
  clearBoardFocus();
  const chunks = splitIntoSpeechChunks(text);
  let searchPos = 0;
  const chunkOffsets = chunks.map(c => {
    const idx = text.indexOf(c, searchPos);
    searchPos = idx >= 0 ? idx + c.length : searchPos;
    return idx >= 0 ? idx : searchPos;
  });

  const audioCache = new Array(chunks.length).fill(null);
  function ensureFetched(i){
    if(i < 0 || i >= chunks.length) return null;
    if(!audioCache[i]){
      audioCache[i] = fetchElevenLabsAudio(chunks[i], voiceId).catch(err => {
        console.error('ElevenLabs TTS failed for this line, falling back to browser voice:', err);
        if(typeof setStatus === 'function') setStatus('natural voice unavailable — using browser voice (' + err.message + ')');
        return null;
      });
    }
    return audioCache[i];
  }

  async function playChunk(i){
    if(myToken !== currentSpeechToken) return;
    if(i >= chunks.length){ avatar.classList.remove('speaking'); return; }
    renderCaption(text, chunkOffsets[i], chunks[i]);
    ensureFetched(i+1); // prefetch the next line while this one plays, to avoid gaps
    const url = await ensureFetched(i);
    if(myToken !== currentSpeechToken) return;
    if(!url){
      updateFocusForCharOffset(chunkOffsets[i], myToken);
      speakBrowserChunkFallback(chunks[i], () => playChunk(i+1));
      return;
    }
    const audioEl = new Audio(url);
    currentAudioEls.push(audioEl);
    audioEl.onplay = () => { avatar.classList.add('speaking'); updateFocusForCharOffset(chunkOffsets[i], myToken); };
    audioEl.onended = () => { if(myToken === currentSpeechToken) playChunk(i+1); };
    audioEl.onerror = () => { if(myToken === currentSpeechToken) playChunk(i+1); };
    audioEl.play().catch(() => { if(myToken === currentSpeechToken) playChunk(i+1); });
  }
  playChunk(0);
}

async function handlePdfFile(file){
  if(!pdfjsAvailable){ alert('PDF import couldn\'t load its engine (a network or blocker issue). Try reloading the page.'); return; }
  if(file.type !== 'application/pdf'){ alert('Please choose a PDF file.'); return; }
  setStatus('reading pdf…');

  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
  let fullText = '';
  const maxPages = Math.min(pdf.numPages, 40);
  for(let i=1;i<=maxPages;i++){
    const page = await pdf.getPage(i);

    fullText += `\n\n[Page ${i}]\n` + content.items.map(it=>it.str).join(' ');
