<script>
/* =========================================================
   INFINITE CANVAS: camera model
   ========================================================= */

const canvas = document.getElementById('board');
let ctx = canvas.getContext('2d');
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
let viewW = 0, viewH = 0;
const camera = { x: 500, y: 300, scale: 1 };

/* Board "cursor": tracks the world-space offset for the NEXT block of content.
   The model always emits commands in a local 0-1000 x 0-900 authoring frame
   per teaching turn — but unlike a naive "one turn = one page" layout, turns
   are packed one after another DOWN THE SAME A4-proportioned page (like real
   notebook pages: you keep writing on the same sheet until it's full), and
   only jump to a fresh page once the next turn genuinely wouldn't fit below
   what's already there. This is what makes the board read as a densely
   filled page you scroll down through, rather than a mostly-blank page per
   idea. */
const PAGE_W = 1000;                 // fixed content column width
const PAGE_H = Math.round(PAGE_W * Math.SQRT2); // A4 portrait proportion (1 : √2), in world units
const PAGE_TOP_MARGIN = 50;
const PAGE_BOTTOM_MARGIN = 50;
const TURN_GAP = 36; // vertical breathing room between consecutive turns stacked on the same page

let pageCount = 1;                                  // number of A4 pages used so far
const boardCursor = { x: 0, y: PAGE_TOP_MARGIN };   // where the NEXT turn's local origin should land

// Measures how tall a (already-clamped, not-yet-translated) turn's content
// is in its own local 0-900 authoring frame, by reusing the same bbox logic
// used for hit-testing/export — with the camera temporarily set to the
// identity transform so worldToScreen(wx,wy) reduces to (wx,wy) itself.
function estimateLocalTurnHeight(commands){
  const savedCam = { ...camera }, savedW = viewW, savedH = viewH;
  camera.scale = 1; camera.x = viewW/2; camera.y = viewH/2;
  let maxY = 100;
  commands.forEach(cmd => {
    const box = commandScreenBBox(cmd);
    if(box && box[3] > maxY) maxY = box[3];
  });
  Object.assign(camera, savedCam); viewW = savedW; viewH = savedH;
  return maxY;
}

// Decides where the next turn should be placed: if it still fits below the
// current cursor within the current page, keep stacking down the SAME page;
// once it wouldn't fit before the bottom margin, jump straight to the top of
// a fresh page instead of squeezing or overlapping the last turn.
function advanceBoardCursor(turnLocalHeight){
  const currentPageTop = (pageCount - 1) * PAGE_H;
  const currentPageBottom = currentPageTop + PAGE_H - PAGE_BOTTOM_MARGIN;
  if(boardCursor.y + turnLocalHeight > currentPageBottom){
    pageCount++;
    boardCursor.y = (pageCount - 1) * PAGE_H + PAGE_TOP_MARGIN;
  }
  boardCursor.x = 0;
}

// Smoothly scrolls the camera to a target world position, easing over
// `duration` ms, so moving to the next teaching block reads as continuous
// downward scrolling rather than a slide-style jump cut. `panToken` lets any
// in-flight pan be interrupted (e.g. the user grabs the board mid-scroll) —
// when that happens we stop animating but still fire onDone immediately so
// queued content still gets drawn.
let panToken = 0;
function animateCameraPan(targetX, targetY, duration, onDone){
  const myToken = ++panToken;
  const startX = camera.x, startY = camera.y;
  const dx = targetX - startX, dy = targetY - startY;
  const start = performance.now();
  let finished = false;
  function finish(){ if(!finished){ finished = true; if(onDone) onDone(); } }
  function ease(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; } // easeInOutCubic
  function frame(now){
    if(myToken !== panToken){ finish(); return; } // interrupted by a newer pan or manual drag/zoom
    const raw = Math.min(1, (now-start)/duration);
    const t = ease(raw);
    camera.x = startX + dx*t;
    camera.y = startY + dy*t;
    redrawAll();
    if(raw < 1) requestAnimationFrame(frame); else { camera.x = targetX; camera.y = targetY; redrawAll(); finish(); }
  }
  requestAnimationFrame(frame);
}

function panCameraToCursor(targetY, onDone){
  animateCameraPan(500, targetY, 900, onDone);
}

function resizeCanvas(){
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // Keep whatever world point was centered on screen still centered after
  // the viewport dimensions change (e.g. portrait <-> landscape rotation).
  // Without this, camera.x/y stay put while viewW/viewH jump, so content
  // silently shifts off one edge of the new, differently-proportioned view.
  viewW = rect.width; viewH = rect.height;
  redrawAll();
}
window.addEventListener('resize', resizeCanvas);

// iOS/Safari fires 'resize' with stale layout metrics immediately on
// rotation (before the browser chrome/safe-area has settled), so a single
// resizeCanvas() call right on orientationchange can capture the wrong
// rect and leave the board looking shifted/cropped until the user manually
// interacts. Re-run it a couple of times shortly after the rotation
// settles to guarantee we end up with accurate final dimensions.
window.addEventListener('orientationchange', () => {
  setTimeout(resizeCanvas, 50);
  setTimeout(resizeCanvas, 350);
});
if (screen.orientation && screen.orientation.addEventListener) {
  screen.orientation.addEventListener('change', () => {
    setTimeout(resizeCanvas, 50);
    setTimeout(resizeCanvas, 350);
  });
}

function worldToScreen(wx, wy){
  return [(wx - camera.x) * camera.scale + viewW/2, (wy - camera.y) * camera.scale + viewH/2];
}
function screenToWorld(sx, sy){
  return [(sx - viewW/2) / camera.scale + camera.x, (sy - viewH/2) / camera.scale + camera.y];
}

const INK = '#26241F';
const OCHRE = '#B8722E';
const SAGE = '#5E7F6C';
const BRICK = '#A84B39';
const TEAL = '#2E7D7B';
const VIOLET = '#7B5EA7';
const SKY = '#3E76A8';
const CORAL = '#D2694F';
const HALO = '#8FA6FF';
const HILITE = '#FCE896';
const COLORS = { chalk:INK, ink:INK, ochre:OCHRE, sage:SAGE, brick:BRICK, teal:TEAL, violet:VIOLET, sky:SKY, coral:CORAL, halo:HALO, highlight:HILITE };

/* Converts a #rrggbb color plus an alpha (0-1) into an rgba() string, used for
   soft glow / gradient effects like the "halo" command. */
function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

let drawnCommands = [];

function drawBG(){
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0,0,viewW,viewH);
}

// Faint vertical rules at the left/right edge of the 0-1000 content column,
// so the endless-scroll board still reads as a single continuous "page"
// rather than an unbounded void.
function drawPageGuides(){
  const [leftX] = worldToScreen(0, 0);
  const [rightX] = worldToScreen(1000, 0);
  ctx.save();
  ctx.strokeStyle = 'rgba(184,114,46,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(leftX, 0); ctx.lineTo(leftX, viewH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(rightX, 0); ctx.lineTo(rightX, viewH); ctx.stroke();
  ctx.restore();
}

// Faint horizontal rule lines across the full page width, evenly spaced like
// real ruled notebook paper — drawn for whatever vertical range is currently
// on screen (works the same whether you're near the top of the board or
// scrolled deep into page 4), so the board always reads as lined paper
// rather than blank white.
const RULE_LINE_SPACING = 42; // world units between rule lines
function drawRuleLines(){
  const [leftX] = worldToScreen(0, 0);
  const [rightX] = worldToScreen(1000, 0);
  const topWorldY = screenToWorld(0, 0)[1];
  const bottomWorldY = screenToWorld(0, viewH)[1];
  const firstLine = Math.floor(topWorldY / RULE_LINE_SPACING) * RULE_LINE_SPACING;
  ctx.save();
  ctx.strokeStyle = 'rgba(38,36,31,0.10)';
  ctx.lineWidth = 1;
  for(let wy = firstLine; wy <= bottomWorldY; wy += RULE_LINE_SPACING){
    const [, sy] = worldToScreen(0, wy);
    ctx.beginPath(); ctx.moveTo(leftX, sy); ctx.lineTo(rightX, sy); ctx.stroke();
  }
  ctx.restore();
}

function clearBoard(record=true){
  if(record) drawnCommands = [];
  drawBG();
  drawPageGuides();
  drawRuleLines();
}

function redrawAll(){
  drawBG();
  drawPageGuides();
  drawRuleLines();
  drawnCommands.forEach(cmd => renderCommand(cmd));
}

// Same as redrawAll, but leaves one command out of the static pass — used
// while that command is being re-animated on hover, so it can be built back
// up stroke-by-stroke/letter-by-letter instead of just sitting there already
// fully drawn underneath its own animation.
function redrawAllExcept(skipCmd){
  drawBG();
  drawPageGuides();
  drawRuleLines();
  drawnCommands.forEach(cmd => { if(cmd !== skipCmd) renderCommand(cmd); });
}

function sw(n){ return n * camera.scale; }

// Approximate screen-space bounding box for a drawn command, padded a bit
// for a forgiving hover target. Used only for hit-testing, not rendering.
// Breaks `text` into lines that each fit within `maxWidthPx` (screen px),
// using the CURRENTLY SET ctx.font — call only after ctx.font is assigned.
// This is what lets the model write full wrapping paragraphs (like real
// notebook prose) instead of being limited to one short line per command.
function wrapTextToLines(text, maxWidthPx){
  const words = (text||'').split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = '';
  words.forEach(w => {
    const test = cur ? cur + ' ' + w : w;
    if(cur && ctx.measureText(test).width > maxWidthPx){
      lines.push(cur);
      cur = w;
    } else {
      cur = test;
    }
  });
  if(cur) lines.push(cur);
  return lines.length ? lines : [''];
}

function commandScreenBBox(cmd){
  const PAD = 10;
  function pad(x0,y0,x1,y1){
    return [Math.min(x0,x1)-PAD, Math.min(y0,y1)-PAD, Math.max(x0,x1)+PAD, Math.max(y0,y1)+PAD];
  }
  switch(cmd.type){
    case 'text': {
      const fam = cmd.handwritten ? "'Caveat', cursive" : (cmd.mono ? "'JetBrains Mono', 'STIX Two Text', monospace" : "'Kalam', 'Caveat', cursive");
      const weight = cmd.weight || (cmd.handwritten ? 700 : 400);
      const size = cmd.handwritten ? (cmd.size||36)*1.25 : (cmd.size||24)*1.08;
      ctx.font = `${weight} ${sw(size)}px ${fam}`;
      const [sx,sy] = worldToScreen(cmd.x, cmd.y);
      if(cmd.maxWidth){
        const lines = wrapTextToLines(cmd.text||'', sw(cmd.maxWidth));
        const lineHeight = sw(size)*1.35;
        const width = Math.max(0, ...lines.map(l=>ctx.measureText(l).width));
        return pad(sx, sy - sw(size)*1.05, sx + width, sy + lineHeight*(lines.length-1) + sw(size)*0.25);
      }
      const width = ctx.measureText(cmd.text||'').width;
      return pad(sx, sy - sw(size)*1.05, sx + width, sy + sw(size)*0.25);
    }
    case 'line': case 'arrow': {
      const [x1,y1] = worldToScreen(cmd.x1,cmd.y1); const [x2,y2] = worldToScreen(cmd.x2,cmd.y2);
      return pad(x1,y1,x2,y2);
    }
    case 'rect': case 'highlight': case 'highlight-marker': {
      const [x,y] = worldToScreen(cmd.x,cmd.y);
      return pad(x, y, x+sw(cmd.w), y+sw(cmd.h||(cmd.type==='rect'?0:40)));
    }
    case 'circle': {
      const [x,y] = worldToScreen(cmd.x,cmd.y);
      return pad(x-sw(cmd.rx), y-sw(cmd.ry), x+sw(cmd.rx), y+sw(cmd.ry));
    }
    case 'curve': {
      const pts = (cmd.points||[]).map(p=>worldToScreen(p[0],p[1]));
      if(!pts.length) return [0,0,0,0];
      const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
      return pad(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys));
    }
    case 'axes': case 'plot': {
      const [ox,oy] = worldToScreen(cmd.x,cmd.y);
      const w = sw(cmd.w), h = sw(cmd.h);
      return pad(ox, oy-h-sw(30), ox+w, oy+sw(20));
    }
    case 'halo': {
      const [x,y] = worldToScreen(cmd.x,cmd.y); const r = sw(cmd.r||60);
      return pad(x-r,y-r,x+r,y+r);
    }
    default: return [0,0,0,0];
  }
}

function renderCommand(cmd){
  const color = COLORS[cmd.color] || INK;
  ctx.strokeStyle = color; ctx.fillStyle = color;

  switch(cmd.type){
    case 'text': {
      const fam = cmd.handwritten ? "'Caveat', cursive" : (cmd.mono ? "'JetBrains Mono', 'STIX Two Text', monospace" : "'Kalam', 'Caveat', cursive");
      const weight = cmd.weight || (cmd.handwritten ? 700 : 400);
      const size = cmd.handwritten ? (cmd.size||36)*1.25 : (cmd.size||24)*1.08;
      ctx.font = `${weight} ${sw(size)}px ${fam}`;
      ctx.textBaseline = 'alphabetic';
      const [sx,sy] = worldToScreen(cmd.x, cmd.y);
      if(cmd.maxWidth){
        const lines = wrapTextToLines(cmd.text||'', sw(cmd.maxWidth));
        const lineHeight = sw(size)*1.35;
        lines.forEach((line,i) => ctx.fillText(line, sx, sy + i*lineHeight));
      } else {
        ctx.fillText(cmd.text, sx, sy);
      }
      break;
    }
    case 'highlight-marker': {
      // Feature removed — no longer drawn, even if an older saved session
      // or a stray model response still includes this command type.
      break;
    }
    case 'line': {
      ctx.lineWidth = sw(cmd.width || 2.5);
      const [x1,y1] = worldToScreen(cmd.x1, cmd.y1); const [x2,y2] = worldToScreen(cmd.x2, cmd.y2);
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      break;
    }
    case 'arrow': {
      ctx.lineWidth = sw(cmd.width || 2.5);
      const [x1,y1] = worldToScreen(cmd.x1, cmd.y1); const [x2,y2] = worldToScreen(cmd.x2, cmd.y2);
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      const angle = Math.atan2(y2-y1, x2-x1); const headLen = sw(cmd.headSize || 12);
      ctx.beginPath(); ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - headLen*Math.cos(angle - Math.PI/7), y2 - headLen*Math.sin(angle - Math.PI/7));
      ctx.lineTo(x2 - headLen*Math.cos(angle + Math.PI/7), y2 - headLen*Math.sin(angle + Math.PI/7));
      ctx.closePath(); ctx.fill();
      break;
    }
    case 'rect': {
      ctx.lineWidth = sw(cmd.width || 2.5);
      const [x,y] = worldToScreen(cmd.x, cmd.y); const w = sw(cmd.w), h = sw(cmd.h);
      if(cmd.fill){ ctx.globalAlpha = 0.10; ctx.fillRect(x,y,w,h); ctx.globalAlpha = 1; }
      ctx.strokeRect(x,y,w,h);
      break;
    }
    case 'circle': {
      ctx.lineWidth = sw(cmd.width || 2.5);
      const [x,y] = worldToScreen(cmd.x, cmd.y);
      ctx.beginPath(); ctx.ellipse(x, y, sw(cmd.rx), sw(cmd.ry), 0, 0, Math.PI*2);
      if(cmd.fill){ ctx.globalAlpha = 0.10; ctx.fill(); ctx.globalAlpha = 1; }
      ctx.stroke();
      break;
    }
    case 'curve': {
      ctx.lineWidth = sw(cmd.width || 2.5);
      const pts = cmd.points.map(p => worldToScreen(p[0], p[1]));
      strokeSmoothCurve(pts);
      break;
    }
    case 'axes': {
      const [ox,oy] = worldToScreen(cmd.x, cmd.y); const w = sw(cmd.w), h = sw(cmd.h);
      drawAxesGrid(ox, oy, w, h, cmd);
      ctx.lineWidth = sw(2);
      ctx.strokeStyle = color; ctx.fillStyle = color;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox, oy - h); ctx.moveTo(ox, oy); ctx.lineTo(ox + w, oy); ctx.stroke();
      drawArrowhead(ox, oy - h, -Math.PI/2, color);
      drawArrowhead(ox + w, oy, 0, color);
      drawAxesTicksAndLabels(ox, oy, w, h, cmd, color);
      break;
    }
    case 'plot': {
      const [ox,oy] = worldToScreen(cmd.x, cmd.y); const w = sw(cmd.w), h = sw(cmd.h);
      drawAxesGrid(ox, oy, w, h, cmd);
      ctx.lineWidth = sw(2.5);
      ctx.strokeStyle = color; ctx.fillStyle = color;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox, oy - h); ctx.moveTo(ox, oy); ctx.lineTo(ox + w, oy); ctx.stroke();
      drawArrowhead(ox, oy - h, -Math.PI/2, color);
      drawArrowhead(ox + w, oy, 0, color);
      drawAxesTicksAndLabels(ox, oy, w, h, cmd, color);
      const [scaleX, scaleY] = plotScalers(ox, oy, w, h, cmd);
      (cmd.curves || []).forEach(curve => {
        const pts = (curve.points || []).map(p => [scaleX(p[0]), scaleY(p[1])]);
        if(pts.length < 2) return;
        const curveColor = COLORS[curve.color] || color;
        ctx.save();
        ctx.shadowColor = hexToRgba(curveColor, 0.35);
        ctx.shadowBlur = sw(4);
        ctx.shadowOffsetY = sw(1.5);
        ctx.strokeStyle = curveColor;
        ctx.lineWidth = sw(curve.width || 3.25);
        strokeSmoothCurve(pts);
        ctx.restore();
        // small hand-plotted dots at each data point for a worked-by-hand feel
        ctx.fillStyle = curveColor;
        pts.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], sw(2.75), 0, Math.PI*2); ctx.fill(); });
        if(curve.label){
          ctx.fillStyle = curveColor;
          ctx.font = `700 ${sw(15)}px 'Kalam', cursive`;
          ctx.textAlign = 'left';
          const [lx,ly] = pts[pts.length-1];
          ctx.fillText(curve.label, lx+sw(8), ly+sw(4));
        }
      });
      break;
    }
    case 'highlight': {
      ctx.globalAlpha = 0.18; ctx.fillStyle = color;
      const [x,y] = worldToScreen(cmd.x, cmd.y);
      ctx.fillRect(x, y, sw(cmd.w), sw(cmd.h || 26));
      ctx.globalAlpha = 1;
      break;
    }
    case 'halo': {
      const [x,y] = worldToScreen(cmd.x, cmd.y);
      const r = sw(cmd.r || 60);
      const glow = COLORS[cmd.color] || HALO;
      const grad = ctx.createRadialGradient(x,y,0,x,y,r);
      grad.addColorStop(0, hexToRgba(glow, 0.40));
      grad.addColorStop(1, hexToRgba(glow, 0));
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
      break;
    }
  }
}

// Small filled triangle used to cap the ends of axis lines.
function drawArrowhead(x, y, angle, color, size){
  const headLen = sw(size || 9);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(x, y);
  ctx.lineTo(x - headLen*Math.cos(angle - Math.PI/7), y - headLen*Math.sin(angle - Math.PI/7));
  ctx.lineTo(x - headLen*Math.cos(angle + Math.PI/7), y - headLen*Math.sin(angle + Math.PI/7));
  ctx.closePath(); ctx.fill();
}

// Faint dashed gridlines behind a set of axes, so plotted curves are easy to
// read at a glance. On by default; a graph author can pass "grid":false to
// suppress it (e.g. for a simple number line).
function drawAxesGrid(ox, oy, w, h, cmd){
  if(cmd.grid === false) return;
  const n = cmd.gridLines || 5;
  ctx.save();
  ctx.strokeStyle = 'rgba(38,36,31,0.14)';
  ctx.lineWidth = 1;
  ctx.setLineDash([sw(3), sw(4)]);
  for(let i=1;i<=n;i++){
    const gx = ox + (w*i/n);
    ctx.beginPath(); ctx.moveTo(gx, oy); ctx.lineTo(gx, oy-h); ctx.stroke();
    const gy = oy - (h*i/n);
    ctx.beginPath(); ctx.moveTo(ox, gy); ctx.lineTo(ox+w, gy); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();
}

// Draws optional tick marks + numeric/text labels along each axis, plus the
// axis labels and an optional title, so a plotted graph is self-explanatory
// without the student having to guess scale.
function drawAxesTicksAndLabels(ox, oy, w, h, cmd, color){
  ctx.save();
  ctx.font = `${sw(12)}px 'JetBrains Mono', 'STIX Two Text', monospace`;
  ctx.fillStyle = color;
  if(Array.isArray(cmd.xTicks)){
    const n = cmd.xTicks.length;
    cmd.xTicks.forEach((label, i) => {
      const tx = ox + w*(i+1)/(n+1);
      ctx.strokeStyle = color; ctx.lineWidth = sw(1.5);
      ctx.beginPath(); ctx.moveTo(tx, oy-sw(4)); ctx.lineTo(tx, oy+sw(4)); ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillText(String(label), tx, oy+sw(18));
    });
  }
  if(Array.isArray(cmd.yTicks)){
    const n = cmd.yTicks.length;
    cmd.yTicks.forEach((label, i) => {
      const ty = oy - h*(i+1)/(n+1);
      ctx.strokeStyle = color; ctx.lineWidth = sw(1.5);
      ctx.beginPath(); ctx.moveTo(ox-sw(4), ty); ctx.lineTo(ox+sw(4), ty); ctx.stroke();
      ctx.textAlign = 'right';
      ctx.fillText(String(label), ox-sw(8), ty+sw(4));
    });
  }
  ctx.textAlign = 'left';
  ctx.font = `${sw(15)}px 'JetBrains Mono', 'STIX Two Text', monospace`;
  if(cmd.xlabel){ ctx.textAlign = 'right'; ctx.fillText(cmd.xlabel, ox+w, oy+sw(30)); }
  if(cmd.ylabel){ ctx.save(); ctx.translate(ox-sw(28), oy-h); ctx.textAlign = 'left'; ctx.fillText(cmd.ylabel,0,0); ctx.restore(); }
  if(cmd.title){ ctx.textAlign = 'center'; ctx.font = `700 ${sw(20)}px 'Caveat', cursive`; ctx.fillText(cmd.title, ox+w/2, oy-h-sw(16)); }
  ctx.restore();
}

// Strokes a fully-drawn smoothed path through screen-space points. Shared by
// freehand "curve" and by each curve inside a "plot" — always ends exactly on
// the final point (unlike a naive quadratic chain, which stops short of it).
function strokeSmoothCurve(pts){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(let i=1;i<pts.length-1;i++){
    const midX = (pts[i][0]+pts[i+1][0])/2, midY = (pts[i][1]+pts[i+1][1])/2;
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], midX, midY);
  }
  const last = pts[pts.length-1];
  ctx.lineTo(last[0], last[1]);
  ctx.stroke();
}

// Same smoothed path, but stroked only up to fraction t (0-1), for the live
// drawing animation. Returns the pen tip's screen position.
function strokeSmoothCurvePartial(pts, t){
  const totalSegs = pts.length-1;
  const segFloat = t*totalSegs;
  const segIdx = Math.min(totalSegs-1, Math.floor(segFloat));
  const segT = segFloat-segIdx;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(let i=1;i<=segIdx;i++){
    const nextI = Math.min(i+1, pts.length-1);
    const midX = (pts[i][0]+pts[nextI][0])/2, midY = (pts[i][1]+pts[nextI][1])/2;
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], midX, midY);
  }
  let penX = pts[segIdx][0], penY = pts[segIdx][1];
  if(pts[segIdx+1]){
    penX = pts[segIdx][0]+(pts[segIdx+1][0]-pts[segIdx][0])*segT;
    penY = pts[segIdx][1]+(pts[segIdx+1][1]-pts[segIdx][1])*segT;
    ctx.lineTo(penX, penY);
  }
  ctx.stroke();
  return [penX, penY];
}

// Builds data->screen scale functions for a "plot" command, so every curve
// inside it is mapped into the SAME axes box it's drawn against — a curve can
// never end up floating away from its own axes the way independently-placed
// "axes" + "curve" commands could.
function plotScalers(ox, oy, w, h, cmd){
  const [xMin,xMax] = cmd.xRange || [0, 10];
  const [yMin,yMax] = cmd.yRange || [0, 10];
  const xSpan = (xMax-xMin) || 1, ySpan = (yMax-yMin) || 1;
  const scaleX = v => ox + ((v-xMin)/xSpan)*w;
  const scaleY = v => oy - ((v-yMin)/ySpan)*h;
  return [scaleX, scaleY];
}

/* ---------- PAN / ZOOM ---------- */
let isPanning = false, panStart=null, camStart=null;
canvas.addEventListener('mousedown', (e)=>{ panToken++; isPanning=true; canvas.classList.add('grabbing'); panStart=[e.clientX,e.clientY]; camStart={x:camera.x,y:camera.y}; if(typeof stopHoverReplay==='function') stopHoverReplay(); });
window.addEventListener('mousemove', (e)=>{
  if(!isPanning) return;
  camera.x = camStart.x - (e.clientX - panStart[0]) / camera.scale;
  camera.y = camStart.y - (e.clientY - panStart[1]) / camera.scale;
  redrawAll();
});
window.addEventListener('mouseup', ()=>{ isPanning=false; canvas.classList.remove('grabbing'); });

/* ---------- HOVER-TO-REPLAY: pen re-writes a command on mouse hover ---------- */
const hoverAnim = { cmd:null, raf:null };

function stopHoverReplay(){
  if(hoverAnim.raf) cancelAnimationFrame(hoverAnim.raf);
  hoverAnim.raf = null;
  if(hoverAnim.cmd){ hoverAnim.cmd = null; redrawAll(); }
}

function startHoverReplay(cmd){
  if(hoverAnim.cmd === cmd) return; // already replaying/showing this one
  if(hoverAnim.raf) cancelAnimationFrame(hoverAnim.raf);
  hoverAnim.cmd = cmd;
  const duration = estimateDuration(cmd);
  const start = performance.now();
  function frame(now){
    if(hoverAnim.cmd !== cmd) return; // hover moved elsewhere mid-flight
    const t = Math.min(1, (now-start)/duration);
    redrawAllExcept(cmd);
    renderPartialCommand(cmd, t);
    if(t < 1){ hoverAnim.raf = requestAnimationFrame(frame); }
    else { hoverAnim.raf = null; redrawAll(); }
  }
  hoverAnim.raf = requestAnimationFrame(frame);
}

canvas.addEventListener('mousemove', (e)=>{
  if(isPanning || drawing) return; // don't fight with panning or the live AI draw-in
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  let hit = null;
  for(let i = drawnCommands.length - 1; i >= 0; i--){
    const cmd = drawnCommands[i];
    if(cmd.type === 'highlight' || cmd.type === 'halo') continue; // decorative, not "written" content
    const [x0,y0,x1,y1] = commandScreenBBox(cmd);
    if(mx>=x0 && mx<=x1 && my>=y0 && my<=y1){ hit = cmd; break; }
  }
  canvas.classList.toggle('hoverable', !!hit);
  if(hit) startHoverReplay(hit); else stopHoverReplay();
});
canvas.addEventListener('mouseleave', stopHoverReplay);
canvas.addEventListener('wheel', (e)=>{
  e.preventDefault();
  panToken++;
  stopHoverReplay();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX-rect.left, my = e.clientY-rect.top;
  const [wx,wy] = screenToWorld(mx,my);
  camera.scale = Math.min(3, Math.max(0.2, camera.scale * (e.deltaY>0?0.9:1.1)));
  const [nx,ny] = screenToWorld(mx,my);
  camera.x += (wx-nx); camera.y += (wy-ny);
  redrawAll();
}, {passive:false});
document.getElementById('zoom-in').addEventListener('click', ()=>{ camera.scale=Math.min(3,camera.scale*1.2); redrawAll(); });
document.getElementById('zoom-out').addEventListener('click', ()=>{ camera.scale=Math.max(0.2,camera.scale/1.2); redrawAll(); });
document.getElementById('zoom-reset').addEventListener('click', ()=>{ panToken++; camera.x=500;camera.y=300;camera.scale=1; redrawAll(); });
document.getElementById('btn-clear').addEventListener('click', ()=>{ panToken++; drawQueue=[]; camera.x=500;camera.y=300;camera.scale=1; pageCount=1; boardCursor.x=0; boardCursor.y=PAGE_TOP_MARGIN; clearBoard(); });

/* =========================================================
   EXPORT: SAVE THE WHOLE (INFINITE, DOWNWARD-SCROLLING) BOARD AS A PDF
   The board grows straight down as a sequence of A4-proportioned pages, each
   one filled with as many teaching turns as fit before the next page starts.
   Export walks that same world space page by page, rendering each page into
   an offscreen canvas at the real camera transform
   (so hit-testing/animation code doesn't need to change), then drops each
   page's image into a multi-page PDF via jsPDF.
   ========================================================= */
function worldContentBounds(){
  // Reuses commandScreenBBox for its per-type sizing logic: with camera set
  // to scale 1 and centered so (camera.x,camera.y)===(viewW/2,viewH/2),
  // worldToScreen(wx,wy) reduces to the identity, so the "screen" bbox it
  // returns IS the world-space bbox.
  const savedCam = { ...camera }, savedW = viewW, savedH = viewH;
  camera.scale = 1; camera.x = viewW/2; camera.y = viewH/2;
  let minX=0, minY=0, maxX=PAGE_W, maxY=Math.max(1, pageCount*PAGE_H);
  drawnCommands.forEach(cmd=>{
    const [x0,y0,x1,y1] = commandScreenBBox(cmd);
    minX=Math.min(minX,x0); minY=Math.min(minY,y0);
    maxX=Math.max(maxX,x1); maxY=Math.max(maxY,y1);
  });
  Object.assign(camera, savedCam); viewW = savedW; viewH = savedH;
  return { minX, minY, maxX, maxY };
}

async function exportBoardAsPDF(){
  if(!window.jspdf){ setStatus('pdf export unavailable — see console'); console.error('jsPDF did not load (no network in this context, or the CDN was blocked).'); return; }
  if(drawnCommands.length===0){ setStatus('nothing drawn yet'); return; }
  if(drawing || drawQueue.length){ setStatus('wait for the current drawing to finish'); return; }

  setStatus('exporting pdf…');
  stopHoverReplay();
  const savedCam = { ...camera }, savedW = viewW, savedH = viewH, savedCtx = ctx;

  try{
    const { minX, minY, maxY } = worldContentBounds();
    const pageWorldW = PAGE_W; // the board's fixed A4-proportioned content column width
    const pageWorldH = PAGE_H;
    const numPages = Math.max(1, Math.ceil((maxY - minY) / pageWorldH));
    const PX_PER_WORLD_UNIT = 1.6; // offscreen render resolution — plenty crisp for text
    const pxW = Math.round(pageWorldW * PX_PER_WORLD_UNIT);
    const pxH = Math.round(pageWorldH * PX_PER_WORLD_UNIT);

    const off = document.createElement('canvas');
    off.width = pxW; off.height = pxH;
    const offCtx = off.getContext('2d');
    offCtx.lineCap = 'round'; offCtx.lineJoin = 'round';

    const { jsPDF } = window.jspdf;
    let doc = null;

    for(let i=0; i<numPages; i++){
      ctx = offCtx;
      viewW = pxW; viewH = pxH;
      camera.scale = PX_PER_WORLD_UNIT;
      camera.x = minX + pageWorldW/2;
      camera.y = (minY + i*pageWorldH) + pageWorldH/2;

      drawBG(); // page guides are a screen affordance only — skip those in the export, but keep the rule lines so the exported PDF still reads as ruled notebook paper
      drawRuleLines();
      drawnCommands.forEach(cmd => renderCommand(cmd)); // anything outside this page's y-range is simply clipped by the canvas

      const dataUrl = off.toDataURL('image/png');
      if(i===0){
        doc = new jsPDF({ unit:'pt', format:[pageWorldW, pageWorldH], orientation: pageWorldW>=pageWorldH?'landscape':'portrait' });
      } else {
        doc.addPage([pageWorldW, pageWorldH], pageWorldW>=pageWorldH?'landscape':'portrait');
      }
      doc.addImage(dataUrl, 'PNG', 0, 0, pageWorldW, pageWorldH);
    }

    const name = (currentSessionTitle || (pdfFileName ? pdfFileName.replace(/\.pdf$/i,'') : 'chalkline-lesson')).replace(/[^\w\-]+/g,'_');
    doc.save(`${name}.pdf`);
    setStatus(`saved ${numPages}-page pdf`);
  } catch(err){
    console.error('PDF export failed:', err);
    setStatus('pdf export failed — see console');
  } finally {
    ctx = savedCtx;
    Object.assign(camera, savedCam);
    viewW = savedW; viewH = savedH;
    redrawAll();
  }
}
document.getElementById('btn-export-pdf').addEventListener('click', exportBoardAsPDF);

/* =========================================================
   LIVE PEN + STROKE-BY-STROKE ANIMATION
   ========================================================= */
let drawQueue = [], drawing = false;

function drawPen(x, y, angle){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle + Math.PI/4);
  ctx.fillStyle = '#2A2A2A';
  const s = 14;
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(s*0.35,s*0.35); ctx.lineTo(s*1.7,s*1.7-s*0.5); ctx.lineTo(s*1.35,s*2.0-s*0.5);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#B8722E';
  ctx.beginPath(); ctx.arc(s*0.45,s*0.45,3.2,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function clearPen(){}

function translateCommand(cmd, dx, dy){
  const c = { ...cmd };
  if('x' in c) c.x += dx;
  if('y' in c) c.y += dy;
  if('x1' in c) c.x1 += dx;
  if('y1' in c) c.y1 += dy;
  if('x2' in c) c.x2 += dx;
  if('y2' in c) c.y2 += dy;
  if(Array.isArray(c.points)) c.points = c.points.map(p => [p[0]+dx, p[1]+dy]);
  return c;
}

// Hard-clamps every command into the 1000x900 working frame before it ever
// gets a cursor offset applied, so a stray/oversized value from the model
// can never push text or a graph off the visible board or into the next
// teaching block below it.
function clampBoardCoords(c){
  const M = 20; // margin from the frame edge
  const MINX = M, MAXX = 1000 - M, MINY = M, MAXY = 900 - M;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  switch(c.type){
    case 'text': case 'circle': case 'halo':
      c.x = clamp(c.x, MINX, MAXX);
      c.y = clamp(c.y, MINY, MAXY);
      if(c.type === 'text' && c.maxWidth) c.maxWidth = Math.min(c.maxWidth, MAXX - c.x);
      break;
    case 'line': case 'arrow':
      c.x1 = clamp(c.x1, MINX, MAXX); c.y1 = clamp(c.y1, MINY, MAXY);
      c.x2 = clamp(c.x2, MINX, MAXX); c.y2 = clamp(c.y2, MINY, MAXY);
      break;
    case 'rect': case 'highlight':
      c.x = clamp(c.x, MINX, MAXX);
      c.y = clamp(c.y, MINY, MAXY);
      if(c.w) c.w = Math.min(c.w, MAXX - c.x);
      if(c.h) c.h = Math.min(c.h, MAXY - c.y);
      break;
    case 'curve':
      if(Array.isArray(c.points)) c.points = c.points.map(p => [clamp(p[0],MINX,MAXX), clamp(p[1],MINY,MAXY)]);
      break;
    case 'axes': case 'plot':
      // x,y is the bottom-left ORIGIN; the box extends upward by h and
      // rightward by w, so both need clamping relative to that origin.
      c.x = clamp(c.x, MINX, MAXX - 60);
      c.y = clamp(c.y, MINY + 60, MAXY);
      c.w = Math.max(60, Math.min(c.w, MAXX - c.x));
      c.h = Math.max(60, Math.min(c.h, c.y - MINY));
      break;
  }
  return c;
}

function enqueueCommandsAtCursor(commands){
  const clamped = commands.map(c => clampBoardCoords({ ...c }));
  const turnLocalHeight = estimateLocalTurnHeight(clamped);
  advanceBoardCursor(turnLocalHeight);
  const placedAtY = boardCursor.y;
  const translated = clamped.map(c => translateCommand(c, boardCursor.x, placedAtY));
  boardCursor.y = placedAtY + turnLocalHeight + TURN_GAP; // next turn keeps stacking on the same page until it no longer fits
  redrawAll();
  panCameraToCursor(placedAtY + turnLocalHeight/2, () => enqueueCommands(translated));
}

function enqueueCommands(commands){
  drawQueue.push(...commands);
  if(!drawing) processQueue();
}
function processQueue(){
  if(drawQueue.length===0){ drawing=false; redrawAll(); return; }
  drawing=true;
  const cmd = drawQueue.shift();
  animateCommand(cmd, ()=>{ drawnCommands.push(cmd); processQueue(); });
}
function animateCommand(cmd, onDone){
  const duration = estimateDuration(cmd);
  const start = performance.now();
  function frame(now){
    const t = Math.min(1,(now-start)/duration);
    redrawAll();
    renderPartialCommand(cmd, t);
    if(t<1) requestAnimationFrame(frame); else onDone();
  }
  requestAnimationFrame(frame);
}
function estimateDuration(cmd){
  switch(cmd.type){
    case 'text': return Math.min(2200, Math.max(500,(cmd.text||'').length*(cmd.handwritten?55:38)));
    case 'line': case 'arrow': return 380;
    case 'curve': return 700;
    case 'rect': return 550;
    case 'circle': return 550;
    case 'axes': return 550;
    case 'plot': return 600 + ((cmd.curves||[]).length)*550;
    case 'highlight': return 250;
    case 'highlight-marker': return 420;
    case 'halo': return 450;
    default: return 300;
  }
}
function renderPartialCommand(cmd, t){
  const color = COLORS[cmd.color] || INK;
  ctx.strokeStyle = color; ctx.fillStyle = color;
  switch(cmd.type){
    case 'text': {
      const full = cmd.text || '';
      const fam = cmd.handwritten ? "'Caveat', cursive" : (cmd.mono ? "'JetBrains Mono', 'STIX Two Text', monospace" : "'Kalam', 'Caveat', cursive");
      const weight = cmd.weight || (cmd.handwritten ? 700 : 400);
      const size = cmd.handwritten ? (cmd.size||36)*1.25 : (cmd.size||24)*1.08;
      ctx.font = `${weight} ${sw(size)}px ${fam}`;
      const [sx,sy] = worldToScreen(cmd.x, cmd.y);
      if(cmd.maxWidth){
        const lines = wrapTextToLines(full, sw(cmd.maxWidth));
        const lineHeight = sw(size)*1.35;
        let charsLeft = Math.max(1, Math.round(full.length*t));
        let lastX = sx, lastY = sy;
        for(let i=0;i<lines.length;i++){
          const line = lines[i];
          const take = Math.max(0, Math.min(line.length, charsLeft));
          const partial = line.slice(0, take);
          ctx.fillText(partial, sx, sy + i*lineHeight);
          lastX = sx + ctx.measureText(partial).width;
          lastY = sy + i*lineHeight;
          charsLeft -= take + 1; // +1 roughly accounts for the space between wrapped words
          if(charsLeft <= 0) break;
        }
        drawPen(lastX, lastY, -Math.PI/2);
      } else {
        const nChars = Math.max(1, Math.round(full.length*t));
        const partial = full.slice(0,nChars);
        ctx.fillText(partial, sx, sy);
        const w = ctx.measureText(partial).width;
        drawPen(sx+w, sy, -Math.PI/2);
      }
      break;
    }
    case 'highlight-marker': {
      // Feature removed — no-op.
      break;
    }
    case 'line': case 'arrow': {
      ctx.lineWidth = sw(cmd.width||2.5);
      const [x1,y1]=worldToScreen(cmd.x1,cmd.y1); const [x2,y2]=worldToScreen(cmd.x2,cmd.y2);
      const cx=x1+(x2-x1)*t, cy=y1+(y2-y1)*t;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(cx,cy); ctx.stroke();
      if(cmd.type==='arrow' && t>=0.98){
        const angle=Math.atan2(y2-y1,x2-x1); const headLen=sw(cmd.headSize||12);
        ctx.beginPath(); ctx.moveTo(x2,y2);
        ctx.lineTo(x2-headLen*Math.cos(angle-Math.PI/7), y2-headLen*Math.sin(angle-Math.PI/7));
        ctx.lineTo(x2-headLen*Math.cos(angle+Math.PI/7), y2-headLen*Math.sin(angle+Math.PI/7));
        ctx.closePath(); ctx.fill();
      }
      drawPen(cx,cy,Math.atan2(y2-y1,x2-x1));
      break;
    }
    case 'curve': {
      ctx.lineWidth = sw(cmd.width||2.5);
      const pts = cmd.points.map(p=>worldToScreen(p[0],p[1]));
      const [penX,penY] = strokeSmoothCurvePartial(pts, t);
      drawPen(penX,penY,0);
      break;
    }
    case 'rect': {
      ctx.lineWidth = sw(cmd.width||2.5);
      const [x,y]=worldToScreen(cmd.x,cmd.y); const w=sw(cmd.w), h=sw(cmd.h);
      const perim=2*(w+h), drawn=perim*t;
      ctx.beginPath(); let remaining=drawn, px=x, py=y; ctx.moveTo(px,py);
      const segs=[[w,0],[0,h],[-w,0],[0,-h]];
      for(const [dx,dy] of segs){
        const len=Math.hypot(dx,dy), use=Math.min(len,remaining), frac=use/len;
        px+=dx*frac; py+=dy*frac; ctx.lineTo(px,py); remaining-=use;
        if(remaining<=0) break;
      }
      ctx.stroke(); drawPen(px,py,0);
      break;
    }
    case 'circle': {
      ctx.lineWidth = sw(cmd.width||2.5);
      const [x,y]=worldToScreen(cmd.x,cmd.y); const rx=sw(cmd.rx), ry=sw(cmd.ry);
      ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,-Math.PI/2,-Math.PI/2+t*Math.PI*2); ctx.stroke();
      const ang=-Math.PI/2+t*Math.PI*2;
      drawPen(x+rx*Math.cos(ang), y+ry*Math.sin(ang), ang+Math.PI/2);
      break;
    }
    case 'axes': {
      const [ox,oy]=worldToScreen(cmd.x,cmd.y); const w=sw(cmd.w), h=sw(cmd.h);
      if(t>=0.99) drawAxesGrid(ox, oy, w, h, cmd);
      ctx.lineWidth = sw(2);
      const total=w+h, drawn=total*t;
      ctx.beginPath(); ctx.moveTo(ox,oy);
      const yLen=Math.min(h,drawn); ctx.lineTo(ox,oy-yLen);
      let penX=ox, penY=oy-yLen;
      if(drawn>h){ ctx.moveTo(ox,oy); const xLen=Math.min(w,drawn-h); ctx.lineTo(ox+xLen,oy); penX=ox+xLen; penY=oy; }
      ctx.stroke();
      if(t>=0.99){
        drawArrowhead(ox, oy-h, -Math.PI/2, color);
        drawArrowhead(ox+w, oy, 0, color);
        drawAxesTicksAndLabels(ox, oy, w, h, cmd, color);
      }
      drawPen(penX,penY,0);
      break;
    }
    case 'plot': {
      const [ox,oy]=worldToScreen(cmd.x,cmd.y); const w=sw(cmd.w), h=sw(cmd.h);
      const curves = cmd.curves || [];
      // First slice of the duration draws the axes+grid+ticks; the rest is
      // split evenly across each curve, drawn one after another, so a plot
      // with 2 lines visibly draws the first line, then the second.
      const axesFrac = curves.length ? 0.3 : 1;
      const axesT = Math.min(1, t/axesFrac);
      if(axesT>=0.99) drawAxesGrid(ox, oy, w, h, cmd);
      ctx.lineWidth = sw(2); ctx.strokeStyle = color; ctx.fillStyle = color;
      const axTotal=w+h, axDrawn=axTotal*axesT;
      ctx.beginPath(); ctx.moveTo(ox,oy);
      const yLen=Math.min(h,axDrawn); ctx.lineTo(ox,oy-yLen);
      let penX=ox, penY=oy-yLen;
      if(axDrawn>h){ ctx.moveTo(ox,oy); const xLen=Math.min(w,axDrawn-h); ctx.lineTo(ox+xLen,oy); penX=ox+xLen; penY=oy; }
      ctx.stroke();
      if(axesT>=0.99){
        drawArrowhead(ox, oy-h, -Math.PI/2, color);
        drawArrowhead(ox+w, oy, 0, color);
        drawAxesTicksAndLabels(ox, oy, w, h, cmd, color);
      }
      if(curves.length){
        const [scaleX, scaleY] = plotScalers(ox, oy, w, h, cmd);
        const perCurve = (1-axesFrac)/curves.length;
        curves.forEach((curve, i) => {
          const curveT = Math.max(0, Math.min(1, (t-axesFrac-i*perCurve)/perCurve));
          if(curveT<=0) return;
          const pts = (curve.points||[]).map(p=>[scaleX(p[0]), scaleY(p[1])]);
          if(pts.length<2) return;
          ctx.strokeStyle = COLORS[curve.color] || color;
          ctx.lineWidth = sw(curve.width||2.75);
          const [cx,cy] = strokeSmoothCurvePartial(pts, curveT);
          if(curveT>=1){
            if(curve.label){
              ctx.fillStyle = COLORS[curve.color] || color;
              ctx.font = `${sw(13)}px 'JetBrains Mono', 'STIX Two Text', monospace`;
              ctx.textAlign = 'left';
              ctx.fillText(curve.label, cx+sw(8), cy+sw(4));
            }
          } else { penX=cx; penY=cy; }
        });
      }
      drawPen(penX,penY,0);
      break;
    }
    case 'highlight': {
      ctx.globalAlpha = 0.18*t;
      const [x,y]=worldToScreen(cmd.x,cmd.y);
      ctx.fillRect(x,y,sw(cmd.w)*t, sw(cmd.h||26));
      ctx.globalAlpha=1;
      break;
    }
    case 'halo': {
      const [x,y] = worldToScreen(cmd.x, cmd.y);
      const r = sw(cmd.r || 60);
      const glow = COLORS[cmd.color] || HALO;
      const grad = ctx.createRadialGradient(x,y,0,x,y,r);
      grad.addColorStop(0, hexToRgba(glow, 0.40*t));
      grad.addColorStop(1, hexToRgba(glow, 0));
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
      break;
    }
  }
}

/* =========================================================
   VOICE: speech synthesis (out, captions) + recognition (in)

   Browser TTS has no truly natural option without a paid API,
   so this picks the best available system/browser voice by a
   quality heuristic, and improves cadence by speaking sentence
   by sentence (with small inter-sentence pauses) rather than as
   one long utterance, which reduces the flat/rushed rambling
   that a single long SpeechSynthesisUtterance tends to produce.
   ========================================================= */
const avatar = document.getElementById('avatar');
const captionText = document.getElementById('caption-text');
let currentUtteranceText = '';
let currentSpeechToken = 0; // increments to cancel in-flight sentence queues

/* ---- voice selection ---- */
let bestVoice = null;
let voicesReady = false;
let voiceListInitialized = false;

function scoreVoice(v){
  let score = 0;
  const name = v.name || '';
  // Highest-quality signals first (these names appear in Chrome/Edge/Safari on most OSes)
  if(/Natural/i.test(name)) score += 100;
  if(/Neural/i.test(name)) score += 95;
  if(/Premium/i.test(name)) score += 90;
  if(/Enhanced/i.test(name)) score += 85;
  if(/Google/i.test(name)) score += 70;
  if(/Microsoft.*Online/i.test(name)) score += 65;
  if(/Siri/i.test(name)) score += 60;
  // Prefer local (no network dependency, more reliable in this sandboxed context)
  if(v.localService) score += 8;
  // Prefer standard English varieties, mild preference for US/GB over others
  if(/^en-US$/i.test(v.lang)) score += 6;
  else if(/^en-GB$/i.test(v.lang)) score += 5;
  else if(/^en/i.test(v.lang)) score += 3;
  // Slight preference for voices whose names suggest a warmer/female timbre often
  // tuned for narration (this is a rough heuristic, not a guarantee)
  if(/Samantha|Aria|Jenny|Libby|Sonia|Serena/i.test(name)) score += 4;
  return score;
}

function pickBestVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || voices.length === 0) return null;
  const english = voices.filter(v => /^en/i.test(v.lang));
  const pool = english.length ? english : voices;
  pool.sort((a,b) => scoreVoice(b) - scoreVoice(a));
  return pool[0] || null;
}

function refreshVoiceList(){
  bestVoice = pickBestVoice();
  voicesReady = !!bestVoice;
  populateVoiceDropdown();
}

if('speechSynthesis' in window){
  // Chrome loads voices asynchronously; Safari/Firefox often have them immediately.
  refreshVoiceList();
  window.speechSynthesis.onvoiceschanged = refreshVoiceList;
  // Fallback poll in case onvoiceschanged never fires (some embedded browser contexts)
  let pollTries = 0;
  const pollInterval = setInterval(()=>{
    pollTries++;
    if(voicesReady || pollTries > 20){ clearInterval(pollInterval); return; }
    refreshVoiceList();
  }, 250);
}

function populateVoiceDropdown(){
  const sel = document.getElementById('voice-select');
  if(!sel) return;
  const voices = window.speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  const pool = voices.length ? voices : window.speechSynthesis.getVoices();
  if(!pool.length) return;
  const currentVal = sel.value;
  sel.innerHTML = '';
  pool.sort((a,b)=> scoreVoice(b)-scoreVoice(a)).forEach(v=>{
    const opt = document.createElement('option');
    opt.value = v.name;
    opt.textContent = v.name + (v.localService ? '' : ' (network)');
    sel.appendChild(opt);
  });
  // Restore user's manual choice if they made one, else select bestVoice
  if(currentVal && pool.some(v=>v.name===currentVal)){
    sel.value = currentVal;
  } else if(bestVoice){
    sel.value = bestVoice.name;
  }
}

function getSelectedVoice(){
  const sel = document.getElementById('voice-select');
  const voices = window.speechSynthesis.getVoices();
  if(sel && sel.value){
    const chosen = voices.find(v => v.name === sel.value);
    if(chosen) return chosen;
  }
  return bestVoice;
}

/* ---- sentence-chunked speaking for better cadence ---- */

function splitIntoSpeechChunks(text){
  // Split on sentence boundaries, keeping punctuation; also break very long
  // sentences at commas/semicolons so no single utterance runs on too long.
  const sentences = text.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [text];
  const chunks = [];
  for(let s of sentences){
    s = s.trim();
    if(!s) continue;
    if(s.length > 160){
      const parts = s.split(/(?<=[,;:])\s+/);
      let buf = '';
      for(const p of parts){
        if((buf + ' ' + p).trim().length > 160 && buf){ chunks.push(buf.trim()); buf = p; }
        else buf = (buf ? buf + ' ' : '') + p;
      }
      if(buf.trim()) chunks.push(buf.trim());
    } else {
      chunks.push(s);
    }
  }
  return chunks;
}

function renderCaption(fullText, chunkStartIndex, chunkText){
  const said = fullText.slice(0, chunkStartIndex);
  const windowStart = Math.max(0, said.length - 70);
  const fadedPart = fullText.slice(windowStart, chunkStartIndex);
  const freshPart = chunkText;
  captionText.innerHTML = `<span class="fading">${escapeHtml(fadedPart)}</span><span>${escapeHtml(freshPart)}</span>`;
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const myToken = ++currentSpeechToken;
  currentUtteranceText = text;
  const chunks = splitIntoSpeechChunks(text);
  let searchPos = 0;
  const chunkOffsets = chunks.map(c => {
    const idx = text.indexOf(c, searchPos);
    searchPos = idx >= 0 ? idx + c.length : searchPos;
    return idx >= 0 ? idx : searchPos;
  });

  const voice = getSelectedVoice();

  function speakChunk(i){
    if(myToken !== currentSpeechToken) return; // superseded by a newer speak() call
    if(i >= chunks.length){ avatar.classList.remove('speaking'); return; }
    const utter = new SpeechSynthesisUtterance(chunks[i]);
    utter.rate = 0.96;
    utter.pitch = 1.0;
    if(voice) utter.voice = voice;
    renderCaption(text, chunkOffsets[i], chunks[i]);
    utter.onstart = () => avatar.classList.add('speaking');
    utter.onend = () => {
      if(myToken !== currentSpeechToken) return;
      // small natural pause between sentences; slightly longer after a sentence
      // that ends with a question mark, to mimic a lecturer pausing for effect
      const pause = /\?\s*$/.test(chunks[i]) ? 260 : 140;
      setTimeout(()=> speakChunk(i+1), pause);
    };
    utter.onerror = () => { if(myToken === currentSpeechToken) speakChunk(i+1); };
    window.speechSynthesis.speak(utter);
  }
  speakChunk(0);
}
document.getElementById('btn-replay').addEventListener('click', ()=>{ if(currentUtteranceText) speak(currentUtteranceText); });

function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

let recognition=null, listening=false;
const micBtn = document.getElementById('btn-mic');
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRec){
  recognition = new SpeechRec();
  recognition.continuous=false; recognition.interimResults=false; recognition.lang='en-US';
  recognition.onresult = (e)=>{ const text=e.results[0][0].transcript; handleAsk(text); };
  recognition.onend = ()=>{ listening=false; micBtn.classList.remove('live'); };
  recognition.onerror = ()=>{ listening=false; micBtn.classList.remove('live'); };
} else {
  micBtn.classList.add('unsupported');
  micBtn.title = 'Voice input not supported in this browser';
}
micBtn.addEventListener('click', ()=>{
  if(!recognition) return;
  if(listening){ recognition.stop(); return; }
  listening=true; micBtn.classList.add('live'); recognition.start();
});

/* =========================================================
   PDF IMPORT
   ========================================================= */
// Guard against the pdf.js CDN script failing to load (blocked, offline,
// slow network, etc.) — without this guard, referencing pdfjsLib here would
// throw and silently kill every line of setup code below it (canvas sizing,
// session restore, event listeners), leaving a blank board with no PDF
// import ever attempted.
const pdfjsAvailable = typeof pdfjsLib !== 'undefined';
if(pdfjsAvailable){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
} else {
  console.error('pdf.js failed to load from CDN — PDF import will be disabled for this session.');
}
let pdfText = '', pdfFileName = '';
const uploadZone = document.getElementById('upload-zone');
const pdfInput = document.getElementById('pdf-input');
uploadZone.addEventListener('click', ()=> pdfInput.click());
uploadZone.addEventListener('dragover', (e)=> e.preventDefault());
uploadZone.addEventListener('drop', (e)=>{ e.preventDefault(); if(e.dataTransfer.files.length) handlePdfFile(e.dataTransfer.files[0]); });
pdfInput.addEventListener('change', (e)=>{ if(e.target.files.length) handlePdfFile(e.target.files[0]); });

async function handlePdfFile(file){
  if(!pdfjsAvailable){ alert('PDF import couldn\'t load its engine (a network or blocker issue). Try reloading the page.'); return; }
  if(file.type !== 'application/pdf'){ alert('Please choose a PDF file.'); return; }
  setStatus('reading pdf…');
  pdfFileName = file.name;
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
  let fullText = '';
  const maxPages = Math.min(pdf.numPages, 40);
  for(let i=1;i<=maxPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    fullText += `\n\n[Page ${i}]\n` + content.items.map(it=>it.str).join(' ');
  }
  pdfText = fullText;
  uploadZone.classList.add('has-file');
  uploadZone.innerHTML = `<div class="file-name">📄 ${escapeHtml(pdfFileName)}</div><div class="file-meta">${pdf.numPages} pages · text extracted</div>`;
  setStatus('pdf ready');
}

/* =========================================================
   UI HELPERS
   ========================================================= */
const transcriptEl = document.getElementById('transcript');
const statusLine = document.getElementById('status-line');
function setStatus(s){ statusLine.textContent = s; }

function addTranscriptMsg(who, text){
  const empty = transcriptEl.querySelector('.empty-note');
  if(empty) empty.remove();
  const div = document.createElement('div');
  div.className = `msg ${who}`;
  div.innerHTML = `<span class="who">${who==='tutor'?'TUTOR':'YOU'}</span>${escapeHtml(text)}`;
  transcriptEl.appendChild(div);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

function addQuizCard(quiz){
  const empty = transcriptEl.querySelector('.empty-note');
  if(empty) empty.remove();
  const card = document.createElement('div');
  card.className = 'quiz-card';
  const qEl = document.createElement('div'); qEl.className='quiz-q'; qEl.textContent = quiz.question;
  card.appendChild(qEl);
  const explainEl = document.createElement('div'); explainEl.className='quiz-explain'; explainEl.textContent = quiz.explanation;
  quiz.options.forEach((opt, idx)=>{
    const b = document.createElement('button'); b.className='quiz-opt'; b.textContent = opt;
    b.addEventListener('click', ()=>{
      const buttons = card.querySelectorAll('.quiz-opt');
      buttons.forEach(bb=>bb.disabled=true);
      if(idx===quiz.correctIndex){ b.classList.add('correct'); }
      else { b.classList.add('incorrect'); buttons[quiz.correctIndex].classList.add('correct'); }
      explainEl.classList.add('show');
      // Route the quiz result through the normal teaching turn so roles keep
      // alternating correctly (Anthropic's API rejects consecutive same-role
      // turns) and so the tutor can actually react to right/wrong answers.
      const resultNote = idx===quiz.correctIndex ? 'this was correct' : 'this was incorrect';
      runTeachingTurn(
        `[Quiz answer] For "${quiz.question}", I selected "${opt}" — ${resultNote}. Briefly react to this and then continue per the pacing rules.`,
        `Answered: "${opt}"`
      );
    });
    card.appendChild(b);
  });
  card.appendChild(explainEl);
  transcriptEl.appendChild(card);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

/* =========================================================
   AI BACKEND CALL — supports Claude (default, no key) or
   OpenAI GPT (needs the user's own API key)
   ========================================================= */
const SYSTEM_PROMPT = `You are an expert university lecturer operating a whiteboard tutoring tool called Chalkline.
You teach at genuine university level: rigorous, first-principles, precise terminology, no hand-waving.

You must respond with ONLY a JSON object (no markdown fences, no prose outside the JSON) with this exact shape:
{
  "speech": "the spoken explanation, natural spoken lecture language for text-to-speech (spell out symbols, e.g. 'delta' not the character)",
  "board": [ ...array of drawing command objects... ],
  "quiz": null OR { "question":"...", "options":["...","...","...","..."], "correctIndex":0, "explanation":"..." }
}

Drawing commands use a normalized coordinate space of x:0-1000, y:0-900 for EACH teaching turn (y increasing downward — a fairly tall local frame, giving real room for a full diagram plus supporting text without cramming). The app automatically places each turn directly below the last one, packing turns down the page like real notebook writing — you do NOT need to avoid prior content, track what's already drawn, or think about page breaks yourself; always compose your "board" array as if starting on a fresh blank 1000x900 area, and the app handles fitting it onto the page (starting a new page only once the current one is full).

TEXT ON THE BOARD MUST USE REAL SYMBOLS, NOT SPELLED-OUT WORDS: unlike "speech" (which spells things out for text-to-speech), the "board" is visual, so write actual Unicode glyphs the way you would on a physical whiteboard — π, θ, β, α, γ, Δ, Σ, ∫, √, ∞, ≤, ≥, ≈, ×, ÷, →, ², ³, ₁, ₂, etc. — directly inside "text" strings. E.g. write "β = ∂y/∂x" or "∫₀^∞ e^(−x) dx", not "beta equals the derivative of y with respect to x". Use "mono":true for equations so symbols line up cleanly.

Available command types:
- {"type":"text","x":..,"y":..,"text":"...","size":22,"color":"ink|ochre|sage|brick|teal|violet|sky|coral","mono":false,"handwritten":false,"weight":400,"maxWidth":800}  — set "handwritten":true ONLY for section headings/titles (renders in a marker-style script font, larger). Set "maxWidth" (in the same 0-1000 units, e.g. 800-850 for a near-full-width paragraph) on any text that's a full sentence or more — the app automatically WRAPS it onto multiple lines within that width, like real handwritten notebook prose, instead of running off as one unreadable line. Only omit "maxWidth" for genuinely short labels/headings that are meant to stay on one line.
- {"type":"halo","x":..,"y":..,"r":50,"color":"halo|ochre|sage|teal|violet|sky|coral"} — a soft radial glow centered on a point, drawn BEHIND/BEFORE the term it emphasizes (e.g. right before writing a key result or the answer to a check-in question) to make it visually pop
- {"type":"line","x1":..,"y1":..,"x2":..,"y2":..,"color":"ink","width":2.5}
- {"type":"arrow","x1":..,"y1":..,"x2":..,"y2":..,"color":"ochre","width":2.5}
- {"type":"rect","x":..,"y":..,"w":..,"h":..,"color":"ink","fill":false}
- {"type":"circle","x":..,"y":..,"rx":..,"ry":..,"color":"ink","fill":false}
- {"type":"curve","points":[[x,y],[x,y],...],"color":"sage","width":2.5} — a FREEHAND smoothed line in raw board coordinates. Only use this for non-data decoration (e.g. a squiggly underline, a loose arc pointing at something). NEVER use it to plot data on a graph — it has no connection to any axes, so it can end up misaligned or floating away from them.
- {"type":"axes","x":..,"y":..,"w":..,"h":..,"xlabel":"...","ylabel":"...","title":"...","grid":true,"xTicks":[...],"yTicks":[...]} — bare arrowed axes with gridlines, no data. Only use this for a diagram that ISN'T plotting actual data (e.g. a blank axis to gesture at during explanation).
- {"type":"plot","x":..,"y":..,"w":..,"h":..,"xRange":[0,10],"yRange":[0,10],"xlabel":"...","ylabel":"...","title":"...","grid":true,"xTicks":["0","2","4","6","8","10"],"yTicks":["0","5","10"],"curves":[{"points":[[dataX,dataY],[dataX,dataY],...],"color":"brick","width":2.75,"label":"SRPC"}]} — THIS IS THE COMMAND TO USE FOR ANY ACTUAL DATA GRAPH (a plotted curve, line, demand/supply diagram, function plot, etc). It draws axes+grid+ticks AND every curve together as one unit, with curve "points" given in DATA units (whatever "xRange"/"yRange" span) — the app maps them onto the axes box for you, so the curve is GUARANTEED to sit correctly inside the axes and can never drift off from them the way a separately-placed "axes"+"curve" pair could. You can pass multiple entries in "curves" to overlay several lines (e.g. two Phillips curves before/after a shift) in different colors, each with its own optional "label" drawn at its endpoint.
- {"type":"highlight","x":..,"y":..,"w":..,"h":26,"color":"ochre"}

The board is plain white/cream — colors are: "ink" near-black body text, "ochre" warm amber for emphasis, "sage" muted green for correct/positive, "brick" muted red for warnings/mistakes, "teal", "violet", "sky", "coral" as extra accent colors for distinguishing multiple curves/terms/categories, "halo" a soft blue glow.

COORDINATES FOR "axes"/"plot": "x","y" is the position of the ORIGIN (bottom-left corner), and the box extends UPWARD by "h" and RIGHTWARD by "w" — so the top of the graph is at screen-y = y-h, not y+h. Size the box and choose "y" so the whole box (from y-h to y) fits inside the 0-900 frame with room to spare above (for a title) and below (for axis labels).

STRICT COORDINATE BOUNDS — every command must stay fully inside the 1000x900 page: never place any "x" below 20 or above 980, and never place any "y" below 20 or above 880. For "axes"/"plot", that means "x" + "w" must not exceed ~950, and "y" - "h" must not go below ~90 (leaving headroom for a title above the box). Anything outside this range gets clipped by the app, so an out-of-range value just produces a cut-off, ugly result — always compute values that fit within these bounds up front.

AVOID OVERLAPPING CONTENT: every element you place (text, axes/plot box, halo) occupies real space, and nothing on the board should visually overlap anything else. A wrapped paragraph (with "maxWidth" set) takes up several lines of vertical space, not just one — leave at least 25-30 units of clear gap between the BOTTOM of a wrapped paragraph's last line and whatever comes next, not just below its starting "y".

Layout pattern: start with ONE handwritten title near the top-left (around x:90,y:120) sized around 30. Build the explanation below that, starting no earlier than y:170, like a real page of class notes: full sentences in wrapped paragraphs (use "maxWidth" as described above so they read across most of the page width, not short choppy fragments), organized top-to-bottom in a single clean column. Use around 14-22 commands per turn: state the definition or claim as a full wrapped sentence, then more wrapped-paragraph text unpacking it (the intuition behind it, a worked micro-example or numeric case), plus a short numbered or lettered sub-list where it naturally fits (e.g. components of a concept, steps of a process) — give each sub-list a distinct accent color (e.g. all its items in "ochre" or "teal") so it visually separates from the surrounding body text, similar to how a student color-codes their own notes. Fill a good portion of the 1000x900 page rather than leaving most of it blank — an equation on its own with nothing else is not enough; always accompany it with plain-language paragraph text explaining what it means. Do not scatter items sideways or place two unrelated things at the same height, since that reads as disorganized — everything reads top-to-bottom in order. For math: mono text, one step per line, 40+ units apart vertically, using real symbols as above. For any data graph, use a single "plot" command (see above) — never bare "axes" plus a separate "curve" — so the picture is always accurate, gridded, ticked, and self-explanatory at a glance.

PACING RULES (strict — this is the most important behavioural constraint):
- Teach in SMALL bites: explain ONE definition, ONE step of a derivation, or ONE component of a concept per turn — not a whole topic, not even a whole "section". Think 2-4 sentences of speech per turn, occasionally a bit more only when a single idea genuinely needs it (e.g. deriving one formula).
- After every single bite, STOP and either ask a real comprehension-check question about exactly what you just said, or explicitly ask "should we continue?" / "want me to go on to the next part?". Never chain multiple ideas together before checking in.
- Do not lecture for multiple paragraphs uninterrupted. If you notice your "speech" is getting long, cut it — split the idea and save the rest for the next turn.
- If the student's message is answering a comprehension check or a follow-up, respond conversationally and briefly — correct misconceptions precisely, pointing out exactly where reasoning went wrong — then again stop and check in before adding the next bite. Only add new "board" content if there's something new worth drawing (an empty "board" array is fine if you're just discussing what's already up).
- If the student explicitly says "continue", "go on", "yes", or similar in response to a check-in, proceed with exactly the next single bite — still short, still followed by another check-in.
- Only include "quiz" when the student explicitly asks to be quizzed, or it's a natural checkpoint fitting their request. Otherwise null.
- If source document text is provided, ground explanations in it and reference it directly (e.g. "as your notes on page 3 show...").`;

let conversationHistory = [];
let aiBrain = 'gemini'; // 'gemini' | 'groq'
// Set this to your deployed proxy's URL once (see PROXY_SETUP.md). Every
// visitor's request goes through this endpoint — your Gemini/Groq keys live
// only on the proxy server as private secrets, never in this file.
const PROXY_URL = "https://api.takundamambudzi02.workers.dev";

document.getElementById('brain-select').addEventListener('change', (e)=>{
  aiBrain = e.target.value;
});

async function callTutor(userMessage){
  setStatus('thinking…');
  const contextParts = [];
  if(pdfText && conversationHistory.length===0){
    contextParts.push(`SOURCE DOCUMENT (${pdfFileName}), extracted text:\n${pdfText.slice(0,15000)}`);
  }
  contextParts.push(userMessage);
  const fullUserContent = contextParts.join('\n\n---\n\n');
  conversationHistory.push({role:'user', content: fullUserContent});

  let result;
  if(aiBrain === 'groq') result = await callGroq();
  else result = await callGemini();

  if(!result.ok){
    conversationHistory.pop(); // don't poison history with a failed turn
    setStatus(result.status || 'error — see console');
    return { speech: result.errorSpeech, board: [] };
  }

  try{
    const parsed = JSON.parse(result.raw);
    conversationHistory.push({role:'assistant', content: result.raw});
    setStatus('idle');
    return parsed;
  } catch(jsonErr){
    console.error('Model output was not valid JSON. Raw text:', result.raw);
    setStatus('malformed JSON — see console');
    conversationHistory.pop();
    return { speech:"The lecture content came back malformed. Check the console to see exactly what came back.", board:[] };
  }
}

async function callGroq(){
  if(PROXY_URL.includes('YOUR-WORKER-SUBDOMAIN')){
    return { ok:false, status:'proxy not configured', errorSpeech:"The AI proxy hasn't been set up yet — see PROXY_SETUP.md to deploy it, then set PROXY_URL in this file." };
  }
  let response, data;
  try{
    response = await fetch(`${PROXY_URL}/groq`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"openai/gpt-oss-120b",
        response_format:{ type:"json_object" },
        max_tokens:2000,
        messages: [
          { role:"system", content: SYSTEM_PROMPT },
          ...conversationHistory
        ]
      })
    });
  } catch(networkErr){
    console.error('Network-level failure calling the proxy (Groq):', networkErr);
    return { ok:false, status:'network error — see console', errorSpeech:"The request never reached the proxy — check the browser console and confirm PROXY_URL is correct and the proxy is deployed." };
  }

  try{ data = await response.json(); }
  catch(parseErr){
    console.error('Proxy response was not valid JSON. Raw response:', response);
    return { ok:false, status:'bad response — see console', errorSpeech:"The proxy responded, but not with valid JSON. Check the console." };
  }

  if(!response.ok){
    console.error('Groq (via proxy) returned an error status:', response.status, data);
    const msg = (data && data.error && data.error.message) ? data.error.message : JSON.stringify(data);
    return { ok:false, status:`API error ${response.status} — see console`, errorSpeech:`Groq returned an error: ${msg}` };
  }

  const choice = data.choices && data.choices[0];
  const raw = choice && choice.message && choice.message.content;
  if(!raw){
    console.error('Unexpected Groq response shape:', data);
    return { ok:false, status:'unexpected response — see console', errorSpeech:"Groq's response came back in a shape I didn't expect. Check the console." };
  }
  return { ok:true, raw: raw.trim() };
}

async function callGemini(){
  if(PROXY_URL.includes('YOUR-WORKER-SUBDOMAIN')){
    return { ok:false, status:'proxy not configured', errorSpeech:"The AI proxy hasn't been set up yet — see PROXY_SETUP.md to deploy it, then set PROXY_URL in this file." };
  }
  // Gemini's REST format differs from the shared history shape used above:
  // roles are "user"/"model" (not "assistant"), content is nested under
  // "parts", and the system prompt is a separate top-level field rather than
  // a message in the array. Translate conversationHistory into that shape
  // without altering the shared history structure used elsewhere.
  const geminiContents = conversationHistory.map(m => ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: m.content }]
  }));

  let response, data;
  try{
    response = await fetch(`${PROXY_URL}/gemini`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: geminiContents,
        generationConfig: {
          response_mime_type: "application/json",
          maxOutputTokens: 2500,
          // Gemini 3.x "thinking" defaults to a moderate level, which spends
          // output-token budget on internal reasoning before the answer.
          // Our teaching turns are intentionally short (see pacing rules in
          // SYSTEM_PROMPT), so a light thinking level keeps responses fast
          // without needing deep reasoning for this kind of task.
          thinkingConfig: { thinkingLevel: "low" }
        }
      })
    });
  } catch(networkErr){
    console.error('Network-level failure calling the proxy (Gemini):', networkErr);
    return { ok:false, status:'network error — see console', errorSpeech:"The request never reached the proxy — check the browser console and confirm PROXY_URL is correct and the proxy is deployed." };
  }

  try{ data = await response.json(); }
  catch(parseErr){
    console.error('Gemini response was not valid JSON. Raw response:', response);
    return { ok:false, status:'bad response — see console', errorSpeech:"Gemini's server responded, but not with valid JSON. Check the console." };
  }

  if(!response.ok){
    console.error('Gemini API returned an error status:', response.status, data);
    const msg = (data && data.error && data.error.message) ? data.error.message : JSON.stringify(data);
    const hint = response.status === 429 ? " You've likely hit the free-tier rate limit (requests per minute or per day) — wait a bit and try again." : '';
    return { ok:false, status:`API error ${response.status} — see console`, errorSpeech:`Gemini returned an error: ${msg}${hint}` };
  }

  const candidate = data.candidates && data.candidates[0];
  const part = candidate && candidate.content && candidate.content.parts && candidate.content.parts[0];
  const raw = part && part.text;
  if(!raw){
    console.error('Unexpected Gemini response shape:', data);
    // A common non-error case: the response was cut off or blocked by safety
    // filters, which shows up as a missing parts array with a finishReason.
    const finishReason = candidate && candidate.finishReason;
    const extra = finishReason ? ` (finish reason: ${finishReason})` : '';
    return { ok:false, status:'unexpected response — see console', errorSpeech:`Gemini's response came back in a shape I didn't expect${extra}. Check the console.` };
  }
  return { ok:true, raw: raw.trim() };
}

async function runTeachingTurn(userMessage, displayText){
  // displayText lets callers show a friendlier line in the transcript than
  // the full prompt sent to the model (used by the quiz-answer flow).
  addTranscriptMsg('user', displayText !== undefined ? displayText : userMessage);
  const result = await callTutor(userMessage);
  // Only advance to a fresh block of the board when there's actually new
  // content to draw — a pure follow-up discussion with no board content
  // stays on the current view instead of jumping to blank space.
  if(result.board && result.board.length) enqueueCommandsAtCursor(result.board);
  if(result.speech){ addTranscriptMsg('tutor', result.speech); speak(result.speech); }
  if(result.quiz) addQuizCard(result.quiz);
  autoSaveSession();
}

/* =========================================================
   SESSION PERSISTENCE
   ========================================================= */
let currentSessionId = 'session_' + Date.now();
let currentSessionTitle = null;

function transcriptToHtmlSnapshot(){ return transcriptEl.innerHTML; }

async function saveSession(promptForName){
  try{
    let title = currentSessionTitle;
    if(promptForName || !title){
      title = prompt('Name this session:', title || (pdfFileName ? pdfFileName.replace(/\.pdf$/i,'') : 'Untitled session'));
      if(title===null) return;
      currentSessionTitle = title || 'Untitled session';
    }
    await persistSession();
    setStatus('session saved');
  } catch(err){ console.error('Save failed:', err); setStatus('save failed — see console'); }
}

async function persistSession(){
  const payload = {
    id: currentSessionId,
    title: currentSessionTitle || (pdfFileName ? pdfFileName.replace(/\.pdf$/i,'') : 'Untitled session'),
    savedAt: Date.now(),
    pdfFileName, pdfText: pdfText ? pdfText.slice(0,15000) : '',
    conversationHistory, drawnCommands, camera,
    pageCount, boardCursor,
    transcriptHtml: transcriptToHtmlSnapshot()
  };
  await window.storage.set('session:' + currentSessionId, JSON.stringify(payload), false);
  refreshSessionList();
}

function autoSaveSession(){ if(conversationHistory.length>0) persistSession().catch(e=>console.error('Autosave failed:',e)); }

async function refreshSessionList(){
  const listEl = document.getElementById('session-list');
  try{
    const result = await window.storage.list('session:', false);
    const keys = (result && result.keys) ? result.keys : [];
    if(keys.length===0){ listEl.innerHTML = '<div class="empty-note">No saved sessions yet.</div>'; return; }
    const items = [];
    for(const key of keys){
      try{ const rec = await window.storage.get(key, false); if(rec) items.push(JSON.parse(rec.value)); } catch(e){}
    }
    items.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
    listEl.innerHTML = '';
    items.forEach(item=>{
      const div = document.createElement('div'); div.className='session-item';
      const date = new Date(item.savedAt);
      div.innerHTML = `<span class="s-name">${escapeHtml(item.title||'Untitled')}</span><span class="s-date">${date.toLocaleDateString()}</span>`;
      div.addEventListener('click', ()=> loadSession(item));
      listEl.appendChild(div);
    });
  } catch(err){ console.error('Listing sessions failed:', err); listEl.innerHTML = '<div class="empty-note">Could not load saved sessions.</div>'; }
}

function resetUploadZoneUI(){
  uploadZone.classList.remove('has-file');
  uploadZone.innerHTML = `Drop a PDF, or click to import a chapter, slide deck or notes.<input type="file" id="pdf-input" accept="application/pdf">`;
  document.getElementById('pdf-input').addEventListener('change', (e)=>{ if(e.target.files.length) handlePdfFile(e.target.files[0]); });
}

function loadSession(item){
  currentSessionId = item.id; currentSessionTitle = item.title;
  pdfFileName = item.pdfFileName || ''; pdfText = item.pdfText || '';
  conversationHistory = item.conversationHistory || [];
  drawnCommands = item.drawnCommands || [];
  if(item.camera) Object.assign(camera, item.camera);
  pageCount = item.pageCount || 1;
  if(item.boardCursor) Object.assign(boardCursor, item.boardCursor);
  transcriptEl.innerHTML = item.transcriptHtml || '<div class="empty-note">No transcript in this session.</div>';
  if(pdfFileName){
    uploadZone.classList.add('has-file');
    uploadZone.innerHTML = `<div class="file-name">📄 ${escapeHtml(pdfFileName)}</div><div class="file-meta">restored from saved session</div>`;
  } else { resetUploadZoneUI(); }
  redrawAll();
  setStatus('session loaded');
  closePanel();
}

document.getElementById('btn-save').addEventListener('click', ()=> saveSession(true));
document.getElementById('btn-new-session').addEventListener('click', ()=>{
  currentSessionId = 'session_' + Date.now(); currentSessionTitle = null;
  pdfText=''; pdfFileName='';
  conversationHistory=[]; drawQueue=[]; drawnCommands=[];
  camera.x=500; camera.y=300; camera.scale=1;
  pageCount=1; boardCursor.x=0; boardCursor.y=PAGE_TOP_MARGIN;
  clearBoard();
  transcriptEl.innerHTML = '<div class="empty-note">Your lecture transcript and quiz questions will appear here as we go.</div>';
  resetUploadZoneUI();
  setStatus('new session');
});

/* =========================================================
   SIDE PANEL TOGGLES
   ========================================================= */
const sidePanel = document.getElementById('side-panel');
const overlay = document.getElementById('overlay');
function openPanel(){ sidePanel.classList.add('open'); overlay.classList.add('open'); }
function closePanel(){ sidePanel.classList.remove('open'); overlay.classList.remove('open'); }
document.getElementById('btn-menu').addEventListener('click', openPanel);
document.getElementById('btn-panel-close').addEventListener('click', closePanel);
overlay.addEventListener('click', closePanel);
document.getElementById('btn-toggle-transcript').addEventListener('click', openPanel);

/* =========================================================
   WIRE UP CONTROLS
   ========================================================= */
document.getElementById('btn-teach').addEventListener('click', ()=>{
  const val = document.getElementById('topic-input').value.trim();
  if(!val) return;
  runTeachingTurn(val);
  document.getElementById('topic-input').value = '';
  closePanel();
});
document.getElementById('btn-quiz').addEventListener('click', ()=>{
  const val = document.getElementById('topic-input').value.trim();
  const prompt = val ? `Please quiz me on: ${val}` : (pdfText ? `Please quiz me on the uploaded document.` : `Please quiz me on the most recent topic we discussed.`);
  runTeachingTurn(prompt);
  closePanel();
});
function handleAsk(text){
  if(!text || !text.trim()) return;
  runTeachingTurn(text.trim());
  document.getElementById('ask-input').value = '';
}
document.getElementById('btn-ask').addEventListener('click', ()=> handleAsk(document.getElementById('ask-input').value));
document.getElementById('ask-input').addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleAsk(e.target.value); });

/* =========================================================
   INIT
   ========================================================= */
document.getElementById('voice-select').addEventListener('change', ()=>{
  if(currentUtteranceText) speak(currentUtteranceText); // re-speak current line in the new voice
});

resizeCanvas();
setStatus('idle');
refreshSessionList();
<\/script>

<body>

<div class="ambient-halo"></div>

<div class="wrap">
  <nav>
    <a class="brand" href="#" onclick="parent.postMessage({nav:'home'},'*');return false;"><span class="dot"></span>Chalkline</a>
    <div class="nav-links">
      <a href="#" onclick="parent.postMessage({nav:'tutor'},'*');return false;">Tutor</a>
      <a href="#" class="active" onclick="return false;">Summary</a>
    </div>
  </nav>

  <div class="page-head">
    <h1>Summarize your notes</h1>
    <p>Upload a PDF — a chapter, slide deck, or your own notes — and get back a clear, structured summary of what's actually in it.</p>
  </div>

  <div id="upload-zone">
    Drop a PDF here, or click to choose a file.
