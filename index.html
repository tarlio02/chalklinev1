<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chalkline — AI Study Tools</title>
<style>
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#F3F9FE; font-family:-apple-system,Segoe UI,sans-serif; }
  iframe{ position:fixed; inset:0; width:100%; height:100%; border:none; display:none; background:#F3F9FE; }
  iframe.active{ display:block; }

  /* Real Google Sign-In must live in the top-level page — a srcdoc
     iframe reports location.origin as "null", and Google's Identity
     script refuses to authenticate from a null origin. */
  #shell-auth{
    position:fixed; top:16px; right:20px; z-index:9999;
    display:flex; align-items:center; gap:8px;
    font-family:-apple-system,Segoe UI,sans-serif;
  }
  #shell-account-chip{
    display:none; align-items:center; gap:6px;
    background:#fff; border:1px solid #D3E6F5; border-radius:999px;
    padding:4px 8px 4px 4px; font-size:12.5px; color:#1E2B3A;
    box-shadow:0 1px 4px rgba(0,0,0,0.08);
  }
  #shell-account-chip img{ width:24px; height:24px; border-radius:50%; }
  #shell-account-chip button{
    border:none; background:none; color:#7C93A8; cursor:pointer; font-size:11.5px;
    padding:0 2px;
  }
</style>
</head>
<body>

<div id="shell-auth">
  <div id="shell-signin-btn"></div>
  <div id="shell-account-chip">
    <img id="shell-account-avatar" alt="" title="">
    <button id="shell-sign-out" title="Sign out">✕</button>
  </div>
</div>

<iframe id="frame-landing"></iframe>
<iframe id="frame-home"></iframe>
<iframe id="frame-tutor"></iframe>
<iframe id="frame-summary"></iframe>
<iframe id="frame-tutor-history"></iframe>
<iframe id="frame-summary-history"></iframe>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// Google Sign-In lives here, at the top level, because this is the only
// document with a real, non-null origin (https://tarlio02.github.io).
// The individual "pages" below are rendered into iframes via .srcdoc,
// and srcdoc documents report origin=null — Google's script rejects
// those requests outright (Error 400: invalid_request, origin=null).
const SHELL_GOOGLE_CLIENT_ID = "676487295279-j4qka36obo55unl3vds7ja2v24uoq6dm.apps.googleusercontent.com";

// "Stay signed in": we cache the decoded profile from the ID token in
// localStorage (this top-level page has a real origin, so localStorage
// works fine here). On every fresh page load we restore it immediately,
// before Google's script has even finished loading, so a returning
// visitor doesn't have to sign in again just because they closed the
// tab or came back the next day. This only restores the *display*
// identity (name/email/picture/sub) that was already being decoded
// client-side with no backend verification — same trust level as
// before, just remembered across visits instead of forgotten on reload.
// Once a real backend exists, swap this for a proper refresh-token /
// session-cookie flow and verify server-side instead.
const SHELL_AUTH_STORAGE_KEY = 'chalkline_shell_user';
let shellUser = null;

function decodeShellIdToken(jwt){
  const payload = jwt.split('.')[1];
  const json = decodeURIComponent(atob(payload.replace(/-/g,'+').replace(/_/g,'/')).split('').map(c=>
    '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
  ).join(''));
  return JSON.parse(json);
}

function broadcastAuthState(){
  const msg = { chalklineAuth: true, signedIn: !!shellUser, user: shellUser };
  Object.values(frames).forEach(f => { try{ f.contentWindow.postMessage(msg, '*'); }catch(e){} });
}

function showSignedInChip(user){
  document.getElementById('shell-signin-btn').style.display = 'none';
  const chip = document.getElementById('shell-account-chip');
  chip.style.display = 'flex';
  document.getElementById('shell-account-avatar').src = user.picture || '';
  document.getElementById('shell-account-avatar').title = user.name || user.email || 'Signed in';
}

function restoreShellSession(){
  try{
    const raw = localStorage.getItem(SHELL_AUTH_STORAGE_KEY);
    if(!raw) return;
    shellUser = JSON.parse(raw);
    showSignedInChip(shellUser);
    // Frames haven't loaded yet at this point in the page lifecycle —
    // ensureLoaded() posts the current shellUser to each frame the
    // first time it's opened, so there's nothing to broadcast to yet.
  } catch(e){ console.error('Could not restore saved sign-in:', e); localStorage.removeItem(SHELL_AUTH_STORAGE_KEY); }
}
restoreShellSession();

function handleShellCredential(response){
  shellUser = decodeShellIdToken(response.credential);
  try{ localStorage.setItem(SHELL_AUTH_STORAGE_KEY, JSON.stringify(shellUser)); }
  catch(e){ console.error('Could not persist sign-in:', e); }
  showSignedInChip(shellUser);
  broadcastAuthState();
  // TODO: once a backend exists, send response.credential there to verify
  // the token and load/merge this person's saved sessions.
}

function initShellGoogleSignIn(){
  if(typeof google === 'undefined' || !google.accounts){ setTimeout(initShellGoogleSignIn, 300); return; }
  // auto_select lets Google silently re-confirm a returning visitor who
  // still has an active Google session, refreshing the identity in the
  // background even if our own localStorage cache was ever cleared.
  google.accounts.id.initialize({ client_id: SHELL_GOOGLE_CLIENT_ID, callback: handleShellCredential, auto_select: true });
  google.accounts.id.renderButton(document.getElementById('shell-signin-btn'), { theme:'outline', size:'medium', shape:'pill' });
  if(!shellUser) google.accounts.id.prompt(); // only worth a silent attempt if we have no cached session already
}
initShellGoogleSignIn();

document.getElementById('shell-sign-out').addEventListener('click', signOutShell);

function signOutShell(){
  shellUser = null;
  localStorage.removeItem(SHELL_AUTH_STORAGE_KEY);
  if(typeof google !== 'undefined' && google.accounts) google.accounts.id.disableAutoSelect();
  document.getElementById('shell-account-chip').style.display = 'none';
  document.getElementById('shell-signin-btn').style.display = 'block';
  broadcastAuthState();
}

// Pages inside the iframes can't run Google's script themselves (see
// note above), so they ask the shell to act on their behalf.
window.addEventListener('message', (e)=>{
  const d = e.data;
  if(!d) return;
  if(d.requestLogin && typeof google !== 'undefined' && google.accounts){
    google.accounts.id.prompt();
  }
  if(d.requestSignOut){
    signOutShell();
  }
});

</script>


<script type="text/plain" id="src-landing"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chalkline — AI Study Tools</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@600;700&display=swap');

:root{
  --board-bg:#F3F9FE;
  --ink:#1E2B3A;
  --ochre:#2E7DBE;
  --highlight:#D7ECFB;
  --sage:#3E8FA6;
  --brick:#3D6B93;
  --panel-border:#D3E6F5;
  --muted:#7C93A8;
  --halo-blue:#6EA8FE;
  --halo-blue-soft:#A5C8FF;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Source Serif 4', Georgia, serif;
  color:var(--ink);
  background:var(--board-bg);
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
}

.ambient-halo{
  position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
}
.ambient-halo::before,.ambient-halo::after{
  content:''; position:absolute; width:60vmax;height:60vmax;
  border-radius:50%; filter:blur(100px); opacity:0.26; mix-blend-mode:multiply;
}
.ambient-halo::before{
  top:-22%; left:-18%;
  background:radial-gradient(circle, var(--halo-blue) 0%, rgba(110,168,254,0) 70%);
  animation:drift1 24s ease-in-out infinite;
}
.ambient-halo::after{
  bottom:-25%; right:-15%;
  background:radial-gradient(circle, var(--halo-blue-soft) 0%, rgba(165,200,255,0) 70%);
  animation:drift2 28s ease-in-out infinite;
}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(10%,8%) scale(1.15);}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-8%,-6%) scale(1.12);}}

.wrap{ position:relative; z-index:1; max-width:1040px; margin:0 auto; padding:0 28px; }

nav{
  display:flex; align-items:center; justify-content:space-between;
  padding:26px 0 10px;
}
.brand{
  font-family:'Caveat', cursive; font-weight:700; font-size:28px;
  color:var(--ink); text-decoration:none; display:flex; align-items:center; gap:8px;
}
.brand .dot{ width:9px;height:9px;border-radius:50%; background:var(--ochre); display:inline-block; }
.nav-links{ display:flex; gap:26px; font-family:'JetBrains Mono', monospace; font-size:13px; }
.nav-links a{ color:var(--muted); text-decoration:none; }
.nav-links a:hover{ color:var(--ink); }
@media (max-width:680px){ .nav-links{ display:none; } }

.go-app-btn{
  font-family:'JetBrains Mono', monospace; font-size:12.5px;
  color:var(--ink); text-decoration:none;
  border:1px solid var(--panel-border); border-radius:999px;
  padding:10px 20px; background:#fff;
  transition:border-color .18s ease, transform .18s ease;
}
.go-app-btn:hover{ border-color:var(--ochre); transform:translateY(-1px); }

.nav-right{ display:flex; align-items:center; gap:14px; }
#google-signin-btn-landing{ line-height:0; }
.account-chip{
  display:flex; align-items:center; gap:8px;
  font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink);
  background:#fff; border:1px solid var(--panel-border); border-radius:999px;
  padding:5px 14px 5px 5px;
}
.account-chip img{ width:24px; height:24px; border-radius:50%; }

.hero-card{
  position:relative; z-index:1;
  margin:56px 0 40px;
  border-radius:26px;
  padding:90px 40px;
  text-align:center;
  background:linear-gradient(120deg, var(--highlight) 0%, #EAF3FB 45%, #F6EFF9 100%);
  overflow:hidden;
}
.hero-card::before{
  content:''; position:absolute; inset:0;
  background:radial-gradient(circle at 30% 20%, rgba(110,168,254,0.18), transparent 55%),
             radial-gradient(circle at 80% 85%, rgba(62,143,166,0.16), transparent 55%);
  pointer-events:none;
}
.hero-card h1{
  position:relative; font-size:42px; line-height:1.22; font-weight:600;
  margin:0 auto 20px; max-width:760px; letter-spacing:-0.01em;
}
.hero-card h1 .chalk{
  font-family:'Caveat', cursive; font-weight:700; color:var(--ochre);
}
.hero-card p.sub{
  position:relative; font-size:18px; color:#5c6f80; margin:0 0 34px;
  font-family:'Source Serif 4', Georgia, serif;
}
.cta-btn{
  position:relative; display:inline-block; text-decoration:none;
  font-family:-apple-system,Segoe UI,sans-serif; font-weight:600; font-size:17px;
  color:#fff; padding:16px 40px; border-radius:999px; border:none; cursor:pointer;
  background:linear-gradient(90deg, var(--ochre), var(--sage));
  box-shadow:0 10px 26px rgba(46,125,190,0.28);
  transition:transform .18s ease, box-shadow .18s ease;
}
.cta-btn:hover{ transform:translateY(-2px); box-shadow:0 14px 32px rgba(46,125,190,0.34); }

@media (max-width:680px){
  .hero-card{ padding:60px 24px; border-radius:20px; }
  .hero-card h1{ font-size:30px; }
}

footer{
  border-top:1px solid var(--panel-border); padding:22px 0 40px;
  font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--muted);
  display:flex; justify-content:center; gap:24px; flex-wrap:wrap; text-align:center;
}
footer a{ color:var(--muted); text-decoration:none; }
footer a:hover{ color:var(--ink); }
</style>
</head>
<body>

<div class="ambient-halo"></div>

<div class="wrap">
  <nav>
    <a class="brand" href="#" onclick="parent.postMessage({nav:'landing'},'*');return false;"><span class="dot"></span>Chalkline</a>
    <div class="nav-links">
      <a href="#" onclick="parent.postMessage({nav:'home'},'*');return false;">About</a>
    </div>
    <div class="nav-right">
      <div id="account-signed-in-landing" style="display:none;">
        <div class="account-chip">
          <img id="account-avatar-landing" alt="">
          <span id="account-name-landing"></span>
        </div>
      </div>
      <a class="go-app-btn" href="#" onclick="parent.postMessage({nav:'home'},'*');return false;">Go to App</a>
    </div>
  </nav>

  <section class="hero-card">
    <h1>Start with your notes, slides, <span class="chalk">or textbook.</span><br>Your first lesson is free.</h1>
    <p class="sub">Try it on whatever's due tomorrow.</p>
    <a class="cta-btn" href="#" onclick="parent.postMessage({nav:'home'},'*');return false;">Start for free</a>
  </section>

  <footer>
    <a href="#" onclick="parent.postMessage({nav:'home'},'*');return false;">About</a>
    <span>© Chalkline</span>
  </footer>
</div>

<script>
// Google Sign-In itself runs one level up, in the top-level shell page —
// a srcdoc iframe (which is what this page is) reports its origin as
// "null", and Google's script refuses to authenticate from a null
// origin. This page just listens for the shell to tell it the current
// sign-in state and reflects it in the UI.
window.addEventListener('message', (e)=>{
  const d = e.data;
  if(!d || !d.chalklineAuth) return;
  const out = document.getElementById('account-signed-in-landing');
  if(d.signedIn && d.user){
    out.style.display = 'block';
    document.getElementById('account-avatar-landing').src = d.user.picture || '';
    document.getElementById('account-name-landing').textContent = d.user.name || d.user.email || 'Signed in';
  } else {
    out.style.display = 'none';
  }
});
<\/script>

</body>
</html>
</script>

        <svg viewBox="0 0 16 16" fill="none"><path d="M2 8h11M9 3.5 13.5 8 9 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>

<style>

.ambient-halo{
  position:fixed;

.ambient-halo::before,
.ambient-halo::after{
  content:'';

.side-panel{

<script>
/* ---------------------------------------------------------------
   window.storage shim: the real window.storage API only exists
   inside the Claude.ai artifact preview sandbox — on a real
   deployed site (like this one, on GitHub Pages) it doesn't exist
   at all, so every call used to throw and autosave failed silently.
   This shim gives the same get/set/list/delete interface, backed
   by localStorage, so saving actually works once deployed. Swap
   this out for real fetch() calls to your own backend later if you
   want saves to sync across devices instead of staying per-browser.
   ------------------------------------------------------------- */
if(!window.storage || !window.storage.__isRealBackend){
  const STORAGE_NS = 'chalkline:';
  window.storage = {
    __isRealBackend: false,
    async get(key){
      const raw = localStorage.getItem(STORAGE_NS + key);
      return raw === null ? null : { key, value: raw, shared: false };
    },
    async set(key, value){
      try{ localStorage.setItem(STORAGE_NS + key, value); return { key, value, shared: false }; }
      catch(e){ console.error('localStorage set failed:', e); return null; }
    },
    async delete(key){
      const existed = localStorage.getItem(STORAGE_NS + key) !== null;
      localStorage.removeItem(STORAGE_NS + key);
      return { key, deleted: existed, shared: false };
    },
    async list(prefix){
      const keys = [];
      const full = STORAGE_NS + (prefix || '');
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(full)) keys.push(k.slice(STORAGE_NS.length));
      }
      return { keys, prefix, shared: false };
    }
  };
}

/* =========================================================
   INFINITE CANVAS: camera model & Auto-Stacking Layout
   ========================================================= */

const canvas = document.getElementById('board');
let ctx = canvas.getContext('2d');
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
let viewW = 0, viewH = 0;
const camera = { x: 500, y: 300, scale: 1 };

// The board is a fixed-width "page" (PAGE_W world units) that used to
// always sit horizontally centered on screen. That's fine on a narrow
// phone (the page roughly fills the width anyway), but on a wide
// tablet/laptop the scale caps out at 1.5x while the viewport keeps
// growing, so the page ends up floating in the middle with large empty
// margins on both sides and the AI's writing starts well away from the
// actual top-left of the screen. These anchor the page's top-left
// corner to a small, fixed on-screen gutter instead, so text starts
// right near the real top-left edge of the screen on every device.
const PAGE_LEFT_GUTTER_PX = 24;
const PAGE_TOP_GUTTER_PX = 32;
function idealCameraX(scale){ return (viewW/2 - PAGE_LEFT_GUTTER_PX) / scale; }
function idealCameraY(scale){ return TOP_MARGIN + (viewH/2 - PAGE_TOP_GUTTER_PX) / scale; }

// Kick off loading the handwriting webfonts immediately at page load
// (rather than waiting for the first canvas draw to implicitly trigger
// it), so by the time the first AI response comes back over the network
// the fonts are already cached and text-measurement metrics are accurate
// from turn one. See the matching `await document.fonts.ready` in
// runTeachingTurn for why this matters.
['700 40px Kalam','400 40px Kalam','700 40px Caveat','400 40px Caveat'].forEach(f=>{
  document.fonts.load(f).catch(()=>{});
});

const PAGE_W = 1000;
const PAGE_H = Math.round(PAGE_W * Math.SQRT2);
const RULE_LINE_SPACING = 40;

// The multiplier that converts an author-specified "size" into the actual
// world-unit font size used for handwriting. Readable but still compact.
const HAND_SIZE_MULT = 0.92;
// Line height for a block of text at a given (already-multiplied) world
// font size, snapped to a whole number of ruled-paper lines so every line
// of handwriting sits on (or a fixed offset from) an actual rule line —
// exactly like writing on real notebook paper — while still guaranteeing
// enough vertical room that taller/bigger text never overlaps the line
// below it. The 1.25 safety factor (rather than a razor-thin 1.0) absorbs
// normal font-metric variance (ascenders/descenders, cursive flourishes)
// so text never visually touches the rule line above or below it.
function lineHeightFor(sizeWorld){
  const needed = sizeWorld * 1.25;
  const mult = Math.max(1, Math.ceil(needed / RULE_LINE_SPACING));
  return mult * RULE_LINE_SPACING;
}

let userIsScrolledAway = false;
const TOP_MARGIN = 80; // must be a whole multiple of RULE_LINE_SPACING so the
                        // very first line of writing starts baseline-aligned
                        // to a rule line, same as every line after it
let globalCursorY = TOP_MARGIN;
let currentTopicLabel = 'Topic';
let currentSubject = '';

function resetRegionCursors(){
  globalCursorY = TOP_MARGIN;
  userIsScrolledAway = false;
  
  if (viewW > 0) {
      camera.scale = Math.min(1.5, viewW / 1050);
      camera.x = idealCameraX(camera.scale);
      camera.y = idealCameraY(camera.scale);
  }
}

function getMaxYWorld(){
  return globalCursorY;
}

let panToken = 0;
function animateCameraPan(targetX, targetY, duration, onDone){
  if(userIsScrolledAway) { if(onDone) onDone(); return; }
  const myToken = ++panToken;
  const startX = camera.x, startY = camera.y;
  const dx = targetX - startX, dy = targetY - startY;
  const start = performance.now();
  let finished = false;
  function finish(){ if(!finished){ finished = true; if(onDone) onDone(); } }
  function ease(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
  function frame(now){
    if(myToken !== panToken || userIsScrolledAway){ finish(); return; }
    const raw = Math.min(1, (now-start)/duration);
    const t = ease(raw);
    camera.x = startX + dx*t;
    camera.y = startY + dy*t;
    redrawAll();
    if(raw < 1) requestAnimationFrame(frame); else { camera.x = targetX; camera.y = targetY; redrawAll(); finish(); }
  }
  requestAnimationFrame(frame);
}

function panCameraToCursor(targetY, onDone){
  const idealScale = Math.min(1.5, viewW / 1050);
  if (Math.abs(camera.scale - idealScale) > 0.01 && !userIsScrolledAway) {
      camera.scale = idealScale;
  }
  // Keep X anchored to the page's left-gutter position (not dead center)
  // while following the pen vertically.
  animateCameraPan(idealCameraX(camera.scale), targetY, 900, onDone);
}

function checkIfScrolledAway(){
  const maxY = getMaxYWorld();
  const bottomVisibleY = screenToWorld(0, viewH)[1];
  userIsScrolledAway = (bottomVisibleY < maxY - 300);
}

function resizeCanvas(){
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  viewW = rect.width; viewH = rect.height;
  
  // Horizontal position (left-gutter anchoring) and zoom level aren't
  // something the user "scrolls away" from — userIsScrolledAway only
  // tracks whether they've panned vertically away from the pen. So keep
  // recalculating scale/x on every resize (including mid-lesson rotations),
  // and only gate the vertical recenter-to-top behind userIsScrolledAway.
  if (viewW > 0) {
      camera.scale = Math.min(1.5, viewW / 1050);
      camera.x = idealCameraX(camera.scale);
      if (!userIsScrolledAway) {
          camera.y = idealCameraY(camera.scale);
      }
  }
  
  redrawAll();
}
window.addEventListener('resize', resizeCanvas);

// Mobile Safari (and other mobile browsers) can take noticeably longer than
// 350ms to finish reflowing the visual viewport after a rotation — the
// address bar/chrome animates in/out, and getBoundingClientRect() can keep
// reporting the pre-rotation size for a little while. A couple of fixed
// retries isn't always enough, so on top of those we also (a) listen to
// visualViewport's own resize event, which fires as the real viewport
// settles rather than on a guessed timer, and (b) poll briefly until the
// reported size actually stops changing before giving up.
function resizeCanvasWhenStable(maxWaitMs){
  const deadline = performance.now() + maxWaitMs;
  let lastW = -1, lastH = -1, stableFrames = 0;
  function tick(){
    const rect = canvas.getBoundingClientRect();
    if (Math.abs(rect.width-lastW) < 0.5 && Math.abs(rect.height-lastH) < 0.5) {
      stableFrames++;
    } else {
      stableFrames = 0;
      lastW = rect.width; lastH = rect.height;
    }
    resizeCanvas();
    if (stableFrames >= 3 || performance.now() > deadline) return;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

window.addEventListener('orientationchange', () => {
  resizeCanvasWhenStable(1000);
});
if (screen.orientation && screen.orientation.addEventListener) {
  screen.orientation.addEventListener('change', () => {
    resizeCanvasWhenStable(1000);
  });
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => resizeCanvasWhenStable(1000));
}

function worldToScreen(wx, wy){
  return [(wx - camera.x) * camera.scale + viewW/2, (wy - camera.y) * camera.scale + viewH/2];
}
function screenToWorld(sx, sy){
  return [(sx - viewW/2) / camera.scale + camera.x, (sy - viewH/2) / camera.scale + camera.y];
}

const INK = '#1E2B3A';
const OCHRE = '#D96B27';
const SAGE = '#2A8A5D';
const BRICK = '#C0392B';
const TEAL = '#008080';
const VIOLET = '#6C3483';
const SKY = '#2980B9';
const CORAL = '#E67E22';
const HALO = '#8FA6FF';
const HILITE = '#FCE896';
const COLORS = { chalk:INK, ink:INK, ochre:OCHRE, sage:SAGE, brick:BRICK, teal:TEAL, violet:VIOLET, sky:SKY, coral:CORAL, halo:HALO, highlight:HILITE };

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

let drawnCommands = [];

function drawBG(){
  const grad = ctx.createLinearGradient(0, 0, viewW, viewH);
  grad.addColorStop(0, '#EAF4FD');
  grad.addColorStop(1, '#FFFFFF');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,viewW,viewH);
}

function clearBoard(record=true){
  if(record) drawnCommands = [];
  drawBG();
}

function redrawAll(){
  drawBG();
  drawnCommands.forEach(cmd => renderCommand(cmd));
}

function redrawAllExcept(skipCmd){
  drawBG();
  drawnCommands.forEach(cmd => { if(cmd !== skipCmd) renderCommand(cmd); });
}

function sw(n){ return n * camera.scale; }

function wrapTextToLines(text, maxWidthPx, customCtx){
  const words = (text||'').split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = '';
  const context = customCtx || ctx;
  words.forEach(w => {
    const test = cur ? cur + ' ' + w : w;
    if(cur && context.measureText(test).width > maxWidthPx){
      lines.push(cur);
      cur = w;
    } else {
      cur = test;
    }
  });
  if(cur) lines.push(cur);
  return lines.length ? lines : [''];
}

// A single underline stroke drawn beneath a finished line of heading text,
// with a touch of hand-drawn imperfection (a slight downward bow, like a
// pen underline) rather than a perfectly straight ruled line — so it reads
// as "the tutor underlined this" rather than a UI decoration.
function drawHeadingUnderline(sx, baselineY, widthPx, sizeWorld, color){
  if(widthPx <= 0) return;
  const y = baselineY + sw(sizeWorld*0.16);
  const bow = sw(sizeWorld*0.03);
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = sw(Math.max(1.5, sizeWorld*0.045));
  ctx.beginPath();
  ctx.moveTo(sx, y);
  ctx.quadraticCurveTo(sx + widthPx/2, y + bow, sx + widthPx, y);
  ctx.stroke();
  ctx.restore();
}

function commandScreenBBox(cmd){
  const PAD = 10;
  function pad(x0,y0,x1,y1){
    return [Math.min(x0,x1)-PAD, Math.min(y0,y1)-PAD, Math.max(x0,x1)+PAD, Math.max(y0,y1)+PAD];
  }
  switch(cmd.type){
    case 'text': {
      const fam = "'Kalam', 'Caveat', cursive";
      const weight = cmd.weight || 700;
      const size = (cmd.size||26)*HAND_SIZE_MULT;
      ctx.font = `${weight} ${sw(size)}px ${fam}`;
      const [sx,sy] = worldToScreen(cmd.x, cmd.y);
      if(cmd.maxWidth){
        const lines = wrapTextToLines(cmd.text||'', sw(cmd.maxWidth));
        const lineHeight = sw(lineHeightFor(size));
        const width = Math.max(0, ...lines.map(l=>ctx.measureText(l).width));
        return pad(sx, sy - sw(size)*1.05, sx + width, sy + lineHeight*(lines.length-1) + sw(size)*0.25);
      }
      const width = ctx.measureText(cmd.text||'').width;
      return pad(sx, sy - sw(size)*1.05, sx + width, sy + sw(size)*0.25);
    }
    case 'line': case 'arrow': {
      const [x1,y1] = worldToScreen(cmd.x1,cmd.y1); const [x2,y2] = worldToScreen(cmd.x2,cmd.y2);
      return pad(x1,y1,x2,y2);
    }
    case 'rect': case 'highlight': case 'highlight-marker': {
      const [x,y] = worldToScreen(cmd.x,cmd.y);
      return pad(x, y, x+sw(cmd.w), y+sw(cmd.h||(cmd.type==='rect'?0:40)));
    }
    case 'circle': {
      const [x,y] = worldToScreen(cmd.x,cmd.y);
      return pad(x-sw(cmd.rx), y-sw(cmd.ry), x+sw(cmd.rx), y+sw(cmd.ry));
    }
    case 'curve': {
      const pts = (cmd.points||[]).map(p=>worldToScreen(p[0],p[1]));
      if(!pts.length) return [0,0,0,0];
      const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
      return pad(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys));
    }
    case 'axes': case 'plot': {
      const [ox,oy] = worldToScreen(cmd.x,cmd.y);
      const w = sw(cmd.w), h = sw(cmd.h);
      return pad(ox, oy-h-sw(30), ox+w, oy+sw(20));
    }
    case 'halo': {
      const [x,y] = worldToScreen(cmd.x,cmd.y); const r = sw(cmd.r||60);
      return pad(x-r,y-r,x+r,y+r);
    }
    case 'path': {
      const pts = flattenScreenSegsToPoints(worldPathToScreenSegments(cmd.segments||[]));
      if(!pts.length) return [0,0,0,0];
      const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
      return pad(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys));
    }
    default: return [0,0,0,0];
  }
}

/* ---------- PATH primitive: lets the model compose arbitrary organic
   shapes (cell membranes, leaf outlines, animal silhouettes, etc.) out
   of move/line/quadratic/cubic segments in world space, same way an
   SVG <path> works. Segments: ["M",x,y] ["L",x,y] ["Q",cx,cy,x,y]
   ["C",c1x,c1y,c2x,c2y,x,y] ["Z"]. ---------- */
function worldPathToScreenSegments(segments){
  return (segments||[]).map(seg=>{
    if(!seg || !seg.length) return null;
    if(seg[0]==='Z' || seg[0]==='z') return ['Z'];
    const out = [seg[0]];
    for(let i=1;i<seg.length;i+=2){
      const [sx,sy] = worldToScreen(seg[i], seg[i+1]);
      out.push(sx, sy);
    }
    return out;
  }).filter(Boolean);
}

function drawPathSegments(pctx, screenSegs){
  pctx.beginPath();
  screenSegs.forEach(seg=>{
    const t = seg[0];
    if(t==='M') pctx.moveTo(seg[1],seg[2]);
    else if(t==='L') pctx.lineTo(seg[1],seg[2]);
    else if(t==='Q') pctx.quadraticCurveTo(seg[1],seg[2],seg[3],seg[4]);
    else if(t==='C') pctx.bezierCurveTo(seg[1],seg[2],seg[3],seg[4],seg[5],seg[6]);
    else if(t==='Z') pctx.closePath();
  });
}

function flattenScreenSegsToPoints(screenSegs){
  const pts = [];
  let cur = [0,0];
  screenSegs.forEach(seg=>{
    const t = seg[0];
    if(t==='M'){ cur=[seg[1],seg[2]]; pts.push(cur); }
    else if(t==='L'){ cur=[seg[1],seg[2]]; pts.push(cur); }
    else if(t==='Q'){
      const [x0,y0]=cur, cx=seg[1], cy=seg[2], x1=seg[3], y1=seg[4];
      for(let i=1;i<=10;i++){ const tt=i/10, mt=1-tt;
        pts.push([mt*mt*x0+2*mt*tt*cx+tt*tt*x1, mt*mt*y0+2*mt*tt*cy+tt*tt*y1]); }
      cur=[x1,y1];
    } else if(t==='C'){
      const [x0,y0]=cur, c1x=seg[1],c1y=seg[2],c2x=seg[3],c2y=seg[4],x1=seg[5],y1=seg[6];
      for(let i=1;i<=12;i++){ const tt=i/12, mt=1-tt;
        pts.push([mt*mt*mt*x0+3*mt*mt*tt*c1x+3*mt*tt*tt*c2x+tt*tt*tt*x1, mt*mt*mt*y0+3*mt*mt*tt*c1y+3*mt*tt*tt*c2y+tt*tt*tt*y1]); }
      cur=[x1,y1];
    }
    // 'Z' contributes no new point — it just closes back to the start
  });
  return pts;
}

function strokePolylinePartial(pts, t){
  if(!pts.length) return [0,0];
  if(pts.length===1) return pts[0];
  const segLens=[]; let total=0;
  for(let i=0;i<pts.length-1;i++){ const d=Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]); segLens.push(d); total+=d; }
  const target = total*t;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  let acc=0, penX=pts[0][0], penY=pts[0][1];
  for(let i=0;i<segLens.length;i++){
    const segLen = segLens[i];
    if(acc+segLen <= target){ ctx.lineTo(pts[i+1][0], pts[i+1][1]); acc+=segLen; penX=pts[i+1][0]; penY=pts[i+1][1]; }
    else{
      const frac = segLen>0 ? (target-acc)/segLen : 0;
      penX = pts[i][0]+(pts[i+1][0]-pts[i][0])*frac;
      penY = pts[i][1]+(pts[i+1][1]-pts[i][1])*frac;
      ctx.lineTo(penX,penY);
      break;
    }
  }
  ctx.stroke();
  return [penX,penY];
}

function renderCommand(cmd){
  const color = COLORS[cmd.color] || INK;
  ctx.strokeStyle = color; ctx.fillStyle = color;

  switch(cmd.type){
    case 'text': {
      const fam = "'Kalam', 'Caveat', cursive";
      const weight = cmd.weight || 700;
      const size = (cmd.size||26)*HAND_SIZE_MULT;
      ctx.font = `${weight} ${sw(size)}px ${fam}`;
      ctx.textBaseline = 'alphabetic';
      const [sx,sy] = worldToScreen(cmd.x, cmd.y);
      if(cmd.maxWidth){
        const lines = wrapTextToLines(cmd.text||'', sw(cmd.maxWidth));
        const lineHeight = sw(lineHeightFor(size));
        lines.forEach((line,i) => {
          const ly = sy + i*lineHeight;
          ctx.fillText(line, sx, ly);
          if(cmd.heading) drawHeadingUnderline(sx, ly, ctx.measureText(line).width, size, color);
        });
      } else {
        ctx.fillText(cmd.text, sx, sy);
        if(cmd.heading) drawHeadingUnderline(sx, sy, ctx.measureText(cmd.text||'').width, size, color);
      }
      break;
    }
    case 'line': {
      ctx.lineWidth = sw(cmd.width || 2.5);
      const [x1,y1] = worldToScreen(cmd.x1, cmd.y1); const [x2,y2] = worldToScreen(cmd.x2, cmd.y2);
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      break;
    }
    case 'arrow': {
      ctx.lineWidth = sw(cmd.width || 2.5);
      const [x1,y1] = worldToScreen(cmd.x1, cmd.y1); const [x2,y2] = worldToScreen(cmd.x2, cmd.y2);
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      const angle = Math.atan2(y2-y1, x2-x1); const headLen = sw(cmd.headSize || 12);
      ctx.beginPath(); ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - headLen*Math.cos(angle - Math.PI/7), y2 - headLen*Math.sin(angle - Math.PI/7));
      ctx.lineTo(x2 - headLen*Math.cos(angle + Math.PI/7), y2 - headLen*Math.sin(angle + Math.PI/7));
      ctx.closePath(); ctx.fill();
      break;
    }
    case 'rect': {
      ctx.lineWidth = sw(cmd.width || 2.5);
      const [x,y] = worldToScreen(cmd.x, cmd.y); const w = sw(cmd.w), h = sw(cmd.h);
      if(cmd.fill){ ctx.globalAlpha = 0.10; ctx.fillRect(x,y,w,h); ctx.globalAlpha = 1; }
      ctx.strokeRect(x,y,w,h);
      break;
    }
    case 'circle': {
      ctx.lineWidth = sw(cmd.width || 2.5);
      const [x,y] = worldToScreen(cmd.x, cmd.y);
      ctx.beginPath(); ctx.ellipse(x, y, sw(cmd.rx), sw(cmd.ry), 0, 0, Math.PI*2);
      if(cmd.fill){ ctx.globalAlpha = 0.10; ctx.fill(); ctx.globalAlpha = 1; }
      ctx.stroke();
      break;
    }
    case 'curve': {
      ctx.lineWidth = sw(cmd.width || 2.5);
      const pts = cmd.points.map(p => worldToScreen(p[0], p[1]));
      if(cmd.fill && pts.length>2){
        ctx.save();
        ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
        for(let i=1;i<pts.length-1;i++){
          const midX=(pts[i][0]+pts[i+1][0])/2, midY=(pts[i][1]+pts[i+1][1])/2;
          ctx.quadraticCurveTo(pts[i][0],pts[i][1],midX,midY);
        }
        const last = pts[pts.length-1]; ctx.lineTo(last[0],last[1]); ctx.closePath();
        ctx.globalAlpha = cmd.fillOpacity!=null ? cmd.fillOpacity : 0.12;
        ctx.fillStyle = COLORS[cmd.fillColor] || color;
        ctx.fill();
        ctx.restore();
      }
      strokeSmoothCurve(pts);
      break;
    }
    case 'path': {
      ctx.lineWidth = sw(cmd.width || 2.5);
      const screenSegs = worldPathToScreenSegments(cmd.segments||[]);
      drawPathSegments(ctx, screenSegs);
      if(cmd.fill){
        ctx.save();
        ctx.globalAlpha = cmd.fillOpacity!=null ? cmd.fillOpacity : 0.12;
        ctx.fillStyle = COLORS[cmd.fillColor] || color;
        ctx.fill();
        ctx.restore();
      }
      ctx.stroke();
      break;
    }
    case 'axes': {
      const [ox,oy] = worldToScreen(cmd.x, cmd.y); const w = sw(cmd.w), h = sw(cmd.h);
      drawAxesGrid(ox, oy, w, h, cmd);
      ctx.lineWidth = sw(2);
      ctx.strokeStyle = color; ctx.fillStyle = color;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox, oy - h); ctx.moveTo(ox, oy); ctx.lineTo(ox + w, oy); ctx.stroke();
      drawArrowhead(ox, oy - h, -Math.PI/2, color);
      drawArrowhead(ox + w, oy, 0, color);
      drawAxesTicksAndLabels(ox, oy, w, h, cmd, color);
      break;
    }
    case 'plot': {
      const [ox,oy] = worldToScreen(cmd.x, cmd.y); const w = sw(cmd.w), h = sw(cmd.h);
      drawAxesGrid(ox, oy, w, h, cmd);
      ctx.lineWidth = sw(2.5);
      ctx.strokeStyle = color; ctx.fillStyle = color;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox, oy - h); ctx.moveTo(ox, oy); ctx.lineTo(ox + w, oy); ctx.stroke();
      drawArrowhead(ox, oy - h, -Math.PI/2, color);
      drawArrowhead(ox + w, oy, 0, color);
      drawAxesTicksAndLabels(ox, oy, w, h, cmd, color);
      const [scaleX, scaleY] = plotScalers(ox, oy, w, h, cmd);
      (cmd.curves || []).forEach(curve => {
        const pts = (curve.points || []).map(p => [scaleX(p[0]), scaleY(p[1])]);
        if(pts.length < 2) return;
        const curveColor = COLORS[curve.color] || color;
        ctx.save();
        ctx.shadowColor = hexToRgba(curveColor, 0.35);
        ctx.shadowBlur = sw(4);
        ctx.shadowOffsetY = sw(1.5);
        ctx.strokeStyle = curveColor;
        ctx.lineWidth = sw(curve.width || 3.25);
        strokeSmoothCurve(pts);
        ctx.restore();
        ctx.fillStyle = curveColor;
        pts.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], sw(2.75), 0, Math.PI*2); ctx.fill(); });
        if(curve.label){
          ctx.fillStyle = curveColor;
          ctx.font = `700 ${sw(18)}px 'Caveat', cursive`;
          ctx.textAlign = 'left';
          const [lx,ly] = pts[pts.length-1];
          ctx.fillText(curve.label, lx+sw(8), ly+sw(4));
        }
      });
      break;
    }
    case 'highlight': {
      ctx.globalAlpha = 0.18; ctx.fillStyle = color;
      const [x,y] = worldToScreen(cmd.x, cmd.y);
      ctx.fillRect(x, y, sw(cmd.w), sw(cmd.h || 26));
      ctx.globalAlpha = 1;
      break;
    }
    case 'halo': {
      const [x,y] = worldToScreen(cmd.x, cmd.y);
      const r = sw(cmd.r || 60);
      const glow = COLORS[cmd.color] || HALO;
      const grad = ctx.createRadialGradient(x,y,0,x,y,r);
      grad.addColorStop(0, hexToRgba(glow, 0.40));
      grad.addColorStop(1, hexToRgba(glow, 0));
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
      break;
    }
  }
}

function drawArrowhead(x, y, angle, color, size){
  const headLen = sw(size || 9);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(x, y);
  ctx.lineTo(x - headLen*Math.cos(angle - Math.PI/7), y - headLen*Math.sin(angle - Math.PI/7));
  ctx.lineTo(x - headLen*Math.cos(angle + Math.PI/7), y - headLen*Math.sin(angle + Math.PI/7));
  ctx.closePath(); ctx.fill();
}

function drawAxesGrid(ox, oy, w, h, cmd){
  if(cmd.grid === false) return;
  const n = cmd.gridLines || 5;
  ctx.save();
  ctx.strokeStyle = 'rgba(38,36,31,0.14)';
  ctx.lineWidth = 1;
  ctx.setLineDash([sw(3), sw(4)]);
  for(let i=1;i<=n;i++){
    const gx = ox + (w*i/n);
    ctx.beginPath(); ctx.moveTo(gx, oy); ctx.lineTo(gx, oy-h); ctx.stroke();
    const gy = oy - (h*i/n);
    ctx.beginPath(); ctx.moveTo(ox, gy); ctx.lineTo(ox+w, gy); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();
}

function drawAxesTicksAndLabels(ox, oy, w, h, cmd, color){
  ctx.save();
  ctx.font = `${sw(14)}px 'Caveat', cursive`;
  ctx.fillStyle = color;
  if(Array.isArray(cmd.xTicks)){
    const n = cmd.xTicks.length;
    cmd.xTicks.forEach((label, i) => {
      const tx = ox + w*(i+1)/(n+1);
      ctx.strokeStyle = color; ctx.lineWidth = sw(1.5);
      ctx.beginPath(); ctx.moveTo(tx, oy-sw(4)); ctx.lineTo(tx, oy+sw(4)); ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillText(String(label), tx, oy+sw(18));
    });
  }
  if(Array.isArray(cmd.yTicks)){
    const n = cmd.yTicks.length;
    cmd.yTicks.forEach((label, i) => {
      const ty = oy - h*(i+1)/(n+1);
      ctx.strokeStyle = color; ctx.lineWidth = sw(1.5);
      ctx.beginPath(); ctx.moveTo(ox-sw(4), ty); ctx.lineTo(ox+sw(4), ty); ctx.stroke();
      ctx.textAlign = 'right';
      ctx.fillText(String(label), ox-sw(8), ty+sw(4));
    });
  }
  ctx.textAlign = 'left';
  ctx.font = `${sw(16)}px 'Caveat', cursive`;
  if(cmd.xlabel){ ctx.textAlign = 'right'; ctx.fillText(cmd.xlabel, ox+w, oy+sw(30)); }
  if(cmd.ylabel){ ctx.save(); ctx.translate(ox-sw(28), oy-h); ctx.textAlign = 'left'; ctx.fillText(cmd.ylabel,0,0); ctx.restore(); }
  if(cmd.title){ ctx.textAlign = 'center'; ctx.font = `700 ${sw(20)}px 'Caveat', cursive`; ctx.fillText(cmd.title, ox+w/2, oy-h-sw(16)); }
  ctx.restore();
}

function strokeSmoothCurve(pts){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(let i=1;i<pts.length-1;i++){
    const midX = (pts[i][0]+pts[i+1][0])/2, midY = (pts[i][1]+pts[i+1][1])/2;
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], midX, midY);
  }
  const last = pts[pts.length-1];
  ctx.lineTo(last[0], last[1]);
  ctx.stroke();
}

function strokeSmoothCurvePartial(pts, t){
  const totalSegs = pts.length-1;
  const segFloat = t*totalSegs;
  const segIdx = Math.min(totalSegs-1, Math.floor(segFloat));
  const segT = segFloat-segIdx;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for(let i=1;i<=segIdx;i++){
    const nextI = Math.min(i+1, pts.length-1);
    const midX = (pts[i][0]+pts[nextI][0])/2, midY = (pts[i][1]+pts[nextI][1])/2;
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], midX, midY);
  }
  let penX = pts[segIdx][0], penY = pts[segIdx][1];
  if(pts[segIdx+1]){
    penX = pts[segIdx][0]+(pts[segIdx+1][0]-pts[segIdx][0])*segT;
    penY = pts[segIdx][1]+(pts[segIdx+1][1]-pts[segIdx][1])*segT;
    ctx.lineTo(penX, penY);
  }
  ctx.stroke();
  return [penX, penY];
}

function plotScalers(ox, oy, w, h, cmd){
  const [xMin,xMax] = cmd.xRange || [0, 10];
  const [yMin,yMax] = cmd.yRange || [0, 10];
  const xSpan = (xMax-xMin) || 1, ySpan = (yMax-yMin) || 1;
  const scaleX = v => ox + ((v-xMin)/xSpan)*w;
  const scaleY = v => oy - ((v-yMin)/ySpan)*h;
  return [scaleX, scaleY];
}

/* ---------- PAN / ZOOM (mouse) ---------- */
let isPanning = false, panStart=null, camStart=null;
canvas.addEventListener('mousedown', (e)=>{ 
  panToken++; isPanning=true; canvas.classList.add('grabbing'); 
  panStart=[e.clientX,e.clientY]; camStart={x:camera.x,y:camera.y}; 
  if(typeof stopHoverReplay==='function') stopHoverReplay(); 
});
window.addEventListener('mousemove', (e)=>{
  if(!isPanning) return;
  camera.y = camStart.y - (e.clientY - panStart[1]) / camera.scale;
  checkIfScrolledAway();
  redrawAll();
});
window.addEventListener('mouseup', ()=>{ isPanning=false; canvas.classList.remove('grabbing'); });

/* ---------- PAN / ZOOM (touch — iPad & mobile) ----------
   A single finger drags the board exactly like a mouse-drag pan, so you
   can swipe up to read earlier notes or swipe down to catch up — this is
   the primary way to scroll the whiteboard on a touch device. Two fingers
   pinch-zoom around their midpoint. Both gestures immediately mark the
   user as "scrolled away" (via checkIfScrolledAway), which is what stops
   the AI's auto-follow camera from fighting a manual scroll; scrolling
   back down near the live writing point clears that flag again on its
   own the next time it's checked. */
let touchMode = null; // 'pan' | 'pinch' | null
let pinchStartDist = 0, pinchStartScale = 1, pinchWorldMid = null;
function touchDist(t0,t1){ return Math.hypot(t1.clientX-t0.clientX, t1.clientY-t0.clientY); }
function touchMid(t0,t1){ return { x:(t0.clientX+t1.clientX)/2, y:(t0.clientY+t1.clientY)/2 }; }
canvas.addEventListener('touchstart', (e)=>{
  panToken++; stopHoverReplay();
  if(e.touches.length === 1){
    touchMode = 'pan';
    panStart = [e.touches[0].clientX, e.touches[0].clientY];
    camStart = { x:camera.x, y:camera.y };
  } else if(e.touches.length === 2){
    touchMode = 'pinch';
    pinchStartDist = touchDist(e.touches[0], e.touches[1]);
    pinchStartScale = camera.scale;
    const mid = touchMid(e.touches[0], e.touches[1]);
    const rect = canvas.getBoundingClientRect();
    pinchWorldMid = screenToWorld(mid.x-rect.left, mid.y-rect.top);
  }
}, {passive:true});
canvas.addEventListener('touchmove', (e)=>{
  if(touchMode === 'pan' && e.touches.length === 1){
    e.preventDefault();
    camera.y = camStart.y - (e.touches[0].clientY - panStart[1]) / camera.scale;
    checkIfScrolledAway();
    redrawAll();
  } else if(touchMode === 'pinch' && e.touches.length === 2){
    e.preventDefault();
    const dist = touchDist(e.touches[0], e.touches[1]);
    camera.scale = Math.min(3, Math.max(0.2, pinchStartScale * (dist/Math.max(1,pinchStartDist))));
    const rect = canvas.getBoundingClientRect();
    const mid = touchMid(e.touches[0], e.touches[1]);
    const [nx,ny] = screenToWorld(mid.x-rect.left, mid.y-rect.top);
    camera.x += (pinchWorldMid[0]-nx); camera.y += (pinchWorldMid[1]-ny);
    checkIfScrolledAway();
    redrawAll();
  }
}, {passive:false});
canvas.addEventListener('touchend', (e)=>{
  if(e.touches.length === 0){ touchMode = null; checkIfScrolledAway(); }
  else if(e.touches.length === 1){
    // dropped from a pinch down to one finger — restart as a plain pan
    touchMode = 'pan';
    panStart = [e.touches[0].clientX, e.touches[0].clientY];
    camStart = { x:camera.x, y:camera.y };
  }
});
canvas.addEventListener('touchcancel', ()=>{ touchMode = null; checkIfScrolledAway(); });

/* ---------- HOVER-TO-REPLAY ---------- */
const hoverAnim = { cmd:null, raf:null };

function stopHoverReplay(){
  if(hoverAnim.raf) cancelAnimationFrame(hoverAnim.raf);
  hoverAnim.raf = null;
  if(hoverAnim.cmd){ hoverAnim.cmd = null; redrawAll(); }
}

function startHoverReplay(cmd){
  if(hoverAnim.cmd === cmd) return;
  if(hoverAnim.raf) cancelAnimationFrame(hoverAnim.raf);
  hoverAnim.cmd = cmd;
  const duration = estimateDuration(cmd);
  const start = performance.now();
  function frame(now){
    if(hoverAnim.cmd !== cmd) return;
    const t = Math.min(1, (now-start)/duration);
    redrawAllExcept(cmd);
    renderPartialCommand(cmd, t);
    if(t < 1){ hoverAnim.raf = requestAnimationFrame(frame); }
    else { hoverAnim.raf = null; redrawAll(); }
  }
  hoverAnim.raf = requestAnimationFrame(frame);
}

canvas.addEventListener('mousemove', (e)=>{
  if(isPanning || drawing) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  let hit = null;
  for(let i = drawnCommands.length - 1; i >= 0; i--){
    const cmd = drawnCommands[i];
    if(cmd.type === 'highlight' || cmd.type === 'halo') continue;
    const [x0,y0,x1,y1] = commandScreenBBox(cmd);
    if(mx>=x0 && mx<=x1 && my>=y0 && my<=y1){ hit = cmd; break; }
  }
  canvas.classList.toggle('hoverable', !!hit);
  if(hit) startHoverReplay(hit); else stopHoverReplay();
});
canvas.addEventListener('mouseleave', stopHoverReplay);
canvas.addEventListener('wheel', (e)=>{
  e.preventDefault();
  panToken++;
  stopHoverReplay();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX-rect.left, my = e.clientY-rect.top;
  // Pinch-to-zoom on a trackpad (and ctrl+wheel) reports as a wheel event
  // with ctrlKey set — treat that as zoom. A plain wheel/trackpad scroll
  // is treated as an ordinary scroll of the board, so the page is fully
  // scrollable with a normal mouse wheel or two-finger trackpad swipe.
  if(e.ctrlKey){
    const [wx,wy] = screenToWorld(mx,my);
    camera.scale = Math.min(3, Math.max(0.2, camera.scale * (e.deltaY>0?0.9:1.1)));
    const [nx,ny] = screenToWorld(mx,my);
    camera.x += (wx-nx); camera.y += (wy-ny);
  } else {
    camera.y += e.deltaY / camera.scale;
  }
  checkIfScrolledAway();
  redrawAll();
}, {passive:false});
document.getElementById('zoom-reset').addEventListener('click', ()=>{ 
  panToken++; camera.scale=Math.min(1.5, viewW / 1050); camera.x=idealCameraX(camera.scale);
  userIsScrolledAway=false; 
  panCameraToCursor(globalCursorY - 300, null);
  redrawAll(); 
});
document.getElementById('btn-clear').addEventListener('click', ()=>{ panToken++; drawQueue=[]; camera.scale=1; camera.x=idealCameraX(1); camera.y=idealCameraY(1); resetRegionCursors(); clearBoard(); });

/* =========================================================
   EXPORT PDF
   ========================================================= */
function worldContentBounds(){
  const savedCam = { ...camera }, savedW = viewW, savedH = viewH;
  camera.scale = 1; camera.x = viewW/2; camera.y = viewH/2;
  let minX=0, minY=0, maxX=PAGE_W, maxY=1;
  drawnCommands.forEach(cmd=>{
    const [x0,y0,x1,y1] = commandScreenBBox(cmd);
    minX=Math.min(minX,x0); minY=Math.min(minY,y0);
    maxX=Math.max(maxX,x1); maxY=Math.max(maxY,y1);
  });
  Object.assign(camera, savedCam); viewW = savedW; viewH = savedH;
  return { minX, minY, maxX, maxY };
}

async function exportBoardAsPDF(){
  if(!window.jspdf){ setStatus('pdf export unavailable — see console'); console.error('jsPDF did not load.'); return; }
  if(drawnCommands.length===0){ setStatus('nothing drawn yet'); return; }
  if(drawing || drawQueue.length){ setStatus('wait for current drawing to finish'); return; }

  setStatus('exporting pdf…');
  stopHoverReplay();
  const savedCam = { ...camera }, savedW = viewW, savedH = viewH, savedCtx = ctx;

  try{
    const { minX, minY, maxY } = worldContentBounds();
    const pageWorldW = PAGE_W;
    const pageWorldH = PAGE_H;
    const numPages = Math.max(1, Math.ceil((maxY - minY) / pageWorldH));
    const PX_PER_WORLD_UNIT = 1.6;
    const pxW = Math.round(pageWorldW * PX_PER_WORLD_UNIT);
    const pxH = Math.round(pageWorldH * PX_PER_WORLD_UNIT);

    const off = document.createElement('canvas');
    off.width = pxW; off.height = pxH;
    const offCtx = off.getContext('2d');
    offCtx.lineCap = 'round'; offCtx.lineJoin = 'round';

    const { jsPDF } = window.jspdf;
    let doc = null;

    for(let i=0; i<numPages; i++){
      ctx = offCtx;
      viewW = pxW; viewH = pxH;
      camera.scale = PX_PER_WORLD_UNIT;
      camera.x = minX + pageWorldW/2;
      camera.y = (minY + i*pageWorldH) + pageWorldH/2;

      drawBG();
      drawnCommands.forEach(cmd => renderCommand(cmd));

      const dataUrl = off.toDataURL('image/png');
      if(i===0){
        doc = new jsPDF({ unit:'pt', format:[pageWorldW, pageWorldH], orientation: pageWorldW>=pageWorldH?'landscape':'portrait' });
      } else {
        doc.addPage([pageWorldW, pageWorldH], pageWorldW>=pageWorldH?'landscape':'portrait');
      }
      doc.addImage(dataUrl, 'PNG', 0, 0, pageWorldW, pageWorldH);
    }

    const name = (currentSessionTitle || (pdfFileName ? pdfFileName.replace(/\.pdf$/i,'') : 'chalkline-lesson')).replace(/[^\w\-]+/g,'_');
    doc.save(`${name}.pdf`);
    setStatus(`saved ${numPages}-page pdf`);
  } catch(err){
    console.error('PDF export failed:', err);
    setStatus('pdf export failed — see console');
  } finally {
    ctx = savedCtx;
    Object.assign(camera, savedCam);
    viewW = savedW; viewH = savedH;
    redrawAll();
  }
}
document.getElementById('btn-export-pdf').addEventListener('click', exportBoardAsPDF);

/* =========================================================
   LIVE PEN & DRAWING ANIMATION
   ========================================================= */
let drawQueue = [], drawing = false;
// Scales every command's animation duration so the total time spent
// drawing a turn's board content lines up with how long the speech for
// that same turn takes to say — set once per turn in runTeachingTurn().
let drawPaceScale = 1;

function drawPen(x, y, angle){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle + Math.PI/4);
  ctx.fillStyle = '#2A2A2A';
  const s = 14;
  ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(s*0.35,s*0.35); ctx.lineTo(s*1.7,s*1.7-s*0.5); ctx.lineTo(s*1.35,s*2.0-s*0.5);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#B8722E';
  ctx.beginPath(); ctx.arc(s*0.45,s*0.45,3.2,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ---------- DIAGRAM CLUSTERING ----------
   Shape commands (line/arrow/rect/circle/curve/path) plus any
   "text" command flagged diagramLabel:true are drawn by the model in
   its own small local coordinate box (see SYSTEM_PROMPT rules 4-6).
   Rather than trusting those raw coordinates as final page position
   (which is how diagrams used to end up overlapping stacked text),
   every consecutive run of such commands is treated as ONE cluster:
   we measure its combined local bounding box, then translate every
   command in it by a single (dx,dy) so the cluster sits at the
   current cursor position — exactly like a "plot" reserves its own
   vertical slot. This guarantees no diagram can overlap the
   paragraph text stacked above or below it. */
const DIAGRAM_SHAPE_TYPES = new Set(['line','arrow','rect','circle','curve','path']);

function isDiagramShapeCmd(c){
    return DIAGRAM_SHAPE_TYPES.has(c.type) || (c.type === 'text' && c.diagramLabel);
}

// Local (pre-translation) bounding box of a single diagram command, in
// the model's own raw coordinate units — no camera/world transform.
function diagramLocalBBox(c){
    switch(c.type){
        case 'line': case 'arrow':
            return [Math.min(c.x1,c.x2), Math.min(c.y1,c.y2), Math.max(c.x1,c.x2), Math.max(c.y1,c.y2)];
        case 'rect': {
            const h = c.h || 0;
            return [Math.min(c.x,c.x+c.w), Math.min(c.y,c.y+h), Math.max(c.x,c.x+c.w), Math.max(c.y,c.y+h)];
        }
        case 'highlight': {
            const h = c.h || 26;
            return [Math.min(c.x,c.x+c.w), Math.min(c.y,c.y+h), Math.max(c.x,c.x+c.w), Math.max(c.y,c.y+h)];
        }
        case 'circle':
            return [c.x-c.rx, c.y-c.ry, c.x+c.rx, c.y+c.ry];
        case 'curve': {
            const pts = c.points || [];
            if(!pts.length) return null;
            const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
            return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
        }
        case 'path': {
            const xs = [], ys = [];
            (c.segments || []).forEach(seg=>{
                if(!seg || !seg.length || seg[0]==='Z' || seg[0]==='z') return;
                for(let i=1;i<seg.length;i+=2){ xs.push(seg[i]); ys.push(seg[i+1]); }
            });
            if(!xs.length) return null;
            return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
        }
        case 'halo': {
            const r = c.r || 60;
            return [c.x-r, c.y-r, c.x+r, c.y+r];
        }
        case 'text': { // diagramLabel — rough estimate is fine, it's a small word
            const size = c.size || 20;
            const approxW = (c.text||'').length * size * 0.55;
            return [c.x, c.y - size, c.x + approxW, c.y + size*0.3];
        }
        default: return null;
    }
}

// Shift a diagram command's raw coordinates by (dx,dy). Widths/radii are
// untouched — only positions move.
function translateDiagramCmd(c, dx, dy){
    switch(c.type){
        case 'line': case 'arrow':
            c.x1+=dx; c.y1+=dy; c.x2+=dx; c.y2+=dy; break;
        case 'rect': case 'highlight': case 'circle': case 'halo': case 'text':
            c.x+=dx; c.y+=dy; break;
        case 'curve':
            c.points = (c.points||[]).map(p=>[p[0]+dx, p[1]+dy]); break;
        case 'path':
            c.segments = (c.segments||[]).map(seg=>{
                if(!seg || !seg.length || seg[0]==='Z' || seg[0]==='z') return seg;
                const out = [seg[0]];
                for(let i=1;i<seg.length;i+=2){ out.push(seg[i]+dx, seg[i+1]+dy); }
                return out;
            });
            break;
    }
    return c;
}

const DIAGRAM_MARGIN_TOP = RULE_LINE_SPACING;
const DIAGRAM_MARGIN_BOTTOM = RULE_LINE_SPACING*2;
const DIAGRAM_LEFT = 160;
// Extra slack added to a diagram cluster's measured bounding box before
// reserving space for it — line widths, arrowheads, and the rough
// diagramLabel text-width estimate all extend a little past the raw
// coordinates used to measure the box, so this keeps a real gap between
// a diagram and the text immediately above/below it.
const DIAGRAM_BBOX_PAD = 18;

function enqueueCommandsAtCursor(commands){
    let placedAll = [];
    const testCanvas = document.createElement('canvas');
    const tCtx = testCanvas.getContext('2d');

    // Commands are trusted to arrive in reading order (the model is
    // instructed to emit each diagram as one unbroken run) — no longer
    // re-sorted by raw y, since a diagram's local coordinates aren't a
    // page position and sorting by them would scramble reading order.
    let pendingDiagram = [];

    function flushDiagram(){
        if(!pendingDiagram.length) return;
        let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
        pendingDiagram.forEach(c=>{
            const bb = diagramLocalBBox(c);
            if(!bb) return;
            minX = Math.min(minX, bb[0]); minY = Math.min(minY, bb[1]);
            maxX = Math.max(maxX, bb[2]); maxY = Math.max(maxY, bb[3]);
        });
        if(minX === Infinity){ pendingDiagram = []; return; } // nothing measurable
        minY -= DIAGRAM_BBOX_PAD; maxY += DIAGRAM_BBOX_PAD;

        globalCursorY += DIAGRAM_MARGIN_TOP;
        const dx = DIAGRAM_LEFT - minX;
        const dy = globalCursorY - minY;
        pendingDiagram.forEach(c=>{ translateDiagramCmd(c, dx, dy); placedAll.push(c); });
        // Reserve exactly the cluster's own height plus a bottom margin —
        // same pattern as the "plot" case below — so whatever text comes
        // next starts safely below the lowest shape in the diagram.
        globalCursorY += (maxY - minY) + DIAGRAM_MARGIN_BOTTOM;
        pendingDiagram = [];
    }

    commands.forEach(cmd => {
        let c = { ...cmd };

        if (c.type === 'halo' || c.type === 'highlight') {
            // Preserve the old "glow/underline the word I just wrote"
            // behavior when it directly follows plain paragraph text and
            // isn't part of an in-progress diagram cluster.
            if (!pendingDiagram.length && placedAll.length) {
                const prev = placedAll[placedAll.length-1];
                if (prev.type === 'text' && !prev.diagramLabel) {
                    c.x = prev.x + 40; c.y = prev.y - 10;
                    placedAll.unshift(c);
                    return;
                }
            }
            pendingDiagram.push(c);
            return;
        }

        if (isDiagramShapeCmd(c)) {
            pendingDiagram.push(c);
            return;
        }

        // Any non-diagram command ends whatever cluster was building and
        // reserves its space before this command claims the cursor.
        flushDiagram();

        if (c.type === 'text') {
            c.x = 80; // Sit close to the left margin line
            c.maxWidth = 930; // Use nearly the full line width before wrapping
            const size = (c.size || 26) * HAND_SIZE_MULT;
            const fam = "'Kalam', 'Caveat', cursive";
            tCtx.font = `${c.weight || 700} ${size}px ${fam}`;
            
            const words = (c.text || '').split(/\s+/).filter(Boolean);
            let lines = 1; let cur = '';
            words.forEach(w => {
                const test = cur ? cur + ' ' + w : w;
                if(tCtx.measureText(test).width > c.maxWidth){ lines++; cur = w; }
                else { cur = test; }
            });
            
            const lh = lineHeightFor(size);
            // A heading skips one blank ruled line before it starts, so it
            // reads as a new section rather than butting straight up
            // against whatever came before — but only if something is
            // already on the board above it (no pointless gap at the very
            // top of a fresh page).
            if(c.heading && globalCursorY > TOP_MARGIN) globalCursorY += RULE_LINE_SPACING;
            // Baseline sits exactly ON the rule line at the bottom of this
            // first allotted line-space (not floating near the top of it),
            // so the handwriting visually rests on the ruled paper the way
            // real handwriting does — ascenders reach up into the block,
            // descenders dip slightly below the line, just like ink on
            // actual notebook paper.
            c.y = globalCursorY + lh;
            placedAll.push(c);
            // Advance by exactly the block's own height — no extra blank
            // gap tacked on — so consecutive notes stack tight against each
            // other like continuous handwriting, while every line (of this
            // block and the next) still lands on a whole rule-line boundary
            // because `lh` is always a whole multiple of RULE_LINE_SPACING.
            globalCursorY += lines * lh;

        } else if (c.type === 'plot' || c.type === 'axes') {
            c.x = 160;
            c.w = 640;
            c.h = 400; // a whole multiple of RULE_LINE_SPACING, like every
                       // other vertical measurement here — see note below
            
            globalCursorY += RULE_LINE_SPACING; // Title margin
            c.y = globalCursorY + c.h; // Origin is bottom-left
            placedAll.push(c);
            // X-axis label margin. MUST be a whole multiple of
            // RULE_LINE_SPACING like every other vertical measurement in
            // this function — otherwise globalCursorY drifts off the rule
            // grid after the first graph, and every line of handwriting
            // placed after it stops resting on the ruled lines (it'll
            // visually "float" between them instead of sitting on one).
            globalCursorY = c.y + RULE_LINE_SPACING*2;
        }
    });

    flushDiagram();

    let panTargetY = globalCursorY - 300; 
    if (panTargetY < TOP_MARGIN) panTargetY = TOP_MARGIN;

    redrawAll();
    
    if(!userIsScrolledAway){
        panCameraToCursor(panTargetY, () => enqueueCommands(placedAll));
    } else {
        enqueueCommands(placedAll);
    }
}

function enqueueCommands(commands){
  drawQueue.push(...commands);
  if(!drawing) processQueue();
}

function commandWorldAnchor(cmd){
  if(cmd.type === 'plot' || cmd.type === 'axes') {
      return [cmd.x + (cmd.w||0)/2, cmd.y - (cmd.h||0)/2];
  }
  if('x' in cmd && 'y' in cmd) return [cmd.x, cmd.y];
  if('x1' in cmd && 'y1' in cmd) return [(cmd.x1+cmd.x2)/2, (cmd.y1+cmd.y2)/2];
  if(Array.isArray(cmd.points) && cmd.points.length) return cmd.points[Math.floor(cmd.points.length/2)];
  return null;
}

function processQueue(){
  if(drawQueue.length===0){ drawing=false; redrawAll(); return; }
  drawing=true;
  const cmd = drawQueue.shift();
  const anchor = commandWorldAnchor(cmd);
  
  if(anchor && !userIsScrolledAway){
    const [sx, sy] = worldToScreen(anchor[0], anchor[1]);
    const margin = 80;
    if(sx < margin || sx > viewW-margin || sy < margin || sy > viewH-margin){
      // Always enforce camera.x locking centrally at 500 when auto-following
      animateCameraPan(500, anchor[1], 260, null);
    }
  }
  
  animateCommand(cmd, ()=>{ drawnCommands.push(cmd); processQueue(); });
}

function animateCommand(cmd, onDone){
  const duration = estimateDuration(cmd);
  const start = performance.now();
  function frame(now){
    const t = Math.min(1,(now-start)/duration);
    redrawAll();
    renderPartialCommand(cmd, t);
    if(t<1) requestAnimationFrame(frame); else onDone();
  }
  requestAnimationFrame(frame);
}

function baseDurationFor(cmd){
  switch(cmd.type){
    case 'text': return Math.min(2200, Math.max(500,(cmd.text||'').length*50));
    case 'line': case 'arrow': return 380;
    case 'curve': return 700;
    case 'rect': return 550;
    case 'circle': return 550;
    case 'axes': return 550;
    case 'plot': return 600 + ((cmd.curves||[]).length)*550;
    case 'highlight': return 250;
    case 'halo': return 450;
    case 'path': return Math.min(2600, Math.max(600, (cmd.segments||[]).length*220));
    default: return 300;
  }
}

function estimateDuration(cmd){
  return baseDurationFor(cmd) * drawPaceScale;
}

// Rough estimate of how long speechSynthesis will take to say `text`,
// matching the rate/voice settings used in speak() below.
function estimateSpeechDurationMs(text){
  const words = (text||'').trim().split(/\s+/).filter(Boolean).length;
  if(!words) return 0;
  const wordsPerMinute = 150 * 0.96; // matches utter.rate in speak()
  const sentencePauses = ((text||'').match(/[.!?]/g) || []).length * 180;
  return (words / wordsPerMinute) * 60000 + sentencePauses;
}

function renderPartialCommand(cmd, t){
  const color = COLORS[cmd.color] || INK;
  ctx.strokeStyle = color; ctx.fillStyle = color;
  switch(cmd.type){
    case 'text': {
      const full = cmd.text || '';
      const fam = "'Kalam', 'Caveat', cursive";
      const weight = cmd.weight || 700;
      const size = (cmd.size||26)*HAND_SIZE_MULT;
      ctx.font = `${weight} ${sw(size)}px ${fam}`;
      const [sx,sy] = worldToScreen(cmd.x, cmd.y);
      if(cmd.maxWidth){
        const lines = wrapTextToLines(full, sw(cmd.maxWidth));
        const lineHeight = sw(lineHeightFor(size));
        let charsLeft = Math.max(1, Math.round(full.length*t));
        let lastX = sx, lastY = sy;
        for(let i=0;i<lines.length;i++){
          const line = lines[i];
          const take = Math.max(0, Math.min(line.length, charsLeft));
          const partial = line.slice(0, take);
          const ly = sy + i*lineHeight;
          ctx.fillText(partial, sx, ly);
          // Only underline a heading line once it's fully written — the
          // underline stroke happens after the words, like a real tutor
          // finishing a heading and then drawing a line under it.
          if(cmd.heading && take >= line.length) drawHeadingUnderline(sx, ly, ctx.measureText(line).width, size, color);
          lastX = sx + ctx.measureText(partial).width;
          lastY = ly;
          charsLeft -= take + 1;
          if(charsLeft <= 0) break;
        }
        drawPen(lastX, lastY, -Math.PI/2);
      } else {
        const nChars = Math.max(1, Math.round(full.length*t));
        const partial = full.slice(0,nChars);
        ctx.fillText(partial, sx, sy);
        const w = ctx.measureText(partial).width;
        if(cmd.heading && nChars >= full.length) drawHeadingUnderline(sx, sy, w, size, color);
        drawPen(sx+w, sy, -Math.PI/2);
      }
      break;
    }
    case 'line': case 'arrow': {
      ctx.lineWidth = sw(cmd.width||2.5);
      const [x1,y1]=worldToScreen(cmd.x1,cmd.y1); const [x2,y2]=worldToScreen(cmd.x2,cmd.y2);
      const cx=x1+(x2-x1)*t, cy=y1+(y2-y1)*t;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(cx,cy); ctx.stroke();
      if(cmd.type==='arrow' && t>=0.98){
        const angle=Math.atan2(y2-y1,x2-x1); const headLen=sw(cmd.headSize||12);
        ctx.beginPath(); ctx.moveTo(x2,y2);
        ctx.lineTo(x2-headLen*Math.cos(angle-Math.PI/7), y2-headLen*Math.sin(angle-Math.PI/7));
        ctx.lineTo(x2-headLen*Math.cos(angle+Math.PI/7), y2-headLen*Math.sin(angle+Math.PI/7));
        ctx.closePath(); ctx.fill();
      }
      drawPen(cx,cy,Math.atan2(y2-y1,x2-x1));
      break;
    }
    case 'curve': {
      ctx.lineWidth = sw(cmd.width||2.5);
      const pts = cmd.points.map(p=>worldToScreen(p[0],p[1]));
      if(cmd.fill && t>=0.999 && pts.length>2){
        ctx.save();
        ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
        for(let i=1;i<pts.length-1;i++){
          const midX=(pts[i][0]+pts[i+1][0])/2, midY=(pts[i][1]+pts[i+1][1])/2;
          ctx.quadraticCurveTo(pts[i][0],pts[i][1],midX,midY);
        }
        const last = pts[pts.length-1]; ctx.lineTo(last[0],last[1]); ctx.closePath();
        ctx.globalAlpha = cmd.fillOpacity!=null ? cmd.fillOpacity : 0.12;
        ctx.fillStyle = COLORS[cmd.fillColor] || color;
        ctx.fill();
        ctx.restore();
      }
      const [penX,penY] = strokeSmoothCurvePartial(pts, t);
      drawPen(penX,penY,0);
      break;
    }
    case 'path': {
      ctx.lineWidth = sw(cmd.width||2.5);
      const screenSegs = worldPathToScreenSegments(cmd.segments||[]);
      const pts = flattenScreenSegsToPoints(screenSegs);
      if(cmd.fill && t>=0.999){
        drawPathSegments(ctx, screenSegs);
        ctx.save();
        ctx.globalAlpha = cmd.fillOpacity!=null ? cmd.fillOpacity : 0.12;
        ctx.fillStyle = COLORS[cmd.fillColor] || color;
        ctx.fill();
        ctx.restore();
      }
      const [penX,penY] = strokePolylinePartial(pts, t);
      drawPen(penX,penY,0);
      break;
    }
    case 'rect': {
      ctx.lineWidth = sw(cmd.width||2.5);
      const [x,y]=worldToScreen(cmd.x,cmd.y); const w=sw(cmd.w), h=sw(cmd.h);
      const perim=2*(w+h), drawn=perim*t;
      ctx.beginPath(); let remaining=drawn, px=x, py=y; ctx.moveTo(px,py);
      const segs=[[w,0],[0,h],[-w,0],[0,-h]];
      for(const [dx,dy] of segs){
        const len=Math.hypot(dx,dy), use=Math.min(len,remaining), frac=use/len;
        px+=dx*frac; py+=dy*frac; ctx.lineTo(px,py); remaining-=use;
        if(remaining<=0) break;
      }
      ctx.stroke(); drawPen(px,py,0);
      break;
    }
    case 'circle': {
      ctx.lineWidth = sw(cmd.width||2.5);
      const [x,y]=worldToScreen(cmd.x,cmd.y); const rx=sw(cmd.rx), ry=sw(cmd.ry);
      ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,-Math.PI/2,-Math.PI/2+t*Math.PI*2); ctx.stroke();
      const ang=-Math.PI/2+t*Math.PI*2;
      drawPen(x+rx*Math.cos(ang), y+ry*Math.sin(ang), ang+Math.PI/2);
      break;
    }
    case 'axes': {
      const [ox,oy]=worldToScreen(cmd.x,cmd.y); const w=sw(cmd.w), h=sw(cmd.h);
      if(t>=0.99) drawAxesGrid(ox, oy, w, h, cmd);
      ctx.lineWidth = sw(2);
      const total=w+h, drawn=total*t;
      ctx.beginPath(); ctx.moveTo(ox,oy);
      const yLen=Math.min(h,drawn); ctx.lineTo(ox,oy-yLen);
      let penX=ox, penY=oy-yLen;
      if(drawn>h){ ctx.moveTo(ox,oy); const xLen=Math.min(w,drawn-h); ctx.lineTo(ox+xLen,oy); penX=ox+xLen; penY=oy; }
      ctx.stroke();
      if(t>=0.99){
        drawArrowhead(ox, oy-h, -Math.PI/2, color);
        drawArrowhead(ox+w, oy, 0, color);
        drawAxesTicksAndLabels(ox, oy, w, h, cmd, color);
      }
      drawPen(penX,penY,0);
      break;
    }
    case 'plot': {
      const [ox,oy]=worldToScreen(cmd.x,cmd.y); const w=sw(cmd.w), h=sw(cmd.h);
      const curves = cmd.curves || [];
      const axesFrac = curves.length ? 0.3 : 1;
      const axesT = Math.min(1, t/axesFrac);
      if(axesT>=0.99) drawAxesGrid(ox, oy, w, h, cmd);
      ctx.lineWidth = sw(2); ctx.strokeStyle = color; ctx.fillStyle = color;
      const axTotal=w+h, axDrawn=axTotal*axesT;
      ctx.beginPath(); ctx.moveTo(ox,oy);
      const yLen=Math.min(h,axDrawn); ctx.lineTo(ox,oy-yLen);
      let penX=ox, penY=oy-yLen;
      if(axDrawn>h){ ctx.moveTo(ox,oy); const xLen=Math.min(w,axDrawn-h); ctx.lineTo(ox+xLen,oy); penX=ox+xLen; penY=oy; }
      ctx.stroke();
      if(axesT>=0.99){
        drawArrowhead(ox, oy-h, -Math.PI/2, color);
        drawArrowhead(ox+w, oy, 0, color);
        drawAxesTicksAndLabels(ox, oy, w, h, cmd, color);
      }
      if(curves.length){
        const [scaleX, scaleY] = plotScalers(ox, oy, w, h, cmd);
        const perCurve = (1-axesFrac)/curves.length;
        curves.forEach((curve, i) => {
          const curveT = Math.max(0, Math.min(1, (t-axesFrac-i*perCurve)/perCurve));
          if(curveT<=0) return;
          const pts = (curve.points||[]).map(p=>[scaleX(p[0]), scaleY(p[1])]);
          if(pts.length<2) return;
          ctx.strokeStyle = COLORS[curve.color] || color;
          ctx.lineWidth = sw(curve.width||2.75);
          const [cx,cy] = strokeSmoothCurvePartial(pts, curveT);
          if(curveT>=1){
            if(curve.label){
              ctx.fillStyle = COLORS[curve.color] || color;
              ctx.font = `${sw(16)}px 'Caveat', cursive`;
              ctx.textAlign = 'left';
              ctx.fillText(curve.label, cx+sw(8), cy+sw(4));
            }
          } else { penX=cx; penY=cy; }
        });
      }
      drawPen(penX,penY,0);
      break;
    }
    case 'highlight': {
      ctx.globalAlpha = 0.18*t;
      const [x,y]=worldToScreen(cmd.x,cmd.y);
      ctx.fillRect(x,y,sw(cmd.w)*t, sw(cmd.h||26));
      ctx.globalAlpha=1;
      break;
    }
    case 'halo': {
      const [x,y] = worldToScreen(cmd.x, cmd.y);
      const r = sw(cmd.r || 60);
      const glow = COLORS[cmd.color] || HALO;
      const grad = ctx.createRadialGradient(x,y,0,x,y,r);
      grad.addColorStop(0, hexToRgba(glow, 0.40*t));
      grad.addColorStop(1, hexToRgba(glow, 0));
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
      break;
    }
  }
}

/* =========================================================
   VOICE
   ========================================================= */
const avatar = document.getElementById('avatar');
const captionText = document.getElementById('caption-text');
let currentUtteranceText = '';
let currentSpeechToken = 0;

let bestVoice = null;
let voicesReady = false;

function scoreVoice(v){
  let score = 0;
  const name = v.name || '';
  if(/Natural/i.test(name)) score += 100;
  if(/Neural/i.test(name)) score += 95;
  if(/Premium/i.test(name)) score += 90;
  if(/Enhanced/i.test(name)) score += 85;
  if(/Google/i.test(name)) score += 70;
  if(/Microsoft.*Online/i.test(name)) score += 65;
  if(/Siri/i.test(name)) score += 60;
  if(v.localService) score += 8;
  if(/^en-US$/i.test(v.lang)) score += 6;
  else if(/^en-GB$/i.test(v.lang)) score += 5;
  else if(/^en/i.test(v.lang)) score += 3;
  if(/Samantha|Aria|Jenny|Libby|Sonia|Serena/i.test(name)) score += 4;
  return score;
}

function pickBestVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || voices.length === 0) return null;
  const english = voices.filter(v => /^en/i.test(v.lang));
  const pool = english.length ? english : voices;
  pool.sort((a,b) => scoreVoice(b) - scoreVoice(a));
  return pool[0] || null;
}

function refreshVoiceList(){
  bestVoice = pickBestVoice();
  voicesReady = !!bestVoice;
  populateVoiceDropdown();
}

if('speechSynthesis' in window){
  refreshVoiceList();
  window.speechSynthesis.onvoiceschanged = refreshVoiceList;
  let pollTries = 0;
  const pollInterval = setInterval(()=>{
    pollTries++;
    if(voicesReady || pollTries > 20){ clearInterval(pollInterval); return; }
    refreshVoiceList();
  }, 250);
}

function populateVoiceDropdown(){
  const sel = document.getElementById('voice-select');
  if(!sel) return;
  const voices = window.speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  const pool = voices.length ? voices : window.speechSynthesis.getVoices();
  if(!pool.length) return;
  const currentVal = sel.value;
  sel.innerHTML = '';
  pool.sort((a,b)=> scoreVoice(b)-scoreVoice(a)).forEach(v=>{
    const opt = document.createElement('option');
    opt.value = v.name;
    opt.textContent = v.name + (v.localService ? '' : ' (network)');
    sel.appendChild(opt);
  });
  if(currentVal && pool.some(v=>v.name===currentVal)){
    sel.value = currentVal;
  } else if(bestVoice){
    sel.value = bestVoice.name;
  }
}

function getSelectedVoice(){
  const sel = document.getElementById('voice-select');
  const voices = window.speechSynthesis.getVoices();
  if(sel && sel.value){
    const chosen = voices.find(v => v.name === sel.value);
    if(chosen) return chosen;
  }
  return bestVoice;
}

function splitIntoSpeechChunks(text){
  const sentences = text.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [text];
  const chunks = [];
  for(let s of sentences){
    s = s.trim();
    if(!s) continue;
    if(s.length > 160){
      const parts = s.split(/(?<=[,;:])\s+/);
      let buf = '';
      for(const p of parts){
        if((buf + ' ' + p).trim().length > 160 && buf){ chunks.push(buf.trim()); buf = p; }
        else buf = (buf ? buf + ' ' : '') + p;
      }
      if(buf.trim()) chunks.push(buf.trim());
    } else {
      chunks.push(s);
    }
  }
  return chunks;
}

function renderCaption(fullText, chunkStartIndex, chunkText){
  const said = fullText.slice(0, chunkStartIndex);
  const windowStart = Math.max(0, said.length - 70);
  const fadedPart = fullText.slice(windowStart, chunkStartIndex);
  const freshPart = chunkText;
  captionText.innerHTML = `<span class="fading">${escapeHtml(fadedPart)}</span><span>${escapeHtml(freshPart)}</span>`;
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const myToken = ++currentSpeechToken;
  currentUtteranceText = text;
  const chunks = splitIntoSpeechChunks(text);
  let searchPos = 0;
  const chunkOffsets = chunks.map(c => {
    const idx = text.indexOf(c, searchPos);
    searchPos = idx >= 0 ? idx + c.length : searchPos;
    return idx >= 0 ? idx : searchPos;
  });

  const voice = getSelectedVoice();

  function speakChunk(i){
    if(myToken !== currentSpeechToken) return;
    if(i >= chunks.length){ avatar.classList.remove('speaking'); return; }
    const utter = new SpeechSynthesisUtterance(chunks[i]);
    utter.rate = 0.96;
    utter.pitch = 1.0;
    utter.volume = 1.0; // Enforces maximum browser volume output
    if(voice) utter.voice = voice;
    renderCaption(text, chunkOffsets[i], chunks[i]);
    utter.onstart = () => avatar.classList.add('speaking');
    utter.onend = () => {
      if(myToken !== currentSpeechToken) return;
      const pause = /\?\s*$/.test(chunks[i]) ? 260 : 140;
      setTimeout(()=> speakChunk(i+1), pause);
    };
    utter.onerror = () => { if(myToken === currentSpeechToken) speakChunk(i+1); };
    window.speechSynthesis.speak(utter);
  }
  speakChunk(0);
}
document.getElementById('btn-replay').addEventListener('click', ()=>{ if(currentUtteranceText) speak(currentUtteranceText); });

async function handlePdfFile(file){
  if(!pdfjsAvailable){ alert('PDF import couldn\'t load its engine (a network or blocker issue). Try reloading the page.'); return; }
  if(file.type !== 'application/pdf'){ alert('Please choose a PDF file.'); return; }
  setStatus('reading pdf…');
  pdfFileName = file.name;
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
  let fullText = '';
  const maxPages = Math.min(pdf.numPages, 40);
  for(let i=1;i<=maxPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    fullText += `\n\n[Page ${i}]\n` + content.items.map(it=>it.str).join(' ');
  }
  pdfText = fullText;
  uploadZone.classList.add('has-file');
  uploadZone.innerHTML = `<div class="file-name">📄 ${escapeHtml(pdfFileName)}</div><div class="file-meta">${pdf.numPages} pages · text extracted</div>`;

}
