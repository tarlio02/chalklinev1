<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Source+Serif+4:wght@400;600&family=JetBrains+Mono:wght@500;600&display=swap');
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#FFFFFF; font-family:-apple-system,Segoe UI,sans-serif; }
  /* Scoped to .shell-page specifically (not a bare "iframe" tag selector):
     a bare tag selector here would also catch any other <iframe> that
     ends up on the page — e.g. the one Google's Sign-In script injects
     into #shell-signin-btn — and fade it to invisible/unclickable since
     it never receives the .active class our router manages below. */
  .shell-page{ position:fixed; inset:0; width:100%; height:100%; border:none; background:#FFFFFF; }
  .shell-page{
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity 0.22s ease;
  }
  .shell-page.active{ opacity:1; visibility:visible; pointer-events:auto; z-index:2; }
  /* The outgoing page stays visible (z-index below the incoming one)
     just long enough to crossfade out, instead of vanishing instantly. */
  .shell-page.leaving{ opacity:0; visibility:visible; pointer-events:none; z-index:1; }

  /* Real Google Sign-In must live in the top-level page — a srcdoc
     iframe reports location.origin as "null", and Google's Identity
     script refuses to authenticate from a null origin. */
  #shell-auth{
    position:fixed;
    top:calc(16px + env(safe-area-inset-top, 0px));
    right:calc(20px + env(safe-area-inset-right, 0px));
    z-index:9999;
    display:flex; align-items:center; gap:8px;
    font-family:-apple-system,Segoe UI,sans-serif;
  }
  #shell-account-chip{
    display:none; position:relative;
  }
  #shell-account-btn{
    display:flex; align-items:center; gap:8px;
    background:#fff; border:1px solid #D3E6F5; border-radius:999px;
    padding:6px 16px 6px 6px; font-size:14.5px; color:#1E2B3A;
    box-shadow:0 1px 4px rgba(0,0,0,0.08);
    cursor:pointer; font-family:inherit;
  }
  #shell-account-btn:hover{ background:#F7FBFF; }
  #shell-account-btn img{ width:30px; height:30px; border-radius:50%; }
  #shell-account-btn .shell-chevron{ font-size:10.5px; color:#7C93A8; }
  #shell-account-menu{
    display:none; position:absolute; top:calc(100% + 8px); right:0;
    background:#fff; border:1px solid #D3E6F5; border-radius:12px;
    box-shadow:0 4px 16px rgba(0,0,0,0.12);
    min-width:180px; padding:10px 0; font-size:13px;
  }
  #shell-account-menu.open{ display:block; }
  #shell-account-menu .shell-menu-name{
    padding:6px 14px 10px; font-weight:600; color:#1E2B3A;
    border-bottom:1px solid #EEF3F8; margin-bottom:6px; word-break:break-word;
  }
  #shell-account-menu button{
    display:block; width:100%; text-align:left; border:none; background:none;
    color:#C0392B; cursor:pointer; font-size:13px; padding:8px 14px;
    font-family:inherit;
  }
  #shell-account-menu button:hover{ background:#FBEDE9; }

  /* "Start for free" sign-in-or-skip prompt. Lives in the top-level shell
     (not one of the page iframes) so the real Google button — which can
     only render in a document with a real origin — can sit inside it. */
  #start-modal-overlay{
    position:fixed; inset:0; z-index:10000;
    display:none; align-items:center; justify-content:center;
    background:rgba(20,32,44,0.45);
    padding:20px;
    font-family:-apple-system,Segoe UI,sans-serif;
  }
  #start-modal-overlay.open{ display:flex; }
  #start-modal-card{
    background:#fff; border-radius:20px; padding:34px 28px 28px;
    max-width:360px; width:100%; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
    position:relative;
  }
  #start-modal-close{
    position:absolute; top:14px; right:14px;
    border:none; background:none; font-size:15px; color:#7C93A8; cursor:pointer;
    padding:4px;
  }
  #start-modal-card h2{ margin:0 0 10px; font-size:20px; color:#1E2B3A; }
  #start-modal-card p{ margin:0 0 22px; font-size:14px; color:#5c6f80; line-height:1.5; }
  #start-modal-google-btn{ display:flex; justify-content:center; margin-bottom:14px; min-height:44px; }
  #start-modal-skip{
    display:block; width:100%; padding:12px; border-radius:999px;
    border:1px solid #D3E6F5; background:#fff; color:#1E2B3A; font-size:14px; cursor:pointer;
    font-family:inherit;
  }
  #start-modal-skip:hover{ border-color:#2E7DBE; }
  #start-modal-note{ margin:14px 0 0 !important; font-size:12px !important; color:#9aa9b8 !important; }

  /* Soft "Welcome to Chalkline" moment after skipping sign-in — its own
     deep-blue gradient scene, not a translucent veil over the page
     behind it. */
  #welcome-toast{
    position:fixed; inset:0; z-index:10001;
    display:none; align-items:center; justify-content:center;
    pointer-events:none;
    background:linear-gradient(135deg, #0A1930 0%, #123A66 55%, #1C4E86 100%);
    opacity:0;
    transition:opacity .5s ease;
  }
  #welcome-toast.show{ display:flex; opacity:1; }
  #welcome-toast.fade-out{ opacity:0; }
  #welcome-toast-text{
    font-family:'Caveat', -apple-system, cursive; font-weight:700;
    font-size:52px; color:#fff;
    display:inline-flex;
  }
  /* Each letter fades/lifts in on its own delay (set inline in JS) so the
     whole line looks hand-drawn one character at a time, not typed. */
  #welcome-toast-text .wt-letter{
    opacity:0; display:inline-block; white-space:pre;
    transform:translateY(10px);
    transition:opacity .4s ease, transform .4s ease;
  }
  #welcome-toast-text .wt-letter.in{ opacity:1; transform:translateY(0); }

  /* "Are you sure?" prompt shown before signing out (from any page's
     account button). Same look as the start modal. */
  #signout-modal-overlay{
    position:fixed; inset:0; z-index:10002;
    display:none; align-items:center; justify-content:center;
    background:rgba(20,32,44,0.45);
    padding:20px;
    font-family:-apple-system,Segoe UI,sans-serif;
  }
  #signout-modal-overlay.open{ display:flex; }
  #signout-modal-card{
    background:#fff; border-radius:20px; padding:30px 26px 24px;
    max-width:340px; width:100%; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
  }
  #signout-modal-card h2{ margin:0 0 10px; font-size:20px; color:#1E2B3A; }
  #signout-modal-card p{ margin:0 0 22px; font-size:14px; color:#5c6f80; line-height:1.5; }
  #signout-modal-actions{ display:flex; gap:10px; }
  #signout-modal-actions button{
    flex:1; padding:12px; border-radius:999px; font-size:14px; cursor:pointer;
    font-family:inherit; font-weight:600;
  }
  #signout-cancel{ border:1px solid #D3E6F5; background:#fff; color:#1E2B3A; }
  #signout-cancel:hover{ border-color:#2E7DBE; }
  #signout-confirm{ border:1px solid #C0392B; background:#C0392B; color:#fff; }
  #signout-confirm:hover{ background:#a93226; border-color:#a93226; }

  /* Settings popup (opened from any page's Settings button). */
  #settings-modal-overlay{
    position:fixed; inset:0; z-index:10000;
    display:none; align-items:center; justify-content:center;
    background:rgba(42,36,16,0.38);
    padding:20px;
  }
  #settings-modal-overlay.open{ display:flex; }
  #settings-modal-card{
    position:relative; width:100%; max-width:380px;
    background:#fff; border:1px solid #ECE3C8; border-radius:20px; overflow:hidden;
    box-shadow:0 24px 60px rgba(60,40,5,0.30);
    font-family:'Source Serif 4', Georgia, serif; color:#2A2410;
  }
  #settings-modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 16px 24px; border-bottom:1px solid #ECE3C8;
    background:linear-gradient(165deg, #FFFFFF 0%, #FFF7E0 130%);
  }
  #settings-modal-head h2{ margin:0; font-size:20px; font-weight:600; }
  #settings-modal-close{
    border:none; background:none; cursor:pointer; font-size:16px; color:#8A8267;
    padding:6px 8px; border-radius:8px; line-height:1;
  }
  #settings-modal-close:hover{ background:rgba(0,0,0,0.05); color:#2A2410; }
  #settings-modal-close:focus, #signout-cancel:focus{ outline:none; }
  #settings-modal-close:focus-visible{ box-shadow:0 0 0 2px rgba(46,125,190,0.5); }
  #signout-cancel:focus-visible{ box-shadow:0 0 0 2px rgba(46,125,190,0.5); }
  #settings-modal-body{ padding:0; }
  .st-top{ display:flex; align-items:center; gap:16px; padding:22px 24px; }
  .st-avatar{
    width:64px; height:64px; border-radius:50%; flex-shrink:0; object-fit:cover;
    background:linear-gradient(135deg, #2E7DBE, #F0B94D);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:26px; font-weight:600;
    box-shadow:0 0 0 4px rgba(240,185,77,0.30);
  }
  .st-id{ min-width:0; }
  .st-name{ font-size:22px; font-weight:600; line-height:1.2; overflow-wrap:anywhere; }
  .st-email{ font-family:'JetBrains Mono', monospace; font-size:12px; color:#8A8267; margin-top:5px; overflow-wrap:anywhere; }
  .st-row{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:16px 24px; border-top:1px solid #ECE3C8;
  }
  .st-row .k{ font-size:15px; color:#5c5847; }
  .st-row .v{ font-family:'JetBrains Mono', monospace; font-size:19px; font-weight:600; }
  .st-signin{ padding:24px; font-size:14.5px; color:#8A8267; line-height:1.55; }
  .st-signin p{ margin:0 0 16px; }
  .st-signin button{
    font-family:inherit; font-size:14.5px; font-weight:600; color:#fff; border:none; border-radius:999px;
    padding:11px 22px; cursor:pointer;
    background:linear-gradient(140deg, #2E7DBE, #C98A2B);
    box-shadow:0 6px 14px -6px rgba(120,90,20,0.35);
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<body>

<div id="shell-auth">
  <div id="shell-signin-btn"></div>
  <div id="shell-account-chip">
    <button type="button" id="shell-account-btn" title="Account">

<iframe id="frame-home" class="shell-page"></iframe>

<iframe id="frame-summary-history" class="shell-page"></iframe>
<iframe id="frame-quiz-history" class="shell-page"></iframe>

<div id="start-modal-overlay">
  <div id="start-modal-card">
    <button type="button" id="start-modal-close" aria-label="Close">✕</button>

<div id="settings-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
  <div id="settings-modal-card">

      <h2 id="settings-modal-title">⚙️ Settings</h2>

</div>

<div id="signout-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="signout-modal-title">

    <p>Are you sure you want to sign out? You can sign back in anytime.</p>
    <div id="signout-modal-actions">
      <button type="button" id="signout-cancel">Cancel</button>
      <button type="button" id="signout-confirm">Sign out</button>
    </div>
  </div>
</div>

<div id="welcome-toast"><span id="welcome-toast-text"></span></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// Google Sign-In lives here, at the top level, because this is the only
// document with a real, non-null origin (https://tarlio02.github.io).
// The individual "pages" below are rendered into iframes via .srcdoc,
// and srcdoc documents report origin=null — Google's script rejects
// those requests outright (Error 400: invalid_request, origin=null).
const SHELL_GOOGLE_CLIENT_ID = "676487295279-j4qka36obo55unl3vds7ja2v24uoq6dm.apps.googleusercontent.com";

// "Stay signed in": we cache the decoded profile from the ID token in
// localStorage (this top-level page has a real origin, so localStorage
// works fine here). On every fresh page load we restore it immediately,
// before Google's script has even finished loading, so a returning
// visitor doesn't have to sign in again just because they closed the
// tab or came back the next day. This only restores the *display*
// identity (name/email/picture/sub) that was already being decoded
// client-side with no backend verification — same trust level as
// before, just remembered across visits instead of forgotten on reload.
// Once a real backend exists, swap this for a proper refresh-token /
// session-cookie flow and verify server-side instead.
const SHELL_AUTH_STORAGE_KEY = 'chalkline_shell_user';
let shellUser = null;

function decodeShellIdToken(jwt){
  const payload = jwt.split('.')[1];
  const json = decodeURIComponent(atob(payload.replace(/-/g,'+').replace(/_/g,'/')).split('').map(c=>
    '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
  ).join(''));
  return JSON.parse(json);
}

function broadcastAuthState(){
  try{
    const so = document.getElementById('settings-modal-overlay');
    if(so && so.classList.contains('open')) renderSettingsModal();
  } catch(e){}
  const msg = { chalklineAuth: true, signedIn: !!shellUser, user: shellUser };
  Object.values(frames).forEach(f => { try{ f.contentWindow.postMessage(msg, '*'); }catch(e){} });
}

function showSignedInChip(user){
  document.getElementById('shell-signin-btn').style.display = 'none';
  // The account name/avatar now lives in each page's own sidebar
  // (mirrors shellUser via chalklineAuth broadcasts below), so the
  // top-right chip is intentionally never shown anymore — just keep
  // it hidden and stash the name for the (now-unused) dropdown.
  const fullName = user.name || user.email || 'Signed in';
  document.getElementById('shell-menu-name').textContent = fullName;
}

function toggleShellAccountMenu(forceOpen){
  const menu = document.getElementById('shell-account-menu');
  const shouldOpen = forceOpen !== undefined ? forceOpen : !menu.classList.contains('open');
  menu.classList.toggle('open', shouldOpen);
}

document.getElementById('shell-account-btn').addEventListener('click', (e)=>{
  e.stopPropagation();
  toggleShellAccountMenu();
});
// Clicking anywhere outside the menu closes it.
document.addEventListener('click', (e)=>{
  const chip = document.getElementById('shell-account-chip');
  if(!chip.contains(e.target)) toggleShellAccountMenu(false);
});

function restoreShellSession(){
  try{
    const raw = localStorage.getItem(SHELL_AUTH_STORAGE_KEY);
    if(!raw) return;
    shellUser = JSON.parse(raw);
    showSignedInChip(shellUser);
    // Frames haven't loaded yet at this point in the page lifecycle —
    // ensureLoaded() posts the current shellUser to each frame the
    // first time it's opened, so there's nothing to broadcast to yet.
  } catch(e){ console.error('Could not restore saved sign-in:', e); localStorage.removeItem(SHELL_AUTH_STORAGE_KEY); }
}
restoreShellSession();
// Sync a remembered sign-in once the script has finished loading (the sync code below defines its own constants).
setTimeout(() => { if(shellUser && workerSessionAlive(readWorkerSession())) syncNow(true); }, 0);

// ---- Backend: worker session + cloud sync ---------------------------
// Signing in with Google now also trades the Google credential for a worker
// session token (30 days). The token is what lets the AI pages count against
// the right plan, and what unlocks cloud sync. If the worker is unreachable
// the app carries on exactly as before, using this browser's storage only.
//
// Sync model: everything the pages save for this account (courses, lessons,
// summaries, quizzes, notes and their settings) lives in localStorage under
// "chalkline:<kind>:<sub>...". We mirror those keys to the worker. A small
// per-account record (chalkline_sync_meta:<sub>) remembers, for each key, the
// hash and cloud timestamp from the last successful sync, which is how we tell
// "changed here", "changed elsewhere" and "deleted" apart.
//   - sign-in / startup / back online: pull first, then push
//   - after any save (storage event), when the tab is hidden, every 60s: push
//   - a course list changed on two devices is merged (union); any other item
//     changed on two devices keeps this device's copy.
const WORKER_URL = "https://api.takundamambudzi02.workers.dev";
const SESSION_STORAGE_KEY = 'chalkline_session';   // { token, plan, sub } - the AI pages read this too
const SYNC_META_PREFIX = 'chalkline_sync_meta:';
let syncTimer = null, syncBusy = false, syncAgain = false;
let cloudLoadedFor = null;   // account whose cloud content has been loaded into this device this session

// Supabase is how the worker actually verifies who's asking (see
// verifyGoogleIdToken in worker.js) — every "idToken" the worker accepts
// on /storage/* and /subscription/* is a SUPABASE access token, not a raw
// Google credential. signInWithIdToken() trades the Google credential for
// exactly that. The anon/publishable key is meant to ship client-side.
const SUPABASE_URL = "https://wxpvuutxemfubwvatmjy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_3M3ZN-JrPl5iDn_ar7oyVA_X2fxx9CZ";
const supabaseClient = (typeof supabase !== 'undefined')
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } })
  : null;

function readWorkerSession(){
  try{ return JSON.parse(localStorage.getItem(SESSION_STORAGE_KEY) || 'null'); } catch(e){ return null; }
}
// Supabase access tokens only last about an hour, so a session counts as alive
// if it has a refresh token (we can mint a new access token) or the token
// itself still has a minute left. Requiring "more than an hour left" meant a
// fresh token never counted, so startup sync was skipped and sign-in was
// re-prompted on every visit.
function workerSessionAlive(s){
  if(!s || !s.token) return false;
  if(s.refresh) return true;
  try{
    const p = JSON.parse(atob(s.token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    return p.exp * 1000 > Date.now() + 60e3;
  } catch(e){ return false; }
}
let tokenRefreshing = null;
// Swaps in a fresh Supabase access token when the current one is (nearly)
// expired. Returns false if the session can't be renewed (sign in again).
async function ensureFreshToken(){
  const s = readWorkerSession();
  if(!s || !s.token) return false;
  let exp = 0;
  try{ exp = JSON.parse(atob(s.token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp * 1000; } catch(e){}
  if(exp > Date.now() + 120e3) return true;
  if(!s.refresh || !supabaseClient) return false;
  if(!tokenRefreshing){
    tokenRefreshing = (async () => {
      const { data, error } = await supabaseClient.auth.refreshSession({ refresh_token: s.refresh });
      if(error || !data || !data.session) throw (error || new Error('refresh failed'));
      const cur = readWorkerSession() || s;
      localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(Object.assign({}, cur, {
        token: data.session.access_token,
        refresh: data.session.refresh_token,
      })));
      return true;
    })().finally(() => { tokenRefreshing = null; });
  }
  try{ return await tokenRefreshing; }
  catch(e){ console.warn('Session refresh failed:', (e && e.message) || e); return false; }
}
function workerFetch(path, opts){
  opts = opts || {};
  const s = readWorkerSession();
  const headers = Object.assign({ 'Content-Type':'application/json' }, opts.headers || {});
  if(s && s.token) headers.Authorization = 'Bearer ' + s.token;
  return fetch(WORKER_URL + path, Object.assign({}, opts, { headers }));
}
// The worker's /storage/* routes (the ones that actually exist — see
// worker.js) take the Supabase access token as "idToken" IN THE JSON BODY,
// not as an Authorization header, and every key is already namespaced
// server-side by the caller's verified account — so the client never needs
// to prefix keys by sub itself, just filter which local keys belong to
// this account (syncKeyRegex) before deciding what to push/pull.
async function workerStorage(action, params){
  await ensureFreshToken();
  const s = readWorkerSession();
  if(!s || !s.token) throw new Error('not signed in');
  const r = await fetch(WORKER_URL + '/storage/' + action, {
    method: 'POST',
    headers: { 'Content-Type':'application/json' },
    body: JSON.stringify(Object.assign({ idToken: s.token }, params)),
  });
  if(r.status === 401){ localStorage.removeItem(SESSION_STORAGE_KEY); throw new Error('session expired'); }
  if(!r.ok) throw new Error('storage/' + action + ' failed (' + r.status + ')');
  return r.json();
}
async function exchangeCredential(credential){
  // NOTE: the worker has no "/auth/google" route — it verifies callers by
  // asking Supabase itself (see verifyGoogleIdToken in worker.js), so the
  // token we hand it has to be a real Supabase session access token, minted
  // here via the Google credential, not anything the worker issues itself.
  if(!supabaseClient) throw new Error('Supabase client failed to load');
  const { data, error } = await supabaseClient.auth.signInWithIdToken({ provider: 'google', token: credential });
  if(error) throw error;
  const token = data && data.session && data.session.access_token;
  if(!token) throw new Error('sign-in exchange failed (no session returned)');
  localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({ token, refresh: data.session.refresh_token, sub: shellUser && shellUser.sub }));
  return { token };
}

// Small on-screen sync status (tap to hide), so problems are visible on devices
// with no console, like an iPad.
function setSyncStatus(msg, isErr){
  try{
    let el = document.getElementById('sync-status-banner');
    if(!el){
      el = document.createElement('div');
      el.id = 'sync-status-banner';
      el.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99999;max-width:92vw;padding:8px 12px;border-radius:10px;font:12px/1.4 -apple-system,system-ui,sans-serif;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3);';
      el.addEventListener('click', () => { el.style.display = 'none'; });
      document.body.appendChild(el);
    }
    el.style.background = isErr ? '#b3261e' : '#1e6b3a';
    el.textContent = 'Cloud sync: ' + msg;
    el.style.display = 'block';
  } catch(e){}
}

function syncKeyRegex(sub){
  return new RegExp('^chalkline:(courses|session|summary|quiz|notes|notes-settings):' + String(sub).replace(/[^\w]/g,'\\$&') + '(:|$)');
}
function fnv(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h>>>0).toString(36) + ':' + str.length;
}
function loadSyncMeta(sub){ try{ return JSON.parse(localStorage.getItem(SYNC_META_PREFIX + sub) || '{}'); } catch(e){ return {}; } }
function saveSyncMeta(sub, m){ try{ localStorage.setItem(SYNC_META_PREFIX + sub, JSON.stringify(m)); } catch(e){} }
function localSyncKeys(sub){
  const re = syncKeyRegex(sub), out = [];
  for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k && re.test(k)) out.push(k); }
  return out;
}
const isCoursesKey = k => k.indexOf('chalkline:courses:') === 0;
function unionCourses(a, b){
  try{ return JSON.stringify(Array.from(new Set([].concat(JSON.parse(a) || [], JSON.parse(b) || [])))); }
  catch(e){ return a; }
}
// Bring cloud changes down. Returns true if anything local changed.
// NOTE: worker.js's /storage/set is a plain last-write-wins KV put — it has
// no ETag/base-version conflict check (no 409), unlike what this used to
// assume. So "changed on two devices" can't be detected server-side; the
// courses-union rule below is the one place we still merge instead of
// picking a winner, everything else is last-write-wins by sync order.
async function pullCloud(sub, authoritative){
  const { keys } = await workerStorage('list', { prefix: '' });
  const re = syncKeyRegex(sub), meta = loadSyncMeta(sub);
  const cloudKeys = new Set((keys || []).filter(k => re.test(k)));
  window.__syncInfo = { total: (keys || []).length, matched: cloudKeys.size, sample: (keys || [])[0] || '', sub: String(sub) };
  // Safety: if the cloud has nothing at all for this account, this device's content
  // has never been uploaded — keep it (it gets pushed next) instead of wiping it.
  if(authoritative && cloudKeys.size === 0) authoritative = false;
  let changed = false;
  for(const key of cloudKeys){
    const got = await workerStorage('get', { key });
    if(!got || got.value == null) continue;
    const value = got.value;
    const h = fnv(value);
    if(authoritative){                                    // first load after sign-in/startup: the cloud copy replaces this device's
      if(localStorage.getItem(key) !== value){ localStorage.setItem(key, value); changed = true; }
      meta[key] = { h };
      continue;
    }
    const m = meta[key];
    if(m && m.h === h) continue;                          // cloud copy unchanged since last sync
    const local = localStorage.getItem(key);
    if(local === null || local === value || (m && m.h === fnv(local))){
      // nothing unsynced here, so the cloud copy simply wins
      if(local !== value){ localStorage.setItem(key, value); changed = true; }
      meta[key] = { h };
    } else if(isCoursesKey(key)){
      const merged = unionCourses(local, value);
      localStorage.setItem(key, merged); changed = true;
      meta[key] = { h: fnv(merged) };                      // differs from cloud now, so the merge is pushed next
    } else {
      meta[key] = { h: m ? m.h : '' };                     // keep this device's copy; push will overwrite the cloud
    }
  }
  if(authoritative){
    // Supabase is the source of truth: anything on this device that isn't in the cloud is discarded.
    for(const k of localSyncKeys(sub)){ if(!cloudKeys.has(k)){ localStorage.removeItem(k); changed = true; } }
    for(const k of Object.keys(meta)){ if(!cloudKeys.has(k)) delete meta[k]; }
    saveSyncMeta(sub, meta);
    return changed;
  }
  // Deleted elsewhere: gone from the cloud, untouched here since last sync.
  for(const key of Object.keys(meta)){
    if(cloudKeys.has(key) || meta[key].skip) continue;
    const local = localStorage.getItem(key);
    if(local !== null && meta[key].h === fnv(local)){ localStorage.removeItem(key); changed = true; }
    delete meta[key];
  }
  saveSyncMeta(sub, meta);
  return changed;
}

// Send local changes up (new/edited keys, and keys deleted here).
async function pushLocal(sub){
  const meta = loadSyncMeta(sub), keys = localSyncKeys(sub), keySet = new Set(keys), jobs = [];
  for(const k of keys){
    const v = localStorage.getItem(k), m = meta[k];
    if(!m || m.h !== fnv(v)) jobs.push({ k, v });
  }
  for(const k of Object.keys(meta)){
    if(!keySet.has(k)){ if(meta[k].skip) delete meta[k]; else jobs.push({ k, del:true }); }
  }
  async function run(job){
    try{
      if(job.del){
        await workerStorage('delete', { key: job.k });
        delete meta[job.k];
        return;
      }
      await workerStorage('set', { key: job.k, value: job.v });
      meta[job.k] = { h: fnv(job.v) };
    } catch(e){
      if(e && e.message === 'session expired') throw e;    // stop the batch, don't mark as skip
      meta[job.k] = { h: fnv(job.v), skip:true };
      console.warn('Not synced (rejected by worker):', job.k, e);
    }
  }
  const queue = jobs.slice();
  await Promise.all([0,1,2].map(async () => { while(queue.length){ await run(queue.shift()); } }));
  saveSyncMeta(sub, meta);
}

async function syncNow(pullFirst){
  if(!shellUser || !shellUser.sub) return;
  const s = readWorkerSession();
  if(!s || !s.token || (s.sub && s.sub !== shellUser.sub)){
    setSyncStatus('not connected (no cloud session — try signing out and in again)', true);
    return;
  }
  if(syncBusy){ syncAgain = true; return; }
  syncBusy = true;
  const sub = shellUser.sub;
  try{
    // Never push before the cloud copy has been loaded once, or stale local data could overwrite it.
    const firstLoad = cloudLoadedFor !== sub;
    if(firstLoad){
      const mm = loadSyncMeta(sub); let cleared = false;
      for(const k of Object.keys(mm)){ if(mm[k] && mm[k].skip){ delete mm[k]; cleared = true; } }
      if(cleared) saveSyncMeta(sub, mm);
    }
    const changed = (pullFirst || firstLoad) ? await pullCloud(sub, firstLoad) : false;
    if(firstLoad) cloudLoadedFor = sub;
    await pushLocal(sub);
    if(changed) broadcastAuthState();   // pages re-read their data now that it changed
    const i = window.__syncInfo || {};
    if(firstLoad || changed) setSyncStatus('OK — ' + (i.matched || 0) + ' item(s) in cloud for this account (id …' + String(i.sub || '').slice(-4) + ')' + (i.total && !i.matched ? ' — account id mismatch: ' + i.sample + ' vs ' + i.sub : ''), !!(i.total && !i.matched));
  } catch(e){
    console.warn('Cloud sync paused:', (e && e.message) || e);
    setSyncStatus('failed — ' + ((e && e.message) || e), true);
  } finally {
    syncBusy = false;
    if(syncAgain){ syncAgain = false; scheduleSync(); }
  }
}
function scheduleSync(ms){ clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(false), ms || 2500); }

window.addEventListener('storage', (e) => { if(e.key && e.key.indexOf('chalkline:') === 0) scheduleSync(); });
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') syncNow(false); });
window.addEventListener('online', () => syncNow(true));
setInterval(() => syncNow(false), 60000);

function handleShellCredential(response){
  shellUser = decodeShellIdToken(response.credential);
  try{ localStorage.setItem(SHELL_AUTH_STORAGE_KEY, JSON.stringify(shellUser)); }
  catch(e){ console.error('Could not persist sign-in:', e); }
  showSignedInChip(shellUser);
  broadcastAuthState();
  // If this credential came from the "Start for free" modal, finish that
  // flow now: close the modal and take the person into the app.
  const modal = document.getElementById('start-modal-overlay');
  if(modal.classList.contains('open')){
    closeStartModal();
    navTo('home');
  }
  // Verify the credential on the worker, then load/merge this person's saved
  // work. If the worker is unreachable the app keeps working locally.
  exchangeCredential(response.credential)
    .then(() => syncNow(true))
    .catch(e => { console.warn('Backend sign-in unavailable, working locally:', (e && e.message) || e); setSyncStatus('sign-in failed — ' + ((e && e.message) || e), true); });
}

// Fallback shown if Google's own rendered button fails or vanishes (see
// watchdog below) — a plain link that still triggers the real Google
// prompt, so there's always SOMETHING clickable even when the official
// button can't survive in this browser's cookie environment. Used for
// both the persistent top-right button and the one inside the start modal.
function showShellSigninFallbackLink(elId){
  const el = document.getElementById(elId);
  if(!el || el.dataset.fallback === '1') return; // already showing it, don't stack duplicates
  el.dataset.fallback = '1';
  const linkId = elId + '-fallback-link';
  el.innerHTML = '<a href="#" id="'+linkId+'" style="font-size:14px;color:#1a56db;text-decoration:underline;">Sign in with Google</a>';
  document.getElementById(linkId).addEventListener('click', (e)=>{
    e.preventDefault();
    if(typeof google !== 'undefined' && google.accounts) google.accounts.id.prompt();
  });
}

// Google's rendered button is itself a cross-origin iframe. When it fails
// silently (Safari ITP, cookie-partitioning browsers, some managed
// browsers), sometimes the iframe element is removed outright, but other
// times the iframe stays in the DOM while its internal content collapses
// to near-zero size — a plain childList observer misses that second case.
// Polling the actual rendered size catches both.
function watchShellSigninButton(elId){
  const el = document.getElementById(elId);
  if(!el) return;
  let checks = 0;
  const maxChecks = 10; // ~7 seconds of polling covers the delayed-failure case seen in testing
  const poll = setInterval(()=>{
    checks++;
    if(shellUser){ clearInterval(poll); return; } // signed in — button is hidden on purpose
    if(el.dataset.fallback === '1'){ clearInterval(poll); return; } // already on the fallback
    const rect = el.getBoundingClientRect();
    const collapsed = rect.width < 20 || rect.height < 10;
    if(collapsed){
      showShellSigninFallbackLink(elId);
      clearInterval(poll);
      return;
    }
    if(checks >= maxChecks) clearInterval(poll);
  }, 700);
}

// "Start for free" sign-in-or-skip modal. Pages ask the shell to open it
// via postMessage since they can't hold the real Google button themselves
// — see the origin note above.
function openStartModal(){
  document.getElementById('start-modal-overlay').classList.add('open');
  // Render the modal's Google button lazily, only once it's actually
  // visible — rendering into a display:none container at page load is
  // what was causing it to come out blank/broken, since Google's script
  // can't measure a hidden element's size.
  const modalBtnEl = document.getElementById('start-modal-google-btn');
  if(!modalBtnEl.dataset.rendered && typeof google !== 'undefined' && google.accounts){
    modalBtnEl.dataset.rendered = '1';
    google.accounts.id.renderButton(modalBtnEl, { theme:'outline', size:'large', shape:'pill', width:260 });
    watchShellSigninButton('start-modal-google-btn');
  }
}
function closeStartModal(){
  document.getElementById('start-modal-overlay').classList.remove('open');
}
document.getElementById('start-modal-close').addEventListener('click', closeStartModal);
document.getElementById('start-modal-overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'start-modal-overlay') closeStartModal(); // click on the scrim, not the card
});
document.getElementById('start-modal-skip').addEventListener('click', ()=>{
  closeStartModal();
  showWelcomeToast(()=> navTo('home'));
});

// A brief, soft "Welcome to Chalkline" moment before dropping into the
// app without signing in — its own full-screen deep-blue scene, with the
// message drawn in one letter at a time, then a hold, then a fade out —
// then runs the callback (navigating home) once it's fully gone.
function showWelcomeToast(onDone){
  const el = document.getElementById('welcome-toast');
  const textEl = document.getElementById('welcome-toast-text');
  const message = 'Welcome to Chalkline';
  textEl.innerHTML = '';
  const letterEls = [];
  for(const ch of message){
    const span = document.createElement('span');
    span.className = 'wt-letter';
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    textEl.appendChild(span);
    letterEls.push(span);
  }
  el.classList.remove('fade-out');
  el.classList.add('show');
  const letterDelayMs = 55; // gap between each letter drawing in
  letterEls.forEach((span, i)=>{
    setTimeout(()=> span.classList.add('in'), i * letterDelayMs);
  });
  const revealDurationMs = letterEls.length * letterDelayMs + 400; // + last letter's own transition
  const holdAfterRevealMs = 750;
  setTimeout(()=>{
    el.classList.add('fade-out');
    setTimeout(()=>{
      el.classList.remove('show');
      el.classList.remove('fade-out');
      if(onDone) onDone();
    }, 550); // matches the CSS fade-out transition duration
  }, revealDurationMs + holdAfterRevealMs);
}

function initShellGoogleSignIn(){
  if(typeof google === 'undefined' || !google.accounts){ setTimeout(initShellGoogleSignIn, 300); return; }
  // auto_select lets Google silently re-confirm a returning visitor who
  // still has an active Google session, refreshing the identity in the
  // background even if our own localStorage cache was ever cleared.
  // itp_support helps Safari's Intelligent Tracking Prevention (and
  // similar cookie-partitioning browsers) keep the button working
  // instead of it rendering once and then quietly disappearing.
  google.accounts.id.initialize({ client_id: SHELL_GOOGLE_CLIENT_ID, callback: handleShellCredential, auto_select: true, itp_support: true });
  google.accounts.id.renderButton(document.getElementById('shell-signin-btn'), { theme:'outline', size:'medium', shape:'pill' });
  watchShellSigninButton('shell-signin-btn');
  // The modal's button is NOT rendered here — see openStartModal() — since
  // this container is still display:none at this point in the page load.
  // A silent attempt is worthwhile with no cached sign-in, or when the worker session is missing/nearly expired.
  if(!shellUser || !workerSessionAlive(readWorkerSession())) google.accounts.id.prompt();
}
initShellGoogleSignIn();

document.getElementById('shell-sign-out').addEventListener('click', ()=>{ toggleShellAccountMenu(false); openSignOutConfirm(); });

function signOutShell(){
  shellUser = null;
  cloudLoadedFor = null;
  localStorage.removeItem(SHELL_AUTH_STORAGE_KEY);
  localStorage.removeItem(SESSION_STORAGE_KEY);
  clearTimeout(syncTimer);
  if(supabaseClient) supabaseClient.auth.signOut().catch(()=>{});
  if(typeof google !== 'undefined' && google.accounts) google.accounts.id.disableAutoSelect();
  toggleShellAccountMenu(false);
  document.getElementById('shell-account-chip').style.display = 'none';
  const signinEl = document.getElementById('shell-signin-btn');
  signinEl.style.display = 'block';
  // Give the real Google button another chance on sign-out rather than
  // staying stuck on the fallback link from a previous session.
  signinEl.dataset.fallback = '';
  signinEl.innerHTML = '';
  const modalBtnEl = document.getElementById('start-modal-google-btn');
  modalBtnEl.dataset.fallback = '';
  modalBtnEl.dataset.rendered = '';
  modalBtnEl.innerHTML = '';
  if(typeof google !== 'undefined' && google.accounts){
    google.accounts.id.renderButton(signinEl, { theme:'outline', size:'medium', shape:'pill' });
    watchShellSigninButton('shell-signin-btn');
    // Modal button re-renders lazily next time openStartModal() runs,
    // same reasoning as above — don't render it while still hidden.
  }
  broadcastAuthState();
}

// ---- Settings popup -------------------------------------------------
// Counts courses the same way the Dashboard does: the saved course list
// plus any subject a lesson, summary, quiz or note is filed under. The
// catch-all "Unsorted" bucket isn't a real course, so it isn't counted.
function countShellCourses(sub){
  const names = new Set();
  const NS = 'chalkline:';
  try{
    const raw = localStorage.getItem(NS + 'courses:' + sub);
    if(raw) (JSON.parse(raw) || []).forEach(n => names.add(n));
  } catch(e){}
  for(const kind of ['session','summary','quiz','notes']){
    const prefix = NS + kind + ':' + sub + ':';
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(prefix)){
        try{ const item = JSON.parse(localStorage.getItem(k)); names.add((item && item.subject) || 'Unsorted'); }
        catch(e){ /* skip corrupt entry */ }
      }
    }
  }
  names.delete('Unsorted');
  return names.size;
}

function renderSettingsModal(){
  const body = document.getElementById('settings-modal-body');
  body.textContent = '';
  if(!shellUser){
    const wrap = document.createElement('div');
    wrap.className = 'st-signin';
    const p = document.createElement('p');
    p.textContent = 'Sign in with Google to see your profile and courses here.';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'Sign in with Google';
    btn.addEventListener('click', ()=>{ closeSettingsModal(); openStartModal(); });
    wrap.appendChild(p);
    wrap.appendChild(btn);
    body.appendChild(wrap);
    return;
  }
  const fullName = shellUser.name || shellUser.email || 'Signed in';
  const top = document.createElement('div');
  top.className = 'st-top';
  let avatar;
  if(shellUser.picture){
    avatar = document.createElement('img');
    avatar.alt = '';
    avatar.referrerPolicy = 'no-referrer';
    avatar.src = shellUser.picture;
    avatar.addEventListener('error', ()=>{
      const fb = document.createElement('div');
      fb.className = 'st-avatar';
      fb.textContent = fullName.trim()[0].toUpperCase();
      avatar.replaceWith(fb);
    });
  } else {
    avatar = document.createElement('div');
    avatar.textContent = fullName.trim()[0].toUpperCase();
  }
  avatar.classList.add('st-avatar');
  const id = document.createElement('div');
  id.className = 'st-id';
  const nameEl = document.createElement('div');
  nameEl.className = 'st-name';
  nameEl.textContent = fullName;
  id.appendChild(nameEl);
  if(shellUser.email && shellUser.email !== fullName){
    const emailEl = document.createElement('div');
    emailEl.className = 'st-email';
    emailEl.textContent = shellUser.email;
    id.appendChild(emailEl);
  }
  top.appendChild(avatar);
  top.appendChild(id);

  const row = document.createElement('div');
  row.className = 'st-row';
  const k = document.createElement('div');
  k.className = 'k';
  k.textContent = 'Courses';
  const v = document.createElement('div');
  v.className = 'v';
  v.textContent = String(countShellCourses(shellUser.sub));
  row.appendChild(k);
  row.appendChild(v);

  body.appendChild(top);
  body.appendChild(row);
}
function openSettingsModal(){
  renderSettingsModal();
  document.getElementById('settings-modal-overlay').classList.add('open');
  // Pull keyboard focus out of the page iframe so Escape reaches this popup.
  document.getElementById('settings-modal-close').focus();
}
function closeSettingsModal(){
  document.getElementById('settings-modal-overlay').classList.remove('open');
}
document.getElementById('settings-modal-close').addEventListener('click', closeSettingsModal);
document.getElementById('settings-modal-overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'settings-modal-overlay') closeSettingsModal(); // tap on the dimmed backdrop
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeSettingsModal();
});

// Every sign-out request (sidebar account button, tutor page, etc.)
// lands here first and only proceeds once the person confirms.
function openSignOutConfirm(){
  if(!shellUser) return; // nothing to sign out of
  document.getElementById('signout-modal-overlay').classList.add('open');
  document.getElementById('signout-cancel').focus(); // so Escape works even if focus was inside a page
}
function closeSignOutConfirm(){
  document.getElementById('signout-modal-overlay').classList.remove('open');
}
document.getElementById('signout-cancel').addEventListener('click', closeSignOutConfirm);
document.getElementById('signout-confirm').addEventListener('click', ()=>{
  closeSignOutConfirm();
  signOutShell();
});
document.getElementById('signout-modal-overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'signout-modal-overlay') closeSignOutConfirm(); // tap on the dimmed backdrop
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeSignOutConfirm();
});

// Pages inside the iframes can't run Google's script themselves (see
// note above), so they ask the shell to act on their behalf.
window.addEventListener('message', (e)=>{
  const d = e.data;
  if(!d) return;
  if(d.showStartModal){ openStartModal(); }
  if(d.requestLogin && typeof google !== 'undefined' && google.accounts){
    google.accounts.id.prompt();
  }
  if(d.requestSignOut){
    openSignOutConfirm();
  }
  if(d.openSettings){ openSettingsModal(); }
});

</script>



<script type="text/plain" id="src-home"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Chalkline — AI Study Tools</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@600;700&display=swap');

:root{
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --board-bg:#FDFBF6;
  --paper:#FFFFFF;
  --ink:#2A2410;
  --ochre:#2E7DBE;
  --gold:#F0B94D;
  --gold-deep:#C98A2B;
  --highlight:#F5E6B8;
  --sage:#3E8FA6;
  --brick:#3D6B93;
  --danger:#C0392B;  /* destructive actions (delete) — kept separate from the palette */
  --panel-border:#ECE3C8;
  --muted:#8A8267;
  --halo-blue:#F6E2A0;
  --halo-blue-soft:#FCF3D9;
  --emerald:#2FA88A;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Source Serif 4', Georgia, serif;
  color:var(--ink);
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(240,185,77,0.22), transparent 60%),
    radial-gradient(ellipse 900px 600px at 100% 0%, rgba(46,125,190,0.10), transparent 60%),
    linear-gradient(165deg, #FFFDF6 0%, #FFF7E0 55%, #FBEFD0 130%);
  min-height:100vh;
  min-height:100dvh;
  position:relative;
  overflow-x:hidden;
}

.ambient-halo{
  position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
}
.ambient-halo::before,.ambient-halo::after{
  content:''; position:absolute; width:60vmax;height:60vmax;
  border-radius:50%; filter:blur(110px); opacity:0.32; mix-blend-mode:multiply;
}
.ambient-halo::before{
  top:-22%; left:-18%;
  background:radial-gradient(circle, var(--halo-blue) 0%, rgba(246,226,160,0) 70%);
  animation:drift1 24s ease-in-out infinite;
}
.ambient-halo::after{
  bottom:-25%; right:-15%;
  background:radial-gradient(circle, var(--halo-blue-soft) 0%, rgba(252,243,217,0) 70%);
  animation:drift2 28s ease-in-out infinite;
}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(10%,8%) scale(1.15);}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-8%,-6%) scale(1.12);}}

@keyframes fadeUp{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:translateY(0); } }
.fade-up{ opacity:0; animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) forwards; }

.app-shell{ position:relative; z-index:1; display:flex; min-height:100vh; min-height:100dvh; perspective:1800px; }

/* ---------- SIDEBAR (open by default, toggleable, with a physical
   "panel" feel: layered elevation shadow + a darker spine along the
   right edge + a slight 3D swing as it opens/closes) ---------- */
.sidebar{
  width:252px; flex-shrink:0;
  height:100vh; height:100dvh; position:fixed; left:0; top:0; z-index:45;
  display:flex; flex-direction:column;
  padding:calc(22px + var(--safe-top)) 16px 18px calc(16px + var(--safe-left));
  background:linear-gradient(165deg, #FFFFFF 0%, #FFF7E0 55%, #F5E6B8 130%);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  border-right:1px solid rgba(0,0,0,0.06);
  box-shadow:
    3px 0 1px rgba(255,255,255,0.6) inset,
    10px 0 24px -8px rgba(120,90,20,0.14),
    26px 0 46px -20px rgba(120,90,20,0.10);
  transform-origin:left center;
  transform:translateX(0) rotateY(0deg);
  transition:transform .38s cubic-bezier(.22,.9,.32,1.1), box-shadow .38s ease;
}
/* the "spine" — a thin gradient strip that reads as the panel's edge/thickness */
.sidebar::after{
  content:''; position:absolute; top:0; right:-5px; bottom:0; width:5px;
  background:linear-gradient(90deg, rgba(120,90,20,0.16), rgba(120,90,20,0));
  pointer-events:none;
}
.app-shell.sidebar-closed .sidebar{
  transform:translateX(-104%) rotateY(-18deg);
  box-shadow:none;
}
.app-shell.sidebar-closed .sidebar::after{ opacity:0; }

.sidebar-brand{
  font-family:'Caveat', cursive; font-weight:700; font-size:26px;
  color:var(--ink); text-decoration:none; display:flex; align-items:center; gap:8px;
  padding:2px 6px 16px;
}
.sidebar-brand .dot{
  width:9px;height:9px;border-radius:50%;
  background:linear-gradient(135deg, var(--gold), var(--ochre));
  display:inline-block; box-shadow:0 0 0 4px rgba(240,185,77,0.30);
}
.sidebar-account{
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:12px; cursor:pointer;
  background:rgba(0,0,0,0.045); border:1px solid rgba(0,0,0,0.08);
  margin-bottom:18px; transition:background .15s ease;
}
.sidebar-account:hover{ background:rgba(0,0,0,0.075); }
.sidebar-account .avatar{
  width:30px; height:30px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg, var(--ochre), var(--gold));
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:13px; font-weight:600; font-family:'Source Serif 4', serif;
}
.sidebar-account .acc-name{ font-size:13px; font-weight:600; color:var(--ink); line-height:1.2; }
.sidebar-account .acc-sub{ font-size:10.5px; color:rgba(42,36,16,0.55); font-family:'JetBrains Mono', monospace; }

.sidebar-nav{ display:flex; flex-direction:column; gap:2px; }
.sidebar-nav a{
  display:flex; align-items:center; gap:11px;
  color:rgba(42,36,16,0.78); text-decoration:none; padding:10px 12px; border-radius:10px;
  font-family:'JetBrains Mono', monospace; font-size:12.5px;
  transition:background .15s ease, color .15s ease;
}
.sidebar-nav a .ic{ font-size:15px; width:18px; text-align:center; flex-shrink:0; }
.sidebar-nav a:hover{ background:rgba(0,0,0,0.05); color:var(--ink); }
.sidebar-nav a.active{ background:rgba(240,185,77,0.24); color:var(--gold-deep); font-weight:600; }

.sidebar-divider{ height:1px; background:rgba(0,0,0,0.08); margin:16px 6px; flex-shrink:0; }

.sidebar-recent{ flex:1; min-height:0; overflow-y:auto; padding:0 2px; }
.sidebar-recent h4{
  font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.06em;
  color:rgba(42,36,16,0.5); margin:0 0 10px; padding:0 10px; font-weight:600;
}
.sidebar-recent .rw-empty{
  font-size:12px; color:rgba(42,36,16,0.5); padding:0 10px; line-height:1.5;
}
.sidebar-recent a{
  display:flex; align-items:center; gap:9px; text-decoration:none; color:rgba(42,36,16,0.78);
  padding:8px 10px; border-radius:9px; font-size:12.5px;
  transition:background .15s ease;
}
.sidebar-recent a:hover{ background:rgba(0,0,0,0.05); color:var(--ink); }
.sidebar-recent a .ic{ font-size:13px; flex-shrink:0; }
.sidebar-recent a .rw-title{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.sidebar-footer{ flex-shrink:0; padding-top:12px; margin-top:12px; border-top:1px solid rgba(0,0,0,0.08); }
.sidebar-footer a{
  display:flex; align-items:center; gap:11px; text-decoration:none; color:rgba(42,36,16,0.55);
  font-family:'JetBrains Mono', monospace; font-size:12.5px; padding:9px 12px; border-radius:10px;
  transition:background .15s ease, color .15s ease;
}
.sidebar-footer a:hover{ background:rgba(0,0,0,0.05); color:var(--ink); }

/* Toggle button: always visible, docked to the sidebar's edge like a
   handle, and slides with it. It flips its chevron and gives a little
   squash on click so it feels pressable rather than just decorative. */
.sidebar-toggle{
  position:fixed; top:26px; left:196px; z-index:50;
  height:34px; padding:0 16px 0 14px; border-radius:999px; border:none; cursor:pointer;
  background:rgba(255,255,255,0.95);
  box-shadow:0 3px 10px rgba(120,90,20,0.18), 0 0 0 1px rgba(120,90,20,0.08);
  font-size:12px; font-family:'JetBrains Mono', monospace; font-weight:600;
  display:flex; align-items:center; gap:7px; justify-content:center;
  color:var(--ink); white-space:nowrap;
  transition:left .38s cubic-bezier(.22,.9,.32,1.1), transform .15s ease, box-shadow .15s ease;
}
.sidebar-toggle:hover{ box-shadow:0 5px 16px rgba(120,90,20,0.24), 0 0 0 1px rgba(120,90,20,0.1); }
.sidebar-toggle:active{ transform:scale(0.94); }
.sidebar-toggle .arrow{ display:inline-block; font-size:13px; transition:transform .38s cubic-bezier(.22,.9,.32,1.1); }
.app-shell.sidebar-closed .sidebar-toggle{ left:16px; }

@media (max-width:700px){
  .sidebar-toggle{ left:calc(16px + var(--safe-left)); top:calc(16px + var(--safe-top)); }
  .app-shell.sidebar-closed .sidebar-toggle{ left:calc(16px + var(--safe-left)); }
}

.sidebar-scrim{
  display:none; position:fixed; inset:0; background:rgba(42,36,16,0.22); z-index:39;
  opacity:0; transition:opacity .3s ease;
}
/* The scrim only exists on narrow screens (see the max-width:700px block
   below), where the sidebar floats over the content. On desktop/tablet the
   sidebar docks and pushes the content over, so there is nothing to dim —
   and a full-viewport invisible layer here used to swallow the first click
   on every card/button while the sidebar was open. */

/* Desktop/tablet: the sidebar docks and pushes the content over. */
.main-area{ transition:margin-left .38s cubic-bezier(.22,.9,.32,1.1); margin-left:252px; }
.app-shell.sidebar-closed .main-area{ margin-left:0; }

@media (max-width:700px){
  /* Narrow screens: the sidebar floats over the content instead of
     pushing it (there's no room to spare), so content never reflows
     here — only the scrim (and the sidebar itself) toggles. */
  .main-area{ margin-left:0 !important; padding-top:calc(66px + var(--safe-top)); padding-left:calc(16px + var(--safe-left)); padding-right:calc(16px + var(--safe-right)); }
  .app-shell:not(.sidebar-closed) .sidebar-scrim{ display:block; opacity:1; }
  .app-shell.sidebar-closed .sidebar-scrim{ display:none; }
}

/* ---------- 3D LESSON BUTTONS ---------- */
.dash-grid{

  perspective:1400px;
}
@media (max-width:680px){ .dash-grid{ grid-template-columns:1fr; } }

.dash-card{
  --card-a:var(--ochre); --card-b:var(--gold-deep);
  display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-end; text-align:left;
  gap:6px; text-decoration:none; color:inherit; cursor:pointer;
  min-height:168px; border-radius:22px;
  background:linear-gradient(160deg, #FFFFFF 0%, #FFF7E0 100%);
  border:1px solid rgba(0,0,0,0.05);
  padding:22px 24px 20px; position:relative; overflow:hidden;
  transform-style:preserve-3d; transform:translateY(0) translateZ(0) rotateX(0deg);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.7) inset,
    0 -18px 30px -18px rgba(120,90,20,0.08) inset,
    0 14px 0 -6px rgba(120,90,20,0.10),
    0 22px 34px -14px rgba(120,90,20,0.16);
  transition:transform .22s cubic-bezier(.2,.8,.3,1.1), box-shadow .22s ease;
}
/* glowing gradient rim, only revealed as a thin ring around the card */
.dash-card::before{
  content:''; position:absolute; inset:0; border-radius:22px; padding:1.5px;
  background:linear-gradient(135deg, var(--card-a), var(--card-b) 60%, transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  opacity:0.55; transition:opacity .2s ease;
}
/* soft color bloom in the corner, like light catching foil */
.dash-card::after{
  content:''; position:absolute; top:-40%; right:-20%; width:70%; height:140%;
  background:radial-gradient(circle, var(--card-b) 0%, transparent 70%);
  opacity:0.16; filter:blur(6px); pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
}
.dash-card.summary{ --card-a:var(--sage); --card-b:var(--emerald); }
.dash-card:hover{

    0 1px 0 rgba(255,255,255,0.8) inset,
    0 -18px 30px -18px rgba(120,90,20,0.08) inset,
    0 10px 0 -6px rgba(120,90,20,0.10),
    0 30px 46px -16px rgba(120,90,20,0.22);
}
.dash-card:hover::before{ opacity:0.9; }
.dash-card:hover::after{ opacity:0.26; transform:scale(1.1); }
.dash-card:active{
  transform:translateY(-1px) translateZ(4px) rotateX(1deg);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.7) inset,
    0 -14px 24px -16px rgba(120,90,20,0.08) inset,
    0 3px 0 -2px rgba(120,90,20,0.10),
    0 8px 16px -8px rgba(120,90,20,0.18);
}
.dash-card .icon-badge{

  box-shadow:0 6px 14px -6px rgba(120,90,20,0.30), 0 1px 0 rgba(255,255,255,0.35) inset;

}

.dash-card h2{

/* ---------- Add-course modal (same visual language as the tutor

.subject-modal{

/* Pill rides the sidebar edge: when the sidebar closes it returns to the corner.
   (The pill sits outside .app-shell, so the rule above could never match it.) */
body.sb-closed .sidebar-toggle{ left:16px; }
@media (max-width:700px){ body.sb-closed .sidebar-toggle{ left:calc(16px + var(--safe-left)); } }

/* ---- Independent scrolling ----------------------------------------
   The page itself never scrolls any more: the shell is exactly one
   screen tall and only .main-area scrolls inside it. That way the
   sidebar (and the Menu pill) stay exactly where they are no matter
   how far down the content goes. */
html,body{ height:100%; overflow:hidden; }
.app-shell{ height:100vh; height:100dvh; min-height:0; overflow:hidden; }
.main-area{
  height:100vh; height:100dvh;
  overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}

/* ---- 3D sidebar ---------------------------------------------------
   The sidebar is a slab standing in space: turned slightly toward the
   content, with a thick lit edge, a long cast shadow, and raised
   buttons that lift on hover and press in when tapped. */
.app-shell{ perspective:none; }
.sidebar{
  transform:perspective(1500px) translateX(0) rotateY(3deg);
  transform-origin:left center;
  background:linear-gradient(100deg, #FFFFFF 0%, #FFF9E8 42%, #F3E2B0 135%);
  border-right:1px solid rgba(120,90,20,0.20);
  box-shadow:
    inset 2px 0 0 rgba(255,255,255,0.95),
    inset 0 2px 0 rgba(255,255,255,0.9),
    inset -1px 0 0 rgba(120,90,20,0.14),
    12px 0 22px -8px rgba(90,65,10,0.30),
    34px 0 58px -20px rgba(90,65,10,0.26);
}
.sidebar::after{
  content:''; position:absolute; top:0; right:-10px; bottom:0; width:10px;
  background:linear-gradient(90deg, #CDB57A 0%, #E6D5A2 45%, rgba(230,213,162,0) 100%);
  pointer-events:none;
}
.app-shell.sidebar-closed .sidebar{
  transform:perspective(1500px) translateX(-100%) rotateY(-10deg);
  box-shadow:none;
}
.app-shell.sidebar-closed .sidebar::after{ opacity:0; }

.sidebar-account,
.sidebar-nav a,
.sidebar-footer a{
  transition:transform .16s cubic-bezier(.2,.8,.3,1.1), box-shadow .16s ease, background .16s ease, color .15s ease;
}
.sidebar-account{
  background:linear-gradient(180deg, #FFFFFF, #F8EFD4);
  border:1px solid rgba(120,90,20,0.14);
  box-shadow:0 1px 0 #fff inset, 0 3px 0 rgba(160,120,40,0.20), 0 10px 14px -8px rgba(120,90,20,0.40);
}
.sidebar-account:hover{ background:linear-gradient(180deg, #FFFFFF, #F8EFD4); transform:translateY(-2px);
  box-shadow:0 1px 0 #fff inset, 0 5px 0 rgba(160,120,40,0.20), 0 14px 18px -8px rgba(120,90,20,0.45); }
.sidebar-account:active{ transform:translateY(2px); box-shadow:0 1px 3px rgba(120,90,20,0.30) inset; }

.sidebar-nav{ gap:7px; }
.sidebar-nav a{
  background:linear-gradient(180deg, #FFFFFF, #FBF2D8);
  box-shadow:0 1px 0 #fff inset, 0 3px 0 rgba(160,120,40,0.20), 0 8px 12px -8px rgba(120,90,20,0.40);
}
.sidebar-nav a:hover{
  background:linear-gradient(180deg, #FFFFFF, #FBF2D8);
  transform:translateY(-2px);
  box-shadow:0 1px 0 #fff inset, 0 5px 0 rgba(160,120,40,0.20), 0 12px 16px -8px rgba(120,90,20,0.45);
}
.sidebar-nav a:active{ transform:translateY(2px); box-shadow:0 1px 3px rgba(120,90,20,0.30) inset; }
.sidebar-nav a.active{
  background:linear-gradient(180deg, #F3D07A, #F8E2A6);
  transform:translateY(2px);
  box-shadow:0 2px 5px rgba(150,105,25,0.35) inset, 0 1px 0 rgba(255,255,255,0.8);
}

.sidebar-footer a{
  background:linear-gradient(180deg, #FFFFFF, #FBF2D8);
  box-shadow:0 1px 0 #fff inset, 0 3px 0 rgba(160,120,40,0.18), 0 8px 12px -8px rgba(120,90,20,0.35);
}
.sidebar-footer a:hover{ transform:translateY(-2px); background:linear-gradient(180deg, #FFFFFF, #FBF2D8); }
.sidebar-footer a:active{ transform:translateY(2px); box-shadow:0 1px 3px rgba(120,90,20,0.30) inset; }
.sidebar-footer a.active{
  background:linear-gradient(180deg, #F3D07A, #F8E2A6);
  transform:translateY(2px);
  box-shadow:0 2px 5px rgba(150,105,25,0.35) inset, 0 1px 0 rgba(255,255,255,0.8);
}
.sidebar-recent a:hover{ transform:translateX(3px); }
.sidebar-recent a{ transition:transform .16s ease, background .15s ease; }

/* ---- Menu tab ------------------------------------------------------
   Icon only, hinged onto the sidebar's right edge. It lives inside the
   sidebar, so it moves, swings and slides with it (and stays visible at
   the screen edge when the sidebar is closed). */
.app-shell .sidebar .sidebar-toggle{
  position:absolute !important; left:auto !important; right:-28px !important;
  top:calc(20px + var(--safe-top)) !important;
  z-index:2; width:28px; height:46px; padding:0; gap:0;
  border:none; border-radius:0 14px 14px 0;
  background:linear-gradient(100deg, #F3E2B0 0%, #FFFFFF 75%);
  box-shadow:0 1px 0 #fff inset, 3px 0 0 rgba(160,120,40,0.22), 8px 6px 14px -6px rgba(90,65,10,0.40);
  color:var(--ink); font-size:15px;
  display:flex; align-items:center; justify-content:center;
  transition:transform .16s cubic-bezier(.2,.8,.3,1.1), box-shadow .16s ease;
}
.app-shell .sidebar .sidebar-toggle .arrow{ font-size:15px; }
.app-shell .sidebar .sidebar-toggle:hover{ transform:translateX(3px); box-shadow:0 1px 0 #fff inset, 3px 0 0 rgba(160,120,40,0.22), 12px 8px 16px -6px rgba(90,65,10,0.45); }
.app-shell .sidebar .sidebar-toggle:active{ transform:translateX(1px) scale(0.96); }
</style>

<circle cx="140" cy="291" r="14" fill="#F0B94D" opacity="0.15"/><circle cx="140" cy="291" r="10" fill="#F0B94D" opacity="0.3"/><circle cx="140" cy="291" r="6" fill="#F0B94D" stroke="#C98A2B" stroke-width="1.5"/><g transform="translate(246,290) rotate(40)"><rect x="-5" y="-46" width="10" height="42" rx="2" fill="#FFFFFF" stroke="#2A2410" stroke-width="1.5"/><rect x="-5" y="-34" width="10" height="7" fill="#F0B94D" stroke="#2A2410" stroke-width="1"/><path d="M-5 -4L-2.5 2H2.5L5 -4Z" fill="#2E7DBE" stroke="#2A2410" stroke-width="1.2" stroke-linejoin="round"/></g><polygon points="40,334 72,334 72,378 40,378 54,356" fill="#C98A2B" stroke="#2A2410" stroke-width="2" stroke-linejoin="round"/><polygon points="340,334 308,334 308,378 340,378 326,356" fill="#C98A2B" stroke="#2A2410" stroke-width="2" stroke-linejoin="round"/><polygon points="72,366 84,366 72,378" fill="#8F5F17"/><polygon points="308,366 296,366 308,378" fill="#8F5F17"/><rect x="70" y="322" width="240" height="44" fill="#F0B94D" stroke="#2A2410" stroke-width="2" stroke-linejoin="round"/><rect x="77" y="328" width="226" height="32" fill="none" stroke="#C98A2B" stroke-width="1" stroke-dasharray="3 3"/><text x="190" y="354" text-anchor="middle" style="font-family:'Caveat',cursive;font-weight:700;font-size:34px;fill:#2A2410">Chalkline</text></svg></div>
